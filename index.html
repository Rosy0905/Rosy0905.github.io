{"word":"extreme","pos":"a.末端的,尽头的;极度的","detail":"构词: 构词: ex-(向外、超过) + trem + e(连接元音)<br>释义: n.极端;最大程度","example":"推导: 核心词根「trem-」表示“颤抖,震动”，结合前后缀，可推出“a.末端的,尽头的;极度的 n.极端;最大程度”"}],"extra":["tremor n. 震颤;颤动（构词: trem + or(名词后缀)）","tremulous a. 颤抖的（构词: trem + ulous）","trembling n./a. 颤抖(的)（构词: tremble + ing）","tremolo n. 颤音（构词: trem + olo）","tremendously ad. 极其地（构词: tremendous + ly）","trembler n. 颤抖者（构词: tremble + er）","untrembling a. 不颤抖的（构词: un + trembling）","intremulous a. 不颤抖的（构词: in + tremulous）","earthquake n. 地震（构词: earth + quake(震动)）","tremolite n. 透闪石（构词: tremol + ite）"]},{"id":66,"root":"vice","pronounce":"/vaɪs/五爱斯","source":"拉丁语 vitium","meaning":"缺陷,恶习,罪恶","mnemonic":"vice 就是“歪事”，歪事就是不正当、不道德的事情，因此 vice 就是“恶行、邪恶、恶习”的意思。","mainWords":[{"word":"vice","pos":"n.","detail":"构词: 构词: vice(缺陷)<br>释义: 恶习;堕落;缺陷","example":"例句: Gambling is his main vice. ｜ 推导: 缺陷 = 道德缺陷,恶习"},{"word":"vicious","pos":"a.","detail":"构词: 构词: vice + ious(形容词后缀)<br>释义: 恶毒的;凶猛的","example":"例句: A vicious attack shocked everyone. ｜ 推导: 恶习 + 形容词化 = 充满恶意的"}],"extra":["viciously ad. 恶毒地（构词: vicious + ly）","viciousness n. 恶毒（构词: vicious + ness）","vitiate v. 损害;使无效（构词: viti(缺陷) + ate）","vitiation n. 损害;腐败（构词: viti + ation）","vicious circle 恶性循环"]},{"id":67,"root":"alter-/altern-","pronounce":"/ˈɔːltər/奥勒特儿","source":"拉丁语 alter","meaning":"其他的,另一个","mnemonic":"1.alter/ altern 就是 all other，就是“其余的、另外的”，因此alter/ altern 就是“其余的、另外的”的意思。2.方法一：接1，我们选择其余的行为，就是“改变”，来回选其余的就是“交替”，所以alter/ altern 就是“交替、改变”的意思。\n方法二：alter/ altern 就是奥特，我们能联想到奥特曼，奥特曼的典型特征就是从人改变，交替变化来的，没能量了还要变回人，所以alter/ altern 就是“交替、改变”的意思。","mainWords":[{"word":"alter","pos":"v.","detail":"构词: 构词: alter(其他的)<br>释义: 改变,变更","example":"例句: We need to alter our plans. ｜ 推导: 其他的 = 使成为另一个,改变"},{"word":"alternative","pos":"n.","detail":"构词: 构词: alter(其他) + native(本质的)<br>释义: 替代物 a.可选择的","example":"例句: We have no alternative but to wait. ｜ 推导: 其他的 + 本质 = 另一种选择,替代物"},{"word":"alternate","pos":"v.","detail":"构词: 构词: altern(其他) + ate(动词后缀)<br>释义: 交替 a.轮流的","example":"例句: Day and night alternate. ｜ 推导: 其他的 + 动词化 = 轮流变成另一个,交替"}],"extra":["alteration n. 改变,变更（构词: alter + ation）","alternately ad. 交替地（构词: altern + ately）","unalterable a. 不可改变的（构词: un + alter + able）","alternation n. 交替,轮流（构词: altern + ation）"]},{"id":68,"root":"common","pronounce":"/ˈkɒmən/克奥姆恩","source":"","meaning":"共同的,公共的","mnemonic":"1.common就是“共门”，共门就是所有人共同都要从其中走出的一扇门，并共同使用门后的空间，因此common就是“共同的、公共的”的意思。\n2.接1，共同的、公共的东西也就是许多人都有的东西，那这个东西一定很常见，因此commom就是“常见、普通”的意思。","mainWords":[{"word":"common","pos":"a.","detail":"构词: 构词: common(共同的)<br>释义: 共同的;普通的","example":"例句: It's a common mistake. ｜ 推导: 共同的 = 大家都有的,普通的"},{"word":"commonwealth","pos":"n.","detail":"构词: 构词: common + wealth(财富)<br>释义: 联邦;共同体","example":"例句: The British Commonwealth ｜ 推导: 共同的 + 财富 = 共同财富体,联邦"},{"word":"commonplace","pos":"a.","detail":"构词: 构词: common + place(地方)<br>释义: 平凡的;普通的","example":"例句: Such accidents are commonplace. ｜ 推导: 共同的 + 地方 = 随处可见的,平凡的"}],"extra":["commonly ad. 通常地（构词: common + ly）","commoner n. 平民（构词: common + er）","uncommon a. 罕见的（构词: un + common）","commons n. 平民;公地（构词: common + s）"]},{"id":69,"root":"domin-","pronounce":"/ˈdɒmɪn/德奥米恩","source":"拉丁语 dominus","meaning":"主人,统治","mnemonic":"domin就是大明，通常指的是古人对中国古代明王朝的称呼，明王朝作为一个大一统王朝自然是普天之下莫非王土，对疆域的统治和支配能力很强，因此domin就是“统治、支配、主宰”的意思。","mainWords":[{"word":"dominate","pos":"v.","detail":"构词: 构词: domin(统治) + ate(动词后缀)<br>释义: 支配;统治","example":"例句: They dominate the market. ｜ 推导: 统治 + 动词化 = 支配,统治"},{"word":"dominant","pos":"a.","detail":"构词: 构词: domin(统治) + ant(形容词后缀)<br>释义: 占优势的;主导的","example":"例句: The dominant culture prevails. ｜ 推导: 统治 + 形容词化 = 占主导地位的"},{"word":"predominant","pos":"a.","detail":"构词: 构词: pre(预先) + domin + ant<br>释义: 占主导的","example":"例句: Red is the predominant color. ｜ 推导: 预先 + 统治的 = 占主导地位的"}],"extra":["dominance n. 优势;支配地位（构词: domin + ance）","domination n. 统治;支配（构词: domin + ation）","dominion n. 统治权;领土（构词: domin + ion）","domain n. 领域;领地（构词: dom + ain）"]},{"id":70,"root":"equ-/equa-","pronounce":"/ˈiːkwə/衣克乌额","source":"拉丁语 aequus","meaning":"平等的,相等的","mnemonic":"equ/ equa就是“一块儿”或“一曲”。无论是一块还是一曲，我们在描述两个事物的关系的时候通常会说他们是一块儿的，中国古人也有曲高和寡，知音的说法来描述一个人的思想和用音乐和曲相同（即知音）来两个人的关系，总之这些都是描述双方相近，平等的关系，因此equ/ equa就是“相等、平等”的意思。","mainWords":[{"word":"equal","pos":"a.","detail":"构词: 构词: equ(平等) + al(形容词后缀)<br>释义: 平等的;相等的","example":"例句: All men are created equal. ｜ 推导: 平等 + 形容词化 = 平等的,相等的"},{"word":"equality","pos":"n.","detail":"构词: 构词: equ + al + ity(名词后缀)<br>释义: 平等;相等","example":"例句: Gender equality is important. ｜ 推导: 平等 + 状态 = 平等(的状态)"},{"word":"equation","pos":"n.","detail":"构词: 构词: equa(使相等) + tion(名词后缀)<br>释义: 方程式;等式","example":"例句: Solve this equation. ｜ 推导: 使相等 + 名词化 = 等式,方程式"},{"word":"equator","pos":"n.","detail":"构词: 构词: equa(平分) + tor(表示物)<br>释义: 赤道","example":"例句: Countries near the equator are hot. ｜ 推导: 平分 + 物 = 平分地球的线,赤道"},{"word":"equivalent","pos":"a.","detail":"构词: 构词: equ + val(价值) + ent<br>释义: 等价的 n.等价物","example":"例句: Find an equivalent expression. ｜ 推导: 平等 + 价值 + 形容词化 = 等价的"},{"word":"adequate","pos":"a.","detail":"构词: 构词: ad(向) + equ(相等) + ate<br>释义: 充足的;适当的","example":"例句: We have adequate resources. ｜ 推导: 向 + 相等 + 形容词化 = 达到标准的,充足的"}],"extra":["equate v. 使相等;等同（构词: equ + ate）","equitable a. 公平的（构词: equ + it + able）","equity n. 公平;权益（构词: equ + ity）","equip v. 装备;配备（构词: equ + ip）","equilibrium n. 平衡;均衡（构词: equ + libr(秤) + ium）","equinox n. 春分;秋分（构词: equ + nox(夜)）","inadequate a. 不充足的（构词: in + adequate）","unequal a. 不平等的（构词: un + equal）"]},{"id":71,"root":"fac/fact","pronounce":"/fæk/夫艾克","source":"","meaning":"做,制造","mnemonic":"方法一：fac就是小学学过的词factory的一部分，factory就是工厂，factory=fac+tory，ory是名词化后缀，t不用管，工厂就是做产品制造产品的地方，因此前面的fac表示动作就是“做、制造”的意思。\n方法二：fac就是fuck，fuck就是干，也就是美国国粹，放到中国干通常指的是“做、制造”的意思，所以fac就是“做、制造”的意思。","mainWords":[{"word":"fact","pos":"n.","detail":"构词: 构词: fact(做成的)<br>释义: 事实","example":"例句: It's a fact that he won. ｜ 推导: 做成的 = 已经发生的事,事实"},{"word":"factor","pos":"n.","detail":"构词: 构词: fact(做) + or(者)<br>释义: 因素","example":"例句: Time is an important factor. ｜ 推导: 做 + 者 = 起作用的东⻄,因素"},{"word":"factory","pos":"n.","detail":"构词: 构词: fact(制造) + ory(场所)<br>释义: 工厂","example":"例句: He works in a car factory. ｜ 推导: 制造 + 场所 = 制造东⻄的地方,工厂"},{"word":"manufacture","pos":"v.","detail":"构词: 构词: manu(手) + fact(做) + ure<br>释义: 制造","example":"例句: They manufacture computers. ｜ 推导: 手 + 做 + 动词化 = 用手制造"},{"word":"satisfaction","pos":"n.","detail":"构词: 构词: satis(足够) + fact(做) + ion<br>释义: 满意","example":"例句: Customer satisfaction is key. ｜ 推导: 足够 + 做 = 做得足够好,满意"},{"word":"satisfactory","pos":"a.","detail":"构词: 构词: satis + fact + ory(形容词)<br>释义: 令人满意的","example":"例句: The result is satisfactory. ｜ 推导: 满意 + 形容词化 = 令人满意的"},{"word":"facility","pos":"n.","detail":"构词: 构词: fac(做) + il(易) + ity<br>释义: 设施;便利","example":"例句: The sports facility is new. ｜ 推导: 做 + 容易 = 便于做事的设施"},{"word":"faculty","pos":"n.","detail":"构词: 构词: fac(做) + ulty(能力)<br>释义: 能力;学院","example":"例句: She has a faculty for music. ｜ 推导: 做 + 能力 = 做事的能力"},{"word":"facilitate","pos":"v.","detail":"构词: 构词: fac(做) + il(易) + itate(使)<br>释义: 促进;使便利","example":"例句: This will facilitate learning. ｜ 推导: 做 + 容易 + 使 = 使容易做,促进"}],"extra":[]},{"id":72,"root":"face","pronounce":"/feɪs/夫诶斯","source":"拉丁语 facies","meaning":"脸,表面","mnemonic":"face本身就是我们小学学过的face。 face 就是“脸、表面、面对”。 所以face就是“脸、表面”。","mainWords":[{"word":"face","pos":"n.","detail":"构词: 构词: face(脸,表面)<br>释义: 脸;表面 v.面对","example":"例句: Face your fears bravely. ｜ 推导: 脸,表面 = 面对,正视"},{"word":"surface","pos":"n.","detail":"构词: 构词: sur(上) + face(表面)<br>释义: 表面;外观","example":"例句: The surface is smooth. ｜ 推导: 上 + 表面 = 上面的表面,表面"},{"word":"interface","pos":"n.","detail":"构词: 构词: inter(之间) + face(表面)<br>释义: 界面;接口","example":"例句: User interface is important. ｜ 推导: 之间 + 表面 = 两者间的界面"},{"word":"preface","pos":"n.","detail":"构词: 构词: pre(前) + face(表面)<br>释义: 前言;序言","example":"例句: He wrote a preface to the book. ｜ 推导: 前 + 表面 = 书的前面,前言"}],"extra":["facial a. 面部的（构词: face + ial）","deface v. 损坏外观（构词: de(去除) + face）","efface v. 抹去;消除（构词: ef(出) + face）","facet n. 方面;小平面（构词: face + et）","facing n. 饰面;朝向（构词: face + ing）","facade n. 正面;外观（构词: face + ade）","two-faced a. 两面派的（构词: two + face + d）","resurface v. 重新露面（构词: re + surface）","boldface n. 黑体字（构词: bold + face）","typeface n. 字体（构词: type + face）"]},{"id":73,"root":"feat","pronounce":"/fiːt/夫衣特","source":"","meaning":"功绩,特征","mnemonic":"feat就是”斐特“，也就是斐然、特别，在中国我们通常说一个人斐然且特别，一般是成绩斐然的场景，因此feat就是“功绩”的意思。","mainWords":[{"word":"feat","pos":"n.","detail":"构词: 构词: feat(做成的事)<br>释义: 功绩;壮举","example":"例句: It was an amazing feat. ｜ 推导: 做成的事 = 了不起的成就,功绩"},{"word":"defeat","pos":"v.","detail":"构词: 构词: de(否定) + feat(功绩)<br>释义: 击败 n.失败","example":"例句: They suffered a defeat. ｜ 推导: 否定 + 功绩 = 失去功绩,击败"},{"word":"feature","pos":"n.","detail":"构词: 构词: feat(特征) + ure(名词后缀)<br>释义: 特征;特色","example":"例句: This is a key feature. ｜ 推导: 特征 + 名词化 = 显著的特征,特色"}],"extra":["defeatable a. 可击败的（构词: defeat + able）","featured a. 有特色的（构词: feature + ed）","undefeated a. 不败的（构词: un + defeat + ed）","featuring v. 以...为特色（构词: feature + ing）"]},{"id":74,"root":"fect","pronounce":"/fekt/夫诶克特","source":"","meaning":"做(完成式)","mnemonic":"fact就是小学学过的词factory的一部分，factory就是工厂，factory=fact+ory，ory是名词化后缀，工厂就是做产品制造产品的地方，同时fac加上t表示完成的意思，因此比fac词根还多一个做完的意思，因此fact就是“做、制造、做完了”的意思。","mainWords":[{"word":"effect","pos":"n.","detail":"构词: 构词: ef(出) + fect(做)<br>释义: 效果;影响","example":"例句: The effect was immediate. ｜ 推导: 出 + 做 = 做出来的结果,效果"},{"word":"affect","pos":"v.","detail":"构词: 构词: af(朝向) + fect(做)<br>释义: 影响;感动","example":"例句: The news affected everyone. ｜ 推导: 朝向 + 做 = 对...产生作用,影响"},{"word":"effective","pos":"a.","detail":"构词: 构词: effect + ive(形容词后缀)<br>释义: 有效的","example":"例句: This is an effective method. ｜ 推导: 效果 + 形容词化 = 产生效果的,有效的"},{"word":"perfect","pos":"a.","detail":"构词: 构词: per(完全) + fect(做)<br>释义: 完美的","example":"例句: Practice makes perfect. ｜ 推导: 完全 + 做 = 做到完全,完美的"},{"word":"perfection","pos":"n.","detail":"构词: 构词: perfect + ion(名词后缀)<br>释义: 完美","example":"例句: She strives for perfection. ｜ 推导: 完美的 + 名词化 = 完美状态,完美"},{"word":"defect","pos":"n.","detail":"构词: 构词: de(否定) + fect(做)<br>释义: 缺陷;缺点","example":"例句: The product has a defect. ｜ 推导: 否定 + 做 = 没做好,缺陷"},{"word":"infect","pos":"v.","detail":"构词: 构词: in(进入) + fect(做)<br>释义: 感染;传染","example":"例句: The virus can infect cells. ｜ 推导: 进入 + 做 = 做进去,感染"},{"word":"infectious","pos":"a.","detail":"构词: 构词: infect + ious(形容词后缀)<br>释义: 传染的","example":"例句: Her laughter is infectious. ｜ 推导: 感染 + 形容词化 = 有传染性的"},{"word":"affection","pos":"n.","detail":"构词: 构词: af + fect + ion<br>释义: 感情;喜爱","example":""}],"extra":[]},{"id":75,"root":"fic","pronounce":"/fɪk/夫衣克","source":"","meaning":"做、造成","mnemonic":"fic是我们小学学过的词office的一部分。 office 是人们做 work、履行职务的地方。每天进入 office，最关键的事情就是 do the work，把任务做出来、把作用发挥出来。 所以以后看到 office 中的 fic，就先想到“做、履行职务、产生作用”。 所以fic就是“做、造成”。","mainWords":[{"word":"office","pos":"n.","detail":"构词: 构词: of(工作) + fic(做) + e<br>释义: 办公室;职务","example":"例句: She works in an office. ｜ 推导: 工作 + 做 = 做工作的地方,办公室"},{"word":"official","pos":"a.","detail":"构词: 构词: offic(职务) + ial(形容词后缀)<br>释义: 官方的 n.官员","example":"例句: The official statement was clear. ｜ 推导: 职务 + 形容词化 = 有职务的,官方的"},{"word":"officer","pos":"n.","detail":"构词: 构词: offic(职务) + er(人)<br>释义: 官员;军官","example":"例句: The officer gave orders. ｜ 推导: 职务 + 人 = 有职务的人,官员"},{"word":"difficult","pos":"a.","detail":"构词: 构词: dif(不) + fic(做) + ult<br>释义: 困难的","example":"例句: This problem is difficult. ｜ 推导: 不 + 做 = 不好做的,困难的"},{"word":"traffic","pos":"n.","detail":"构词: 构词: tra(穿过) + ffic(做)<br>释义: 交通;运输","example":"例句: Traffic is heavy today. ｜ 推导: 穿过 + 做 = 穿过运行,交通"},{"word":"efficient","pos":"a.","detail":"构词: 构词: ef(出) + fic(做) + ient<br>释义: 高效的","example":"例句: She is very efficient. ｜ 推导: 出 + 做 = 做出成果的,高效的"},{"word":"sufficient","pos":"a.","detail":"构词: 构词: suf(在下) + fic(做) + ient<br>释义: 充足的","example":"例句: We have sufficient time. ｜ 推导: 在下 + 做 = 做够了的,充足的"},{"word":"specific","pos":"a.","detail":"构词: 构词: spec(看) + i + fic(做)<br>释义: 具体的;特定的","example":"例句: Be more specific please. ｜ 推导: 看 + 做 = 看得见做的,具体的"},{"word":"scientific","pos":"a.","detail":"构词: 构词: scient(知识) + i + fic(做)<br>释义: 科学的","example":""},{"word":"significant","pos":"a.","detail":"构词: 构词: sign(标记) + i + fic(做) + ant<br>释义: 重要的","example":""},{"word":"artificial","pos":"a.","detail":"构词: 构词: art(技艺) + i + fic(做) + ial<br>释义: 人工的;人造的","example":"例句: Artificial intelligence is growing. ｜ 推导: 技艺 + 做 = 用技艺做的,人工的"},{"word":"certificate","pos":"n.","detail":"构词: 构词: cert(确定) + i + fic(做) + ate<br>释义: 证书;证明","example":"例句: I got my certificate. ｜ 推导: 确定 + 做 = 做出确定的东⻄,证书"},{"word":"efficiency","pos":"n.","detail":"构词: 构词: ef + fic(做) + iency(名词后缀)<br>释义: 效率","example":"例句: Improve your efficiency. ｜ 推导: 出 + 做 + 名词化 = 做出成果的程度,效率"}],"extra":[]},{"id":76,"root":"","pronounce":"/ˈfɪʃənsi/夫衣诗额恩斯衣；/fɪˈkeɪʃən/夫衣克诶诗额恩","source":"拉丁语 facere“做、使成为”形成的 fic-/fac- 构词成分","meaning":"能力程度；……化、使成为","mnemonic":"方法一：\n-ficiency可以记成FICIENCY＝Finish It, Confirm It; Every Need Complete, Yes。\n\nF是Finish，表示完成；第一个I是It，表示这件事；C是Confirm，表示确认；第二个I还是It；E是Every，表示每一项；N是Need，表示要求；第二个C是Complete，表示全部完成；Y是Yes，表示最终通过。\n\n一件事不仅要finish it，还要confirm it，并且让every need都complete，最后得到yes。一个人能够把各项要求完成到什么程度，就会表现出相应的能力、熟练程度和效率。\n\n所以-ficiency就是“完成事情的能力、熟练程度和达到要求的程度”的意思。\n\n方法二：\n-fication可以记成FICATION＝Finish It, Change A Thing Into One Needed state。\n\nF是Finish，I是It，C是Change，A是A，T是Thing，第二个I是Into，O是One，N是Needed。整句话就是“把这件事完成：把一个东西改变成所需要的一种状态”。\n\n一个东西从原来的状态被做成另一种所需要的状态，就是“使成为、……化”；这个改变动作形成的过程或结果，也可以用-fication表示。\n\n所以-fication就是“使成为某种状态、……化；变化的过程或结果”的意思。\n\n综上，-ficiency/-fication就是“完成事情的能力或达到的程度；使成为某种状态、……化”的意思。","mainWords":[{"word":"efficiency","pos":"n.","detail":"构词: 构词: ef(出) + fic(做) + iency<br>释义: 效率","example":"例句: Improve work efficiency. ｜ 推导: 做出来的程度 = 效率"},{"word":"deficiency","pos":"n.","detail":"构词: 构词: de(否定) + fic + iency<br>释义: 缺乏;不足","example":"例句: Vitamin deficiency is harmful. ｜ 推导: 没做到的程度 = 缺乏"},{"word":"proficiency","pos":"n.","detail":"构词: 构词: pro(向前) + fic + iency<br>释义: 熟练;精通","example":"例句: Language proficiency is required. ｜ 推导: 向前做的程度 = 熟练程度"},{"word":"sufficiency","pos":"n.","detail":"构词: 构词: suf(在下) + fic + iency<br>释义: 充足","example":"例句: Check the sufficiency of funds. ｜ 推导: 在下面支撑的程度 = 充足"},{"word":"identification","pos":"n.","detail":"构词: 构词: ident(相同) + ification<br>释义: 识别;认同","example":"例句: Show your identification card. ｜ 推导: 使相同化 = 身份识别"},{"word":"classification","pos":"n.","detail":"构词: 构词: class(类) + ification<br>释义: 分类","example":"例句: The classification is clear. ｜ 推导: 使成类化 = 分类"},{"word":"qualification","pos":"n.","detail":"构词: 构词: qual(质量) + ification<br>释义: 资格;资质","example":"例句: Check his qualification. ｜ 推导: 使具有质量化 = 资格认证"},{"word":"specification","pos":"n.","detail":"构词: 构词: spec(看) + ification<br>释义: 规格;说明","example":"例句: Read the specification carefully. ｜ 推导: 使具体化可看 = 详细规格"}],"extra":[]},{"id":77,"root":"guide","pronounce":"/gaɪd/格爱德","source":"日耳曼语 知道","meaning":"引导,指导","mnemonic":"guide就是“该带”。 该带别人沿正确方向走，就是引导和指导。 所以guide就是“引导、指导”。","mainWords":[{"word":"guide","pos":"v.","detail":"构词: 构词: guide(引导)<br>释义: 引导 n.向导","example":"例句: He will guide us through the city. ｜ 推导: 引导 = 知道路的人带路"},{"word":"guidance","pos":"n.","detail":"构词: 构词: guide + ance(名词后缀)<br>释义: 指导;引导","example":"例句: We need your guidance. ｜ 推导: 引导 + 名词化 = 指导,引导"},{"word":"guideline","pos":"n.","detail":"构词: 构词: guide + line(路线)<br>释义: 指导方针","example":"例句: Follow the guidelines carefully. ｜ 推导: 引导 + 路线 = 引导的路线,指导方针"}],"extra":["misguide v. 误导（构词: mis(错误) + guide）","guidebook n. 指南（构词: guide + book）","guided a. 有向导的（构词: guide + ed）"]},{"id":78,"root":"labor-","pronounce":"/ˈleɪbər/勒诶伯儿","source":"拉丁语 laborare","meaning":"劳动,工作,努力","mnemonic":"labor就是“累伯”。 累得不停干活的伯伯，一直在劳动、工作和努力。 所以labor就是“劳动、工作、努力”。","mainWords":[{"word":"labor","pos":"n.","detail":"构词: 构词: labor(劳动)<br>释义: 劳动;工作 v.努力","example":"例句: Manual labor is hard work. ｜ 推导: 劳动 = 工作,努力"},{"word":"laboratory","pos":"n.","detail":"构词: 构词: labor + atory(场所后缀)<br>释义: 实验室","example":"例句: Scientists work in the laboratory. ｜ 推导: 劳动 + 场所 = 工作的地方,实验室"},{"word":"elaborate","pos":"a.","detail":"构词: 构词: e(出) + labor + ate<br>释义: 精心的 v.详述","example":"例句: She gave an elaborate explanation. ｜ 推导: 出 + 劳动 = 精心制作出来的"},{"word":"collaborate","pos":"v.","detail":"构词: 构词: col(一起) + labor + ate<br>释义: 合作;协作","example":"例句: They collaborate on projects. ｜ 推导: 一起 + 劳动 = 一起工作,合作"}],"extra":["laborer n. 劳动者（构词: labor + er）","laborious a. 费力的（构词: labor + ious）","elaboration n. 精心制作（构词: elaborate + ion）","collaboration n. 合作（构词: collaborate + ion）","collaborative a. 合作的（构词: collaborate + ive）","belabor v. 过分强调（构词: be + labor）"]},{"id":79,"root":"mon-/mono-","pronounce":"/ˈmɒnəʊ/姆奥恩欧","source":"希腊语 monos","meaning":"单一,独一,单独","mnemonic":"mon/mono就是“某一个”。 只说某一个，就强调单一、独一和单独。 所以mon/mono就是“单一、独一、单独”。","mainWords":[{"word":"monopoly","pos":"n.","detail":"构词: 构词: mono(单一) + poly(卖)<br>释义: 垄断;专卖权","example":"例句: The company has a monopoly. ｜ 推导: 单一 + 卖 = 独家销售,垄断"},{"word":"monarch","pos":"n.","detail":"构词: 构词: mon(单一) + arch(统治)<br>释义: 君主;帝王","example":"例句: The monarch ruled wisely. ｜ 推导: 单一 + 统治 = 独自统治者,君主"},{"word":"monotonous","pos":"a.","detail":"构词: 构词: mono(单一) + ton(声调) + ous<br>释义: 单调的","example":"例句: Life became monotonous. ｜ 推导: 单一 + 声调 = 单一音调的,单调的"}],"extra":["monologue n. 独白（构词: mono + logue(说话)）","monastery n. 修道院（构词: mon + astery）","monopolize v. 垄断（构词: monopol + ize）","monochrome a. 单色的（构词: mono + chrome）"]},{"id":80,"root":"-tain-","pronounce":"/teɪn/特诶恩","source":"拉丁语 tenere","meaning":"持有,保持","mnemonic":"-tain-可以直接想到我们小学学过的ten。 tain 和 ten 只做一次简单的元音联想。ten 就是十，人有 ten 根 finger。十根手指在一双 hand 上一起合拢，就能把一个东西牢牢 hold 住，不让它掉下去。 所以以后看到 tain，就先想到“ten fingers 把东西握住”。 所以-tain-就是“持有、保持”。","mainWords":[{"word":"contain","pos":"v.","detail":"构词: 构词: con(共同) + tain(持有)<br>释义: 包含","example":"例句: The box contains many books. ｜ 推导: 共同 + 持有 = 包含在内"},{"word":"maintain","pos":"v.","detail":"构词: 构词: main(手) + tain(保持)<br>释义: 维持","example":"例句: We must maintain high standards. ｜ 推导: 用手 + 保持 = 维持,保养"},{"word":"obtain","pos":"v.","detail":"构词: 构词: ob(向) + tain(持有)<br>释义: 获得","example":"例句: How did you obtain this information? ｜ 推导: 朝向 + 持有 = 获得,取得"},{"word":"retain","pos":"v.","detail":"构词: 构词: re(回) + tain(持有)<br>释义: 保留","example":"例句: She retained her composure. ｜ 推导: 往回 + 持有 = 保留,保持"},{"word":"sustain","pos":"v.","detail":"构词: 构词: sus(下) + tain(持有)<br>释义: 支撑","example":"例句: Food sustains life. ｜ 推导: 从下 + 持有 = 支撑,维持"},{"word":"attain","pos":"v.","detail":"构词: 构词: at(向) + tain(持有)<br>释义: 达到","example":"例句: He attained his goal. ｜ 推导: 向着 + 持有 = 达到,获得"},{"word":"detain","pos":"v.","detail":"构词: 构词: de(离开) + tain(持有)<br>释义: 扣留","example":"例句: The police detained the suspect. ｜ 推导: 阻止离开 + 持有 = 扣留,拘留"},{"word":"entertain","pos":"v.","detail":"构词: 构词: enter(之间) + tain(持有)<br>释义: 娱乐","example":"例句: The show entertained everyone. ｜ 推导: 在其间 + 持有 = 使保持愉快,娱乐"},{"word":"entertainment","pos":"n.","detail":"构词: 构词: entertain + ment(名词后缀)<br>释义: 娱乐","example":"例句: TV provides entertainment. ｜ 推导: 娱乐 + 名词化 = 娱乐活动"},{"word":"container","pos":"n.","detail":"构词: 构词: contain + er(名词后缀)<br>释义: 容器","example":"例句: Put it in a plastic container. ｜ 推导: 包含 + 物 = 装东⻄的容器"}],"extra":[]},{"id":81,"root":"und-","pronounce":"/ʌnd/阿恩德","source":"拉丁语 unda","meaning":"波浪,流动","mnemonic":"und就是“盎”。“盎”有充盈、向外涌出的感觉，水一涌动就会形成波浪并开始流动，所以und就是“波浪,流动”的意思。","mainWords":[{"word":"abundant","pos":"a.","detail":"构词: 构词: ab(离开) + und(波浪) + ant<br>释义: 丰富的,充裕的","example":"例句: The region has abundant resources. ｜ 推导: 离开 + 波浪 = 溢出的,丰富的"},{"word":"abundance","pos":"n.","detail":"构词: 构词: ab + und + ance(名词后缀)<br>释义: 丰富,充裕","example":"例句: Food was in abundance. ｜ 推导: 离开 + 波浪 + 名词化 = 丰富,大量"},{"word":"abound","pos":"v.","detail":"构词: 构词: ab(离开) + ound(und变体)<br>释义: 充满,富于","example":"例句: The river abounds with fish. ｜ 推导: 离开 + 波浪 = 如波浪般涌现,充满"},{"word":"redundant","pos":"a.","detail":"构词: 构词: re(再) + d + und + ant<br>释义: 多余的,冗余的","example":"例句: The information is redundant. ｜ 推导: 再 + 波浪 = 再次溢出的,多余的"}],"extra":["undulate v. 波动,起伏（构词: und + ulate）","inundate v. 淹没,泛滥（构词: in + und + ate）","undulation n. 波动,起伏（构词: und + ulation）","redundancy n. 冗余,多余（构词: re + d + und + ancy）","superabundant a. 过多的 (super + ab + und + ant)overabundant a.过度丰富的 (over + ab + und +"]},{"id":82,"root":"under-","pronounce":"/ˈʌndər/阿恩德儿","source":"日耳曼语前缀","meaning":"在下方,在下面","mnemonic":"under本身就是我们小学学过的under，意思是在……下面、低于……。所以under作为词根时也是“在下方、在下面”的意思。","mainWords":[{"word":"under","pos":"prep.","detail":"构词: 构词: under(在下方)<br>释义: 在...下面","example":"例句: The cat is under the table. ｜ 推导: 在下方 = 在...下面"},{"word":"understand","pos":"v.","detail":"构词: 构词: under + stand(站立)<br>释义: 理解","example":"例句: I understand your concern. ｜ 推导: 站在中间 = 理解(古英语含义)"},{"word":"underground","pos":"a.","detail":"构词: 构词: under + ground(地面)<br>释义: 地下的","example":"例句: Take the underground railway. ｜ 推导: 在下方 + 地面 = 地下的"},{"word":"undergo","pos":"v.","detail":"构词: 构词: under + go(走)<br>释义: 经历","example":"例句: She underwent surgery yesterday. ｜ 推导: 在下方 + 走 = 经历(承受)"},{"word":"undermine","pos":"v.","detail":"构词: 构词: under + mine(挖矿)<br>释义: 破坏","example":"例句: Don't undermine his confidence. ｜ 推导: 在下方 + 挖 = 挖空根基,破坏"},{"word":"undertake","pos":"v.","detail":"构词: 构词: under + take(拿)<br>释义: 承担","example":"例句: We undertake this project. ｜ 推导: 在下方 + 拿 = 承担(扛在肩下)"},{"word":"underlying","pos":"a.","detail":"构词: 构词: under + lying(躺着的)<br>释义: 潜在的","example":"例句: The underlying cause is complex. ｜ 推导: 在下方 + 躺着 = 潜在的,根本的"},{"word":"undergraduate","pos":"n.","detail":"构词: 构词: under + graduate(毕业生)<br>释义: 本科生","example":"例句: He is an undergraduate student. ｜ 推导: 在下方 + 毕业生 = 未毕业的,本科生"},{"word":"underneath","pos":"prep.","detail":"构词: 构词: under + neath(下方)<br>释义: 在...下面","example":""},{"word":"underestimate","pos":"v.","detail":"构词: 构词: under + estimate(估计)<br>释义: 低估","example":""},{"word":"underlie","pos":"v.","detail":"构词: 构词: under + lie(躺)<br>释义: 位于...之下","example":"例句: Principles underlie our actions. ｜ 推导: 在下方 + 躺 = 作为基础"},{"word":"underline","pos":"v.","detail":"构词: 构词: under + line(线)<br>释义: 下划线;强调","example":"例句: Please underline the key words. ｜ 推导: 在下方 + 线 = 在下面画线,强调"}],"extra":[]},{"id":83,"root":"","pronounce":"/iː/衣","source":"法语 -é(e)","meaning":"承受者,被动对象","mnemonic":"ee就是“乙方的乙”。在甲乙关系里，乙方通常是接受安排、承受结果的一方，所以ee作为后缀就是“承受者、被动对象”的意思。","mainWords":[{"word":"employee","pos":"n.","detail":"构词: 构词: employ(雇佣) + ee(被...者)<br>释义: 雇员","example":"例句: The company has 500 employees. ｜ 推导: 雇佣 + 承受者 = 被雇佣的人"},{"word":"refugee","pos":"n.","detail":"构词: 构词: refuge(避难) + ee(者)<br>释义: 难民","example":"例句: Many refugees need help. ｜ 推导: 避难 + 承受者 = 寻求庇护的人"},{"word":"guarantee","pos":"v./n.","detail":"构词: 构词: guarant(保证) + ee<br>释义: 保证","example":"例句: We guarantee quality service. ｜ 推导: 保证 + 被保证的事物 = 保证(书)"}],"extra":["interviewee n. 受访者（构词: interview + ee）","trainee n. 受训者（构词: train + ee）","payee n. 收款人（构词: pay + ee）","addressee n. 收件人（构词: address + ee）"]},{"id":84,"root":"","pronounce":"/ɪʃən/衣诗额恩","source":"","meaning":"...领域的专家","mnemonic":"-ician从小学词 music 的结构理解：music 后面接上 -ician，就把“音乐”变成“专门从事音乐的人”。前面的内容可以换成别的领域，-ician 仍然负责表示在这个领域中有专门技能的人。所以-ician就是“……领域的专家”。","mainWords":[{"word":"politician","pos":"n.","detail":"构词: 构词: politic(政治) + ician<br>释义: 政治家","example":"例句: The politician gave a speech. ｜ 推导: 政治 + 专家 = 政治家"},{"word":"physician","pos":"n.","detail":"构词: 构词: physic(医学) + ician<br>释义: 内科医生","example":"例句: Consult your physician first. ｜ 推导: 医学 + 专家 = 内科医生"},{"word":"musician","pos":"n.","detail":"构词: 构词: music(音乐) + ician<br>释义: 音乐家","example":"例句: She's a talented musician. ｜ 推导: 音乐 + 专家 = 音乐家"},{"word":"technician","pos":"n.","detail":"构词: 构词: technic(技术) + ician<br>释义: 技术员","example":"例句: Call a technician to fix it. ｜ 推导: 技术 + 专家 = 技术员"},{"word":"electrician","pos":"n.","detail":"构词: 构词: electric(电) + ician<br>释义: 电工","example":"例句: We need an electrician today. ｜ 推导: 电 + 专家 = 电工"},{"word":"magician","pos":"n.","detail":"构词: 构词: magic(魔术) + ician<br>释义: 魔术师","example":"例句: The magician amazed everyone. ｜ 推导: 魔术 + 专家 = 魔术师"}],"extra":["pediatrician n. 儿科医生（构词: pediatr(儿童) + ician）","statistician n. 统计学家（构词: statistic + ician）","beautician n. 美容师（构词: beauty + ician）","optician n. 验光师（构词: optic(视觉) + ician）","dietician n. 营养师（构词: diet(饮食) + ician）","mathematician n. 数学家（构词: mathematic + ian）","logician n. 逻辑学家（构词: logic + ician）","tactician n. 战术家（构词: tactic + ician）","clinician n. 临床医生（构词: clinic + ician）","mortician n. 殡葬师（构词: mort(死亡) + ician）"]},{"id":85,"root":"awe","pronounce":"/ɔː/奥","source":"古诺尔斯语 agi","meaning":"敬畏,恐惧","mnemonic":"awe就是面对壮观又可怕事物时发出的“哦——”声。 这声惊叹里同时带有敬重和害怕，所以表示敬畏和恐惧。 所以awe就是“敬畏、恐惧”。","mainWords":[{"word":"awe","pos":"n.","detail":"构词: 构词: awe(敬畏)<br>释义: 敬畏 v.使敬畏","example":"例句: I was filled with awe. ｜ 推导: 敬畏 = 恐惧与尊敬的混合情感"},{"word":"awful","pos":"a.","detail":"构词: 构词: awe + ful(充满的)<br>释义: 糟糕的;可怕的","example":"例句: The weather was awful. ｜ 推导: 敬畏 + 充满 = 令人畏惧的→糟糕的"},{"word":"awesome","pos":"a.","detail":"构词: 构词: awe + some(引起...的)<br>释义: 令人惊叹的;极好的","example":"例句: That's an awesome idea! ｜ 推导: 敬畏 + 引起的 = 令人敬畏的→极好的"}],"extra":["awestruck a. 充满敬畏的（构词: awe + struck(打击)）","aweless a. 无畏的（构词: awe + less(无)）","awe-inspiring a. 令人敬畏的（构词: awe + inspiring）","awfully ad. 非常地;糟糕地（构词: awful + ly）"]},{"id":86,"root":"dur-","pronounce":"/djʊə/德耶乌儿","source":"拉丁语 dūrāre","meaning":"持久,坚固,忍耐","mnemonic":"dur就是“多日”。一件东西经过多日仍然不坏，说明它坚固而持久；一个人咬牙坚持多日，说明他能够忍耐。所以dur就是“持久、坚固、忍耐”。","mainWords":[{"word":"during","pos":"prep.","detail":"构词: 构词: dur(持续) + ing(现在分词)<br>释义: 在...期间","example":"例句: I studied during the summer. ｜ 推导: 持续 + 进行中 = 在持续的时间中"},{"word":"endure","pos":"v.","detail":"构词: 构词: en(使) + dur(持续) + e<br>释义: 忍耐;持久","example":"例句: She endured the pain bravely. ｜ 推导: 使 + 持续 = 使自己坚持,忍耐"},{"word":"duration","pos":"n.","detail":"构词: 构词: dur(持续) + ation(名词后缀)<br>释义: 持续时间","example":"例句: The duration of the movie is 2 hours. ｜ 推导: 持续 + 名词化 = 持续的长度,期间"},{"word":"endurance","pos":"n.","detail":"构词: 构词: en + dur + ance(名词后缀)<br>释义: 耐力;持久力","example":"例句: Marathon tests your endurance. ｜ 推导: 使持续 + 名词化 = 持续的能力,耐力"},{"word":"durable","pos":"a.","detail":"构词: 构词: dur(持久) + able(能...的)<br>释义: 耐用的;持久的","example":"例句: This bag is very durable. ｜ 推导: 持久 + 能够的 = 能够持久的,耐用的"}],"extra":["durability n. 耐久性（构词: dur + ability）","obdurate a. 顽固的（构词: ob(加强) + dur + ate）","perdure v. 持续存在（构词: per(完全) + dur + e）","indurate v. 使坚硬（构词: in(使) + dur + ate）"]},{"id":87,"root":"fem-","pronounce":"/fem/夫诶姆","source":"拉丁语 fēmina","meaning":"女性,雌性","mnemonic":"fem就是“粉”。 粉色常被用来表示女性，所以表示女性和雌性。 所以fem就是“女性、雌性”。","mainWords":[{"word":"female","pos":"n.","detail":"构词: 构词: fem(女性) + ale<br>释义: 女性 a.女性的","example":"例句: The female athletes won gold. ｜ 推导: 女性 + 后缀 = 女性,雌性"},{"word":"feminine","pos":"a.","detail":"构词: 构词: femin(女性) + ine(形容词后缀)<br>释义: 女性的;阴柔的","example":"例句: She has a feminine charm. ｜ 推导: 女性 + 形容词化 = 女性特质的,阴柔的"}],"extra":["feminism n. 女权主义（构词: femin + ism）","feminist n. 女权主义者（构词: femin + ist）","femininity n. 女性气质（构词: femin + inity）","feminize v. 使女性化（构词: femin + ize）","effeminate a. 柔弱的（构词: ef + femin + ate）","femme n. 女人(法语)（构词: fem + me）"]},{"id":88,"root":"flam-","pronounce":"/flæm/夫莱姆","source":"拉丁语 flamma","meaning":"火焰,燃烧","mnemonic":"flam就是“弗 la 读起来就是拉 min 读起来就是明”。弗 la 读起来就是拉 min 读起来就是明 g 读起来就是戈 弗拉明戈 flaming 就是 火焰 的意思 弗拉明戈 flaming 是 flam + ing 之后的形式 所以词根 flam 跟 弗拉明戈 一样 都是 火焰 的意思。所以flam就是“火焰,燃烧”的意思。","mainWords":[{"word":"flame","pos":"n.","detail":"构词: 构词: flam(火焰) + e<br>释义: 火焰;热情","example":"例句: The candle flame flickered. ｜ 推导: 火焰 = 燃烧的火光"},{"word":"flare","pos":"v.","detail":"构词: 构词: flar(flame变体) + e<br>释义: 闪耀;突然燃烧","example":"例句: The fire suddenly flared up. ｜ 推导: 火焰变体 = 突然明亮地燃烧"}],"extra":["flaming a. 燃烧的;火红的（构词: flam + ing）","inflame v. 激怒;发炎（构词: in + flam + e）","flammable a. 易燃的（构词: flam + able）","inflammation n. 炎症（构词: in + flam + ation）","flamboyant a. 艳丽的（构词: flam + boyant）","aflame a. 燃烧着的（构词: a + flam + e）"]},{"id":89,"root":"gard-","pronounce":"/gɑːrd/格啊儿德","source":"法语 garder","meaning":"看守,守护,注视","mnemonic":"gard就是“岗的”。 站岗的人要一直注视入口，负责看守和守护。 所以gard就是“看守、守护、注视”。","mainWords":[{"word":"regard","pos":"v.","detail":"构词: 构词: re(再) + gard(看守)<br>释义: 看待;认为 n.关注","example":"例句: I regard him as a friend. ｜ 推导: 再 + 看守 = 重新审视,看待"},{"word":"regarding","pos":"prep.","detail":"构词: 构词: regard + ing<br>释义: 关于","example":"例句: Regarding your question... ｜ 推导: 看待 + 进行时 = 关于,涉及"},{"word":"regardless","pos":"ad.","detail":"构词: 构词: regard + less(无)<br>释义: 不管;不顾","example":"例句: He went regardless of danger. ｜ 推导: 看待 + 无 = 不看,不管,不顾"},{"word":"disregard","pos":"v.","detail":"构词: 构词: dis(不) + regard<br>释义: 忽视;漠视","example":"例句: Don't disregard the rules. ｜ 推导: 不 + 看待 = 不看,忽视"}],"extra":["guard n./v. 守卫;警戒 (gard的变体)","guardian n. 监护人（构词: guard + ian）","safeguard v./n. 保护（构词: safe + guard）","garden n. 花园（构词: gard + en）"]},{"id":90,"root":"hol-/hal-","pronounce":"/həʊl/赫欧勒","source":"古英语 hal","meaning":"完整的,健康的","mnemonic":"hol-/hal就是“好好的”。 身体好好的，说明整体没有缺损，也处于健康状态。 所以hol-/hal就是“完整的、健康的”。","mainWords":[{"word":"whole","pos":"a.","detail":"构词: 构词: whol(完整) + e<br>释义: 完整的;全部的","example":"例句: The whole story is true. ｜ 推导: 完整 = 完整的,全部的"},{"word":"wholly","pos":"ad.","detail":"构词: 构词: whol(完整) + ly(副词后缀)<br>释义: 完全地","example":"例句: I wholly agree with you. ｜ 推导: 完整 + 副词化 = 完全地"},{"word":"wholesome","pos":"a.","detail":"构词: 构词: whol(完整) + some(形容词后缀)<br>释义: 有益健康的","example":"例句: Eat wholesome food. ｜ 推导: 完整 + 充满 = 使身心完整的,有益健康的"},{"word":"holy","pos":"a.","detail":"构词: 构词: hol(完整) + y(形容词后缀)<br>释义: 神圣的;圣洁的","example":"例句: The holy Bible. ｜ 推导: 完整 → 纯洁 → 神圣的"},{"word":"holiday","pos":"n.","detail":"构词: 构词: holy(神圣) + day(日子)<br>释义: 假日;节日","example":"例句: Enjoy your holiday! ｜ 推导: 神圣的 + 日子 = 宗教节日 → 假日"}],"extra":["holiness n. 神圣;圣洁（构词: holy + ness）","hale a. 健壮的（构词: hal + e）","heal v. 治愈 (使healthy完整)","health n. 健康（构词: heal + th）"]},{"id":91,"root":"loyal","pronounce":"/ˈlɔɪəl/勒奥伊额勒","source":"拉丁语 legalis","meaning":"忠诚的","mnemonic":"loyal就是“老友”。 真正的老友最重要的品质就是长期忠诚。 所以loyal就是“忠诚的”。","mainWords":[{"word":"loyal","pos":"a.","detail":"构词: 构词: loyal(忠诚的)<br>释义: 忠诚的","example":"例句: He is loyal to his friends. ｜ 推导: 忠诚的,忠心的"},{"word":"loyalty","pos":"n.","detail":"构词: 构词: loyal + ty(名词后缀)<br>释义: 忠诚,忠心","example":"例句: Customer loyalty is important. ｜ 推导: 忠诚的 + 名词化 = 忠诚度,忠心"}],"extra":["loyalist n. 忠诚者（构词: loyal + ist(人)）","loyally ad. 忠诚地（构词: loyal + ly）","disloyal a. 不忠的（构词: dis + loyal）","disloyalty n. 不忠（构词: dis + loyalty）","royal a. 皇家的（构词: r(eg) + oyal）","royalty n. 皇室（构词: royal + ty）"]},{"id":92,"root":"merg-","pronounce":"/mɜːdʒ/姆吉","source":"拉丁语 mergere","meaning":"浸泡,沉没,淹没","mnemonic":"merg就是“没入”。 东西没入水中，就会被浸泡、淹没并逐渐沉没。 所以merg就是“浸泡、沉没、淹没”。","mainWords":[{"word":"merge","pos":"v.","detail":"构词: 构词: merg(沉没) + e<br>释义: 合并;融合","example":"例句: The two companies will merge. ｜ 推导: 沉没 = 两者沉入成为一体,合并"},{"word":"emerge","pos":"v.","detail":"构词: 构词: e(出) + merg(沉没) + e<br>释义: 浮现;出现","example":"例句: New problems emerged suddenly. ｜ 推导: 向外 + 沉没 = 从沉没中出来,浮现"},{"word":"emergency","pos":"n.","detail":"构词: 构词: emerge + ncy(名词后缀)<br>释义: 紧急情况","example":"例句: Call 911 in an emergency. ｜ 推导: 浮现 + 状态 = 突然浮现的状况,紧急情况"},{"word":"submerge","pos":"v.","detail":"构词: 构词: sub(下) + merg(沉没) + e<br>释义: 淹没;潜水","example":"例句: The submarine submerged quickly. ｜ 推导: 在下 + 沉没 = 沉入下方,淹没"}],"extra":["emergent a. 紧急的;新兴的（构词: emerge + nt）","immerse v. 沉浸（构词: im(进入) + merg + e）","merger n. 合并;并购（构词: merg + er）","submersion n. 淹没（构词: submerg + sion）"]},{"id":93,"root":"min-","pronounce":"/mɪn/米恩；/maɪn/姆爱恩","source":"拉丁语 minuere；拉丁语 mina；拉丁语 minari","meaning":"小,减少；矿,挖掘；突出,威胁","mnemonic":"min分三支记。1.min就是“迷你”，迷你的东西就是小，小下去就是减少。2.min就是mine，mine就是矿和挖矿，所以这一支表示矿、挖掘。3.min就是“冒尖”，东西冒尖就是突出，突出到让人害怕就会形成威胁。综上，min就是“小、减少；矿、挖掘；突出、威胁”的意思。","mainWords":[{"word":"minimum","pos":"n.","detail":"构词: 构词: min(小) + imum(最高级后缀)<br>释义: 最小值 a.最小的","example":"例句: The minimum wage increased. ｜ 推导: 小 + 最高级 = 最小的,最小值"},{"word":"minimize","pos":"v.","detail":"构词: 构词: min(小) + im + ize(动词后缀)<br>释义: 使减到最少","example":"例句: Minimize the window please. ｜ 推导: 小 + 动词化 = 使变小,最小化"},{"word":"diminish","pos":"v.","detail":"构词: 构词: di(分离) + min(小) + ish(动词后缀)<br>释义: 减少;缩小","example":"例句: His influence gradually diminished. ｜ 推导: 分离 + 小 + 动词化 = 逐渐变小,减少"},{"word":"miniature","pos":"n.","detail":"构词: 构词: min(小) + iature(名词后缀)<br>释义: 缩影 a.微型的","example":"例句: A miniature model of the city. ｜ 推导: 小 + 名词化 = 小型物,缩小版"},{"word":"minor","pos":"a.","detail":"构词: 构词: min(小) + or(比较级后缀)<br>释义: 较小的;次要的","example":"例句: It's a minor problem. ｜ 推导: 小 + 比较级 = 较小的,次要的"},{"word":"minority","pos":"n.","detail":"构词: 构词: minor + ity(名词后缀)<br>释义: 少数;少数民族","example":"例句: Ethnic minorities need protection. ｜ 推导: 较小的 + 状态 = 少数群体"},{"word":"mine","pos":"n.","detail":"构词: 构词: mine(矿)<br>释义: 矿;矿山 v.挖矿","example":"例句: They work in a coal mine. ｜ 推导: 矿 = 地下开采矿物的地方"},{"word":"mineral","pos":"n.","detail":"构词: 构词: miner(矿工) + al<br>释义: 矿物 a.矿物的","example":"例句: This rock contains rare minerals. ｜ 推导: 矿工相关的 = 矿物,矿物质"},{"word":"undermine","pos":"v.","detail":"构词: 构词: under(在下) + mine(挖矿)<br>释义: 破坏;削弱","example":"例句: Don't undermine his confidence. ｜ 推导: 在下面 + 挖矿 = 挖空根基,破坏"},{"word":"prominent","pos":"a.","detail":"构词: 构词: pro(向前) + min(突出) + ent<br>释义: 突出的;著名的","example":"例句: He played a prominent role. ｜ 推导: 向前 + 突出 = 向前突出的,显著的"},{"word":"eminent","pos":"a.","detail":"构词: 构词: e(出) + min(突出) + ent<br>释义: 杰出的;著名的","example":"例句: An eminent scientist spoke. ｜ 推导: 出来 + 突出 = 突出出来的,杰出的"}],"extra":["minute a. 微小的（构词: min + ute）","minus prep. 减去 a.负的（构词: min + us）","minimal a. 最小的(min + imal)","mini a. 迷你的(min + i)","miner n. 矿工（构词: mine + er）","mining n. 采矿业（构词: mine + ing）","prominence n. 突出;卓越（构词: pro + min + ence）","eminence n. 卓越;显赫（构词: e + min + ence）","imminent a. 即将发生的（构词: im(向内) + min + ent）","preeminent a. 卓越的（构词: pre + eminent）","eminently ad. 非常;显著地（构词: eminent + ly）","prominently ad. 显著地（构词: prominent + ly）","supereminent a. 极其杰出的（构词: super + eminent）","menace n./v. 威胁（构词: men(=min) + ace）","minatory a. 威胁的（构词: min + atory）","comminatory a. 威胁的（构词: com + min + atory）"]},{"id":94,"root":"pen-/pun-","pronounce":"/pen/喷","source":"拉丁语 poena","meaning":"惩罚,痛苦","mnemonic":"方法一：pen-/pun就是“判”。法院作出判决以后，犯错的人会受到惩罚并承受痛苦，所以pen-/pun就是“惩罚,痛苦”的意思。  方法二：为了记忆，可以把PEN记成“Problem Ends Now”。\n\nProblem表示已经有人犯错、造成问题；Ends Now表示这个问题经过处理以后到此结束。犯错的人要让问题真正结束，就必须接受处罚并付出代价。","mainWords":[{"word":"pain","pos":"n.","detail":"构词: 构词: pain < poena(惩罚)<br>释义: 疼痛;痛苦","example":"例句: I felt a sharp pain in my chest. ｜ 推导: 惩罚 → 肉体/精神的痛苦"},{"word":"painful","pos":"a.","detail":"构词: 构词: pain + ful(充满...的)<br>释义: 痛苦的;疼痛的","example":"例句: It was a painful experience. ｜ 推导: 疼痛 + 充满 = 充满痛苦的"},{"word":"punish","pos":"v.","detail":"构词: 构词: pun(惩罚) + ish(动词后缀)<br>释义: 惩罚;处罚","example":"例句: The court will punish the criminal. ｜ 推导: 惩罚 + 动词化 = 施加惩罚"},{"word":"penalty","pos":"n.","detail":"构词: 构词: pen(惩罚) + alty(名词后缀)<br>释义: 处罚;罚款","example":"例句: He paid a heavy penalty. ｜ 推导: 惩罚 + 名词化 = 处罚,代价"}],"extra":["punishment n. 惩罚（构词: punish + ment）","penal a. 刑罚的（构词: pen + al）","penalize v. 处罚（构词: penal + ize）","repent v. 悔改（构词: re + pent）"]},{"id":95,"root":"paint","pronounce":"/peɪnt/普诶恩特","source":"拉丁语 pingere","meaning":"描绘,涂抹,着色","mnemonic":"paint本身就是我们小学学过的paint。 paint 就是“绘画、油漆、颜料”。 所以paint就是“描绘、涂抹、着色”。","mainWords":[{"word":"paint","pos":"v.","detail":"构词: 构词: paint(涂抹,着色)<br>释义: 绘画;油漆 n.颜料","example":"例句: She likes to paint landscapes. ｜ 推导: 涂抹着色 = 绘画,油漆"},{"word":"painter","pos":"n.","detail":"构词: 构词: paint + er(从事者)<br>释义: 画家;油漆工","example":"例句: The painter finished the portrait. ｜ 推导: 绘画 + 从事者 = 画家"},{"word":"painting","pos":"n.","detail":"构词: 构词: paint + ing(动作/结果)<br>释义: 绘画;油画;上漆","example":"例句: This painting is very valuable. ｜ 推导: 绘画 + 名词化 = 绘画作品,绘画行为"}],"extra":["repaint v. 重新油漆（构词: re(重新) + paint）","paintbrush n. 画笔（构词: paint + brush）","paintwork n. 油漆层（构词: paint + work）","unpainted a. 未上漆的（构词: un + paint + ed）"]},{"id":96,"root":"pung-/punct-","pronounce":"/pʌŋkt/普阿昂克特","source":"拉丁语 pungere","meaning":"刺,点,戳","mnemonic":"pung/punct就是“碰点”。用手指轻轻碰一下，会留下一个点；用尖东西用力碰下去，就会变成刺、戳，甚至打出一个孔。所以pung/punct就是“刺、点、戳”的意思。","mainWords":[{"word":"punch","pos":"v.","detail":"构词: 构词: pun(g)(刺) + ch<br>释义: 打孔;拳击","example":"例句: Punch a hole in the paper. ｜ 推导: 刺 = 打孔,冲击"},{"word":"punctual","pos":"a.","detail":"构词: 构词: punct(点) + ual(形容词后缀)<br>释义: 准时的","example":"例句: He is always punctual. ｜ 推导: 点 + 形容词化 = 精确到时间点的"}],"extra":["punctuate v. 加标点;强调（构词: punct + uate）","punctuation n. 标点符号（构词: punct + uation）","puncture n./v. 刺穿;穿孔（构词: punct + ure）","acupuncture n. 针灸（构词: acu(针) + punct + ure）","compunction n. 内疚（构词: com + punct + ion）","pungent a. 刺激的;辛辣的（构词: pung + ent）","expunge v. 删除;抹去（构词: ex + pung + e）","punctuality n. 准时（构词: punctual + ity）"]},{"id":97,"root":"-quaint-","pronounce":"/kweɪnt/克乌诶恩特","source":"拉丁语 cognoscere","meaning":"认识,了解,熟悉","mnemonic":"quaint就是“圈它”。把一个陌生人圈进自己的熟人圈，要先认识他、了解他，时间久了才会彼此熟悉。所以-quaint-就是“认识、了解、熟悉”。","mainWords":[{"word":"acquaint","pos":"v.","detail":"构词: 构词: ac(向) + quaint(认识)<br>释义: 使认识;使了解","example":"例句: Let me acquaint you with the facts. ｜ 推导: 向 + 认识 = 使认识,使了解"},{"word":"acquaintance","pos":"n.","detail":"构词: 构词: ac + quaint + ance(名词后缀)<br>释义: 相识;熟人","example":"例句: She is an old acquaintance of mine. ｜ 推导: 认识 + 名词化 = 认识的人,熟人"}],"extra":["acquainted a. 熟悉的（构词: ac + quaint + ed）","unacquainted a. 不熟悉的（构词: un + acquainted）","reacquaint v. 重新认识（构词: re + acquaint）","acquaintanceship n. 相识关系 (acquaintance + s","quaint a. 古雅的;离奇有趣的 (quaint)","quaintly ad. 古雅地（构词: quaint + ly）"]},{"id":98,"root":"qual-","pronounce":"/kwɒl/克乌奥勒","source":"拉丁语 qualis","meaning":"什么样的,品质","mnemonic":"qual就是“夸了”。在夸一个东西以前，通常先要看它是什么样、品质好不好；品质好，才会被人夸。所以qual就是“什么样的、品质”。","mainWords":[{"word":"quality","pos":"n.","detail":"构词: 构词: qual(什么样的) + ity(名词后缀)<br>释义: 品质;质量","example":"例句: The quality of education matters. ｜ 推导: 什么样的 + 名词化 = 品质,质量"},{"word":"qualify","pos":"v.","detail":"构词: 构词: qual(什么样的) + ify(动词后缀)<br>释义: 使合格;限定","example":"例句: She qualified for the finals. ｜ 推导: 什么样的 + 动词化 = 使成为某种样子,使合格"},{"word":"qualification","pos":"n.","detail":"构词: 构词: qual + ify + ication(名词后缀)<br>释义: 资格;限定","example":"例句: He has the right qualifications. ｜ 推导: 使合格 + 名词化 = 资格,资历"},{"word":"qualitative","pos":"a.","detail":"构词: 构词: qual + itative(形容词后缀)<br>释义: 定性的;性质的","example":"例句: Qualitative analysis is important. ｜ 推导: 什么样的 + 形容词化 = 关于性质的,定性的"}],"extra":["qualified a. 有资格的;合格的（构词: qual + ified）","qualifier n. 限定词;取得资格者（构词: qual + ifier）","disqualify v. 取消资格（构词: dis + qual + ify）","unqualified a. 不合格的（构词: un + qual + ified）","equality n. 平等;相等（构词: e + qual + ity）","equalize v. 使相等（构词: e + qual + ize）"]},{"id":99,"root":"quar-/quart-","pronounce":"/kwɔːr/克乌奥儿","source":"拉丁语 quattuor","meaning":"四","mnemonic":"方法一： quar完整藏在小学数学词square中，square 是正方形，最明显的特点就是有四条边。quart只是在 quar 后再加一个 t，核心字母和意义不变。所以quar/quart就是“四”。 方法二： quar-/quart就是“块儿”。 把一个整体平均分成四块，就得到四和四分之一的概念。 所以quar-/quart就是“四”。","mainWords":[{"word":"quarter","pos":"n.","detail":"构词: 构词: quart(四) + er<br>释义: 四分之一;季度","example":"例句: The first quarter of the year. ｜ 推导: 四 + 名词化 = 四分之一,四分之一年(季度)"},{"word":"quarterly","pos":"a.","detail":"构词: 构词: quarter + ly(形容词后缀)<br>释义: 每季的 ad.每季一次","example":"例句: A quarterly report is due. ｜ 推导: 季度 + 形容词化 = 每季度的"},{"word":"square","pos":"n.","detail":"构词: 构词: s + quar(四) + e<br>释义: 正方形;广场 a.正方形的","example":"例句: Times Square in New York. ｜ 推导: 四 → 四边形 = 正方形,方形广场"},{"word":"headquarters","pos":"n.","detail":"构词: 构词: head + quarters(住处)<br>释义: 总部;司令部","example":"例句: The company headquarters is here. ｜ 推导: 头部 + 营区 = 指挥部,总部"}],"extra":["quart n. 夸脱(容量单位,1/4加仑)","quartet n. 四重奏;四人组","quadruple a. 四倍的 v.使成四倍","quadrant n. 象限;四分之一圆"]},{"id":100,"root":"quot","pronounce":"/kwəʊt/阔特","source":"拉丁语 quot (多少)","meaning":"多少,数量","mnemonic":"为了记忆，可以把QUOT记成“Question Us: One or Two?”\n\nQuestion Us表示别人向我们提问；One or Two表示问题的内容是在问“一个还是两个”。\n\n无论答案是一个、两个还是更多，这类问题最核心的都是“到底有多少、数量是多少”。四个字母完整参与，而且人物、问题和答案始终处在同一个计数场景中。\n\n所以quot就是“多少、数量”的意思。","mainWords":[{"word":"quote","pos":"v.","detail":"构词: 构词: quot(多少) + e<br>释义: 引用;报价","example":"例句: He quoted Shakespeare. ｜ 推导: 多少 = 引用多少话,报多少价"},{"word":"quota","pos":"n.","detail":"构词: 构词: quot(多少) + a<br>释义: 配额;定额","example":"例句: The import quota was reduced. ｜ 推导: 多少 + 名词化 = 规定的数量,配额"}],"extra":["quotation n. 引文;报价单（构词: quot + ation）","quotient n. 商数（构词: quot + ient）","misquote v. 错误引用（构词: mis + quot + e）","quotable a. 值得引用的（构词: quot + able）"]},{"id":101,"root":"rar-","pronounce":"/reər/儿艾儿儿","source":"拉丁语 rarus","meaning":"稀疏的,稀有的","mnemonic":"rar就是“rare”。rare会让人直接想到“稀疏的”，由这个意思还可以继续推出稀有的，所以rar就是“稀疏的,稀有的”的意思。","mainWords":[{"word":"rare","pos":"a.","detail":"构词: 构词: rar(稀疏) + e<br>释义: 稀有的,罕见的","example":"例句: This is a rare opportunity. ｜ 推导: 稀疏的 = 稀有的,罕见的"},{"word":"rarely","pos":"ad.","detail":"构词: 构词: rare + ly(副词后缀)<br>释义: 很少,难得","example":"例句: She rarely goes out at night. ｜ 推导: 稀有的 + 副词化 = 很少地,难得地"}],"extra":["rarity n. 稀有;珍品（构词: rar + ity）","rarefied a. 稀薄的;精炼的（构词: rare + fied）","rarefy v. 使稀薄;使纯化（构词: rare + fy）","rareness n. 稀有性（构词: rare + ness）","rarer a. 更稀有的（构词: rare + er）","rarest a. 最稀有的（构词: rare + est）"]},{"id":102,"root":"reg-","pronounce":"/redʒ/儿诶吉；/reg/儿诶格","source":"rex/regis (国王)；regere (引导)","meaning":"王,统治；引导,管理,规则","mnemonic":"reg就是Rule Every Group三个熟词的首字母。rule是统治和规则，every group就是每一个群体；一个king要rule every group，也要manage people，让不同group都按同一套规则行动。所以reg就是“王、统治；引导、管理、规则”的意思。","mainWords":[{"word":"royal","pos":"a.","detail":"构词: 构词: roy(reg-变体,王) + al<br>释义: 皇家的;高贵的","example":"例句: The royal family attended. ｜ 推导: 王 + 形容词化 = 王室的,皇家的"},{"word":"reign","pos":"v./n.","detail":"构词: 构词: reg(王) + n(法语变化)<br>释义: 统治;在位期","example":"例句: She reigned for 70 years. ｜ 推导: 王 + 动词化 = 作王统治"},{"word":"regime","pos":"n.","detail":"构词: 构词: reg(统治) + ime(名词后缀)<br>释义: 政权;政体","example":"例句: The old regime collapsed. ｜ 推导: 统治 + 名词化 = 统治体系,政权"},{"word":"sovereign","pos":"n.","detail":"构词: 构词: sove(超越) + reign(统治)<br>释义: 君主 a.至高的","example":"例句: Sovereign power belongs to people. ｜ 推导: 超越 + 统治 = 至高无上的统治者"},{"word":"royalty","pos":"n.","detail":"构词: 构词: royal(皇家的) + ty(名词后缀)<br>释义: 皇室;版税","example":"例句: The royalty attended the ceremony. ｜ 推导: 皇家的 + 名词化 = 皇室成员"},{"word":"regular","pos":"a.","detail":"构词: 构词: reg(规则) + ular(形容词后缀)<br>释义: 规则的;定期的","example":"例句: He is a regular customer. ｜ 推导: 规则 + 形容词化 = 有规律的,规则的"},{"word":"regulate","pos":"v.","detail":"构词: 构词: reg(管理) + ulate(动词后缀)<br>释义: 管理;调节","example":"例句: Laws regulate our behavior. ｜ 推导: 管理 + 动词化 = 进行管理,调节"},{"word":"regulation","pos":"n.","detail":"构词: 构词: reg + ul + ation(名词后缀)<br>释义: 规章;管理","example":"例句: Follow safety regulations. ｜ 推导: 管理 + 名词化 = 管理条例,规章"},{"word":"region","pos":"n.","detail":"构词: 构词: reg(管理) + ion(名词后缀)<br>释义: 地区;区域","example":"例句: This region is developing fast. ｜ 推导: 管理 + 名词化 = 被管理的区域"},{"word":"register","pos":"v./n.","detail":"构词: 构词: reg(管理) + ister(名词后缀)<br>释义: 登记;注册","example":"例句: Please register your name. ｜ 推导: 管理 + 名词化 = 登记册,登记"}],"extra":["regal a. 王者的;庄严的（构词: reg + al）","regent n. 摄政王（构词: reg + ent）","regina n. 女王（构词: reg + ina(阴性)）","regicide n. 弑君（构词: reg + cide(杀)）","regalia n. 王权标志（构词: reg + alia）","viceroy n. 总督（构词: vice + roy）","regional a. 地区的（构词: region + al）","regulatory a. 管理的（构词: regulat + ory）","regulator n. 管理者（构词: regulat + or）","irregularly ad. 不规则地（构词: ir + regular + ly）"]},{"id":103,"root":"ser-/sert-","pronounce":"/sɜːr/瑟儿","source":"拉丁语 serere","meaning":"连接,加入","mnemonic":"ser-/sert就是“塞”。把一个东西塞进另一个空隙，就是把它加入进去；塞到一起以后，两个东西也会连接起来，所以ser-/sert就是“连接,加入”的意思。","mainWords":[{"word":"series","pos":"n.","detail":"构词: 构词: ser(连接) + ies(名词后缀)<br>释义: 系列;连续","example":"例句: A series of events occurred. ｜ 推导: 连接 + 名词化 = 连接的事物,系列"},{"word":"serial","pos":"a.","detail":"构词: 构词: ser(连接) + ial(形容词后缀)<br>释义: 连续的;连载的","example":"例句: Watch the serial drama. ｜ 推导: 连接 + 形容词化 = 连续的,连载的"},{"word":"insert","pos":"v.","detail":"构词: 构词: in(进入) + sert(连接)<br>释义: 插入;嵌入","example":"例句: Insert the key into the lock. ｜ 推导: 进入 + 连接 = 连接进去,插入"},{"word":"assert","pos":"v.","detail":"构词: 构词: as(朝向) + sert(连接)<br>释义: 断言;主张","example":"例句: He asserted his innocence. ｜ 推导: 朝向 + 连接 = 坚定地连接立场,断言"},{"word":"desert","pos":"n.","detail":"构词: 构词: de(离开) + sert(连接)<br>释义: 沙漠 v. 遗弃","example":"例句: Don't desert your friends. ｜ 推导: 离开 + 连接 = 断开连接,遗弃/荒芜"}],"extra":["assertion n. 断言;主张（构词: assert + ion）","insertion n. 插入;插入物（构词: insert + ion）","dissertation n. 论文（构词: dis + sert + ation）","deserted a. 荒芜的（构词: desert + ed）"]},{"id":104,"root":"serv-","pronounce":"/sɜːrv/瑟儿五","source":"拉丁语 servare；拉丁语 servire","meaning":"保持,保存；服务,侍奉","mnemonic":"serv就是我们平时说的“伺服”。 伺服装置会按命令保持运行；伺候别人又是服务和侍奉。 所以serv就是“保持、保存；服务、侍奉”。","mainWords":[{"word":"observe","pos":"v.","detail":"构词: 构词: ob(朝向) + serv(保持) + e<br>释义: 观察","example":"例句: Observe the changes carefully. ｜ 推导: 朝向 + 保持 = 保持注意力朝向,观察"},{"word":"observation","pos":"n.","detail":"构词: 构词: observe + ation(名词后缀)<br>释义: 观察","example":"例句: His observation was accurate. ｜ 推导: 观察 + 名词化 = 观察(行为或结果)"},{"word":"preserve","pos":"v.","detail":"构词: 构词: pre(预先) + serv(保持) + e<br>释义: 保存","example":"例句: Preserve food in the fridge. ｜ 推导: 预先 + 保持 = 预先保持好,保存"},{"word":"conservation","pos":"n.","detail":"构词: 构词: con(一起) + serv + ation<br>释义: 保护","example":"例句: Wildlife conservation is important. ｜ 推导: 一起 + 保持 + 名词化 = 共同保持,保护"},{"word":"conservative","pos":"a.","detail":"构词: 构词: con + serv + ative(形容词后缀)<br>释义: 保守的","example":"例句: He has conservative views. ｜ 推导: 共同 + 保持 + 形容词化 = 保持传统的"},{"word":"reserve","pos":"v.","detail":"构词: 构词: re(往回) + serv(保持) + e<br>释义: 保留;预订","example":"例句: Reserve a table for dinner. ｜ 推导: 往回 + 保持 = 保持回来,保留/预订"},{"word":"reservation","pos":"n.","detail":"构词: 构词: reserve + ation(名词后缀)<br>释义: 预订;保留","example":"例句: I made a hotel reservation. ｜ 推导: 保留 + 名词化 = 预订,保留意见"},{"word":"reservoir","pos":"n.","detail":"构词: 构词: re + serv + oir(场所后缀)<br>释义: 水库","example":"例句: The reservoir supplies water. ｜ 推导: 保持 + 场所 = 保存水的地方,水库"},{"word":"serve","pos":"v.","detail":"构词: 构词: serv(服务) + e<br>释义: 服务;服役","example":"例句: Serve the customers well. ｜ 推导: 服务 = 提供服务,侍奉"},{"word":"service","pos":"n.","detail":"构词: 构词: serv(服务) + ice(名词后缀)<br>释义: 服务;公共事业","example":"例句: Customer service is important. ｜ 推导: 服务 + 名词化 = 服务(行为或体系)"},{"word":"servant","pos":"n.","detail":"构词: 构词: serv(服务) + ant(人)<br>释义: 仆人;公务员","example":"例句: A civil servant works for government. ｜ 推导: 服务 + 人 = 提供服务的人"},{"word":"deserve","pos":"v.","detail":"构词: 构词: de(完全) + serv(服务) + e<br>释义: 值得;应得","example":"例句: You deserve the success. ｜ 推导: 完全 + 服务 = 因服务而应得"}],"extra":["server n. 服务器;服务员（构词: serv + er）","servitude n. 奴役;苦役（构词: serv + itude）","subservient a. 屈从的（构词: sub + serv + ient）","serviceable a. 有用的（构词: service + able）"]},{"id":105,"root":"teen","pronounce":"/tiːn/特衣恩","source":"古英语 tīene","meaning":"十,十几","mnemonic":"方法一： ten是幼儿园小班必考词 任何一位有读过幼儿园的小朋友必然都知道ten这个单词的意思是十 词根teen就是单词ten的加强版 只是把ten中间的一个e复制成了两个 依然是完全一样的意思 所以teen这个词根 依然是原型ten最基本的含义 也就是十的意思 方法二： 从 thirteen 到 nineteen，这几个小学数字词都以teen结尾：前面的部分表示三到九，teen 则共同表示“十几”。所以teen就是“十、十几”。","mainWords":[{"word":"thirteen","pos":"num.","detail":"构词: 构词: thir(三) + teen(十)<br>释义: 十三","example":"例句: Thirteen is an unlucky number. ｜ 推导: 三 + 十 = 十三"},{"word":"fourteen","pos":"num.","detail":"构词: 构词: four(四) + teen(十)<br>释义: 十四","example":"例句: She is fourteen years old. ｜ 推导: 四 + 十 = 十四"},{"word":"fifteen","pos":"num.","detail":"构词: 构词: fif(五) + teen(十)<br>释义: 十五","example":"例句: The meeting is at fifteen past three. ｜ 推导: 五 + 十 = 十五"},{"word":"eighteen","pos":"num.","detail":"构词: 构词: eight(八) + teen(十)<br>释义: 十八","example":"例句: He turned eighteen yesterday."},{"word":"nineteen","pos":"num.","detail":"构词: 构词: nine(九) + teen(十)<br>释义: 十九","example":"例句: The nineteenth century was eventful. ｜ 推导: 九 + 十 = 十九"},{"word":"teenager","pos":"n.","detail":"构词: 构词: teen(13-19岁) + age + er<br>释义: ⻘少年","example":"例句: Many teenagers use social media. ｜ 推导: 十几岁 + 年龄 + 人 = ⻘少年"}],"extra":["sixteen num. 十六（构词: six + teen）","seventeen num. 十七（构词: seven + teen）","teenage a. ⻘少年的（构词: teen + age）","teens n. 十几岁（构词: teen + s）","preteen n. ⻘春期前儿童（构词: pre + teen）","teensy a. 极小的（构词: teen + sy）","thirteenth a. 第十三的（构词: thir + teen + th）","fifteenth a. 第十五的（构词: fif + teen + th）","eighteenth a. 第十八的（构词: eight + teen + th）","nineteenth a. 第十九的（构词: nine + teen + th）"]},{"id":106,"root":"vac-","pronounce":"/væk/五艾克","source":"拉丁语 vacāre","meaning":"空,空闲","mnemonic":"vac就是“外壳”。一个东西如果只剩外壳、里面没有任何内容，就是空的；空出来的时间也就是空闲，所以vac就是“空,空闲”的意思。","mainWords":[{"word":"vacant","pos":"a.","detail":"构词: 构词: vac(空) + ant(形容词后缀)<br>释义: 空的;空缺的","example":"例句: The room is vacant. ｜ 推导: 空 + 形容词化 = 空的,未被占用的"},{"word":"vacancy","pos":"n.","detail":"构词: 构词: vac(空) + ancy(名词后缀)<br>释义: 空缺;空位","example":"例句: There's a job vacancy. ｜ 推导: 空 + 名词化 = 空闲状态,空缺"},{"word":"vacation","pos":"n.","detail":"构词: 构词: vac(空闲) + ation(名词后缀)<br>释义: 假期;休假","example":"例句: Summer vacation is coming. ｜ 推导: 空闲 + 名词化 = 空闲时间,假期"},{"word":"vacuum","pos":"n.","detail":"构词: 构词: 直接来自拉丁语vacuum<br>释义: 真空;吸尘器","example":"例句: Nature abhors a vacuum. ｜ 推导: 完全无物质的空 = 真空"},{"word":"evacuate","pos":"v.","detail":"构词: 构词: e(出) + vac(空) + ate<br>释义: 疏散;撤离","example":"例句: Evacuate the building immediately. ｜ 推导: 使...出去变空 = 疏散,撤离"}],"extra":["vacate v. 腾出;空出（构词: vac + ate）","evacuation n. 疏散;撤离（构词: evacuate + ion）","vacuous a. 空洞的;无意义的（构词: vac + uous）","vacuity n. 空虚;空白（构词: vac + uity）"]},{"id":107,"root":"vit-","pronounce":"/vɪt/五衣特","source":"拉丁语 vita","meaning":"生命,生命力","mnemonic":"vit就是“维他”。我们平时说的维他命，字面上就是维持生命的东西；能够让一个人继续活着、保持活力，靠的就是生命和生命力。所以vit就是“生命、生命力”的意思。","mainWords":[{"word":"vital","pos":"a.","detail":"构词: 构词: vit(生命) + al(形容词后缀)<br>释义: 至关重要的;生命的","example":"例句: Water is vital for life. ｜ 推导: 生命 + 形容词化 = 生命相关的,至关重要的"},{"word":"vitamin","pos":"n.","detail":"构词: 构词: vit(生命) + amine(胺)<br>释义: 维生素,维他命","example":"例句: Take vitamin C daily. ｜ 推导: 生命 + 胺类 = 维持生命的物质"}],"extra":["vitality n. 活力,生命力（构词: vit + ality）","vitalize v. 使有生气（构词: vit + alize）","revitalize v. 使恢复生机（构词: re + vit + alize）","devitalize v. 使失去活力（构词: de + vit + alize）","vitals n. 生命器官（构词: vit + als）","viable a. 可行的;能生存的（构词: vi + able）","vita n. 生命;简历 (拉丁语原词)","vitalism n. 生机论（构词: vit + alism）","viticulture n. 葡萄栽培（构词: vit + culture）","convivial a. 欢乐的（构词: con + viv + ial）"]},{"id":108,"root":"","pronounce":"/tel/特诶勒","source":"","meaning":"住宿场所","mnemonic":"-tel是我们小学学过的词hotel的一部分。 hotel 就是“酒店、宾馆”。 hotel 和 motel 都是供人住宿的地方。 所以-tel就是“住宿场所”。","mainWords":[{"word":"hotel","pos":"n.","detail":"构词: 构词: 法语hôtel,拉丁语hospitale(客栈)<br>释义: 酒店,宾馆","example":"例句: We stayed at a luxury hotel. ｜ 推导: 原意为\"招待客人的地方\""},{"word":"motel","pos":"n.","detail":"构词: 构词: mo(tor) + (ho)tel 混合词<br>释义: 汽车旅馆","example":"例句: The motel is near the highway. ｜ 推导: 汽车 + 旅馆 = 汽车旅馆"}],"extra":["hostel n. ⻘年旅社（构词: host + el,与hotel同源）","boatel n. 水上旅馆（构词: boat + (ho)tel）","floatel n. 浮动旅馆（构词: float + (ho)tel）","airtel n. 机场旅馆（构词: air + (ho)tel）"]},{"id":109,"root":"bar-","pronounce":"/bɑːr/布啊儿","source":"拉丁语 barra","meaning":"横木,阻挡","mnemonic":"bar就是“笆”。 篱笆由横木组成，并用来阻挡人和动物。 所以bar就是“横木、阻挡”。","mainWords":[{"word":"bar","pos":"n.","detail":"构词: 构词: bar(横木)<br>释义: 酒吧;栏杆;障碍","example":"例句: Meet me at the bar tonight. ｜ 推导: 横木 = 酒吧柜台,栏杆"},{"word":"barrier","pos":"n.","detail":"构词: 构词: bar(横木) + rier(名词后缀)<br>释义: 障碍;屏障","example":"例句: Language is a barrier. ｜ 推导: 横木 + 名词化 = 阻挡物,障碍"},{"word":"barrel","pos":"n.","detail":"构词: 构词: bar(横木) + rel(小词后缀)<br>释义: 桶;枪管","example":"例句: A barrel of oil. ｜ 推导: 横木 + 指小 = 木条箍成的桶"},{"word":"barricade","pos":"n.","detail":"构词: 构词: bar + ric + ade(集合后缀)<br>释义: 路障 v.设障","example":"例句: They built a barricade. ｜ 推导: 横木 + 强化 + 集合 = 路障"}],"extra":["barrage n. 弹幕;阻塞（构词: bar + rage）","embargo n. 禁运（构词: em + bar + go）","barren a. 贫瘠的（构词: bar + ren）","debar v. 阻止（构词: de + bar）"]},{"id":110,"root":"bare/bar-","pronounce":"/beə/布艾儿","source":"古英语 beran","meaning":"裸露,暴露","mnemonic":"bare/bar就是“扒了”。 把遮盖物扒掉以后，里面的东西就会裸露和暴露。 所以bare/bar就是“裸露、暴露”。","mainWords":[{"word":"bare","pos":"a.","detail":"构词: 构词: bare(裸露)<br>释义: 裸露的;空的","example":"例句: The room was bare of furniture. ｜ 推导: 裸露 = 没有遮盖的,空的"},{"word":"barely","pos":"ad.","detail":"构词: 构词: bare(裸露) + ly(副词后缀)<br>释义: 仅仅;勉强","example":"例句: He barely passed the exam. ｜ 推导: 裸露地 = 仅仅达到最低限度"},{"word":"barren","pos":"a.","detail":"构词: 构词: bar(裸露) + ren(后缀)<br>释义: 贫瘠的;不孕的","example":"例句: The land is barren and dry. ｜ 推导: 裸露的 = 土地裸露无植被,贫瘠的"}],"extra":["barefoot a./ad. 赤脚的(地)（构词: bare + foot）","barefaced a. 厚颜无耻的（构词: bare + faced）","bareness n. 裸露;空无（构词: bare + ness）","bareheaded a. 不戴帽的（构词: bare + headed）"]},{"id":111,"root":"bat(t)-","pronounce":"/bæt/拜特","source":"拉丁语 battuere","meaning":"击打,打击","mnemonic":"bat本身就是小学词“球棒”。球棒最典型的动作，就是挥出去击中球；末尾再补一个 t 形成 batt，动作仍然不变。所以bat(t)就是“击打、打击”。","mainWords":[{"word":"battle","pos":"n.","detail":"构词: 构词: bat(t)(击打) + le(反复动作)<br>释义: 战斗;战役","example":"例句: The battle lasted for days. ｜ 推导: 击打 + 反复 = 反复击打,战斗"},{"word":"combat","pos":"n./v.","detail":"构词: 构词: com(共同) + bat(击打)<br>释义: 战斗;格斗","example":"例句: They trained for combat. ｜ 推导: 共同 + 击打 = 互相击打,搏斗"},{"word":"debate","pos":"n./v.","detail":"构词: 构词: de(彻底) + bat(击打) + e<br>释义: 辩论;争论","example":"例句: The debate was intense. ｜ 推导: 彻底 + 击打 = 言语交锋,辩论"},{"word":"battery","pos":"n.","detail":"构词: 构词: bat(t)(击打) + ery(名词后缀)<br>释义: 电池;殴打","example":"例句: The battery needs charging. ｜ 推导: 击打 + 名词化 = 电击装置,电池"}],"extra":["battlefield n. 战场（构词: battle + field）","combatant n. 战斗员（构词: combat + ant）","battlement n. 城垛（构词: battle + ment）","combative a. 好斗的（构词: combat + ive）"]},{"id":112,"root":"bath-","pronounce":"/bɑːθ/布啊斯","source":"古英语 bæð","meaning":"洗浴,沐浴","mnemonic":"bath本身就是我们小学学过的bath。 bath 就是“洗澡、浴缸”。 所以bath就是“洗浴、沐浴”。","mainWords":[{"word":"bath","pos":"n.","detail":"构词: 构词: bath(洗浴)<br>释义: 洗澡;浴缸","example":"例句: I take a bath every evening. ｜ 推导: 洗浴 = 洗澡,沐浴"},{"word":"bathe","pos":"v.","detail":"构词: 构词: bath + e(动词后缀)<br>释义: 洗澡;沐浴","example":"例句: The children love to bathe. ｜ 推导: 洗浴 + 动词化 = 洗澡(动作)"},{"word":"bathroom","pos":"n.","detail":"构词: 构词: bath + room(房间)<br>释义: 浴室;洗手间","example":"例句: The bathroom is upstairs. ｜ 推导: 洗浴 + 房间 = 洗浴的房间,浴室"}],"extra":[]},{"id":113,"root":"bene-","pronounce":"/ˈbeni/布诶尼","source":"拉丁语\"好\"","meaning":"好,善","mnemonic":"bene-可以记成“be nice”的压缩提示。 be nice 就是待人友好、做一个好人。一个人 nice，做出来的事情通常会给别人带来 good 的结果。 所以以后看到 bene，就想到 be nice、be good。 所以bene-就是“好、善”。","mainWords":[{"word":"benefit","pos":"n.","detail":"构词: 构词: bene(好) + fit(做)<br>释义: 利益;好处 v.有益于","example":"例句: The project benefits society. ｜ 推导: 好 + 做 = 做好事,带来好处"},{"word":"beneficial","pos":"a.","detail":"构词: 构词: benefit + ial(形容词后缀)<br>释义: 有益的;有利的","example":"例句: Exercise is beneficial to health. ｜ 推导: 利益 + 形容词化 = 有益的,有利的"}],"extra":["benefactor n. 恩人;捐助者（构词: bene + factor(做的人))beneficiary n.受益人 (bene + ficiary）","benevolent a. 仁慈的（构词: bene + vol(愿意) + ent）","benign a. 良性的;和善的（构词: ben + ign）"]},{"id":114,"root":"brac-","pronounce":"/bræk/布儿艾克","source":"拉丁语 bracchium","meaning":"手臂","mnemonic":"方法一： brac-就是“掰胳”。 想象两个人在桌边掰胳膊，两条 arm 顶在桌上一起用力。这个动作中最关键的身体部位，就是手臂。 所以以后看到 brac-，就先想到“掰胳膊时用 arm”。 所以brac-就是“手臂”。 方法二： 把BRAC按四个首字母记： B就是both，R就是reach，A就是arm，C就是close。 两条 arm 都向前 reach，再 close 到一起，就完成一个 hug。 这个动作中真正伸出、合拢并抱住人的部位，就是 arm。 所以以后看到brac-，就想到“两条 arm 向前伸，再合拢拥抱”。 所以brac-就是“手臂”。","mainWords":[{"word":"embrace","pos":"v.","detail":"构词: 构词: em(进入) + brac(手臂) + e<br>释义: 拥抱;包含","example":"例句: They embraced each other warmly. ｜ 推导: 进入 + 手臂 = 用手臂环抱,拥抱"},{"word":"brace","pos":"n.","detail":"构词: 构词: brac(手臂) + e<br>释义: 支架;v.支撑","example":"例句: Brace yourself for the impact. ｜ 推导: 手臂 = 像手臂一样的支撑物"},{"word":"bracket","pos":"n.","detail":"构词: 构词: brac(手臂) + ket(小词后缀)<br>释义: 括号;支架","example":"例句: Put the number in brackets. ｜ 推导: 手臂 + 小 = 像小手臂环抱的符号,括号"}],"extra":["bracelet n. 手镯（构词: brac + elet(小)）","embraceable a. 可拥抱的（构词: embrace + able）","bracing a. 令人振奋的（构词: brac + ing）","unbrace v. 放松（构词: un + brac + e）"]},{"id":115,"root":"col-/cult-","pronounce":"/kɒl/克奥勒","source":"拉丁语 colere","meaning":"耕种,居住,培养","mnemonic":"col-/cult是我们小学学过的词culture的一部分。culture除了文化，也有培养、栽培的意思；人长期耕种一块土地，才会在这里居住下来并培养出稳定的生活，所以col-/cult就是“耕种,居住,培养”的意思。","mainWords":[{"word":"colony","pos":"n.","detail":"构词: 构词: col(居住) + ony(名词后缀)<br>释义: 殖民地","example":"例句: The colony gained independence. ｜ 推导: 居住 + 地方 = 居住地,殖民地"},{"word":"colonial","pos":"a.","detail":"构词: 构词: colon(y) + ial(形容词后缀)<br>释义: 殖民的","example":"例句: The colonial period ended. ｜ 推导: 殖民地 + 形容词化 = 殖民的"},{"word":"agriculture","pos":"n.","detail":"构词: 构词: agri(田地) + cult(耕种) + ure<br>释义: 农业","example":"例句: Agriculture is vital for economy. ｜ 推导: 田地 + 耕种 + 名词化 = 农业"},{"word":"cultivate","pos":"v.","detail":"构词: 构词: cult(耕种) + iv + ate(动词后缀)<br>释义: 耕种;培养","example":"例句: Cultivate good habits early. ｜ 推导: 耕种 + 动词化 = 耕种,培养"},{"word":"culture","pos":"n.","detail":"构词: 构词: cult(培养) + ure(名词后缀)<br>释义: 文化;文明","example":"例句: Culture shapes our identity. ｜ 推导: 培养 + 名词化 = 培养的结果,文化"}],"extra":["cultural a. 文化的（构词: cult + ural）","cultivation n. 耕作;培养（构词: cultiv + ation）","colonize v. 殖民（构词: colon + ize）","cultivator n. 耕作者（构词: cultiv + ator）"]},{"id":116,"root":"dyn-","pronounce":"/daɪn/德爱恩","source":"希腊语 δύναμις","meaning":"力量,动力","mnemonic":"dyn就是“大能”。一个人有“大能”，就是有很强的力量；这种力量还能推动物体运动，形成动力。所以dyn就是“力量、动力”。","mainWords":[{"word":"dynamic","pos":"a.","detail":"构词: 构词: dyn(力量) + amic(形容词后缀)<br>释义: 动态的;有活力的","example":"例句: She has a dynamic personality. ｜ 推导: 力量 + 形容词化 = 充满活力的,动态的"},{"word":"dynasty","pos":"n.","detail":"构词: 构词: dyn(力量) + asty(统治)<br>释义: 王朝;朝代","example":"例句: The Ming dynasty lasted 276 years. ｜ 推导: 权力 + 统治 = 掌权的家族,王朝"}],"extra":["dynamo n. 发电机;精力充沛的人（构词: dyn + amo）","dynamite n. 炸药（构词: dyn + amite）","dynamics n. 动力学;动态（构词: dyn + amics）","dynastic a. 王朝的（构词: dyn + astic）","dynamism n. 活力;动态（构词: dyn + amism）","aerodynamic a. 空气动力学的（构词: aero + dyn）","hydrodynamic a. 流体动力学的（构词: hydro + dyn）","thermodynamic a. 热力学的（构词: thermo + dyn）","dynamometer n. 测力计（构词: dyn + ameter）","electrodynamics n. 电动力学（构词: electro + dyn）"]},{"id":117,"root":"electr-","pronounce":"/ɪˈlektr/衣勒诶克特儿","source":"希腊语 elektron","meaning":"电,电子","mnemonic":"electr就是“来电”。手机一来电，说明电流已经接通，电子正在运动；没有电，就不可能来电。所以electr就是“电、电子”的意思。","mainWords":[{"word":"electric","pos":"a.","detail":"构词: 构词: electr(电) + ic(形容词后缀)<br>释义: 电的","example":"例句: The electric car is popular. ｜ 推导: 电 + 形容词化 = 电的"},{"word":"electrical","pos":"a.","detail":"构词: 构词: electr + ical(形容词后缀)<br>释义: 电的,电学的","example":"例句: He studies electrical engineering. ｜ 推导: 电 + 学科形容词化 = 电学的"},{"word":"electricity","pos":"n.","detail":"构词: 构词: electr + icity(名词后缀)<br>释义: 电","example":"例句: We need electricity to live. ｜ 推导: 电 + 名词化 = 电力"},{"word":"electronic","pos":"a.","detail":"构词: 构词: electron + ic<br>释义: 电子的","example":"例句: Electronic devices are everywhere. ｜ 推导: 电子 + 形容词化 = 电子的"},{"word":"electron","pos":"n.","detail":"构词: 构词: electr + on(粒子后缀)<br>释义: 电子","example":"例句: Electrons orbit the nucleus. ｜ 推导: 电 + 粒子 = 电子"},{"word":"electrician","pos":"n.","detail":"构词: 构词: electr + ician(职业后缀)<br>释义: 电工","example":"例句: Call an electrician to fix it. ｜ 推导: 电 + 职业后缀 = 电工"}],"extra":["electrode n. 电极（构词: electr + ode(路径)）","electromagnet n. 电磁铁（构词: electro + magnet）","electrify v. 使电气化（构词: electr + ify(使...)）","electronics n. 电子学（构词: electron + ics）","electrolysis n. 电解（构词: electro + lysis(分解)）"]},{"id":118,"root":"-hol-","pronounce":"/həʊl/赫欧勒","source":"古英语 hol","meaning":"空的,洞","mnemonic":"hol就是“喉洞”。 喉部像一个中空的洞，所以表示空的和洞。 所以hol就是“空的、洞”。","mainWords":[{"word":"hole","pos":"n.","detail":"构词: 构词: hol(空) + e<br>释义: 洞;孔","example":"例句: There's a hole in my pocket. ｜ 推导: 空 + 名词化 = 空的地方,洞"},{"word":"hollow","pos":"a.","detail":"构词: 构词: hol(空) + low<br>释义: 空心的 n.洞","example":"例句: The tree trunk is hollow. ｜ 推导: 空 + 形容词化 = 空心的,中空的"}],"extra":["holey a. 有洞的,多洞的（构词: hole + y）","hollowness n. 空洞,空虚（构词: hollow + ness）","hollowed a. 挖空的（构词: hollow + ed）"]},{"id":119,"root":"mag-","pronounce":"/mæg/麦格","source":"拉丁语 magnus","meaning":"大,伟大","mnemonic":"MAG可以记成Make A Giant。Make是使成为，A Giant是一个巨大的事物。把普通东西make成giant，就是把它变大；一个人的成就、建筑或影响大到giant级别，也会显得伟大、宏伟。所以mag就是“大、伟大”的意思。","mainWords":[{"word":"magnitude","pos":"n.","detail":"构词: 构词: mag(大) + nitude(名词后缀)<br>释义: 大小;重要性","example":"例句: The magnitude of the problem is huge. ｜ 推导: 大 + 名词化 = 大小,重要程度"},{"word":"magnify","pos":"v.","detail":"构词: 构词: mag(大) + nify(动词后缀,使...)<br>释义: 放大;夸大","example":"例句: The lens magnifies the image. ｜ 推导: 大 + 使动 = 使变大,放大"},{"word":"magnificent","pos":"a.","detail":"构词: 构词: mag(大) + nific(做) + ent<br>释义: 壮丽的;宏伟的","example":"例句: What a magnificent building! ｜ 推导: 大 + 做 + 形容词化 = 做得很大的,壮丽的"},{"word":"magistrate","pos":"n.","detail":"构词: 构词: mag(大) + istrate(官职后缀)<br>释义: 地方法官","example":"例句: The magistrate heard the case. ｜ 推导: 大 + 官职 = 有大权威的人,地方法官"}],"extra":["magnate n. 巨头;大亨（构词: mag + nate）","magnanimous a. 宽宏大量的（构词: mag + nanimous）","magnum n. 大瓶装;大威力（构词: mag + num）","magnification n. 放大（构词: mag + nification）"]},{"id":120,"root":"mag-/imag-","pronounce":"/ˈɪmɪdʒ/衣米吉","source":"拉丁语 imago","meaning":"形象,图像","mnemonic":"mag-/imag就是“image”。image会让人直接想到“形象”，由这个意思还可以继续推出图像，所以mag-/imag就是“形象,图像”的意思。","mainWords":[{"word":"image","pos":"n.","detail":"构词: 构词: imag(形象) + e<br>释义: 图像;形象","example":"例句: The company's image improved. ｜ 推导: 形象 = 图像,形象"},{"word":"imagine","pos":"v.","detail":"构词: 构词: imag(形象) + ine(动词后缀)<br>释义: 想象;设想","example":"例句: Can you imagine the scene? ｜ 推导: 形象 + 动词化 = 在脑中形成图像,想象"},{"word":"imagination","pos":"n.","detail":"构词: 构词: imag + in + ation(名词后缀)<br>释义: 想象力","example":"例句: Use your imagination! ｜ 推导: 想象 + 名词化 = 想象的能力,想象力"},{"word":"imaginary","pos":"a.","detail":"构词: 构词: imag + in + ary(形容词后缀)<br>释义: 想象的;虚构的","example":"例句: An imaginary friend. ｜ 推导: 想象 + 形容词化 = 想象中的,虚构的"},{"word":"imaginative","pos":"a.","detail":"构词: 构词: imag + in + ative(形容词后缀)<br>释义: 富有想象力的","example":"例句: She's very imaginative. ｜ 推导: 想象 + 形容词化 = 善于想象的,有想象力的"},{"word":"magic","pos":"n.魔术,魔(魅)力,巫术","detail":"构词: 构词: mag + -ic(与……有关的)<br>释义: a.有魔力的,魔术的","example":"推导: 核心词根「mag-/imag-」表示“形象,图像”，结合前后缀，可推出“n.魔术,魔(魅)力,巫术 a.有魔力的,魔术的”"}],"extra":[]},{"id":121,"root":"magnet","pronounce":"/ˈmæɡnɪt/麦格尼特","source":"希腊地名","meaning":"磁,磁性","mnemonic":"magnet就是“magnet”。magnet会让人直接想到“磁”，由这个意思还可以继续推出磁性，所以magnet就是“磁,磁性”的意思。","mainWords":[{"word":"magnet","pos":"n.","detail":"构词: 构词: magnet(磁石)<br>释义: 磁铁;磁石","example":"例句: The magnet attracts iron. ｜ 推导: 磁石 = 具有吸引力的石头"},{"word":"magnetic","pos":"a.","detail":"构词: 构词: magnet + ic(形容词后缀)<br>释义: 磁的;有磁性的","example":"例句: Earth has a magnetic field. ｜ 推导: 磁石 + 形容词化 = 磁性的"}],"extra":["magnetism n. 磁性;磁力（构词: magnet + ism）","magnetize v. 使磁化（构词: magnet + ize）","magnetization n. 磁化（构词: magnet + ization）","electromagnetic a. 电磁的 (electro + magnet + ic","demagnetize v. 去磁（构词: de + magnet + ize）","magneto n. 磁电机（构词: magnet + o）","magnetometer n. 磁力计（构词: magnet + o + meter）","magnetosphere n. 磁层（构词: magnet + o + sphere）","magnetite n. 磁铁矿（构词: magnet + ite(矿物后缀)）","nonmagnetic a. 非磁性的（构词: non + magnet + ic）"]},{"id":122,"root":"maid/maiden","pronounce":"/meɪd(n)/姆诶德恩","source":"古英语 mægden","meaning":"年轻女性,少女","mnemonic":"maid/maiden就是“妹的”。 “妹的”直接让人想到年轻女性和少女。 所以maid/maiden就是“年轻女性、少女”。","mainWords":[{"word":"maid","pos":"n.","detail":"释义: 女仆;少女","example":"例句: The maid cleaned the room. ｜ 推导: 年轻女性 → 女仆(职业化)"},{"word":"maiden","pos":"n.","detail":"释义: 少女 a.首次的","example":"例句: The ship's maiden voyage. ｜ 推导: 少女 → 首次的(纯洁、未经历的)"}],"extra":["maidenhood n. 少女时期（构词: maiden + hood）","maidenly a. 少女般的（构词: maiden + ly）","maidservant n. 女仆（构词: maid + servant）","handmaid n. 侍女（构词: hand + maid）","bridesmaid n. 伴娘（构词: bride + maid）","milkmaid n. 挤奶女工（构词: milk + maid）"]},{"id":123,"root":"maj-","pronounce":"/meɪdʒ/姆诶吉","source":"拉丁语 major","meaning":"更大的,主要的","mnemonic":"maj就是“迈巨步”。 迈出巨大的步子，会显得更大、更重要和主要。 所以maj就是“更大的、主要的”。","mainWords":[{"word":"major","pos":"a.","detail":"构词: 构词: maj(大) + or<br>释义: 主要的 n.专业","example":"例句: This is a major problem. ｜ 推导: 大的 = 主要的,重要的"},{"word":"majority","pos":"n.","detail":"构词: 构词: maj(大) + or + ity(名词后缀)<br>释义: 多数;大部分","example":"例句: The majority voted yes. ｜ 推导: 大的 + 状态 = 占大部分的状态,多数"},{"word":"majesty","pos":"n.","detail":"构词: 构词: maj(大) + esty(名词后缀)<br>释义: 威严;陛下","example":"例句: Her Majesty the Queen. ｜ 推导: 大的 + 名词化 = 宏大的气势,威严"},{"word":"magic","pos":"n.魔术,魔(魅)力,巫术","detail":"构词: 构词: mag + -ic(与……有关的)<br>释义: a.有魔力的,魔术的","example":"推导: 核心词根「maj-」表示“更大的,主要的”，结合前后缀，可推出“n.魔术,魔(魅)力,巫术 a.有魔力的,魔术的”"}],"extra":["majestic a. 雄伟的;威严的（构词: maj + estic）","mayor n. 市长（构词: maj + or）","majorette n. 乐队指挥（构词: maj + or + ette）","majuscule n. 大写字母（构词: maj + uscule）"]},{"id":124,"root":"max-","pronounce":"/mæks/麦克斯","source":"拉丁语 maximus","meaning":"最大的,最高的","mnemonic":"max就是“麦克斯最大档”。 设备调到最大档时，就是最大和最高。 所以max就是“最大的、最高的”。","mainWords":[{"word":"maximum","pos":"n.","detail":"构词: 构词: max(最大) + imum(名词后缀)<br>释义: 最大值 a.最大的","example":"例句: The maximum speed is 120 km/h. ｜ 推导: 最大 + 名词化 = 最大值,最大限度"},{"word":"climax","pos":"n.","detail":"构词: 构词: cli(爬) + max(最高点)<br>释义: 高潮;顶点","example":"例句: The story reached its climax. ｜ 推导: 爬 + 最高点 = 爬到最高点,高潮"}],"extra":["maximize v. 使最大化（构词: max + imize）","maximal a. 最大的（构词: max + imal）","climactic a. 高潮的（构词: cli + max + tic）","anticlimax n. 反高潮（构词: anti + climax）"]},{"id":125,"root":"mob-/mobil-","pronounce":"/məʊb/姆欧布","source":"","meaning":"移动,活动","mnemonic":"mob/mobil从小学词 move 联想：move 是移动，能够移动的东西就具有活动性。所以mob/mobil就是“移动、活动”。","mainWords":[{"word":"mobile","pos":"a.","detail":"构词: 构词: mobil(移动) + e<br>释义: 可动的;机动的","example":"例句: Mobile phones are everywhere. ｜ 推导: 移动 + 形容词化 = 可移动的,流动的"},{"word":"mob","pos":"n.","detail":"构词: 构词: mob(mobile的缩写)<br>释义: 暴民;乌合之众","example":"例句: An angry mob gathered outside. ｜ 推导: 易动的人群 = 容易被煽动的群众"},{"word":"automobile","pos":"n.","detail":"构词: 构词: auto(自己) + mobile(移动)<br>释义: 汽车","example":"例句: The automobile industry is huge. ｜ 推导: 自己 + 移动 = 自行移动的车辆"},{"word":"mobilize","pos":"v.","detail":"构词: 构词: mobil(移动) + ize(动词后缀)<br>释义: 动员;调动","example":"例句: Mobilize all available resources. ｜ 推导: 移动 + 使动化 = 使移动,调动"}],"extra":["mobility n. 流动性;机动性（构词: mobil + ity）","immobile a. 不动的（构词: im(不) + mobile）","mobilization n. 动员（构词: mobil + ization）","demobilize v. 复员（构词: de(去) + mobilize）"]},{"id":126,"root":"plat-","pronounce":"/plæt/普莱特","source":"希腊语 platýs","meaning":"平坦,平的","mnemonic":"plat是我们小学学过的词plate的一部分。 plate 就是“盘子、平板”。 盘子和平板最明显的共同特点就是表面平坦。 所以plat就是“平坦、平的”。","mainWords":[{"word":"plate","pos":"n.","detail":"构词: 构词: plat(平) + e<br>释义: 盘子;平板","example":"例句: Put the food on the plate. ｜ 推导: 平 = 平的器皿,盘子"},{"word":"platform","pos":"n.","detail":"构词: 构词: plat(平) + form(形状)<br>释义: 平台;站台","example":"例句: Wait on the platform. ｜ 推导: 平 + 形状 = 平坦的结构,平台"},{"word":"plateau","pos":"n.","detail":"构词: 构词: plat(平) + eau(法语后缀)<br>释义: 高原;停滞期","example":"例句: The Tibetan Plateau is vast. ｜ 推导: 平 + 后缀 = 平坦的高地,高原"}],"extra":["platinum n. 铂金（构词: plat + inum）","platter n. 大浅盘（构词: plat + ter）","platitude n. 陈词滥调（构词: plat + itude）","platelet n. 血小板（构词: plate + let）"]},{"id":127,"root":"-ploy-","pronounce":"/plɔɪ/普勒奥伊","source":"拉丁语 plicare","meaning":"折叠,使用","mnemonic":"ploy就是“铺”。布料铺开以前通常是折叠起来的，铺开就是把折叠的东西展开；把人手和工具铺开去做事，就是使用和运用，所以ploy就是“折叠,使用”的意思。","mainWords":[{"word":"employ","pos":"v.","detail":"构词: 构词: em(进入) + ploy(使用)<br>释义: 雇用;使用","example":"例句: They employ many workers. ｜ 推导: 进入 + 使用 = 投入使用,雇用"},{"word":"employee","pos":"n.","detail":"构词: 构词: employ + ee(被...的人)<br>释义: 雇员;员工","example":"例句: The employee works hard. ｜ 推导: 雇用 + 被动者 = 被雇用的人,雇员"},{"word":"employer","pos":"n.","detail":"构词: 构词: employ + er(做...的人)<br>释义: 雇主","example":"例句: The employer pays well. ｜ 推导: 雇用 + 主动者 = 雇用别人的人,雇主"},{"word":"employment","pos":"n.","detail":"构词: 构词: employ + ment(名词后缀)<br>释义: 就业;雇用","example":"例句: Full employment is the goal. ｜ 推导: 雇用 + 名词化 = 雇用状态,就业"},{"word":"unemployment","pos":"n.","detail":"构词: 构词: un(否定) + employment<br>释义: 失业","example":"例句: Unemployment rate is rising. ｜ 推导: 非 + 就业 = 没有就业,失业"},{"word":"exploit","pos":"v.","detail":"构词: 构词: ex(出) + ploit(使用)<br>释义: 利用;开发 n.功绩","example":"例句: Don't exploit the workers. ｜ 推导: 出 + 使用 = 充分展开使用,开发利用"}],"extra":["deploy v. 部署;展开（构词: de(向下) + ploy）","deployment n. 部署（构词: deploy + ment）","ploy n. 策略;计谋 (ploy)","exploitation n. 开发;剥削（构词: exploit + ation）","unemployed a. 失业的（构词: un + employ + ed）","employable a. 可雇用的（构词: employ + able）","redeploy v. 重新部署（构词: re + deploy）","misemploy v. 误用（构词: mis + employ）"]},{"id":128,"root":"pop-/popul-","pronounce":"/pɒp/普奥普","source":"拉丁语 populus","meaning":"人民,民众","mnemonic":"pop-/popul-是我们小学学过的词popular的一部分。 popular 的东西之所以流行，是因为有很多 people 喜欢、使用或讨论它。没有大量 people，就不会形成 popular。 所以从 popular 可以反推出 pop/popul 的核心是“人民、民众”。 所以pop-/popul-就是“人民、民众”。","mainWords":[{"word":"population","pos":"n.","detail":"构词: 构词: popul(人民) + ation(名词后缀)<br>释义: 人口;人民","example":"例句: The population is growing. ｜ 推导: 人民 + 集合 = 人民的总称,人口"},{"word":"popular","pos":"a.","detail":"构词: 构词: popul(人民) + ar(形容词后缀)<br>释义: 流行的;受欢迎的","example":"例句: This song is very popular. ｜ 推导: 人民 + 形容词化 = 人民喜爱的,流行的"},{"word":"pop","pos":"n.","detail":"构词: 构词: popular的缩写<br>释义: 流行音乐 a.流行的","example":"例句: I love pop music. ｜ 推导: popular的缩写 = 流行文化的代表"}],"extra":["populate v. 居住于;构成人口（构词: popul + ate）","popularity n. 流行;普及（构词: popular + ity）","populous a. 人口稠密的（构词: popul + ous）","populace n. 平民;大众（构词: popul + ace）"]},{"id":129,"root":"pract-","pronounce":"/prækt/普儿艾克特","source":"希腊语 praxis","meaning":"实践,做","mnemonic":"pract的后半部分完整保留小学词 act，act 就是做、行动。一个动作不能只停在想法里，而要真正动手并反复去做，才叫实践。所以pract就是“实践、做”。","mainWords":[{"word":"practice","pos":"n.","detail":"构词: 构词: pract(实践) + ice(名词后缀)<br>释义: 实践;练习","example":"例句: Practice makes perfect. ｜ 推导: 实践 + 名词化 = 练习,实践活动"},{"word":"practical","pos":"a.","detail":"构词: 构词: pract(实践) + ical(形容词后缀)<br>释义: 实用的;实际的","example":"例句: Find a practical solution. ｜ 推导: 实践 + 形容词化 = 注重实践的,实用的"},{"word":"practically","pos":"ad.","detail":"构词: 构词: practical + ly(副词后缀)<br>释义: 几乎;实际地","example":"例句: It's practically impossible. ｜ 推导: 实用的 + 副词化 = 实际地;几乎"},{"word":"practitioner","pos":"n.","detail":"构词: 构词: pract + ition + er(人)<br>释义: 从业者","example":"例句: A medical practitioner. ｜ 推导: 实践 + 行为 + 人 = 实践者,从业者"},{"word":"practise","pos":"v.","detail":"构词: 构词: pract(实践) + ise(动词后缀)<br>释义: 练习;实践(英式)","example":"例句: Practise your English daily. ｜ 推导: 实践 + 动词化 = 练习,实践"}],"extra":["practicing a. 执业的（构词: pract + ic + ing）","malpractice n. 渎职（构词: mal(坏) + practice）","impractical a. 不切实际的（构词: im(不) + practical）","practicable a. 可行的（构词: pract + icable）"]},{"id":130,"root":"psych-","pronounce":"/saɪk/斯爱克","source":"希腊语 ψυχή","meaning":"心灵,精神,灵魂","mnemonic":"PSYCH可以记成People See Your Changing Heart。People是人们，See是看见，Your是你的，Changing Heart就是不断变化的内心。能够看见、理解一个人不断变化的内心，就是在接触他的心理、精神和灵魂。所以psych就是“心灵、精神、灵魂”的意思。","mainWords":[{"word":"psychology","pos":"n.","detail":"构词: 构词: psych(心灵) + ology(学科)<br>释义: 心理学","example":"例句: She majors in psychology. ｜ 推导: 心灵 + 学科 = 研究心灵的学科,心理学"},{"word":"psychiatry","pos":"n.","detail":"构词: 构词: psych(心灵) + iatry(治疗)<br>释义: 精神病学","example":"例句: He works in psychiatry. ｜ 推导: 心灵 + 治疗 = 治疗心灵的医学,精神病学"}],"extra":["psychologist n. 心理学家（构词: psych + ologist）","psychiatrist n. 精神科医生（构词: psych + iatrist）","psychological a. 心理的（构词: psych + ological）","psyche n. 心灵,精神（构词: psych + e）","psychic a. 精神的;通灵的（构词: psych + ic）","psychopath n. 精神病患者（构词: psych + o + path）","psychotherapy n. 心理治疗（构词: psych + o + therapy) psychosis n.精神病 (psych + osis）","psychoanalysis n. 精神分析（构词: psych + o + analysis)psychedelic a.迷幻的 (psych + edelic）"]},{"id":131,"root":"sol-","pronounce":"/səʊl/斯欧勒","source":"拉丁语 solus","meaning":"单独的,唯一的","mnemonic":"sol就是“solo”。solo会让人直接想到“单独的”，由这个意思还可以继续推出唯一的，所以sol就是“单独的,唯一的”的意思。","mainWords":[{"word":"sole","pos":"a.","detail":"构词: 构词: sol(单独) + e<br>释义: 唯一的","example":"例句: She is the sole survivor. ｜ 推导: 单独 = 唯一的,仅有的"},{"word":"solo","pos":"n.","detail":"构词: 构词: sol(单独) + o<br>释义: 独奏 a.独自的","example":"例句: He performed a piano solo. ｜ 推导: 单独 + 名词化 = 独奏,独自表演"},{"word":"solitary","pos":"a.","detail":"构词: 构词: sol(单独) + it + ary(形容词后缀)<br>释义: 孤独的","example":"例句: He lives a solitary life. ｜ 推导: 单独 + 形容词化 = 孤独的,独居的"},{"word":"isolate","pos":"v.","detail":"构词: 构词: i(进入) + sol(单独) + ate<br>释义: 隔离;孤立","example":"例句: Isolate the infected patients. ｜ 推导: 进入 + 单独 + 动词化 = 使隔离"},{"word":"desolate","pos":"a.","detail":"构词: 构词: de(完全) + sol(单独) + ate<br>释义: 荒凉的","example":"例句: The town looks desolate. ｜ 推导: 完全 + 单独 + 形容词化 = 荒无人烟的"},{"word":"console","pos":"n.控制台，仪表板；落地柜","detail":"构词: 构词: con-(共同、一起) + sol + e(连接元音)<br>释义: vt.安慰，慰问","example":"推导: 核心词根「sol-」表示“单独的,唯一的”，结合前后缀，可推出“n.控制台，仪表板；落地柜 vt.安慰，慰问”"}],"extra":["solitude n. 孤独;独处（构词: sol + itude）","solely ad. 仅仅;单独地（构词: sol + e + ly）","isolation n. 隔离;孤立（构词: isolate + ion）","soloist n. 独奏者（构词: sol + o + ist）"]},{"id":132,"root":"solv-/solut-","pronounce":"/sɒlv/斯奥勒五","source":"","meaning":"松开,解决,释放","mnemonic":"solv-/solut就是“松了”。 把纠结松开后，问题得到解决，束缚也被释放。 所以solv-/solut就是“松开、解决、释放”。","mainWords":[{"word":"solve","pos":"v.","detail":"构词: 构词: solv(松开) + e<br>释义: 解决","example":"例句: We need to solve this problem. ｜ 推导: 松开 = 解开问题的结,解决"},{"word":"solution","pos":"n.","detail":"构词: 构词: solut(松开) + ion(名词后缀)<br>释义: 解决方案","example":"例句: Find the best solution. ｜ 推导: 松开 + 名词化 = 解决的方法"},{"word":"resolve","pos":"v.","detail":"构词: 构词: re(再) + solv(松开) + e<br>释义: 决心;解决","example":"例句: He resolved to change. ｜ 推导: 再 + 松开 = 再次解开,下定决心"},{"word":"resolution","pos":"n.","detail":"构词: 构词: re + solut + ion<br>释义: 决议;分辨率","example":"例句: New Year's resolution. ｜ 推导: 再 + 松开 + 名词化 = 决议,解析度"},{"word":"dissolve","pos":"v.","detail":"构词: 构词: dis(分开) + solv(松开) + e<br>释义: 溶解","example":"例句: Sugar dissolves in water. ｜ 推导: 分开 + 松开 = 完全松散开,溶解"},{"word":"absolute","pos":"a.","detail":"构词: 构词: ab(离开) + solut(松开) + e<br>释义: 绝对的","example":"例句: Absolute power corrupts. ｜ 推导: 离开 + 松开 = 完全释放的,绝对的"},{"word":"resolute","pos":"a.","detail":"构词: 构词: re + solut(松开) + e<br>释义: 坚决的","example":"例句: She remained resolute. ｜ 推导: 再 + 松开 = 解开犹豫,坚决的"},{"word":"soluble","pos":"a.","detail":"构词: 构词: solub(松开) + le(能...的)<br>释义: 可溶的","example":"例句: Salt is soluble in water. ｜ 推导: 松开 + 能够的 = 能够松开的,可溶的"}],"extra":[]},{"id":133,"root":"tach-","pronounce":"/tætʃ/泰吃","source":"","meaning":"固定,连接","mnemonic":"tach就是“他插”。把一块零件插到另一块上，两个东西就连接起来；插紧以后，它们又会被固定在一起。所以tach就是“固定、连接”。","mainWords":[{"word":"attach","pos":"v.","detail":"构词: 构词: at(朝向) + tach(固定)<br>释义: 附着;贴上;依附","example":"例句: Please attach the file to your email. ｜ 推导: 朝向 + 固定 = 连接上,附着"},{"word":"detach","pos":"v.","detail":"构词: 构词: de(脱离) + tach(固定)<br>释义: 分离;拆开;派遣","example":"例句: Detach the coupon before use. ｜ 推导: 脱离 + 固定 = 解除固定,分离"}],"extra":["attachment n. 附件;依附（构词: attach + ment）","detachment n. 分离;超脱（构词: detach + ment）","detachable a. 可拆卸的（构词: detach + able）","attached a. 附加的;依恋的（构词: attach + ed）","unattached a. 未固定的;单身的（构词: un + attached）","reattach v. 重新连接（构词: re + attach）"]},{"id":134,"root":"tele-","pronounce":"/teli/特诶利","source":"希腊语 tele","meaning":"远,远距离","mnemonic":"tele-可以记成“特离”。 “特离”就是离得特别远。两个人相隔很 far，不能面对面说话，只能借电话、电视或远距离设备传递声音和画面。 所以以后看到 tele，就想到“特别离得远”。 所以tele-就是“远、远距离”。","mainWords":[{"word":"telephone","pos":"n.","detail":"构词: 构词: tele(远) + phone(声音)<br>释义: 电话","example":"例句: I'll call you by telephone. ｜ 推导: 远 + 声音 = 传送远处声音的设备"},{"word":"telescope","pos":"n.","detail":"构词: 构词: tele(远) + scope(看)<br>释义: 望远镜","example":"例句: Look through the telescope. ｜ 推导: 远 + 看 = 看远处的仪器"},{"word":"telegraph","pos":"n.","detail":"构词: 构词: tele(远) + graph(写)<br>释义: 电报","example":"例句: Send a telegraph message. ｜ 推导: 远 + 写 = 远距离传送文字"},{"word":"telegram","pos":"n.","detail":"构词: 构词: tele + gram(书写)<br>释义: 电报","example":"例句: I received a telegram. ｜ 推导: 远 + 书写 = 远距离传送的文字"},{"word":"television","pos":"n.","detail":"构词: 构词: tele(远) + vision(看)<br>释义: 电视","example":"例句: Watch television tonight. ｜ 推导: 远 + 视觉 = 看远处画面的设备"}],"extra":["telecommunication n. 电信（构词: tele + communication)telepathy n.心灵感应 (tele + pathy(感觉)）","telecast n./v. 电视广播（构词: tele + cast(播)）","telemetry n. 遥测（构词: tele + metry(测量)）"]},{"id":135,"root":"vey","pronounce":"/veɪ/五诶","source":"拉丁语 via","meaning":"道路,路径","mnemonic":"vey可以直接想到我们小学学过的way。 way 就是“道路、路径”。 vey 可以借 way 的意思记住道路和路径。 所以vey就是“道路、路径”。","mainWords":[{"word":"survey","pos":"v.","detail":"构词: 构词: sur(在上方) + vey(道路)<br>释义: 调查;勘测 n.调查","example":"例句: We need to survey the market. ｜ 推导: 在上方 + 道路 = 从高处俯瞰道路,勘测"},{"word":"convey","pos":"v.","detail":"构词: 构词: con(共同) + vey(道路)<br>释义: 运输;传达","example":"例句: Words cannot convey my feelings. ｜ 推导: 共同 + 道路 = 沿同一路径运送,传递"}],"extra":["surveyor n. 测量员（构词: survey + or）","conveyance n. 运输工具（构词: convey + ance）","conveyor n. 传送带（构词: convey + or）","purvey v. 供应（构词: pur(向前) + vey）","purveyor n. 供应商（构词: purvey + or）"]},{"id":136,"root":"age","pronounce":"/eɪdʒ/诶吉","source":"拉丁语 aetas","meaning":"年龄,时期,时代","mnemonic":"age本身就是我们小学学过的age。 age 就是“年龄、时代”。 所以age就是“年龄、时期、时代”。","mainWords":[{"word":"age","pos":"n.","detail":"构词: 构词: age(年龄)<br>释义: 年龄;时代","example":"例句: What's your age? ｜ 推导: 年龄,时期"},{"word":"teenage","pos":"n.","detail":"构词: 构词: teen(13-19) + age(年龄)<br>释义: ⻘少年时期","example":"例句: During my teenage years. ｜ 推导: 十几岁 + 年龄 = ⻘少年时期"}],"extra":["agency n. 代理机构（构词: age(做) + ncy）","agenda n. 议程（构词: age(做) + nda）","agent n. 代理人（构词: age(做) + nt）","aged a. 年老的（构词: age + d）","aging n. 老化（构词: age + ing）","ageless a. 永恒的（构词: age + less）"]},{"id":137,"root":"all + one","pronounce":"/əˈloʊn/额勒欧恩","source":"","meaning":"完全只有一个","mnemonic":"all + one可以记成all one。 all 是“全部”，one 是“一个”。 全部只有一个，也就是单独一个；all one 连起来就是 alone。 所以all + one就是“完全只有一个”。","mainWords":[{"word":"alone","pos":"a./ad.","detail":"构词: 构词: all(完全) + one(一个)<br>释义: 单独的(地)","example":"例句: She lives alone in the city. ｜ 推导: 完全 + 一个 = 完全只有一个人,单独"},{"word":"lonely","pos":"a.","detail":"构词: 构词: lone(孤独) + ly(形容词后缀)<br>释义: 孤独的;寂寞的","example":"例句: He felt lonely without friends. ｜ 推导: 孤独 + 形容词化 = 感到孤独的,寂寞的"}],"extra":["lone a. 孤独的,单独的 (alone的缩略)","loner n. 独来独往的人（构词: lone + er）","loneliness n. 孤独,寂寞（构词: lonely + ness）","lonesome a. 寂寞的（构词: lone + some）","only a./ad. 唯一的(地)（构词: 源自one + ly）","solely ad. 单独地,仅仅（构词: sole + ly）"]},{"id":138,"root":"bas-","pronounce":"/beɪs/布诶斯","source":"希腊语 βάσις","meaning":"基础,底部","mnemonic":"bas就是我们平时说的“贝斯”。 贝斯是低音乐器；低处通常是底部，也用来支撑上层成为基础。 所以bas就是“基础、底部”。","mainWords":[{"word":"base","pos":"n.","detail":"构词: 构词: bas(基础) + e<br>释义: 基础;底部 v.以...为基础","example":"例句: The theory is based on facts. ｜ 推导: 基础 = 底部,根基"},{"word":"basic","pos":"a.","detail":"构词: 构词: bas(基础) + ic(形容词后缀)<br>释义: 基本的;基础的","example":"例句: Basic knowledge is important. ｜ 推导: 基础 + 性质 = 基础的,基本的"},{"word":"basis","pos":"n.","detail":"构词: 构词: bas(基础) + is<br>释义: 基础;根据","example":"例句: On the basis of evidence. ｜ 推导: 基础 + 名词化 = 基础,根据"},{"word":"database","pos":"n.","detail":"构词: 构词: data(数据) + base(基础)<br>释义: 数据库","example":"例句: Store information in a database. ｜ 推导: 数据 + 基础 = 数据的基础库"},{"word":"basement","pos":"n.","detail":"构词: 构词: base(底部) + ment(名词后缀)<br>释义: 地下室","example":"例句: The basement is used for storage. ｜ 推导: 底部 + 场所 = 建筑底层,地下室"}],"extra":["baseball n. 棒球（构词: base(垒) + ball）","baseline n. 基线（构词: base + line）","baseless a. 无根据的（构词: base + less）","debase v. 贬低（构词: de(向下) + base）"]},{"id":139,"root":"cab-","pronounce":"/kæb/卡布","source":"拉丁语 capanna","meaning":"小屋,封闭空间","mnemonic":"cab就是“cabin”。cabin会让人直接想到“小屋”，由这个意思还可以继续推出封闭空间，所以cab就是“小屋,封闭空间”的意思。","mainWords":[{"word":"cabin","pos":"n.","detail":"构词: 构词: cab(小屋) + in(内)<br>释义: 小屋;客舱","example":"例句: We stayed in a mountain cabin. ｜ 推导: 小屋 + 内 = 小屋,封闭的空间"},{"word":"cabinet","pos":"n.","detail":"构词: 构词: cabin(小屋) + et(小词后缀)<br>释义: 橱柜;内阁","example":"例句: The cabinet meets weekly. ｜ 推导: 小屋 + 小 = 小房间,密室→内阁"}],"extra":["cab n. 出租车;驾驶室 (cab)","cabbage n. 卷心菜（构词: cab(头) + bage）","cabana n. 海滨小屋（构词: cab + ana）","cabby n. 出租车司机（构词: cab + by）"]},{"id":140,"root":"change","pronounce":"/tʃeɪndʒ/吃诶恩吉","source":"古法语changer","meaning":"交换,改变","mnemonic":"方法一： 以后看到change，可以想象把旧物拿走，再换上一件新物：原来的状态被改变，两件东西的位置也发生交换。所以change就是“交换、改变”。 方法二： change本身就是我们小学学过的change。 change 就是“改变、变化”。 所以change就是“交换、改变”。","mainWords":[{"word":"change","pos":"v.","detail":"构词: 构词: 直接来自法语changer<br>释义: 改变 n.变化","example":"例句: Things change over time. ｜ 推导: 单向改变,从一种状态到另一种状态"},{"word":"exchange","pos":"v.","detail":"构词: 构词: ex(出) + change(换)<br>释义: 交换 n.交易所","example":"例句: They exchanged phone numbers. ｜ 推导: 出 + 换 = 双向交换,互相给予"}],"extra":["changeable a. 易变的（构词: change + able）","unchangeable a. 不变的（构词: un + changeable）","changing a. 变化的（构词: change + ing）","in
