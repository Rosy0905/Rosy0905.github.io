mple":"例句: He resisted the temptation to check his phone. ｜ 推导: 用诱因试探人的意志 = 诱惑"},{"word":"contempt","pos":"n.","detail":"构词: 构词: con-(加强) + tempt(轻视词族中的历史形式)<br>释义: 轻视，藐视；受辱，丢脸","example":"例句: She spoke with contempt for dishonest behavior. ｜ 推导: 把对象看得不值得尊重 = 轻视、蔑视"}],"extra":[]},{"id":598,"root":"","pronounce":"/ˈkaʊnsəl/克奥恩瑟勒","source":"拉丁语 concilium“会议、集会”，经古法语进入英语","meaning":"会议、议事机构","mnemonic":"cil就是“理事会，委员会，议事机构”。理事会，委员会，议事机构”的意思。所以cil就是“理事会，委员会，议事机构”的意思。","mainWords":[{"word":"council","pos":"n.","detail":"构词: 构词: 拉丁语 concilium(集会、会议)形成的整体词<br>释义: 理事会,委员会,议事机构","example":"例句: The city council discussed the transport plan. ｜ 推导: 多人聚在一起议事的机构 = 理事会、委员会"}],"extra":[]},{"id":604,"root":"","pronounce":"/tækt/泰克特","source":"① 希腊语 taktikos“安排有序的、战术的”；② 拉丁语 tangere/tactus“触碰、被触碰的”","meaning":"安排、战术；触碰","mnemonic":"tact就是下面这些熟词的首字母组合：T就是two，A就是arm，C就是come，T就是together。 Two arms come together：两条 arm 向中间靠拢，最后真正碰到一起。 这个画面最后就是两个物体发生接触。 所以tact就是“接触”。","mainWords":[{"word":"tactic","pos":"n.","detail":"构词: 构词: takt/tactic(安排、战术) + -ic<br>释义: 策略,战术","example":"例句: The coach changed his tactic after halftime. ｜ 推导: 为达到目标而安排的具体办法 = 策略、战术"},{"word":"intact","pos":"a.","detail":"构词: 构词: in-(不) + tact(触碰、破坏)<br>释义: 完整无缺的,未经触动的,未受损伤的","example":"例句: The package arrived intact. ｜ 推导: 没有被触碰破坏 = 完整无缺的"}],"extra":[]},{"id":605,"root":"pend-","pronounce":"/pend/普诶恩德","source":"拉丁语 pendere“悬挂”","meaning":"悬挂；依靠、取决于","mnemonic":"pend完整保留在小学学过的spend中。 spend 就是花费 money。 花钱以前，人往往先 count 一下、衡量一下够不够，因此又能把“花费”和“称量、权衡”连在一起。 所以pend就是“称量花费”。","mainWords":[{"word":"dependent","pos":"a.","detail":"构词: 构词: de-(向下) + pend(悬挂) + -ent<br>释义: 依靠的,依赖的,从属的;随…而定的","example":"例句: Young children are dependent on their parents. ｜ 推导: 像悬挂物一样依靠支点 = 依赖的"}],"extra":[]},{"id":612,"root":"prehend-/prehens-/pris-","pronounce":"/prɪˈhend/普里赫诶恩德；/prɪˈhens/普里赫诶恩斯；/priːz/普里兹","source":"拉丁语 prehendere“抓住”及古法语 pris“拿取的”","meaning":"抓住、拿取；包含、理解","mnemonic":"pris就是下面这些熟词的首字母组合：P就是pull，R就是reach，I就是into，S就是something。 手先 reach into something，再 pull 出来，动作就是表示、拿住。 所以pris就是“抓”。","mainWords":[{"word":"comprise","pos":"vt.","detail":"构词: 构词: com-(共同) + pris(拿取、包括) + -e<br>释义: 包含，包括，由...组成；构成，组成","example":"例句: The course comprises six modules. ｜ 推导: 把多个部分共同拿进整体 = 包含、组成"}],"extra":[]},{"id":614,"root":"","pronounce":"/pɒn/普奥恩；/ˈpɒzɪt/普奥兹衣特；/ˈkuːpɒn/克乌普奥恩","source":"① 拉丁语 ponere“放置” / positus“已放置的”；② 法语 coupon“切下的小票”","meaning":"放置、组成；优惠券、票证","mnemonic":"pon就是下面这些熟词的首字母组合：P就是put，O就是on，N就是near。 把东西 put on 某处，或 put near 某物，动作都是放置。 所以pon就是“放置”。","mainWords":[{"word":"component","pos":"n./a.","detail":"构词: 构词: com-(共同) + pon(放置) + -ent<br>释义: 组成部分,成分,元件；组成的,合成的","example":"例句: Each component has a specific function. ｜ 推导: 被共同放入整体的部分 = 组成部分、元件"},{"word":"coupon","pos":"n.","detail":"构词: 构词: 法语 coupon(切下的小票)形成的整体词<br>释义: 证明持券人有某种权利的卡片，票证，赠券","example":"例句: I used a coupon to get a discount. ｜ 推导: 从票据上切下、可兑换权益的小票 = 优惠券、票证"}],"extra":[]},{"id":615,"root":"","pronounce":"/fɪt/夫衣特；/ˈprɒfɪt/普儿奥夫衣特","source":"① 古英语、古北欧语中表示“合适、配备”的 fit；② 拉丁语 profectus“进展、收益”经法语形成 profit","meaning":"合适、配备；利润、收益","mnemonic":"fit就是“benefit”。benefit会让人直接想到“利益好处”，所以fit就是“利益好处”的意思。","mainWords":[{"word":"outfit","pos":"n./v.","detail":"构词: 构词: out-(完整配出) + fit(配备)<br>释义: 全套装备,用具；配备","example":"例句: The rescue team wore protective outfits. ｜ 推导: 为某项活动完整配备的一套物品 = 全套装备"},{"word":"profitable","pos":"a.","detail":"构词: 构词: profit(利润、收益) + -able<br>释义: 有利可图的,有益的","example":"例句: The new service became profitable within a year. ｜ 推导: 能够产生利润或好处 = 有利可图的、有益的"}],"extra":[]},{"id":616,"root":"estim-/aestim-","pronounce":"/ˈestɪm/诶斯提姆","source":"拉丁语 aestimare“估价、判断价值”","meaning":"估计、估价、评估","mnemonic":"stim就是“estimate”。estimate会让人直接想到“估计”，由这个意思还可以继续推出估价；评估，所以stim就是“估计，估价；评估”的意思。","mainWords":[{"word":"estimate","pos":"v./n.","detail":"构词: 构词: estim(估价、评估) + -ate<br>释义: 估计,估价;评估","example":"例句: We estimated the cost before starting the work. ｜ 推导: 先判断价值或数量 = 估计、评估"}],"extra":[]},{"id":617,"root":"rect-","pronounce":"/rekt/儿诶克特","source":"拉丁语 regere“引导、使直” / rectus“直的”","meaning":"直、正；纠正、竖立","mnemonic":"rect就是下面这些熟词的首字母组合：R就是right，E就是same，C就是clear，T就是true。 一条线若方向 right、两边 same、界限 clear，结果就 true、正确。 rect 表示“正确的、直的”。 所以rect就是“正确的直的”。","mainWords":[{"word":"erect","pos":"v./a.","detail":"构词: 构词: e-/ex-(向外、向上) + rect(直)<br>释义: 树立,建立,使竖立；直立的,垂直的","example":"例句: They erected a temporary shelter. ｜ 推导: 使物体向上变直 = 竖立、建立"},{"word":"rectify","pos":"v.","detail":"构词: 构词: rect(正、直) + -ify(使成为)<br>释义: 纠正,整顿, [化]精馏","example":"例句: The company acted quickly to rectify the error. ｜ 推导: 使错误回到正确状态 = 纠正、整顿"}],"extra":[]},{"id":618,"root":"","pronounce":"/ˈsɜːdʒəri/瑟吉额儿衣","source":"希腊语 kheirourgia“手工操作、外科手术”，经法语进入英语","meaning":"外科、手术","mnemonic":"surge就是下面这些熟词的首字母组合：S就是sea，U就是up，R就是rise，G就是go，E就是everywhere。 海水突然 rise up，并 go everywhere，就是向上涌起。 surge 表示“上升、起立、涌起”。 所以surge就是“上升起立”。","mainWords":[{"word":"surgery","pos":"n.","detail":"构词: 构词: 希腊语 kheirourgia(手工操作、手术)形成的整体词<br>释义: 外科,外科学;手术室,诊疗室","example":"例句: She recovered well after surgery. ｜ 推导: 医生用手和器械进行治疗操作 = 外科手术"}],"extra":[]},{"id":620,"root":"limin-/lim-","pronounce":"/ˈlɪmɪn/利米恩；/lɪm/利姆","source":"拉丁语 limen，所有格 liminis“门槛、界限”","meaning":"门槛、界限；移出界外","mnemonic":"lim limin从limit和preliminary来记。limit是界限，越过界限的东西会被除去或淘汰；preliminary是预备的、初步的，表示正式开始前的阶段。所以lim limin就是“t.除去；淘汰；预备的，初步的”的意思。","mainWords":[{"word":"eliminate","pos":"vt.","detail":"构词: 构词: e-/ex-(移出) + limin(门槛、界限) + -ate<br>释义: 除去;淘汰;排(删,消)除;削减(人员)","example":"例句: The new filter eliminates harmful particles. ｜ 推导: 把对象移出界限之外 = 除去、淘汰"},{"word":"preliminary","pos":"a.","detail":"构词: 构词: pre-(在前) + limin(门槛、开端) + -ary<br>释义: 预备的,初步的","example":"例句: The team released a preliminary report. ｜ 推导: 位于正式阶段门槛之前 = 初步的、预备的"}],"extra":[]},{"id":621,"root":"firm-","pronounce":"/fɜːm/佛姆","source":"拉丁语 firmus“坚固的、稳定的”","meaning":"坚固、坚定；确认","mnemonic":"firm本身就是小学学过的词。 firm 表示坚固、坚定；东西变 firm 就不容易动摇。 因此可以直接记住“巩固、确定”。 所以firm就是“巩固确定”。","mainWords":[{"word":"affirm","pos":"vt.","detail":"构词: 构词: af-/ad-(加强) + firm(坚定)<br>释义: 断言，坚持声称；肯定；证实,确认；","example":"例句: The court affirmed the earlier decision. ｜ 推导: 把某个判断说得坚定可靠 = 肯定、证实"}],"extra":[]},{"id":622,"root":"wit-/witness-","pronounce":"/wɪt/威特；/ˈwɪtnəs/威特恩斯","source":"古英语 wit“知识、理解” / witnes“证言、证人”","meaning":"知道、见证；证人、证据","mnemonic":"wit就是“wait”。wait会让人直接想到“思考”，所以wit就是“思考”的意思。","mainWords":[{"word":"witness","pos":"n./v.","detail":"构词: 构词: wit(知道、看见) + -ness(人或状态)<br>释义: 目击者,证人,证据；目击,作证","example":"例句: A witness described what happened at the scene. ｜ 推导: 亲眼知道事情经过的人 = 目击者、证人"}],"extra":[]},{"id":625,"root":"crimin-","pronounce":"/ˈkrɪmɪn/克里米恩","source":"拉丁语 crimen“判断、指控、罪名”","meaning":"区分、判断；指控、罪","mnemonic":"crimin就是小学学过的crime。 crimin 比 crime 只多出少量字母，而 crime 就是罪、犯罪。 所以以后看到 crimin，就先表示 crime 的“罪”。 所以crimin就是“罪”。","mainWords":[{"word":"discriminate","pos":"v.","detail":"构词: 构词: dis-(分开) + crimin(判断) + -ate<br>释义: 区别,辨别;(against)有差别地对待,歧视","example":"例句: The test can discriminate between the two materials. ｜ 推导: 通过判断把对象分开 = 区别、辨别"}],"extra":[]},{"id":628,"root":"ced-/ceed-/cess-","pronounce":"/siːd/斯衣德；/ses/瑟死","source":"拉丁语 cedere“走、退让” / cessus“已走开、已退让”","meaning":"走、前进；退让","mnemonic":"ceed就是小学学过的speed，把开头 sp 换成 c 就能以后看到相近结构。 有 speed 就会 go on，不断向前行进。 因此 ceed 表示“行走、前进”。 所以ceed就是“行走前进”。","mainWords":[{"word":"proceed","pos":"v.","detail":"构词: 构词: pro-(向前) + ceed(走)<br>释义: 进行,继续下去;发生","example":"例句: Please proceed to the next room. ｜ 推导: 继续向前走 = 进行、继续"},{"word":"exceed","pos":"v.","detail":"构词: 构词: ex-(越出) + ceed(走)<br>释义: 超过,胜过;越出","example":"例句: The final cost exceeded the budget. ｜ 推导: 走出原定界限 = 超过、越出"},{"word":"exceedingly","pos":"ad.","detail":"构词: 构词: exceed(超过) + -ing + -ly<br>释义: 极端地,非常","example":"例句: The task was exceedingly difficult. ｜ 推导: 程度超过通常水平 = 极端地、非常"},{"word":"proceeding","pos":"n.","detail":"构词: 构词: proceed(进行) + -ing<br>释义: 行动,进行；诉讼程序；会议录","example":"例句: The legal proceeding lasted several weeks. ｜ 推导: 正在向前进行的正式行动 = 诉讼程序、进行"}],"extra":[]},{"id":631,"root":"therap-","pronounce":"/ˈθerəp/斯诶儿额普","source":"希腊语 therapeia“照料、治疗”","meaning":"照料、治疗","mnemonic":"therap就是下面这些熟词的首字母组合：T就是take，H就是help，E就是every，R就是rest，A就是aid，P就是person。 病人 take help，充分 rest，every 一次 aid 都让 person 逐步好转。 therap 表示“治疗”。 所以therap就是“治疗”。","mainWords":[{"word":"therapy","pos":"n.","detail":"构词: 构词: therap(治疗、照料) + -y<br>释义: 治疗,疗法","example":"例句: Physical therapy helped him walk again. ｜ 推导: 通过专业照料恢复身体功能 = 治疗"}],"extra":[]},{"id":632,"root":"","pronounce":"/ˈeɪbəl/诶伯勒","source":"古法语 -able，源自拉丁语 -abilis","meaning":"能够、可以；有能力","mnemonic":"able本身就是我们小学学过的词，意思是能够、有本事。所以able就是“有本事的”的意思。","mainWords":[{"word":"enable","pos":"v.","detail":"构词: 构词: en-(使进入某状态) + able(能够)<br>释义: 使能够,使成为可能;授予权利或方法","example":"例句: The new tool enables users to work faster. ｜ 推导: 使人进入能够做某事的状态 = 使能够"},{"word":"disable","pos":"vt.","detail":"构词: 构词: dis-(取消、使失去) + able(能力)<br>释义: 使残废;使失去能力;丧失能力","example":"例句: The accident disabled the control system. ｜ 推导: 使原有能力失效 = 使失去能力"}],"extra":[]},{"id":633,"root":"scrib-/script-","pronounce":"/skrɪb/斯克里布；/skrɪpt/斯克里普特","source":"拉丁语 scribere“写” / scriptus“写下的”","meaning":"写、书写","mnemonic":"script就是下面这些熟词的首字母组合：S就是see，C就是can，R就是read，I就是it，P就是put，T就是there。 一段内容被 write 下来以后，别人就能 see it、read it，而且它会一直被 put there，不会像口头声音一样马上消失。 这个场景最核心的动作，就是把内容写下来、留下文字。 所以script就是“写”。","mainWords":[{"word":"prescription","pos":"n.","detail":"构词: 构词: pre-(预先) + script(写) + -ion<br>释义: 药方,处方","example":"例句: The pharmacist checked the prescription. ｜ 推导: 医生预先写下的用药指示 = 处方"}],"extra":[]},{"id":634,"root":"","pronounce":"/trænz/特拉恩兹；/trɑːns/特儿啊恩斯","source":"拉丁语 trans“越过、在另一边”","meaning":"越过、转移、转换","mnemonic":"trans就是小学学过的train，只需调整结尾字母。 train 会把人 across 很远的 place，也会让人从一个 place change 到另一个 place。 因此 trans 表示“横过、转移、变换”。 所以trans-就是“横过越过变换转移”。","mainWords":[{"word":"transition","pos":"n.","detail":"构词: 构词: trans-(跨越、转换) + -ition<br>释义: 转变，变迁，过渡(时期)","example":"例句: The company is making a transition to clean energy. ｜ 推导: 从一种状态跨到另一种状态 = 转变、过渡"}],"extra":[]},{"id":636,"root":"ple-/plen-","pronounce":"/pliː/普利；/plen/普勒诶恩","source":"拉丁语 plere“装满” / plenus“满的”","meaning":"填满、补足、完整","mnemonic":"ple就是下面这些熟词的首字母组合：P就是put，L就是lot，E就是everything。 不断 put，放入 lot of everything，空处就会被填满。 所以ple就是“满的填满”。","mainWords":[{"word":"implement","pos":"n./v.","detail":"构词: 构词: im-/in-(进入) + ple(填满、完成) + -ment<br>释义: 工具,器具；贯彻,实施","example":"例句: The school implemented a new safety policy. ｜ 推导: 把计划填充到实际行动中 = 贯彻、实施"},{"word":"supplement","pos":"n./v.","detail":"构词: 构词: sup-/sub-(补在后面) + ple(填满) + -ment<br>释义: 补遗,增刊,附录；补充","example":"例句: The guide includes a supplement with new data. ｜ 推导: 补上缺少部分使内容更完整 = 补充、增刊"},{"word":"complement","pos":"n./v.","detail":"构词: 构词: com-(共同) + ple(填满) + -ment<br>释义: 补足物；补充,补足","example":"例句: The two skills complement each other. ｜ 推导: 两个部分共同补足整体 = 补充、补足"}],"extra":[]},{"id":638,"root":"ag-/agit-","pronounce":"/æɡ/艾格；/ˈædʒɪt/艾吉特","source":"拉丁语 agere“驱动、做” / agitare“反复推动”","meaning":"推动、搅动；使激动","mnemonic":"git就是“激”。激本身就是“激动”的意思，所以git就是“激动”的意思。","mainWords":[{"word":"agitate","pos":"v.","detail":"构词: 构词: agit(反复推动、搅动) + -ate<br>释义: 摇动(液体)；使焦虑不安；困扰；鼓动","example":"例句: Agitate the mixture before use. ｜ 推导: 反复推动使液体或情绪动起来 = 搅动、鼓动"}],"extra":[]},{"id":639,"root":"","pronounce":"/ɪnˈhɑːns/衣恩赫啊恩斯","source":"古法语 enhauncer“提高、抬高”","meaning":"提高、增强","mnemonic":"hance就是“夯实”。夯实基础，就是把基础加强、增强；夯实信任，也就是加强信任。所以hance就是“加强”的意思。","mainWords":[{"word":"enhance","pos":"v.","detail":"构词: 构词: 古法语 enhauncer(提高)形成的整体词<br>释义: 提高,增强","example":"例句: Good lighting can enhance the image. ｜ 推导: 把效果抬到更高水平 = 提高、增强"}],"extra":[]},{"id":640,"root":"","pronounce":"/əˈbændən/额拜恩德恩","source":"古法语 abandoner“交付控制、放弃”","meaning":"放弃、抛弃","mnemonic":"don就是下面这些熟词的首字母组合：D就是do，O就是offer，N就是now。 do an offer now，就是现在把东西给出去。 don 表示“给、赠予”。 所以don就是“给”。","mainWords":[{"word":"abandon","pos":"vt.","detail":"构词: 构词: 古法语 abandoner(放弃控制)形成的整体词<br>释义: 丢弃；抛弃；放弃","example":"例句: They abandoned the damaged vehicle. ｜ 推导: 不再控制或保留对象 = 丢弃、放弃"}],"extra":[]},{"id":641,"root":"pauper-/pover-","pronounce":"/ˈpɔːpə/颇珀；/ˈpɒvə/普奥五额","source":"拉丁语 pauper“贫穷的”，经法语形成 poverty","meaning":"贫穷、缺乏","mnemonic":"pov就是下面这些熟词的首字母组合：P就是poor，O就是our，V就是village。 poor our village 描绘的就是缺少资源、生活贫困的状态。 pov 表示“贫穷、贫困”。 所以pov就是“贫穷，贫困”。","mainWords":[{"word":"poverty","pos":"n.","detail":"构词: 构词: pover(贫穷) + -ty<br>释义: 贫穷,贫困","example":"例句: Education can help reduce poverty. ｜ 推导: 缺少生活所需资源的状态 = 贫穷"}],"extra":[]},{"id":642,"root":"mens-/metr-","pronounce":"/menz/姆诶恩兹；/ˈmiːtr/米特儿","source":"拉丁语 metiri“测量” / mensus“已测量的”","meaning":"测量、尺度、尺寸","mnemonic":"dim就是下面这些熟词的首字母组合：D就是distance，I就是in，M就是map。 map 上的 distance 能表示长、宽和范围。 dim 表示“尺寸、尺度、维度”。 所以dim就是“尺寸，尺度；维(数)，度(数”。","mainWords":[{"word":"dimension","pos":"n.","detail":"构词: 构词: di-(分开、不同方向) + mens(测量) + -ion<br>释义: 尺寸,尺度;维(数),度(数)","example":"例句: Measure each dimension of the box. ｜ 推导: 沿不同方向测量得到的数值 = 尺寸、维度"}],"extra":[]},{"id":643,"root":"ordin-","pronounce":"/ˈɔːdɪn/奥迪恩","source":"拉丁语 ordo，所有格 ordinis“次序、等级”","meaning":"次序、等级；规则","mnemonic":"ordin从我们学过的order来记。order就是顺序、秩序和命令；普通的东西就是按照共同秩序排列的，coordinate又表示同等并列、互相协调，subordinate则表示处在下面的次级位置。所以ordin/muni表示“普通、平常；同等、协调；次要、从属”等意思。","mainWords":[{"word":"extraordinary","pos":"a.","detail":"构词: 构词: extra-(超出) + ordin(通常次序) + -ary<br>释义: 非常的;格外的;意外的;离奇的;临时的","example":"例句: She showed extraordinary courage. ｜ 推导: 超出普通次序和水平 = 非常的、非凡的"},{"word":"subordinate","pos":"a.","detail":"构词: 构词: sub-(在下) + ordin(等级、次序) + -ate<br>释义: 次要的,从属的,下级的","example":"例句: The branch office is subordinate to the head office. ｜ 推导: 在组织等级中处于下方 = 从属的、下级的"}],"extra":[]},{"id":644,"root":"sever-/vere-","pronounce":"/ˈsevər/瑟五额儿；/vɪə/五伊儿","source":"拉丁语 severus“严肃的、坚定的”","meaning":"严肃、坚定；坚持","mnemonic":"vere就是“畏儿”。畏儿会让人直接想到“敬畏”，所以vere就是“敬畏”的意思。","mainWords":[{"word":"persevere","pos":"v.","detail":"构词: 构词: per-(贯穿、坚持到底) + sever/vere(坚定)<br>释义: 坚持,坚忍,不屈不挠","example":"例句: She persevered despite repeated failures. ｜ 推导: 始终保持坚定并坚持到底 = 坚忍不拔"}],"extra":[]},{"id":646,"root":"cruc-","pronounce":"/kruːs/克儿乌斯","source":"拉丁语 crux，所有格 crucis“十字架、关键点”","meaning":"十字、关键、决定性","mnemonic":"把CRUC按字母记成：C就是cross，R就是road，U就是up，最后一个 C 再次提醒 cross。 一条 road 横着，另一条 road 向 up 延伸，两者交叉就形成十字。 所以cruc就是“十字交叉”。","mainWords":[{"word":"crucial","pos":"a.","detail":"构词: 构词: cruc(关键交叉点) + -ial<br>释义: 至关重要的,决定性的","example":"例句: Clear communication is crucial to the project. ｜ 推导: 位于决定成败的关键点 = 至关重要的"}],"extra":[]},{"id":647,"root":"sta-/stant-","pronounce":"/stɑː/斯特啊；/stænt/斯泰恩特","source":"拉丁语 stare“站立” / stans“站着的”","meaning":"站立、保持；存在","mnemonic":"stant和小学学过的stand非常接近，只需要把结尾 d 换成 t。 stand 就是站立。 因此以后看到 stant，先恢复成熟词 stand，就能记住“站、立”。 所以stant就是“站立”。","mainWords":[{"word":"substantial","pos":"a.","detail":"构词: 构词: sub-(在下、基础) + stant(站立、存在) + -ial<br>释义: 实质的;相当的;显著的;坚固的;富裕的","example":"例句: The project requires substantial investment. ｜ 推导: 有坚实基础并具有较大分量 = 实质的、显著的"}],"extra":[]},{"id":649,"root":"put-/putat-","pronounce":"/pjuːt/普耶乌特；/ˈpjuːtæt/普耶乌泰特","source":"拉丁语 putare“计算、考虑、评定”","meaning":"计算、评定；指派","mnemonic":"put本身就是我们小学学过的put，意思是放、放置。把东西put进里面，就是输入；把人put到某个位置，就是安排和任命。所以put作为词根时就是“放”的意思。","mainWords":[{"word":"deputy","pos":"n.","detail":"构词: 构词: de-(分派、向下委任) + put(评定、指派) + -y<br>释义: 代理人,代表 a.副的,代理的","example":"例句: The deputy acted for the manager. ｜ 推导: 被指派代替上级履行职责的人 = 代理人、副职"},{"word":"reputation","pos":"n.","detail":"构词: 构词: re-(反复、广泛) + putat(评价) + -ion<br>释义: 名誉,名声,声望","example":"例句: The restaurant has a strong reputation for quality. ｜ 推导: 公众反复形成的评价 = 名誉、声望"}],"extra":[]},{"id":650,"root":"","pronounce":"/kənˈsʌlt/克恩斯阿勒特；/sʌlt/斯阿勒特","source":"① 拉丁语 consulere“商议、征求意见”；② 拉丁语 salire“跳” / saltus“跳出的”","meaning":"咨询、商议；跳出、冲向、结果","mnemonic":"sult就是“臊”。臊会让人直接想到“羞辱”，所以sult就是“羞辱”的意思。","mainWords":[{"word":"consultant","pos":"n.","detail":"构词: 构词: consult(商议、咨询) + -ant(人)<br>释义: 顾问,会诊医师","example":"例句: The consultant suggested a simpler design. ｜ 推导: 提供专业意见的人 = 顾问"},{"word":"consult","pos":"v.","detail":"构词: 构词: 拉丁语 consulere(商议)形成的整体词<br>释义: 请教,咨询,商量；查阅","example":"例句: We consulted an expert before making the decision. ｜ 推导: 与他人共同商议并寻求意见 = 咨询、请教"},{"word":"insult","pos":"vt./n.","detail":"构词: 构词: in-(冲向) + sult(跳、冲)<br>释义: 侮辱,凌辱","example":"例句: His rude comment insulted the audience. ｜ 推导: 把冒犯性言语冲向别人 = 侮辱"},{"word":"resultant","pos":"a.","detail":"构词: 构词: result(结果) + -ant<br>释义: 作为结果而发生的;合成的","example":"例句: The resultant force points upward. ｜ 推导: 由多个因素共同产生的结果 = 作为结果发生的"}],"extra":[]},{"id":651,"root":"man-/main-/perman-","pronounce":"/mæn/麦恩；/meɪn/姆诶恩；/ˈpɜːmən/珀姆恩","source":"拉丁语 manere“停留、保持”","meaning":"停留、保持；持久","mnemonic":"perman就是“颇慢”。颇慢会让人直接想到“非常慢”，所以perman就是“非常慢”的意思。","mainWords":[{"word":"permanent","pos":"a.","detail":"构词: 构词: per-(贯穿、持续) + man(停留) + -ent<br>释义: 永久的,持久的","example":"例句: The bridge needs a permanent repair. ｜ 推导: 始终停留而不改变 = 永久的、持久的"}],"extra":[]},{"id":652,"root":"","pronounce":"/raɪz/儿爱兹；/əˈraɪz/额儿爱兹","source":"古英语 risan“上升、出现”","meaning":"上升、出现、发生","mnemonic":"ise就是“忆事”。把事情记在脑子里，就是记住；事情被不断回忆，就不容易忘掉。所以ise就是“记住”的意思。","mainWords":[{"word":"arise","pos":"v.","detail":"构词: 构词: a-(向上、出现) + rise(上升)<br>释义: 出现，发生；(from)由…引起，由…产生","example":"例句: New problems may arise during testing. ｜ 推导: 像物体升起一样出现 = 发生、产生"}],"extra":[]},{"id":653,"root":"ger-/gest-","pronounce":"/dʒer/杰儿；/dʒest/杰斯特","source":"拉丁语 gerere“携带、进行” / gestus“已携带的”","meaning":"携带、进行；消化、表达","mnemonic":"gest从gesture和digest来记。gesture是姿势、手势，也可以用来表示意见；digest既是消化，也表示把内容领会以后整理成摘要。所以gest就是“建议，意见；细微的迹象；姿势，姿态，手势v.做手势；t.消化；领会，融会贯通n.文摘，摘要”的意思。","mainWords":[{"word":"digest","pos":"vt.","detail":"构词: 构词: di-(分开处理) + gest(携带、进行)<br>释义: 消化；领会，融会贯通 n.文摘，摘要","example":"例句: The body digests food slowly. ｜ 推导: 把食物分解并处理进身体 = 消化"}],"extra":[]},{"id":654,"root":"mechan-","pronounce":"/ˈmekən/姆诶克恩","source":"希腊语 mēkhanē“机器、装置、手段”","meaning":"机器、装置、机制","mnemonic":"mechan就是小学学过的machine。 machine 就是机器、机械装置；mechan 保留了同一组核心拼写。 因此 mechan 可以直接记住“机器、机械”。 所以mechan就是“机器机械”。","mainWords":[{"word":"mechanism","pos":"n.","detail":"构词: 构词: mechan(机器、装置) + -ism<br>释义: 机械装置,机构;机制","example":"例句: Scientists studied the mechanism of the disease. ｜ 推导: 像机器一样由部件共同运行的方式 = 机制、机械装置"}],"extra":[]},{"id":656,"root":"ultim-","pronounce":"/ˈʌltɪm/阿勒提姆","source":"拉丁语 ultimus“最远的、最后的”","meaning":"最后、最终、根本","mnemonic":"ultim就是“傲天”。傲天会让人直接想到“傲视天下”，所以ultim就是“傲视天下”的意思。","mainWords":[{"word":"ultimate","pos":"a.","detail":"构词: 构词: ultim(最后、最远) + -ate<br>释义: 最后的,最终的;根本的","example":"例句: Our ultimate goal is to reduce waste. ｜ 推导: 到达最后和最根本的位置 = 最终的、根本的"}],"extra":[]},{"id":657,"root":"","pronounce":"/rɪˈzɔːt/里兹奥特","source":"古法语 resortir“再次出去、求助”","meaning":"求助、诉诸；常去之处","mnemonic":"sort本身就是小学学过的词。 sort 既可以表示把东西分类，也可以表示一种 kind。 因此直接用熟词 sort 记住“种类”。 所以sort就是“种类”。","mainWords":[{"word":"resort","pos":"v./n.","detail":"构词: 构词: re-(再次、回到) + sort(出去、转向的历史形式)<br>释义: 凭借,求助,诉诸；度假胜地,常去之处,手段","example":"例句: They had to resort to legal action. ｜ 推导: 没有其他办法时转向某种手段 = 求助、诉诸"}],"extra":[]},{"id":658,"root":"","pronounce":"/eɪˈliːt/诶利特","source":"法语 élite“被挑选出来的精华”","meaning":"精英、精华、中坚","mnemonic":"lite就是“砾”。砾会让人直接想到“石头小石头”，所以lite就是“石头小石头”的意思。","mainWords":[{"word":"elite","pos":"n.","detail":"构词: 构词: 法语 élite(被挑选出的精华)形成的整体词<br>释义: <法>[集合名词]精华;精锐;中坚分子","example":"例句: The team includes several elite athletes. ｜ 推导: 从群体中挑出的最优秀部分 = 精英、精锐"}],"extra":[]},{"id":659,"root":"chamb-/chamber-","pronounce":"/tʃeɪm/吃诶姆；/ˈtʃeɪmbə/吃诶姆伯","source":"古法语 chambre“房间”","meaning":"房间、室、腔","mnemonic":"chamb就是“chamber”。chamber会让人直接想到“房间”，由这个意思还可以继续推出室；会议室，所以chamb就是“房间，室；会议室”的意思。","mainWords":[{"word":"chamber","pos":"n.","detail":"构词: 构词: chamb(房间) + -er<br>释义: 房间，室；会议室；议院；(动物体内)腔室","example":"例句: The meeting was held in a private chamber. ｜ 推导: 封闭供特定活动使用的室内空间 = 房间、会议室"}],"extra":[]},{"id":660,"root":"pri-/prior-","pronounce":"/praɪ/普儿爱；/ˈpraɪə/普儿爱额","source":"拉丁语 prior“在前的、较早的”","meaning":"在前、优先","mnemonic":"pri就是下面这些熟词的首字母组合：P就是put，R就是right，I就是in。 把最重要的东西 put right in front，也就是放在最前面、第一位。 pri 表示“第一、主要、优先”。 所以pri就是“第一主要的”。","mainWords":[{"word":"prior","pos":"a.","detail":"构词: 构词: pri(在前) + -or<br>释义: 优先的,在前的;(to)在…之前","example":"例句: Previous experience is not a prior requirement. ｜ 推导: 在时间或顺序上位于前面 = 先前的、优先的"}],"extra":[]},{"id":661,"root":"cap-/cup-","pronounce":"/kæp/卡普；/kʌp/卡普","source":"拉丁语 capere“拿、抓住”","meaning":"拿取、占有、占据","mnemonic":"cup本身就是小学学过的词。 把两只 hand 弯成 cup 的形状，就能 hold 水或小东西。 杯形的手掌会把东西拿住、表示，所以 cup 表示“拿、抓、握住”。 所以cup就是“拿抓握住”。","mainWords":[{"word":"occupy","pos":"v.","detail":"构词: 构词: oc-/ob-(朝向、占据) + cup/cap(拿取) + -y<br>释义: 占,占用,占据；使忙碌","example":"例句: The company occupies three floors. ｜ 推导: 把空间拿到自己控制之下 = 占据、占用"}],"extra":[]},{"id":662,"root":"noc-/nox-","pronounce":"/nɒk/恩奥克；/nɒks/恩奥克斯","source":"拉丁语 nocere“伤害” / noxius“有害的”","meaning":"伤害、有罪、有害","mnemonic":"noc就是no加ok。no就是不，ok就是好，no ok合起来就是不好。所以noc就是“不好”的意思。","mainWords":[{"word":"innocent","pos":"a.","detail":"构词: 构词: in-(不) + noc(伤害、有罪) + -ent<br>释义: 清白的,无罪的；无害的；单纯的","example":"例句: The evidence showed that he was innocent. ｜ 推导: 没有造成伤害和罪责 = 无罪的、无害的"}],"extra":[]},{"id":663,"root":"apt-","pronounce":"/æpt/艾普特","source":"拉丁语 aptus“合适的、连接好的”","meaning":"合适、适应","mnemonic":"apt就是下面这些熟词的首字母组合：A就是able，P就是people，T就是try。 able people 面对新环境时会主动 try，并很快找到合适做法。 所以 apt 可以同时表示“能力、适应、合适”。 所以apt就是“适应能力”。","mainWords":[{"word":"adapt","pos":"vt.","detail":"构词: 构词: ad-(朝向) + apt(合适)<br>释义: 使适应，使适合；改编；改写 vi.适应","example":"例句: Plants adapt to changes in temperature. ｜ 推导: 朝环境要求调整到合适状态 = 适应、改编"}],"extra":[]},{"id":666,"root":"salt-/sault-","pronounce":"/sɔːlt/斯奥勒特；/sɒlt/斯奥勒特","source":"拉丁语 salire“跳跃” / saltus“跳跃、冲击”","meaning":"跳跃、猛冲、攻击","mnemonic":"sault就是“扫”。扫会让人直接想到“攻击攻打”，所以sault就是“攻击攻打”的意思。","mainWords":[{"word":"assault","pos":"v.","detail":"构词: 构词: as-/ad-(朝向) + sault(跳、猛冲)<br>释义: 猛烈地攻击，袭击 n.突然而猛烈的攻击","example":"例句: The soldiers launched an assault at dawn. ｜ 推导: 朝目标猛冲并攻击 = 袭击、猛攻"}],"extra":[]},{"id":668,"root":"seg-/sect-","pronounce":"/seɡ/瑟格；/sekt/瑟克特","source":"拉丁语 secare“切割” / sectus“切开的”","meaning":"切割、分段","mnemonic":"seg就是“撕割”。撕割会让人直接想到“撕开”，所以seg就是“撕开”的意思。","mainWords":[{"word":"segment","pos":"n.","detail":"构词: 构词: seg(切割) + -ment<br>释义: 段,片,节,部分","example":"例句: The market is divided into several segments. ｜ 推导: 被切分出来的一段 = 部分、区段"}],"extra":[]},{"id":670,"root":"sta-/st-/inst-","pronounce":"/stɑː/斯特啊；/st/斯特；/ɪnst/衣恩斯特","source":"拉丁语 stare“站立” / instare“站在近处、迫近”","meaning":"站立、存在；实例、瞬间","mnemonic":"inst就是“应时”。应时就是事情一到时间立刻发生，也就是即时、立刻。所以inst就是“即时、立刻”的意思。","mainWords":[{"word":"instance","pos":"n.","detail":"构词: 构词: in-(在、进入) + sta/inst(站立、出现) + -ance<br>释义: 例子,事例,例证","example":"例句: This case is an instance of poor planning. ｜ 推导: 站出来作为说明对象的具体情况 = 例子、事例"},{"word":"instant","pos":"a./n.","detail":"构词: 构词: in-(在) + stant(站立、当下)<br>释义: 立即的,紧迫的,速溶的；瞬间,时刻","example":"例句: The message received an instant reply. ｜ 推导: 就在当前时刻发生 = 立即的、瞬间"}],"extra":[]},{"id":671,"root":"","pronounce":"/dɪˈrɪv/迪里五","source":"拉丁语 derivare“从水道引流、导出”","meaning":"导出、取得、引申","mnemonic":"der就是“得”。得本身就是“得到”的意思，所以der就是“得到”的意思。","mainWords":[{"word":"derive","pos":"v.","detail":"构词: 构词: de-(从……离开) + riv/deriv(引流、导出) + -e<br>释义: 取得;导出;引申;来自;源自;出自","example":"例句: Many English words derive from earlier languages. ｜ 推导: 像从河道引出水一样从来源中导出 = 取得、源自"}],"extra":[]},{"id":674,"root":"vert-/vers-/vorce-","pronounce":"/vɜːt/沃特；/vɜːs/沃斯；/vɔːs/五奥斯","source":"拉丁语 vertere“转向” / divortium“分开转向”","meaning":"转向；分开、离婚","mnemonic":"vorce就是“卧室”。夫妻共同生活在卧室里；两个人不再共处一室，婚姻关系就会分开，所以vorce可以帮助记住离婚这一支的意思。","mainWords":[{"word":"divorce","pos":"v./n.","detail":"构词: 构词: di-(分开) + vorce/vert(转向)<br>释义: 离婚,分离","example":"例句: The couple decided to divorce. ｜ 推导: 双方转向不同方向 = 离婚、分离"}],"extra":[]},{"id":675,"root":"sanct-","pronounce":"/sæŋkt/斯艾昂克特","source":"拉丁语 sanctus“神圣的、受认可的”","meaning":"神圣；批准、制裁","mnemonic":"sanct就是下面这些熟词的首字母组合：S就是safe，A就是and，N就是nice，C就是clean，T就是true。 被视为神圣的事物通常要求 clean、true，并受到保护而 safe。 sanct 表示“神圣”。 所以sanct就是“神圣”。","mainWords":[{"word":"sanction","pos":"n./v.","detail":"构词: 构词: sanct(神圣、正式认可) + -ion<br>释义: 批准,认可；处罚,制裁","example":"例句: The plan cannot proceed without official sanction. ｜ 推导: 由正式权威给予认可 = 批准；违反时也可指制裁"}],"extra":[]},{"id":676,"root":"nav-","pronounce":"/næv/奈五","source":"拉丁语 navis“船”","meaning":"船、航海、海军","mnemonic":"看nav时，先表示 N：地图上的 N 表示 north。 再把 V 看成 boat 尖尖的船头，船头朝着 north 穿过 sea。 这个画面把 nav 和船、航行联系起来。 所以nav就是“船”。","mainWords":[{"word":"naval","pos":"n.","detail":"构词: 构词: nav(船、海军) + -al<br>释义: 海军的,军舰的","example":"例句: The country expanded its naval forces. ｜ 推导: 与船只和海军有关 = 海军的、军舰的"}],"extra":[]},{"id":677,"root":"","pronounce":"/spɪə/斯皮额；/ˈprɒspə/普儿奥斯珀","source":"① 拉丁语 sperare“希望”；② 拉丁语 prosperus“顺利的、兴旺的”","meaning":"希望；顺利、繁荣","mnemonic":"sper就是下面这些熟词的首字母组合：S就是see，P就是path，E就是end，R就是reach。 只要 see 一条通向 end 的 path，并相信自己能 reach，就会产生 hope。 sper 表示“希望”。 所以sper就是“希望”。","mainWords":[{"word":"desperate","pos":"a.","detail":"构词: 构词: de-(失去) + sper(希望) + -ate<br>释义: 不顾一切的，铤而走险的；绝望的，危急的","example":"例句: The family made a desperate search for shelter. ｜ 推导: 失去希望后不顾一切 = 绝望的、铤而走险的"},{"word":"prosperity","pos":"n.","detail":"构词: 构词: prosper(顺利、兴旺) + -ity<br>释义: 繁荣,兴旺","example":"例句: The region enjoyed a period of prosperity. ｜ 推导: 事业顺利发展形成的状态 = 繁荣"},{"word":"prosperous","pos":"a.","detail":"构词: 构词: prosper(兴旺) + -ous<br>释义: 繁荣的,兴旺的,茂盛的,顺利的","example":"例句: The town became prosperous through trade. ｜ 推导: 充满兴旺状态 = 繁荣的"},{"word":"prosper","pos":"v.","detail":"构词: 构词: 拉丁语 prosperus(顺利、兴旺)形成的整体词<br>释义: 成功,兴隆,昌盛,使成功,使昌隆,繁荣","example":"例句: Small businesses prospered in the new market. ｜ 推导: 向好的方向顺利发展 = 兴旺、成功"}],"extra":[]},{"id":678,"root":"sorb-/sorpt-","pronounce":"/sɔːb/斯奥布；/sɔːpt/斯奥普特","source":"拉丁语 sorbere“吸入、吞下”","meaning":"吸收、吞入","mnemonic":"方法一：\nABSORB可以记成A Body Soaks Oil, Rain, Bath-water。\n\nA是A，B是Body，表示一个物体；S是Soaks，表示吸进去；O是Oil，表示油；R是Rain，表示雨水；最后一个B是Bath-water，表示洗澡水。\n\n一个干燥的物体能够把oil、rain和bath-water从外面吸进内部，这个动作就是吸收。\n\n所以absorb就是“吸收水、光、蒸汽等”的意思。\n\n方法二：\nABSORB还可以记成A Book Steals Our Reading Brain。\n\nA Book是一本书；Steals是偷走；Our Reading Brain就是我们读书时投入的全部注意力。\n\n一本book把注意力全部steal走以后，人不再把心思分给周围其他事情，只专注于书中的内容，这就是“使全神贯注”。\n\n所以absorb就是“吸收；使全神贯注”的意思。\n\n综上，absorb既可以表示把外部物质吸进内部，也可以表示把人的注意力全部吸进去。","mainWords":[{"word":"absorb","pos":"vt.","detail":"构词: 构词: ab-(向内、彻底) + sorb(吸入)<br>释义: 吸收(水、光、蒸汽等);使全神贯注","example":"例句: Dry soil absorbs water quickly. ｜ 推导: 把液体或注意力吸进内部 = 吸收、全神贯注"}],"extra":[]},{"id":680,"root":"pict-/ping-","pronounce":"/pɪkt/皮克特；/pɪŋ/皮昂","source":"拉丁语 pingere“画” / pictus“画出的”","meaning":"画、描绘","mnemonic":"pict完整保留在小学学过的picture开头。 picture 就是画面、图片，是画出来或描绘出来的东西。 因此以后看到 pict，就先想到 picture。 所以pict就是“绘描画”。","mainWords":[{"word":"depict","pos":"v.","detail":"构词: 构词: de-(完整地) + pict(画)<br>释义: 描绘;描写,描述","example":"例句: The mural depicts life in the old town. ｜ 推导: 用图像或文字画出对象 = 描绘、描述"}],"extra":[]},{"id":681,"root":"flat-/fla-","pronounce":"/flæt/夫莱特；/fleɪ/夫勒诶","source":"拉丁语 flare“吹气” / inflare“吹胀”","meaning":"吹、膨胀","mnemonic":"fla就是下面这些熟词的首字母组合：F就是fill，L就是like，A就是air。 气球被 air fill 后会鼓起来，像呼啦一下向外膨胀。 fla 表示“吹、充气、膨胀”。 所以fla就是“呼啦呼啦”。","mainWords":[{"word":"inflation","pos":"n.","detail":"构词: 构词: in-(向内) + fla(吹胀) + -tion<br>释义: 通货膨胀","example":"例句: Rising prices increased inflation. ｜ 推导: 像吹气一样使价格水平膨胀 = 通货膨胀"}],"extra":[]},{"id":684,"root":"","pronounce":"/siːz/斯衣兹；/seɪz/瑟衣兹","source":"古法语 seisir“占有、抓住”","meaning":"抓住、夺取、占有","mnemonic":"ize就是“一抓”。手一伸出去把东西抓住，就能逮住它、夺取它并占领它。所以ize就是“抓住、逮住；夺取、占领”的意思。","mainWords":[{"word":"seize","pos":"v.","detail":"构词: 构词: 古法语 seisir(抓住、占有)形成的整体词<br>释义: 抓住,逮住;夺取,占领;没收,查封","example":"例句: Police seized the illegal goods. ｜ 推导: 突然抓住并控制对象 = 抓住、没收"}],"extra":[]},{"id":685,"root":"suad-/suas-","pronounce":"/sweɪd/斯乌诶德；/sweɪz/斯乌诶兹","source":"拉丁语 suadere“劝告”","meaning":"劝说、使相信","mnemonic":"suad就是“说的”。说的会让人直接想到“说服劝说”，所以suad就是“说服劝说”的意思。","mainWords":[{"word":"persuade","pos":"v.","detail":"构词: 构词: per-(彻底) + suad(劝说) + -e<br>释义: 说服,劝说;(of)使相信","example":"例句: She persuaded him to accept the offer. ｜ 推导: 持续劝说直到对方相信 = 说服"}],"extra":[]},{"id":690,"root":"","pronounce":"/ˈiːvəl/衣五额勒","source":"古英语 yfel“坏的、邪恶的”","meaning":"邪恶、罪恶","mnemonic":"vil就是下面这些熟词的首字母组合：V就是very，I就是ill，L就是living。 一个人的品行如果 very ill，连 living 的方式都充满伤害，就不是普通的不好，而是卑劣、邪恶。 所以vil就是“卑劣”。","mainWords":[{"word":"evil","pos":"a./n.","detail":"构词: 构词: 古英语 yfel(坏的、邪恶的)形成的整体词<br>释义: 邪恶的,罪恶的；邪恶,罪恶","example":"例句: The story describes a struggle between good and evil. ｜ 推导: 在道德上造成伤害的事物 = 邪恶、罪恶"}],"extra":[]},{"id":693,"root":"","pronounce":"/iə/衣额；/jə/耶额","source":"拉丁语比较级后缀 -ior","meaning":"较……的、更……的；具有某位置","mnemonic":"ior就是“里优儿”。里表示内部、里面，优表示优越、优等；人把自己看得太优越，还会产生高傲。所以ior就是“内部、里面；优越、优等；高傲”的意思。","mainWords":[{"word":"interior","pos":"a./n.","detail":"构词: 构词: inter-(在内部、之间) + -ior(更靠内)<br>释义: 内部的,里面的；内部,内地","example":"例句: The interior of the building was renovated. ｜ 推导: 比外部更靠里面 = 内部、里面的"},{"word":"superiority","pos":"n.","detail":"构词: 构词: super-(在上) + -ior(更高) + -ity<br>释义: 优越(性)，优势，优等；高傲，傲慢","example":"例句: The team showed clear technical superiority. ｜ 推导: 在等级或质量上更高 = 优越性、优势"}],"extra":[]},{"id":694,"root":"chron-","pronounce":"/krɒn/克儿奥恩","source":"希腊语 khronos“时间”","meaning":"时间、长期","mnemonic":"chron 时间 也是来自一个神一样的男人 他是 时间之神 他的名字叫做 Chronus 克洛诺斯 他是宙斯的爸爸 创造了时间的男人 他推翻了他爸爸的邪恶统治 然后一手创造了希腊神话的黄金时代 他是十二泰坦神里最年轻的一个 也是最屌的一个 创造了 时间 的男人 你说有多可怕 在他出现之前 时间 都不存在 然后后人为了纪念他 把 克洛诺斯 的名字 Chronus 简化成一个词根 chron 所以chron就是“疾病)慢性的；积习难改的”的意思。","mainWords":[{"word":"chronic","pos":"a.","detail":"构词: 构词: chron(时间) + -ic<br>释义: 慢性的；长期严重的","example":"例句: He suffers from chronic back pain. ｜ 推导: 持续很长时间 = 慢性的、长期严重的"}],"extra":[]},{"id":699,"root":"","pronounce":"/buːð/布乌兹","source":"古北欧语 būð“小屋、摊棚”","meaning":"小亭、货摊、隔间","mnemonic":"boo就是“不 当你觉得某人不行时 就会用 不 来表示对”。不 当你觉得某人不行时 就会用 不 来表示对他的否定 所以 boo 也就是 不 在英语里就是表示 喝倒彩 & 某人不行 的意思 boo 本身即单词 就是 喝倒彩 某人不行 的意思 wouldn't say boo to a goose 字面意思是 不敢嘘一只鹅 goose 鹅 这个单词同时还可以表示 傻瓜 笨蛋 的意思 连只蠢鹅都不敢嘘 衍生出 形容某人胆子很小 连只蚂蚁都不敢踩 的意思。所以boo就是“不在英语里就是表示喝倒彩&某人不行”的意思。","mainWords":[{"word":"booth","pos":"n.","detail":"构词: 构词: 古北欧语 būð(小屋、摊棚)形成的整体词<br>释义: 电话亭,货摊","example":"例句: We bought tickets at the booth. ｜ 推导: 小型封闭或半封闭的售卖空间 = 亭、货摊"}],"extra":[]},{"id":700,"root":"delic-","pronounce":"/ˈdelɪk/德诶利克","source":"拉丁语 delicatus“精致的、娇嫩的”","meaning":"精致、娇嫩、微妙","mnemonic":"lic relic就是“就等于他本来的样子 like c 跟 k 发”。就等于他本来的样子 like c 跟 k 发音相同可以互相转换 lic 跟 like 之间的变形我们都一目了然 应该不用我多逼逼了 like 升级成词根 lic 之后 第一重意思是 主动的 惹我们喜欢的 同根词譬如 delicious 超级基础的词 美味的 惹人喜欢的 令人愉快的 de 表示加强 lic 惹人喜欢的 所以lic relic就是“主动的惹我们喜欢的”的意思。所以lic relic就是“主动的惹大家喜欢的”的意思。","mainWords":[{"word":"delicate","pos":"a.","detail":"构词: 构词: delic(精致、娇嫩) + -ate<br>释义: 纤弱的;精致的;微妙的;灵敏的","example":"例句: Handle the delicate glass with care. ｜ 推导: 结构精细而容易受损 = 纤弱的、精致的"}],"extra":[]},{"id":702,"root":"divin-","pronounce":"/dɪˈvaɪn/迪五爱恩","source":"拉丁语 divinus“神的”","meaning":"神圣、神授；极美","mnemonic":"vine就是“vine”。vine会让人直接想到“藤蔓”，所以vine就是“藤蔓”的意思。","mainWords":[{"word":"divine","pos":"a.","detail":"构词: 构词: divin(神的) + -e<br>释义: 神的，神授的，天赐的；极好的，极美的","example":"例句: The temple was considered a divine place. ｜ 推导: 与神或天赐力量有关 = 神的、极美的"}],"extra":[]},{"id":703,"root":"verb-","pronounce":"/vɜːb/沃布","source":"拉丁语 verbum“词、言语”","meaning":"词、言语","mnemonic":"看verb开头的 V，可以把它想成张开的嘴。 嘴里 say 出 word，随后又可以 write 进 book。 因此 verb 这一形式可以绑定到“词语、说出的词”。 所以verb就是“词语”。","mainWords":[{"word":"verbal","pos":"a.","detail":"构词: 构词: verb(词、言语) + -al<br>释义: 用言辞的,用文字的;口头的;动词的","example":"例句: The agreement was only verbal. ｜ 推导: 通过词语和口头表达 = 言辞的、口头的"}],"extra":[]},{"id":706,"root":"matur-/mat-","pronounce":"/məˈtjʊə/姆特耶乌儿；/mæt/麦特","source":"拉丁语 maturus“成熟的、适时的”","meaning":"成熟、长成","mnemonic":"mat就是“麻 一团乱 麻 麻 就是 纠缠 纠结 的”。麻 一团乱 麻 麻 就是 纠缠 纠结 的意思 所以 mat 就是 纠缠 纠结 的意思 亚麻 黯淡无光 所以 mat 也可以表示 黯淡无光 的意思 席子 跟 垫子 基本都是用 麻 作为材料做成的 譬如 亚麻凉席 所以 mat 也可以表示 席子 跟 垫子 的意思 mat 本身即单词 就是 席子 垫子 的意思 doormat door 门 mat 垫子。所以mat就是“纠缠纠结”的意思。","mainWords":[{"word":"mature","pos":"a.","detail":"构词: 构词: matur(成熟) + -e<br>释义: 成熟的,熟的;成年人的 v.(使)成熟","example":"例句: The fruit becomes mature in late summer. ｜ 推导: 生长到完整阶段 = 成熟的"}],"extra":[]},{"id":707,"root":"aesthet-/esthet-","pronounce":"/iːsˈθet/衣斯斯诶特；/esˈθet/诶斯斯诶特","source":"希腊语 aisthēsis“感觉、知觉”","meaning":"感觉、审美","mnemonic":"把ESTHET按字母顺序记成：E就是eye，S就是see，T就是touch，H就是hear，E就是every，T就是time。 eye 用来 see，手用来 touch，耳朵用来 hear；这些活动 every time 都会带来感觉。 因此 esthet 表示“感觉、感知”。 所以esthet就是“感觉”。","mainWords":[{"word":"aesthetic","pos":"a.","detail":"构词: 构词: aesthet(感觉、审美) + -ic<br>释义: 美学的,艺术的,审美的","example":"例句: The design has strong aesthetic appeal. ｜ 推导: 与美感和感知有关 = 审美的、美学的"}],"extra":[]},{"id":710,"root":"","pronounce":"/ˈfɒstə/夫奥斯特","source":"古英语 fostrian“喂养、养育”","meaning":"养育、培养、鼓励","mnemonic":"fost就是“抚饲”。抚饲会让人直接想到“抚养养育”，所以fost就是“抚养养育”的意思。","mainWords":[{"word":"foster","pos":"v./a./n.","detail":"构词: 构词: 古英语 fostrian(养育)形成的整体词<br>释义: 养育,收养,鼓励；收养的；养育者","example":"例句: The program fosters creativity in children. ｜ 推导: 持续照料并帮助成长 = 养育、培养"}],"extra":[]},{"id":711,"root":"graph-","pronounce":"/ɡrɑːf/格儿啊夫","source":"希腊语 graphein“写、画”","meaning":"写、画、记录","mnemonic":"graph可以直接想到由 line 画成的 picture。 图表既要把信息写下来，也要用线条画出来。 因此 graph 的核心就是“写、画、记录成图”。 所以graph就是“写画”。","mainWords":[{"word":"graphic","pos":"a.","detail":"构词: 构词: graph(画、写) + -ic<br>释义: 绘画似的, 图解的,生动的","example":"例句: The report contains a graphic description of the event. ｜ 推导: 像图画一样清楚呈现 = 图解的、生动的"}],"extra":[]},{"id":712,"root":"ced-/ceed-/cess-","pronounce":"/siːd/斯衣德；/ses/瑟死","source":"拉丁语 cedere“走、退让”","meaning":"走、让步、承认","mnemonic":"把cede中间的 d 看成一扇 door。 一个人打开 door，让别人先 go，自己退到 away，就是让步；把位置 give 出去，也是在退让。 因此 cede 表示“走开、让步”。 所以cede就是“走让步”。","mainWords":[{"word":"concede","pos":"vt.","detail":"构词: 构词: con-(共同、完全) + cede(退让)<br>释义: 承认；容许；(比赛结束前)认输；退让","example":"例句: He conceded defeat after the final round. ｜ 推导: 退一步并承认对方的立场 = 承认、让步"}],"extra":[]},{"id":713,"root":"exo-/exot-","pronounce":"/ˈeksəʊ/诶克斯欧；/ɪɡˈzɒt/衣格兹奥特","source":"希腊语 exō“外面” / exōtikos“外来的”","meaning":"外部、异国、奇异","mnemonic":"tic就是“特”。特别的东西往往奇异、与众不同；来自外国、带有异国风格的东西也会显得特别。所以tic就是“奇异的、异国情调的”的意思。","mainWords":[{"word":"exotic","pos":"a.","detail":"构词: 构词: exo-/exot(外来的) + -ic<br>释义: 奇异的;异国情调的;外(国)来的","example":"例句: The market sells exotic fruits. ｜ 推导: 来自本地之外而显得奇异 = 异国的、奇特的"}],"extra":[]},{"id":714,"root":"","pronounce":"/keɪn/克诶恩","source":"由 cocaine 的名称扩展为局部麻醉药名后缀","meaning":"局部麻醉药","mnemonic":"caine就是“cocaine”。cocaine会让人直接想到“可卡因”，由这个意思还可以继续推出古柯碱（用作局部麻醉剂，所以caine就是“可卡因，古柯碱（用作局部麻醉剂”的意思。","mainWords":[{"word":"cocaine","pos":"n.","detail":"构词: 构词: coca(古柯) + -caine(麻醉药名后缀)<br>释义: 可卡因,古柯碱","example":"例句: Cocaine is a controlled drug. ｜ 推导: 从古柯中提取并具有麻醉作用的药物 = 可卡因"}],"extra":[]},{"id":715,"root":"ambit-/ambi-","pronounce":"/ˈæmbɪt/艾姆毕特；/ˈæmbi/艾姆布衣","source":"拉丁语 ambire“绕行、四处争取” / ambitio“求取职位”","meaning":"绕行、追求；野心","mnemonic":"amb就是“安步 是个运动鞋的牌子 中文也有个成语 安步”。安步 是个运动鞋的牌子 中文也有个成语 安步当车 安步在中文里面的意思 就是走 缓步徐行 ambition 词根字面意思是 所以amb就是“走”的意思。所以amb就是“走”的意思。","mainWords":[{"word":"ambition","pos":"n.","detail":"构词: 构词: ambit(四处争取、追求) + -ion<br>释义: 对(成功、权力等)的强烈欲望，野心；雄心","example":"例句: Her ambition is to lead a research team. ｜ 推导: 为目标四处努力争取 = 雄心、野心"}],"extra":[]},{"id":717,"root":"onym-/nym-","pronounce":"/ˈɒnɪm/奥尼姆；/nɪm/尼姆","source":"希腊语 onyma/onoma“名字”","meaning":"名字、名称","mnemonic":"nym读起来像name。name是我们小学学过的词，意思是名字，所以nym就是“名字”的意思。","mainWords":[{"word":"anonymous","pos":"a.","detail":"构词: 构词: an-(无) + onym/nym(名字) + -ous<br>释义: 匿名的，无名的，姓氏不明的","example":"例句: The letter was sent by an anonymous writer. ｜ 推导: 没有显示名字 = 匿名的"}],"extra":[]},{"id":718,"root":"pat-/patent-","pronounce":"/pæt/派特；/ˈpeɪtənt/普诶特恩特","source":"拉丁语 patere“敞开、公开” / patens“开放的”","meaning":"敞开、公开；专利","mnemonic":"pat就是“拍”。拍本身就是“拍”的意思，所以pat就是“拍”的意思。","mainWords":[{"word":"patent","pos":"a./n./v.","detail":"构词: 构词: pat(敞开、公开) + -ent<br>释义: 专利的,特许的；专利权；批准专利","example":"例句: The inventor applied for a patent. ｜ 推导: 把发明公开并获得专有权 = 专利"}],"extra":[]},{"id":719,"root":"lud-/lus-","pronounce":"/luːd/勒乌德；/luːz/勒乌兹","source":"拉丁语 ludere“玩耍” / lusus“游戏”","meaning":"玩耍、戏弄；幻象","mnemonic":"lus就是下面这些熟词的首字母组合：L就是laugh，U就是use，S就是story。 人在 play 或戏剧中 use story，观众会 laugh、被情节带入。 所以 lus 表示“玩、戏剧、表演”。 所以lus就是“玩戏剧”。","mainWords":[{"word":"illusion","pos":"n.","detail":"构词: 构词: il-(进入、使偏离) + lus(玩弄) + -ion<br>释义: 幻想，错误的观念；错觉，幻觉，假象","example":"例句: The mirror created an illusion of space. ｜ 推导: 视觉或思想被玩弄后形成假象 = 幻觉、错觉"}],"extra":[]},{"id":720,"root":"rat-/ratio-","pronounce":"/ræt/儿艾特；/ˈreɪʃiəʊ/儿诶诗衣欧","source":"拉丁语 reri“计算、思考” / ratio“推理、比率”","meaning":"计算、推理、理性","mnemonic":"rat就是下面这些熟词的首字母组合：R就是reason，A就是and，T就是think。 先找 reason，再认真 think，才能作出断定和推理。 所以rat就是“断定推理”。","mainWords":[{"word":"rational","pos":"a.","detail":"构词: 构词: rat/ratio(推理、计算) + -al<br>释义: 理性的,合理的","example":"例句: We need a rational explanation. ｜ 推导: 经过推理并符合逻辑 = 理性的、合理的"}],"extra":[]},{"id":721,"root":"","pronounce":"/laɪk/勒爱克；/ˈlaɪkwaɪz/勒爱克乌爱兹","source":"古英语 gelic“相似的”及英语 wise“方式”","meaning":"相似、同样；以同样方式","mnemonic":"like本身就是我们小学学过的词。like既可以表示喜欢，也可以表示像、相似，所以like就是“喜欢；像”的意思。","mainWords":[{"word":"likewise","pos":"ad.","detail":"构词: 构词: like(相同) + wise(方式)<br>释义: 同样地,照样地；又,也","example":"例句: The first test was difficult, and the second was likewise challenging. ｜ 推导: 以相同方式发生 = 同样地"}],"extra":[]},{"id":722,"root":"stimul-","pronounce":"/ˈstɪmjʊl/斯提姆耶乌勒","source":"拉丁语 stimulus“刺棒、刺激物”","meaning":"刺激、推动、激励","mnemonic":"把STIMUL记成一条动作链： S就是wood，T就是touch，I就是it，M就是make，U就是us，L就是lift。 一根尖木头突然 touch 身体，会 make us 立刻 lift 起手或跳开。 这种使人马上产生反应的作用，就是刺和刺激。 所以stimul就是“刺刺激”。","mainWords":[{"word":"stimulate","pos":"v.","detail":"构词: 构词: stimul(刺激物、刺棒) + -ate<br>释义: 刺激,使兴奋;激励,鼓舞","example":"例句: The question stimulated a lively discussion. ｜ 推导: 像刺棒一样推动反应 = 刺激、激励"}],"extra":[]},{"id":723,"root":"toler-/tol-","pronounce":"/ˈtɒlər/特奥勒儿；/tɒl/特奥勒","source":"拉丁语 tolerare“承受、忍耐”","meaning":"忍受、容忍","mnemonic":"tol就是“托了”。托了会让人直接想到“抬举某人”，所以tol就是“抬举某人”的意思。","mainWords":[{"word":"tolerate","pos":"vt.","detail":"构词: 构词: toler/tol(承受) + -ate<br>释义: 容忍,默许；对(药物、毒品等)有耐力","example":"例句: Some plants tolerate dry conditions. ｜ 推导: 承受不利条件而不被破坏 = 容忍、耐受"},{"word":"tolerance","pos":"n.","detail":"构词: 构词: toler(忍受) + -ance<br>释义: 宽容；容忍,忍受；耐药力；公差","example":"例句: The material has a high tolerance for heat. ｜ 推导: 能够承受一定范围的能力 = 容忍、耐受度"},{"word":"tolerant","pos":"a.","detail":"构词: 构词: toler(忍受) + -ant<br>释义: 容忍的,宽容的；有耐药力的","example":"例句: A tolerant society respects differences. ｜ 推导: 愿意承受并接纳差异 = 宽容的"}],"extra":[]},{"id":725,"root":"","pronounce":"/ˈsemət/瑟姆特；/ˈseməteri/瑟姆特诶儿衣","source":"希腊语 koimētērion“睡眠之处”，经拉丁语和法语进入英语","meaning":"墓地、安息之处","mnemonic":"CEMET可以记成Come, Every Man Ends There。Come表示最终来到，Every Man表示每一个人，Ends There表示在那里结束一生。人生命结束后被安葬的地方，就是墓地和公墓。所以cemet就是“墓地、公墓”的意思。","mainWords":[{"word":"cemetery","pos":"n.","detail":"构词: 构词: cemet(安息之处) + -ery(场所)<br>释义: 坟墓,墓地,坟场","example":"例句: The old cemetery lies outside the village. ｜ 推导: 供逝者安息的场所 = 墓地"}],"extra":[]},{"id":726,"root":"aug-/auc-","pronounce":"/ɔːɡ/奥格；/ɔːk/奥克","source":"拉丁语 augere“增加” / auctus“增加的”","meaning":"增加、提高","mnemonic":"auc就是下面这些熟词的首字母组合：A就是add，U就是up，C就是count。 不断 add up，count 就越来越大。 auc 表示“增加、提高”。 所以auc就是“增加提高”。","mainWords":[{"word":"auction","pos":"n./vt.","detail":"构词: 构词: auc/aug(增加) + -tion<br>释义: 拍卖","example":"例句: The painting was sold at auction. ｜ 推导: 买家不断提高出价的交易 = 拍卖"}],"extra":[]},{"id":727,"root":"hered-/herit-","pronounce":"/ˈhered/赫诶儿诶德；/ˈherɪt/赫诶里特","source":"拉丁语 heres“继承人” / hereditare“继承”","meaning":"继承、遗产","mnemonic":"把HERIT记成一条家产转移的画面： H就是home，E就是everything，R 提醒“上一代离开”，I就是into，T就是them。 上一代离开以后，home 里的 everything go into them，也就是由后代接过来。 这就是继承。 所以herit就是“继承”。","mainWords":[{"word":"inherit","pos":"vt.","detail":"构词: 构词: in-(进入、得到) + herit(继承)<br>释义: 继承(金钱等)，经遗传而得(性格、特征)","example":"例句: She inherited the house from her grandmother. ｜ 推导: 从前一代得到财产或特征 = 继承"}],"extra":[]},{"id":729,"root":"volunt-","pronounce":"/ˈvɒlənt/五奥勒恩特","source":"拉丁语 voluntas“意愿、意志”","meaning":"意愿、自愿","mnemonic":"volunt就是下面这些熟词的首字母组合：V就是want，O就是of，L就是love，U就是use，N就是no，T就是threat。 真正自愿的行动来自自己的 want 和 love，不需要 use threat。 volunt 表示“意志、意愿、自愿”。 所以volunt就是“意志意愿”。","mainWords":[{"word":"voluntary","pos":"a.","detail":"构词: 构词: volunt(意愿) + -ary<br>释义: 自愿的,志愿的","example":"例句: He joined the rescue team on a voluntary basis. ｜ 推导: 出于自己的意愿而行动 = 自愿的"}],"extra":[]},{"id":730,"root":"ped-/pod-","pronounce":"/ped/普诶德；/pɒd/普奥德","source":"拉丁语 pes，所有格 pedis“脚”","meaning":"脚、步行、远行","mnemonic":"这一词根分两支记。 第一支：PED就是Put Every foot Down。 每一步都把 foot 放 down，因此 ped 表示“脚、足、步行”。 第二支：P就是parent，E 提醒“教育”，D就是day。 parent 每 day 教孩子，便可把另一支记成“儿童、教育”。 所以ped就是“脚足儿童教育”。","mainWords":[{"word":"expedition","pos":"n.","detail":"构词: 构词: ex-(向外) + ped(脚、步行) + -ition<br>释义: 远征(队),探险(队)","example":"例句: The scientists organized an expedition to the desert. ｜ 推导: 迈步远出进行专门任务 = 远征、探险"},{"word":"pedal","pos":"n./v.","detail":"构词: 构词: ped(脚) + -al<br>释义: 踏板；踩踏板,骑自行车","example":"例句: Press the pedal gently. ｜ 推导: 用脚踩动的部件 = 踏板"}],"extra":[]},{"id":733,"root":"fract-","pronounce":"/frækt/夫儿艾克特","source":"拉丁语 frangere“打破” / fractus“破碎的”","meaning":"打破、断裂","mnemonic":"fract就是下面这些熟词的首字母组合：F 提醒用力，R就是rock，A就是away，C就是cut，T就是them。 把 rock 用力推开，再 cut them 成小块，完整物体就被打碎、折断。 所以fract就是“打碎破碎”。","mainWords":[{"word":"fracture","pos":"n./v.","detail":"构词: 构词: fract(断裂) + -ure<br>释义: 裂缝,骨折；使断裂,使折断","example":"例句: The fall caused a fracture in his arm. ｜ 推导: 物体或骨头被打断 = 裂缝、骨折"}],"extra":[]},{"id":734,"root":"frag-","pronounce":"/fræɡ/夫儿艾格","source":"拉丁语 frangere“打破”形成的变体","meaning":"破碎、碎片","mnemonic":"frag就是下面这些熟词的首字母组合：F 提醒用力，R就是rock，A就是away，G就是get。 把 rock 用力分开以后，会 get 一地小碎片。 frag 表示“打碎、破碎、碎片”。 所以frag就是“打碎破碎”。","mainWords":[{"word":"fragment","pos":"n.","detail":"构词: 构词: frag(破碎) + -ment<br>释义: 碎片,小部分,片断","example":"例句: Only a small fragment of the document survived. ｜ 推导: 整体破碎后留下的小部分 = 碎片"}],"extra":[]},{"id":735,"root":"prob-/prov-","pronounce":"/prɒb/普儿奥布；/pruːv/普儿乌五","source":"拉丁语 probare“检验、试探”","meaning":"检验、探查、证明","mnemonic":"prob就是下面这些熟词的首字母组合：P就是put，R就是reason，O就是on，B就是book。 把 reason 清楚写在 book 上，别人才能检查它是否成立。 经得住检查的内容可以被证明，也更可能被接受为可靠。 所以prob就是“诚实正直证明”。","mainWords":[{"word":"probe","pos":"n./v.","detail":"构词: 构词: prob(检验、探查) + -e<br>释义: 探针,探测器；探查,穿刺","example":"例句: The spacecraft sent a probe toward the planet. ｜ 推导: 用工具深入检查未知对象 = 探针、探测"}],"extra":[]},{"id":736,"root":"","pronounce":"/kriː/克里；/kriˈeɪt/克里诶特；/ˈeɪkə/诶克","source":"① 拉丁语 creare“创造、生长”；② 古英语 æcer“田地、土地”","meaning":"创造、重新创造；英亩、田地","mnemonic":"cre是我们小学学过的create的一部分。create就是创造，去掉后面的ate留下cre，所以cre就是“创造”的意思。","mainWords":[{"word":"recreation","pos":"n.","detail":"构词: 构词: re-(再次) + cre(创造) + -ation<br>释义: 娱乐,消遣","example":"例句: Reading is a form of recreation for her. ｜ 推导: 通过重新创造精力获得放松 = 娱乐、消遣"},{"word":"acre","pos":"n.","detail":"构词: 构词: 古英语 æcer(土地、田地)形成的整体词<br>释义: 英亩；田地；地产","example":"例句: The farm covers fifty acres. ｜ 推导: 用于计算土地面积的单位 = 英亩"}],"extra":[]},{"id":737,"root":"manu-","pronounce":"/ˈmænjuː/麦恩耶乌","source":"拉丁语 manus“手”","meaning":"手、手工","mnemonic":"manu就是下面这些熟词的首字母组合：M就是move，A就是arm，N就是now，U就是use。 move arm 以后，now use hand。 这个动作链把 manu 直接绑定到“手”。 所以manu就是“手”。","mainWords":[{"word":"manual","pos":"a./n.","detail":"构词: 构词: manu(手) + -al<br>释义: 手的,手工做的,体力的；手册,指南","example":"例句: Read the manual before using the machine. ｜ 推导: 由手操作或供人手使用的说明 = 手工的、手册"}],"extra":[]},{"id":738,"root":"nomin-/nom-","pronounce":"/ˈnɒmɪn/恩奥米恩；/nɒm/恩奥姆","source":"拉丁语 nomen，所有格 nominis“名字”","meaning":"名字、提名","mnemonic":"nomin就是下面这些熟词的首字母组合：N就是name，O就是one，M就是member，I就是in，N就是now。 现在从 group 中 name one member，就是点出他的名字、提名或任命他。 nomin 表示“名字”。 所以nomin就是“名字”。","mainWords":[{"word":"nominate","pos":"v.","detail":"构词: 构词: nomin(名字) + -ate<br>释义: 提名,任命","example":"例句: The party nominated her for mayor. ｜ 推导: 正式提出某人的名字 = 提名、任命"},{"word":"nominal","pos":"a.","detail":"构词: 构词: nomin(名字) + -al<br>释义: 名义上的;(金额,租金)微不足道的","example":"例句: He paid only a nominal fee. ｜ 推导: 只保留名称而实际数额很小 = 名义上的、微不足道的"}],"extra":[]},{"id":740,"root":"vag-/vagu-","pronounce":"/væɡ/五艾格；/veɪɡ/五诶格","source":"拉丁语 vagus“游荡的、不确定的”","meaning":"游荡；不明确、不确定","mnemonic":"vagu就是“未固”。未固会让人直接想到“某件事情不确定不明确”，所以vagu就是“某件事情不确定不明确”的意思。","mainWords":[{"word":"vague","pos":"a.","detail":"构词: 构词: vagu(游荡、不确定) + -e<br>释义: 不明确的,含糊的,暧昧的","example":"例句: His answer was vague and incomplete. ｜ 推导: 意思像游荡一样没有固定边界 = 含糊的、不明确的"}],"extra":[]},{"id":741,"root":"celer-/cel-","pronounce":"/ˈselər/瑟勒儿；/sel/瑟勒","source":"拉丁语 celer“迅速的”","meaning":"快速、加速","mnemonic":"cel就是下面这些熟词的首字母组合：C就是cloud，E就是earth，L就是light。 cloud 在 earth 上方，light 从天空照下。 这三个画面合在一起，就是天空、天国。 所以cel就是“天国天空”。","mainWords":[{"word":"accelerate","pos":"v.","detail":"构词: 构词: ac-(加强) + celer/cel(快速) + -ate<br>释义: 使加速，使增速，促进 vi.加快，增加","example":"例句: The car accelerated onto the highway. ｜ 推导: 使速度进一步变快 = 加速"}],"extra":[]},{"id":742,"root":"crud-","pronounce":"/kruːd/克儿乌德","source":"拉丁语 crudus“生的、未加工的”","meaning":"生的、粗糙的、未加工的","mnemonic":"crud就是下面这些熟词的首字母组合：C就是cook，R就是rice，U就是until，D 提醒“熟透”。 rice 在 cook 完以前是生的、硬的，摸起来也比较粗糙。 只有一直 cook until 熟透，才会变软。 所以crud就是“生的粗糙的”。","mainWords":[{"word":"crude","pos":"a.","detail":"构词: 构词: crud(生的、未加工的) + -e<br>释义: 天然的,未加工的;未熟的;粗鲁的,粗野的","example":"例句: The factory processes crude oil. ｜ 推导: 尚未精炼或修饰 = 天然的、粗糙的"}],"extra":[]},{"id":744,"root":"","pronounce":"/əˈkjuːt/额克耶乌特","source":"拉丁语 acutus“尖锐的”","meaning":"尖锐、敏锐；剧烈","mnemonic":"ACUTE可以记成A Cut Uses The Edge。A Cut就是一次切割，Uses The Edge就是使用锋利的边。能够完成切割的边必须尖、锐；疼痛像尖刃突然刺来，就会剧烈；人的感觉能够捕捉很细小的变化，就是敏锐；声音尖锐时又会显得高。所以acute就是“尖的、成锐角的；剧烈的、敏锐的、高音的”的意思。","mainWords":[{"word":"acute","pos":"a.","detail":"构词: 构词: 拉丁语 acutus(尖锐的)形成的整体词<br>释义: 剧烈的;敏锐的;成锐角的;尖的;高音的","example":"例句: She felt acute pain in her shoulder. ｜ 推导: 像尖端一样强烈而敏锐 = 剧烈的、敏锐的"}],"extra":[]},{"id":745,"root":"cumul-","pronounce":"/ˈkjuːmjʊl/克耶乌姆耶乌勒","source":"拉丁语 cumulus“堆、积聚”","meaning":"堆积、积累","mnemonic":"把CUMUL按顺序记成：把 many 东西不断 bring up，until 它变得 large。 一件一件往上放，数量越来越多，最后形成一大堆。 所以cumul就是“堆积”。","mainWords":[{"word":"accumulate","pos":"vt.","detail":"构词: 构词: ac-(不断加到一起) + cumul(堆积) + -ate<br>释义: 堆积，积累，积聚vi.累积，聚积","example":"例句: Dust accumulated on the unused shelves. ｜ 推导: 一层层堆到一起 = 积累、堆积"}],"extra":[]},{"id":746,"root":"cel-/ceal-","pronounce":"/siːl/斯衣勒","source":"拉丁语 celare“隐藏”","meaning":"隐藏、隐瞒","mnemonic":"ceal就是“收”。收会让人直接想到“把外面的事物拿到里面”，所以ceal就是“把外面的事物拿到里面”的意思。","mainWords":[{"word":"conceal","pos":"v.","detail":"构词: 构词: con-(完全) + ceal/cel(隐藏)<br>释义: 隐藏,隐瞒,隐蔽","example":"例句: The curtain concealed the doorway. ｜ 推导: 把对象完全藏在视线之外 = 隐藏、隐瞒"}],"extra":[]},{"id":747,"root":"","pronounce":"/ˈɡɔːdʒəs/格奥吉额斯","source":"古法语 gorgias“华丽的、优雅的”","meaning":"华丽、美丽、灿烂","mnemonic":"gorge就是“沟子”。深沟和峡谷像一张向下张开的巨大喉咙，喉咙的动作就是吞咽。所以gorge就是“吞咽”的意思。","mainWords":[{"word":"gorgeous","pos":"a.","detail":"构词: 构词: 古法语 gorgias(华丽的)形成的整体词<br>释义: 华丽的；灿烂的；美丽的；宜人的；棒的","example":"例句: The garden looked gorgeous in spring. ｜ 推导: 色彩和外观十分华美 = 华丽的、美丽的"}],"extra":[]},{"id":748,"root":"desir-/sider-","pronounce":"/dɪˈzaɪə/迪兹爱额；/ˈsaɪdər/斯爱德儿","source":"拉丁语 desiderare“渴望、期望”","meaning":"渴望、期望、合意","mnemonic":"sir本身就是我们小学学过的词，意思是先生。所以sir就是“先生”的意思。","mainWords":[{"word":"desirable","pos":"a.","detail":"构词: 构词: desir(渴望) + -able<br>释义: 值得做的;合意的,称心的;期望得到的","example":"例句: A quiet location is desirable for study. ｜ 推导: 值得人渴望和选择 = 合意的、值得做的"}],"extra":[]},{"id":749,"root":"","pronounce":"/ˈeksaɪl/诶克斯爱勒；/ˈeɡzaɪl/诶格兹爱勒","source":"拉丁语 exilium“流放”","meaning":"流放、放逐","mnemonic":"ile就是“移了”。一个人被强行移走、离开自己的国家，就是被流放；被移走的人就是被流放者。所以ile就是“流放、被流放者”的意思。","mainWords":[{"word":"exile","pos":"n.","detail":"构词: 构词: ex-(向外) + exil(流放)<br>释义: 流放；被流放者 vt.流放，放逐，把…充军","example":"例句: The writer lived in exile for many years. ｜ 推导: 被迫离开本国或原住地 = 流放、被流放者"}],"extra":[]},{"id":750,"root":"","pronounce":"/ˈbænə/拜恩","source":"古法语 baniere“旗帜、标志”","meaning":"旗帜、横幅、标语","mnemonic":"BANNER可以记成Big And Noticeable Name Everyone Reads。Big表示大幅，Noticeable表示醒目，Name表示名称或口号，Everyone Reads表示所有人都能看见。挂在高处、让大家看见名称和口号的大幅标志，就是旗帜和横幅。所以banner就是“旗帜、横幅、标语”的意思。","mainWords":[{"word":"banner","pos":"n.","detail":"构词: 构词: 古法语 baniere(旗帜)形成的整体词<br>释义: 旗帜,横幅,标语","example":"例句: A large banner hung above the entrance. ｜ 推导: 悬挂并传达信息的旗状物 = 横幅、标语"}],"extra":[]},{"id":751,"root":"veng-/vind-","pronounce":"/vendʒ/五诶恩吉；/vɪnd/五衣恩德","source":"拉丁语 vindicare“报复、维护权利”，经法语形成 avenge/revenge","meaning":"报复、复仇","mnemonic":"venge就是下面这些熟词的首字母组合：V就是visit，E就是enemy，N就是never，G就是give，E就是enough。 心里想着 enemy，never 觉得已经 enough，总想继续追讨和回击，这就是报仇。 所以venge就是“报仇”。","mainWords":[{"word":"revenge","pos":"n./v.","detail":"构词: 构词: re-(回报) + venge(报复)<br>释义: 报复,复仇；替……报仇","example":"例句: He refused to seek revenge. ｜ 推导: 把伤害以相同方式还回去 = 报复、复仇"}],"extra":[]},{"id":753,"root":"salv-/sav-","pronounce":"/sælv/斯艾勒五；/seɪv/瑟衣五","source":"拉丁语 salvare“拯救” / salvus“安全的”","meaning":"拯救、安全","mnemonic":"salv从我们小学学过的save来记。save就是拯救，salv和save只差一个字母，意思仍然表示“救”。所以salv就是“拯救”的意思。","mainWords":[{"word":"salvation","pos":"n.","detail":"构词: 构词: salv(拯救、安全) + -ation<br>释义: 拯救,救助;救济(者,品),救助工具;救世主","example":"例句: The lifeboat brought salvation to the sailors. ｜ 推导: 使人脱离危险并获得安全 = 拯救"}],"extra":[]},{"id":755,"root":"fur-/furi-","pronounce":"/fjʊə/夫耶乌儿；/ˈfjʊəri/夫耶乌儿儿衣","source":"拉丁语 furere“发狂、暴怒”","meaning":"狂怒、猛烈","mnemonic":"fur就是“怫”。怫会让人直接想到“愤怒”，所以fur就是“愤怒”的意思。","mainWords":[{"word":"furious","pos":"a.","detail":"构词: 构词: furi(暴怒) + -ous<br>释义: 狂怒的,狂暴的,猛烈的","example":"例句: She was furious about the unfair decision. ｜ 推导: 充满强烈怒气 = 狂怒的、猛烈的"}],"extra":[]},{"id":759,"root":"","pronounce":"/ˈlɪŋɡə/利昂格","source":"中古英语 lengeren“延长、逗留”","meaning":"逗留、拖延、留恋","mnemonic":"ling是我们小学学过的language的一部分。language就是语言，ling保留了最前面的核心声音，所以ling就是“语言、多语言”的意思。","mainWords":[{"word":"linger","pos":"v.","detail":"构词: 构词: 中古英语 lengeren(延长、逗留)形成的整体词<br>释义: 逗留,徘徊,拖延,留恋,浪费光阴,苟延残喘","example":"例句: The smell of smoke lingered in the room. ｜ 推导: 本应离开的事物仍长时间停留 = 逗留、拖延"}],"extra":[]},{"id":760,"root":"","pronounce":"/ɪnˈdevə/衣恩德诶五额","source":"中古法语 en devoir“负有责任、尽力”","meaning":"努力、尽力","mnemonic":"vor就是“涡”。涡就是旋涡，水流遇到障碍后会不断旋转；旋涡还会把周围的东西卷进去、吞进去，所以vor就是“旋涡”的意思，并可以继续联系到“吞食”。","mainWords":[{"word":"endeavor","pos":"v./n.","detail":"构词: 构词: 中古法语 en devoir(负有责任、尽力)形成的整体词<br>释义: 努力,尽力,力图","example":"例句: We will endeavor to finish the work on time. ｜ 推导: 为履行目标持续付出力量 = 努力、尽力"}],"extra":[]},{"id":761,"root":"mens-/metr-","pronounce":"/menz/姆诶恩兹；/ˈmiːtr/米特儿","source":"拉丁语 metiri“测量” / mensus“已测量的”","meaning":"测量、尺度","mnemonic":"mens就是下面这些熟词的首字母组合：M 提醒“测量”，E就是every，N就是number，S就是slow。 测量时要把 every number 慢慢 count 清楚，不能随便估计。 mens 表示“计量、测量”。 所以mens就是“计量测量”。","mainWords":[{"word":"immense","pos":"a.","detail":"构词: 构词: im-/in-(不) + mens(测量) + -e<br>释义: 广大的,巨大的;[口]极好的","example":"例句: The ocean seemed immense from the shore. ｜ 推导: 大到难以测量 = 广大的、巨大的"}],"extra":[]},{"id":764,"root":"rod-/ros-；jac-","pronounce":"/rɒd/儿奥德；/rəʊz/儿欧兹；/dʒæk/吉艾克","source":"① 拉丁语 rodere“啃咬、侵蚀” / rosus“被侵蚀的”；② 拉丁语 iacere“躺、放置”","meaning":"磨损、侵蚀；位于、紧邻","mnemonic":"这一行有两个不同的词根，不能把它们硬合成一个意思。\n\n1.jac读起来像“接”。两个东西一接上，就会紧挨在一起，因此jac就是“接近、相邻”。\n\n2.ROS可以记成Rub On Skin。Rub是摩擦，On Skin是在物体表皮上。长期在表皮上摩擦，就会造成磨损、侵蚀和削弱，因此ros就是“磨损、侵蚀”。\n\n综上，jac表示“接近、相邻”，ros表示“磨损、侵蚀”。","mainWords":[{"word":"erosion","pos":"n.","detail":"构词: 构词: e-/ex-(向外) + ros/rod(侵蚀) + -ion<br>释义: 腐蚀,磨损;削弱,减少","example":"例句: Wind erosion damaged the dry soil. ｜ 推导: 表面被一点点啃掉和磨损 = 侵蚀"},{"word":"adjacent","pos":"a.","detail":"构词: 构词: ad-(靠近) + jac(躺、位于) + -ent<br>释义: 紧接着的;邻近的;毗邻的","example":"例句: Our office is adjacent to the library. ｜ 推导: 位于另一对象旁边 = 紧接着的、邻近的"}],"extra":[]},{"id":765,"root":"habit-/hibit-","pronounce":"/ˈhæbɪt/赫艾毕特；/ˈhɪbɪt/希毕特","source":"拉丁语 habitare“居住” / habere“拥有、保持”","meaning":"居住、栖息","mnemonic":"habit就是下面这些熟词的首字母组合：H就是have，A就是a，B就是bed，I就是in，T就是town。 如果一个人在 town 里 have a bed，说明他在那里住下并占有一个位置。 habit 这一支表示“拥有、占据、居住”。 所以habit就是“拥有占据居住”。","mainWords":[{"word":"inhabitant","pos":"n.","detail":"构词: 构词: in-(在……里面) + habit(居住) + -ant<br>释义: 居民,住户","example":"例句: Every inhabitant received the notice. ｜ 推导: 居住在某地的人 = 居民"},{"word":"inhabit","pos":"vt.","detail":"构词: 构词: in-(在……里面) + habit(居住)<br>释义: 居住于,存在于;栖息于","example":"例句: Several species inhabit the forest. ｜ 推导: 在某地长期居住或栖息 = 居住于"}],"extra":[]},{"id":766,"root":"cosm-","pronounce":"/ˈkɒzm/克奥兹姆","source":"希腊语 kosmos“宇宙、秩序”","meaning":"宇宙、世界","mnemonic":"cosm就是cosmos的头部，cosmos就是宇宙；宇宙的就是cosmic，所以cosm表示“宇宙”的意思。","mainWords":[{"word":"cosmic","pos":"a.","detail":"构词: 构词: cosm(宇宙) + -ic<br>释义: 宇宙的；无比巨大的，无穷尽的","example":"例句: The telescope recorded cosmic radiation. ｜ 推导: 与宇宙有关 = 宇宙的"}],"extra":[]},{"id":767,"root":"","pronounce":"/ˈɑːtəri/啊特儿衣；/ˈɑːtə/啊特","source":"希腊语 artēria“动脉、气管”","meaning":"动脉；主要通道","mnemonic":"art本身就是小学学过的词。 art 不只是艺术，也表示需要长期练习的 skill。 所以 art 可以直接记住“技巧、技艺”。 所以art就是“技巧”。","mainWords":[{"word":"artery","pos":"n.","detail":"构词: 构词: 希腊语 arteria(动脉、气管)形成的整体词<br>释义: 动脉；干线，要道","example":"例句: The blockage affected a major artery. ｜ 推导: 输送血液的主要通道 = 动脉；比喻干线"}],"extra":[]},{"id":768,"root":"leas-/lais-","pronounce":"/liːs/利斯；/leɪz/勒诶兹","source":"古法语 laissier“放手、出租”","meaning":"出租、租用","mnemonic":"leas就是“勒死”。勒死 作为单词的意思就是 勒得死死的 也就是 紧紧 勒住 牢牢 束缚住 的意思 leash h 不改变意义 所以依然是 紧紧勒住 牢牢束缚住 的意思 unleash leash 束缚 所以就是 解开束缚 松开 的意思 release leas 束缚住 不再束缚 取消束缚 所以就是 解开束缚 松开 释放 的意思。所以leas就是“勒得死死的”的意思。","mainWords":[{"word":"lease","pos":"v./n.","detail":"构词: 构词: 古法语 laissier(放手、出租)形成的整体词<br>释义: 出租,租用；租借,租期","example":"例句: They leased the apartment for one year. ｜ 推导: 暂时把使用权交给他人 = 出租、租用"}],"extra":[]},{"id":769,"root":"fascin-","pronounce":"/ˈfæsɪn/夫艾西恩","source":"拉丁语 fascinare“施魔法、迷住”","meaning":"迷住、吸引","mnemonic":"fascin就是“发吸引”。发吸引会让人直接想到“散发”，所以fascin就是“散发”的意思。","mainWords":[{"word":"fascinate","pos":"v.","detail":"构词: 构词: fascin(迷住) + -ate<br>释义: 迷住,强烈吸引","example":"例句: The night sky fascinates many children. ｜ 推导: 强烈吸引注意力 = 迷住"}],"extra":[]},{"id":770,"root":"phet-/phe-","pronounce":"/fet/夫诶特；/fiː/夫衣","source":"希腊语 phēnai“说” / prophētēs“预言者”","meaning":"说、预言","mnemonic":"phet就是“嘱咐”。嘱咐本身就是“嘱咐”的意思，所以phet就是“嘱咐”的意思。","mainWords":[{"word":"prophet","pos":"n.","detail":"构词: 构词: pro-(在前) + phet(说)<br>释义: 预言家；先知；提倡者","example":"例句: The prophet warned of future danger. ｜ 推导: 在事情发生前说出预言的人 = 预言家"}],"extra":[]},{"id":774,"root":"ampl-","pronounce":"/æmpl/艾姆普勒","source":"拉丁语 amplus“大的、宽广的、充足的”","meaning":"大、宽广；充足","mnemonic":"为了记忆，可以把AMPL记成“Add More; Place grows Large”。\nAdd More表示不断往一个地方增加更多东西；Place grows Large表示为了容纳这些东西，空间必须变得更大、更宽。\n如果房间足够宽，可以放下很多东西，就是宽敞；如果食物、时间和材料多到足够使用，就是充足、丰富。\n所以ampl就是“大、宽广；充足、丰富”的意思。","mainWords":[{"word":"ample","pos":"a.","detail":"构词: 构词: ampl(大、充足) + -e<br>释义: 充分的，富裕的；宽敞的，宽大的","example":"例句: We have ample time to complete the task. ｜ 推导: 数量或空间大到足够使用 = 充分的、宽敞的"},{"word":"amplify","pos":"vt.","detail":"构词: 构词: ampl(大) + -ify(使成为)<br>释义: 放大，增强；详述，详加解说","example":"例句: The microphone amplifies the speaker's voice. ｜ 推导: 使声音或信息变大变强 = 放大、增强"}],"extra":[]},{"id":775,"root":"veloc-","pronounce":"/vəˈlɒs/五额勒奥斯","source":"拉丁语 velox“迅速的”","meaning":"速度、迅速","mnemonic":"veloc就是下面这些熟词的首字母组合：V就是very，E就是easy，L就是let，O就是our，C就是car。 让 our car 很轻松地跑得 fast，就会产生很高的速度。 veloc 表示“快、速度”。 所以veloc就是“快”。","mainWords":[{"word":"velocity","pos":"n.","detail":"构词: 构词: veloc(快速) + -ity<br>释义: 速度,速率","example":"例句: The object moved at a constant velocity. ｜ 推导: 物体运动的快慢程度 = 速度"}],"extra":[]},{"id":776,"root":"","pronounce":"/ˈfɔːməʊst/福姆欧斯特","source":"古英语 fore“前面”与最高级形式 most 的结合","meaning":"最前、首要","mnemonic":"most本身就是我们小学学过的词，意思是最多的、大多数的。所以most就是“最多的、大多数的”的意思。","mainWords":[{"word":"foremost","pos":"a.","detail":"构词: 构词: fore-(前面) + most(最)<br>释义: 最先的;最初的; 主要的 ad.首要地","example":"例句: Safety is our foremost concern. ｜ 推导: 位于最前和最重要位置 = 首要的"}],"extra":[]},{"id":779,"root":"pil-/pillar-","pronounce":"/pɪl/皮勒；/ˈpɪlə/皮勒","source":"拉丁语 pila“柱子”","meaning":"柱、支柱","mnemonic":"pil就是下面这些熟词的首字母组合：P就是pull，I就是it，L就是long。 能够被 pull 得 long、又细又软的东西，最容易想到 hair。 pil 表示“毛发”。 所以pil就是“毛发”。","mainWords":[{"word":"pillar","pos":"n.","detail":"构词: 构词: pil(柱) + -ar<br>释义: 柱,台柱,栋梁","example":"例句: Stone pillars support the roof. ｜ 推导: 竖立并支撑上部结构 = 柱、支柱"}],"extra":[]},{"id":781,"root":"lun-","pronounce":"/luːn/勒乌恩","source":"拉丁语 luna“月亮”","meaning":"月亮、月的","mnemonic":"lun 作为词根是 月亮 的意思 lun 这个词根的发音就是中文里的 轮 字 轮 字本身在中文里就可以表示 月亮 的意思 提到 月亮 永远是 一轮明月 怎样怎样 譬如 一轮明月 上青天 一 轮明月 照古今 一轮明月 满乾坤 轮 就是 月亮 的专属数量单位 所以 一轮 指代的当然就是 月亮 独轮 即 一轮 意思当然也是 月亮 半轮 指的必然就是 半圆的月亮 月似白玉轮 玉轮 当然也是 月亮 月轮 的意思必然也是 月亮","mainWords":[{"word":"lunar","pos":"a.","detail":"构词: 构词: lun(月亮) + -ar<br>释义: 月亮的","example":"例句: The festival follows the lunar calendar. ｜ 推导: 与月亮运行周期有关 = 月亮的"}],"extra":[]},{"id":782,"root":"hal-/hale-","pronounce":"/heɪl/赫诶勒","source":"拉丁语 halare“呼吸”","meaning":"呼吸、吸入","mnemonic":"hale就是“薅”。薅 也就是 猛拉 的意思 hale 本身即单词 就是 猛拉 的意思 inhale in 向内 hale 猛拉 向内猛拉 也就是 吸入 exhale ex 向外 hale 猛拉 向外猛拉 就是 呼出 发出 所以hale就是“猛拉”的意思。所以hale就是“猛拉”的意思。","mainWords":[{"word":"inhale","pos":"v.","detail":"构词: 构词: in-(向内) + hale(呼吸)<br>释义: 吸入(气体等)，吸(烟)","example":"例句: Inhale slowly through your nose. ｜ 推导: 把空气向内吸入 = 吸气"}],"extra":[]},{"id":783,"root":"","pronounce":"/preˈstiːʒ/普儿诶斯特衣日；/preˈstɪdʒ/普儿诶斯提吉","source":"法语 prestige，源自拉丁语 praestigium“幻术、迷惑”","meaning":"声望、威信","mnemonic":"stig就是一根尖尖的 wood，只需把结尾的 g 看成硬尖头。 尖木头碰到身体会刺一下，使人立刻产生反应。 所以 stig 表示“刺、刺激”。 所以stig就是“刺刺激”。","mainWords":[{"word":"prestige","pos":"n.","detail":"构词: 构词: 法语 prestige(声望、威信)形成的整体词<br>释义: 声望,威望,威信","example":"例句: The award added to the university's prestige. ｜ 推导: 社会长期形成的高度评价 = 声望、威信"}],"extra":[]},{"id":784,"root":"verg-","pronounce":"/vɜːdʒ/沃吉","source":"拉丁语 vergere“倾斜、趋向”","meaning":"倾向、边缘、濒临","mnemonic":"看verg开头的 V，它像两条倾斜的 road 在低处相接。 road 一边 rise，人就会沿斜面 go 上去或滑下去。 因此 verg 表示“倾向、倾斜”。 所以verg就是“倾向倾斜”。","mainWords":[{"word":"verge","pos":"n./v.","detail":"构词: 构词: verg(倾向、边缘) + -e<br>释义: 边,边缘；濒临","example":"例句: The company is on the verge of expansion. ｜ 推导: 位置或状态正倾向边界 = 边缘、濒临"}],"extra":[]},{"id":785,"root":"milit-","pronounce":"/ˈmɪlɪt/米利特","source":"拉丁语 miles，所有格 militis“士兵”","meaning":"士兵、战斗","mnemonic":"milit就是下面这些熟词的首字母组合：M就是man，I就是in，L就是line，I就是in，T就是train。 man in line，不断 train，最后准备 fight，就是士兵和战斗的画面。 所以milit就是“士兵战斗”。","mainWords":[{"word":"militant","pos":"a./n.","detail":"构词: 构词: milit(士兵、战斗) + -ant<br>释义: 好战的,富于战斗性的；斗士","example":"例句: The group adopted a militant position. ｜ 推导: 具有积极战斗和对抗姿态 = 好战的、斗士"}],"extra":[]},{"id":788,"root":"dulge-/dulg-","pronounce":"/dʌldʒ/德阿勒吉；/dʌlɡ/德阿勒格","source":"拉丁语 indulgere“迁就、放任”","meaning":"放任、纵容、沉溺","mnemonic":"dulge从indulge里记。indulge就是放任、纵容；一个人没有节制地放任自己，就会沉溺其中，所以dulge表示“放任、沉溺”的意思。","mainWords":[{"word":"indulge","pos":"v.","detail":"构词: 构词: in-(进入) + dulge(放任、迁就)<br>释义: 放任，纵容，沉溺；使(自己)纵情享受","example":"例句: Do not indulge in unnecessary spending. ｜ 推导: 让自己进入不加节制的享受 = 放任、沉溺"}],"extra":[]},{"id":789,"root":"","pronounce":"/pleɪs/普勒诶斯；/plæs/普莱斯","source":"古法语 place“位置、场所”","meaning":"放置、位置；移置","mnemonic":"plac只需补一个 e，就得到小学学过的place。 当一个人找到合适的 place，环境变 quiet，心里也会感到 please。 因此 plac 可以串起“使满意、使平静、取悦”。 所以plac就是“取悦使满意使平静”。","mainWords":[{"word":"displace","pos":"v.","detail":"构词: 构词: dis-(离开、分开) + place(位置)<br>释义: 移置,转移;取代,置换","example":"例句: The flood displaced thousands of residents. ｜ 推导: 使对象离开原来的位置 = 移置、取代"}],"extra":[]},{"id":790,"root":"prehend-/prehens-","pronounce":"/prɪˈhend/普里赫诶恩德；/prɪˈhens/普里赫诶恩斯","source":"拉丁语 prehendere“抓住”","meaning":"抓住；理解、包含","mnemonic":"prehend就是“也不影响含义 pre 是最基础的小学入门级前”。也不影响含义 pre 是最基础的小学入门级前缀 意思是 前 hand 应该没有人不认识 是幼儿园小班必考词 所以 pre hand pre 前 hand 手 字面直译过来 就是 往前伸手 的意思 往前伸手 的意义。所以prehend就是“前”的意思。","mainWords":[{"word":"comprehend","pos":"vt.","detail":"构词: 构词: com-(完全、共同) + prehend(抓住)<br>释义: 理解，领会；包含，包括","example":"例句: It took time to comprehend the complex idea. ｜ 推导: 用思维完整抓住意思 = 理解；把部分抓在一起 = 包含"}],"extra":[]},{"id":791,"root":"","pronounce":"/ˈkeɪtə/克诶特","source":"古法语 acater“购买、备办食物”","meaning":"提供饮食、满足需要","mnemonic":"cat本身就是小学学过的词。 cat 就是猫，也可以泛指猫科动物。 因此直接用熟词 cat 记住这一词根义。 所以cat就是“猫；猫科”。","mainWords":[{"word":"cater","pos":"vi.","detail":"构词: 构词: 古法语 acater(购买、备办食物)形成的整体词<br>释义: 满足,迎合；提供饮食及服务","example":"例句: The hotel caters for large conferences. ｜ 推导: 按客人需要准备食物和服务 = 提供饮食、满足需要"}],"extra":[]},{"id":792,"root":"","pronounce":"/ˈɜːnɪst/额尼斯特","source":"古英语 eornost“认真、热心”","meaning":"认真、诚挚、热心","mnemonic":"EARNEST可以记成Every Act Really Needs Enough Serious Thought。Every Act是每一个行动，Really Needs Enough Serious Thought是真的需要足够认真地思考。做每件事都认真思考、不敷衍，就是热心、诚挚和认真；交易中先交一笔钱证明这种诚意，这笔钱就是定金。所以earnest就是“热心的、诚挚的；认真、真挚、定金”的意思。","mainWords":[{"word":"earnest","pos":"a./n.","detail":"构词: 构词: 古英语 eornost(认真、热心)形成的整体词<br>释义: 热心的,诚挚的;热心;真挚;定金;认真","example":"例句: She made an earnest effort to solve the problem. ｜ 推导: 态度真诚而认真 = 热心的、诚挚的"}],"extra":[]},{"id":793,"root":"therm-","pronounce":"/θɜːm/瑟姆","source":"希腊语 thermos“热的”","meaning":"热、热力","mnemonic":"therm就是“色姆”。色姆会让人直接想到“热”，所以therm就是“热”的意思。","mainWords":[{"word":"thermal","pos":"a.","detail":"构词: 构词: therm(热) + -al<br>释义: 热的,热力的；(小规模的)上升气流","example":"例句: The material provides good thermal protection. ｜ 推导: 与热量和热力有关 = 热的、热力的"}],"extra":[]},{"id":794,"root":"","pronounce":"/ʃɪp/诗衣普；/ˈʃɪpmənt/诗衣普姆恩特","source":"古英语 scip“船”，后发展出“装运”义","meaning":"船、装运、运输","mnemonic":"ship本身就是我们小学学过的词，意思是船；货物用船运走，就是装运、航运和运送。所以ship就是“船舶、舰艇；装运、航运、运送”的意思。","mainWords":[{"word":"shipment","pos":"n.","detail":"构词: 构词: ship(装运) + -ment<br>释义: 装船,装运；装载的货物","example":"例句: The shipment arrived at the port yesterday. ｜ 推导: 被装上运输工具并运送的一批货物 = 装运、货物"}],"extra":[]},{"id":798,"root":"prais-/preci-","pronounce":"/preɪz/普儿诶兹；/ˈpriːsi/普里斯衣","source":"古法语 preisier“估价、评价”，源自拉丁语 pretium“价格、价值”","meaning":"评价、估价、赞许","mnemonic":"price 是小学必考词 作为名词是 价格 价值 作为动词是 定价 估价 praise 是 price 的变式 praise 跟 price 发音相同 praise 作为词根的动词含义也是 估价 定价 的意思 praise 本身即单词 就是 估价 定价 的意思 appraise ap 加强 praise 估价 所以是 估价 定价 的意思 appraiser appraiser 估价 定价","mainWords":[{"word":"appraisal","pos":"n.","detail":"构词: 构词: ap-/ad-(朝向、加强) + prais(估价、评价) + -al<br>释义: 评价,鉴定,评估","example":"例句: The house needs a professional appraisal. ｜ 推导: 对价值作出系统评价 = 评价、鉴定、评估"}],"extra":[]},{"id":801,"root":"gust-","pronounce":"/ɡʌst/嘎斯特","source":"拉丁语 gustus“味道、品尝”","meaning":"味道、品尝；厌恶","mnemonic":"gust可以记成“咕食”。肚子咕咕叫时，人就要吃食物；食物入口以后，最直接的感觉就是味道。前面的dis表示不、坏，dis＋gust就是让人产生坏味道和恶心感，所以会厌恶。所以gust就是“味道、品尝感”的意思。","mainWords":[{"word":"disgust","pos":"n./v.","detail":"构词: 构词: dis-(不、反感) + gust(味道)<br>释义: 厌恶,恶心；使厌恶","example":"例句: The smell filled her with disgust. ｜ 推导: 坏味道引起强烈反感 = 厌恶、恶心"}],"extra":[]},{"id":802,"root":"guis-/guise-","pronounce":"/ɡaɪz/格爱兹","source":"古法语 guise“方式、外观”","meaning":"外观、装扮；伪装","mnemonic":"guis就是“盖饰”。盖饰会让人直接想到“掩盖”，所以guis就是“掩盖”的意思。","mainWords":[{"word":"disguise","pos":"n./v.","detail":"构词: 构词: dis-(改变、遮开) + guise(外观)<br>释义: 伪装,假装","example":"例句: He wore a hat as a disguise. ｜ 推导: 改变外观以隐藏真实身份 = 伪装"}],"extra":[]},{"id":803,"root":"aer-/air-","pronounce":"/eə/艾儿","source":"希腊语 aēr“空气”","meaning":"空气、空中","mnemonic":"aer就是air。air是我们小学学过的词，意思是空气；aer只是换了一种拼写，读音和air很接近，所以aer就是“空气、空中的”的意思。","mainWords":[{"word":"aerial","pos":"a./n.","detail":"构词: 构词: aer(空气、空中) + -ial<br>释义: 空中的,航空的；天线","example":"例句: The camera captured an aerial view of the city. ｜ 推导: 从空中或与空气有关 = 空中的、航空的"}],"extra":[]},{"id":804,"root":"fac-/feas-","pronounce":"/fæk/夫艾克；/fiːz/夫衣兹","source":"古法语 faisable“可做的”，源自 faire“做”","meaning":"做；可行","mnemonic":"feas就是下面这些熟词的首字母组合：F就是finish，E就是every，A就是act，S 提醒“顺利”。 能 finish every act，而且完成得 well，就说明这件事做得到、可实行。 feas 表示“做、能做”。 所以feas就是“做”。","mainWords":[{"word":"feasible","pos":"a.","detail":"构词: 构词: feas/fac(做) + -ible(能够)<br>释义: 可行的;切实可行的;行得通的;可用的","example":"例句: The plan is technically feasible. ｜ 推导: 能够实际做成 = 可行的"}],"extra":[]},{"id":805,"root":"spers-/spars-","pronounce":"/spɜːs/斯珀斯；/spɑːs/斯普啊斯","source":"拉丁语 spargere“撒开、散布”","meaning":"分散、散布","mnemonic":"spers就是下面这些熟词的首字母组合：S就是spread，P就是people，E就是everywhere，R就是run，S 提醒“分散”。 people run away，spread everywhere，就从一处散到各处。 spers 表示“散开、分散”。 所以spers就是“散开”。","mainWords":[{"word":"disperse","pos":"v.","detail":"构词: 构词: dis-(分开) + spers(散布) + -e<br>释义: 使分散,使散开,疏散","example":"例句: The police asked the crowd to disperse. ｜ 推导: 把聚集对象向不同方向散开 = 分散、疏散"}],"extra":[]},{"id":807,"root":"","pronounce":"/bruːz/布儿乌兹","source":"古法语 bruisier“打碎、压伤”","meaning":"挫伤、青肿","mnemonic":"BRUISE可以记成Beat Raises Ugly Inside Skin, Ends blue。Beat是受到打击，Raises Ugly Inside Skin是在皮肤里面形成难看的肿块，Ends blue是最后变成青紫色。身体被撞击后出现青紫肿块和伤痕，就是青肿、挫伤；把人打出这种伤，就是打青、挫伤。所以bruise就是“青肿、挫伤、伤痕；打青、挫伤”的意思。","mainWords":[{"word":"bruise","pos":"n./vt.","detail":"构词: 构词: 古法语 bruisier(打伤、压伤)形成的整体词<br>释义: 青肿,挫伤,伤痕；打青,挫伤","example":"例句: He developed a bruise on his arm. ｜ 推导: 皮下组织受撞击形成青肿 = 挫伤、青肿"}],"extra":[]},{"id":808,"root":"agon-/gon-","pronounce":"/ˈæɡən/艾格恩；/ɡɒn/格奥恩","source":"希腊语 agōn“竞赛、斗争”","meaning":"斗争；痛苦、煎熬","mnemonic":"gon就是“弓”。弓弯成一个角，鞠躬时身体也弯出角度，所以gon就是“角、弯曲”的意思。","mainWords":[{"word":"agony","pos":"n.","detail":"构词: 构词: agon(斗争、痛苦) + -y<br>释义: 精神或肉体的极大痛苦,创伤","example":"例句: She waited in agony for the test result. ｜ 推导: 像激烈斗争一样难以忍受 = 极大痛苦"}],"extra":[]},{"id":811,"root":"rog-/rogat-","pronounce":"/rɒɡ/儿奥格；/ˈrəʊɡæt/儿欧盖特","source":"拉丁语 rogare“询问、请求”","meaning":"请求、主张；傲慢索取","mnemonic":"rog就是下面这些熟词的首字母组合：R 提醒“请求”，O就是other，G就是get。 向 other ask，才能 get answer。 rog 表示“要求、询问”。 所以rog就是“要求问”。","mainWords":[{"word":"arrogant","pos":"a.","detail":"构词: 构词: ar-/ad-(朝向自己、加强) + rog(请求、主张) + -ant<br>释义: 傲慢的，自大的","example":"例句: His arrogant tone annoyed the audience. ｜ 推导: 过分替自己主张地位 = 傲慢的、自大的"}],"extra":[]},{"id":814,"root":"","pronounce":"/ˈtʃɑːnsələ/吃啊恩瑟勒；/ˈtʃɑːnsəl/吃啊恩瑟勒","source":"拉丁语 cancellarius“在栅栏旁办公的官员”，经法语进入英语","meaning":"高级官员、主管","mnemonic":"chancell就是“强首”。强首会让人直接想到“总理首相”，所以chancell就是“总理首相”的意思。","mainWords":[{"word":"chancellor","pos":"n.","detail":"构词: 构词: chancell(高级官署) + -or(人)<br>释义: 大臣,法官,总理,大学校长","example":"例句: The chancellor announced a new policy. ｜ 推导: 主持高级行政或学术事务的人 = 大臣、总理、校长"}],"extra":[]},{"id":815,"root":"merg-/mers-","pronounce":"/mɜːdʒ/姆吉；/mɜːs/姆斯","source":"拉丁语 mergere“浸入、沉没” / mersus“浸没的”","meaning":"浸入、沉没","mnemonic":"mers就是下面这些熟词的首字母组合：M就是move，E就是entire，R就是river，S 提醒“水面以下”。 整个东西 move 到 river 的 top 下面，就被水淹没、沉下去。 mers 表示“沉没、浸入”。 所以mers就是“沉没”。","mainWords":[{"word":"immerse","pos":"v.","detail":"构词: 构词: im-/in-(进入) + mers(浸入) + -e<br>释义: 使沉浸在;使浸没","example":"例句: Immerse the cloth in warm water. ｜ 推导: 使对象完全进入液体或活动中 = 浸没、沉浸"}],"extra":[]},{"id":816,"root":"","pronounce":"/ˈnjuːsns/恩耶乌斯恩斯；/njuːz/恩耶乌兹","source":"古法语 nuire“伤害、妨碍”","meaning":"麻烦、妨碍、讨厌","mnemonic":"nuis就是“牛屎”。牛屎会让人觉得又臭又讨厌，是一种麻烦和令人厌烦的东西，所以nuis就是“讨厌、麻烦”的意思。","mainWords":[{"word":"nuisance","pos":"n.","detail":"构词: 构词: nuis(伤害、妨碍) + -ance<br>释义: 讨厌的人(或东西);麻烦事","example":"例句: The constant noise became a nuisance. ｜ 推导: 持续造成妨碍和烦恼的事物 = 麻烦、讨厌的人或物"}],"extra":[]},{"id":817,"root":"drast-","pronounce":"/dræst/德拉斯特","source":"希腊语 drastikos“有行动力的、强烈的”","meaning":"强烈、激烈","mnemonic":"drast就是“最式”。最式会让人直接想到“最极致的方式”，所以drast就是“最极致的方式”的意思。","mainWords":[{"word":"drastic","pos":"a.","detail":"构词: 构词: drast(强烈行动) + -ic<br>释义: 激烈的,严厉的;(药性等)猛烈的","example":"例句: The company took drastic measures. ｜ 推导: 行动强烈而幅度很大 = 激烈的、严厉的"}],"extra":[]},{"id":820,"root":"","pronounce":"/əˈsæsɪn/额斯艾西恩；/ˈsæsɪn/斯艾西恩","source":"阿拉伯语 ḥashshāshīn，经法语形成 assassin","meaning":"刺客、暗杀","mnemonic":"看sassin中的连续 ss，像两股向上弯曲的火苗；中间的 i 又像一根火柴。 sun 和 fire 都会发出 light，在 dark 中尤其明显。 因此 sassin 表示“燃、燃烧”。 所以sassin就是“燃”。","mainWords":[{"word":"assassinate","pos":"vt.","detail":"构词: 构词: assassin(刺客) + -ate<br>释义: 暗杀，行刺；中伤","example":"例句: The plot aimed to assassinate the leader. ｜ 推导: 由刺客秘密杀害重要人物 = 暗杀"}],"extra":[]},{"id":821,"root":"","pronounce":"/ˈpæmflət/派姆夫勒特","source":"中古拉丁语 Pamphilus 的作品名，经法语形成 pamphlet","meaning":"小册子","mnemonic":"pamph就是“盘符”。盘形的符文写在一张张小纸上，装订起来就是小册子，所以pamph就是“小册子”的意思。","mainWords":[{"word":"pamphlet","pos":"n.","detail":"构词: 构词: 中古拉丁语作品名 Pamphilus 经法语形成的整体词<br>释义: 小册子","example":"例句: The clinic distributed a health pamphlet. ｜ 推导: 篇幅较短、用于说明或宣传的小册子 = 小册子"}],"extra":[]},{"id":822,"root":"fren-/frain-","pronounce":"/fren/夫儿诶恩；/freɪn/夫儿诶恩","source":"拉丁语 frenum“缰绳” / refrenare“勒住、抑制”","meaning":"勒住、节制；反复句","mnemonic":"frain就是“负忍”。负忍会让人直接想到“背负”，所以frain就是“背负”的意思。","mainWords":[{"word":"refrain","pos":"v.","detail":"构词: 构词: re-(向后、控制) + frain/fren(缰绳、勒住)<br>释义: 节制,避免,制止 n.(诗的)叠句","example":"例句: Please refrain from using your phone. ｜ 推导: 像拉缰绳一样把行为控制住 = 节制、避免"}],"extra":[]},{"id":824,"root":"spec-/spic-","pronounce":"/spek/斯普诶克；/spɪk/斯皮克","source":"拉丁语 specere“看” / despicere“向下看、轻视”","meaning":"看；轻视","mnemonic":"spis就是“死鄙视”。非常鄙视一个人，就是轻视、蔑视他，所以spis就是“轻视、蔑视”的意思。","mainWords":[{"word":"despise","pos":"v.","detail":"构词: 构词: de-(向下) + spis/spec(看) + -e<br>释义: 轻视,蔑视","example":"例句: She despised dishonest behavior. ｜ 推导: 从上向下看待对象 = 轻视、蔑视"}],"extra":[]},{"id":825,"root":"aug-/auc-","pronounce":"/ɔːɡ/奥格；/ɔːk/奥克","source":"拉丁语 augere“增加”","meaning":"增加、扩大","mnemonic":"aug就是下面这些熟词的首字母组合：A就是add，U就是up，G就是grow。 不断 add up，数量就会 grow。 aug 表示“增加、提高”。 所以aug就是“增加提高”。","mainWords":[{"word":"augment","pos":"vt.","detail":"构词: 构词: aug(增加) + -ment<br>释义: 使增大,增加,增长,扩张","example":"例句: The new equipment will augment production. ｜ 推导: 使原有数量或能力增加 = 增大、扩张"}],"extra":[]},{"id":826,"root":"hyster-","pronounce":"/ˈhɪstə/希斯特","source":"希腊语 hystera“子宫”，后形成历史医学术语 hysteria","meaning":"歇斯底里、情绪失控","mnemonic":"hyster就是“嗨死他”。一个人情绪嗨到失去控制、异常激动，就会显得歇斯底里。所以hyster就是“情绪异常激动、歇斯底里”的意思。","mainWords":[{"word":"hysterical","pos":"a.","detail":"构词: 构词: hyster(歇斯底里状态) + -ical<br>释义: 情绪异常激动的,歇斯底里的","example":"例句: The rumor caused a hysterical reaction. ｜ 推导: 情绪失去正常控制 = 歇斯底里的"}],"extra":[]},{"id":827,"root":"em-/empt-","pronounce":"/em/诶姆；/empt/诶姆普特","source":"拉丁语 emere“拿、买” / emptus“拿走的”","meaning":"拿取；移出、免除","mnemonic":"把EMPT放进买东西的动作中： 先 give money，再 take the thing。 这个过程既包含“拿”，也包含“买”。 所以empt就是“拿买”。","mainWords":[{"word":"exempt","pos":"a./v./n.","detail":"构词: 构词: ex-(移出) + empt(拿取)<br>释义: 免除的；免除；被免除义务者","example":"例句: Students under twelve are exempt from the fee. ｜ 推导: 从责任或费用范围中拿出去 = 免除的"}],"extra":[]},{"id":828,"root":"","pronounce":"/kəˈmens/克姆诶恩斯","source":"古法语 commencier“开始”","meaning":"开始、着手","mnemonic":"mence就是“门始”。门始会让人直接想到“开始”，所以mence就是“开始”的意思。","mainWords":[{"word":"commence","pos":"vt.","detail":"构词: 构词: 古法语 commencier(开始)形成的整体词<br>释义: 开始 vi.获得学位","example":"例句: The ceremony will commence at noon. ｜ 推导: 正式从某一时刻开始 = 开始"}],"extra":[]},{"id":829,"root":"","pronounce":"/ˈperɪʃ/普诶里诗","source":"拉丁语 perire“彻底消失、死亡”，经法语进入英语","meaning":"丧生、毁灭、消亡","mnemonic":"ish就是“一逝”。生命一逝，就是丧生；花草一逝，就会凋谢。所以ish就是“丧生、凋谢”的意思。","mainWords":[{"word":"perish","pos":"v.","detail":"构词: 构词: 拉丁语 perire(彻底消失、死亡)经法语形成的整体词<br>释义: 丧生;凋谢;毁灭,消亡","example":"例句: Many plants perished in the drought. ｜ 推导: 生命或事物彻底消失 = 丧生、毁灭"}],"extra":[]},{"id":830,"root":"","pronounce":"/ˈɪnlet/衣恩勒诶特","source":"英语 in“进入” + let“让入、入口”","meaning":"入口、水湾","mnemonic":"let就是“let”。let就是“让，允许，听任”，其中最关键的意思可以继续联系到“形容小”，所以let就是“形容小”的意思。","mainWords":[{"word":"inlet","pos":"n.","detail":"构词: 构词: in(进入) + let(入口、让入)<br>释义: 水湾,小湾；入口","example":"例句: The boat entered a narrow inlet. ｜ 推导: 让水或物体进入的口子 = 入口、水湾"}],"extra":[]},{"id":831,"root":"vicin-","pronounce":"/ˈvɪsɪn/五衣西恩","source":"拉丁语 vicinus“邻近的”","meaning":"邻近、附近","mnemonic":"vicin就是“围身”。围身会让人直接想到“围绕周围”，所以vicin就是“围绕周围”的意思。","mainWords":[{"word":"vicinity","pos":"n.","detail":"构词: 构词: vicin(邻近) + -ity<br>释义: 邻近,附近","example":"例句: There is no hospital in the immediate vicinity. ｜ 推导: 处于附近的范围 = 邻近、附近"}],"extra":[]},{"id":833,"root":"","pronounce":"/əˈmjuːz/额姆耶乌兹","source":"古法语 amuser“使停留、娱乐”","meaning":"娱乐、逗乐","mnemonic":"muse就是“穆思”。穆思会让人直接想到“沉默”，所以muse就是“沉默”的意思。","mainWords":[{"word":"amuse","pos":"vt.","detail":"构词: 构词: 古法语 amuser(使停留、娱乐)形成的整体词<br>释义: 向…提供娱乐，使…消遣；引人发笑","example":"例句: The clown amused the children. ｜ 推导: 使注意力停留在有趣事物上 = 娱乐、逗乐"}],"extra":[]},{"id":834,"root":"lu-/lut-","pronounce":"/luː/勒乌；/luːt/勒乌特","source":"拉丁语 luere“洗” / diluere“冲淡、稀释”","meaning":"洗、稀释","mnemonic":"lute就是“鲁特”。鲁特琴是一种古老的弦乐器，所以lute就是“鲁特琴”的意思。","mainWords":[{"word":"dilute","pos":"vt.","detail":"构词: 构词: di-(分开) + lute/lu(洗、冲淡)<br>释义: 稀释，冲淡 a.稀释的，冲淡的","example":"例句: Dilute the solution with clean water. ｜ 推导: 用液体把浓度分散开 = 稀释、冲淡"}],"extra":[]},{"id":835,"root":"","pronounce":"/lɒft/勒奥夫特；/ˈlɒfti/勒奥夫特衣","source":"古北欧语 lopt“空气、高处”","meaning":"高处、高耸；崇高","mnemonic":"loft就是“楼复”。楼复会让人直接想到“复式楼”，所以loft就是“复式楼”的意思。","mainWords":[{"word":"lofty","pos":"a.","detail":"构词: 构词: loft(高处) + -y<br>释义: 崇高的，高尚的；高傲的；极高的","example":"例句: They admired the lofty mountain peaks. ｜ 推导: 位置或理想处于很高水平 = 极高的、崇高的"}],"extra":[]},{"id":836,"root":"","pronounce":"/ˈæbdəmən/艾布德姆恩","source":"拉丁语 abdomen“腹部”","meaning":"腹部、下腹","mnemonic":"dom就是下面这些熟词的首字母组合：D就是door，O就是of，M就是my。 door of my home 里面就是房屋和家庭。 能支配家里的人和家养动物，又能引出“控制、驯服”。 所以dom就是“房屋驯服控制”。","mainWords":[{"word":"abdomen","pos":"n.","detail":"构词: 构词: 拉丁语 abdomen(腹部)形成的整体词<br>释义: 腹，下腹","example":"例句: The patient reported pain in the abdomen. ｜ 推导: 胸腔以下、骨盆以上的身体区域 = 腹部"}],"extra":[]},{"id":838,"root":"","pronounce":"/ɡriːv/格里五","source":"古法语 grever“使沉重、使痛苦”","meaning":"悲伤、使痛苦","mnemonic":"把GRIEV按顺序记成：G就是great，R就是rock，I就是in，E就是every，V 提醒“车”。 great rock 放 in every car，车都会变得 heavy。 因此 griev 表示“重”，也能联想到沉重的心情。 所以griev就是“重”。","mainWords":[{"word":"grieve","pos":"v.","detail":"构词: 构词: 古法语 grever(使沉重、使痛苦)形成的整体词<br>释义: 使悲伤,使伤心","example":"例句: The loss continued to grieve the family. ｜ 推导: 悲痛像重物压在心上 = 使悲伤"}],"extra":[]},{"id":840,"root":"","pronounce":"/mɑːks/姆啊克斯；/ˈmɑːksɪst/姆啊克西斯特","source":"人名 Karl Marx“卡尔·马克思”","meaning":"马克思、马克思主义","mnemonic":"marx就是“马克思”。马克思本身就是“马克思”的意思，所以marx就是“马克思”的意思。","mainWords":[{"word":"Marxist","pos":"a./n.","detail":"构词: 构词: Marx(马克思) + -ist(信奉者)<br>释义: 马克思主义的；马克思主义者","example":"例句: The article presents a Marxist analysis of history. ｜ 推导: 采用马克思主义观点的人或理论 = 马克思主义的、马克思主义者"}],"extra":[]},{"id":841,"root":"","pronounce":"/ɡluːm/格勒乌姆；/ˈɡluːmi/格勒乌米","source":"中古英语 gloom“阴暗、忧郁”","meaning":"阴暗、忧郁","mnemonic":"gloom就是“咕隆”。黑咕隆咚表示四周非常黑，尤其像夜半三更没有灯光的样子，所以gloom就是“夜半三更黑”的意思。","mainWords":[{"word":"gloomy","pos":"a.","detail":"构词: 构词: gloom(阴暗、忧郁) + -y<br>释义: 阴暗的,阴沉的,令人沮丧的,阴郁的","example":"例句: The sky remained gloomy all afternoon. ｜ 推导: 充满阴暗和压抑气氛 = 阴沉的、忧郁的"}],"extra":[]},{"id":842,"root":"","pronounce":"/əns/额恩斯；/ens/诶恩斯","source":"拉丁语 -entia，经法语进入英语","meaning":"性质、状态、结果","mnemonic":"-ence可以放在difference和existence后面比较。difference表示“不同”这种状态，existence表示“存在”这种状态；具体意思由前半部分决定，-ence只把前面的动作或性质变成一种名词状态，本身不表示“服从”。obedience中，服从的核心在obedi，-ence只负责把“服从”变成名词。所以-ence就是“表示性质、状态或行为的名词后缀”的意思。","mainWords":[{"word":"obedience","pos":"n.","detail":"构词: 构词: obedi(服从) + -ence(状态)<br>释义: 服从,顺从","example":"例句: The dog was trained in obedience. ｜ 推导: 按照命令行动的状态 = 服从、顺从"}],"extra":[]},{"id":843,"root":"dow-/dot-","pronounce":"/daʊ/德奥；/dɒt/德奥特","source":"古法语 douer，源自拉丁语 dotare“给予、赋予财产”","meaning":"给予、赠予、赋予","mnemonic":"方法一：dow就是“渡物”。即让渡物体，，所以dow就是“让渡”的意思。         方法二：为了记忆，可以把DOW记成“Donate, Offer What you have”。\nDonate表示捐赠；Offer表示主动提供；What you have表示拿出自己拥有的钱、物品、能力或资源。\n一个人把自己拥有的东西主动交给别人，就是给予和赠予；如果给予的是长期资金、资格、能力或天赋，就可以继续推出赋予、资助。\n所以dow就是“给予、赠予；赋予、提供”的意思。","mainWords":[{"word":"endow","pos":"vt.","detail":"构词: 构词: en-(使具有) + dow/dot(给予)<br>释义: 资助，捐赠；(with)给予，赋予","example":"例句: The donation will endow a new scholarship. ｜ 推导: 长期给予资金、资格或能力 = 资助、赋予"}],"extra":[]},{"id":844,"root":"trud-/trus-","pronounce":"/truːd/特儿乌德；/truːz/特儿乌兹","source":"拉丁语 trudere“推、挤” / trusus“被推的”","meaning":"推、挤、闯入","mnemonic":"trud就是小学学过的truck，只需把结尾 k 换成 d。 truck 向前开时能 push 重物，形成强力推进的画面。 因此 trud 表示“推、冲”。 所以trud就是“推冲”。","mainWords":[{"word":"intrude","pos":"vi.","detail":"构词: 构词: in-(向内) + trud(推、挤) + -e<br>释义: 闯入,侵入vt.把(思想等)强加于人;强挤入","example":"例句: Do not intrude into their private conversation. ｜ 推导: 强行挤进不属于自己的空间 = 闯入、侵入"}],"extra":[]},{"id":846,"root":"vag-/vagu-","pronounce":"/væɡ/五艾格；/veɪɡ/五诶格","source":"拉丁语 vagari“游荡” / vagus“游荡的”","meaning":"游荡；越界、过度","mnemonic":"vag就是下面这些熟词的首字母组合：V就是visit，A就是any，G就是ground。 今天 visit 这块 ground，明天又去另一块，没有固定地方，就是流浪。 所以vag就是“流浪”。","mainWords":[{"word":"extravagant","pos":"a.","detail":"构词: 构词: extra-(越出) + vag(游荡) + -ant<br>释义: 奢侈的;过分的;(言行等)放肆的","example":"例句: The hotel was too extravagant for our budget. ｜ 推导: 游出正常界限并超过合理程度 = 奢侈的、过分的"}],"extra":[]},{"id":847,"root":"","pronounce":"/aɪ/爱；/ɪt/衣特；/ˈtrænzi/特拉恩兹衣；/ənt/额恩特","source":"① 拉丁语 ire“走” / itus“已走的” / transire“走过”；② 拉丁语 -ens，所有格 -entis“具有某性质的”","meaning":"走、经过、短暂；具有某性质的","mnemonic":"ent就是“暂住的人”。一个人只在某地短暂住一段时间，就是临时的、转瞬即逝的；在别人安排下住着，也带有服从、顺从的感觉。所以ent就是“短暂、临时；服从、顺从”的意思。","mainWords":[{"word":"transient","pos":"a.","detail":"构词: 构词: trans-(经过) + i/it(走) + -ent(具有该状态)<br>释义: 短暂的，转瞬即逝的；临时的，暂住的","example":"例句: The city has a large transient population. ｜ 推导: 只经过而不长久停留 = 短暂的、临时的"},{"word":"obedient","pos":"a.","detail":"构词: 构词: obedi(服从) + -ent(具有该性质)<br>释义: 服从的,顺从的","example":"例句: The child remained obedient during the visit. ｜ 推导: 具有听从命令的状态 = 服从的、顺从的"}],"extra":[]},{"id":848,"root":"","pronounce":"/lɜːn/勒恩；/ˈlɜːnɪd/勒尼德","source":"古英语 leornian“学习”","meaning":"学习；博学","mnemonic":"learn本身就是我们小学学过的词，意思是学习。所以learn就是“学习”的意思。","mainWords":[{"word":"learned","pos":"a.","detail":"构词: 构词: learn(学习) + -ed<br>释义: 博学的,有学问的","example":"例句: The professor is a learned historian. ｜ 推导: 经过长期学习而知识丰富 = 博学的"}],"extra":[]},{"id":849,"root":"tedi-","pronounce":"/ˈtiːdi/特衣德衣","source":"拉丁语 taedium“厌倦、乏味”","meaning":"乏味、冗长","mnemonic":"tedi就是下面这些熟词的首字母组合：T就是time，E就是each，D就是day，I就是it。 each day 都觉得 time 很 long，内容反复没有变化，就会感到乏味、单调、冗长。 所以tedi就是“乏味的，单调的，冗长的”。","mainWords":[{"word":"tedious","pos":"a.","detail":"构词: 构词: tedi(乏味) + -ous<br>释义: 乏味的,单调的,冗长的","example":"例句: The long meeting became tedious. ｜ 推导: 持续时间长且缺少变化 = 乏味的、冗长的"}],"extra":[]},{"id":850,"root":"","pronounce":"/kəˈres/克儿诶斯","source":"法语 caresser“爱抚”","meaning":"爱抚、抚摸","mnemonic":"car从我们小学学过的care来记。care就是关心、喜爱，去掉最后一个e留下car，所以car就是“可爱、关心、喜爱”的意思。","mainWords":[{"word":"caress","pos":"v./n.","detail":"构词: 构词: 法语 caresser(爱抚)形成的整体词<br>释义: 爱抚,抚摸","example":"例句: She gently caressed the child's hair. ｜ 推导: 用手温柔地抚摸 = 爱抚"}],"extra":[]},{"id":851,"root":"satur-","pronounce":"/ˈsætʃər/斯艾吃额儿","source":"拉丁语 satur“饱的、充满的”","meaning":"充满、饱和、浸透","mnemonic":"satur就是下面这些熟词的首字母组合：S就是stop，A就是after，T就是take，U就是until，R就是round。 不断 take 食物，until 肚子变 round，然后 stop，说明已经吃够、满足、饱足。 所以satur就是“足够饱足满足”。","mainWords":[{"word":"saturate","pos":"vt.","detail":"构词: 构词: satur(充满、饱) + -ate<br>释义: 使湿透，浸透；使充满，使饱和","example":"例句: Heavy rain saturated the soil. ｜ 推导: 使空间或材料充满到不能再吸收 = 浸透、饱和"}],"extra":[]},{"id":852,"root":"sta-/stit-","pronounce":"/stɑː/斯特啊；/stɪt/斯提特","source":"拉丁语 stare“站立” / superstitio“站在上方、迷信”","meaning":"站立；固定观念","mnemonic":"stit就是下面这些熟词的首字母组合：S就是stand，T就是thing，I就是in，T就是there。 让一件 thing stand in there，就是把它放好、立住并建立起来。 所以stit就是“建立放”。","mainWords":[{"word":"superstition","pos":"n.","detail":"构词: 构词: super-(在上) + stit(站立) + -ion<br>释义: 迷信，迷信的观念习俗","example":"例句: The custom is based on an old superstition. ｜ 推导: 把没有证据的观念固定在心中 = 迷信"}],"extra":[]},{"id":853,"root":"vulg-","pronounce":"/vʌlɡ/五阿勒格","source":"拉丁语 vulgus“普通民众”","meaning":"普通、大众；粗俗","mnemonic":"vulg就是下面这些熟词的首字母组合：V就是village，U就是us，L就是little，G就是group。 village 里的 us 是一个 little group，代表普通人群，而不是少数贵族。 vulg 表示“普通、平民”，再引出通俗、庸俗。 所以vulg就是“普通平民”。","mainWords":[{"word":"vulgar","pos":"a.","detail":"构词: 构词: vulg(普通民众) + -ar<br>释义: 粗俗的，庸俗的，本土的，通俗的，普通的","example":"例句: The remark was considered vulgar. ｜ 推导: 从普通大众义引申为粗俗、欠文雅 = 粗俗的、通俗的"}],"extra":[]},{"id":854,"root":"proxim-","pronounce":"/ˈprɒksɪm/普儿奥克西姆","source":"拉丁语 proximus“最近的”","meaning":"接近、近似","mnemonic":"把proxim中的 X 看成地图上的目标点。 put one thing right near X，两个位置在 middle 附近相互靠近。 因此 proxim 表示“接近、靠近”。 所以proxim就是“接近靠近”。","mainWords":[{"word":"approximate","pos":"a.","detail":"构词: 构词: ap-/ad-(接近) + proxim(最近) + -ate<br>释义: 近似的 vi.(to)接近","example":"例句: The approximate cost is five thousand yuan. ｜ 推导: 靠近真实数值但不完全相同 = 近似的"}],"extra":[]},{"id":855,"root":"","pronounce":"/əʊ/欧","source":"古英语 āgan“拥有、欠下”","meaning":"欠、应付","mnemonic":"wing就是“未清”。一笔钱还没有付清，就是欠着、未付；“未清”读快一点可以帮助记住wing。所以wing就是“欠的、未付的”的意思。","mainWords":[{"word":"owing","pos":"a.","detail":"构词: 构词: owe(欠) + -ing<br>释义: 欠的,未付的","example":"例句: The amount owing must be paid this week. ｜ 推导: 仍然欠着而尚未支付 = 欠的、未付的"}],"extra":[]},{"id":856,"root":"torqu-/tort-/torm-","pronounce":"/tɔːk/托克；/tɔːt/托特；/tɔːm/托姆","source":"拉丁语 torquere“扭曲” / tormentum“折磨工具”","meaning":"扭曲、折磨","mnemonic":"torm就是“痛”。痛本身就是“痛苦”的意思，所以torm就是“痛苦”的意思。","mainWords":[{"word":"torment","pos":"n./v.","detail":"构词: 构词: torm/tort(扭曲、折磨) + -ment<br>释义: 折磨,痛苦；折磨,纠缠","example":"例句: The noise became a constant torment. ｜ 推导: 像把身体或精神扭曲一样造成痛苦 = 折磨"}],"extra":[]},{"id":858,"root":"greg-","pronounce":"/ɡreɡ/格儿诶格","source":"拉丁语 grex，所有格 gregis“群、兽群”","meaning":"群体、聚集；分群","mnemonic":"greg就是下面这些熟词的首字母组合：G就是group，R就是round，E就是everyone，G 再回到 group。 everyone 围成 round，最后形成一个 group。 greg 表示“组、群、收集”。 所以greg就是“组群收集”。","mainWords":[{"word":"segregate","pos":"vt.","detail":"构词: 构词: se-(分开) + greg(群体) + -ate<br>释义: 使···分开，隔离（病患等）","example":"例句: The policy segregated the two groups. ｜ 推导: 把原来同处的群体分开 = 隔离、分开"}],"extra":[]},{"id":859,"root":"her-/hes-","pronounce":"/hɪə/希额；/hiːz/赫衣兹","source":"拉丁语 haerere“粘住” / haesus“粘着的”","meaning":"粘合、结合","mnemonic":"hes就是下面这些熟词的首字母组合：H就是hold，E就是everything，S就是same。 把 everything hold 在 same 位置，并让它们 together，就会黏在一起。 hes 表示“黏附、粘合”。 所以hes
