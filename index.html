<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>词根词缀 · 记忆库</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #e8f5e9;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }
        .app {
            max-width: 1000px;
            width: 100%;
            background: #f1f8f0;
            border-radius: 36px;
            box-shadow: 0 20px 40px -12px rgba(0,50,30,0.15);
            padding: 24px 24px 32px;
            border: 1px solid #c8e6c9;
        }
        .top-nav {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #c8e6c9;
        }
        .top-nav .brand { font-size: 1.5rem; font-weight: 700; color: #1e3a2a; margin-right: auto; }
        .top-nav .brand small { font-weight: 400; font-size: 0.9rem; color: #3a6a3a; margin-left: 8px; }
        .nav-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
        .nav-tabs button {
            background: #dcedc8; border: none; padding: 6px 18px; border-radius: 40px;
            font-weight: 600; font-size: 0.9rem; color: #1e3a1e; cursor: pointer;
            border: 1px solid transparent; transition: 0.15s;
        }
        .nav-tabs button.active { background: #2d6a2d; color: white; border-color: #1a4a1a; }
        .nav-tabs button:hover:not(.active) { background: #c8e6c9; }
        .top-actions { display: flex; gap: 8px; margin-left: auto; }
        .top-actions button {
            background: #eaf7ea; border: 1px solid #a5d6a7; padding: 4px 14px;
            border-radius: 40px; font-size: 0.8rem; cursor: pointer;
        }
        .top-actions button:hover { background: #c8e6c9; }
        .page { display: none; animation: fade 0.2s; }
        .page.active { display: block; }
        @keyframes fade { from { opacity:0.5; } to { opacity:1; } }

        .home-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr));
            gap: 18px; margin: 16px 0 24px;
        }
        .home-card {
            background: #f7fcf7; border-radius: 28px; padding: 20px 16px;
            border: 1px solid #c8e6c9; text-align: center; cursor: pointer;
            transition: 0.15s; box-shadow: 0 4px 8px rgba(0,60,30,0.04);
        }
        .home-card:hover { transform: translateY(-4px); background: #edf7ed; }
        .home-card .icon { font-size: 2.4rem; margin-bottom: 6px; }
        .home-card .label { font-weight: 600; color: #1e3a1e; }
        .home-card .desc { font-size: 0.8rem; color: #4a7a4a; margin-top: 4px; }

        .stats-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(100px,1fr));
            gap: 12px; background: #edf7ed; padding: 18px 16px;
            border-radius: 28px; border: 1px solid #c8e6c9; margin: 12px 0 6px;
        }
        .stat-item { text-align: center; }
        .stat-item .num { font-size: 1.8rem; font-weight: 700; color: #1e4a1e; }
        .stat-item .lbl { font-size: 0.8rem; color: #4a6a4a; }

        .game-area {
            background: #edf7ed; border-radius: 28px; padding: 20px 18px;
            border: 1px solid #c8e6c9; margin-top: 20px;
        }
        .game-area h3 { color: #1e3a1e; margin-bottom: 12px; display: flex; gap: 12px; align-items: center; }
        .game-question { font-size: 1.3rem; font-weight: 600; color: #1a3a1a; margin-bottom: 12px; }
        .game-options { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
        .game-options button {
            background: #f7fcf7; border: 2px solid #c8e6c9; padding: 10px 20px;
            border-radius: 40px; cursor: pointer; font-size: 1rem; transition: 0.1s;
            flex: 1 0 auto;
        }
        .game-options button:hover { background: #dcedc8; border-color: #81c784; }
        .game-options button.correct { background: #43a047; color: white; border-color: #2e7d32; }
        .game-options button.wrong { background: #e53935; color: white; border-color: #b71c1c; }
        .game-feedback { font-weight: 500; margin: 8px 0; min-height: 2rem; }
        .game-score { font-size: 0.9rem; color: #2a5a2a; }
        .game-nav {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .game-nav button {
            background: #2d6a2d;
            border: none;
            color: white;
            padding: 6px 24px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: 0.15s;
            border: 1px solid #1a4a1a;
        }
        .game-nav button:hover:not(:disabled) {
            background: #1a4a1a;
        }
        .game-nav button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: #4a7a4a;
        }
        .game-nav button.secondary {
            background: #dcedc8;
            color: #1e3a1e;
            border-color: #a5d6a7;
        }
        .game-nav button.secondary:hover:not(:disabled) {
            background: #c8e6c9;
        }

        .card {
            background: #f7fcf7; border-radius: 28px; padding: 24px 22px;
            border: 1px solid #c8e6c9; margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,60,30,0.04);
        }
        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px dashed #b8d9b8; padding-bottom: 8px; margin-bottom: 14px;
            flex-wrap: wrap;
        }
        .root-box {
            background: #eaf7ea; padding: 14px 18px; border-radius: 18px;
            margin-bottom: 16px; border-left: 4px solid #81c784;
        }
        .root-box .root-name { font-size: 1.4rem; font-weight: 700; color: #1a3a1a; display: inline-block; margin-right: 12px; }
        .root-box .pronounce { font-size: 1rem; color: #2d5a2d; background: #dcedc8; padding: 0 14px; border-radius: 40px; display: inline-block; line-height: 1.8; }
        .root-box .source { font-size: 0.9rem; color: #3a6a3a; background: #dcedc8; padding: 2px 14px; border-radius: 30px; display: inline-block; margin-top: 6px; }
        .mnemonic { background: #edf7ed; padding: 14px 18px; border-radius: 18px; border-left: 4px solid #66bb6a; margin: 14px 0 18px; line-height: 1.7; color: #1e3a1e; }
        .mnemonic::before { content: "🧠 "; }

        .word-entry {
            background: #f4fcf4; border-radius: 18px; padding: 12px 16px;
            border: 1px solid #c8e6c9; margin-bottom: 12px;
        }
        .word-top {
            display: flex; flex-wrap: wrap; align-items: center;
            justify-content: space-between; gap: 6px 12px;
        }
        .word-title-group { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
        .word-title { font-weight: 700; font-size: 1.2rem; color: #1c3a1c; }
        .word-title .pos { font-weight: 500; font-size: 0.9rem; color: #3a6a3a; background: #dcedc8; padding: 0 14px; border-radius: 40px; }
        .word-detail { margin-top: 4px; color: #1e3a1e; line-height: 1.6; font-size: 0.95rem; }
        .example { background: #eaf7ea; padding: 4px 14px; border-radius: 14px; margin: 6px 0 2px; font-style: italic; color: #2a4a2a; font-size: 0.9rem; }
        .dot-group { display: flex; gap: 6px; align-items: center; }
        .dot {
            width: 28px; height: 28px; border-radius: 50%; border: 2px solid #ccc;
            background: #f0f0f0; cursor: pointer; transition: 0.15s;
        }
        .dot:hover { transform: scale(1.12); }
        .dot.active-green { background: #43a047; border-color: #2e7d32; }
        .dot.active-red { background: #e53935; border-color: #b71c1c; }
        .dot.active-yellow { background: #fdd835; border-color: #f9a825; }
        .dot.active-gray { background: #e0e0e0; border-color: #9e9e9e; }

        .extra-section { margin-top: 16px; padding-top: 12px; border-top: 1px dashed #b8d9b8; }
        .extra-section summary { font-weight: 600; color: #2a5a2a; cursor: pointer; font-size: 0.95rem; }
        .extra-section ul { display: flex; flex-wrap: wrap; gap: 6px 12px; padding: 12px 6px 4px; list-style: none; }
        .extra-section ul li { background: #eaf7ea; padding: 4px 16px; border-radius: 30px; font-size: 0.9rem; border: 1px solid #b8d9b8; }

        .memory-progress-area {
            margin: 16px 0 8px; background: #edf7ed; border-radius: 40px;
            padding: 12px 20px; border: 1px solid #c8e6c9;
            display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px;
        }
        .progress-track { flex: 1; min-width: 120px; height: 12px; background: #dcedc8; border-radius: 40px; overflow: hidden; }
        .progress-track .fill { height: 100%; width: 0%; background: #43a047; border-radius: 40px; transition: width 0.2s; }

        .nav {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 12px; margin-top: 10px;
        }
        .nav button {
            background: #dcedc8; border: none; padding: 10px 24px;
            border-radius: 60px; font-weight: 500; font-size: 1rem;
            cursor: pointer; border: 1px solid #a5d6a7;
        }
        .nav button.primary { background: #2d6a2d; color: #f0faf0; border-color: #1a4a1a; }
        .nav button:disabled { opacity: 0.4; cursor: not-allowed; }
        .jump-box {
            display: flex; align-items: center; gap: 8px;
            background: #eaf7ea; padding: 6px 14px 6px 18px;
            border-radius: 60px; border: 1px solid #a5d6a7;
        }
        .jump-box input { width: 70px; padding: 5px 6px 5px 14px; border-radius: 40px; border: 1px solid #a5d6a7; font-size: 1rem; }
        .jump-box button { background: #2d6a2d; border: none; color: white; padding: 5px 18px; border-radius: 40px; cursor: pointer; }

        .progress-bar-wrapper { width: 100%; background: #dcedc8; border-radius: 40px; height: 10px; margin: 12px 0 18px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: #43a047; border-radius: 40px; width: 0%; transition: width 0.2s; }

        .overview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: 12px; max-height: 500px; overflow-y: auto; }
        .overview-item {
            background: #f4fcf4; padding: 10px 14px; border-radius: 40px;
            border: 1px solid #c8e6c9; font-size: 0.9rem;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap;
        }
        .overview-item .badge-group { display: flex; gap: 4px; font-size: 0.7rem; }
        .badge-green { background: #43a047; color: white; padding: 0 8px; border-radius: 30px; }
        .badge-yellow { background: #fdd835; padding: 0 8px; border-radius: 30px; }
        .badge-red { background: #e53935; color: white; padding: 0 8px; border-radius: 30px; }
        .badge-gray { background: #e0e0e0; padding: 0 8px; border-radius: 30px; }
        .star { cursor: pointer; font-size: 1.2rem; user-select: none; }
        .star.active { color: #f9a825; }
        .overview-item .goto-btn {
            background: #dcedc8; border: none; padding: 2px 12px;
            border-radius: 30px; cursor: pointer; font-size: 0.7rem;
        }
        .overview-item .goto-btn:hover { background: #c8e6c9; }

        .review-card {
            background: #f7fcf7; border-radius: 28px; padding: 24px 22px;
            border: 1px solid #c8e6c9; margin-bottom: 20px;
        }
        .review-filter-bar {
            display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
            background: #eaf7ea; padding: 8px 16px; border-radius: 40px;
            margin-bottom: 16px; border: 1px solid #a5d6a7;
        }
        .review-filter-bar select, .review-filter-bar input {
            padding: 4px 12px; border-radius: 30px; border: 1px solid #a5d6a7;
            background: white; font-size: 0.9rem;
        }
        .review-filter-bar button {
            background: #2d6a2d; border: none; color: white;
            padding: 4px 18px; border-radius: 40px; font-weight: 500; cursor: pointer;
        }

        @media (max-width:700px) {
            .top-nav .brand { font-size:1.2rem; }
            .nav-tabs button { font-size:0.75rem; padding:4px 12px; }
            .home-grid { grid-template-columns:1fr 1fr; }
            .overview-grid { grid-template-columns:1fr; }
        }
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="top-nav">
        <div class="brand">🌿 词根词缀 <small>记忆库</small></div>
        <div class="nav-tabs">
            <button class="active" data-page="home">🏠 主页</button>
            <button data-page="learn">📖 学习</button>
            <button data-page="review">🔁 复习</button>
            <button data-page="overview">📋 概览</button>
        </div>
        <div class="top-actions">
            <button id="resetBtn">🔄 重置</button>
        </div>
    </div>

    <!-- 主页 -->
    <div id="page-home" class="page active">
        <div class="home-grid">
            <div class="home-card" data-page="learn"><div class="icon">📖</div><div class="label">学习模式</div><div class="desc">新词 & 标记</div></div>
            <div class="home-card" data-page="review"><div class="icon">🔁</div><div class="label">智能复习</div><div class="desc">红色优先 · 到期提醒</div></div>
            <div class="home-card" data-page="overview"><div class="icon">📋</div><div class="label">概览</div><div class="desc">全部 · 待背 · 复习中 · 生词本</div></div>
        </div>
        <div class="stats-grid" id="statsGrid">
            <div class="stat-item"><div class="num" id="statTotal">0</div><div class="lbl">总词根</div></div>
            <div class="stat-item"><div class="num" id="statGreen">0</div><div class="lbl">熟悉 (绿)</div></div>
            <div class="stat-item"><div class="num" id="statYellow">0</div><div class="lbl">模糊 (黄)</div></div>
            <div class="stat-item"><div class="num" id="statRed">0</div><div class="lbl">陌生 (红)</div></div>
            <div class="stat-item"><div class="num" id="statUntouched">0</div><div class="lbl">未标记</div></div>
            <div class="stat-item"><div class="num" id="statStar">0</div><div class="lbl">⭐ 生词本</div></div>
        </div>

        <!-- 游戏区 -->
        <div class="game-area">
            <h3>📝 看词选义 <span style="font-size:0.8rem;font-weight:400;color:#4a6a4a;">答对标记为熟悉 · 答错标记为陌生</span></h3>
            <div class="game-question" id="gameQuestion">点击 "新题" 开始</div>
            <div class="game-options" id="gameOptions"></div>
            <div class="game-feedback" id="gameFeedback"></div>
            <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:8px;">
                <div class="game-nav">
                    <button class="secondary" id="gamePrevBtn" disabled>◀ 返回</button>
                    <button id="gameNewBtn">🔄 新题</button>
                </div>
                <span class="game-score">🏆 得分: <span id="gameScore">0</span></span>
                <span class="game-score">📊 已答: <span id="gameTotal">0</span></span>
            </div>
        </div>
    </div>

    <!-- 学习页面 -->
    <div id="page-learn" class="page">
        <div class="filter-bar" style="display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:#eaf7ea;padding:8px 16px;border-radius:40px;margin-bottom:16px;border:1px solid #a5d6a7;">
            <span style="font-weight:500;">🔍 筛选</span>
            <select id="learnFilter"><option value="all">全部词根</option><option value="green">熟悉 (绿)</option><option value="yellow">模糊 (黄)</option><option value="red">陌生 (红)</option><option value="untouched">未标记</option><option value="star">⭐ 生词本</option></select>
            <button id="learnShuffleBtn">🎲 打乱</button>
            <button id="learnResetOrderBtn">↩️ 恢复顺序</button>
            <span style="margin-left:auto;font-size:0.9rem;" id="learnCounter">1 / 0</span>
        </div>
        <div class="card" id="cardContainer">
            <div class="card-header"><span class="idx" id="indexDisplay">序号 1</span><span class="root-tag" id="rootLabel">词根: cert-</span></div>
            <div class="root-box"><span class="root-name" id="rootName">cert-</span><span class="pronounce" id="rootPronounce">/sɜːrt/</span><div class="source" id="rootSource">拉丁语 certus</div></div>
            <div class="mnemonic" id="mnemonicDisplay">🧠 助记</div>
            <div id="mainWordsContainer"></div>
            <div class="memory-progress-area">
                <span class="label">🍪 熟悉度</span>
                <div class="progress-track"><div class="fill" id="familiarityFill" style="width:0%;"></div></div>
                <span class="progress-percent" id="familiarityPercent">0%</span>
                <span class="progress-detail" id="familiarityDetail">0 / 0 熟悉</span>
            </div>
            <div class="extra-section"><details open><summary>📎 附加词</summary><ul id="extraList"></ul></details></div>
        </div>
        <div class="nav">
            <button id="prevBtn" disabled>◀ 上一张</button>
            <div class="jump-box"><label for="jumpInput">跳转</label><input type="number" id="jumpInput" min="1" value="1"><button id="jumpBtn">Go</button></div>
            <button class="primary" id="nextBtn">下一张 ▶</button>
        </div>
        <div class="progress-bar-wrapper"><div class="progress-bar-fill" id="progressFill" style="width:0%;"></div></div>
    </div>

    <!-- 复习页面 -->
    <div id="page-review" class="page">
        <div class="review-filter-bar">
            <span style="font-weight:500;">🔁 复习队列</span>
            <select id="reviewMode"><option value="due">到期复习 (红→黄→绿)</option><option value="all">全部 (按熟悉度排序)</option></select>
            <button id="reviewRefreshBtn">⟳ 刷新队列</button>
            <span style="margin-left:auto;" id="reviewCounter">0 张卡片</span>
        </div>
        <div id="reviewCardContainer"></div>
        <div class="nav" id="reviewNav">
            <button id="reviewPrevBtn" disabled>◀ 上一张</button>
            <div class="jump-box"><label for="reviewJumpInput">跳转</label><input type="number" id="reviewJumpInput" min="1" value="1"><button id="reviewJumpBtn">Go</button></div>
            <button class="primary" id="reviewNextBtn">下一张 ▶</button>
        </div>
        <div class="progress-bar-wrapper"><div class="progress-bar-fill" id="reviewProgressFill" style="width:0%;"></div></div>
    </div>

    <!-- 概览页面 -->
    <div id="page-overview" class="page">
        <div style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px;align-items:center;">
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
                <button class="overview-tab active" data-filter="all">📚 全部</button>
                <button class="overview-tab" data-filter="untouched">🆕 待背</button>
                <button class="overview-tab" data-filter="reviewing">🔄 复习中</button>
                <button class="overview-tab" data-filter="star">⭐ 生词本</button>
            </div>
            <input type="text" id="overviewSearch" placeholder="🔍 搜索词根/单词..." style="flex:1;min-width:120px;padding:6px 16px;border-radius:40px;border:1px solid #a5d6a7;">
        </div>
        <div id="overviewContainer" class="overview-grid"></div>
    </div>
</div>
<script>
    // ===== 数据 =====

const WORDS = [
  // 1. cert-
  {
    id: 1,
    root: "cert-",
    pronounce: "/sɜːrt/瑟儿特",
    source: "拉丁语 certus · 确定的,确实的",
    mnemonic: "cert就是\"测它\"。一件事不确定的时候，我们会反复测它、核实它；测清楚以后，真假就确定了，结果也就确实可靠。所以cert就是\"确定的、确实的\"的意思。",
    mainWords: [
      { word: "certain", pos: "a.", detail: "构词: cert(确定) + ain(形容词后缀)<br>释义: 确定的;某个", example: "💬 I'm certain of the answer. ｜ 推导: 确定 + 形容词化 = 确定的,肯定的" },
      { word: "certainly", pos: "ad.", detail: "构词: certain + ly(副词后缀)<br>释义: 当然;必定", example: "💬 Certainly, I'll help you. ｜ 推导: 确定的 + 副词化 = 当然,必定" },
      { word: "certainty", pos: "n.", detail: "构词: certain + ty(名词后缀)<br>释义: 确定性;必然", example: "💬 There's no certainty about it. ｜ 推导: 确定的 + 名词化 = 确定性,确实性" },
      { word: "certificate", pos: "n.", detail: "构词: cert + ific + ate(名词后缀)<br>释义: 证书;证明", example: "💬 He got a graduation certificate. ｜ 推导: 确定 + 做成的东⻄ = 证明文件,证书" },

    { id: 162, root: "limit", pronounce: "/ˈlɪmɪt/利米特", source: "拉丁语 limes · 界限,限制", mnemonic: "limit可以按读音想成“立门”。在一块区域边上立起一道门，门所在的位置就划出了界限；门不开时，人也不能继续通过，形成限制。所以limit就是“界限、限制”。", mainWords: [ { word: "limit", pos: "n./v.", detail: "限制;界限", example: "💬 There's a limit to my patience." }, { word: "limited", pos: "a.", detail: "有限的", example: "💬 Resources are limited." }, { word: "limitation", pos: "n.", detail: "限制;缺陷", example: "💬 Know your limitations." } ], extra: ["unlimited a. 无限的", "limiting a. 限制性的", "limitless a. 无限的", "delimit v. 划定界限"] },
    { id: 163, root: "liter-", pronounce: "/ˈlɪtər/利特儿", source: "拉丁语 littera · 字母,文字,书写", mnemonic: "liter与小学词letter形近音近。letter 是一个字母，许多字母连起来组成文字，再把文字落到纸上就是书写。所以liter就是“字母、文字、书写”。", mainWords: [ { word: "literature", pos: "n.", detail: "文学;文献", example: "💬 She studies English literature." }, { word: "literally", pos: "ad.", detail: "字面上;确实", example: "💬 I was literally freezing." }, { word: "literary", pos: "a.", detail: "文学的;书面的", example: "💬 He won a literary award." }, { word: "literacy", pos: "n.", detail: "读写能力", example: "💬 Adult literacy is improving." }, { word: "illiterate", pos: "a.", detail: "文盲的;无知的", example: "💬 Many adults remain illiterate." } ], extra: ["literate a. 有读写能力的", "literal a. 字面的;逐字的"] },
    { id: 164, root: "min-/ministr-", pronounce: "/mɪn/米恩", source: "拉丁语 minister · 服务,管理", mnemonic: "ministr就是“忙你事儿”。替你忙事情，就是为你服务；把许多人的事情分好、安排好，就是管理。min是它缩短后的形式，所以min/ministr就是“服务、管理”。", mainWords: [ { word: "minister", pos: "n.", detail: "部长;牧师", example: "💬 The minister announced new policies." }, { word: "ministry", pos: "n.", detail: "部;内阁", example: "💬 She works in the Ministry of Education." }, { word: "administer", pos: "v.", detail: "管理;执行", example: "💬 They administer the program efficiently." }, { word: "administration", pos: "n.", detail: "管理;政府", example: "💬 The new administration took office." } ], extra: ["administrative a. 管理的", "administrator n. 管理者", "ministerial a. 部长的", "administrate v. 管理"] },
    { id: 165, root: "neighbor", pronounce: "/ˈneɪbər/恩诶伯儿", source: "nēah(近) + gebūr(居民) · 邻居,附近的人", mnemonic: "neighbor可以记成near brother。 near 是“附近”，brother 是“兄弟”。 住在附近、像兄弟一样经常见面的人，就是邻居和附近的人。 所以neighbor就是“邻居、附近的人”。", mainWords: [ { word: "neighbor", pos: "n.", detail: "邻居", example: "💬 Love thy neighbor as thyself." }, { word: "neighborhood", pos: "n.", detail: "社区;街坊", example: "💬 It's a friendly neighborhood." } ], extra: ["neighboring a. 邻近的", "neighborly a. 友好的", "good-neighborliness n. 睦邻友好"] },
    { id: 166, root: "nom-/noun-", pronounce: "/naʊn/恩奥恩", source: "拉丁语 nomen · 名字,名称", mnemonic: "nom与小学词 name 形近音近。name 就是名字和名称；noun是同一词根的另一种展开形式。所以nom/noun就是“名字、名称”。", mainWords: [ { word: "noun", pos: "n.", detail: "名词", example: "💬 A noun is a naming word." }, { word: "pronoun", pos: "n.", detail: "代词", example: "💬 He is a pronoun for John." } ], extra: ["nominal a. 名义上的", "nominate v. 提名", "denomination n. 命名;面额", "renown n. 声名"] },
    { id: 167, root: "nounce", pronounce: "/naʊns/恩奥恩斯", source: "拉丁语 nuntiare · 报告,宣告", mnemonic: "nounce就是“闹声”。一个人把消息大声闹出来，让周围人都听见，就是在报告和宣告。所以nounce就是“报告、宣告”。", mainWords: [ { word: "announce", pos: "v.", detail: "宣布,宣告", example: "💬 They announced the results." }, { word: "pronounce", pos: "v.", detail: "发音;宣判", example: "💬 How do you pronounce this word?" }, { word: "denounce", pos: "v.", detail: "谴责,告发", example: "💬 They denounced the corruption." } ], extra: ["announcement n. 公告,宣布", "announcer n. 播音员", "pronunciation n. 发音", "renounce v. 放弃,否认"] },
    { id: 168, root: "nuc-", pronounce: "/njuːk/恩耶乌克", source: "拉丁语 nux (坚果) · 核,果核", mnemonic: "nuc-就是“纽扣”。 切开一个 fruit，会以后看到 middle 有一块 hard、round 的东西，就像果肉里藏着一颗小纽扣。 这块硬东西就是果核；处在最中间、最关键的位置，又可以表示核心。 所以nuc-就是“核、果核、核心”。", mainWords: [ { word: "nucleus", pos: "n.", detail: "核;核心", example: "💬 The nucleus controls the cell." }, { word: "nuclear", pos: "a.", detail: "核的;核能的", example: "💬 Nuclear energy is powerful." } ], extra: ["nuclei n. 核(复数)", "nucleon n. 核子", "nucleic a. 核的", "nucleate v. 成核"] },
    { id: 169, root: "nut", pronounce: "/nʌt/恩阿特", source: "古英语 hnutu · 坚果", mnemonic: "nut就是小学学过的单词，拼写和读音都不用变化。nut 是坚果，所以nut就是“坚果”。", mainWords: [ { word: "nut", pos: "n.", detail: "坚果;螺母", example: "💬 Squirrels collect nuts for winter." }, { word: "peanut", pos: "n.", detail: "花生", example: "💬 Peanut butter is very popular." } ], extra: ["nutshell n. 坚果壳;简明扼要", "walnut n. 核桃", "chestnut n. 栗子", "coconut n. 椰子", "hazelnut n. 榛子", "doughnut n. 甜甜圈"] },
    { id: 170, root: "pair", pronounce: "/peər/普艾儿儿", source: "拉丁语 paria · 成对,相等", mnemonic: "pair本身就是我们小学学过的pair。 pair 就是“一对、一双”。 所以pair就是“成对、相等”。", mainWords: [ { word: "pair", pos: "n.", detail: "一对,一双", example: "💬 A pair of shoes." }, { word: "impair", pos: "v.", detail: "损害,削弱", example: "💬 Smoking impairs health." } ], extra: ["repair v. 修理", "compare v. 比较", "disparity n. 差异", "parity n. 平等", "au pair n. 互惠生"] },
    { id: 171, root: "par-/pare-", pronounce: "/pɛər/普诶额儿", source: "拉丁语 parere · 出现,显现,生产", mnemonic: "par完整保留在小学词parent的开头，pare只是末尾多一个 e 的近形变体。parent 会让新的孩子出生、生产出新的生命；孩子出生以后，也从原来看不见的状态显现、出现在世界上。所以par/pare就是“出现、显现、生产”。", mainWords: [ { word: "parent", pos: "n.", detail: "父母", example: "💬 My parents are very supportive." }, { word: "apparent", pos: "a.", detail: "明显的", example: "💬 The answer is apparent to all." }, { word: "transparent", pos: "a.", detail: "透明的", example: "💬 The glass is transparent." } ], extra: ["apparently ad. 显然地", "transparency n. 透明度", "parental a. 父母的", "appearance n. 外表;出现"] },
    { id: 172, root: "pare", pronounce: "/peər/普艾儿儿", source: "拉丁语 parare · 准备,安排", mnemonic: "pare是我们小学学过的词prepare的一部分。 prepare 就是“准备”。 在这个词里，负责表达“准备”这一层意思的部分就是pare。 所以pare就是“准备、安排”。", mainWords: [ { word: "prepare", pos: "v.", detail: "准备", example: "💬 Prepare for the exam carefully." }, { word: "compare", pos: "v.", detail: "比较", example: "💬 Compare these two options." }, { word: "repair", pos: "v.", detail: "修理", example: "💬 He repaired the broken chair." }, { word: "spare", pos: "v.", detail: "节省;宽恕", example: "💬 Can you spare some time?" } ], extra: ["preparation n. 准备", "comparative a. 比较的", "reparation n. 赔偿;修理", "separate v. 分离"] },
    { id: 173, root: "schol-", pronounce: "/skɒl/斯克奥勒", source: "希腊语 σχολή · 闲暇,学习", mnemonic: "schol就是“school”。school就是“学校，学院”，其中最关键的意思可以继续联系到“闲暇”，由这个意思还可以继续推出学习，所以schol就是“闲暇,学习”。", mainWords: [ { word: "school", pos: "n.", detail: "学校;学派", example: "💬 She goes to school every day." }, { word: "scholar", pos: "n.", detail: "学者;奖学金获得者", example: "💬 He is a distinguished scholar." }, { word: "scholarship", pos: "n.", detail: "奖学金;学识", example: "💬 She won a full scholarship." } ], extra: ["scholastic a. 学术的", "schooling n. 学校教育", "scholarly a. 博学的", "preschool n. 学前班"] },
    { id: 174, root: "seem", pronounce: "/siːm/斯衣姆", source: "古诺尔斯语 · 看似,显得", mnemonic: "seem就是“似么”。 问一个东西“似么”，就是在判断它看起来是否相似、显得怎样。 所以seem就是“看似、显得”。", mainWords: [ { word: "seem", pos: "v.", detail: "看似,似乎", example: "💬 Things are not what they seem." }, { word: "seemingly", pos: "ad.", detail: "表面上,看似", example: "💬 A seemingly simple task." } ], extra: ["seeming a. 表面的,外观的", "seemly a. 适当的,得体的", "unseemly a. 不适当的", "beseem v. 适合,适宜"] },
    { id: 175, root: "sil-", pronounce: "/sɪl/西勒", source: "拉丁语 silēre · 安静,寂静", mnemonic: "sil就是“熄了”。 声音和动静都熄了，周围就会安静、寂静。 所以sil就是“安静、寂静”。", mainWords: [ { word: "silence", pos: "n.", detail: "寂静;沉默", example: "💬 The silence was deafening." }, { word: "silent", pos: "a.", detail: "安静的;沉默的", example: "💬 She remained silent." } ], extra: ["silently ad. 安静地", "silencer n. 消音器", "silentium n. 静默期", "unsilent a. 不安静的"] },

    { id: 177, root: "sky", pronounce: "/skaɪ/斯克爱", source: "古诺尔斯语 ský · 天空,云", mnemonic: "sky本身就是我们小学学过的sky。 sky 就是“天空、天气”。 所以sky就是“天空、云”。", mainWords: [ { word: "sky", pos: "n.", detail: "天空;天气", example: "💬 The sky is clear today." }, { word: "skyscraper", pos: "n.", detail: "摩天大楼", example: "💬 The city has many skyscrapers." } ], extra: ["skyline n. 天际线", "skylight n. 天窗", "skydive v. 跳伞", "skyward ad. 向天空", "skywalk n. 天桥", "skyrocket v. 飞涨"] },
    { id: 178, root: "stab-/stabl-", pronounce: "/stæb/斯泰布", source: "拉丁语 stabilis · 稳定,固定,坚固", mnemonic: "stabl可以拆成s＋table。table 是小学词“桌子”，前面加上 s 后仍完整保留 table 的字母；一张四条腿稳稳站住的桌子，不会摇动，位置固定而坚固。所以stab/stabl就是“稳定、固定、坚固”。", mainWords: [ { word: "stable", pos: "a./n.", detail: "稳定的;马厩", example: "💬 The economy remains stable." }, { word: "establish", pos: "v.", detail: "建立;确立", example: "💬 They established a new company." }, { word: "establishment", pos: "n.", detail: "建立;机构", example: "💬 A business establishment opened." }, { word: "stability", pos: "n.", detail: "稳定性", example: "💬 Political stability is crucial." } ], extra: ["stabilize v. 使稳定", "unstable a. 不稳定的", "instability n. 不稳定性", "stabilization n. 稳定化", "destabilize v. 破坏稳定"] },
    { id: 179, root: "stair", pronounce: "/steər/斯特艾儿儿", source: "古英语 stæger · 楼梯,台阶", mnemonic: "stair本身就是我们小学学过的stair。 stair 就是“楼梯”。 所以stair就是“楼梯、台阶”。", mainWords: [ { word: "stair", pos: "n.", detail: "楼梯", example: "💬 Be careful on the stairs." }, { word: "upstairs", pos: "ad.", detail: "楼上", example: "💬 She went upstairs to sleep." }, { word: "downstairs", pos: "ad.", detail: "楼下", example: "💬 The kitchen is downstairs." }, { word: "staircase", pos: "n.", detail: "楼梯间", example: "💬 A spiral staircase is beautiful." } ], extra: ["stairway n. 楼梯道", "stairwell n. 楼梯井", "backstair n. 后楼梯"] },
    { id: 180, root: "stereo-", pronounce: "/ˈsteriəʊ/斯特诶儿衣欧", source: "希腊语 stereós · 固体的,立体的", mnemonic: "stereo本身就是我们熟悉的stereo。stereo就是立体声，立体的东西不是薄薄的一面，而是有厚度、有空间的固体，所以stereo就是“固体的,立体的”。", mainWords: [ { word: "stereo", pos: "n.", detail: "立体声;立体声装置", example: "💬 I bought a new stereo system." }, { word: "stereotype", pos: "n.", detail: "刻板印象;陈规", example: "💬 Don't judge by stereotypes." } ], extra: ["stereotypical a. 刻板的", "stereoscope n. 立体镜", "stereophonic a. 立体声的", "stereographic a. 立体的", "stereometry n. 立体几何"] },
    { id: 181, root: "sum-", pronounce: "/sʌm/斯阿姆", source: "拉丁语 summus; sumere · 最高点,顶端,总和；拿取", mnemonic: "1.sum是数学里天天见到的求和，许多数加在一起得到total，所以sum就是“总和”。2.summit是山最高的顶端，可以把sum理解为所有高度加到最高点，所以sum还有“最高点、顶端”的意思。3.要把许多东西加成一个总和，先要把它们全部take到一起，因此sum还可以引出“拿取”。", mainWords: [ { word: "summit", pos: "n.", detail: "顶点;峰会", example: "💬 They reached the summit at dawn." }, { word: "sum", pos: "n./v.", detail: "总数;金额;总结", example: "💬 The sum of 2 and 3 is 5." }, { word: "summary", pos: "n.", detail: "摘要;概要", example: "💬 Write a brief summary." }, { word: "summarize", pos: "v.", detail: "概括;总结", example: "💬 Can you summarize the article?" }, { word: "assume", pos: "v.", detail: "假设;承担", example: "💬 Don't assume he knows the truth." }, { word: "consume", pos: "v.", detail: "消耗;消费", example: "💬 Fire consumed the building." }, { word: "resume", pos: "v./n.", detail: "恢复;简历", example: "💬 Submit your resume online." }, { word: "presume", pos: "v.", detail: "推定;假定", example: "💬 I presume you're right." }, { word: "presumably", pos: "ad.", detail: "大概;据推测", example: "💬 Presumably, he has left." } ], extra: ["summation n. 总和;总结", "summon v. 召唤;召集", "consummate a. 完美的"] },
    { id: 182, root: "tabula", pronounce: "/ˈteɪbl/特诶布勒", source: "拉丁语 tabula · 平板,平面", mnemonic: "tabula可以直接想到我们小学学过的table。 table 就是“桌子、表格”。 桌面和表格都像一块展开的平板和平面。 所以tabula就是“平板、平面”。", mainWords: [ { word: "table", pos: "n.", detail: "桌子;表格", example: "💬 Put the book on the table." }, { word: "tablet", pos: "n.", detail: "药片;平板电脑", example: "💬 Take two tablets after meals." } ], extra: ["tablespoon n. 汤匙", "tabletop n. 桌面", "tablecloth n. 桌布", "tabular a. 表格式的", "tabulate v. 制表"] },
    { id: 183, root: "val-", pronounce: "/væl/五艾勒", source: "拉丁语 valere · 强壮,有价值", mnemonic: "val是我们小学学过的词value的一部分。value就是价值；真正有价值的东西通常经得住使用和考验，因此也给人强壮、可靠的感觉，所以val就是“强壮,有价值”。", mainWords: [ { word: "value", pos: "n./v.", detail: "价值;重视", example: "💬 We value your opinion." }, { word: "valuable", pos: "a.", detail: "有价值的", example: "💬 This is valuable information." }, { word: "evaluate", pos: "v.", detail: "评估", example: "💬 Evaluate the project carefully." }, { word: "equivalent", pos: "a.", detail: "等价的", example: "💬 Find an equivalent expression." }, { word: "valid", pos: "a.", detail: "有效的", example: "💬 Your passport is still valid." }, { word: "invalid", pos: "a./n.", detail: "无效的;病人", example: "💬 The ticket is invalid now." }, { word: "invaluable", pos: "a.", detail: "无价的", example: "💬 Your help is invaluable." }, { word: "prevail", pos: "v.", detail: "胜过;流行", example: "💬 Justice will prevail." }, { word: "available", pos: "a.", detail: "可用的", example: "💬 Is this seat available?" } ], extra: ["interval n. 间隔,间歇"] },
    { id: 184, root: "caf-", pronounce: "/kæf/卡夫", source: "阿拉伯语 qahwa · 咖啡", mnemonic: "caf就是我们平时说的“咖啡”。 cafe 就是喝咖啡的地方，所以其中的 caf 可以表示“咖啡”。 所以caf就是“咖啡”。", mainWords: [ { word: "cafe", pos: "n.", detail: "咖啡馆,小餐馆", example: "💬 Let's meet at the cafe." }, { word: "cafeteria", pos: "n.", detail: "自助餐厅,食堂", example: "💬 The school cafeteria serves lunch." } ], extra: ["caffeine n. 咖啡因", "decaf n. 脱咖啡因咖啡", "coffee n. 咖啡", "cappuccino n. 卡布奇诺", "espresso n. 浓缩咖啡"] },
    { id: 185, root: "cap-/capit-", pronounce: "/kæp/卡普", source: "拉丁语 caput · 头,首要的", mnemonic: "cap/capit可以记成cap it。 cap 是帽子，cap it 就是“给它戴上帽子”。 帽子要戴在头上，头又处在身体最上面。 所以cap/capit就是“头、首要的”。", mainWords: [ { word: "cap", pos: "n.", detail: "帽子;盖子", example: "💬 Put the cap back on the bottle." }, { word: "capital", pos: "n./a.", detail: "首都;资本;首要的", example: "💬 Beijing is the capital of China." }, { word: "captain", pos: "n.", detail: "船长;队长", example: "💬 The captain leads the team." }, { word: "cape", pos: "n.", detail: "海⻆;斗篷", example: "💬 He wore a black cape." }, { word: "capitalism", pos: "n.", detail: "资本主义", example: "💬 Capitalism dominates the economy." } ], extra: ["capitalist n. 资本家", "capitalize v. 资本化;大写", "decapitate v. 斩首", "capitulate v. 投降", "per capita a. 人均的"] },
    { id: 186, root: "cap-/cip-", pronounce: "/kæp/卡普", source: "拉丁语 capere · 拿,取,抓住", mnemonic: "为了记忆，可以把CAP记成“Catch And Put in hand”。Catch表示先抓住目标；Put in hand表示再把它放进手里。抓住以后拿到手中，就是拿、取和捕获。所以cap/cip就是“拿、取、抓住、接受”。", mainWords: [ { word: "participate", pos: "v.", detail: "参与", example: "💬 Everyone can participate in the event." }, { word: "participant", pos: "n.", detail: "参与者", example: "💬 All participants must register." }, { word: "anticipate", pos: "v.", detail: "预期;预料", example: "💬 We anticipate good results." }, { word: "recipient", pos: "n.", detail: "接受者", example: "💬 The recipient thanked the donor." }, { word: "recipe", pos: "n.", detail: "食谱;配方", example: "💬 Follow the recipe carefully." }, { word: "municipal", pos: "a.", detail: "市政的", example: "💬 Municipal services are important." }, { word: "reciprocal", pos: "a.", detail: "相互的", example: "💬 They have reciprocal respect." } ], extra: [] },
    { id: 187, root: "cern-", pronounce: "/sɜːn/瑟恩", source: "拉丁语 cernere · 区分,筛选,决定", mnemonic: "cern就是“审”。审查一件事时，要先仔细观察，再把不同情况区分开来，最后作出筛选和决定。所以cern就是“区分、筛选、决定”。", mainWords: [ { word: "discern", pos: "v.", detail: "辨别;识别", example: "💬 It's hard to discern the truth." }, { word: "concern", pos: "v./n.", detail: "涉及;关心", example: "💬 This concerns everyone." }, { word: "concerning", pos: "prep.", detail: "关于", example: "💬 Questions concerning the policy." }, { word: "secret", pos: "n./a.", detail: "秘密;秘密的", example: "💬 Keep it a secret." }, { word: "secretary", pos: "n.", detail: "秘书;部长", example: "💬 The secretary took notes." } ], extra: ["discernment n. 洞察力", "secretive a. 隐秘的", "unconcerned a. 不关心的"] },
    { id: 188, root: "fail-/faul-", pronounce: "/fɔːl/福勒", source: "拉丁语 fallere · 欺骗,失败,错误", mnemonic: "①fail与小学词 fall 形近音近。一个人没有站稳而 fall，事情也没有达到原定目标，就可以记成失败、未能成功。②faul可继续联系“犯了”：犯了错，就出现错误和过错；故意用错的内容骗人，又会形成欺骗。所以fail/faul就是“欺骗、失败、错误、未能成功”。", mainWords: [ { word: "fail", pos: "v.", detail: "失败;不及格", example: "💬 He failed the exam." }, { word: "failure", pos: "n.", detail: "失败;故障", example: "💬 Learn from your failures." }, { word: "false", pos: "a.", detail: "错误的;假的", example: "💬 That is a false statement." }, { word: "fault", pos: "n.", detail: "过失;缺点", example: "💬 It's not your fault." }, { word: "faulty", pos: "a.", detail: "有缺陷的", example: "💬 The machine is faulty." } ], extra: ["fallacy n. 谬论", "fallible a. 易犯错的"] },
    { id: 189, root: "home", pronounce: "/həʊm/赫欧姆", source: "古英语 hām · 家,住所", mnemonic: "home本身就是我们小学学过的home。 home 就是“家、家乡、家庭的”。 所以home就是“家、住所”。", mainWords: [ { word: "home", pos: "n./a.", detail: "家;家乡;家庭的", example: "💬 There's no place like home." }, { word: "homework", pos: "n.", detail: "家庭作业", example: "💬 I finished my homework early." } ], extra: ["homeland n. 祖国;故乡", "homeless a. 无家可归的", "homemade a. 自制的", "hometown n. 家乡", "homesick a. 想家的"] },
    { id: 190, root: "lat-", pronounce: "/læt/莱特", source: "拉丁语 latus; latēre · 宽,侧面；携带,承载；延迟,迟到;隐藏", mnemonic: "lat末尾补一个不发音的 e 就是小学词 late；late 是迟到、延迟。 所以lat-就是“宽,侧面；携带,承载；延迟,迟到;隐藏”。", mainWords: [ { word: "lateral", pos: "a.", detail: "侧面的;横向的", example: "💬 Lateral thinking is creative." }, { word: "latitude", pos: "n.", detail: "纬度;自由度", example: "💬 The city is at 40 degrees latitude." }, { word: "dilate", pos: "v.", detail: "扩大;详述", example: "💬 The pupils dilate in darkness." }, { word: "relate", pos: "v.", detail: "叙述;相关", example: "💬 Can you relate the story?" }, { word: "relation", pos: "n.", detail: "关系", example: "💬 Their relation is very close." }, { word: "relationship", pos: "n.", detail: "关系", example: "💬 They have a good relationship." }, { word: "relative", pos: "a./n.", detail: "相对的;亲戚", example: "💬 Everything is relative." }, { word: "relativity", pos: "n.", detail: "相对性", example: "💬 Einstein's theory of relativity." }, { word: "translate", pos: "v.", detail: "翻译", example: "💬 Can you translate this text?" }, { word: "correlate", pos: "v.", detail: "相关联", example: "💬 These factors correlate strongly." }, { word: "latent", pos: "a.", detail: "潜在的,隐藏的", example: "💬 The disease remains latent." }, { word: "late", pos: "a.", detail: "迟到的;晚的", example: "💬 Sorry, I'm late." }, { word: "latter", pos: "a.", detail: "后者的;后半的", example: "💬 I prefer the latter option." }, { word: "lately", pos: "ad.", detail: "最近,近来", example: "💬 I haven't seen him lately." } ], extra: ["bilateral a. 双边的", "collateral a. 附属的", "dilation n. 扩张", "unilateral a. 单边的", "latency n. 潜伏期"] },
    { id: 191, root: "lax-", pronounce: "/læks/莱克斯", source: "拉丁语 laxare · 放松,松开", mnemonic: "lax就是“拉松”。 把拉紧的东西松开，就是放松和松开。 所以lax就是“放松、松开”。", mainWords: [ { word: "relax", pos: "v.", detail: "放松", example: "💬 Just relax and enjoy yourself." }, { word: "release", pos: "v./n.", detail: "释放", example: "💬 Release the pressure slowly." } ], extra: ["relaxation n. 放松,松弛", "relaxing a. 令人放松的", "relaxed a. 放松的,轻松的", "lax a. 松弛的,宽松的", "laxative n. 泻药 a.通便的"] },
    { id: 192, root: "lev-", pronounce: "/lev/勒诶五", source: "拉丁语 levis/levare · 轻的,举起,减轻", mnemonic: "lev就是“来扶”。一个东西倒在地上，来把它扶起来，就是举起；重物被扶起来以后，原来的负担也会减轻。所以lev就是“轻的、举起、减轻”。", mainWords: [ { word: "elevator", pos: "n.", detail: "电梯", example: "💬 Take the elevator to the 5th floor." }, { word: "elevate", pos: "v.", detail: "举起;提升", example: "💬 Exercise can elevate your mood." }, { word: "level", pos: "n./a.", detail: "水平;平的", example: "💬 Check the water level." }, { word: "levy", pos: "v./n.", detail: "征收", example: "💬 The government will levy new taxes." }, { word: "lever", pos: "n.", detail: "杠杆", example: "💬 Use a lever to lift heavy objects." }, { word: "alleviate", pos: "v.", detail: "减轻;缓和", example: "💬 Medicine can alleviate pain." }, { word: "relieve", pos: "v.", detail: "缓解;减轻", example: "💬 This will relieve your stress." }, { word: "relief", pos: "n.", detail: "缓解;救济", example: "💬 It was a great relief to hear that." } ], extra: ["relevant a. 相关的;切题的", "believe v. 相信", "belief n. 信念;信仰"] },
    { id: 193, root: "liqu-", pronounce: "/ˈlɪkw/利克乌", source: "拉丁语 liquere · 流动,液体", mnemonic: "liqu就是“流去”。 能够不断流去并随容器改变形状的，就是液体和流动。 所以liqu就是“流动、液体”。", mainWords: [ { word: "liquid", pos: "n./a.", detail: "液体;液体的", example: "💬 Water is a liquid at room temperature." }, { word: "liquor", pos: "n.", detail: "烈酒;液体", example: "💬 He doesn't drink liquor." } ], extra: ["liquefy v. 液化", "liquidity n. 流动性", "liquidate v. 清算;清除", "liqueur n. 利口酒"] },
    { id: 194, root: "membr-", pronounce: "/ˈmembər/姆诶姆伯儿", source: "拉丁语 membrum · 肢体,部分", mnemonic: "membr可以直接想到我们小学学过的member。 member 就是“成员、身体部位”。 成员是整体中的一个部分，身体部位也是身体的一部分。 所以membr就是“肢体、部分”。", mainWords: [ { word: "member", pos: "n.", detail: "成员;肢体", example: "💬 He is a member of the club." }, { word: "membership", pos: "n.", detail: "会员资格;会员", example: "💬 The membership fee is due." } ], extra: ["membrane n. 薄膜;隔膜", "dismember v. 肢解", "remember v. 记住", "remembrance n. 记忆"] },
    { id: 195, root: "pel-/pul-", pronounce: "/pel/普诶勒", source: "拉丁语 pellere · 推动,驱使,击打", mnemonic: "pel/pul/puls就是“扑”。一个人猛地扑过去，会推动对方，甚至迫使对方移动；扑落到地面时又会产生一次击打。三个形式只是长短不同，动作画面相同，所以pel/pul/puls就是“推动、驱使、迫使、击打”。", mainWords: [ { word: "compel", pos: "v.", detail: "强迫", example: "💬 The law compels us to pay taxes." }, { word: "propel", pos: "v.", detail: "推进,推动", example: "💬 Wind propels the sailboat forward." }, { word: "expel", pos: "v.", detail: "驱逐,开除", example: "💬 He was expelled from school." }, { word: "repel", pos: "v.", detail: "击退,排斥", example: "💬 Magnets repel each other." }, { word: "pulse", pos: "n.", detail: "脉搏;脉冲", example: "💬 Check his pulse rate." }, { word: "impulse", pos: "n.", detail: "冲动;推动力", example: "💬 He acted on impulse." }, { word: "compulsory", pos: "a.", detail: "强制的", example: "💬 Compulsory education is necessary." } ], extra: [] },
    { id: 196, root: "prin-/prim-", pronounce: "/prɪn/普里恩", source: "拉丁语 primus · 第一,首要,最初", mnemonic: "prin/prim就是“排一”。把一个人或一件事排在第一位，它就是最初的、首要的，也是最重要的。所以prin/prim就是“第一、首要、最初”。", mainWords: [ { word: "principal", pos: "a./n.", detail: "主要的;校长", example: "💬 The principal reason is cost." }, { word: "principle", pos: "n.", detail: "原则;原理", example: "💬 Follow the basic principles." }, { word: "primary", pos: "a.", detail: "首要的;初级的", example: "💬 Primary education is important." }, { word: "prime", pos: "a./n.", detail: "首要的;最好的;全盛期", example: "💬 He is in his prime years." }, { word: "primitive", pos: "a.", detail: "原始的;简陋的", example: "💬 Primitive tools were made of stone." }, { word: "prince", pos: "n.", detail: "王子;亲王", example: "💬 The prince will be king." }, { word: "princess", pos: "n.", detail: "公主;王妃", example: "💬 The princess wore a crown." } ], extra: ["primarily ad. 主要地", "primacy n. 首位;至高无上", "primer n. 入门书;底漆"] },
    { id: 197, root: "rely (ligāre)", pronounce: "/rɪˈlaɪ/里勒爱", source: "拉丁语 ligāre · 捆绑,依赖", mnemonic: "rely末尾的读音像“赖”。一个人赖着某个支点不离开，就像被绳子绑在那里；正因为彼此连住，他才敢把重量交给它、依赖它。所以rely就是“捆绑、依赖”。", mainWords: [ { word: "rely", pos: "v.", detail: "依赖,信赖", example: "💬 We rely on our friends." }, { word: "reliable", pos: "a.", detail: "可靠的", example: "💬 She is a reliable partner." }, { word: "reliance", pos: "n.", detail: "依赖,信赖", example: "💬 Self-reliance is important." } ], extra: ["unreliable a. 不可靠的", "reliably ad. 可靠地", "self-reliance n. 自力更生", "reliant a. 依赖的"] },
    { id: 198, root: "roar", pronounce: "/rɔːr/儿奥儿", source: "拟声词 · 吼叫,咆哮", mnemonic: "roar就是猛兽吼叫时拉长的“嗷——”声。 所以roar就是“吼叫、咆哮”。", mainWords: [ { word: "roar", pos: "v./n.", detail: "吼叫,咆哮", example: "💬 The lion roared loudly." }, { word: "uproar", pos: "n.", detail: "喧嚣,骚动", example: "💬 The crowd was in an uproar." } ], extra: ["roaring a. 咆哮的;兴旺的", "roarer n. 吼叫者", "uproarious a. 喧嚣的", "outroar v. 吼声盖过"] },
    { id: 199, root: "rot", pronounce: "/rɒt/儿奥特", source: "日耳曼语系 · 腐烂,腐败", mnemonic: "rot就是“肉”。一块肉放得太久，会变坏、发臭并逐渐腐烂；由肉变坏的画面，就能记住腐烂和腐败。所以rot就是“腐烂、腐败”。", mainWords: [ { word: "rot", pos: "v./n.", detail: "腐烂;腐败", example: "💬 The wood began to rot." }, { word: "rotten", pos: "a.", detail: "腐烂的;糟糕的", example: "💬 The apple was rotten inside." } ], extra: ["rotting a. 正在腐烂的", "rottenness n. 腐烂;腐败", "dry rot n. 干腐病", "root rot n. 根腐病"] },
    { id: 200, root: "scen-", pronounce: "/siːn/斯衣恩", source: "希腊语 skene · 舞台,场景", mnemonic: "scen是我们小学学过的词scene的一部分。scene就是舞台上的一场、眼前的一幕，也就是场景。所以scen就是“舞台、场景”。", mainWords: [ { word: "scene", pos: "n.", detail: "场景;景象", example: "💬 The crime scene was sealed." }, { word: "scenery", pos: "n.", detail: "风景;景色", example: "💬 The mountain scenery is beautiful." } ], extra: ["scenic a. 风景优美的", "scenario n. 剧本;设想", "obscene a. 淫秽的", "proscenium n. 舞台前部"] },
    // 201 - 词根: -scend-/-scent-

    const STORAGE_KEY = 'root_word_status_v2';
    const STAR_KEY = 'root_star_words';
    let wordStatusStore = loadStore();

    function loadStore() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e){return {};} }
    function saveStore() { localStorage.setItem(STORAGE_KEY, JSON.stringify(wordStatusStore)); }
    function loadStarSet() { try { return new Set(JSON.parse(localStorage.getItem(STAR_KEY)) || []); } catch(e){return new Set();} }
    function saveStarSet() { localStorage.setItem(STAR_KEY, JSON.stringify([...starSet])); }

    function getStatus(cardId, wordIdx) { return (wordStatusStore[cardId]||{})[wordIdx] || null; }

    let statusUpdateTimer = null;

    function setStatus(cardId, wordIdx, color) {
        if (!wordStatusStore[cardId]) wordStatusStore[cardId]={};
        if (wordStatusStore[cardId][wordIdx] === color) {
            delete wordStatusStore[cardId][wordIdx];
        } else {
            wordStatusStore[cardId][wordIdx] = color;
        }
        if (Object.keys(wordStatusStore[cardId]).length===0) delete wordStatusStore[cardId];
        saveStore();
        if (statusUpdateTimer) cancelAnimationFrame(statusUpdateTimer);
        statusUpdateTimer = requestAnimationFrame(() => {
            updateStats();
            renderLearnCard(currentLearnIndex);
            renderOverview();
            renderReview();
            statusUpdateTimer = null;
        });
    }

    function setStatusForce(cardId, wordIdx, color) {
        if (!wordStatusStore[cardId]) wordStatusStore[cardId]={};
        wordStatusStore[cardId][wordIdx] = color;
        saveStore();
        if (statusUpdateTimer) cancelAnimationFrame(statusUpdateTimer);
        statusUpdateTimer = requestAnimationFrame(() => {
            updateStats();
            renderLearnCard(currentLearnIndex);
            renderOverview();
            renderReview();
            statusUpdateTimer = null;
        });
    }

    function toggleStar(cardId) {
        if (starSet.has(cardId)) starSet.delete(cardId);
        else starSet.add(cardId);
        saveStarSet();
        if (statusUpdateTimer) cancelAnimationFrame(statusUpdateTimer);
        statusUpdateTimer = requestAnimationFrame(() => {
            updateStats();
            renderOverview();
            renderReview();
            renderLearnCard(currentLearnIndex);
            statusUpdateTimer = null;
        });
    }

    function getCardFamiliarity(cardId) {
        const store=wordStatusStore[cardId]||{};
        let green=0,yellow=0,red=0,total=0;
        const data=WORDS.find(w=>w.id===cardId);
        if(!data) return {green,yellow,red,total,untouched:0};
        total=data.mainWords.length;
        for(let i=0;i<total;i++){
            const s=store[i];
            if(s==='green') green++;
            else if(s==='yellow') yellow++;
            else if(s==='red') red++;
        }
        return {green,yellow,red,total,untouched:total-green-yellow-red};
    }

    function updateStats(){
        let total=0,green=0,yellow=0,red=0,untouched=0,star=0;
        for (let w of WORDS) {
            const f=getCardFamiliarity(w.id);
            total+=f.total; green+=f.green; yellow+=f.yellow; red+=f.red; untouched+=f.untouched;
            if(starSet.has(w.id)) star++;
        }
        document.getElementById('statTotal').textContent=WORDS.length;
        document.getElementById('statGreen').textContent=green;
        document.getElementById('statYellow').textContent=yellow;
        document.getElementById('statRed').textContent=red;
        document.getElementById('statUntouched').textContent=untouched;
        document.getElementById('statStar').textContent=star;
    }

    // ===== 学习模式 =====
    let learnOrder = [];
    let currentLearnIndex = 0;

    function buildLearnOrder(filter='all'){
        let indices = WORDS.map((_,i)=>i);
        if(filter==='green') indices = indices.filter(i=>{ const f=getCardFamiliarity(WORDS[i].id); return f.green===f.total && f.total>0; });
        else if(filter==='yellow') indices = indices.filter(i=>{ const f=getCardFamiliarity(WORDS[i].id); return f.yellow>0 && f.green===0; });
        else if(filter==='red') indices = indices.filter(i=>{ const f=getCardFamiliarity(WORDS[i].id); return f.red>0 && f.green===0 && f.yellow===0; });
        else if(filter==='untouched') indices = indices.filter(i=>{ const f=getCardFamiliarity(WORDS[i].id); return f.untouched===f.total && f.total>0; });
        else if(filter==='star') indices = indices.filter(i=>starSet.has(WORDS[i].id));
        return indices;
    }

        const filter = document.getElementById('learnFilter').value;
        learnOrder = buildLearnOrder(filter);

        renderLearnCard(currentLearnIndex);

    // ===== 复习模式 =====
    let reviewQueue = [];
    let reviewIndex = 0;

    function buildReviewQueue(mode='due'){
        let items = WORDS.map((data, idx)=>{
            const f=getCardFamiliarity(data.id);
            const score = (f.red*3) + (f.yellow*2) + (f.green*1);
            return {idx, data, f, score};
        });
        if(mode==='due'){
            items.sort((a,b)=> {
                const aLevel = a.f.red>0 ? 3 : (a.f.yellow>0 ? 2 : (a.f.green>0 ? 1 : 0));
                const bLevel = b.f.red>0 ? 3 : (b.f.yellow>0 ? 2 : (b.f.green>0 ? 1 : 0));
                if(aLevel!==bLevel) return bLevel - aLevel;
                return b.score - a.score;
            });
        } else {
            items.sort((a,b)=>b.score - a.score);
        }
        reviewQueue = items.map(item=>item.idx);
        if(reviewQueue.length===0) reviewQueue = WORDS.map((_,i)=>i);
        reviewIndex = 0;
        renderReviewCard();
        updateReviewCounter();
    }

    // ===== 游戏 =====
    let gameQuestions = [];
    let gameIndex = 0;
    let gameScore = 0;
    let gameTotal = 0;
    let gameAnswered = false;
    let gameTimer = null;
    let wordMeaningMap = [];
    let gameHistory = [];

    function buildWordMeaningMap() {
        const map = [];
        for (let w of WORDS) {
            for (let i = 0; i < w.mainWords.length; i++) {
                const mw = w.mainWords[i];
                let meaning = mw.detail || '';
                const match = meaning.match(/释义:\s*(.+?)(?:<br>|$)/);
                if (match) {
                    meaning = match[1].trim();
                } else {
                    meaning = meaning.replace(/<br>/g, ' ').trim();
                }
                map.push({
                    word: mw.word,
                    meaning: meaning || mw.word,
                    cardId: w.id,
                    wordIdx: i
                });
            }
        }
        return map;
    }

    function initGame(){
        if (gameTimer) { clearTimeout(gameTimer); gameTimer = null; }
        wordMeaningMap = buildWordMeaningMap();
        if (wordMeaningMap.length === 0) {
            document.getElementById('gameQuestion').textContent = '暂无数据，请添加单词';
            document.getElementById('gameOptions').innerHTML = '';
            return;
        }
        gameQuestions = wordMeaningMap.map(item => ({
            word: item.word,
            correct: item.meaning,
            cardId: item.cardId,
            wordIdx: item.wordIdx,
            options: []
        }));
        for (let q of gameQuestions) {
            const others = wordMeaningMap
                .filter(m => m.word !== q.word)
                .map(m => m.meaning);
            const uniqueOthers = [...new Set(others)];
            const shuffled = uniqueOthers.sort(() => Math.random() - 0.5);
            const distractors = shuffled.slice(0, 3);
            while (distractors.length < 3) {
                distractors.push('—');
            }
            const options = [q.correct, ...distractors];
            for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }
            q.options = options;
        }
        gameQuestions.sort(() => Math.random() - 0.5);
        gameIndex = 0;
        gameAnswered = false;
        gameHistory = [];
        document.getElementById('gamePrevBtn').disabled = true;
        renderGameQuestion();
    }

    function renderGameQuestion(){
        if (gameTimer) { clearTimeout(gameTimer); gameTimer = null; }
        if (gameQuestions.length === 0 || gameIndex >= gameQuestions.length) {
            document.getElementById('gameQuestion').textContent = '🎉 所有题目已完成！点击"新题"重新开始';
            document.getElementById('gameOptions').innerHTML = '';
            return;
        }
        const q = gameQuestions[gameIndex];
        document.getElementById('gameQuestion').textContent = `"${q.word}" 的释义是？`;
        const container = document.getElementById('gameOptions');
        container.innerHTML = q.options.map(opt =>
            `<button data-opt="${opt}">${opt}</button>`
        ).join('');
        container.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function handleClick(){
                if(gameAnswered) return;
                const selected = this.dataset.opt;
                const correct = q.correct;
                const cardId = q.cardId;
                const wordIdx = q.wordIdx;
                gameTotal++;

                gameHistory.push(gameIndex);

                if(selected === correct){
                    this.classList.add('correct');
                    gameScore++;
                    document.getElementById('gameFeedback').textContent = '✅ 正确！已标记为"熟悉"';
                    if (cardId !== undefined && wordIdx !== undefined) {
                        setStatusForce(cardId, wordIdx, 'green');
                    }
                } else {
                    this.classList.add('wrong');
                    document.getElementById('gameFeedback').textContent = `❌ 错误，正确答案是: ${correct}。已标记为"陌生"`;
                    container.querySelectorAll('button').forEach(b => {
                        if(b.dataset.opt === correct) b.classList.add('correct');
                    });
                    if (cardId !== undefined && wordIdx !== undefined) {
                        setStatusForce(cardId, wordIdx, 'red');
                    }
                }
                gameAnswered = true;
                document.getElementById('gameScore').textContent = gameScore;
                document.getElementById('gameTotal').textContent = gameTotal;
                updateStats();

                document.getElementById('gamePrevBtn').disabled = (gameHistory.length === 0);

                if (gameTimer) clearTimeout(gameTimer);
                gameTimer = setTimeout(() => {
                    gameIndex = (gameIndex + 1) % gameQuestions.length;
                    gameAnswered = false;
                    document.getElementById('gameFeedback').textContent = '';
                    renderGameQuestion();
                    gameTimer = null;
                }, 1000);
            });
        });
    }

    function goToPrevGame(){
        if (gameTimer) { clearTimeout(gameTimer); gameTimer = null; }
        if (gameHistory.length === 0) return;
        const prevIdx = gameHistory.pop();
        if (prevIdx !== undefined && prevIdx >= 0 && prevIdx < gameQuestions.length) {
            gameIndex = prevIdx;
            gameAnswered = false;
            document.getElementById('gameFeedback').textContent = '';
            renderGameQuestion();
        }
        document.getElementById('gamePrevBtn').disabled = (gameHistory.length === 0);
    }

    // ===== 导航 =====
    function switchTab(pageId){
        if (gameTimer) { clearTimeout(gameTimer); gameTimer = null; }
        document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
        document.getElementById('page-'+pageId).classList.add('active');
        document.querySelectorAll('.nav-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.page===pageId));
        if(pageId==='home') { updateStats(); initGame(); }
        if(pageId==='overview') renderOverview();
        if(pageId==='review') { buildReviewQueue(document.getElementById('reviewMode').value); renderReviewCard(); }
        if(pageId==='learn') { initLearnOrder(); renderLearnCard(currentLearnIndex); }
    }

    function resetAll(){
        if(confirm('重置所有标记和生词本？')){
            wordStatusStore={}; starSet.clear();
            saveStore(); saveStarSet();
            if (gameTimer) { clearTimeout(gameTimer); gameTimer = null; }
            updateStats();
            renderLearnCard(currentLearnIndex);
            renderOverview();
            buildReviewQueue(document.getElementById('reviewMode').value);
            renderReviewCard();
            initGame();
        }
    }

    // ===== 事件绑定 =====
    document.querySelectorAll('.nav-tabs button').forEach(btn=>btn.addEventListener('click',()=>switchTab(btn.dataset.page)));
    document.querySelectorAll('.home-card').forEach(card=>card.addEventListener('click',()=>switchTab(card.dataset.page)));

    document.getElementById('prevBtn').addEventListener('click',()=>{ if(currentLearnIndex>0){ currentLearnIndex--; renderLearnCard(currentLearnIndex); }});
    document.getElementById('nextBtn').addEventListener('click',()=>{ if(currentLearnIndex<learnOrder.length-1){ currentLearnIndex++; renderLearnCard(currentLearnIndex); }});
    document.getElementById('jumpBtn').addEventListener('click',()=>{ let v=parseInt(document.getElementById('jumpInput').value)-1; if(!isNaN(v)&&v>=0&&v<learnOrder.length){ currentLearnIndex=v; renderLearnCard(currentLearnIndex); }});
    document.getElementById('jumpInput').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('jumpBtn').click(); });

    document.getElementById('learnFilter').addEventListener('change',()=>{ initLearnOrder(); });
    document.getElementById('learnShuffleBtn').addEventListener('click',()=>{ if(learnOrder.length>1){ for(let i=learnOrder.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [learnOrder[i],learnOrder[j]]=[learnOrder[j],learnOrder[i]]; } currentLearnIndex=0; renderLearnCard(currentLearnIndex); updateLearnCounter(); }});
    document.getElementById('learnResetOrderBtn').addEventListener('click',initLearnOrder);

    document.getElementById('reviewRefreshBtn').addEventListener('click',()=>{ buildReviewQueue(document.getElementById('reviewMode').value); renderReviewCard(); });
    document.getElementById('reviewPrevBtn').addEventListener('click',()=>{ if(reviewIndex>0){ reviewIndex--; renderReviewCard(); }});
    document.getElementById('reviewNextBtn').addEventListener('click',()=>{ if(reviewIndex<reviewQueue.length-1){ reviewIndex++; renderReviewCard(); }});
    document.getElementById('reviewJumpBtn').addEventListener('click',()=>{ let v=parseInt(document.getElementById('reviewJumpInput').value)-1; if(!isNaN(v)&&v>=0&&v<reviewQueue.length){ reviewIndex=v; renderReviewCard(); }});
    document.getElementById('reviewJumpInput').addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('reviewJumpBtn').click(); });
    document.getElementById('reviewMode').addEventListener('change',()=>{ buildReviewQueue(document.getElementById('reviewMode').value); renderReviewCard(); });

    document.getElementById('overviewSearch').addEventListener('input',renderOverview);
    document.querySelectorAll('.overview-tab').forEach(btn=>{
        btn.addEventListener('click',function(){
            document.querySelectorAll('.overview-tab').forEach(b=>b.classList.remove('active'));
            this.classList.add('active');
            renderOverview();
        });
    });

    document.getElementById('resetBtn').addEventListener('click',resetAll);
    document.getElementById('gameNewBtn').addEventListener('click',()=>{ 
        gameScore=0; gameTotal=0; 
        document.getElementById('gameScore').textContent='0'; 
        document.getElementById('gameTotal').textContent='0';
        if (gameTimer) { clearTimeout(gameTimer); gameTimer = null; }
        initGame(); 
    });
    document.getElementById('gamePrevBtn').addEventListener('click', goToPrevGame);

    // 键盘
    document.addEventListener('keydown',e=>{
        if(document.activeElement.tagName==='INPUT') return;
        const activePage = document.querySelector('.page.active');
        if(!activePage) return;
        if(activePage.id==='page-learn'){
            if(e.key==='ArrowLeft') document.getElementById('prevBtn').click();
            if(e.key==='ArrowRight') document.getElementById('nextBtn').click();
        } else if(activePage.id==='page-review'){
            if(e.key==='ArrowLeft') document.getElementById('reviewPrevBtn').click();
            if(e.key==='ArrowRight') document.getElementById('reviewNextBtn').click();
        }
    });

    // ===== 初始化 =====
    updateStats();
    initLearnOrder();
    renderLearnCard(currentLearnIndex);
    buildReviewQueue('due');
    renderReviewCard();
    renderOverview();
    initGame();
    switchTab('home');
</script>
</body>
</html>
