    <style>
        * {

        }
        body {
            background: #e8f5e9;

            padding: 20px;

        }
        .app {

            flex-wrap: wrap;

        }

            border-radius: 40px;
            font-size: 0.85rem;

            color: #1e4a2a;
        }

            background: #f7fcf7;

        }

            font-weight: 600;
            color: #2a5a2a;
        }
        .card-header .root-tag {
            background: #dcedc8;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 0.8rem;
            color: #1e4a1e;
        }
        .root-box {
            background: #eaf7ea;
            padding: 14px 18px;
            border-radius: 18px;
            margin-bottom: 16px;
            border-left: 4px solid #81c784;
        }
        .root-box .root-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1a3a1a;
            display: inline-block;
            margin-right: 12px;
        }
        .root-box .pronounce {
            font-size: 1rem;
            color: #2d5a2d;
            background: #dcedc8;
            padding: 0 14px;
            border-radius: 40px;
            display: inline-block;
            line-height: 1.8;
        }
        .root-box .source {
            font-size: 0.9rem;
            color: #3a6a3a;
            background: #dcedc8;
            padding: 2px 14px;
            border-radius: 30px;
            display: inline-block;
            margin-top: 6px;
        }

            padding: 14px 18px;
            border-radius: 18px;

            content: "🧠 ";

            padding: 14px 16px;

            font-size: 0.95rem;
            color: #3a6a3a;
            background: #dcedc8;
            padding: 0 14px;

        }

            color: #1e3a1e;
            line-height: 1.7;
            font-size: 0.95rem;
        }

            color: #2a5a2a;
        }

            background: #eaf7ea;
            padding: 8px 14px;
            border-radius: 14px;
            margin: 8px 0 2px;
            font-style: italic;
            color: #2a4a2a;
        }

            color: #3a6a3a;
            margin-top: 4px;
            background: #dcedc8;
            padding: 4px 12px;
            border-radius: 30px;
            display: inline-block;
        }

            color: #2a5a2a;
            cursor: pointer;
            font-size: 0.95rem;
            padding: 4px 0;
        }
        .extra-section ul {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 12px;
            padding: 12px 6px 4px;
            list-style: none;
        }

            background: #eaf7ea;
            padding: 4px 16px;
            border-radius: 30px;
            font-size: 0.9rem;
            border: 1px solid #b8d9b8;
            color: #1e3a1e;
        }

            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 10px;
        }

            background: #dcedc8;
            border: none;
            padding: 10px 24px;
            border-radius: 60px;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            border: 1px solid #a5d6a7;

            color: #1e3a1e;

            background: #c8e6c9;
            transform: scale(0.97);
        }

            opacity: 0.4;
            cursor: not-allowed;

            color: #f0faf0;

        }

            border-radius: 40px;
            border: 1px solid #a5d6a7;
            font-size: 1rem;
            font-weight: 500;

            border-color: transparent;
        }
        .jump-box button {
            background: #2d6a2d;
            border: none;
            color: white;
            padding: 5px 18px;
            border-radius: 40px;
            font-weight: 500;
            cursor: pointer;
        }
        .jump-box button:hover {
            background: #1a4a1a;
        }
        .progress {
            font-weight: 500;
            color: #2a5a2a;
        }
        .word-count {
            font-size: 0.85rem;
            color: #5a7a5a;
            margin-left: 6px;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #5a7a5a;
        }

            width: 100%;
            background: #dcedc8;
            border-radius: 40px;
            height: 10px;
            margin: 12px 0 18px 0;
            overflow: hidden;

            height: 100%;
            background: #43a047;
            border-radius: 40px;
            width: 0%;

        }

            gap: 14px;
            justify-content: center;
            margin: 18px 0 6px 0;
            flex-wrap: wrap;

            border: none;
            padding: 8px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;

            border: 1px solid #a5d6a7;
            color: #1e3a1e;

            background: #81c784;
            color: white;
            border-color: #388e3c;
        }
        .memory-btn.familiar.active {
            background: #2e7d32;
            border-color: #1b5e20;
            box-shadow: 0 0 0 2px #a5d6a7;
        }
        .memory-btn.vague {
            background: #ffb74d;
            color: #3e2a00;
            border-color: #f57c00;
        }
        .memory-btn.vague.active {
            background: #e65100;
            color: white;
            border-color: #bf360c;
            box-shadow: 0 0 0 2px #ffcc80;
        }
        .memory-btn.forget {
            background: #ef9a9a;
            color: #4a1a1a;
            border-color: #c62828;
        }
        .memory-btn.forget.active {
            background: #b71c1c;
            color: white;
            border-color: #880e4f;
            box-shadow: 0 0 0 2px #ef9a9a;
        }
        .memory-status {
            text-align: center;
            font-size: 0.85rem;
            color: #3a6a3a;
            margin-top: 6px;
            font-weight: 500;
        }
        .extra-word .pos {
            margin-left: 14px;
        }
        .extra-word-item .pos {
            margin-left: 14px;
        }
    </style>
</head>

        <button class="primary" id="nextBtn">下一张 ▶</button>

<script>
// ===== 从Excel提取的《单词大观第二部分_词根词缀法》760条词根数据 =====
const WORDS = [{"id":1,"root":"cert-","pronounce":"/sɜːrt/瑟儿特","source":"拉丁语 certus","meaning":"确定的,确实的","mnemonic":"cert就是“测它”。一件事不确定的时候，我们会反复测它、核实它；测清楚以后，真假就确定了，结果也就确实可靠。所以cert就是“确定的、确实的”的意思。","mainWords":[{"word":"certain","pos":"a.","detail":"构词: 构词: cert(确定) + ain(形容词后缀)<br>释义: 确定的;某个","example":"例句: I'm certain of the answer. ｜ 推导: 确定 + 形容词化 = 确定的,肯定的"},{"word":"certainly","pos":"ad.","detail":"构词: 构词: certain + ly(副词后缀)<br>释义: 当然;必定","example":"例句: Certainly, I'll help you. ｜ 推导: 确定的 + 副词化 = 当然,必定"},{"word":"certainty","pos":"n.","detail":"构词: 构词: certain + ty(名词后缀)<br>释义: 确定性;必然","example":"例句: There's no certainty about it. ｜ 推导: 确定的 + 名词化 = 确定性,确实性"},{"word":"certificate","pos":"n.","detail":"构词: 构词: cert + ific + ate(名词后缀)<br>释义: 证书;证明","example":"例句: He got a graduation certificate. ｜ 推导: 确定 + 做成的东⻄ = 证明文件,证书"},{"word":"certify","pos":"v.","detail":"构词: 构词: cert(确定) + ify(使...化)<br>释义: 证明;保证","example":"例句: The bank certified the check. ｜ 推导: 确定 + 使...化 = 使确定,证明"},{"word":"ascertain","pos":"v.","detail":"构词: 构词: as(向) + cert + ain<br>释义: 查明;确定","example":"例句: We must ascertain the facts. ｜ 推导: 向着 + 确定 = 查明,弄清楚"}],"extra":["certification n. 认证;证明（构词: certify + ication）","uncertain a. 不确定的（构词: un + certain）","uncertainty n. 不确定性（构词: un + certainty）","certify v. 证明;保证（构词: cert + ify(使)）","certification n. 认证;证明（构词: cert + ification）"]},{"id":2,"root":"clock","pronounce":"/klɒk/克勒奥克","source":"拟声词","meaning":"钟,时钟","mnemonic":"方法一：\nclock本身是我们小学就学过的单词，意思是“钟、时钟”。clock这个词根就是“钟”或“计时器”。\n方法二：\nclock 就是刻漏刻。古代常见的计时工具叫作刻漏，即一种带有刻度、利用水流计时的漏壶。我们今天所说的“一刻钟”等有关时间的表达，就是从古代漏刻的计时方式来的。因此clock 的意思就是“钟、时钟、计时器”。","mainWords":[{"word":"clock","pos":"n.","detail":"构词: 构词: clock(钟)<br>释义: 钟,时钟","example":"例句: The clock strikes twelve. ｜ 推导: 钟 = 计时装置"},{"word":"o'clock","pos":"ad.","detail":"构词: 构词: of the clock的缩写<br>释义: ...点钟","example":"例句: It's five o'clock. ｜ 推导: 钟的(时间) = ...点钟"},{"word":"clockwise","pos":"a.","detail":"构词: 构词: clock + wise(方向)<br>释义: 顺时针方向","example":"例句: Turn the handle clockwise. ｜ 推导: 钟 + 方向 = 像钟表指针的方向"}],"extra":["anticlockwise a. 逆时针方向（构词: anti + clockwise）","clockwork n. 发条装置（构词: clock + work）","alarm clock n. 闹钟（构词: alarm + clock）","clocking n. 计时（构词: clock + ing）"]},{"id":3,"root":"fin-","pronounce":"/faɪn/夫爱恩；/fɪn/夫衣恩","source":"法语/拉丁语；拉丁语 finis","meaning":"精细的;结束债务；结束,界限,边界","mnemonic":"1.fin就是“分”。一个东西不断往下分，就会被分得越来越细，fin就是“精细”。2.方法一：fin在我们小学学过的词finish的一部分，finish＝fin＋ish，finish 就是结束，去掉动词词尾 ish意思不变后留下 fin，因此fin就是结束。方法二：fin就是“坟”，一个人结束了就会进入坟墓，所以fin是结束的意思。3.与此同时一件事什么时候会结束？肯定是触碰界限边界的时候会结束，因此fin还有界限、边界的意思。4. 接2，一笔罚金全部交清，债务也随之结束，因此fin还有结束债务的意思。综上，fin的意思是“精细；结束债务；结束、界限、边界”。","mainWords":[{"word":"fine","pos":"a.","detail":"构词: 构词: fin(精细的/结束) + e<br>释义: 好的;精细的 n.罚款","example":"例句: That's a fine idea. / Pay the fine. ｜ 推导: 精细的 = 好的;结束债务 = 罚款"},{"word":"finance","pos":"n.","detail":"构词: 构词: fin(结束债务) + ance(名词后缀)<br>释义: 财政 v.筹资","example":"例句: He works in finance. ｜ 推导: 结束债务 + 名词化 = 财政,金融"},{"word":"financial","pos":"a.","detail":"构词: 构词: finance + ial(形容词后缀)<br>释义: 财政的;金融的","example":"例句: Financial crisis hit the market. ｜ 推导: 财政 + 形容词化 = 财政的,金融的"},{"word":"final","pos":"a.","detail":"构词: 构词: fin(结束) + al(形容词后缀)<br>释义: 最终的","example":"例句: This is my final decision. ｜ 推导: 结束 + 形容词化 = 最终的,最后的"},{"word":"finally","pos":"ad.","detail":"构词: 构词: final + ly(副词后缀)<br>释义: 最终地","example":"例句: Finally, we reached home. ｜ 推导: 最终的 + 副词化 = 最终地,终于"},{"word":"finish","pos":"v.","detail":"构词: 构词: fin(结束) + ish(动词后缀)<br>释义: 完成","example":"例句: Please finish your homework. ｜ 推导: 结束 + 动词化 = 使结束,完成"},{"word":"confine","pos":"v.","detail":"构词: 构词: con(共同) + fin(界限) + e<br>释义: 限制","example":"例句: Don't confine yourself to one view. ｜ 推导: 共同 + 界限 = 设定界限,限制"},{"word":"define","pos":"v.","detail":"构词: 构词: de(完全) + fin(界限) + e<br>释义: 定义","example":"例句: Can you define this word? ｜ 推导: 完全 + 界限 = 完全划定界限,定义"},{"word":"definite","pos":"a.","detail":"构词: 构词: de + fin + ite(形容词后缀)<br>释义: 明确的","example":"例句: Give me a definite answer. ｜ 推导: 完全 + 界限 + 形容词化 = 界限分明的"},{"word":"definition","pos":"n.","detail":"构词: 构词: define + tion(名词后缀)<br>释义: 定义","example":"例句: Look up the definition online. ｜ 推导: 定义 + 名词化 = 定义(名词)"},{"word":"refine","pos":"v.","detail":"构词: 构词: re(再次) + fin(界限) + e<br>释义: 精炼","example":"例句: We need to refine our methods. ｜ 推导: 再次 + 界限 = 再次划定界限,精炼"},{"word":"finite","pos":"a.","detail":"构词: 构词: fin(界限) + ite(形容词后缀)<br>释义: 有限的","example":"例句: Life is finite. ｜ 推导: 界限 + 形容词化 = 有界限的,有限的"},{"word":"infinite","pos":"a.","detail":"构词: 构词: in(不) + finite(有限的)<br>释义: 无限的","example":"例句: The universe is infinite. ｜ 推导: 不 + 有限的 = 无限的"}],"extra":["financier n. 金融家（构词: financ + ier(人)）","financing n. 融资（构词: financ + ing）","refinance v. 再融资（构词: re + finance）","financially ad. 财政上（构词: financial + ly）"]},{"id":4,"root":"gen-","pronounce":"/dʒen/杰恩","source":"拉丁语 generare；拉丁语 genus","meaning":"产生,创造；生育,产生,种类；出生,血统,品质","mnemonic":"gen就是汉语拼音哥恩 “根”。植物从根里生长，产生，出生，很多植物的根还可以无性繁殖，创造，生育新的后代，生根发芽；同时我们还经常用寻根，落叶归根等表达表示寻找同一品种和血统的人或事物（祖宗，故乡等），所以gen就是“产生、创造；生育、产生、种类；出生、血统、品质”。","mainWords":[{"word":"generate","pos":"v.","detail":"构词: 构词: gen(产生) + erate(动词后缀)<br>释义: 产生;生成","example":"例句: Wind turbines generate electricity. ｜ 推导: 产生 + 动词化 = 产生,生成"},{"word":"generation","pos":"n.","detail":"构词: 构词: gen + eration(名词后缀)<br>释义: 一代;产生","example":"例句: The new generation is tech-savvy. ｜ 推导: 产生 + 名词化 = 产生的过程/结果,一代人"},{"word":"general","pos":"a.","detail":"构词: 构词: gen(种类) + eral(形容词后缀)<br>释义: 普遍的;一般的","example":"例句: In general, people like music. ｜ 推导: 种类 + 形容词化 = 涵盖所有种类的,普遍的"},{"word":"generator","pos":"n.","detail":"构词: 构词: gen(产生) + erator(工具后缀)<br>释义: 发电机","example":"例句: The generator produces electricity. ｜ 推导: 产生 + 工具 = 产生电力的机器,发电机"},{"word":"degenerate","pos":"v.","detail":"构词: 构词: de(向下) + gen + erate<br>释义: 退化;堕落","example":"例句: His health began to degenerate. ｜ 推导: 向下 + 产生 = 向坏的方向发展,退化"},{"word":"generalize","pos":"v.","detail":"构词: 构词: general + ize(动词后缀)<br>释义: 概括;推广","example":"例句: Don't generalize from one case. ｜ 推导: 普遍的 + 动词化 = 使普遍化,概括"},{"word":"homogeneous","pos":"a.","detail":"构词: 构词: homo(同) + gen(种类) + eous<br>释义: 同质的","example":"例句: A homogeneous mixture is uniform. ｜ 推导: 同 + 种类 + 形容词化 = 同一种类的"},{"word":"gene","pos":"n.","detail":"构词: 构词: gen(产生) + e<br>释义: 基因","example":"例句: Scientists discovered a new gene. ｜ 推导: 产生 = 产生遗传特征的因子,基因"},{"word":"genetic","pos":"a.","detail":"构词: 构词: gen(产生) + etic(形容词后缀)<br>释义: 遗传的","example":"例句: Genetic factors affect health. ｜ 推导: 产生 + 形容词化 = 与遗传相关的"},{"word":"genetics","pos":"n.","detail":"构词: 构词: gen(产生) + etics(学科后缀)<br>释义: 遗传学","example":"例句: She studies genetics at university. ｜ 推导: 产生 + 学科 = 研究遗传的学科"},{"word":"gender","pos":"n.","detail":"构词: 构词: gen(种类) + der(名词后缀)<br>释义: 性别","example":"例句: Gender equality is important. ｜ 推导: 种类 + 名词化 = 生物的种类区分,性别"},{"word":"genius","pos":"n.","detail":"构词: 构词: gen(天生) + ius(名词后缀)<br>释义: 天才;天赋","example":"例句: Einstein was a mathematical genius. ｜ 推导: 天生 + 名词化 = 天生的才能,天才"},{"word":"genuine","pos":"a.","detail":"构词: 构词: gen(天生) + uine(形容词后缀)<br>释义: 真正的;真诚的","example":"例句: Her smile was genuine. ｜ 推导: 天生 + 形容词化 = 天生如此的,真正的"},{"word":"generous","pos":"a.","detail":"构词: 构词: gen(高贵) + erous(形容词后缀)<br>释义: 慷慨的;大方的","example":"例句: He is generous with his time. ｜ 推导: 高贵 + 形容词化 = 有贵族品质的,慷慨的"},{"word":"gentle","pos":"a.","detail":"构词: 构词: gen(出身) + tle(形容词后缀)<br>释义: 温和的;高贵的","example":"例句: She has a gentle nature. ｜ 推导: 出身 + 形容词化 = 出身高贵的,温和的"},{"word":"gentleman","pos":"n.","detail":"构词: 构词: gentle + man<br>释义: 绅士;先生","example":"例句: He is a perfect gentleman. ｜ 推导: 高贵的 + 人 = 出身高贵的人,绅士"},{"word":"ingenious","pos":"a.","detail":"构词: 构词: in(内在) + gen(天生) + ious<br>释义: 精巧的;巧妙的","example":"例句: What an ingenious solution! ｜ 推导: 内在 + 天生 + 形容词化 = 天生聪慧的"}],"extra":["regenerate v. 再生（构词: re + gen + erate）","generic a. 通用的（构词: gen + eric）","generative a. 生成的（构词: gen + erative）","generosity n. 慷慨（构词: gen + erosity）","genome n. 基因组（构词: gen + ome(整体)）","genotype n. 基因型（构词: gen + o + type）","genealogy n. 家谱;系谱（构词: gen + ealogy）","genesis n. 起源;创世纪（构词: gen + esis）","gently ad. 温柔地（构词: gentle + ly）","generosity n. 慷慨（构词: generous + ity）","gentry n. 贵族阶层（构词: gen + try）"]},{"id":5,"root":"gen-/gn-","pronounce":"/dʒen/杰恩","source":"拉丁语 gignere","meaning":"生,产生","mnemonic":"gen/gn就是“根”。 根会长出新的生命，所以根表示生和产生。 所以gen/gn就是“生、产生”。","mainWords":[{"word":"benign","pos":"a.","detail":"构词: 构词: bene(好) + gn(生)<br>释义: 良性的;仁慈的","example":"例句: The tumor is benign. ｜ 推导: 好 + 生 = 良性生长的,良性的"},{"word":"malignant","pos":"a.","detail":"构词: 构词: male(恶) + gn(生) + ant<br>释义: 恶性的;恶毒的","example":"例句: Malignant cancer spreads quickly. ｜ 推导: 恶 + 生 + 形容词化 = 恶性生长的"}],"extra":["gene n. 基因（构词: gen + e）","generate v. 产生（构词: gen + erate）","generation n. 一代;产生（构词: gen + eration）","generator n. 发电机（构词: gen + erator）","genetic a. 基因的;遗传的（构词: gen + etic）","genius n. 天才（构词: gen + ius）","genuine a. 真正的（构词: gen + uine）","general a. 一般的（构词: gen + eral）","gender n. 性别（构词: gen + der）","generous a. 慷慨的（构词: gen + erous）","degenerate v. 退化（构词: de + gen + erate）","regenerate v. 再生（构词: re + gen + erate）","congenital a. 先天的（构词: con + gen + ital）","indigenous a. 土生土长的（构词: indi + gen + ous）","genesis n. 起源;创世纪（构词: gen + esis）","progeny n. 后代（构词: pro + gen + y）"]},{"id":6,"root":"guilt/geld","pronounce":"/gɪlt/吉勒特","source":"日耳曼语 *gult-","meaning":"罪责,欠债,过错","mnemonic":"为了记忆，可以把GUILT记成“Give Up; I Lied; Tell truth”。那什么样的态度可以同时满足这三点呢？\n\nGive Up表示不再继续隐瞒；I Lied表示承认“我说了谎”；Tell truth表示把真相说出来。\n\n显然只有一个人做错事以后，不再逃避，承认自己撒谎并说出真相的场景，说明他知道自己有过错，也愿意承担责任。因此guilt就是“罪责、过错和内疚”的意思。","mainWords":[{"word":"guilt","pos":"n.","detail":"构词: 构词: guilt(罪责)<br>释义: 内疚;罪行","example":"例句: He felt guilt about lying. ｜ 推导: 罪责 = 内疚,罪行"},{"word":"guilty","pos":"a.","detail":"构词: 构词: guilt + y(形容词后缀)<br>释义: 有罪的;内疚的","example":"例句: The jury found him guilty. ｜ 推导: 罪责 + 形容词化 = 有罪的,内疚的"}],"extra":["guiltless a. 无罪的（构词: guilt + less(无)）","guiltily ad. 内疚地（构词: guilt + ily）","gilt n. 镀金;罪责(古语) (gilt同源)","geld n. 赋税;赔偿金(古) (geld)"]},{"id":7,"root":"light","pronounce":"/laɪt/勒爱特","source":"日耳曼语源","meaning":"光,明亮;轻的","mnemonic":"light本身就是我们小学学过的light。 light 就是“光、轻的、明亮的”。 所以light就是“光、明亮；轻的”。","mainWords":[{"word":"light","pos":"n.","detail":"构词: 构词: light(光/轻)<br>释义: 光 a.轻的;明亮的","example":"例句: Turn on the light, please. ｜ 推导: 光;轻 = 基础词根,双重含义"},{"word":"slight","pos":"a.","detail":"构词: 构词: s(加强) + light(轻)<br>释义: 轻微的;微小的","example":"例句: There's a slight problem. ｜ 推导: 加强 + 轻 = 极轻的,轻微的"},{"word":"highlight","pos":"v.","detail":"构词: 构词: high(高) + light(光)<br>释义: 强调 n.最精彩部分","example":"例句: Let me highlight the key points. ｜ 推导: 高 + 光 = 高光,突出显示"},{"word":"enlighten","pos":"v.","detail":"构词: 构词: en(使) + light(光) + en<br>释义: 启发;启蒙","example":"例句: The book enlightened me. ｜ 推导: 使 + 光 + 动词化 = 照亮(心灵),启发"},{"word":"lightning","pos":"n.","detail":"构词: 构词: light(光) + ning(名词后缀)<br>释义: 闪电","example":"例句: Lightning struck the tree. ｜ 推导: 光 + 名词化 = 天空的闪光,闪电"},{"word":"daylight","pos":"n.","detail":"构词: 构词: day(日) + light(光)<br>释义: 日光;白昼","example":"例句: We work in broad daylight. ｜ 推导: 日 + 光 = 白天的光,日光"},{"word":"delight","pos":"n.快乐,高兴","detail":"构词: 构词: de-(向下、离开、去掉) + light<br>释义: v.(使)高兴,(使)欣喜","example":"推导: 核心词根「light」表示“光,明亮;轻的”，结合前后缀，可推出“n.快乐,高兴 v.(使)高兴,(使)欣喜”"}],"extra":["lighter n. 打火机（构词: light + er）","lighthouse n. 灯塔（构词: light + house）","lightly ad. 轻轻地（构词: light + ly）","lighten v. 减轻;照亮（构词: light + en）"]},{"id":8,"root":"log-","pronounce":"/lɒg/勒奥格","source":"希腊语 logos","meaning":"言语,道理,推理；词,言语,理性","mnemonic":"1.log就是唠个，唠即唠嗑，也就是用言语或话语说话的意思，所以log就是“言语，话语”的意思。2.log是数学里的对数符号，我们考研数学要天天跟他打交道，那众所周知数学就是科学，理性，逻辑，道理，学科，计算的代表，所以log就是“科学，理性，逻辑，道理，学科，计算”","mainWords":[{"word":"logic","pos":"n.","detail":"构词: 构词: log(道理) + ic(名词后缀)<br>释义: 逻辑","example":"例句: Logic helps us think clearly. ｜ 推导: 道理 + 名词化 = 推理的学问,逻辑"},{"word":"logical","pos":"a.","detail":"构词: 构词: log(道理) + ical(形容词后缀)<br>释义: 逻辑的","example":"例句: His argument was logical. ｜ 推导: 道理 + 形容词化 = 符合道理的,逻辑的"},{"word":"analogy","pos":"n.","detail":"构词: 构词: ana(相似) + log(道理) + y<br>释义: 类比","example":"例句: He drew an analogy between them. ｜ 推导: 相似 + 道理 = 相似的道理,类比"},{"word":"analogue","pos":"n.","detail":"构词: 构词: ana(相似) + log(道理) + ue<br>释义: 类似物","example":"例句: This is an analogue of that. ｜ 推导: 相似 + 道理 = 道理相似的事物,类似物"},{"word":"apology","pos":"n.","detail":"构词: 构词: apo(离开) + log(言语) + y<br>释义: 道歉","example":"例句: He made a sincere apology. ｜ 推导: 离开 + 言语 = 为过错辩解的话,道歉"},{"word":"apologize","pos":"v.","detail":"构词: 构词: apo(离开) + log(言语) + ize<br>释义: 道歉","example":"例句: I apologize for being late. ｜ 推导: 离开 + 言语 + 动词化 = 说道歉的话"},{"word":"log","pos":"n.","detail":"构词: 构词: log(记录)<br>释义: 日志","example":"例句: Keep a log of your activities. ｜ 推导: 记录 = 日志,记录册"},{"word":"catalog","pos":"n.","detail":"构词: 构词: cata(向下) + log(说)<br>释义: 目录","example":"例句: Browse the product catalog. ｜ 推导: 向下 + 说 = 逐条列说,目录"},{"word":"dialog","pos":"n.","detail":"构词: 构词: dia(通过) + log(说)<br>释义: 对话","example":"例句: They had a meaningful dialog. ｜ 推导: 通过 + 说 = 双方通过言语交流,对话"}],"extra":["dialogue n. 对话（构词: dia(通过) + log）","catalog n. 目录（构词: cata(向下) + log）","monologue n. 独白（构词: mono(单) + log）","epilogue n. 结语（构词: epi(之后) + log）","logic n. 逻辑（构词: log + ic）","logical a. 逻辑的（构词: log + ical）","apology n. 道歉（构词: apo(离开) + log + y）","analogy n. 类比（构词: ana(类似) + log + y）"]},{"id":9,"root":"micro-","pronounce":"/ˈmaɪkrəʊ/姆爱克儿欧","source":"希腊语 mikrós","meaning":"微小的","mnemonic":"方法一：\nmicro是我们都知道的 Microsoft即“微软”的一部分。soft 对应后面的“软”，那么前面的 micro 自然对应“微”，所以micro就是“微小的”。\n方法二：\nmi音译就是 米；c音译为颗；ro音译为若，所以micro就是米颗若，按照古汉语读法从右往左读就是若颗米，即像一颗米一样，即微小的意思，所以micro的意思为微小的","mainWords":[{"word":"microphone","pos":"n.","detail":"构词: 构词: micro(微小) + phone(声音)<br>释义: 麦克风","example":"例句: Speak into the microphone. ｜ 推导: 微小 + 声音 = 放大微小声音的设备"},{"word":"microscope","pos":"n.","detail":"构词: 构词: micro(微小) + scope(观察)<br>释义: 显微镜","example":"例句: Observe cells under a microscope. ｜ 推导: 微小 + 观察 = 观察微小事物的仪器"},{"word":"microwave","pos":"n.","detail":"构词: 构词: micro(微小) + wave(波)<br>释义: 微波;微波炉","example":"例句: Heat it in the microwave. ｜ 推导: 微小 + 波 = 波长很短的电磁波"}],"extra":["microbe n. 微生物（构词: micro + be(生物)）","microchip n. 微芯片（构词: micro + chip）","microfilm n. 缩微胶卷（构词: micro + film）","microcosm n. 微观世界（构词: micro + cosm(宇宙)）"]},{"id":10,"root":"migr-","pronounce":"/maɪgr/姆爱格儿","source":"拉丁语 migrare","meaning":"迁移,移动","mnemonic":"migr就是迈隔，即迈过隔离，这里的隔离可以指两国之隔也可以指两地之隔，因此migr就是“跨境、移民 、迁徙”的意思。","mainWords":[{"word":"migrate","pos":"v.","detail":"构词: 构词: migr(迁移) + ate(动词后缀)<br>释义: 迁徙;移居","example":"例句: Birds migrate south in winter. ｜ 推导: 迁移 + 动词化 = 迁徙,移居"},{"word":"migration","pos":"n.","detail":"构词: 构词: migr + ation(名词后缀)<br>释义: 迁移;迁徙","example":"例句: The migration took months. ｜ 推导: 迁移 + 名词化 = 迁移行为"},{"word":"emigrate","pos":"v.","detail":"构词: 构词: e(出) + migr + ate<br>释义: 移居国外","example":"例句: They emigrated to Canada. ｜ 推导: 出 + 迁移 = 从原居住地迁出"},{"word":"immigrant","pos":"n.","detail":"构词: 构词: im(入) + migr + ant(人)<br>释义: 移民;侨民","example":"例句: Many immigrants work hard. ｜ 推导: 入 + 迁移 + 人 = 迁入新国家的人"}],"extra":["immigration n. 移民入境（构词: im + migr + ation）","emigration n. 移民出境（构词: e + migr + ation）","migrant n. 候鸟;移民（构词: migr + ant）","migratory a. 迁徙的（构词: migr + atory）"]},{"id":11,"root":"mon-","pronounce":"/mʌn/姆阿恩；/mɒn/姆奥恩","source":"Juno Moneta；拉丁语 monere","meaning":"钱币,货币；警告,提醒,建议","mnemonic":"1.mon是小学学过的money的一部分。money＝mon＋ey，去掉拼写词尾 ey 后留下 mon，money 就是钱和货币，所以mon就是“钱币、货币”。2.mon就是“摸你”：那什么情况下别人会摸你一下呢，肯定是为了提醒你注意某些东西但是自己有不方便说出来或明示，因此mon就是“警告、提醒、建议”。","mainWords":[{"word":"money","pos":"n.","detail":"构词: 构词: mon(钱币) + ey<br>释义: 钱;货币","example":"例句: Time is money. ｜ 推导: 钱币 = 货币,金钱"},{"word":"monetary","pos":"a.","detail":"构词: 构词: mon(钱币) + et + ary(形容词后缀)<br>释义: 货币的;金融的","example":"例句: Monetary policy affects economy. ｜ 推导: 钱币 + 形容词化 = 货币的,金融的"},{"word":"monitor","pos":"n.","detail":"构词: 构词: mon(警告) + itor(人/物)<br>释义: 监视器;班长 v.监控","example":"例句: Monitor the patient's condition. ｜ 推导: 警告 + 者 = 监视者,监控器"},{"word":"demonstrate","pos":"v.","detail":"构词: 构词: de(完全) + mon(展示) + strate<br>释义: 演示;证明","example":"例句: Demonstrate how it works. ｜ 推导: 完全 + 展示 = 充分展示,演示"},{"word":"monument","pos":"n.","detail":"构词: 构词: mon(提醒) + ument(名词后缀)<br>释义: 纪念碑;历史遗迹","example":"例句: Visit the ancient monument. ｜ 推导: 提醒 + 名词化 = 提醒后人的建筑,纪念碑"},{"word":"summon","pos":"v.","detail":"构词: 构词: sum(在下) + mon(警告)<br>释义: 召唤;传唤","example":"例句: Summon all the staff. ｜ 推导: 在下 + 警告 = 向下级发出召唤"}],"extra":["monetize v. 货币化;变现（构词: mon + et + ize）","monetarism n. 货币主义（构词: mon + etar + ism）","moneymaker n. 赚钱的人/物（构词: money + maker）","moneyed a. 有钱的（构词: money + ed）","admonish v. 告诫,警告（构词: ad(向) + mon + ish）","premonition n. 预感（构词: pre(预先) + mon + ition）","monster n. 怪物（构词: mon(警示) + ster）","monitory a. 警告的（构词: mon + itory）"]},{"id":12,"root":"","pronounce":"/məni/姆尼","source":"拉丁语 -monium","meaning":"状态,行为","mnemonic":"mony就是“牟尼”。释迦牟尼是佛祖的名字,释迦代表能以仁爱、慈悲的心去怜悯和救度众生的行为,牟尼代表内心清净、断除烦恼、智慧圆满的状态,根据古汉语里互文的语言特点,释迦就是牟尼,牟尼就是释迦, 所以-mony即牟尼就是“状态、行为”。","mainWords":[{"word":"testimony","pos":"n.","detail":"构词: 构词: testi(证人) + mony(状态)<br>释义: 证词;证据","example":"例句: His testimony was crucial. ｜ 推导: 证人 + 状态 = 作证的状态,证词"},{"word":"ceremony","pos":"n.","detail":"构词: 构词: cere(尊敬) + mony(行为)<br>释义: 仪式;典礼","example":"例句: The wedding ceremony was beautiful. ｜ 推导: 尊敬 + 行为 = 表达尊敬的行为,仪式"},{"word":"harmony","pos":"n.","detail":"构词: 构词: har(一起) + mony(状态)<br>释义: 和谐;协调","example":"例句: They lived in perfect harmony. ｜ 推导: 一起 + 状态 = 共同和谐的状态"}],"extra":["matrimony n. 婚姻（构词: matri(母亲) + mony）","patrimony n. 遗产（构词: patri(父亲) + mony）","alimony n. 赡养费（构词: ali(养育) + mony）","acrimony n. 尖刻（构词: acri(尖锐) + mony）"]},{"id":13,"root":"neg-","pronounce":"/neg/恩诶格","source":"拉丁语 negāre","meaning":"否定,否认","mnemonic":"为了记忆，可以把NEG记成“No; End; Go away”。现在我们来回答一个问题，对一个说法是什么样的态度，才会“No; End; Go away”。\n\nNo表示对一个说法回答“不”；End表示让这个说法到此结束；Go away表示不让它继续存在或通过，这些都体现了对这个说法“不承认、把它取消”的态度。\n\n所以neg就是“否定、否认”的意思。","mainWords":[{"word":"negative","pos":"a.","detail":"构词: 构词: neg(否定) + ative(形容词后缀)<br>释义: 否定的;负面的","example":"例句: Don't be so negative. ｜ 推导: 否定 + 形容词化 = 否定的,负面的"},{"word":"neglect","pos":"v.","detail":"构词: 构词: neg(不) + lect(选择)<br>释义: 忽视;疏忽","example":"例句: Don't neglect your health. ｜ 推导: 不 + 选择 = 不去关注,忽视"},{"word":"deny","pos":"v.","detail":"构词: 构词: de(完全) + ny(否定)<br>释义: 否认;拒绝","example":"例句: He denied the accusation. ｜ 推导: 完全 + 否定 = 彻底否认"},{"word":"denial","pos":"n.","detail":"构词: 构词: deny + al(名词后缀)<br>释义: 否认;拒绝","example":"例句: His denial was not convincing. ｜ 推导: 否认 + 名词化 = 否认行为"},{"word":"negligible","pos":"a.","detail":"构词: 构词: neg(不) + lig(选择) + ible<br>释义: 可忽略的","example":"例句: The cost is negligible. ｜ 推导: 不 + 选择 + 可...的 = 可以不选择的"},{"word":"negotiate","pos":"v.","detail":"构词: 构词: neg(不) + oti(闲暇) + ate<br>释义: 谈判;协商","example":"例句: Let's negotiate a deal. ｜ 推导: 不 + 闲暇 = 忙于协商"}],"extra":["negate v. 否定;取消（构词: neg + ate）"]},{"id":14,"root":"opt-","pronounce":"/ɒpt/奥普特","source":"拉丁语 optāre","meaning":"选择,希望","mnemonic":"opt先看字母形状：O像答题卡上的一个选项圈，做题时用pen在选中的一项上打tick。圈出来再打勾，就是作出选择；我们通常会选择自己hope正确、最有希望的一项。所以opt就是“选择、希望”的意思。","mainWords":[{"word":"option","pos":"n.","detail":"构词: 构词: opt(选择) + ion(名词后缀)<br>释义: 选择;选项","example":"例句: You have several options. ｜ 推导: 选择 + 名词化 = 可供选择的事物"},{"word":"optional","pos":"a.","detail":"构词: 构词: option + al(形容词后缀)<br>释义: 可选择的;选修的","example":"例句: This course is optional. ｜ 推导: 选择 + 形容词化 = 可以选择的"},{"word":"optimistic","pos":"a.","detail":"构词: 构词: optim(最优) + istic(形容词后缀)<br>释义: 乐观的","example":"例句: Stay optimistic about the future. ｜ 推导: 期待最优 + 形容词化 = 乐观的"},{"word":"optimum","pos":"a.","detail":"构词: 构词: optim(最优) + um(名词后缀)<br>释义: 最优的 n.最佳值","example":"例句: Find the optimum solution. ｜ 推导: 最优 + 名词化 = 最佳状态,最优值"}],"extra":["opt v. 选择 (opt)","optimize v. 优化（构词: optim + ize）","optimal a. 最佳的（构词: optim + al）","adopt v. 采纳;收养（构词: ad(向) + opt）"]},{"id":15,"root":"shine","pronounce":"/ʃaɪn/诗爱恩","source":"古英语 scīnan","meaning":"发光,照耀","mnemonic":"shine就是闪，闪就是闪耀、发光的意思，所以shine就是“闪电、闪耀、发光”的意思。","mainWords":[{"word":"shine","pos":"v.","detail":"构词: 构词: shine(发光)<br>释义: 照耀;发光","example":"例句: The stars shine brightly. ｜ 推导: 发光 = 照耀,发亮"},{"word":"sunshine","pos":"n.","detail":"构词: 构词: sun(太阳) + shine(光)<br>释义: 阳光;晴天","example":"例句: I love the morning sunshine. ｜ 推导: 太阳 + 光 = 太阳的光芒,阳光"}],"extra":["shiny a. 发亮的;有光泽的（构词: shine + y）","shining a. 光亮的;杰出的（构词: shine + ing）","moonshine n. 月光;空谈（构词: moon + shine）","outshine v. 比...更亮;胜过（构词: out + shine）","shiner n. 发光物;黑眼圈（构词: shine + er）"]},{"id":16,"root":"simil-/simul-","pronounce":"/ˈsɪmɪl/西米勒","source":"","meaning":"相似,类似","mnemonic":"simil就是似貌，用古汉语从右往左读就是貌似，也就是相似、类似的意思，因此simil就是相似  类似的意思","mainWords":[{"word":"similar","pos":"a.","detail":"构词: 构词: simil(相似) + ar(形容词后缀)<br>释义: 相似的,类似的","example":"例句: They have similar interests. ｜ 推导: 相似 + 形容词化 = 相似的,类似的"},{"word":"assimilate","pos":"v.","detail":"构词: 构词: as(加强) + simil + ate(动词后缀)<br>释义: 吸收;同化","example":"例句: Plants assimilate nutrients. ｜ 推导: 使 + 相似 + 动词化 = 使相似,同化"},{"word":"simulate","pos":"v.","detail":"构词: 构词: simul(相似) + ate(动词后缀)<br>释义: 模拟,仿真","example":"例句: Computers simulate reality. ｜ 推导: 相似 + 动词化 = 使相似,模拟"},{"word":"simultaneous","pos":"a.","detail":"构词: 构词: simul(相同) + taneous(时间)<br>释义: 同时的","example":"例句: Simultaneous translation is difficult. ｜ 推导: 相同 + 时间的 = 同时发生的"}],"extra":["similarity n. 相似性（构词: simil + ar + ity）","similarly ad. 相似地（构词: simil + ar + ly）","simulation n. 模拟（构词: simul + ation）","dissimilar a. 不相似的（构词: dis + simil + ar）","assimilation n. 同化（构词: as + simil + ation）","simulator n. 模拟器（构词: simul + ator）","simile n. 明喻（构词: simil + e）","facsimile n. 复制品（构词: fac(做) + simil + e）"]},{"id":17,"root":"tit-","pronounce":"/tɪt/提特","source":"拉丁语 titulus","meaning":"标题,题签,头衔","mnemonic":"tit就是“题”。 写在对象前面的题名，可以成为标题、题签，也可以成为人的头衔。 所以tit就是“标题、题签、头衔”。","mainWords":[{"word":"title","pos":"n.","detail":"构词: 构词: tit(标题) + le<br>释义: 标题;头衔","example":"例句: The title of the book is catchy. ｜ 推导: 标题 = 标题,题目"},{"word":"entitle","pos":"v.","detail":"构词: 构词: en(使) + title<br>释义: 给...命名;赋予权利","example":"例句: This card entitles you to free entry. ｜ 推导: 使 + 标题 = 赋予头衔,给予权利"},{"word":"subtitle","pos":"n.","detail":"构词: 构词: sub(次) + title<br>释义: 副标题;字幕","example":"例句: The movie has English subtitles. ｜ 推导: 次要的 + 标题 = 副标题,字幕"},{"word":"untitled","pos":"a.","detail":"构词: 构词: un(无) + titled<br>释义: 无标题的;无头衔的","example":"例句: The document is still untitled. ｜ 推导: 无 + 有标题的 = 无标题的"}],"extra":["titled a. 有头衔的（构词: title + d）","entitlement n. 权利（构词: entitle + ment）","titular a. 名义上的 (titular)","titleholder n. 冠军（构词: title + holder）","retitle v. 重新命名（构词: re + title）","supertitle n. 主标题（构词: super + title）","titlepage n. 扉⻚（构词: title + page）","titleist n. 冠军保持者（构词: title + ist）"]},{"id":18,"root":"tour","pronounce":"/tʊər/特乌儿儿","source":"法语 tour","meaning":"旋转,环行","mnemonic":"1.tour和tʊr就是途儿，途就是旅途，儿在中文里无含义，所以tour和tur就是旅途的意思。2.旅途就是从家到目的地再回家，也就是出去兜一圈，要沿路线转弯并绕回，因此tour和tur还可以表示旋转和环行的意思。","mainWords":[{"word":"tour","pos":"n.","detail":"构词: 构词: tour(环行)<br>释义: 旅游;巡回演出","example":"例句: We took a tour of Europe. ｜ 推导: 环行 = 环游,旅行"},{"word":"tourist","pos":"n.","detail":"构词: 构词: tour + ist(人)<br>释义: 游客,旅游者","example":"例句: Tourists flooded the city. ｜ 推导: 旅游 + 人 = 旅游的人,游客"},{"word":"detour","pos":"n./v.","detail":"构词: 构词: de(偏离) + tour(路径)<br>释义: 绕道,绕行","example":"例句: We made a detour to avoid traffic. ｜ 推导: 偏离 + 路径 = 偏离原路,绕道"},{"word":"tourism","pos":"n.","detail":"构词: 构词: tour + ism(行业)<br>释义: 旅游业","example":"例句: Tourism boosts the economy. ｜ 推导: 旅游 + 行业 = 旅游业"}],"extra":["contour n. 轮廓（构词: con(共同) + tour）","touring n. 旅游 a.旅游的（构词: tour + ing）","touristy a. 游客众多的（构词: tour + isty）","entourage n. 随从（构词: en + tour + age）"]},{"id":19,"root":"turb-/troub-","pronounce":"/tɜːb/特布","source":"变体: turb-, troub-","meaning":"搅乱,旋转,混乱","mnemonic":"turb就是特步 ，特步是个著名运动品牌，它的logo就是一个巨大的红叉，红叉表示错误和错乱，因此turb就是“错误、错乱”的意思。","mainWords":[{"word":"disturb","pos":"v.","detail":"构词: 构词: dis(分开) + turb(搅乱)<br>释义: 打扰;妨碍","example":"例句: Please don't disturb me. ｜ 推导: 分开 + 搅乱 = 打破平静,打扰"},{"word":"trouble","pos":"n./v.","detail":"构词: 构词: troub(搅乱) + le<br>释义: 麻烦;困扰","example":"例句: Don't trouble yourself. ｜ 推导: 搅乱 + 名词化 = 扰乱平静的事,麻烦"},{"word":"turbulent","pos":"a.","detail":"构词: 构词: turb(搅乱) + ulent(形容词后缀)<br>释义: 动荡的;汹涌的","example":"例句: A turbulent period in history. ｜ 推导: 搅乱 + 形容词化 = 被搅乱的,动荡的"},{"word":"disturbance","pos":"n.","detail":"构词: 构词: dis + turb + ance(名词后缀)<br>释义: 扰乱;骚乱","example":"例句: There was a disturbance outside. ｜ 推导: 打扰 + 名词化 = 扰乱的状态,骚乱"},{"word":"troublesome","pos":"a.","detail":"构词: 构词: trouble + some(充满...的)<br>释义: 麻烦的;讨厌的","example":"例句: A troublesome situation. ｜ 推导: 麻烦 + 充满的 = 充满麻烦的,讨厌的"},{"word":"turbine","pos":"n.","detail":"构词: 构词: turb(旋转) + ine(名词后缀)<br>释义: 涡轮机;汽轮机","example":"例句: The turbine generates power. ｜ 推导: 旋转 + 装置 = 旋转装置,涡轮机"}],"extra":["turbulence n. 湍流;动荡（构词: turb + ulence）","perturb v. 使不安（构词: per(完全) + turb）","turbo n. 涡轮增压（构词: turb + o）","untroubled a. 平静的（构词: un + trouble + d）"]},{"id":20,"root":"vinc-/vict-","pronounce":"/vɪŋk/五衣昂克；/vɪkt/五衣克特","source":"拉丁语 vincere","meaning":"征服,战胜","mnemonic":"vinc就是完克，完克就是完全战胜，因此vinc就是“征服、战胜”的意思。","mainWords":[{"word":"victory","pos":"n.","detail":"构词: 构词: vict(征服) + ory(名词后缀)<br>释义: 胜利","example":"例句: They celebrated their victory. ｜ 推导: 征服 + 名词化 = 征服的结果,胜利"},{"word":"victim","pos":"n.","detail":"构词: 构词: vict(被征服) + im<br>释义: 受害者","example":"例句: The victim needs help. ｜ 推导: 被征服的 + 人 = 受害者,牺牲品"},{"word":"convict","pos":"v.","detail":"构词: 构词: con(完全) + vict(征服)<br>释义: 定罪 n.罪犯","example":"例句: The jury convicted him. ｜ 推导: 完全 + 征服 = 在法庭上征服,定罪"},{"word":"conviction","pos":"n.","detail":"构词: 构词: convict + ion(名词后缀)<br>释义: 定罪;信念","example":"例句: She has strong convictions. ｜ 推导: 定罪 + 名词化 = 定罪;坚定的信念"},{"word":"convince","pos":"v.","detail":"构词: 构词: con(完全) + vinc(征服) + e<br>释义: 说服,使信服","example":"例句: I couldn't convince him. ｜ 推导: 完全 + 征服 = 征服思想,说服"}],"extra":["victorious a. 胜利的（构词: vict + orious）","victor n. 胜利者（构词: vict + or）","victimize v. 使受害（构词: victim + ize）","invincible a. 不可战胜的（构词: in + vinc + ible）","convincing a. 令人信服的（构词: convince + ing）","evict v. 驱逐（构词: e(出) + vict）","province n. 省份（构词: pro + vinc + e）"]},{"id":21,"root":"fus-","pronounce":"/fjuːz/夫耶乌兹","source":"拉丁语 fundere","meaning":"流,散开,倾倒；倾倒,流动,混合","mnemonic":"fus就是“浮散”。水从杯子里倒出来会流动并向四周散开；两股水流到一起，又会混在一起。因此fus既可以表示流动、倾倒、散开，也可以表示混合。综上，fus就是“流、散开、倾倒；流动、混合”的意思，所以fus就是“流,散开,倾倒；倾倒,流动,混合”的意思。","mainWords":[{"word":"fuse","pos":"n.","detail":"构词: 构词: fus(流) + e<br>释义: 保险丝 v.熔化","example":"例句: The fuse blew out. ｜ 推导: 流 = 金属熔化流动,保险丝"},{"word":"confuse","pos":"v.","detail":"构词: 构词: con(共同) + fus(流) + e<br>释义: 使困惑;混淆","example":"例句: Don't confuse the two concepts. ｜ 推导: 共同 + 流 = 混流在一起,混淆"},{"word":"refuse","pos":"v.","detail":"构词: 构词: re(回) + fus(流) + e<br>释义: 拒绝","example":"例句: She refused the offer. ｜ 推导: 回 + 流 = 倒流回去,拒绝接受"},{"word":"diffuse","pos":"v.","detail":"构词: 构词: dif(分开) + fus(流) + e<br>释义: 扩散 a.分散的","example":"例句: Light diffused through the curtain. ｜ 推导: 分开 + 流 = 向各处流散,扩散"},{"word":"refusal","pos":"n.","detail":"构词: 构词: re + fus + al(名词后缀)<br>释义: 拒绝","example":"例句: His refusal disappointed us. ｜ 推导: 回 + 流 + 名词化 = 拒绝(的行为)"},{"word":"futile","pos":"a.","detail":"构词: 构词: fut(流走) + ile(形容词后缀)<br>释义: 徒劳的;无用的","example":"例句: All efforts proved futile. ｜ 推导: 流走的 = 像水一样流走,徒劳的"},{"word":"confusion","pos":"n.","detail":"构词: 构词: con + fus + ion(名词后缀)<br>释义: 混淆;困惑","example":"例句: There was confusion everywhere. ｜ 推导: 共同 + 流 + 名词化 = 混流的状态"},{"word":"refund","pos":"n.","detail":"构词: 构词: re(回) + fund(流,倒)<br>释义: 退款 v.退还","example":"例句: I got a full refund. ｜ 推导: 回 + 流 = 资金倒流回去,退款"},{"word":"confuse","pos":"v.","detail":"构词: 构词: con(一起) + fus(混合) + e<br>释义: 使混乱,混淆","example":"例句: Don't confuse me with facts. ｜ 推导: 一起 + 混合 = 使混在一起,使混乱"},{"word":"confusion","pos":"n.","detail":"构词: 构词: con(一起) + fus(混合) + ion(名词)<br>释义: 困惑,混乱","example":"例句: There was confusion everywhere. ｜ 推导: 一起 + 混合 + 名词化 = 混乱状态"},{"word":"refuse","pos":"v.","detail":"构词: 构词: re(向后) + fus(倾倒) + e<br>释义: 拒绝 n.废物","example":"例句: I refuse to give up. ｜ 推导: 向后 + 倾倒 = 倒回去,拒绝;废弃物"},{"word":"fuse","pos":"n.","detail":"构词: 构词: fus(流动,熔化) + e<br>释义: 保险丝 v.熔合","example":"例句: The metals fuse together. ｜ 推导: 流动熔化 = 熔合;熔断的保险丝"},{"word":"diffuse","pos":"v.","detail":"构词: 构词: dif(分开) + fus(流动) + e<br>释义: 扩散 a.冗长的","example":"例句: Light diffused through the fog. ｜ 推导: 分开 + 流动 = 向四面八方流动,扩散"},{"word":"fusion","pos":"n.","detail":"构词: 构词: fus(融合) + ion(名词后缀)<br>释义: 融合,熔化","example":"例句: Nuclear fusion produces energy. ｜ 推导: 融合 + 名词化 = 融合过程,熔化状态"}],"extra":["fusion n. 熔合;融合（构词: fus + ion）","infuse v. 灌输;注入（构词: in + fus + e）","profuse a. 大量的（构词: pro(向前) + fus + e）","transfuse v. 输血（构词: trans + fus + e）","infuse v. 灌输,注入（构词: in + fus + e）","refusal n. 拒绝（构词: re + fus + al）","transfuse v. 输血,灌输（构词: trans + fus + e）","confused a. 困惑的（构词: con + fus + ed）"]},{"id":22,"root":"hon-","pronounce":"/hɒn/赫奥恩","source":"拉丁语 honōs","meaning":"荣誉,尊严","mnemonic":"方法一：\nhon就是昂。一个人什么时候会昂首挺胸呢？自然是获得荣誉的时候，或者为了捍卫自己的尊严，例如革命烈士牺牲的时候，所以hon就是“荣誉、尊严”。\n方法二：\nhon就是红，红色在全世界都代表光荣，光荣榜又被称为红榜，并且在我国红色不仅代表光荣也代表尊严，党领导中国人民站起来了，所以hon就是“荣誉、尊严”。","mainWords":[{"word":"honor","pos":"n.","detail":"构词: 构词: hon(荣誉) + or(名词后缀)<br>释义: 荣誉;v.尊敬","example":"例句: It's an honor to meet you. ｜ 推导: 荣誉 + 名词化 = 荣誉,光荣"},{"word":"honest","pos":"a.","detail":"构词: 构词: hon(荣誉) + est(形容词后缀)<br>释义: 诚实的","example":"例句: He is an honest person. ｜ 推导: 荣誉 + 形容词化 = 有荣誉感的,诚实的"},{"word":"honorable","pos":"a.","detail":"构词: 构词: honor + able(可...的)<br>释义: 可敬的;高尚的","example":"例句: She made an honorable decision. ｜ 推导: 荣誉 + 可...的 = 值得尊敬的,高尚的"}],"extra":["honesty n. 诚实;正直（构词: honest + y）","honorary a. 荣誉的（构词: honor + ary）","dishonor n./v. 耻辱（构词: dis + honor）","dishonest a. 不诚实的（构词: dis + honest）"]},{"id":23,"root":"pand-","pronounce":"/pænd/派恩德","source":"拉丁语 pandere","meaning":"展开,扩展","mnemonic":"方法一：\npand就是膨的。膨就是膨胀，东西膨胀起来时会向外展开，范围也随之扩展。所以pand就是“展开、扩展”。\n方法二：\npand是我们小学学过的panda的一部分，即熊猫，大家都去过动物园或者看过纪录片，熊猫是慵懒的，它喜欢舒展身体开来放松一天几乎都在舒展开躺着，所以pand就是“展开、扩展”的意思。","mainWords":[{"word":"expand","pos":"v.","detail":"构词: 构词: ex(向外) + pand(展开)<br>释义: 扩大;扩张;展开","example":"例句: The company plans to expand. ｜ 推导: 向外 + 展开 = 扩张,扩大"},{"word":"expansion","pos":"n.","detail":"构词: 构词: ex + pand + sion(名词后缀)<br>释义: 扩张;扩展","example":"例句: Economic expansion continues. ｜ 推导: 展开 + 名词化 = 扩张的过程或状态"},{"word":"span","pos":"n.","detail":"构词: 构词: span(展开)<br>释义: 跨度;范围 v.跨越","example":"例句: The bridge spans the river. ｜ 推导: 展开 = 从一端展开到另一端,跨度"}],"extra":["expansive a. 广阔的;豪爽的（构词: ex + pand + sive）","expanse n. 广阔的区域（构词: ex + pand + se）","wingspan n. 翼展（构词: wing + span）","lifespan n. 寿命（构词: life + span）"]},{"id":24,"root":"peri-","pronounce":"/ˈperɪ/普诶里","source":"","meaning":"尝试,冒险","mnemonic":"peri就是“拼力”。 拼尽力气去试一件不确定的事，就是尝试，也是在冒险。 所以peri就是“尝试、冒险”。","mainWords":[{"word":"experience","pos":"n.","detail":"构词: 构词: ex(出) + peri(尝试) + ence<br>释义: 经验 v.经历","example":"例句: Experience is the best teacher. ｜ 推导: 出去 + 尝试 = 通过尝试获得的,经验"},{"word":"experiment","pos":"n./v.","detail":"构词: 构词: ex + peri + ment<br>释义: 实验","example":"例句: Scientists conduct experiments. ｜ 推导: 出去 + 尝试 + 名词化 = 主动尝试,实验"},{"word":"expert","pos":"n.","detail":"构词: 构词: ex + per(t)<br>释义: 专家 a.熟练的","example":"例句: He is an expert in this field. ｜ 推导: 反复尝试积累技能的人 = 专家"},{"word":"experienced","pos":"a.","detail":"构词: 构词: experience + d(形容词后缀)<br>释义: 有经验的","example":"例句: She is an experienced teacher. ｜ 推导: 经验 + 形容词化 = 有经验的"},{"word":"experimental","pos":"a.","detail":"构词: 构词: experiment + al(形容词后缀)<br>释义: 实验的","example":"例句: This is an experimental method. ｜ 推导: 实验 + 形容词化 = 实验性的"},{"word":"expertise","pos":"n.","detail":"构词: 构词: expert + ise(名词后缀)<br>释义: 专业知识","example":"例句: His expertise is invaluable. ｜ 推导: 专家 + 名词化 = 专家拥有的知识"}],"extra":["experiential a. 经验的（构词: experience + tial）","empirical a. 经验主义的（构词: em + pir + ical）","peril n. 危险（构词: peri + l）","perilous a. 危险的（构词: peril + ous）","pirate n. 海盗（构词: pir + ate）","inexperienced a. 无经验的（构词: in + experienced）","experimentation n. 实验（构词: experiment + ation）","expertly ad. 熟练地（构词: expert + ly）"]},{"id":25,"root":"planus","pronounce":"/plæn/普莱恩","source":"拉丁语 planus","meaning":"平坦,清晰","mnemonic":"planus就是plane，plane 的形容词意思就是“平面、平的”， od results. ｜ 推导: 向外 + 看 = 向前看,期待"},{"word":"respect","pos":"v.","detail":"构词: 构词: re(回) + spect(看)<br>释义: 尊重 n.尊敬","example":"例句: I respect your opinion. ｜ 推导: 回 + 看 = 回头看,重视,尊重"},{"word":"suspect","pos":"v.","detail":"构词: 构词: sus(下面) + spect(看)<br>释义: 怀疑 n.嫌疑犯","example":"例句: I suspect he is lying. ｜ 推导: 下面 + 看 = 偷偷地看,怀疑"},{"word":"retrospect","pos":"n./v.","detail":"构词: 构词: retro(向后) + spect(看)<br>释义: 回顾","example":"例句: In retrospect, I was wrong. ｜ 推导: 向后 + 看 = 回头看,回顾"},{"word":"expectation","pos":"n.","detail":"构词: 构词: expect + ation(名词后缀)<br>释义: 期望","example":"例句: High expectations lead to success. ｜ 推导: 期待 + 名词化 = 期望"},{"word":"unexpected","pos":"a.","detail":"构词: 构词: un(不) + expected<br>释义: 意外的","example":"例句: An unexpected visitor came. ｜ 推导: 不 + 被期待的 = 意料之外的"},{"word":"aspect","pos":"n.","detail":"构词: 构词: a(朝向) + spect(看)<br>释义: 方面;外观","example":"例句: Consider every aspect of the problem. ｜ 推导: 朝向 + 看 = 看的⻆度,方面"},{"word":"prospect","pos":"n.","detail":"构词: 构词: pro(向前) + spect(看)<br>释义: 前景;前途","example":"例句: The job has good prospects. ｜ 推导: 向前 + 看 = 看到的前景"},{"word":"perspective","pos":"n.","detail":"构词: 构词: per(通过) + spect + ive<br>释义: 观点;透视","example":"例句: From my perspective, it's wrong. ｜ 推导: 通过 + 看 = 看的方式,观点"},{"word":"spectator","pos":"n.","detail":"构词: 构词: spect + ator(做...的人)<br>释义: 观众;旁观者","example":"例句: The spectators cheered loudly. ｜ 推导: 看 + 的人 = 观看的人,观众"},{"word":"spectacle","pos":"n.","detail":"构词: 构词: spect + acle(名词后缀)<br>释义: 景象;眼镜","example":"例句: The sunset was a beautiful spectacle. ｜ 推导: 看 + 名词化 = 被看的景象/看的工具"},{"word":"spectacular","pos":"a.","detail":"构词: 构词: spectacle + ar(形容词后缀)<br>释义: 壮观的","example":"例句: The view is spectacular. ｜ 推导: 景象 + 形容词化 = 壮观的"},{"word":"spectrum","pos":"n.","detail":"构词: 构词: spect + rum(名词后缀)<br>释义: 光谱;范围","example":"例句: A wide spectrum of opinions. ｜ 推导: 看 + 名词化 = 可看到的范围"},{"word":"prospective","pos":"a.","detail":"构词: 构词: prospect + ive(形容词后缀)<br>释义: 预期的","example":"例句: Meet prospective clients. ｜ 推导: 前景 + 形容词化 = 预期的,未来的"},{"word":"respective","pos":"a.","detail":"构词: 构词: re(回) + spect + ive<br>释义: 各自的","example":"例句: In their respective fields. ｜ 推导: 回 + 看 + 形容词化 = 各自的"},{"word":"irrespective","pos":"a.","detail":"构词: 构词: ir(不) + respective<br>释义: 不考虑的","example":"例句: Irrespective of the cost. ｜ 推导: 不 + 各自的 = 不分别的,不考虑的"}],"extra":[]},{"id":31,"root":"tinu-","pronounce":"/tɪnu/提恩乌","source":"拉丁语 continuus","meaning":"连续的,持续的","mnemonic":"tinu就是藤纽，即藤蔓跟纽带，二者都是起连接作用，保证连续不断，所以tinu意思就是“连续”。","mainWords":[{"word":"continue","pos":"v.","detail":"构词: 构词: con(加强) + tinu(连续) + e<br>释义: 继续;延续","example":"例句: Please continue your speech. ｜ 推导: 加强 + 连续 = 继续,延续"},{"word":"continuous","pos":"a.","detail":"构词: 构词: con + tinu + ous(形容词后缀)<br>释义: 连续的;不间断的","example":"例句: A continuous flow of water. ｜ 推导: 连续 + 形容词化 = 无间断的"},{"word":"continual","pos":"a.","detail":"构词: 构词: con + tinu + al(形容词后缀)<br>释义: 频繁的;反复的","example":"例句: The continual noise disturbed me. ｜ 推导: 连续 + 形容词化 = 反复发生的"}],"extra":["continuation n. 继续;续篇（构词: con + tinu + ation）","discontinue v. 中断;停止（构词: dis + con + tinu + e）","continuity n. 连续性（构词: con + tinu + ity）","continually ad. 不断地（构词: continual + ly）"]},{"id":32,"root":"us-/ut-","pronounce":"/juːs/耶乌斯","source":"","meaning":"使用,习惯","mnemonic":"us/ut就是小学学过的词use，即“使用”，一种东西反复被使用，久而久之就会形成固定习惯，所以us/ut就是“使用、习惯”。","mainWords":[{"word":"use","pos":"v./n.","detail":"构词: 构词: us(使用)<br>释义: 使用","example":"例句: How do you use this tool? ｜ 推导: 使用 = 使用,运用"},{"word":"usual","pos":"a.","detail":"构词: 构词: us(习惯) + ual(形容词后缀)<br>释义: 通常的","example":"例句: As usual, he was late. ｜ 推导: 习惯 + 形容词化 = 习惯的,通常的"},{"word":"usually","pos":"ad.","detail":"构词: 构词: usual + ly(副词后缀)<br>释义: 通常地","example":"例句: I usually wake up at 7. ｜ 推导: 通常的 + 副词化 = 通常地"},{"word":"unusual","pos":"a.","detail":"构词: 构词: un(否定) + usual<br>释义: 不寻常的","example":"例句: That's an unusual request. ｜ 推导: 不 + 通常的 = 不寻常的"},{"word":"usage","pos":"n.","detail":"构词: 构词: us(使用) + age(名词后缀)<br>释义: 用法","example":"例句: Check the usage instructions. ｜ 推导: 使用 + 名词化 = 使用方法,用法"},{"word":"utilize","pos":"v.","detail":"构词: 构词: util(使用) + ize(动词后缀)<br>释义: 利用","example":"例句: Utilize all available resources. ｜ 推导: 使用 + 动词化 = 充分利用"},{"word":"abuse","pos":"v./n.","detail":"构词: 构词: ab(偏离) + us(使用) + e<br>释义: 滥用","example":"例句: Don't abuse your power. ｜ 推导: 偏离 + 使用 = 错误使用,滥用"},{"word":"used","pos":"a.","detail":"构词: 构词: use + ed(过去分词)<br>释义: 用过的;习惯的","example":"例句: I'm used to the weather. ｜ 推导: 使用 + 过去分词 = 已使用的,习惯的"},{"word":"useful","pos":"a.","detail":"构词: 构词: use + ful(充满...的)<br>释义: 有用的","example":"例句: This tool is very useful. ｜ 推导: 使用 + 充满 = 充满使用价值的,有用的"}],"extra":[]},{"id":33,"root":"bin-","pronounce":"/bɪn/毕恩","source":"拉丁语 bini","meaning":"成双,两个","mnemonic":"bin就是“并”。 把两个东西并在一起，最先得到的就是成双和两个。 所以bin就是“成双、两个”。","mainWords":[{"word":"combine","pos":"v.","detail":"构词: 构词: com(共同) + bine(两个)<br>释义: 结合;联合","example":"例句: Let's combine our efforts. ｜ 推导: 共同 + 成双 = 两个合为一体,结合"},{"word":"combination","pos":"n.","detail":"构词: 构词: com + bin + ation(名词后缀)<br>释义: 结合;组合","example":"例句: A perfect combination of flavors. ｜ 推导: 结合 + 名词化 = 结合的状态,组合"}],"extra":["binary a. 二进制的;二元的（构词: bin + ary）","combinative a. 结合的（构词: com + bin + ative）","recombine v. 重新结合（构词: re + com + bine）","combinatorial a. 组合的（构词: com + bin + atorial）","binocular a. 双目的（构词: bin + ocular(眼的)）"]},{"id":34,"root":"bind-","pronounce":"/baɪnd/布爱恩德","source":"古英语 bindan","meaning":"绑,束缚","mnemonic":"bind就是“绑的”，被捆绑的东西会受到束缚和约束，不能自由分开。所以bind就是“绑、约束、束缚、捆绑”。","mainWords":[{"word":"bind","pos":"v.","detail":"构词: 构词: bind(绑)<br>释义: 绑,束缚;约束","example":"例句: The contract binds both parties. ｜ 推导: 绑 = 捆绑,约束"},{"word":"bound","pos":"a.","detail":"构词: 构词: bind的过去分词<br>释义: 被束缚的;一定的","example":"例句: We are bound by the rules. ｜ 推导: 绑(过去分词) = 被约束的,必定的"},{"word":"boundary","pos":"n.","detail":"构词: 构词: bound(界限) + ary(名词后缀)<br>释义: 边界,界限","example":"例句: Respect others' boundaries. ｜ 推导: 界限 + 名词化 = 边界,分界线"}],"extra":["binding n. 装订;约束力 a.有约束力的","unbind v. 解开,松绑（构词: un + bind）","binder n. 装订工;活⻚夹","spellbind v. 迷住（构词: spell + bind）","unbounded a. 无限的（构词: un + bound + ed）","bindery n. 装订厂（构词: bind + ery）"]},{"id":35,"root":"cit-/civ-","pronounce":"/sɪt/西特","source":"","meaning":"城市,公民,文明","mnemonic":"1.cit/civ是我们小学学过的city的一部分，其中末尾 y 无意义，city 是城市，2010年上海世博会口号叫城市让生活更美好，世博会即是展示人类文明的窗口，因此城市是人类文明的代表之一，所以cit/civ就是“城市、文明”。2.cit/civ就是市伍，市是城市的意思，伍就是人们的意思，组合起来就是住在城市的人们，因此cit/civ就是“市民、公民”的意思。","mainWords":[{"word":"city","pos":"n.","detail":"构词: 构词: cit(城邦) + y<br>释义: 城市","example":"例句: New York is a big city. ｜ 推导: 城邦 = 人群聚居地,城市"},{"word":"citizen","pos":"n.","detail":"构词: 构词: city + zen(居民)<br>释义: 公民;市民","example":"例句: Every citizen has rights. ｜ 推导: 城市 + 居民 = 城市居民,公民"},{"word":"civil","pos":"a.","detail":"构词: 构词: civ(公民) + il(形容词后缀)<br>释义: 公民的;文明的","example":"例句: Civil rights are important. ｜ 推导: 公民 + 形容词化 = 公民的,文明的"},{"word":"civilian","pos":"n.","detail":"构词: 构词: civil + ian(表人)<br>释义: 平民 a.民用的","example":"例句: Protect civilian lives. ｜ 推导: 公民的 + 人 = 非军人的公民,平民"},{"word":"civilization","pos":"n.","detail":"构词: 构词: civil + ize + ation<br>释义: 文明","example":"例句: Ancient civilizations were great. ｜ 推导: 文明的 + 使...化 + 状态 = 文明"},{"word":"civilize","pos":"v.","detail":"构词: 构词: civil + ize(使...)<br>释义: 使文明化","example":"例句: Education helps civilize society. ｜ 推导: 文明的 + 使... = 使文明化"},{"word":"publicity","pos":"n.","detail":"构词: 构词: public(公共的) + ity<br>释义: 宣传;公开","example":"例句: The event needs more publicity. ｜ 推导: 公共的 + 名词化 = 公开宣传"}],"extra":[]},{"id":36,"root":"class-","pronounce":"/klæs/克莱斯","source":"拉丁语 classis","meaning":"群体,等级,类别","mnemonic":"class本身就是我们小学学过的class。class 就是“班级、阶级、课程、等级”的意思，这四个意思都有表示群体、等级、类别的用法，因此class作为词根的时候就是“群体、等级、类别”的意思。","mainWords":[{"word":"class","pos":"n.","detail":"构词: 构词: class(群体)<br>释义: 班级;阶级;课程;等级","example":"例句: We have math class today. ｜ 推导: 群体 = 班级,阶级,类别"},{"word":"classroom","pos":"n.","detail":"构词: 构词: class + room(房间)<br>释义: 教室","example":"例句: Students study in the classroom. ｜ 推导: 班级 + 房间 = 教室"},{"word":"classic","pos":"a.","detail":"构词: 构词: class + ic(形容词后缀)<br>释义: 经典的 n.经典作品","example":"例句: It's a classic novel. ｜ 推导: 最高等级 + 形容词化 = 经典的"},{"word":"classical","pos":"a.","detail":"构词: 构词: classic + al(形容词后缀)<br>释义: 古典的;传统的","example":"例句: She loves classical music. ｜ 推导: 经典的 + 形容词化 = 古典的"},{"word":"classify","pos":"v.","detail":"构词: 构词: class + ify(动词后缀)<br>释义: 分类;分级","example":"例句: We need to classify the data. ｜ 推导: 类别 + 动词化 = 分类"},{"word":"classmate","pos":"n.","detail":"构词: 构词: class + mate(伙伴)<br>释义: 同班同学","example":"例句: She is my classmate. ｜ 推导: 班级 + 伙伴 = 同班同学"},{"word":"classification","pos":"n.","detail":"构词: 构词: classify + ation(名词后缀)<br>释义: 分类;分级","example":"例句: The classification is clear. ｜ 推导: 分类 + 名词化 = 分类(系统)"}],"extra":[]},{"id":37,"root":"fer-","pronounce":"/fɜːr/佛儿","source":"拉丁语 ferre","meaning":"携带,带来；携带,传递(位移)；承载,承受；携带,传递(主动给予)","mnemonic":"fer是我们生活熟词offer的一部分。offer就是“拿着一份东西，把它带走、扛住或交给别人”的意思，前面的of无意义。\n所以fer就是“携带、带来、传递；承载、承受；给予”的意思。","mainWords":[{"word":"differ","pos":"v.","detail":"构词: 构词: dif(分开) + fer(携带)<br>释义: 不同,相异","example":"例句: Our opinions differ greatly. ｜ 推导: 分开 + 携带 = 携带到不同方向,产生差异"},{"word":"different","pos":"a.","detail":"构词: 构词: differ + ent(形容词后缀)<br>释义: 不同的","example":"例句: We have different ideas. ｜ 推导: 相异 + 形容词化 = 不同的,相异的"},{"word":"difference","pos":"n.","detail":"构词: 构词: differ + ence(名词后缀)<br>释义: 差异,区别","example":"例句: What's the difference? ｜ 推导: 相异 + 名词化 = 差异,不同之处"},{"word":"differentiate","pos":"v.","detail":"构词: 构词: different + iate(动词后缀)<br>释义: 区分","example":"例句: Can you differentiate them? ｜ 推导: 不同的 + 动词化 = 使不同,区分开来"},{"word":"indifferent","pos":"a.","detail":"构词: 构词: in(不) + different<br>释义: 冷漠的","example":"例句: He seems indifferent to it. ｜ 推导: 不 + 有差异的 = 无差别对待的,冷漠的"},{"word":"transfer","pos":"v.","detail":"构词: 构词: trans(穿过) + fer(携带)<br>释义: 转移 n.转让","example":"例句: Transfer money to my account. ｜ 推导: 穿过 + 携带 = 从一处携带到另一处"},{"word":"refer","pos":"v.","detail":"构词: 构词: re(回) + fer(携带)<br>释义: 参考;提及","example":"例句: Please refer to page 10. ｜ 推导: 回 + 携带 = 把注意力带回到某处"},{"word":"reference","pos":"n.","detail":"构词: 构词: refer + ence(名词后缀)<br>释义: 参考;参考书","example":"例句: Use this book as reference. ｜ 推导: 参考 + 名词化 = 参考资料,引用来源"},{"word":"ferry","pos":"n.","detail":"构词: 构词: fer(携带) + ry(名词后缀)<br>释义: 渡船 v.摆渡","example":"例句: Take the ferry across the river. ｜ 推导: 携带 + 工具 = 运送的交通工具"},{"word":"circumference","pos":"n.","detail":"构词: 构词: circum(环绕) + fer + ence<br>释义: 周长","example":"例句: Calculate the circumference. ｜ 推导: 环绕 + 携带 = 绕一圈携带的路径长度"},{"word":"suffer","pos":"v.","detail":"构词: 构词: suf(在下) + fer(承受)<br>释义: 遭受;忍受","example":"例句: He suffered from illness. ｜ 推导: 在下 + 承受 = 在下面承受压力,遭受"},{"word":"infer","pos":"v.","detail":"构词: 构词: in(进入) + fer(携带)<br>释义: 推断;推论","example":"例句: We can infer from the data. ｜ 推导: 进入 + 携带 = 从证据中带出结论"},{"word":"inference","pos":"n.","detail":"构词: 构词: infer + ence(名词后缀)<br>释义: 推论;推断","example":"例句: Draw an inference from facts. ｜ 推导: 推断 + 名词化 = 推断的结果,推论"},{"word":"interfere","pos":"v.","detail":"构词: 构词: inter(之间) + fer(携带) + e<br>释义: 干涉;妨碍","example":"例句: Don't interfere with my work. ｜ 推导: 之间 + 携带 = 在中间产生影响,干扰"},{"word":"interference","pos":"n.","detail":"构词: 构词: interfere + ence<br>释义: 干扰;干涉","example":"例句: Radio interference is strong. ｜ 推导: 干涉 + 名词化 = 干扰现象,干涉"},{"word":"fertile","pos":"a.","detail":"构词: 构词: fer(承载) + tile(形容词后缀)<br>释义: 肥沃的;多产的","example":"例句: The soil is very fertile. ｜ 推导: 承载 + 能够的 = 能承载作物的,肥沃的"},{"word":"fertilizer","pos":"n.","detail":"构词: 构词: fertile + izer(使...的东⻄)<br>释义: 肥料;化肥","example":"例句: Apply fertilizer to the field. ｜ 推导: 肥沃的 + 使成为 = 使土地肥沃的物质"},{"word":"offer","pos":"v.","detail":"构词: 构词: of(向前) + fer(携带)<br>释义: 提供 n.提议","example":"例句: I offer you my help. ｜ 推导: 向前 + 携带 = 主动拿出来给予"},{"word":"confer","pos":"v.","detail":"构词: 构词: con(共同) + fer(携带)<br>释义: 授予;商议","example":"例句: They conferred an honor on him. ｜ 推导: 共同 + 携带 = 一起商议或授予"},{"word":"conference","pos":"n.","detail":"构词: 构词: confer + ence(名词后缀)<br>释义: 会议;协商","example":"例句: Attend an international li(子孙) + fer + ate）","aquifer n. 含水层（构词: aqui(水) + fer）","pestiferous a. 有害的（构词: pest + i + fer + ous）","Lucifer n. 路⻄法（构词: luci(光) + fer）"]},{"id":38,"root":"dram-","pronounce":"/dræm/德拉姆","source":"希腊语 δρᾶμα","meaning":"做,行动,表演","mnemonic":"dram就是我们平时说的“抓马”。 “抓马”就是戏剧化的表演；戏剧中的演员需要做动作、采取行动并进行表演。 所以dram就是“做、行动、表演”。","mainWords":[{"word":"drama","pos":"n.","detail":"构词: 构词: dram(行动) + a<br>释义: 戏剧;戏剧性事件","example":"例句: Life is full of drama. ｜ 推导: 行动 = 舞台上的行动,戏剧"},{"word":"dramatic","pos":"a.","detail":"构词: 构词: dram + atic(形容词后缀)<br>释义: 戏剧的;引人注目的","example":"例句: The change was dramatic. ｜ 推导: 戏剧 + 形容词化 = 戏剧性的,引人注目的"}],"extra":["dramatically ad. 戏剧性地（构词: dramat + ically）","dramatize v. 使戏剧化（构词: dramat + ize）","dramatist n. 剧作家（构词: dramat + ist）","melodrama n. 情节剧（构词: melo(音乐) + drama）"]},{"id":39,"root":"-eer","pronounce":"/ɪə(r)/伊儿儿","source":"法语 -ier","meaning":"职业后缀,从事...的人","mnemonic":"eer就是爷，通常作为后缀，也就是- 爷，例如军爷，就是从事军事工作的人，所以eer作为后缀的含义是“从事 xx行业的人”，与此同时eer比常见后缀er多了一个e表示加强，因此还可以程度更重一点，表示“xx行业里非常牛逼的人 、专家”。","mainWords":[{"word":"engineer","pos":"n.","detail":"构词: 构词: engine(引擎) + eer(人)<br>释义: 工程师","example":"例句: He works as an engineer. ｜ 推导: 引擎 + 从事...的人 = 工程师"},{"word":"volunteer","pos":"n.","detail":"构词: 构词: volunt(意愿) + eer(人)<br>释义: 志愿者","example":"例句: Many volunteers helped us. ｜ 推导: 意愿 + 从事...的人 = 志愿者"},{"word":"pioneer","pos":"n.","detail":"构词: 构词: pion(步兵) + eer(人)<br>释义: 先驱;开拓者","example":"例句: She was a pioneer in science. ｜ 推导: 步兵 + 从事...的人 = 先行者,先驱"},{"word":"engineering","pos":"n.","detail":"构词: 构词: engineer + ing(名词后缀)<br>释义: 工程学","example":"例句: He studies engineering. ｜ 推导: 工程师 + 名词化 = 工程学"}],"extra":["career n. 职业;生涯（构词: car(跑) + eer）","auctioneer n. 拍卖师（构词: auction + eer）","mountaineer n. 登山者（构词: mountain + eer）","profiteer n. 奸商（构词: profit + eer）","racketeer n. 敲诈者（构词: racket + eer）","sightseer n. 观光者（构词: sight + s + eer）","overseer n. 监督者（构词: over + s + eer）","puppeteer n. 操纵木偶者（构词: puppet + eer）","steer v. 驾驶;引导（构词: st + eer）","cheer v./n. 欢呼;喝彩（构词: ch + eer）"]},{"id":40,"root":"fant-/phan-","pronounce":"/fænt/夫艾恩特","source":"变体: fant-, phan-","meaning":"显示,显现,想象","mnemonic":"1.fan / fant / ph​​ant 就是fans也就是粉丝、粉丝是喜爱着迷某个明星的人，因此fan / fant / ph​​ant就是“喜爱、着迷”。2.fan / fant / ph​​ant 就是fans也就是粉丝，粉丝通常指代最多的是追星族人群，那么人为什么会追星进而成为粉丝，心理学上认为是追的那个人满足了自己某种想象和幻想，成为自己想象和幻想在现实中的投射，因此fan / fant / ph​​ant就是“幻想、想象”。","mainWords":[{"word":"fantasy","pos":"n.","detail":"构词: 构词: fant(想象) + asy(名词后缀)<br>释义: 幻想;想象","example":"例句: She lives in a fantasy world. ｜ 推导: 想象 + 名词化 = 幻想,想象"},{"word":"fantastic","pos":"a.","detail":"构词: 构词: fant(想象) + astic(形容词后缀)<br>释义: 奇妙的;极好的","example":"例句: What a fantastic idea! ｜ 推导: 想象 + 形容词化 = 如幻想般的,奇妙的"},{"word":"fancy","pos":"n.爱好,迷恋","detail":"构词: 构词: fan + -cy(性质、状态)<br>释义: v.想象,幻想 a.花式的,奇特的","example":"推导: 核心词根「fant-/phan-」表示“显示,显现,想象”，结合前后缀，可推出“n.爱好,迷恋 v.想象,幻想 a.花式的,奇特的”"}],"extra":["phantom n. 幽灵;幻影（构词: phan + tom）","fancy n. 幻想;爱好（构词: fan + cy）","fantasize v. 幻想;想象（构词: fant + asize）","phantasm n. 幻觉;幻象（构词: phan + tasm）","fantastical a. 空想的（构词: fant + astical）","phantasmagoria n. 千变万化的景象","sycophant n. 谄媚者（构词: syco + phan + t）","epiphany n. 顿悟（构词: epi + phan + y）","emphasis n. 强调（构词: em + phas + is）","phase n. 阶段;相位（构词: phas + e）"]},{"id":41,"root":"govern-","pronounce":"/ˈgʌvən/嘎文","source":"拉丁语 gubernāre","meaning":"掌舵,统治,管理","mnemonic":"govern 就是“国王”，国王的主要职责是治理国家、实行统治，因此govern就是“治理、统治”。","mainWords":[{"word":"govern","pos":"v.","detail":"构词: 构词: govern(掌舵,统治)<br>释义: 统治;管理","example":"例句: Laws govern our behavior. ｜ 推导: 掌舵 = 统治,管理"},{"word":"government","pos":"n.","detail":"构词: 构词: govern + ment(名词后缀)<br>释义: 政府","example":"例句: The government passed new laws. ｜ 推导: 统治 + 机构 = 统治机构,政府"},{"word":"governor","pos":"n.","detail":"构词: 构词: govern + or(执行者后缀)<br>释义: 州长;总督","example":"例句: The governor visited our city. ｜ 推导: 统治 + 执行者 = 统治者,州长"}],"extra":["governance n. 管理;统治（构词: govern + ance）","governmental a. 政府的（构词: government + al）","misgovern v. 管理不善（构词: mis + govern）","ungovernable a. 难以管理的 (un + gov alize v. 个性化（构词: person + al + ize）","personally ad. 亲自地（构词: person + al + ly）","impersonal a. 非个人的（构词: im + person + al）","persona n. ⻆色;人格面具（构词: person + a）","personify v. 拟人化（构词: person + ify）","personage n. 要人;名人（构词: person + age）","interpersonal a. 人际的（构词: inter + person + al）","personable a. 风度好的（构词: person + able）"]},{"id":49,"root":"-strict-/-string-/-strain-","pronounce":"/strɪkt/斯特里克特","source":"拉丁语 stringere","meaning":"拉紧,束缚,约束","mnemonic":"1.string就是一根绳，绳子一拉紧，就会把东西束缚在一起，不能随便分开。2.strain就是把东西拉紧以后形成的张力。3.strict可以理解为把规矩拉得很紧，要求自然就严格、约束也更强。综上，strict/string/strain就是“拉紧、束缚、约束”的意思，所以strict-/-string-/-strain就是“拉紧,束缚,约束”的意思。","mainWords":[{"word":"strict","pos":"a.","detail":"构词: 构词: strict(拉紧)<br>释义: 严格的;精确的","example":"例句: The teacher is very strict. ｜ 推导: 拉紧 = 严格的,不松懈的"},{"word":"restrict","pos":"v.","detail":"构词: 构词: re(再) + strict(拉紧)<br>释义: 限制;约束","example":"例句: Restrict access to the area. ｜ 推导: 再 + 拉紧 = 限制,约束"},{"word":"restraint","pos":"n.","detail":"构词: 构词: re + strain(拉紧) + t<br>释义: 抑制;约束","example":"例句: Show some restraint. ｜ 推导: 再 + 拉紧 + 名词化 = 约束,克制"},{"word":"restrain","pos":"v.","detail":"构词: 构词: re(再) + strain(拉紧)<br>释义: 抑制;约束","example":"例句: Restrain your anger. ｜ 推导: 再 + 拉紧 = 抑制,控制"},{"word":"constrain","pos":"v.","detail":"构词: 构词: con(共同) + strain(拉紧)<br>释义: 限制;强迫","example":"例句: Budget constrains our choices. ｜ 推导: 共同 + 拉紧 = 限制,约束"},{"word":"district","pos":"n.","detail":"构词: 构词: dis(分开) + strict(拉紧)<br>释义: 地区;行政区","example":"例句: The business district is busy. ｜ 推导: 分开 + 约束 = 划定界限的区域"},{"word":"strain","pos":"v.","detail":"构词: 构词: strain(拉紧)<br>释义: 拉紧 n.压力;紧张","example":"例句: The rope is under strain. ｜ 推导: 拉紧 = 紧张,压力"},{"word":"string","pos":"n.","detail":"构词: 构词: string(拉紧的东⻄)<br>释义: 线;弦;一串","example":"例句: Guitar strings need tuning. ｜ 推导: 拉紧的东⻄ = 弦,线"}],"extra":[]},{"id":50,"root":"text-","pronounce":"/tekst/特诶克斯特","source":"拉丁语 texere","meaning":"编织","mnemonic":"text中间的 x 像两根线交叉在一起。很多线不断交叉、穿插，就能编织成一块布；很多词句彼此穿插，也像把内容编织成一篇文章。所以text就是“编织”。","mainWords":[{"word":"text","pos":"n.","detail":"构词: 构词: text(编织)<br>释义: 文本;课文","example":"例句: Read the text carefully. ｜ 推导: 编织 = 编织出的文字,文本"},{"word":"context","pos":"n.","detail":"构词: 构词: con(一起) + text(编织)<br>释义: 上下文;语境","example":"例句: Understand words in context. ｜ 推导: 一起 + 编织 = 编织在一起的,语境"},{"word":"texture","pos":"n.","detail":"构词: 构词: text(编织) + ure(名词后缀)<br>释义: 质地;纹理","example":"例句: The fabric has a smooth texture. ｜ 推导: 编织 + 状态 = 编织的方式,质地"},{"word":"textile","pos":"n.","detail":"构词: 构词: text(编织) + ile(相关的)<br>释义: 纺织品 a.纺织的","example":"例句: The textile industry is important. ｜ 推导: 编织 + 相关的 = 编织相关的,纺织品"},{"word":"textbook","pos":"n.","detail":"构词: 构词: text(文本) + book(书)<br>释义: 教科书;课本","example":"例句: Open your textbook to page 50. ｜ 推导: 文本 + 书 = 包含文本的书,教科书"}],"extra":["pretext n. 借口;托词（构词: pre(预先) + text）","textual a. 文本的（构词: text + ual）","subtext n. 潜台词（构词: sub(下) + text）","hypertext n. 超文本（构词: hyper(超) + text）"]},{"id":51,"root":"caus-/cuse-","pronounce":"/kɔːz/考兹","source":"拉丁语 causa","meaning":"原因;指控","mnemonic":"caus/cuse就是“靠谁”，一件事发生后我们通常会追问这是靠谁的，也就是因为什么造成的”，确定了是某个人的过错后，就会进行指控。所以caus/cuse就是“原因、指控”的意思。","mainWords":[{"word":"cause","pos":"n.","detail":"构词: 构词: caus(原因) + e<br>释义: 原因 v.导致","example":"例句: What's the cause of the fire? ｜ 推导: 原因 = 导致事情发生的根源"},{"word":"because","pos":"conj.","detail":"构词: 构词: be + cause(原因)<br>释义: 因为","example":"例句: I stayed home because I was sick. ｜ 推导: 是 + 原因 = 因为,由于"},{"word":"accuse","pos":"v.","detail":"构词: 构词: ac(朝向) + cuse(原因)<br>释义: 指控;指责","example":"例句: He was accused of theft. ｜ 推导: 朝向 + 原因 = 指向原因,指控"},{"word":"excuse","pos":"n.","detail":"构词: 构词: ex(出) + cuse(原因)<br>释义: 借口 v.原谅","example":"例句: That's just an excuse. ｜ 推导: 出 + 原因 = 脱离原因,借口"}],"extra":["causative a. 成为原因的（构词: caus + ative）","causal a. 因果关系的（构词: caus + al）","causality n. 因果关系（构词: caus + ality）","accusation n. 指控（构词: ac + cus + ation）"]},{"id":52,"root":"cit-","pronounce":"/saɪt/斯爱特","source":"拉丁语 citāre","meaning":"召唤,唤起,激发","mnemonic":"cit就是“起它”。把一个沉睡的人叫起来，是召唤；把一段记忆重新叫起来，是唤起；把情绪和力量叫起来，是激发。所以cit就是“召唤、唤起、激发”的意思。","mainWords":[{"word":"cite","pos":"v.","detail":"构词: 构词: cit(召唤) + e<br>释义: 引用;传唤","example":"例句: Please cite your sources. ｜ 推导: 召唤 = 召唤证据,引用"},{"word":"excite","pos":"v.","detail":"构词: 构词: ex(出) + cit(唤起) + e<br>释义: 使兴奋;激发","example":"例句: The news excited everyone. ｜ 推导: 出 + 唤起 = 从内唤起情绪,使兴奋"},{"word":"exciting","pos":"a.","detail":"构词: 构词: ex + cit + ing(形容词后缀)<br>释义: 令人兴奋的","example":"例句: What an exciting game! ｜ 推导: 激发 + 进行时 = 令人兴奋的"},{"word":"excitement","pos":"n.","detail":"构词: 构词: ex + cit + ment(名词后缀)<br>释义: 兴奋","example":"例句: I felt great excitement. ｜ 推导: 激发 + 名词化 = 兴奋的状态"},{"word":"recite","pos":"v.","detail":"构词: 构词: re(再) + cit(唤起) + e<br>释义: 背诵;朗诵","example":"例句: She can recite the poem. ｜ 推导: 再 + 唤起 = 再次唤起记忆,背诵"},{"word":"citation","pos":"n.","detail":"构词: 构词: cit(召唤) + ation(名词后缀)<br>释义: 引用;表彰","example":"例句: The paper has many citations. ｜ 推导: 召唤 + 名词化 = 引用,引证"}],"extra":["incite v. 煽动;激起（构词: in(向内) + cit + e）","excited a. 兴奋的（构词: ex + cit + ed）","solicit v. 恳求;招揽（构词: sol(全部) + cit）","elicit v. 引出;诱出（构词: e(出) + cit）"]},{"id":53,"root":"furn-","pronounce":"/fɜːn/佛恩","source":"拉丁语 furnire","meaning":"提供,装备","mnemonic":"furn就是奉，奉即提供，因此furn就是furn 就是“提供 给”的意思。","mainWords":[{"word":"furniture","pos":"n.","detail":"构词: 构词: furn(装备) + iture(名词后缀)<br>释义: 家具","example":"例句: The room needs new furniture. ｜ 推导: 装备 + 名词化 = 装备房间的物品,家具"},{"word":"furnish","pos":"v.","detail":"构词: 构词: furn(装备) + ish(动词后缀)<br>释义: 装备;提供","example":"例句: They furnished the apartment nicely. ｜ 推导: 装备 + 动词化 = 为...提供装备"}],"extra":["furnished a. 配备家具的（构词: furn + ish + ed）","unfurnished a. 未配备家具的 (un + furn + ish + e","furnishing n. 家具;装饰（构词: furn + ish + ing）","refurnish v. 重新装备（构词: re + furn + ish）"]},{"id":54,"root":"leg-","pronounce":"/leg/勒诶格","source":"拉丁语 legare；拉丁语 lex/legis","meaning":"委派,传递,选择；法律","mnemonic":"1.leg就是我们小学学过的leg，即腿的意思，腿就是跑腿，跑腿的人是被委派去传递消息的，因此leg就是“选择、委派、传递”的意思。2.leg就是“勒个”勒就是约束，约束要用规矩去达成，社会对人的约束就是法律，因此leg就是“法律、约束”的意思。","mainWords":[{"word":"delegate","pos":"n.","detail":"构词: 构词: de(向下) + leg(委派) + ate<br>释义: 代表 v.委派","example":"例句: He will delegate the task to me. ｜ 推导: 向下 + 委派 = 把权力委托给下级"},{"word":"allege","pos":"v.","detail":"构词: 构词: al(=ad向) + leg(声明) + e<br>释义: 宣称;指控","example":"例句: They allege fraud in the election. ｜ 推导: 向前 + 声明 = 公开宣称(未经证实)"},{"word":"legacy","pos":"n.","detail":"构词: 构词: leg(委托) + acy(名词后缀)<br>释义: 遗产;遗赠","example":"例句: He left a great legacy. ｜ 推导: 委托 + 名词化 = 委托传承之物,遗产"},{"word":"legal","pos":"a.","detail":"构词: 构词: leg(法律) + al(形容词后缀)<br>释义: 合法的;法律的","example":"例句: Seek legal advice first. ｜ 推导: 法律 + 形容词化 = 合法的,法律的"},{"word":"illegal","pos":"a.","detail":"构词: 构词: il(非) + legal<br>释义: 非法的;违法的","example":"例句: Illegal parking is prohibited. ｜ 推导: 非 + 合法的 = 非法的,违法的"},{"word":"legislation","pos":"n.","detail":"构词: 构词: legis(法律) + lation(行为)<br>释义: 立法;法律","example":"例句: New legislation was passed. ｜ 推导: 法律 + 制定行为 = 立法,法律制定"},{"word":"legitimate","pos":"a.","detail":"构词: 构词: leg(法律) + itim + ate<br>释义: 合法的;正当的","example":"例句: He has legitimate concerns. ｜ 推导: 法律 + 最高级 = 最合法的,正当的"},{"word":"privilege","pos":"n.","detail":"构词: 构词: privi(私人) + leg(法律) + e<br>释义: 特权;优待","example":"例句: Education is a privilege. ｜ 推导: 私人 + 法律 = 私人法律权利,特权"}],"extra":["delegation n. 代表团;委派（构词: delegate + ion）","relegate v. 贬职;降级（构词: re(往回) + legate）","allegation n. 指控;声称（构词: allege + ation）","legate n. 使节;特使（构词: leg + ate）","legality n. 合法性（构词: legal + ity）","legally ad. 合法地（构词: legal + ly）","illegitimate a. 非法的;私生的（构词: il + legitimate）","privileged a. 有特权的（构词: privilege + d）"]},{"id":55,"root":"-lect-/-leg-/-lig-","pronounce":"/lekt/勒诶克特","source":"","meaning":"收集,选择；阅读,理解","mnemonic":"lect就是“列挑”。先把许多东西列出来，再从里面挑出需要的部分，就是选择；把挑出来的内容集中到一起，就是收集；把文字和信息挑出来认真看，才能阅读并理解。所以lect就是“收集、选择；阅读、理解”的意思。","mainWords":[{"word":"collect","pos":"v.","detail":"构词: 构词: col(共同) + lect(收集)<br>释义: 收集","example":"例句: Collect stamps as a hobby. ｜ 推导: 共同 + 收集 = 收集,搜集"},{"word":"collection","pos":"n.","detail":"构词: 构词: collect + ion(名词后缀)<br>释义: 收藏品;收集","example":"例句: An art collection worth millions. ｜ 推导: 收集 + 名词化 = 收藏品,收集物"},{"word":"collective","pos":"a.","detail":"构词: 构词: collect + ive(形容词后缀)<br>释义: 集体的","example":"例句: Collective wisdom is powerful. ｜ 推导: 收集 + 形容词化 = 集合的,集体的"},{"word":"recollect","pos":"v.","detail":"构词: 构词: re(重新) + col + lect<br>释义: 回忆","example":"例句: I can't recollect his name. ｜ 推导: 重新 + 收集 = 重新收集记忆,回忆"},{"word":"select","pos":"v.","detail":"构词: 构词: se(分开) + lect(选择)<br>释义: 选择","example":"例句: Select the best option. ｜ 推导: 分开 + 选择 = 挑选,选择"},{"word":"selection","pos":"n.","detail":"构词: 构词: select + ion(名词后缀)<br>释义: 选择;精选品","example":"例句: A wide selection of books. ｜ 推导: 选择 + 名词化 = 选择,精选集"},{"word":"elect","pos":"v.","detail":"构词: 构词: e(出) + lect(选择)<br>释义: 选举","example":"例句: Elect a new president. ｜ 推导: 出来 + 选择 = 选出,选举"},{"word":"eligible","pos":"a.","detail":"构词: 构词: e + lig(选择) + ible(能...的)<br>释义: 合格的","example":"例句: Eligible for the scholarship. ｜ 推导: 出来 + 选择 + 能够的 = 可被选的,合格的"},{"word":"elegant","pos":"a.","detail":"构词: 构词: e + leg(选择) + ant<br>释义: 优雅的","example":""},{"word":"neglect","pos":"v.","detail":"构词: 构词: neg(不) + lect(选择)<br>释义: 忽视","example":""},{"word":"negligible","pos":"a.","detail":"构词: 构词: neg + lig + ible(能...的)<br>释义: 可忽略的","example":"例句: The risk is negligible. ｜ 推导: 不 + 选择 + 能够的 = 可以不选择的,可忽略的"},{"word":"intellectual","pos":"a.","detail":"构词: 构词: intel(理解) + lect + ual<br>释义: 智力的 n.知识分子","example":"例句: An intellectual discussion. ｜ 推导: 理解 + 阅读 + 形容词化 = 智力的"},{"word":"intelligent","pos":"a.","detail":"构词: 构词: intel(理解) + lig + ent<br>释义: 聪明的","example":"例句: An intelligent student. ｜ 推导: 理解 + 选择 + 形容词化 = 聪明的"},{"word":"intelligence","pos":"n.","detail":"构词: 构词: intel + lig + ence<br>释义: 智力;情报","example":"例句: Artificial intelligence (AI). ｜ 推导: 理解 + 选择 + 名词化 = 智力"},{"word":"intelligible","pos":"a.","detail":"构词: 构词: intel + lig + ible<br>释义: 可理解的","example":"例句: An intelligible explanation. ｜ 推导: 理解 + 选择 + 能够的 = 可理解的"},{"word":"diligent","pos":"a.","detail":"构词: 构词: di(分开) + lig + ent<br>释义: 勤奋的","example":"例句: A diligent worker. ｜ 推导: 仔细 + 选择 = 精心选择每件事,勤奋的"},{"word":"lecture","pos":"n.","detail":"构词: 构词: lect(阅读) + ure<br>释义: 讲座 v.讲课","example":"例句: Attend a lecture on history. ｜ 推导: 阅读 + 名词化 = 朗读讲解,讲座"},{"word":"college","pos":"n.","detail":"构词: 构词: col(共同) + leg(阅读) + e<br>释义: 学院;大学","example":"例句: Study at college. ｜ 推导: 共同 + 阅读 = 共同读书的地方,学院"},{"word":"legend","pos":"n.","detail":"构词: 构词: leg(阅读) + end<br>释义: 传说;传奇","example":"例句: An ancient legend. ｜ 推导: 阅读 + 名词化 = 被阅读传诵的故事,传说"},{"word":"dialect","pos":"n.","detail":"构词: 构词: dia(通过) + lect(说话)<br>释义: 方言","example":""}],"extra":[]},{"id":56,"root":"lig-","pronounce":"/lɪg/利格","source":"拉丁语 ligare","meaning":"绑,捆绑","mnemonic":"方法一：lig就是“勒紧”，勒紧一般是用绳子勒紧，那什么任务需要用绳子勒紧呢，就是捆绑，所以lig就是“绑、捆绑”的意思。方法二：为了记忆，可以把LIG记成“Link It, Grip”。\n\nLink It表示先把两个东西连接到一起；Grip表示再把它们紧紧抓住，不让它们分开。\n\n想象用一根绳子把两个物体连在一起，再把绳结勒紧。Link提供“连接”，It提供被连接的对象，Grip提供“抓紧、固定”的结果，三个部分缺一不可。\n\n这些动作合起来，就是绑住、捆住和连接。\n\n所以lig就是“绑、捆绑、连接”的意思。","mainWords":[{"word":"oblige","pos":"v.","detail":"构词: 构词: ob(向) + lig(绑) + e<br>释义: 迫使;施恩","example":"例句: I'm obliged to help you. ｜ 推导: 向 + 绑 = 使负有义务,迫使"},{"word":"obligation","pos":"n.","detail":"构词: 构词: ob + lig + ation(名词后缀)<br>释义: 义务;责任","example":"例句: It's my obligation to help. ｜ 推导: 绑定 + 名词化 = 被绑定的责任,义务"},{"word":"religion","pos":"n.","detail":"构词: 构词: re(重新) + lig(绑) + ion<br>释义: 宗教;信仰","example":"例句: Religion plays a major role. ｜ 推导: 重新 + 绑 = 重新连接(人与神),宗教"},{"word":"religious","pos":"a.","detail":"构词: 构词: religion + ous(形容词后缀)<br>释义: 宗教的;虔诚的","example":"例句: He is very religious. ｜ 推导: 宗教 + 形容词化 = 宗教的,虔诚的"}],"extra":["ligament n. 韧带（构词: lig + ament）","ligature n. 绷带;结扎（构词: lig + ature）","league n. 联盟（构词: lig的变体）","ally n. 同盟者 v.结盟（构词: al + ly,lig变体）","alliance n. 联盟（构词: al + li + ance）","reliable a. 可靠的（构词: re + li + able）","reliance n. 信赖（构词: re + li + ance）"]},{"id":57,"root":"loc-","pronounce":"/lɒk/勒奥克","source":"拉丁语 locus","meaning":"地点,位置","mnemonic":"loc就是“落座”。 一个东西落座的地方，就是它所在的地点和位置。 所以loc就是“地点、位置”。","mainWords":[{"word":"local","pos":"a.","detail":"构词: 构词: loc(地点) + al(形容词后缀)<br>释义: 本地的;局部的","example":"例句: Support local businesses. ｜ 推导: 地点 + 形容词化 = 本地的,当地的"},{"word":"location","pos":"n.","detail":"构词: 构词: loc(地点) + ation(名词后缀)<br>释义: 位置;地点","example":"例句: The location is perfect. ｜ 推导: 地点 + 名词化 = 位置,场所"},{"word":"locate","pos":"v.","detail":"构词: 构词: loc(地点) + ate(动词后缀)<br>释义: 定位;找到","example":"例句: Can you locate the error? ｜ 推导: 地点 + 动词化 = 定位,确定位置"},{"word":"allocate","pos":"v.","detail":"构词: 构词: al(向) + loc(安置) + ate<br>释义: 分配;分派","example":"例句: Allocate resources wisely. ｜ 推导: 向 + 安置 + 动词化 = 分配到位置"},{"word":"locality","pos":"n.","detail":"构词: 构词: local + ity(名词后缀)<br>释义: 地区;地点","example":"例句: Each locality has its charm."},{"word":"locomotive","pos":"n.","detail":"构词: 构词: loco(移动) + motive(动力)<br>释义: 机车;火车头","example":"例句: The locomotive pulled the train. ｜ 推导: 移动位置 + 动力 = 移动的机械,机车"}],"extra":["relocate v. 搬迁（构词: re(重新) + loc + ate）","dislocate v. 使脱臼（构词: dis(离开) + loc + ate）","localize v. 使局部化（构词: loc + al + ize）","locus n. 地点;轨迹（构词: loc + us）"]},{"id":58,"root":"numer-","pronounce":"/ˈnjuːmər/恩耶乌姆儿","source":"拉丁语 numerus","meaning":"数字,计数","mnemonic":"numer与小学词number形近音近。number 就是数字；把一个个 number 数出来，就是计数。所以numer就是“数字、计数”。","mainWords":[{"word":"number","pos":"n.","detail":"构词: 构词: numer(数字)<br>释义: 数字;数量","example":"例句: A large number of students came. ｜ 推导: 数字 = 数字,数量"},{"word":"numerous","pos":"a.","detail":"构词: 构词: numer(数字) + ous(形容词后缀)<br>释义: 众多的","example":"例句: She has numerous friends. ｜ 推导: 数字 + 形容词化 = 数量大的,众多的"},{"word":"numerical","pos":"a.","detail":"构词: 构词: numer(数字) + ical(形容词后缀)<br>释义: 数值的","example":"例句: Put them in numerical order. ｜ 推导: 数字 + 形容词化 = 与数字相关的"},{"word":"innumerable","pos":"a.","detail":"构词: 构词: in(不) + numer + able(能...的)<br>释义: 无数的","example":"例句: Stars are innumerable. ｜ 推导: 不 + 数字 + 能够的 = 无法计数的"}],"extra":["numeral n. 数字 a.数字的（构词: numer + al）","enumerate v. 列举;计算（构词: e(出) + numer + ate）","numerator n. 分子（构词: numer + ator(人/物)）","numerology n. 数字命理学（构词: numer + ology）","numeric a. 数字的（构词: numer + ic）","numeration n. 计算;编号（构词: numer + ation）"]},{"id":59,"root":"part-","pronounce":"/pɑːrt/普啊儿特","source":"拉丁语 partire；拉丁语 pars","meaning":"分离,分开；部分,组成","mnemonic":"part 就是我们小学学过的词part，意为“部分”因此part作为词根的时候也是“部分”的意思。","mainWords":[{"word":"apart","pos":"ad.","detail":"构词: 构词: a(强调) + part(分离)<br>释义: 分离;分开","example":"例句: They live apart from each other. ｜ 推导: 强调 + 分离 = 分开地,分离地"},{"word":"depart","pos":"v.","detail":"构词: 构词: de(离开) + part(分离)<br>释义: 离开;启程","example":"例句: The train departs at 8 a.m. ｜ 推导: 离开 + 分离 = 离开,出发"},{"word":"departure","pos":"n.","detail":"构词: 构词: depart + ure(名词后缀)<br>释义: 离开;启程","example":"例句: Check the departure time. ｜ 推导: 离开 + 名词化 = 离开的行为,启程"},{"word":"apartment","pos":"n.","detail":"构词: 构词: apart + ment(名词后缀)<br>释义: 公寓","example":"例句: She lives in a small apartment. ｜ 推导: 分离 + 名词化 = 分隔的房间,公寓"},{"word":"department","pos":"n.","detail":"构词: 构词: depart + ment(名词后缀)<br>释义: 部门;系","example":"例句: The English department is here. ｜ 推导: 分离 + 名词化 = 分开管理的部分,部门"},{"word":"compartment","pos":"n.","detail":"构词: 构词: com(共同) + part + ment<br>释义: 隔间","example":"例句: Each train compartment has seats. ｜ 推导: 共同 + 分离 + 名词化 = 共同分隔的空间"},{"word":"impart","pos":"v.","detail":"构词: 构词: im(给予) + part(分离)<br>释义: 传授;给予","example":"例句: Teachers impart knowledge. ｜ 推导: 给予 + 分离 = 分给他人,传授"},{"word":"part","pos":"n.","detail":"构词: 构词: part(部分)<br>释义: 部分;⻆色","example":"例句: This is only part of the story. ｜ 推导: 部分 = 整体的一部分"},{"word":"partly","pos":"ad.","detail":"构词: 构词: part + ly(副词后缀)<br>释义: 部分地","example":"例句: It's partly my fault. ｜ 推导: 部分 + 副词化 = 部分地"},{"word":"partial","pos":"a.","detail":"构词: 构词: part + ial(形容词后缀)<br>释义: 部分的;偏爱的","example":"例句: A partial solution to the problem. ｜ 推导: 部分 + 形容词化 = 部分的"},{"word":"party","pos":"n.","detail":"构词: 构词: part + y(名词后缀)<br>释义: 政党;聚会","example":"例句: Join the birthday party. ｜ 推导: 部分 + 名词化 = 一部分人的集合"},{"word":"particle","pos":"n.","detail":"构词: 构词: part + icle(小)<br>释义: 粒子;微粒","example":"例句: Dust particles in the air. ｜ 推导: 部分 + 小 = 小部分,粒子"},{"word":"particular","pos":"a.","detail":"构词: 构词: part + icular(形容词后缀)<br>释义: 特别的","example":"例句: Pay particular attention to this. ｜ 推导: 部分 + 形容词化 = 特定部分的"},{"word":"participate","pos":"v.","detail":"构词: 构词: part + icip(取) + ate<br>释义: 参与","example":"例句: Everyone can participate. ｜ 推导: 部分 + 取得 = 成为一部分,参与"},{"word":"participant","pos":"n.","detail":"构词: 构词: particip + ant(人)<br>释义: 参与者","example":"例句: All participants must register. ｜ 推导: 参与 + 人 = 参与的人"},{"word":"partner","pos":"n.","detail":"构词: 构词: part + ner(人)<br>释义: 伙伴;搭档","example":"例句: He is my business partner. ｜ 推导: 部分 + 人 = 共享部分的人,伙伴"},{"word":"counterpart","pos":"n.","detail":"构词: 构词: counter(相对) + part<br>释义: 对应物","example":"例句: Meet your counterpart tomorrow. ｜ 推导: 相对 + 部分 = 相对应的部分"}],"extra":[]},{"id":60,"root":"pet-","pronounce":"/pet/普诶特","source":"拉丁语 petere","meaning":"寻求,追求,趋向","mnemonic":"pet本身就是我们小学学过的pet，也就是宠物。宠物会一直跟着主人，主动寻求食物、关注和陪伴，行动方向总是趋向主人。所以pet就是“寻求、追求、趋向”的意思。","mainWords":[{"word":"repeat","pos":"v.","detail":"构词: 构词: re(再次) + pet(追求)<br>释义: 重复 n.重复","example":"例句: Please repeat the question. ｜ 推导: 再次 + 追求 = 再次追求,重复"},{"word":"repeatedly","pos":"ad.","detail":"构词: 构词: re + pet + ed + ly<br>释义: 反复地","example":"例句: She called repeatedly. ｜ 推导: 重复的 + 副词化 = 反复地,多次地"},{"word":"compete","pos":"v.","detail":"构词: 构词: com(共同) + pet(追求) + e<br>释义: 竞争,比赛","example":"例句: Athletes compete for gold medals. ｜ 推导: 共同 + 追求 = 共同追求目标,竞争"},{"word":"competition","pos":"n.","detail":"构词: 构词: compete + ition(名词后缀)<br>释义: 竞争,竞赛","example":"例句: The competition was fierce. ｜ 推导: 竞争 + 名词化 = 竞争行为,竞赛"},{"word":"competitive","pos":"a.","detail":"构词: 构词: compete + itive(形容词后缀)<br>释义: 竞争的","example":"例句: She has a competitive spirit. ｜ 推导: 竞争 + 形容词化 = 好竞争的"},{"word":"appetite","pos":"n.","detail":"构词: 构词: ap(趋向) + pet(寻求) + ite<br>释义: 食欲;欲望","example":"例句: He has a good appetite. ｜ 推导: 趋向 + 寻求 = 寻求食物的欲望"},{"word":"petition","pos":"n.","detail":"构词: 构词: pet(寻求) + ition<br>释义: 请愿书 v.请愿","example":"例句: They signed the petition. ｜ 推导: 寻求 + 名词化 = 寻求支持的文书"},{"word":"repetition","pos":"n.","detail":"构词: 构词: re(再次) + pet + ition<br>释义: 重复","example":"例句: Avoid unnecessary repetition. ｜ 推导: 再次 + 寻求 = 反复寻求相同内容"},{"word":"impetus","pos":"n.","detail":"构词: 构词: im(进入) + pet(追求) + us<br>释义: 动力;推动力","example":""},{"word":"perpetual","pos":"a.","detail":"构词: 构词: per(完全) + pet + ual<br>释义: 永久的;持续的","example":""}],"extra":["competitor n. 竞争者（构词: com + pet + itor）","competent a. 有能力的（构词: com + pet + ent）","repetitive a. 重复的（构词: re + pet + itive）","appetizer n. 开胃菜（构词: ap + pet + izer）"]},{"id":61,"root":"rouse","pronounce":"/raʊz/儿奥兹","source":"古诺尔斯语 rúsa","meaning":"唤醒,激起","mnemonic":"rouse开头的读音像“扰”。闹钟不停打扰，睡着的人就会被唤醒；平静的情绪被外界一扰，也会重新升起来、被激起。所以rouse就是“唤醒、激起”。","mainWords":[{"word":"rouse","pos":"v.","detail":"构词: 构词: rouse(唤醒)<br>释义: 唤醒;激起","example":"例句: The noise roused him from sleep. ｜ 推导: 唤醒 = 使醒来,激起"},{"word":"arouse","pos":"v.","detail":"构词: 构词: a(加强) + rouse(唤醒)<br>释义: 唤醒;激起","example":"例句: Her speech aroused great interest. ｜ 推导: 加强 + 唤醒 = 激起,引起(情感、兴趣等)"}],"extra":["arousal n. 唤醒;激起（构词: a + rous + al）","rousing a. 激动人心的（构词: rous + ing）"]},{"id":62,"root":"sign-","pronounce":"/saɪn/斯爱恩","source":"拉丁语 signum","meaning":"记号,标记","mnemonic":"sign就是“塞印”塞印就是把印章按在空白文件上，进而纸面便会留下一个印记，表示这张纸和其它的纸相比有了某种特殊属性，所以sign就是“记号、标记”的意思。","mainWords":[{"word":"sign","pos":"n.","detail":"构词: 构词: sign(记号)<br>释义: 符号;标志 v.签署","example":"例句: Please sign the document. ｜ 推导: 记号 = 符号,签署"},{"word":"design","pos":"v.","detail":"构词: 构词: de(加强) + sign(标记)<br>释义: 设计 n.设计","example":"例句: She will design a new logo. ｜ 推导: 加强 + 标记 = 绘出标记,设计"},{"word":"assign","pos":"v.","detail":"构词: 构词: as(向) + sign(标记)<br>释义: 分配;指派","example":"例句: Assign tasks to team members. ｜ 推导: 向 + 标记 = 标记归属,分配"},{"word":"assignment","pos":"n.","detail":"构词: 构词: assign + ment(名词后缀)<br>释义: 任务;作业","example":"例句: Complete your assignment on time. ｜ 推导: 分配 + 名词化 = 被分配的任务"},{"word":"signal","pos":"n.","detail":"构词: 构词: sign + al(名词后缀)<br>释义: 信号 v.发信号","example":"例句: The traffic signal turned red. ｜ 推导: 记号 + 名词化 = 传递信息的标记"},{"word":"signature","pos":"n.","detail":"构词: 构词: sign + ature(名词后缀)<br>释义: 签名;署名","example":"例句: Please add your signature here. ｜ 推导: 标记 + 名词化 = 个人专属标记"},{"word":"signify","pos":"v.","detail":"构词: 构词: sign + ify(使)<br>释义: 表示;意味着","example":"例句: Red signifies danger. ｜ 推导: 记号 + 使 = 使成为记号,象征"},{"word":"designate","pos":"v.","detail":"构词: 构词: de(下) + sign + ate<br>释义: 指定;指派","example":"例句: Designate a team leader. ｜ 推导: 下 + 标记 = 标记位置,指定"},{"word":"significant","pos":"a.","detail":"构词: 构词: sign + ific(做) + ant<br>释义: 重要的;有意义的","example":"例句: It's a significant discovery. ｜ 推导: 意义 + 做 + 形容词化 = 有意义的"},{"word":"significance","pos":"n.","detail":"构词: 构词: significant + ce(名词后缀)<br>释义: 重要性;意义","example":"例句: The significance is clear. ｜ 推导: 重要的 + 名词化 = 重要性"},{"word":"resign","pos":"v.","detail":"构词: 构词: re(回) + sign(签署)<br>释义: 辞职;放弃","example":"例句: He decided to resign. ｜ 推导: 回 + 签署 = 签署解除关系"}],"extra":[]},{"id":63,"root":"stingu-","pronounce":"/stɪŋkt/斯提昂克特","source":"拉丁语 stinguere","meaning":"熄灭,扑灭","mnemonic":"stingu就是“使停住”。把正在燃烧的火势使它停住，火就会熄灭；继续把剩余火苗压下去，就是把火扑灭。所以stingu就是“熄灭、扑灭”。","mainWords":[{"word":"extinct","pos":"a.","detail":"构词: 构词: ex(出) + (s)tinct(熄灭)<br>释义: 灭绝的;熄灭的","example":"例句: Dinosaurs are extinct. ｜ 推导: 出去 + 熄灭 = 彻底熄灭的,灭绝的"},{"word":"extinguish","pos":"v.","detail":"构词: 构词: ex(出) + stingu(熄灭) + ish<br>释义: 熄灭;扑灭","example":"例句: Extinguish the fire quickly. ｜ 推导: 出去 + 熄灭 + 动词化 = 扑灭,熄灭"}],"extra":["extinction n. 灭绝;消灭（构词: ex + (s)tinct + ion）","extinguisher n. 灭火器（构词: ex + stingu + ish + er）","distinguish v. 区分;辨别（构词: dis(分开) + stingu + ish)distinguished a.杰出的 (distinguish + ed）","distinguishable a. 可区分的（构词: distinguish + able）","distinct a. 清楚的;明显的（构词: dis + (s)tinct）","distinction n. 区别;差别（构词: dis + (s)tinct + ion）","distinctive a. 有特色的（构词: distinct + ive）","indistinct a. 不清楚的（构词: in(不) + distinct）","instinct n. 本能（构词: in(内) + (s)tinct）"]},{"id":64,"root":"tract-","pronounce":"/trækt/特拉克特","source":"拉丁语 trahere","meaning":"拉,拖,拽","mnemonic":"tract就是tr加act。tr可以补成我们小学学过的train，就是火车；act就是行动。火车一行动，火车头就会拉着后面的车厢一起往前走。因此tract就是“拉、拖、拽”的意思，所以tract就是“拉,拖,拽”的意思。","mainWords":[{"word":"contract","pos":"n.","detail":"构词: 构词: con(共同) + tract(拉)<br>释义: 合同 v.收缩","example":"例句: Sign the contract today. ｜ 推导: 共同 + 拉 = 拉到一起,合同;收缩"},{"word":"attract","pos":"v.","detail":"构词: 构词: at(向) + tract(拉)<br>释义: 吸引","example":"例句: The movie attracts many viewers. ｜ 推导: 向 + 拉 = 向自己拉,吸引"},{"word":"attractive","pos":"a.","detail":"构词: 构词: attract + ive(形容词后缀)<br>释义: 有吸引力的","example":"例句: She has an attractive smile. ｜ 推导: 吸引 + 形容词化 = 有吸引力的"},{"word":"abstract","pos":"a.","detail":"构词: 构词: abs(离开) + tract(拉)<br>释义: 抽象的","example":"例句: Abstract art is hard to understand. ｜ 推导: 离开 + 拉 = 拉离具体,抽象的"},{"word":"distract","pos":"v.","detail":"构词: 构词: dis(分开) + tract(拉)<br>释义: 分心","example":"例句: Don't let noise distract you. ｜ 推导: 分开 + 拉 = 拉开注意力,分心"},{"word":"extract","pos":"v.","detail":"构词: 构词: ex(出) + tract(拉)<br>释义: 提取","example":"例句: Extract juice from oranges. ｜ 推导: 出 + 拉 = 拉出来,提取"},{"word":"subtract","pos":"v.","detail":"构词: 构词: sub(下) + tract(拉)<br>释义: 减去","example":"例句: Subtract 5 from 10. ｜ 推导: 下 + 拉 = 拉下去,减去"},{"word":"tractor","pos":"n.","detail":"构词: 构词: tract(拉) + or(器具)<br>释义: 拖拉机","example":"例句: The farmer drives a tractor. ｜ 推导: 拉 + 器具 = 拉东⻄的机器,拖拉机"}],"extra":[]},{"id":65,"root":"trem-","pronounce":"/trem/特儿诶姆","source":"拉丁语 tremere","meaning":"颤抖,震动","mnemonic":"trem 就是“踹门”，一扇门受到撞击后会不断颤动震动，因此trem就是“颤抖、震动”的意思。","mainWords":[{"word":"tremble","pos":"v./n.","detail":"构词: 构词: trem(颤抖) + ble(动词后缀)<br>释义: 颤抖;发抖","example":"例句: His hands trembled with fear. ｜ 推导: 颤抖 + 动词化 = 颤抖,发抖"},{"word":"tremendous","pos":"a.","detail":"构词: 构词: trem + end(应被) + ous<br>释义: 巨大的;惊人的","example":"例句: It was a tremendous success. ｜ 推导: 颤抖 + 应被...的 = 令人震撼的,巨大的"},
