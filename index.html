就是“黏附”。","mainWords":[{"word":"cohesive","pos":"a.","detail":"构词: 构词: co-(共同) + hes(粘住) + -ive<br>释义: 粘合性的，有结合力的","example":"例句: The team developed into a cohesive unit. ｜ 推导: 各部分共同粘合在一起 = 有结合力的"}],"extra":[]},{"id":860,"root":"","pronounce":"/ˈdʒɒli/吉奥利；/dʒɒl/乔尔","source":"古法语 jolif“欢乐的、愉快的”","meaning":"欢乐、高兴","mnemonic":"方法一：jol就是“joy” 。joy就是高兴、欢乐，joy了就是嗨起来、开心起来。所以jol就是“嗨起来、开心起来、欢乐起来”的意思。方法二：为了记忆，可以把JOL记成“Jump Out, Laugh”。\nJump Out表示高兴得跳起来、冲出来；Laugh表示随后大声笑。\n一个人听到好消息以后，先高兴地跳起来，再忍不住笑，这就是高兴、欢乐和活泼愉快。\n所以jol就是“欢乐、高兴；活泼愉快”的意思。","mainWords":[{"word":"jolly","pos":"a.","detail":"构词: 构词: 古法语 jolif(欢乐的)形成的整体词<br>释义: 欢乐的,高兴的","example":"例句: The guests were in a jolly mood. ｜ 推导: 情绪轻松、快乐而活泼 = 欢乐的、高兴的"}],"extra":[]},{"id":862,"root":"aur-","pronounce":"/ɔːr/奥儿","source":"拉丁语 auris“耳朵”","meaning":"耳、听觉","mnemonic":"aur读起来接近汉语“耳”。 耳朵就是 ear，是听觉器官。 这个声音桥很短，可以直接把 aur 与“耳、听觉”联系起来。 所以aur就是“耳”。","mainWords":[{"word":"aural","pos":"a.","detail":"构词: 构词: aur(耳、听觉) + -al<br>释义: 听觉的，听力的","example":"例句: The test measures aural comprehension. ｜ 推导: 与耳朵和听觉有关 = 听觉的"}],"extra":[]},{"id":863,"root":"cis-/cise-","pronounce":"/sɪz/西兹；/saɪz/斯爱兹","source":"拉丁语 caedere“切” / cisus“切开的”","meaning":"切、缩短；简洁","mnemonic":"cise就是下面这些熟词的首字母组合：C就是cut，I就是it，S就是see，E就是each。 把整体 cut 开以后，就能 see each 个小部分。 cise 表示“切割、删切”。 所以cise就是“切割”。","mainWords":[{"word":"concise","pos":"a.","detail":"构词: 构词: con-(完全、集中) + cise(切)<br>释义: 简明的,简洁的","example":"例句: Her summary was clear and concise. ｜ 推导: 切掉多余内容只保留要点 = 简明的"}],"extra":[]},{"id":864,"root":"am-/ami-","pronounce":"/æm/艾姆；/ˈæmi/艾米","source":"拉丁语 amare“爱” / amicus“朋友”","meaning":"爱、友好","mnemonic":"ami就是“爱米”。一个人真心爱你，就会表现得和蔼可亲、友善和亲切，所以ami就是“和蔼可亲、友善、亲切”的意思。","mainWords":[{"word":"amiable","pos":"a.","detail":"构词: 构词: ami(朋友、爱) + -able<br>释义: 和蔼可亲的，友善的，亲切的","example":"例句: Our new neighbor is friendly and amiable. ｜ 推导: 具有让人愿意亲近的友好品质 = 和蔼可亲的"}],"extra":[]},{"id":866,"root":"feud-/feod-","pronounce":"/fjuːd/夫耶乌德；/fiːɒd/夫衣奥德","source":"中古拉丁语 feodum“封地、采邑”","meaning":"封地、封建","mnemonic":"feud就是“非友”。非友会让人直接想到“不”，所以feud就是“不”的意思。","mainWords":[{"word":"feudal","pos":"a.","detail":"构词: 构词: feud/feod(封地) + -al<br>释义: 封建的;封地的;领地的","example":"例句: The novel describes a feudal society. ｜ 推导: 以封地和等级关系为基础 = 封建的"}],"extra":[]},{"id":868,"root":"still-","pronounce":"/stɪl/斯提勒","source":"拉丁语 stillare“滴下、蒸馏”","meaning":"滴、蒸馏、提炼","mnemonic":"still就是下面这些熟词的首字母组合：S就是small，T就是tick，I就是in，L就是long，L就是line。 一滴一滴的 drop 像 small tick，沿 long line 向下落。 still 表示“滴、滴落”。 所以still就是“滴”。","mainWords":[{"word":"distill","pos":"vt.","detail":"构词: 构词: di-(分开) + still(滴、蒸馏)<br>释义: 蒸馏，用蒸馏法提取；吸取，提炼","example":"例句: The factory distills alcohol from grain. ｜ 推导: 让液体蒸发后分离并滴下 = 蒸馏、提炼"}],"extra":[]},{"id":869,"root":"","pronounce":"/waɪld/乌爱勒德；/bɪˈwɪldə/毕威勒德","source":"古英语 wilde“野外的”及英语 bewilder“使迷失于荒野”","meaning":"荒野、迷失、迷惑","mnemonic":"wild就是“外的”。野生动物和荒野都在人的房屋、城市和农田之外，所以wild就是“外面、野外”的意思。","mainWords":[{"word":"bewilder","pos":"v.","detail":"构词: 构词: be-(使成为) + wild(荒野) + -er<br>释义: 使迷惑,难住","example":"例句: The complex map bewildered the visitors. ｜ 推导: 像在荒野中迷路一样失去方向 = 使迷惑"}],"extra":[]},{"id":870,"root":"pal-/pale-","pronounce":"/pæl/派勒；/peɪl/普诶勒","source":"古法语 apalir“使苍白、使惊恐”","meaning":"苍白；使惊骇","mnemonic":"pal就是“跟”。跟我一起读 嘴巴张开 怕哦 我们都是职业玩家辣 词根结尾的尾辅音 尤其是 l 这种东西 多一个少一个不重要 这俩是同一个词根的两种表达形式 l 多一个少一个不影响发音跟意思 所以 pal 这个词根的意思必然也是 怕哦 譬如考研必考词 appall ap 加强 pall 怕哦 所以pal就是“使惊骇，使恐怖”的意思。所以pal就是“使惊骇，使恐怖”的意思。","mainWords":[{"word":"appal","pos":"v.","detail":"构词: 构词: ap-/ad-(使进入) + pal/pale(苍白)<br>释义: 使惊骇，使恐怖","example":"例句: The scale of the damage appalled us. ｜ 推导: 惊吓得脸色苍白 = 使惊骇"}],"extra":[]},{"id":872,"root":"negr-","pronounce":"/ˈniːɡr/尼格儿；/ˈneɡr/恩诶格儿","source":"西班牙语、葡萄牙语 negro“黑色的”，经英语历史用法形成","meaning":"黑色；历史上指黑人","mnemonic":"negr就是英文旧称Negro的核心部分，过去用来指黑人。为了避免和带有冒犯性的网络说法混在一起，这里只表示它的中性词义：negr表示“黑人”。所以negr就是“黑人”的意思。","mainWords":[{"word":"Negro","pos":"n./a.","detail":"构词: 构词: 西班牙语、葡萄牙语 negro(黑色的)形成的历史英语词<br>释义: 黑人；黑人的（历史用语）","example":"例句: The term Negro is now considered outdated in many contexts. ｜ 推导: 历史上按肤色指称黑人，现代语境多已弃用 = 黑人、黑人的"}],"extra":[]}];

   // ===== 状态管理 =====
    let currentIndex = 0;
    const total = WORDS.length;

    // ===== localStorage 持久化 =====
    const STORAGE_KEY = 'root_memory_status';
    const LAST_INDEX_KEY = 'root_last_index';  // 新增：记录上次位置

    // 从 localStorage 加载记忆状态
    function loadMemoryStore() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            try {
                return JSON.parse(stored);
            } catch (e) {
                console.warn('解析存储数据失败，重新初始化');
                return {};
            }
        }
        return {};
    }

    // 保存记忆状态
    function saveMemoryStore(store) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
    }

    // 保存当前索引到 localStorage
    function saveLastIndex(index) {
        localStorage.setItem(LAST_INDEX_KEY, String(index));
    }

    // 读取上次保存的索引
    function loadLastIndex() {
        const stored = localStorage.getItem(LAST_INDEX_KEY);
        if (stored !== null) {
            const idx = parseInt(stored, 10);
            if (!isNaN(idx) && idx >= 0 && idx < total) {
                return idx;
            }
        }
        return 0; // 默认从第一个开始
    }

    // 初始化
    let memoryStore = loadMemoryStore();
    // 加载上次位置
    const savedIndex = loadLastIndex();
    currentIndex = savedIndex;

            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')

            'adv.': 'ad（副词）', 'ad.': 'ad（副词）', 'adj.': 'a（形容词）',
            'a.': 'a（形容词）', 'n.': 'n（名词）', 'v.': 'v（动词）',
            'vt.': 'vt（及物动词）', 'vi.': 'vi（不及物动词）',
            'pron.': 'pron（代词）', 'prep.': 'prep（介词）', 'conj.': 'conj（连词）',
            'num.': 'num（数词）', 'det.': 'det（限定词）', 'aux.': 'aux（助动词）'
        };
        let text = String(pos || '');
        const keys = Object.keys(map).sort((a, b) => b.length - a.length);
        for (const k of keys) {
            const re = new RegExp('(^|[\\s/;,])' + k.replace('.', '\\.') + '(?=($|[\\s/;,]))', 'g');
            text = text.replace(re, (_, pre) => pre + map[k]);
        }
        return text;
    }

    function formatTextPOS(text) {
        let result = String(text || '');
        const map = {
            'adv.': 'ad（副词）', 'ad.': 'ad（副词）', 'adj.': 'a（形容词）',
            'vt.': 'vt（及物动词）', 'vi.': 'vi（不及物动词）', 'v.': 'v（动词）',
            'n.': 'n（名词）', 'a.': 'a（形容词）', 'pron.': 'pron（代词）',
            'prep.': 'prep（介词）', 'conj.': 'conj（连词）', 'num.': 'num（数词）',
            'det.': 'det（限定词）', 'aux.': 'aux（助动词）'
        };
        const keys = Object.keys(map).sort((a, b) => b.length - a.length);
        for (const k of keys) {
            const re = new RegExp('(^|[\\s/;,])' + k.replace('.', '\\.') + '(?=($|[\\s/;,]))', 'g');
            result = result.replace(re, (_, pre) => pre + map[k]);
        }
        return result;
    }

    function renderCard(index) {
        const data = WORDS[index];
        if (!data) return;

        elIndex.textContent = `序号 ${data.id}`;
        elRootLabel.textContent = `词根: ${data.root}`;
        elRootName.textContent = data.root;
        elRootPronounce.textContent = data.pronounce || '';
        elRootSource.textContent = data.source || '';
        elMnemonic.innerHTML = escapeHtml(data.mnemonic).replace(/&lt;br&gt;/gi, '<br>').replace(/\\n/g, '<br>');

        let mainHtml = '';
        data.mainWords.forEach(item => {
            const detailHtml = escapeHtml(formatTextPOS(item.detail || '')).replace(/&lt;br&gt;/gi, '<br>');
            mainHtml += `
              <div class="word-entry">
                <div class="word-title">
                  ${escapeHtml(item.word)}
                  <span class="pos">${escapeHtml(formatPOS(item.pos || ''))}</span>
                </div>
                <div class="word-detail">${detailHtml}</div>
                <div class="example">${escapeHtml(formatTextPOS(item.example || ''))}</div>
              </div>
            `;
        });
        elMainContainer.innerHTML = mainHtml;

        if (data.extra && data.extra.length) {
            const items = data.extra.map(w => `<li>${escapeHtml(formatTextPOS(w))}</li>`).join('');
            elExtraList.innerHTML = items;
        } else {
            elExtraList.innerHTML = '<li style="color:#5a7a5a;">无附加词</li>';
        }

        const display = `${index+1} / ${total}`;
        elProgress.textContent = display;
        elCounter.textContent = display;
        jumpInput.value = index+1;
        prevBtn.disabled = (index === 0);
        nextBtn.disabled = (index === total-1);

        // 进度条
        const pct = ((index+1) / total) * 100;
        elProgressFill.style.width = pct + '%';

        // 更新记忆状态UI
        updateMemoryUI(index);
    }

    function updateMemoryUI(index) {
        const key = WORDS[index].id;
        const level = memoryStore[key] || null;
        memoryBtns.forEach(btn => btn.classList.remove('active'));
        if (level) {
            const btn = document.querySelector(`.memory-btn[data-level="${level}"]`);
            if (btn) btn.classList.add('active');
            const label = { familiar: '熟悉', vague: '模糊', forget: '忘记' }[level] || level;
            memoryStatus.textContent = `当前状态：${label}`;
        } else {
            memoryStatus.textContent = '当前状态：未标记';
        }
    }

    function goTo(index) {
        if (index < 0) index = 0;
        if (index >= total) index = total - 1;
        currentIndex = index;
        renderCard(currentIndex);
        // 每次跳转都保存当前位置
        saveLastIndex(currentIndex);
    }

    // ===== 事件绑定 =====
    prevBtn.addEventListener('click', () => { if (currentIndex > 0) goTo(currentIndex - 1); });
    nextBtn.addEventListener('click', () => { if (currentIndex < total - 1) goTo(currentIndex + 1); });

    jumpBtn.addEventListener('click', () => {
        let val = parseInt(jumpInput.value, 10);
        if (isNaN(val) || val < 1) val = 1;
        if (val > total) val = total;
        goTo(val - 1);
    });
    jumpInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') jumpBtn.click(); });

    // 记忆按钮点击
    memoryBtns.forEach(btn => {
        btn.addEventListener('click', function () {
            const level = this.dataset.level;
            const id = WORDS[currentIndex].id;
            if (memoryStore[id] === level) {
                delete memoryStore[id];
            } else {
                memoryStore[id] = level;
            }
            saveMemoryStore(memoryStore);
            updateMemoryUI(currentIndex);
        });
    });

    // 键盘左右键
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft' && !prevBtn.disabled) prevBtn.click();
        if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
    });

    // ===== 初始化：直接跳转到上次保存的位置 =====
    renderCard(currentIndex);
</script>
</body>
</html>
