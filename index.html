ion)philosophical a.哲学的 (philo + soph + ical）","theosophy n. 神智学（构词: theo(神) + soph + y）","sophomoric a. 一知半解的（构词: sophomor + ic）"]},{"id":223,"root":"source","pronounce":"/sɔːrs/斯奥儿斯","source":"拉丁语 surgere","meaning":"源头,来源","mnemonic":"以后看到source，可以直接想象山泉最开始冒水的那个小孔。后面的水流都从这里出来，信息和事物也可以有自己的起点；所以source就是“源头、来源”。","mainWords":[{"word":"source","pos":"n.","detail":"构词: 构词: source(源头)<br>释义: 来源;源头","example":"例句: Cite your sources properly. ｜ 推导: 源头 = 来源,出处"},{"word":"resource","pos":"n.","detail":"构词: 构词: re(反复) + source(源头)<br>释义: 资源;财力","example":"例句: Natural resources are limited. ｜ 推导: 反复 + 源头 = 可反复利用的源头,资源"}],"extra":["resourceful a. 足智多谋的（构词: resource + ful）","outsource v. 外包（构词: out + source）","sourcing n. 采购;寻找货源（构词: source + ing）","open-source a. 开源的（构词: open + source）","resources n. 资源(复数)（构词: resource + s）","sourced a. 有来源的（构词: source + d）","well-sourced a. 来源可靠的（构词: well + source + d）","crowd-source v. 众包（构词: crowd + source）","multi-source a. 多源的（构词: multi + source）","resourcing n. 资源配置（构词: resource + ing）"]},{"id":224,"root":"swar-","pronounce":"/swɔː/斯乌奥","source":"日耳曼语","meaning":"发誓,郑重声明","mnemonic":"SWAR可以记成Say Word And Remember。Say Word就是把承诺郑重说出口，And Remember就是说完以后牢记并遵守。把重要的话公开说出，并承担这句话带来的责任，就是发誓和郑重声明。所以swar就是“发誓、郑重声明”的意思。","mainWords":[{"word":"swear","pos":"v.","detail":"构词: 构词: swar(发誓)<br>释义: 发誓;咒骂","example":"例句: I swear to tell the truth. ｜ 推导: 发誓 = 郑重宣誓,承诺"},{"word":"answer","pos":"v./n.","detail":"构词: 构词: an(对) + swar(誓言)<br>释义: 回答;答案","example":"例句: Please answer my question. ｜ 推导: 对 + 誓言 = 郑重回应,回答"}],"extra":["sworn a. 宣誓过的 (swear的过去分词)","forswear v. 发誓放弃（构词: for + swear）","answerable a. 应负责的（构词: answer + able）","unanswered a. 未回答的（构词: un + answer + ed）","oath n. 誓言;誓约 (同源词)"]},{"id":225,"root":"swe-","pronounce":"/swe/斯乌诶","source":"印欧语*sweid-","meaning":"","mnemonic":"SWE可以记成Skin Water Exits 。\nS是Skin，表示皮肤；W是Water，表示水分；E是Exits，表示向外排出；\n人在运动以后，身体会发热。为了降温，water会从skin向外exit，皮肤因此变湿，排出来的水分就是汗。\n所以swe就是“体液排出”的意思。\n\nSWE也可以记成Skin Water Enters\n\nS是Skin，表示皮肤；W是Water，表示水分；E是Enters，表示进入\n\n身体某处受到刺激或受伤时，water进入skin下面的，原来平的地方就会鼓起来，例如水肿病。\n\n所以swe就是“肿胀、膨胀”的意思。","mainWords":[{"word":"sweat","pos":"n.","detail":"构词: 记忆: SWEAT＝Skin Water Exits After Training<br>释义: 汗水 v.出汗","example":"例句: He was sweating heavily. ｜ 推导: 训练后水分从皮肤排出＝出汗"},{"word":"swell","pos":"v.","detail":"构词: 记忆: SWELL＝Skin Water Enters, Layer Lifts<br>释义: 肿胀;膨胀","example":"例句: Her ankle began to swell. ｜ 推导: 水分进入皮下组织并把表面顶起＝肿胀"},{"word":"sweater","pos":"n.","detail":"构词: 记忆: 穿得很暖容易sweat，因此sweater可以联系毛衣<br>释义: 毛衣","example":"例句: She wore a warm sweater."}],"extra":["sweaty a. 出汗的（构词: sweat + y）","swollen a. 肿胀的 (swell的过去分词)","swelling n. 肿胀（构词: swell + ing）","sweating n. 出汗（构词: sweat + ing）"]},{"id":226,"root":"tech-","pronounce":"/tek/特诶克","source":"希腊语 τέχνη","meaning":"技艺,技巧,手艺","mnemonic":"tech就是“特技”。 特技需要长期练习才能掌握，代表技艺、技巧和手艺。 所以tech就是“技艺、技巧、手艺”。","mainWords":[{"word":"technique","pos":"n.","detail":"构词: 构词: tech(技艺) + nique<br>释义: 技巧;技术","example":"例句: Her painting technique is excellent. ｜ 推导: 技艺 = 具体的技术手法,技巧"},{"word":"technical","pos":"a.","detail":"构词: 构词: tech + nic + al(形容词后缀)<br>释义: 技术的;专业的","example":"例句: This is a technical problem. ｜ 推导: 技艺 + 形容词化 = 与技术相关的"},{"word":"technician","pos":"n.","detail":"构词: 构词: tech + nic + ian(人)<br>释义: 技术员;技师","example":"例句: The technician fixed the machine. ｜ 推导: 技艺 + 人 = 掌握技艺的人,技术员"},{"word":"technology","pos":"n.","detail":"构词: 构词: tech + no + logy(学科)<br>释义: 技术;科技","example":"例句: Technology changes our lives. ｜ 推导: 技艺 + 学科 = 技艺的系统研究,科技"}],"extra":["technological a. 科技的（构词: tech + no + logical）","technocrat n. 技术官僚（构词: tech + no + crat(统治)）","biotechnology n. 生物技术（构词: bio + technology）","nanotechnology n. 纳米技术 (nano + technology","technically ad. 技术上地（构词: technical + ly）","high-tech a. 高科技的（构词: high + tech）","polytechnic n. 理工学院（构词: poly(多) + technic）","pyrotechnic a. 烟火的（构词: pyro(火) + technic）"]},{"id":227,"root":"tūn/town","pronounce":"/taʊn/特奥恩","source":"古英语 tūn","meaning":"围栏、圈地→城镇","mnemonic":"town本身就是小学词“城镇”，拼写和读音都不用变化；它的读音又让人联想到汉字“屯”。人们把住处和土地圈在一起，聚居成一个“屯”，这样的聚居地逐渐发展成 town。所以tūn/town就是“围栏、圈地→城镇”。","mainWords":[{"word":"town","pos":"n.","detail":"构词: 构词: tūn(围栏) → town<br>释义: 市镇;城镇","example":"例句: I grew up in a small town. ｜ 推导: 围栏圈地 → 有围墙的聚居地 → 城镇"},{"word":"downtown","pos":"n./a.","detail":"构词: 构词: down(下方) + town<br>释义: 市中心;闹市区","example":"例句: Let's go downtown for shopping. ｜ 推导: 下方 + 城镇 = 地势低处的商业区 → 市中心"}],"extra":["hometown n. 家乡（构词: home + town）","uptown n./a. 住宅区（构词: up + town）","townhouse n. 联排别墅（构词: town + house）","township n. 镇区（构词: town + ship）","townspeople n. 镇民（构词: town + people）","midtown n. 市中心区（构词: mid + town）","Chinatown n. 唐人街（构词: China + town）","Georgetown n. 乔治城（构词: George + town）","townsfolk n. 镇民（构词: town + folk）","townsman n. 市民（构词: town + man）"]},{"id":228,"root":"vis-/vid-","pronounce":"/vɪs/五衣斯","source":"拉丁语 videre","meaning":"看,视觉","mnemonic":"①vid我们在小学词 video 中见过：video 的开头完整保留 vid，视频就是给人看的画面，所以 vid 表示“看、视觉”。②vis是同一词根的近形变体。所以vis/vid就是“看、视觉”。","mainWords":[{"word":"vision","pos":"n.","detail":"构词: 构词: vis(看) + ion(名词后缀)<br>释义: 视力;视野;想象","example":"例句: She has perfect vision. ｜ 推导: 看 + 名词化 = 看的能力,视力"},{"word":"visual","pos":"a.","detail":"构词: 构词: vis(看) + ual(形容词后缀)<br>释义: 视觉的;看得见的","example":"例句: Visual arts are popular. ｜ 推导: 看 + 形容词化 = 与看相关的,视觉的"},{"word":"visible","pos":"a.","detail":"构词: 构词: vis(看) + ible(可...的)<br>释义: 可见的;明显的","example":"例句: The stars are visible tonight. ｜ 推导: 看 + 可...的 = 可以看见的"},{"word":"invisible","pos":"a.","detail":"构词: 构词: in(不) + visible<br>释义: 看不见的","example":"例句: Air is invisible to us. ｜ 推导: 不 + 可见的 = 看不见的"},{"word":"visit","pos":"v.","detail":"构词: 构词: vis(看) + it(去)<br>释义: 访问;参观 n.访问","example":"例句: I will visit my parents. ｜ 推导: 看 + 去 = 去看,访问"},{"word":"visitor","pos":"n.","detail":"构词: 构词: visit + or(人)<br>释义: 访问者;游客","example":"例句: The museum has many visitors. ｜ 推导: 访问 + 人 = 访问的人,访客"},{"word":"visa","pos":"n.","detail":"构词: 构词: vis(看) + a<br>释义: 签证","example":"例句: Apply for a tourist visa. ｜ 推导: 看 + 名词化 = 被审看的文件,签证"},{"word":"supervise","pos":"v.","detail":"构词: 构词: super(上) + vis(看) + e<br>释义: 监督;管理","example":"例句: She supervises the project. ｜ 推导: 从上 + 看 = 从上面看着,监督"},{"word":"revise","pos":"v.","detail":"构词: 构词: re(再) + vis(看) + e<br>释义: 修订;复习","example":""},{"word":"envisage","pos":"v.","detail":"构词: 构词: en(使) + vis(看) + age<br>释义: 设想;展望","example":""},{"word":"advise","pos":"v.","detail":"构词: 构词: ad(向) + vis(看) + e<br>释义: 建议;劝告","example":"例句: I advise you to study hard. ｜ 推导: 向 + 看 = 提供见解,建议"},{"word":"advisable","pos":"a.","detail":"构词: 构词: advise + able(可...的)<br>释义: 明智的;可取的","example":"例句: It's advisable to book early. ｜ 推导: 建议 + 可...的 = 值得建议的,明智的"},{"word":"provision","pos":"n.","detail":"构词: 构词: pro(预先) + vis(看) + ion<br>释义: 供应;规定","example":"例句: Make provision for the future. ｜ 推导: 预先 + 看 = 预见需要而准备,供应"}],"extra":[]},{"id":229,"root":"volt","pronounce":"/vəʊlt/五欧勒特","source":"Alessandro Volta","meaning":"电学单位","mnemonic":"volt就是我们平时说的“伏特”。 伏特是表示电压的电学单位。 所以volt就是“电学单位”。","mainWords":[{"word":"volt","pos":"n.","detail":"构词: 构词: Volta(人名)<br>释义: 伏特","example":"例句: The battery produces 9 volts. ｜ 推导: 电压单位,源自发明者姓氏"},{"word":"voltage","pos":"n.","detail":"构词: 构词: volt + age(状态后缀)<br>释义: 电压","example":"例句: Check the voltage before use. ｜ 推导: 伏特 + 状态 = 电压值,电势差"}],"extra":["millivolt n. 毫伏（构词: milli(千分之一) + volt）","kilovolt n. 千伏（构词: kilo(千) + volt）","voltmeter n. 电压表（构词: volt + meter(测量器)）","voltaic a. 伏打的;电流的（构词: Volta + ic）","megavolt n. 兆伏（构词: mega(百万) + volt）"]},{"id":230,"root":"war","pronounce":"/wɔːr/乌奥儿","source":"古诺尔斯语 werr","meaning":"战争,武装冲突","mnemonic":"war就是交战时冲锋者发出的“哇——”喊声。 双方随后武装冲突，就形成战争。 所以war就是“战争、武装冲突”。","mainWords":[{"word":"war","pos":"n.","detail":"构词: 构词: war(战争)<br>释义: 战争;冲突","example":"例句: War broke out between nations. ｜ 推导: 战争 = 武装冲突,战争状态"},{"word":"warfare","pos":"n.","detail":"构词: 构词: war + fare(行进)<br>释义: 战争;作战","example":"例句: Modern warfare uses technology. ｜ 推导: 战争 + 行进 = 进行战争的方式"},{"word":"warrior","pos":"n.","detail":"构词: 构词: war + rior(人)<br>释义: 战士;勇士","example":"例句: The warrior fought bravely. ｜ 推导: 战争 + 人 = 参与战争的人,战士"}],"extra":["warlike a. 好战的（构词: war + like）","wartime n. 战时（构词: war + time）"]},{"id":231,"root":"ware","pronounce":"/weər/乌艾儿儿","source":"古英语 waru","meaning":"制造品,商品,器具","mnemonic":"方法一： ware就是“碗儿”。碗是人制造出来的器具，也可以作为商品摆在店里出售；由一只碗儿，就能联想到制造品、商品和器具。所以ware就是“制造品、商品、器具”。 方法二： ware就是我们平时说的“瓦儿”。 瓦儿是烧制出来的器皿，可以代表制造品、商品和器具。 所以ware就是“制造品、商品、器具”。","mainWords":[{"word":"software","pos":"n.","detail":"构词: 构词: soft(软) + ware(器具)<br>释义: 软件","example":"例句: Install the software first. ｜ 推导: 软的 + 器具 = 软件,非物理形态的程序"},{"word":"hardware","pos":"n.","detail":"构词: 构词: hard(硬) + ware(器具)<br>释义: 硬件;五金器具","example":"例句: The hardware needs upgrading. ｜ 推导: 硬的 + 器具 = 硬件,物理形态的器具"},{"word":"warehouse","pos":"n.","detail":"构词: 构词: ware(商品) + house(房屋)<br>释义: 仓库","example":"例句: Store goods in the warehouse. ｜ 推导: 商品 + 房屋 = 存放商品的地方,仓库"}],"extra":["glassware n. 玻璃器皿（构词: glass + ware）","tableware n. 餐具（构词: table + ware）","kitchenware n. 厨房用具（构词: kitchen + ware）","silverware n. 银器（构词: silver + ware）"]},{"id":232,"root":"war- (wær)","pronounce":"/wɛə/乌诶额","source":"古英语 wær","meaning":"警觉的,察觉的","mnemonic":"war- (wær)本身就是我们小学学过的war。战争中人必须时刻戒备，随时察觉周围的危险，所以war- (wær)就是“警觉的,察觉的”的意思。","mainWords":[{"word":"beware","pos":"v.","detail":"构词: 构词: be(保持) + war(警觉) + e<br>释义: 当心,小心","example":"例句: Beware of the dog! ｜ 推导: 保持 + 警觉 = 当心,提防"},{"word":"aware","pos":"a.","detail":"构词: 构词: a(强调) + war(察觉) + e<br>释义: 意识到的,知道的","example":"例句: I'm aware of the problem. ｜ 推导: 强调 + 察觉 = 意识到的,察觉的"},{"word":"warn","pos":"v.","detail":"构词: 构词: war(警觉) + n<br>释义: 警告,提醒","example":"例句: I warned him about the danger. ｜ 推导: 警觉 + 动词化 = 使人警觉,警告"},{"word":"guard","pos":"v./n.","detail":"构词: 构词: g(变体) + uard(=ward守护)<br>释义: 保卫,守卫","example":"例句: The guard is on duty. ｜ 推导: 守护 = 保持警觉的守卫"},{"word":"warrant","pos":"n.正当理由;许可证,委任状","detail":"构词: 构词: war + -ant(执行动作的人或具有某性质的)<br>释义: v.保证,担保","example":"推导: 核心词根「war- (wær)」表示“警觉的,察觉的”，结合前后缀，可推出“n.正当理由;许可证,委任状 v.保证,担保”"}],"extra":["awareness n. 意识,察觉（构词: aware + ness）","unaware a. 未察觉的（构词: un + aware）","wary a. 小心的,警惕的（构词: war + y）","warning n. 警告（构词: warn + ing）","ward v. 保卫,守护;n.病房","warden n. 看守,管理员（构词: ward + en）","wariness n. 谨慎,小心（构词: wary + ness）","guardian n. 监护人（构词: guard + ian）","safeguard v./n. 保护,保卫（构词: safe + guard）","forewarned a. 预先警告的（构词: fore + warn + ed）"]},{"id":233,"root":"ante-","pronounce":"/ˈænti/艾恩特衣","source":"拉丁语 ante","meaning":"在...之前","mnemonic":"ante就是“俺提前”。 俺提前到达，就处在别人之前。 所以ante就是“在...之前”。","mainWords":[{"word":"antique","pos":"n.","detail":"构词: 构词: ante(之前) + ique(形容词后缀)<br>释义: 古董 a.古式的","example":"例句: This antique vase is valuable. ｜ 推导: 之前 + 形容词化 = 以前时代的,古董"},{"word":"ancient","pos":"a.","detail":"构词: 构词: anci(=ante) + ent(形容词后缀)<br>释义: 古代的,古老的","example":"例句: Ancient civilizations fascinate us. ｜ 推导: 之前 + 形容词化 = 很早之前的,古老的"}],"extra":["anterior a. 前面的（构词: ante + ior(更...的)）","antecedent n. 先例（构词: ante + ced(走) + ent）","antedate v. 先于（构词: ante + date）","anteroom n. 前厅（构词: ante + room）","antechamber n. 前室（构词: ante + chamber）","anticipate v. 预期（构词: anti(=ante) + cip(拿) + ate）","antiquity n. 古代（构词: antiqu + ity）","antiquated a. 过时的（构词: antiqu + ated）"]},{"id":234,"root":"baggi","pronounce":"/bæg/拜格","source":"古诺尔斯语","meaning":"包裹,包袱","mnemonic":"baggi就是“bag”。bag就是“袋，提包”，其中最关键的意思可以继续联系到“包裹”，由这个意思还可以继续推出包袱，所以baggi就是“包裹,包袱”的意思。","mainWords":[{"word":"bag","pos":"n.","detail":"构词: 构词: baggi(包裹)<br>释义: 袋子,包","example":"例句: She carried a designer bag. ｜ 推导: 包裹 = 袋子,包"},{"word":"baggage","pos":"n.","detail":"构词: 构词: bag + age(集合后缀)<br>释义: 行李","example":"例句: Check your baggage at the airport. ｜ 推导: 包 + 集合 = 多个包的集合,行李"}],"extra":["handbag n. 手提包（构词: hand + bag）","airbag n. 安全气囊（构词: air + bag）","backpack n. 背包（构词: back + pack）","luggage n. 行李 (同义词)","bagged a. 袋装的（构词: bag + ed）","bagger n. 装袋工（构词: bag + er）","shopping bag 购物袋","garbage bag 垃圾袋","sleeping bag 睡袋","tea bag 茶包"]},{"id":235,"root":"cast-","pronounce":"/kæst/卡斯特","source":"古诺斯语 kasta","meaning":"投掷,抛出","mnemonic":"cast就是“cast”。cast会让人直接想到“投掷”，由这个意思还可以继续推出抛出，所以cast就是“投掷,抛出”的意思。","mainWords":[{"word":"cast","pos":"v.","detail":"构词: 构词: cast(投掷)<br>释义: 投掷;铸造","example":"例句: Cast your vote in the election. ｜ 推导: 投掷 = 投出,抛出,铸造"},{"word":"broadcast","pos":"v./n.","detail":"构词: 构词: broad(广泛) + cast(投掷)<br>释义: 广播","example":"例句: The news was broadcast worldwide. ｜ 推导: 广泛 + 投掷 = 向四处播送,广播"},{"word":"forecast","pos":"v./n.","detail":"构词: 构词: fore(之前) + cast(投掷)<br>释义: 预报;预测","example":"例句: They forecast rain for tomorrow. ｜ 推导: 向前 + 投掷 = 向前预测,预报"}],"extra":["telecast n./v. 电视广播（构词: tele(远) + cast）","outcast n. 被驱逐者（构词: out(出) + cast）","overcast a. 阴天的（构词: over(覆盖) + cast）","podcast n. 播客（构词: pod + cast）"]},{"id":236,"root":"caut-","pronounce":"/kɔːt/考特","source":"拉丁语 cavēre","meaning":"小心,警惕","mnemonic":"方法一：caut就是“靠停”。 遇到危险先靠边停下并仔细观察，就是小心和警惕。 所以caut就是“小心、警惕”。方法二：了记忆，可以把CAUT记成“Care Around, Until safe, Then move”。\n\nCare Around表示先留心四周；Until safe表示一直确认到环境安全；Then move表示确认安全以后再行动。\n\n过马路、操作机器或进入陌生环境时，先观察、确认，再行动，就是小心、警惕和预防。人物、环境和动作始终保持一致。\n\n所以caut就是“小心、警惕、预防”的意思。","mainWords":[{"word":"caution","pos":"n.","detail":"构词: 构词: caut(警惕) + ion(名词后缀)<br>释义: 小心;警告 v.警告","example":"例句: Exercise caution when driving. ｜ 推导: 警惕 + 名词化 = 警惕行为,小心"},{"word":"cautious","pos":"a.","detail":"构词: 构词: caut(警惕) + ious(形容词后缀)<br>释义: 谨慎的,小心的","example":"例句: Be cautious about investments. ｜ 推导: 警惕 + 形容词化 = 保持警惕的,谨慎的"},{"word":"precaution","pos":"n.","detail":"构词: 构词: pre(预先) + caut(警惕) + ion<br>释义: 预防措施","example":"例句: Take precautions against fire. ｜ 推导: 预先 + 警惕 = 提前防备,预防措施"}],"extra":["cautiously ad. 谨慎地（构词: caut + ious + ly）","incautious a. 不谨慎的（构词: in + caut + ious）","precautionary a. 预防的（构词: pre + caut + ionary）","overcautious a. 过分谨慎的（构词: over + caut + ious）"]},{"id":237,"root":"cigar","pronounce":"/sɪˈɡɑːr/西格啊儿","source":"玛雅语 sik'ar","meaning":"烟草,抽烟","mnemonic":"cigar就是我们平时说的“雪茄”。 雪茄就是一种烟草制品。 所以cigar就是“烟草、抽烟”。","mainWords":[{"word":"cigar","pos":"n.","detail":"构词: 构词: cigar (源自玛雅语)<br>释义: 雪茄烟","example":"例句: He smoked an expensive cigar. ｜ 推导: 烟草 = 雪茄烟"},{"word":"cigarette","pos":"n.","detail":"构词: 构词: cigar + ette(小的)<br>释义: 香烟,纸烟","example":"例句: She quit smoking cigarettes. ｜ 推导: 雪茄 + 小的 = 小雪茄,香烟"}],"extra":["cigarillo n. 小雪茄（构词: cigar + illo(⻄语小词后缀)）","cigaret n. 香烟(旧拼法)（构词: cigar + et）","cigarette holder 烟嘴","cigarette lighter 打火机","cigar box 雪茄盒","cigar cutter 雪茄剪"]},{"id":238,"root":"clar-","pronounce":"/klær/克莱儿","source":"拉丁语 clarus","meaning":"清晰的,明亮的","mnemonic":"clar就是“clear”。clear就是“/d.清晰的vt.清除”，由这个意思还可以继续推出明亮的，所以clar就是“清晰的,明亮的”的意思。","mainWords":[{"word":"declare","pos":"v.","detail":"构词: 构词: de(完全) + clar(清晰) + e<br>释义: 宣布;声明","example":"例句: He declared his intention. ｜ 推导: 完全 + 清晰 = 完全说清楚,宣布"},{"word":"declaration","pos":"n.","detail":"构词: 构词: declare + ation(名词后缀)<br>释义: 宣言;声明","example":"例句: The Declaration of Independence. ｜ 推导: 宣布 + 名词化 = 宣布的文件,宣言"},{"word":"clarify","pos":"v.","detail":"构词: 构词: clar(清晰) + ify(使...化)<br>释义: 澄清;阐明","example":"例句: Please clarify your position. ｜ 推导: 清晰 + 使动 = 使变清晰,澄清"},{"word":"clarity","pos":"n.","detail":"构词: 构词: clar(清晰) + ity(名词后缀)<br>释义: 清晰;明确","example":"例句: The water has perfect clarity. ｜ 推导: 清晰 + 名词化 = 清晰的状态,明晰性"}],"extra":["clear a. 清晰的;明确的 (clar → clear)","clearly ad. 清楚地（构词: clear + ly）","unclear a. 不清楚的（构词: un + clear）","clarification n. 澄清（构词: clarify + ation）","declarative a. 宣告的（构词: declare + ative）","declaratory a. 宣言的（构词: declare + atory）"]},{"id":239,"root":"contra-/contro-/contr-","pronounce":"/ˈkɒntrə/克奥恩特儿额","source":"拉丁语 contra","meaning":"相反,相对,对抗","mnemonic":"contra/contro/contr共同保留了contr。contr可以拆成con和tr。\n\ncon可以补成我们已经学过的connect。connect就是把两个东西连接到同一处。\n\ntr可以补成我们已经学过的train。train就是火车。\n\n想象两列train被connect到同一条track上，却从相反方向开来。它们越靠近，车头就越相对；彼此都挡住对方的路，继续前进就会正面相遇、互相对抗。\n\n所以contr就是“相反、相对、对抗”的意思。\n\ncontra＝contr＋a，contro＝contr＋o。末尾的a和o只帮助形成不同的完整读音和拼写，不另外增加新的方向含义。\n\n综上，contra/contro/contr就是“相反、相对、对抗”的意思。","mainWords":[{"word":"contrast","pos":"n./v.","detail":"构词: 构词: contra(相对) + st(站立)<br>释义: 对比","example":"例句: The contrast is striking. ｜ 推导: 相对 + 站立 = 对立而站,对比"},{"word":"controversy","pos":"n.","detail":"构词: 构词: contro(相对) + vers(转) + y<br>释义: 争议","example":"例句: It caused great controversy. ｜ 推导: 相对 + 转向 = 各执一词,争议"},{"word":"controversial","pos":"a.","detail":"构词: 构词: contro + vers + ial(形容词后缀)<br>释义: 有争议的","example":"例句: A controversial decision. ｜ 推导: 争议 + 形容词化 = 有争议的"},{"word":"contradiction","pos":"n.","detail":"构词: 构词: contra + dict(说) + ion<br>释义: 矛盾","example":"例句: A clear contradiction exists. ｜ 推导: 相对 + 说 = 说相反的话,矛盾"},{"word":"contrary","pos":"a.","detail":"构词: 构词: contra(相对) + ary(形容词后缀)<br>释义: 相反的","example":"例句: On the contrary. ｜ 推导: 相对 + 形容词化 = 相反的"},{"word":"contradict","pos":"v.","detail":"构词: 构词: contra(相对) + dict(说)<br>释义: 反驳","example":"例句: Don't contradict me. ｜ 推导: 相对 + 说 = 说相反的话,反驳"}],"extra":["contravene v. 违反（构词: contra + vene(来)）","contraband n. 违禁品（构词: contra + band）","contraception n. 避孕（构词: contra + cept(抓住)）","contrarian n. 反向投资者（构词: contra + arian）"]},{"id":240,"root":"cop-/copy-","pronounce":"/kɒpi/克奥普衣","source":"拉丁语 copia","meaning":"丰富,副本,复制","mnemonic":"cop/copy直接表示熟词 copy：copy 本身就是复制品。copy machine 把一份原件复制成许多副本，数量也随之变多，所以cop/copy就是“丰富、副本、复制”。","mainWords":[{"word":"copy","pos":"n.","detail":"构词: 构词: copy(副本)<br>释义: 副本 v.复制","example":"例句: Make a copy of this document. ｜ 推导: 副本 = 复制品,抄本"},{"word":"copyright","pos":"n.","detail":"构词: 构词: copy + right(权利)<br>释义: 版权","example":"例句: Protect your copyright. ｜ 推导: 复制 + 权利 = 复制权,版权"}],"extra":["copious a. 丰富的（构词: cop + ious）","photocopy n. 影印本（构词: photo + copy）","copyist n. 抄写员（构词: copy + ist）","cornucopia n. 丰饶⻆（构词: cornu + copia）"]},{"id":241,"root":"corpus","pronounce":"/ˈkɔːpəs/考珀斯","source":"拉丁语 corpus","meaning":"身体,实体","mnemonic":"corpus就是“壳儿包实”。人的皮肤像一层壳，把里面各个部分包得严严实实，形成一个完整的body；一个有完整边界、能独立存在的body，也就是实体。所以corpus就是“身体、实体”的意思。","mainWords":[{"word":"corporation","pos":"n.","detail":"构词: 构词: corpor(身体) + ation(名词后缀)<br>释义: 公司;法人","example":"例句: The corporation employs thousands. ｜ 推导: 身体 + 名词化 = 法律实体,公司"},{"word":"incorporate","pos":"v.","detail":"构词: 构词: in(进入) + corpor + ate(动词后缀)<br>释义: 合并;组成公司","example":"例句: They incorporated the business. ｜ 推导: 进入 + 身体 + 动词化 = 使成为一体,合并"}],"extra":["corporate a. 公司的;法人的（构词: corpor + ate）","corpse n. 尸体（构词: corps + e）","corps n. 军团;团体 (corps)","corporal a. 肉体的;身体的（构词: corpor + al）","incorporated a. 合并的;公司的 (incorporate + d) incorporation n.合并;公司成立 (incorporate + i","corporeal a. 有形的;物质的（构词: corpor + eal）","corpulent a. 肥胖的（构词: corp + ulent）","corpus n. 文集;语料库 (corpus)","corpuscle n. 血球;微粒（构词: corpus + cle）"]},{"id":242,"root":"danger","pronounce":"/ˈdeɪndʒər/德诶恩吉额儿","source":"古法语 dangier","meaning":"权力→威胁→危险","mnemonic":"danger可以记成“挡着”。 想象前方有人凭借 power 挡着你，不让你通过，还随时可能伤害你。对方能够控制你的行动，就形成了 threat；继续靠近，就会有危险。 所以以后看到 danger，就想到“有危险的人或物挡着路”。 所以danger就是“威胁、危险”。","mainWords":[{"word":"danger","pos":"n.","detail":"构词: 构词: danger(威胁的权力)<br>释义: 危险","example":"例句: He is in great danger. ｜ 推导: 权威威胁 → 危险"},{"word":"dangerous","pos":"a.","detail":"构词: 构词: danger + ous(充满...的)<br>释义: 危险的","example":"例句: It's dangerous to drive fast. ｜ 推导: 危险 + 充满 = 危险的"}],"extra":["endanger v. 危及（构词: en(使) + danger）","dangerously ad. 危险地（构词: danger + ously）","endangered a. 濒危的（构词: en + danger + ed）","endangerment n. 危害（构词: en + danger + ment）"]},{"id":243,"root":"down","pronounce":"/daʊn/德奥恩","source":"古英语 dūn (山丘)","meaning":"向下,从高到低","mnemonic":"down本身就是我们小学学过的down。 down 就是“向下、向下的”。 所以down就是“向下、从高到低”。","mainWords":[{"word":"down","pos":"ad.","detail":"构词: 构词: down(向下)<br>释义: 向下 a.向下的","example":"例句: Please sit down. ｜ 推导: 向下 = 从高处到低处的方向"},{"word":"downstairs","pos":"ad.","detail":"构词: 构词: down + stairs(楼梯)<br>释义: 在楼下","example":"例句: He went downstairs. ｜ 推导: 向下 + 楼梯 = 楼梯下方,楼下"},{"word":"downward","pos":"a.","detail":"构词: 构词: down + ward(方向后缀)<br>释义: 向下的 ad.向下","example":"例句: The trend is downward. ｜ 推导: 向下 + 方向 = 朝下的方向"},{"word":"breakdown","pos":"n.","detail":"构词: 构词: break(破) + down(垮下)<br>释义: 崩溃;故障","example":"例句: The car had a breakdown. ｜ 推导: 破 + 垮下 = 崩溃,故障"},{"word":"downtown","pos":"n.","detail":"构词: 构词: down + town(城镇)<br>释义: 市中心 ad.在市中心","example":"例句: Let's go downtown. ｜ 推导: 下 + 城 = 下城区,市中心"}],"extra":["download v. 下载（构词: down + load）","downfall n. 垮台（构词: down + fall）","downturn n. 衰退（构词: down + turn）","downgrade v. 降级（构词: down + grade）"]},{"id":244,"root":"grat-","pronounce":"/græt/格拉特","source":"拉丁语 gratus","meaning":"令人愉悦的,感恩的","mnemonic":"grat与小学词 great 形近音近。遇到 great 的好事，人会感到愉悦；别人给了自己很大的帮助，也会由这种好感产生感恩。所以grat就是“令人愉悦的、感恩的”。","mainWords":[{"word":"grateful","pos":"a.","detail":"构词: 构词: grat(感恩) + ful(充满...的)<br>释义: 感激的","example":"例句: I'm grateful for your help. ｜ 推导: 感恩 + 充满 = 充满感恩的,感激的"},{"word":"gratitude","pos":"n.","detail":"构词: 构词: grat(感恩) + itude(状态后缀)<br>释义: 感激之情","example":"例句: He expressed his gratitude. ｜ 推导: 感恩 + 状态 = 感恩的状态,感激之情"},{"word":"congratulate","pos":"v.","detail":"构词: 构词: con(共同) + grat(愉悦) + ulate<br>释义: 祝贺","example":"例句: Congratulate you on your success. ｜ 推导: 共同 + 愉悦 = 为他人的喜事共同欢喜"},{"word":"congratulation","pos":"n.","detail":"构词: 构词: congratulate + ion(名词后缀)<br>释义: 祝贺","example":"例句: Accept my congratulations! ｜ 推导: 祝贺 + 名词化 = 祝贺的行为或话语"}],"extra":["grace n. 优雅;恩典 (grat的变体)","graceful a. 优雅的（构词: grace + ful）","gracious a. 亲切的;仁慈的（构词: grace + ious）","ingratitude n. 忘恩负义（构词: in(否定) + gratitude）","ungrateful a. 不感恩的（构词: un + grateful）","gratify v. 使满足（构词: grat + ify）","gratification n. 满足(gratify + cation)","gratis ad. 免费地(grat + is)"]},{"id":245,"root":"height","pronounce":"/haɪt/赫爱特","source":"古英语 hēah","meaning":"高,高度","mnemonic":"height与小学词high共享 h、i、gh 这组核心字母和读音。high 是高的；把“到底有多高”变成一个可以测量的数，就是高度。所以height就是“高、高度”。","mainWords":[{"word":"height","pos":"n.","detail":"构词: 构词: heigh(高) + t<br>释义: 高度;身高;高处","example":"例句: The height of the mountain is impressive. ｜ 推导: 高 + 名词化 = 高的状态,高度"},{"word":"heighten","pos":"v.","detail":"构词: 构词: height(高度) + en(使...化)<br>释义: 提高;增强","example":"例句: The crisis heightened tensions. ｜ 推导: 高度 + 动词化 = 使变高,提高"}],"extra":["heights n. 高地;极点（构词: height + s）","high a. 高的 (同源词)","highly ad. 高度地;非常（构词: high + ly）","higher a. 更高的（构词: high + er）"]},{"id":246,"root":"jus-/jur-","pronounce":"/dʒʌs/吉阿斯","source":"拉丁语 ius/iuris","meaning":"法律,权利,公正","mnemonic":"方法一：\njus可以从just中看出来。just＝jus＋t，just就是公正、正当；末尾t只把单词收音，不另外增加“公正”以外的新意思，所以jus就是“公正、法律”。\n\n方法二：\nJUR可以记成Just Use Rule。Just是公正，Use是使用，Rule是规则。公正地使用规则，就是依法判断是非、保护每个人的权利。所以jur就是“法律、权利、公正”。\n\n综上，jus/jur就是“法律、权利、公正”的意思。","mainWords":[{"word":"just","pos":"a.","detail":"构词: 构词: just(公正)<br>释义: 公正的","example":"例句: It's just not fair. ｜ 推导: 公正的,正当的"},{"word":"justice","pos":"n.","detail":"构词: 构词: just(公正) + ice(名词后缀)<br>释义: 正义;司法","example":"例句: Justice must be served. ｜ 推导: 公正 + 名词化 = 正义,司法"},{"word":"justify","pos":"v.","detail":"构词: 构词: just(公正) + ify(动词后缀)<br>释义: 证明正当","example":"例句: Can you justify your actions? ｜ 推导: 公正 + 动词化 = 使正当,证明合理"},{"word":"adjust","pos":"v.","detail":"构词: 构词: ad(向) + just(公正)<br>释义: 调整;适应","example":"例句: Adjust the settings carefully. ｜ 推导: 向 + 公正 = 使公正合理,调整"},{"word":"judge","pos":"n.","detail":"构词: 构词: jud(=jus法律) + ge<br>释义: 法官 v.判断","example":"例句: The judge made a fair decision. ｜ 推导: 法律 + 人 = 执法者,法官"},{"word":"judgement","pos":"n.","detail":"构词: 构词: judge + ment(名词后缀)<br>释义: 判断;判决","example":"例句: Trust your own judgement. ｜ 推导: 判断 + 名词化 = 判断力,判决"},{"word":"judicial","pos":"a.","detail":"构词: 构词: jud(法律) + icial(形容词后缀)<br>释义: 司法的","example":"例句: The judicial system needs reform. ｜ 推导: 法律 + 形容词化 = 司法的,审判的"},{"word":"prejudice","pos":"n.","detail":"构词: 构词: pre(预先) + jud + ice<br>释义: 偏见","example":"例句: Don't let prejudice blind you. ｜ 推导: 预先 + 判断 = 先入为主的判断,偏见"},{"word":"jury","pos":"n.","detail":"构词: 构词: jur(法律) + y<br>释义: 陪审团","example":""},{"word":"injure","pos":"v.","detail":"构词: 构词: in(不) + jur(权利) + e<br>释义: 伤害;损害","example":""},{"word":"injury","pos":"n.","detail":"构词: 构词: in + jur + y(名词后缀)<br>释义: 伤害;损伤","example":"例句: He suffered a serious injury. ｜ 推导: 伤害 + 名词化 = 伤害,损伤"}],"extra":[]},{"id":247,"root":"mand-","pronounce":"/mænd/麦恩德","source":"拉丁语 mandare","meaning":"交付,委托,命令","mnemonic":"mand就是“命单”。把任务写成一张命令单，再交到别人手里，就是交付；让别人替自己完成，就是委托；要求对方必须照单执行，就是命令。所以mand就是“交付、委托、命令”。","mainWords":[{"word":"command","pos":"v.","detail":"构词: 构词: com(完全) + mand(交付)<br>释义: 命令;指挥","example":"例句: The general commands the army. ｜ 推导: 完全 + 交付 = 完全交付任务,命令"},{"word":"demand","pos":"v.","detail":"构词: 构词: de(强调) + mand(交付)<br>释义: 要求 n.需求","example":"例句: The market demands quality. ｜ 推导: 强调 + 交付 = 强烈要求交付,需求"},{"word":"commend","pos":"v.","detail":"构词: 构词: com(加强) + mend(交付)<br>释义: 表扬;推荐","example":"例句: I commend her for her work. ｜ 推导: 加强 + 交付 = 交付时称赞,表扬"},{"word":"recommend","pos":"v.","detail":"构词: 构词: re(再次) + com + mend<br>释义: 推荐","example":"例句: I recommend this book highly. ｜ 推导: 再次 + 表扬 = 反复担保,推荐"}],"extra":["commander n. 指挥官（构词: command + er）","mandate n. 授权;命令（构词: mand + ate）","mandatory a. 强制的（构词: mand + atory）","commandment n. 戒律（构词: command + ment）","countermand v. 撤销命令（构词: counter + mand）","remand v. 发回重审（构词: re + mand）"]},{"id":248,"root":"mend","pronounce":"/mend/姆诶恩德","source":"拉丁语 menda","meaning":"修补,修正","mnemonic":"mend就是“门钉”。门坏了，就用钉子把松开的地方重新钉好；把破损处补好是修补，把不正确的地方改好是修正。所以mend就是“修补、修正”。","mainWords":[{"word":"mend","pos":"v.","detail":"构词: 构词: mend(修补)<br>释义: 修理;修补;改进","example":"例句: Can you mend this shirt? ｜ 推导: 修补 = 修理,修补"},{"word":"amend","pos":"v.","detail":"构词: 构词: a(朝向) + mend(修正)<br>释义: 修改;修正","example":"例句: They voted to amend the law. ｜ 推导: 朝向 + 修正 = 使更好,修正"}],"extra":["amendment n. 修正案;修改（构词: amend + ment）","emend v. 校正;修订（构词: e(出) + mend）","mendable a. 可修补的（构词: mend + able）","mending n. 修补工作（构词: mend + ing）","commend v. 推荐;赞扬（构词: com(共同) + mend）","recommend v. 推荐（构词: re(再) + commend）"]},{"id":249,"root":"mere","pronounce":"/mɪə(r)/米额儿","source":"拉丁语 merus","meaning":"纯粹的,仅仅","mnemonic":"mere就是“米儿只有白米”。 碗里只有白米，没有别的东西，就体现纯粹和仅仅。 所以mere就是“纯粹的、仅仅”。","mainWords":[{"word":"mere","pos":"a.","detail":"构词: 构词: mere(纯粹的)<br>释义: 仅仅的;纯粹的","example":"例句: It's a mere coincidence. ｜ 推导: 纯粹的 = 仅仅是,只不过是"},{"word":"merely","pos":"ad.","detail":"构词: 构词: mere + ly(副词后缀)<br>释义: 仅仅;只不过","example":"例句: I'm merely stating the facts. ｜ 推导: 仅仅 + 副词化 = 仅仅地,只不过"}],"extra":["merest a. 最微小的（构词: mere + est(最高级)）","meretricious a. 华而不实的（构词: mere + tricious）"]},{"id":250,"root":"mix-","pronounce":"/mɪks/米克斯","source":"拉丁语 miscēre","meaning":"混合,融合","mnemonic":"mix就是小学学过的单词，拼写和读音都不用变化。mix 是把不同东西混合、融合在一起，所以mix就是“混合、融合”。","mainWords":[{"word":"mix","pos":"v.","detail":"构词: 构词: mix(混合)<br>释义: 混合;调配","example":"例句: Mix the ingredients well. ｜ 推导: 混合 = 使不同物质交融"},{"word":"mixture","pos":"n.","detail":"构词: 构词: mix + ture(结果后缀)<br>释义: 混合物;混合","example":"例句: The mixture tastes strange. ｜ 推导: 混合 + 结果 = 混合后的产物"}],"extra":["mixer n. 搅拌器;调酒器（构词: mix + er）","mixing n. 混合;混音（构词: mix + ing）","mixed a. 混合的;混杂的（构词: mix + ed）","remix v./n. 重新混音（构词: re + mix）","unmixed a. 纯粹的（构词: un + mix + ed）","intermix v. 相互混合（构词: inter + mix）"]},{"id":251,"root":"nov-","pronounce":"/nɒv/恩奥五","source":"拉丁语 novus","meaning":"新的,新颖的","mnemonic":"nov与小学词now形近音近。now 是“现在”；刚在现在这一刻出现、过去没有的东西，就是新的、新颖的。所以nov就是“新的、新颖的”。","mainWords":[{"word":"novel","pos":"n.","detail":"构词: 构词: nov(新) + el(名词后缀)<br>释义: 小说 a.新颖的","example":"例句: She wrote a novel approach. ｜ 推导: 新 + 名词化 = 新类型的故事,小说"},{"word":"novelty","pos":"n.","detail":"构词: 构词: novel(新的) + ty(名词后缀)<br>释义: 新颖;新奇事物","example":"例句: The novelty wore off quickly. ｜ 推导: 新的 + 状态 = 新奇的性质,新颖性"},{"word":"innovation","pos":"n.","detail":"构词: 构词: in(进入) + nov(新) + ation<br>释义: 创新;革新","example":"例句: Technology drives innovation. ｜ 推导: 进入 + 新 + 名词化 = 引入新事物,创新"},{"word":"renovate","pos":"v.","detail":"构词: 构词: re(重新) + nov(新) + ate<br>释义: 翻新;修复","example":"例句: They will renovate the building. ｜ 推导: 重新 + 新 + 动词化 = 使焕然一新"}],"extra":["innovative a. 创新的（构词: innovation + ive）","novice n. 新手（构词: nov + ice）","renovation n. 翻新（构词: renovate + ion）","innovator n. 创新者（构词: innovate + or）","nova n. 新星（构词: nov + a）","novelist n. 小说家（构词: novel + ist）"]},{"id":252,"root":"pati-","pronounce":"/ˈpeɪʃ/普诶诗","source":"拉丁语 pati","meaning":"忍受,承受","mnemonic":"为了记忆，可以把PATI记成“Put All Tough things Inside”。\n\nPut All Tough things Inside是把一件件困难、压力和不舒服的事情接到自己身上，即忍受、承受、经受。\n\n所以pati/pass就是“忍受、承受、经受”的意思。。所以pati就是“忍受、承受”。","mainWords":[{"word":"patient","pos":"a.","detail":"构词: 构词: pati(忍受) + ent(形容词后缀)<br>释义: 有耐心的 n.病人","example":"例句: Be patient with children. ｜ 推导: 忍受 + 形容词化 = 能忍受的,有耐心的"},{"word":"patience","pos":"n.","detail":"构词: 构词: pati(忍受) + ence(名词后缀)<br>释义: 耐心,忍耐","example":"例句: Patience is a virtue. ｜ 推导: 忍受 + 名词化 = 忍受的能力,耐心"},{"word":"compatible","pos":"a.","detail":"构词: 构词: com(共同) + pati + ible<br>释义: 兼容的;相容的","example":"例句: They are compatible partners. ｜ 推导: 共同 + 忍受 + 可以的 = 能相互忍受的"},{"word":"impatient","pos":"a.","detail":"构词: 构词: im(不) + patient<br>释义: 不耐烦的","example":"例句: Don't be impatient! ｜ 推导: 不 + 有耐心的 = 不耐烦的"}],"extra":["passion n. 激情;受难（构词: pass(=pati) + ion）","passive a. 被动的（构词: pass(=pati) + ive）","compassion n. 同情（构词: com + pass + ion）","compatibility n. 兼容性（构词: compatible + ity）","patiently ad. 耐心地（构词: patient + ly）","impatience n. 不耐烦（构词: im + patience）"]},{"id":253,"root":"pay","pronounce":"/peɪ/普诶","source":"拉丁语 pacāre","meaning":"平息,安抚","mnemonic":"pay就是小学学过的单词，拼写和读音都不用变化。把欠款 pay 清，冲突中的一方得到补偿，事情就容易平息、被安抚，所以pay就是“平息、安抚”。","mainWords":[{"word":"pay","pos":"v.","detail":"构词: 构词: pay(平息)<br>释义: 付款;支付 n.工资","example":"例句: Please pay the bill. ｜ 推导: 平息债务 = 支付,付款"},{"word":"payment","pos":"n.","detail":"构词: 构词: pay + ment(名词后缀)<br>释义: 付款;支付","example":"例句: Monthly payment is due. ｜ 推导: 支付 + 名词化 = 付款,支付"},{"word":"repay","pos":"v.","detail":"构词: 构词: re(回) + pay<br>释义: 偿还;报答","example":"例句: I will repay your kindness. ｜ 推导: 回 + 支付 = 偿还,回报"}],"extra":["payable a. 应付的（构词: pay + able）","payee n. 收款人（构词: pay + ee）","payer n. 付款人（构词: pay + er）","prepay v. 预付（构词: pre + pay）"]},{"id":254,"root":"proof","pronounce":"/pruːf/普儿乌夫","source":"拉丁语 probare","meaning":"测试,验证,证明","mnemonic":"proof从我们学过的prove来记。prove就是证明、证实；要证明一件事，先要测试和验证，最后才得到证明。所以proof就是“测试、验证、证明”的意思。","mainWords":[{"word":"proof","pos":"n.","detail":"构词: 构词: proof(测试结果)<br>释义: 证明;证据","example":"例句: We need proof of identity. ｜ 推导: 测试结果 = 证明,证据"},{"word":"waterproof","pos":"a.","detail":"构词: 构词: water(水) + proof(防...的)<br>释义: 防水的","example":"例句: This jacket is waterproof. ｜ 推导: 水 + 经得起测试的 = 防水的"}],"extra":["prove v. 证明 (prov(e) = proof的动词形式)","disprove v. 反驳（构词: dis + prove）","bulletproof a. 防弹的（构词: bullet + proof）","fireproof a. 防火的（构词: fire + proof）","foolproof a. 防呆的（构词: fool + proof）","soundproof a. 隔音的（构词: sound + proof）","proofread v. 校对（构词: proof + read）","childproof a. 儿童安全的（构词: child + proof）"]},{"id":255,"root":"prope/proach","pronounce":"/prəʊp/普儿欧普","source":"拉丁语 propiare","meaning":"靠近,接近","mnemonic":"方法一：prope/proach就是“迫迫”。 迫一般用于急迫，迫近等表达中，表示距离越来越近，就是靠近和接近。 所以prope/proach就是“靠近、接近”。   方法二：为了记忆，可以把PROPE记成“Person Reaches Other Place; Ends”。\n\nPerson Reaches Other Place表示一个人到达另一个地方；Ends表示原来隔在两地之间的路程到此结束。距离不断缩短，最终接近目标。\n所以prope/proach就是“靠近、接近”的意思。","mainWords":[{"word":"approach","pos":"v.","detail":"构词: 构词: ap(=ad向) + proach(靠近)<br>释义: 接近;n.方法","example":"例句: We need a new approach. ｜ 推导: 向 + 靠近 = 接近,接近的方法"},{"word":"reproach","pos":"v./n.","detail":"构词: 构词: re(反向) + proach(靠近)<br>释义: 责备","example":"例句: He reproached her for lying. ｜ 推导: 反向 + 靠近 = 逼近质问,责备"}],"extra":["approachable a. 可接近的;友好的（构词: approach + able）","unapproachable a. 不可接近的 (un + approachab","approaching a. 接近的（构词: approach + ing）","rapprochement n. 和解;恢复友好关系 (re + app","reproachful a. 责备的（构词: reproach + ful）"]},{"id":256,"root":"side","pronounce":"/saɪd/斯爱德","source":"古英语 sīde","meaning":"侧面,旁边,边","mnemonic":"side就是小学学过的单词，拼写和读音都不用变化。side 是侧面、旁边和边缘，所以side就是“侧面、旁边、边”。","mainWords":[{"word":"side","pos":"n.","detail":"构词: 构词: side(侧面)<br>释义: 边;侧面;方面","example":"例句: Look at both sides of the issue. ｜ 推导: 侧面 = 边,侧面,方面"},{"word":"aside","pos":"ad.","detail":"构词: 构词: a(到) + side(旁边)<br>释义: 在旁边;到一边","example":"例句: Put your worries aside. ｜ 推导: 到 + 旁边 = 在旁边,到一边"},{"word":"beside","pos":"prep.","detail":"构词: 构词: be(在) + side(旁边)<br>释义: 在...旁边","example":"例句: Sit beside me. ｜ 推导: 在 + 旁边 = 在...旁边"},{"word":"besides","pos":"ad./prep.","detail":"构词: 构词: beside + s<br>释义: 除...之外","example":"例句: Besides English, he speaks French. ｜ 推导: 在旁边 + s = 除...之外,另外"},{"word":"outside","pos":"n./a.","detail":"构词: 构词: out(外) + side(边)<br>释义: 外面(的)","example":"例句: Wait outside the door. ｜ 推导: 外 + 边 = 外边,外面"},{"word":"inside","pos":"n./a.","detail":"构词: 构词: in(内) + side(边)<br>释义: 里面(的)","example":"例句: Come inside the house. ｜ 推导: 内 + 边 = 内边,里面"},{"word":"alongside","pos":"prep.","detail":"构词: 构词: along(沿着) + side(边)<br>释义: 沿着...边;与...并排","example":"例句: Walk alongside the river."},{"word":"sideways","pos":"ad.","detail":"构词: 构词: side(侧面) + ways(方向)<br>释义: 向侧面地","example":"例句: Turn your head sideways. ｜ 推导: 侧面 + 方向 = 向侧面地,横着"},{"word":"countryside","pos":"n.","detail":"构词: 构词: country(乡村) + side(地方)<br>释义: 乡村,农村","example":"例句: Enjoy the peaceful countryside."},{"word":"seaside","pos":"n.","detail":"构词: 构词: sea(海) + side(边)<br>释义: 海边,海滨","example":"例句: Vacation at the seaside. ｜ 推导: 海 + 边 = 海边,海滨"}],"extra":[]},{"id":257,"root":"straw","pronounce":"/strɔː/斯特儿奥","source":"古英语 strēaw","meaning":"草秆,麦秆","mnemonic":"STRAW可以记成Small, Thin, Raw And Weak。Small是细小，Thin是细长，Raw是未经加工，And Weak是而且较脆弱。未经加工、细长而脆弱的植物杆，就是草秆和麦秆；麦秆中间常常是空的，还可以直接当吸管。所以straw就是“草秆、麦秆；吸管”的意思。","mainWords":[{"word":"straw","pos":"n.","detail":"构词: 构词: straw(草秆)<br>释义: 稻草;麦秆;吸管","example":"例句: He drank juice through a straw. ｜ 推导: 草秆 = 麦秆(后引申为吸管)"},{"word":"strawberry","pos":"n.","detail":"构词: 构词: straw(草秆) + berry(浆果)<br>释义: 草莓","example":"例句: Fresh strawberries taste sweet. ｜ 推导: 草秆 + 浆果 = 铺草秆种的浆果"}],"extra":["straw-colored a. 稻草色的（构词: straw + colored）","strawboard n. 草纸板（构词: straw + board）","straw hat n. 草帽（构词: straw + hat）","straw poll n. 民意测验（构词: straw + poll）","straw man n. 稻草人（构词: straw + man）"]},{"id":258,"root":"stringere","pronounce":"/stres/斯特儿诶斯","source":"","meaning":"拉紧,束缚","mnemonic":"stress就是“死拽死”，把一个东西死拽着，还要拽死了，就是把一个东西用绳子拉紧，牢牢捆住束缚住。 所以stress/string/strict就是“拉紧、束缚”。","mainWords":[{"word":"stress","pos":"n.","detail":"构词: 构词: stress(拉紧)<br>释义: 压力;重音 v.强调","example":"例句: Work stress affects health. ｜ 推导: 拉紧 = 紧张状态,压力"},{"word":"distress","pos":"n.","detail":"构词: 构词: dis(加强) + stress(拉紧)<br>释义: 痛苦;危难 v.使痛苦","example":"例句: She was in great distress. ｜ 推导: 加强 + 拉紧 = 过度紧张,极度痛苦"}],"extra":["stressful a. 有压力的（构词: stress + ful）","distressing a. 令人痛苦的（构词: distress + ing）","strict a. 严格的 (strict = 拉紧的)","constrict v. 收缩（构词: con + strict）","restrict v. 限制（构词: re + strict）","string n. 弦;绳子 (需要拉紧的东⻄)"]},{"id":259,"root":"ton-","pronounce":"/tɒn/特奥恩","source":"希腊语 tonos","meaning":"张力,声音","mnemonic":"ton的读音可以联想到“弹”。一根琴弦先被拉紧，才有张力；手指再弹一下，弦就振动并发出声音。一个“拉紧再弹响”的画面，同时连接了张力和声音，所以ton就是“张力、声音”。","mainWords":[{"word":"tone","pos":"n.","detail":"构词: 构词: ton(声音) + e<br>释义: 音调;语气","example":"例句: She spoke in a gentle tone. ｜ 推导: 声音 = 音调,语气"},{"word":"tune","pos":"n.","detail":"构词: 构词: tun(ton的变体) + e<br>释义: 曲调;旋律","example":"例句: He hummed a cheerful tune. ｜ 推导: 声音变体 = 曲调,旋律"},{"word":"monotonous","pos":"a.","detail":"构词: 构词: mono(单一) + ton + ous<br>释义: 单调的","example":"例句: The work was monotonous. ｜ 推导: 单一 + 声音 + 形容词化 = 单调的"},{"word":"tongue","pos":"n.","detail":"构词: 构词: 发出音(ton)的器官<br>释义: 舌头;语言","example":"例句: Mother tongue is important. ｜ 推导: 发音器官 = 舌头,语言"}],"extra":["tonal a. 音调的（构词: ton + al）","intone v. 吟诵（构词: in + ton + e）","overtone n. 泛音;暗示（构词: over + ton + e）","undertone n. 低音;暗流（构词: under + ton + e）"]},{"id":260,"root":"","pronounce":"/ʃʊər/诗乌儿儿","source":"法语动词后缀","meaning":"动作的过程或结果","mnemonic":"-sure的核心声音接近“收”。一个动作从开始做到结束，最后把过程收住，并留下一个可以以后看到的结果；所以接在词后时，常把前面的动作变成“动作的过程或结果”。所以-sure就是“动作的过程或结果”。","mainWords":[{"word":"pressure","pos":"n.","detail":"构词: 构词: press(压) + ure(结果后缀)<br>释义: 压力;压强","example":"例句: Work under pressure. ｜ 推导: 压 + 结果 = 按压的结果,压力"},{"word":"measure","pos":"v.","detail":"构词: 构词: meas(测量) + ure(结果后缀)<br>释义: 测量 n.措施","example":"例句: Take measures to improve. ｜ 推导: 测量 + 结果 = 测量的结果,尺度"},{"word":"pleasure","pos":"n.","detail":"构词: 构词: pleas(取悦) + ure(结果后缀)<br>释义: 愉快;乐趣","example":"例句: It's a pleasure to meet you. ｜ 推导: 取悦 + 结果 = 取悦的结果,愉悦"},{"word":"exposure","pos":"n.","detail":"构词: 构词: expos(暴露) + ure(结果后缀)<br>释义: 暴露;曝光","example":"例句: Avoid sun exposure. ｜ 推导: 暴露 + 结果 = 暴露的结果,曝光"},{"word":"treasure","pos":"n.","detail":"构词: 构词: treas(宝库) + ure(结果后缀)<br>释义: 财宝;珍宝","example":"例句: Buried treasure was found. ｜ 推导: 宝库 + 结果 = 储存的结果,珍宝"},{"word":"enclosure","pos":"n.","detail":"构词: 构词: en + clos(关闭) + ure<br>释义: 围场;围墙","example":"例句: The sheep are in the enclosure. ｜ 推导: 围 + 关闭 + 结果 = 围起来的结果,围场"}],"extra":["leisure n. 闲暇（构词: leis(许可) + ure）","closure n. 关闭（构词: clos(关) + ure）","seizure n. 没收;发作（构词: seiz(抓) + ure）","failure n. 失败（构词: fail + ure）","procedure n. 程序（构词: proced(前进) + ure）","disclosure n. 披露（构词: disclos(揭开) + ure）"]},{"id":261,"root":"call","pronounce":"/kɔːl/考勒","source":"古英语ceallian","meaning":"呼喊,召唤,命名","mnemonic":"call本身就是我们小学学过的call。 call 就是“叫、喊、打电话、召集”。 所以call就是“呼喊、召唤、命名”。","mainWords":[{"word":"call","pos":"v.","detail":"构词: 构词: call(呼喊)<br>释义: 叫,喊;打电话;召集","example":"例句: Call me when you arrive. ｜ 推导: 呼喊 = 叫,打电话,召集"},{"word":"recall","pos":"v.","detail":"构词: 构词: re(回) + call(召唤)<br>释义: 回忆;召回","example":"例句: I can't recall his name. ｜ 推导: 回 + 召唤 = 召唤回来,回忆"},{"word":"so-called","pos":"a.","detail":"构词: 构词: so(如此) + called(被称呼的)<br>释义: 所谓的","example":"例句: The so-called expert failed. ｜ 推导: 如此 + 被称呼的 = 所谓的(含讽刺)"}],"extra":["calling n. 职业;召唤（构词: call + ing）","caller n. 打电话者（构词: call + er）"]},{"id":262,"root":"cloth/clothe","pronounce":"/klɒθ/克勒奥斯","source":"古英语 clāþ","meaning":"布料,织物","mnemonic":"cloth和clothe都与小学词 clothes 连在一起。cloth 是布料，布料经过裁剪和缝合，就能做成 clothes；clothe 则表示把布料穿到人身上。所以cloth/clothe就是“布料、织物”。","mainWords":[{"word":"cloth","pos":"n.","detail":"构词: 构词: cloth(布料)<br>释义: 布,布料","example":"例句: She bought some cloth for a dress. ｜ 推导: 布料 = 基础的纺织材料"},{"word":"clothe","pos":"v.","detail":"构词: 构词: cloth(布料) + e(动词化)<br>释义: 给...穿衣","example":"例句: Parents clothe their children. ｜ 推导: 布料 + 动词化 = 用布料包裹,穿衣"},{"word":"clothes","pos":"n.","detail":"构词: 构词: cloth(布料) + es(复数)<br>释义: 衣服(复数)","example":"例句: She wears beautiful clothes. ｜ 推导: 布料 + 复数 = 多件衣物,服装"},{"word":"clothing","pos":"n.","detail":"构词: 构词: cloth(布料) + ing(名词后缀)<br>释义: 服装(总称)","example":"例句: The store sells winter clothing. ｜ 推导: 布料 + 名词化 = 服装类的总称"}],"extra":["tablecloth n. 桌布（构词: table + cloth）","washcloth n. 毛巾（构词: wash + cloth）","dishcloth n. 洗碗布（构词: dish + cloth）","unclothed a. 未穿衣的（构词: un + cloth + ed）","sackcloth n. 粗麻布（构词: sack + cloth）","clothier n. 服装商（构词: cloth + ier）"]},{"id":263,"root":"deed","pronounce":"/diːd/德衣德","source":"日耳曼语 *dēdiz","meaning":"行动,行为","mnemonic":"deed与小学词did读音接近，did 是 do 的过去式，表示事情已经做了。已经做出来的事，就是一个人的行动和行为。所以deed就是“行动、行为”。","mainWords":[{"word":"deed","pos":"n.","detail":"构词: 构词: deed(行动)<br>释义: 行为;事迹;契约","example":"例句: His brave deeds inspired others. ｜ 推导: 行动 = 行为,事迹"},{"word":"indeed","pos":"ad.","detail":"构词: 构词: in(在...中) + deed(行动)<br>释义: 确实;实际上","example":"例句: It is indeed a difficult task. ｜ 推导: 在行动中 = 实际上,确实"}],"extra":["misdeed n. 恶行,罪行（构词: mis(错误) + deed）","title deed n. 地契,房契","good deed n. 善行,好事","evil deed n. 恶行,坏事","heroic deed n. 英雄事迹"]},{"id":264,"root":"dign-","pronounce":"/dɪɡn/迪格恩","source":"拉丁语 dignus","meaning":"值得的,有尊严的","mnemonic":"dign就是“顶得住”。 能够顶天立地、经得住考验的人，值得尊重并有尊严。 所以dign就是“值得的、有尊严的”。","mainWords":[{"word":"dignity","pos":"n.","detail":"构词: 构词: dign(值得) + ity(名词后缀)<br>释义: 尊严;庄严","example":"例句: She maintained her dignity. ｜ 推导: 值得 + 名词化 = 值得尊重的品质,尊严"},{"word":"indignant","pos":"a.","detail":"构词: 构词: in(否定) + dign + ant<br>释义: 愤慨的","example":"例句: He was indignant at the injustice. ｜ 推导: 不 + 值得 = 因不值得之事而愤怒"},{"word":"indignation","pos":"n.","detail":"构词: 构词: in + dign + ation(名词后缀)<br>释义: 愤慨;愤怒","example":"例句: Public indignation was aroused. ｜ 推导: 不值得 + 名词化 = 愤慨的情绪"}],"extra":["dignified a. 有尊严的;庄严的（构词: dign + ified）","dignitary n. 显要人物（构词: dign + itary）"]},{"id":265,"root":"erg-","pronounce":"/ɜːg/额格","source":"希腊语 érgon","meaning":"工作,功,能量","mnemonic":"erg就是“尔格”。尔格是表示功和能量的单位，做功本身就是工作的一种，所以erg就是“工作,功,能量”的意思。","mainWords":[{"word":"energy","pos":"n.","detail":"构词: 构词: en(在...中) + erg(工作) + y<br>释义: 能量;精力;活力","example":"例句: Solar energy is renewable. ｜ 推导: 在...中 + 工作 = 工作中的力量,能量"},{"word":"energetic","pos":"a.","detail":"构词: 构词: energy + etic(形容词后缀)<br>释义: 精力充沛的","example":"例句: She's very energetic today. ｜ 推导: 能量 + 形容词化 = 充满能量的"}],"extra":["energize v. 给予能量;激励（构词: energy + ize）","energizer n. 激励者;充电器（构词: energize + er）","synergy n. 协同作用（构词: syn(共同) + erg + y）","ergonomics n. 人体工程学（构词: erg + o + nomics）","allergy n. 过敏（构词: all(其他) + erg + y）","lethargy n. 无精打采（构词: leth(遗忘) + arg + y）","ergophobia n. 工作恐惧症（构词: erg + o + phobia）","demiurge n. 造物主（构词: demi(半) + urg + e）","surgery n. 外科手术（构词: sur(超) + g + ery）","metallurgy n. 冶金学（构词: metal + l + urgy）"]},{"id":266,"root":"exempl-","pronounce":"/ɪɡˈzæmpəl/衣格兹艾姆珀勒","source":"exemplum(样本)","meaning":"样本,典型","mnemonic":"exempl可以直接想到我们小学学过的example。 example 就是“例子、样本”。 例子就是用来代表一类事物的样本或典型。 所以exempl就是“样本、典型”。","mainWords":[{"word":"example","pos":"n.","detail":"构词: 构词: exempl(样本) → example<br>释义: 例子;榜样","example":"例句: Set a good example for others. ｜ 推导: 向外 + 取出 = 选出的典型样本,例子"},{"word":"exemplify","pos":"v.","detail":"构词: 构词: example + ify(使动后缀)<br>释义: 举例说明;例证","example":"例句: This case exemplifies the problem. ｜ 推导: 例子 + 使动 = 使成为例子,举例说明"}],"extra":["exemplar n. 模范;典型（构词: exempl + ar）","exemplary a. 模范的（构词: exempl + ary）","exemplification n. 例证（构词: exemplify + cation）","unexampled a. 无先例的（构词: un + exampl + ed）"]},{"id":267,"root":"fed-/feder-","pronounce":"/fed/夫诶德","source":"拉丁语 foedus","meaning":"条约,联盟","mnemonic":"全球最大快递公司联邦快递无人不知 联邦快递的英文名是FedEx ex是express的缩略 是快递的意思 所以fed必然就是联邦的意思 只要知道联邦快递 FedEx fed这个词根表示联邦的意思就没可能记不住","mainWords":[{"word":"federal","pos":"a.","detail":"构词: 构词: feder(联盟) + al(形容词后缀)<br>释义: 联邦的","example":"例句: The federal government acted. ｜ 推导: 联盟 + 形容词化 = 联邦性质的"},{"word":"federation","pos":"n.","detail":"构词: 构词: feder(联盟) + ation(名词后缀)<br>释义: 联邦;联盟","example":"例句: They formed a federation. ｜ 推导: 联盟 + 名词化 = 联盟实体,联邦"}],"extra":["federate v. 联合;结成联邦（构词: feder + ate）","federalism n. 联邦主义（构词: federal + ism）","federalist n. 联邦主义者（构词: federal + ist）","federated a. 联合的（构词: feder + ated）","confederate n. 同盟者（构词: con + feder + ate）","confederation n. 邦联（构词: con + feder + ation）","federalize v. 使联邦化（构词: federal + ize）","federative a. 联邦性的（构词: feder + ative）","unfederated a. 非联邦的（构词: un + feder + ated）"]},{"id":268,"root":"foot","pronounce":"/fʊt/夫乌特","source":"古英语 fōt","meaning":"脚,足部","mnemonic":"foot本身就是我们小学学过的foot。 foot 就是“脚、足、英尺”。 所以foot就是“脚、足部”。","mainWords":[{"word":"foot","pos":"n.","detail":"构词: 构词: foot(脚)<br>释义: 脚,足;英尺","example":"例句: He hurt his left foot. ｜ 推导: 脚 = 人体的足部"},{"word":"football","pos":"n.","detail":"构词: 构词: foot(脚) + ball(球)<br>释义: 足球;足球运动","example":"例句: They play football every weekend. ｜ 推导: 脚 + 球 = 用脚踢的球,足球"},{"word":"footstep","pos":"n.","detail":"构词: 构词: foot(脚) + step(步)<br>释义: 脚步;足迹","example":"例句: I heard footsteps in the hall. ｜ 推导: 脚 + 步 = 脚步声,足迹"}],"extra":["footprint n. 脚印;足迹（构词: foot + print）","barefoot a./ad. 赤脚的（构词: bare + foot）"]},{"id":269,"root":"heal/health","pronounce":"/hiːl/赫衣勒","source":"古英语 hǣl","meaning":"完整,健康","mnemonic":"方法一： heal/health我们在小学词 healthy 中见过。身体受伤后慢慢 heal，伤口重新合拢，身体恢复完整；恢复完整、没有疾病，就是 health 和 healthy 所表示的健康。所以heal/health就是“完整、健康”。 方法二： heal/health就是“合回完整”。 伤口愈合后，身体恢复完整，也恢复健康。 所以heal/health就是“完整、健康”。","mainWords":[{"word":"heal","pos":"v.","detail":"构词: 构词: heal(完整,健康)<br>释义: 治愈;愈合","example":"例句: Time heals all wounds. ｜ 推导: 使恢复完整 = 治愈"},{"word":"health","pos":"n.","detail":"构词: 构词: heal + th(名词后缀)<br>释义: 健康;卫生","example":"例句: Health is wealth. ｜ 推导: 完整状态 + 名词化 = 健康"},{"word":"healthy","pos":"a.","detail":"构词: 构词: health + y(形容词后缀)<br>释义: 健康的;有益的","example":"例句: A healthy mind in a healthy body. ｜ 推导: 健康 + 形容词化 = 健康的"}],"extra":["healing n. 治  know(知道)<br>释义: 知道;认识","example":"例句: I know the answer. ｜ 推导: 知道 = 知道,认识"},{"word":"knowledge","pos":"n.","detail":"构词: 构词: know + ledge(状态后缀)<br>释义: 知识;学问","example":"例句: Scientific knowledge is valuable. ｜ 推导: 知道 + 状态 = 知道的状态,知识"},{"word":"acknowledge","pos":"v.","detail":"构词: 构词: ac(朝向) + knowledge<br>释义: 承认;致谢","example":"例句: He acknowledged his mistake. ｜ 推导: 朝向 + 知识 = 朝向认知,承认"},{"word":"well-known","pos":"a.","detail":"构词: 构词: well(充分) + known<br>释义: 著名的","example":"例句: She is a well-known artist. ｜ 推导: 充分 + 被知道的 = 广为人知的,著名的"}],"extra":["unknown a. 未知的（构词: un + known）","knowing a. 会意的（构词: know + ing）","knowingly ad. 故意地（构词: know + ing + ly）","knowledgeable a. 博学的（构词: knowledge + able）"]},{"id":273,"root":"live/life","pronounce":"/laɪv/勒爱五","source":"古英语 libban","meaning":"生活,生命","mnemonic":"live/life都是小学词。live 是活着并继续生活，表示生命正在延续；life 是这种持续存在的生命本身。所以live/life就是“生活、生命”。","mainWords":[{"word":"life","pos":"n.","detail":"构词: 构词: 来自古英语līf<br>释义: 生活;生命;一生","example":"例句: Life is beautiful. ｜ 推导: 生命 = 存在的状态"},{"word":"live","pos":"v.","detail":"构词: 构词: 来自古英语libban<br>释义: 生活;居住","example":"例句: They live in London. ｜ 推导: 生活 = 存在,居住"},{"word":"alive","pos":"a.","detail":"构词: 构词: a(在) + live(生命)<br>释义: 活着的;有生气的","example":"例句: She is still alive. ｜ 推导: 在 + 生命中 = 活着的"},{"word":"lively","pos":"a.","detail":"构词: 构词: live + ly(形容词后缀)<br>释义: 活泼的;生动的","example":"例句: It was a lively debate. ｜ 推导: 生命 + 形容词化 = 充满生机的"},{"word":"lifetime","pos":"n.","detail":"构词: 构词: life(生命) + time(时间)<br>释义: 一生;终生","example":"例句: Once in a lifetime. ｜ 推导: 生命 + 时间 = 一生,终生"}],"extra":["living a. 活的 n.生计（构词: live + ing）","livelihood n. 生计（构词: live + lihood）","lifestyle n. 生活方式（构词: life + style）","enliven v. 使活跃（构词: en + live + n）"]},{"id":274,"root":"lock-","pronounce":"/lɒk/勒奥克","source":"日耳曼语系","meaning":"锁定,固定,禁锢","mnemonic":"lock就是小学学过的单词，拼写和读音都不用变化。lock 会把门固定并禁锢起来，所以lock就是“锁定、固定、禁锢”。","mainWords":[{"word":"lock","pos":"n.","detail":"构词: 构词: lock(锁定)<br>释义: 锁 v.锁定","example":"例句: Lock the door
