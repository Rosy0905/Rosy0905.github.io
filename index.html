一份，所以这一支表示“部分、份额”。② 手机的接口和船舶停靠的港口都常用 port 表示：接口把电和数据送进送出，港口把货物搬上搬下并运往别处，所以另一支表示“携带、运送”。","mainWords":[{"word":"portion","pos":"n.","detail":"构词: 构词: port(部分) + ion(名词后缀)<br>释义: 部分;一份","example":"例句: A large portion of the budget. ｜ 推导: 部分 + 名词化 = 一份,部分"},{"word":"proportion","pos":"n.","detail":"构词: 构词: pro(向前) + port(部分) + ion<br>释义: 比例;部分","example":"例句: The proportion of men to women. ｜ 推导: 向前 + 部分 = 部分相对于整体,比例"},{"word":"port","pos":"n.","detail":"构词: 构词: port(携带)<br>释义: 港口;港口城市","example":"例句: The ship arrived at port. ｜ 推导: 携带 = 货物运送之地,港口"},{"word":"porter","pos":"n.","detail":"构词: 构词: port(携带) + er(人)<br>释义: 搬运工;门房","example":"例句: The porter carried our luggage. ｜ 推导: 携带 + 人 = 搬运东⻄的人"},{"word":"portable","pos":"a.","detail":"构词: 构词: port(携带) + able(能够)<br>释义: 便携的,手提的","example":"例句: A portable computer is convenient. ｜ 推导: 携带 + 能够 = 能够携带的"},{"word":"transport","pos":"v.","detail":"构词: 构词: trans(穿过) + port(携带)<br>释义: 运输 n.运输","example":"例句: Transport goods by truck. ｜ 推导: 穿过 + 携带 = 跨越运送"},{"word":"import","pos":"v.","detail":"构词: 构词: im(进入) + port(携带)<br>释义: 进口 n.进口商品","example":"例句: China imports oil from abroad. ｜ 推导: 进入 + 携带 = 携带进来,进口"},{"word":"export","pos":"v.","detail":"构词: 构词: ex(出去) + port(携带)<br>释义: 出口 n.出口商品","example":"例句: Japan exports cars worldwide. ｜ 推导: 出去 + 携带 = 携带出去,出口"},{"word":"report","pos":"v.","detail":"构词: 构词: re(回) + port(携带)<br>释义: 报告 n.报告","example":"例句: Report the news immediately. ｜ 推导: 回 + 携带 = 把信息带回,报告"},{"word":"reporter","pos":"n.","detail":"构词: 构词: report + er(人)<br>释义: 记者","example":"例句: The reporter interviewed him. ｜ 推导: 报告 + 人 = 报告新闻的人"},{"word":"support","pos":"v.","detail":"构词: 构词: sup(向上) + port(携带)<br>释义: 支持 n.支持","example":""},{"word":"airport","pos":"n.","detail":"构词: 构词: air(空中) + port(港口)<br>释义: 机场,航空港","example":""},{"word":"passport","pos":"n.","detail":"构词: 构词: pass(通过) + port(港口)<br>释义: 护照","example":"例句: Don't forget your passport. ｜ 推导: 通过 + 港口 = 通过港口的证件"},{"word":"important","pos":"a.","detail":"构词: 构词: im(进入) + port + ant<br>释义: 重要的","example":"例句: This is an important matter. ｜ 推导: 值得带入的 = 有分量的,重要的"},{"word":"importance","pos":"n.","detail":"构词: 构词: important + ce(名词后缀)<br>释义: 重要性","example":"例句: The importance of education. ｜ 推导: 重要的 + 名词化 = 重要性"},{"word":"opportunity","pos":"n.","detail":"构词: 构词: op(向) + port + unity<br>释义: 机会","example":"例句: Seize the opportunity. ｜ 推导: 向着港口 = 到达目的地的时机"},{"word":"sport","pos":"n.","detail":"构词: 构词: s(出) + port(携带)<br>释义: 运动;体育","example":"例句: Football is a popular sport. ｜ 推导: 出去 + 携带 = 把身体带出去活动"},{"word":"sportsman","pos":"n.","detail":"构词: 构词: sport + s + man(人)<br>释义: 运动员","example":"例句: He is a professional sportsman. ｜ 推导: 运动 + 人 = 从事运动的人"}],"extra":["proportional a. 成比例的（构词: proportion + al）","apportion v. 分配（构词: ap(向) + portion）","disproportionate a. 不成比例的（构词: dis + proportion + ate）","portioned a. 分成份的（构词: portion + ed）","proportionate a. 相称的（构词: proportion + ate）"]},{"id":278,"root":"pub-/publ-","pronounce":"/pʌb/普阿布","source":"拉丁语 publicus","meaning":"公共的,人民的","mnemonic":"pub/publ就是“铺布”。把一大块布铺在公共广场上，周围的人民都可以以后看到、使用；把消息也像布一样铺开给所有人看，就是公开。所以pub/publ就是“公共的、人民的”。","mainWords":[{"word":"public","pos":"a.","detail":"构词: 构词: publ(公共) + ic(形容词后缀)<br>释义: 公共的 n.公众","example":"例句: This is a public park. ｜ 推导: 公共 + 形容词化 = 公共的,公开的"},{"word":"publish","pos":"v.","detail":"构词: 构词: publ(公开) + ish(动词后缀)<br>释义: 出版;发表","example":"例句: They will publish the book. ｜ 推导: 公开 + 动词化 = 使公开,出版"},{"word":"republic","pos":"n.","detail":"构词: 构词: re(事务) + publ(公共) + ic<br>释义: 共和国","example":"例句: China is a republic. ｜ 推导: 事务 + 公共的 = 公共事务,共和国"},{"word":"republican","pos":"a.","detail":"构词: 构词: republic + an(形容词后缀)<br>释义: 共和的","example":"例句: Republican values are important. ｜ 推导: 共和国 + 形容词化 = 共和的,共和党的"},{"word":"publication","pos":"n.","detail":"构词: 构词: public + ation(名词后缀)<br>释义: 出版物","example":"例句: This is a scientific publication. ｜ 推导: 公开 + 行为名词化 = 出版物"},{"word":"publicity","pos":"n.","detail":"构词: 构词: public + ity(名词后缀)<br>释义: 公开;宣传","example":"例句: The event got much publicity. ｜ 推导: 公共 + 状态名词化 = 公开性,宣传"}],"extra":["publicly ad. 公开地（构词: public + ly）","publisher n. 出版商（构词: publish + er）","publicize v. 宣传（构词: public + ize）","publicist n. 宣传员（构词: public + ist）"]},{"id":279,"root":"sail","pronounce":"/seɪl/瑟衣勒","source":"日耳曼语 *seglaz","meaning":"帆,航行","mnemonic":"sail就是“驶了”。船帆升起来以后，船就驶离岸边、开始在水上航行；升起的那块布就是帆。所以sail就是“帆、航行”。","mainWords":[{"word":"sail","pos":"n.","detail":"构词: 构词: sail(帆)<br>释义: 帆;航行 v.航行","example":"例句: The ship will sail tomorrow. ｜ 推导: 帆 = 航行的工具和动作"},{"word":"sailor","pos":"n.","detail":"构词: 构词: sail(航行) + or(从业者)<br>释义: 水手,海员","example":"例句: He is an experienced sailor. ｜ 推导: 航行 + 从业者 = 以航海为生的人"}],"extra":["sailing n. 航行;帆船运动（构词: sail + ing）","sailboat n. 帆船（构词: sail + boat）","sailcloth n. 帆布（构词: sail + cloth）","sailor-like a. 像水手的（构词: sailor + like）","sailplane n. 滑翔机（构词: sail + plane）","oversail v. 航行过度（构词: over + sail）"]},{"id":280,"root":"short","pronounce":"/ʃɔːt/诗奥特","source":"古英语 sceort","meaning":"短的,不足的","mnemonic":"short本身就是我们小学学过的short。 short 就是“短的、不足的”。 所以short就是“短的、不足的”。","mainWords":[{"word":"short","pos":"a.","detail":"构词: 构词: short(短的)<br>释义: 短的;不足的","example":"例句: Life is too short to waste. ｜ 推导: 短的 = 长度或时间不足的"},{"word":"shortly","pos":"ad.","detail":"构词: 构词: short + ly(副词后缀)<br>释义: 不久;简短地","example":"例句: She will arrive shortly. ｜ 推导: 短的 + 副词化 = 时间短促地,不久"},{"word":"shortage","pos":"n.","detail":"构词: 构词: short + age(状态后缀)<br>释义: 短缺;不足","example":"例句: There is a water shortage. ｜ 推导: 短的 + 状态 = 资源短缺的状态"},{"word":"shortcoming","pos":"n.","detail":"构词: 构词: short + coming(到来)<br>释义: 缺点;短处","example":"例句: Everyone has shortcomings. ｜ 推导: 短的 + 到来 = 达不到标准的缺陷"},{"word":"shorthand","pos":"n.","detail":"构词: 构词: short + hand(手写)<br>释义: 速记;简写","example":"例句: Take notes in shorthand. ｜ 推导: 短的 + 手写 = 缩短的书写方式,速记"}],"extra":["shorten v. 缩短（构词: short + en(动词后缀)）","shortcut n. 捷径（构词: short + cut）","shorts n. 短裤（构词: short + s）","short-term a. 短期的（构词: short + term）"]},{"id":281,"root":"-sid-/-sed-","pronounce":"/sɪd/西德","source":"拉丁语 sedere","meaning":"坐","mnemonic":"sid/sed可以直接想到我们小学学过的sit。 sit 就是“坐”。 sit 的动作就是坐下并停在一个位置。 所以sid/sed就是“坐”。","mainWords":[{"word":"president","pos":"n.","detail":"构词: 构词: pre(前) + sid(坐) + ent<br>释义: 总统;主席","example":"例句: The president gave a speech. ｜ 推导: 前 + 坐 = 坐在前面的人,领导者"},{"word":"preside","pos":"v.","detail":"构词: 构词: pre(前) + sid(坐) + e<br>释义: 主持;主管","example":"例句: She will preside over the meeting. ｜ 推导: 前 + 坐 = 坐在前面,主持"},{"word":"resident","pos":"n.","detail":"构词: 构词: re(再) + sid(坐) + ent<br>释义: 居民 a.居住的","example":"例句: Local residents complained. ｜ 推导: 再 + 坐 = 安定下来的人,居民"},{"word":"residence","pos":"n.","detail":"构词: 构词: re + sid + ence(名词后缀)<br>释义: 住所;居住","example":"例句: His official residence is nearby. ｜ 推导: 再 + 坐 + 名词化 = 安定的地方,住所"},{"word":"consider","pos":"v.","detail":"构词: 构词: con(共同) + sider(坐)<br>释义: 考虑;认为","example":"例句: Please consider my proposal. ｜ 推导: 共同 + 坐 = 坐下来思考,考虑"},{"word":"consideration","pos":"n.","detail":"构词: 构词: consider + ation(名词后缀)<br>释义: 考虑;体谅","example":"例句: After careful consideration... ｜ 推导: 考虑 + 名词化 = 考虑,深思"},{"word":"considerable","pos":"a.","detail":"构词: 构词: consider + able(能够...的)<br>释义: 相当大的","example":"例句: A considerable amount of money. ｜ 推导: 考虑 + 能够 = 值得考虑的,相当大的"},{"word":"considerate","pos":"a.","detail":"构词: 构词: consider + ate(形容词后缀)<br>释义: 体贴的","example":"例句: He is very considerate. ｜ 推导: 考虑 + 形容词化 = 为他人考虑的,体贴的"},{"word":"obsession","pos":"n.迷住,","detail":"构词: 构词: ob-(反对、向着) + sess + -ion(动作、过程或结果)<br>释义: 困扰","example":"推导: 核心词根「-sid-/-sed-」表示“坐”，结合前后缀，可推出“n.迷住, 困扰”"}],"extra":[]},{"id":282,"root":"stall-","pronounce":"/stɔːl/斯托勒","source":"拉丁语 stallum","meaning":"位置,固定处","mnemonic":"stall的开头 sta 从小学词 stand 联想。一个人每天固定 stand 在同一个小摊位上，那个地方就成为他的固定位置；设备被放到固定处，也会稳定不动。所以stall就是“位置、固定处”。","mainWords":[{"word":"install","pos":"v.","detail":"构词: 构词: in(进入) + stall(位置)<br>释义: 安装;使就职","example":"例句: Install the software first. ｜ 推导: 进入 + 位置 = 安置到固定位置,安装"},{"word":"installation","pos":"n.","detail":"构词: 构词: install + ation(名词后缀)<br>释义: 安装;设施","example":"例句: The installation is complete. ｜ 推导: 安装 + 名词化 = 安装过程;已安装的设施"},{"word":"installment","pos":"n.","detail":"构词: 构词: install + ment(名词后缀)<br>释义: 分期付款","example":"例句: Pay in monthly installments. ｜ 推导: 安装 + 名词化 = 分次固定到位,分期"}],"extra":["installer n. 安装程序;安装工（构词: install + er）","reinstall v. 重新安装（构词: re + install）","uninstall v. 卸载（构词: un + install）","preinstall v. 预装（构词: pre + install）"]},{"id":283,"root":"stor-","pronounce":"/stɔːr/斯托儿","source":"拉丁语 staurum","meaning":"储存,储备,建立","mnemonic":"stor-是我们小学学过的词store的一部分。 走进一个 shop，前面摆着商品，后面是一箱箱 box。没有卖完的东西会被 keep、save 在里面，形成存货和储备。把东西一件件存起来，也是在建立一个储备库。 所以从 store 可以直接反推出 stor 的“储存、储备”。 所以stor-就是“储存、储备、建立储备”。","mainWords":[{"word":"store","pos":"v.","detail":"构词: 构词: stor(储存) + e<br>释义: 储存 n.商店","example":"例句: Store the data in the cloud. ｜ 推导: 储存 = 储存,存放;储存物品的地方"},{"word":"storage","pos":"n.","detail":"构词: 构词: stor + age(名词后缀)<br>释义: 储存;仓库","example":"例句: We need more storage space. ｜ 推导: 储存 + 名词化 = 储存行为或场所"},{"word":"restore","pos":"v.","detail":"构词: 构词: re(重新) + stor + e<br>释义: 恢复;修复","example":"例句: Restore the old painting carefully. ｜ 推导: 重新 + 储存/建立 = 恢复原状,修复"}],"extra":["restoration n. 恢复;修复（构词: re + stor + ation）","storehouse n. 仓库（构词: store + house）","storeroom n. 储藏室（构词: store + room）","storey n. 楼层（构词: stor + ey）"]},{"id":284,"root":"strange","pronounce":"/streɪndʒ/斯特儿诶恩吉","source":"拉丁语 extraneus","meaning":"陌生的,奇怪的","mnemonic":"strange读起来可以联想到“是生人”。一个从来没有见过的生人，对自己来说就是陌生的；他的举止不了解，看起来也容易觉得奇怪。所以strange就是“陌生的、奇怪的”。","mainWords":[{"word":"strange","pos":"a.","detail":"构词: 构词: strange(陌生的,奇怪的)<br>释义: 陌生的;奇怪的","example":"例句: It feels strange to be here. ｜ 推导: 陌生的,奇怪的"},{"word":"stranger","pos":"n.","detail":"构词: 构词: strange + er(表示人)<br>释义: 陌生人;外地人","example":"例句: Don't talk to strangers. ｜ 推导: 陌生的 + 人 = 陌生人"}],"extra":["strangely ad. 奇怪地（构词: strange + ly）","strangeness n. 陌生;奇异（构词: strange + ness）","estrange v. 使疏远（构词: e(使) + strange）","estranged a. 疏远的（构词: estrange + d）","strangest a. 最奇怪的（构词: strange + est）","estrangement n. 疏远（构词: estrange + ment）"]},{"id":285,"root":"sure","pronounce":"/ʃʊə/诗乌儿","source":"拉丁语 securus","meaning":"安全,确信","mnemonic":"方法一： sure本身就是我们小学学过的sure。 sure 就是“确信的、有把握的”。 对一件事 sure，说明心里确定而安全，不担心出错。 所以sure就是“安全、确信”。 方法二： 以后看到sure，可以直接想到表格里一个绿色“✓”。打勾说明答案已经确认、自己确信；事情被确认无误，也更安全可靠。所以sure就是“安全、确信”。","mainWords":[{"word":"sure","pos":"a.","detail":"构词: 构词: sure(安全,确信)<br>释义: 确信的;可靠的","example":"例句: I'm sure about the answer. ｜ 推导: 安全 → 确信的,可靠的"},{"word":"assure","pos":"v.","detail":"构词: 构词: as(加强) + sure(确信)<br>释义: 保证;使确信","example":"例句: I assure you it's safe. ｜ 推导: 加强 + 确信 = 使确信,保证"},{"word":"ensure","pos":"v.","detail":"构词: 构词: en(使) + sure(确信)<br>释义: 确保;保证","example":"例句: Ensure all doors are locked. ｜ 推导: 使 + 确信 = 确保,保证"},{"word":"insure","pos":"v.","detail":"构词: 构词: in(进入) + sure(安全)<br>释义: 投保;保险","example":"例句: Insure your car against theft. ｜ 推导: 进入 + 安全状态 = 投保"},{"word":"reassure","pos":"v.","detail":"构词: 构词: re(再次) + assure(保证)<br>释义: 使安心","example":"例句: He reassured me everything was fine. ｜ 推导: 再次 + 保证 = 使安心"},{"word":"insurance","pos":"n.","detail":"构词: 构词: insure + ance(名词后缀)<br>释义: 保险","example":"例句: Buy health insurance for family. ｜ 推导: 投保 + 名词化 = 保险"},{"word":"assurance","pos":"n.","detail":"构词: 构词: assure + ance(名词后缀)<br>释义: 保证;信心","example":"例句: Give me your assurance. ｜ 推导: 保证 + 名词化 = 保证,信心"}],"extra":[]},{"id":286,"root":"term-","pronounce":"/tɜːm/特姆","source":"拉丁语 terminus","meaning":"边界,界限,终点","mnemonic":"term的核心声音接近“停”。一条路走到某处停下来，那里就是终点；再往前不能通过，也形成边界和界限。所以term就是“边界、界限、终点”。","mainWords":[{"word":"term","pos":"n.","detail":"构词: 构词: term(界限)<br>释义: 学期;期限;术语","example":"例句: The spring term starts in March. ｜ 推导: 界限 = 时间的界限,期限"},{"word":"terminal","pos":"n.","detail":"构词: 构词: term + inal(形容词后缀)<br>释义: 终点站 a.终端的","example":"例句: We met at the airport terminal. ｜ 推导: 界限 + 形容词化 = 终点的,终端的"},{"word":"terminate","pos":"v.","detail":"构词: 构词: term + inate(动词后缀)<br>释义: 终止;结束","example":"例句: They decided to terminate the project. ｜ 推导: 界限 + 动词化 = 设定终点,终止"},{"word":"determine","pos":"v.","detail":"构词: 构词: de(完全) + term + ine<br>释义: 决定;确定","example":"例句: We need to determine the cause. ｜ 推导: 完全 + 界限 = 彻底划定界限,确定"}],"extra":["terminology n. 术语（构词: term + ology）","termination n. 终止（构词: termin + ation）","determined a. 坚决的（构词: de + term + ined）","determination n. 决心（构词: de + termin + ation）","terminus n. 终点站（构词: term + inus）","interminable a. 无止境的（构词: in + termin + able）"]},{"id":287,"root":"gæd-/gather-","pronounce":"/ˈɡæðər/盖泽儿","source":"古英语聚合词根","meaning":"聚集,联合","mnemonic":"gather就是“盖着”。把散在桌面上的小东西用布盖着，再从四周往中间一拢，它们就聚集到一起；分散的人聚到一处，也形成联合。gæd是它的短变体，所以gæd/gather就是“聚集、联合”。","mainWords":[{"word":"together","pos":"ad.","detail":"构词: 构词: to(朝向) + gether(联合)<br>释义: 一起;共同","example":"例句: Let's work together. ｜ 推导: 朝向 + 联合 = 朝向同一处,一起"},{"word":"altogether","pos":"ad.","detail":"构词: 构词: all(全部) + together(一起)<br>释义: 完全地;总共","example":"例句: That's altogether different. ｜ 推导: 全部 + 一起 = 全部合一,完全地"},{"word":"gather","pos":"v.","detail":"构词: 构词: gath(聚合) + er(动词后缀)<br>释义: 聚集;收集","example":"例句: People gathered in the square. ｜ 推导: 聚合 + 动词化 = 使聚集,收集"}],"extra":["gathering n. 聚会;集会（构词: gather + ing）","togetherness n. 团聚;亲密（构词: together + ness）","gatherer n. 收集者（构词: gather + er）","regather v. 重新聚集（构词: re + gather）","ungathered a. 未收集的（构词: un + gather + ed）","foregather v. 聚会;集合（构词: fore + gather）"]},{"id":288,"root":"trait-/tray-","pronounce":"/treɪ/特儿诶","source":"拉丁语 trahere","meaning":"拉,画,描绘","mnemonic":"trait-/tray-可以先用 trait 这一形态想到我们认识的train。 trait 和 train 只需把最后一个字母作一次简单替换。train 向前行动时，会拉着后面的车厢，所以先表示“拉”。 再把同一个动作放到纸上：手拉着笔尖经过纸面，就会 draw 出线条和人物形象。 所以trait-/tray-就是“拉；画、描绘”。","mainWords":[{"word":"portrait","pos":"n.","detail":"构词: 构词: por(向前) + trait(画)<br>释义: 肖像;描写","example":"例句: The artist painted her portrait. ｜ 推导: 向前 + 画 = 画出来的东⻄,肖像"},{"word":"portray","pos":"v.","detail":"构词: 构词: por(向前) + tray(画)<br>释义: 描绘;扮演","example":"例句: The book portrays life in the city. ｜ 推导: 向前 + 画 = 描绘出来,刻画"}],"extra":["portrayal n. 描绘;饰演（构词: por + tray + al）","trait n. 特征;特点 (trait)","portraiture n. 肖像画法（构词: portrait + ure）","self-portrait n. 自画像（构词: self + portrait）"]},{"id":289,"root":"ver-","pronounce":"/ver/五诶儿","source":"拉丁语 verus","meaning":"真实,真理","mnemonic":"ver就是“very”。very就是“很，非常”，其中最关键的意思可以继续联系到“真实”，由这个意思还可以继续推出真理，所以ver就是“真实,真理”的意思。","mainWords":[{"word":"verify","pos":"v.","detail":"构词: 构词: ver(真实) + ify(使动)<br>释义: 验证,核实","example":"例句: Please verify your identity. ｜ 推导: 真实 + 使成为 = 使真实,验证"},{"word":"verdict","pos":"n.","detail":"构词: 构词: ver(真实) + dict(说)<br>释义: 裁决,判决","example":"例句: The jury reached a verdict. ｜ 推导: 真实 + 陈述 = 说出真相,裁决"},{"word":"verifiable","pos":"a.","detail":"构词: 构词: verify + able(可...的)<br>释义: 可验证的","example":"例句: Scientific claims must be verifiable. ｜ 推导: 验证 + 可以的 = 可以验证的"},{"word":"veracity","pos":"n.","detail":"构词: 构词: ver(真实) + acity(性质)<br>释义: 真实性","example":"例句: We doubt the veracity of his story. ｜ 推导: 真实 + 性质 = 真实的性质,真实性"},{"word":"average","pos":"n.平均,平均数","detail":"构词: 构词: a-(向、在、无或加强) + ver + -age(动作、结果或集合)<br>释义: a.平均的；普通的 v.平均","example":"推导: 核心词根「ver-」表示“真实,真理”，结合前后缀，可推出“n.平均,平均数 a.平均的；普通的 v.平均”"}],"extra":["verification n. 验证（构词: verify + ication）","verisimilitude n. 逼真（构词: ver + similar）","veracious a. 诚实的（构词: ver + acious）","aver v. 断言,声称（构词: a + ver）","verily ad. 真正地（构词: ver + ily）","veridical a. 真实的（构词: ver + idical）","verity n. 真理（构词: ver + ity）","veritas n. 真理(拉丁语)（构词: ver + itas）","veritable a. 真正的（构词: ver + itable）"]},{"id":290,"root":"clin","pronounce":"/klɪn/克里恩","source":"拉丁语 clinare","meaning":"倾斜,弯曲","mnemonic":"clin读起来很像汉语里的“倾”。 一个物体向一边“倾”，就不再保持竖直，而是发生倾斜；身体弯下去，也是在改变原来的直立角度。 所以一以后看到 clin，就直接想到“倾”。 所以clin就是“倾斜、弯曲”。","mainWords":[{"word":"incline","pos":"v.","detail":"构词: 构词: in(向内) + clin(倾斜) + e<br>释义: 倾斜;倾向于","example":"例句: I incline to agree with you. ｜ 推导: 向内 + 倾斜 = 倾向于,倾斜"},{"word":"decline","pos":"v.","detail":"构词: 构词: de(向下) + clin(倾斜) + e<br>释义: 下降;拒绝","example":"例句: Sales declined last month. ｜ 推导: 向下 + 倾斜 = 下降,衰落,拒绝"},{"word":"clinic","pos":"n.","detail":"构词: 构词: clin(倾斜) + ic(场所)<br>释义: 诊所","example":"例句: She works at a dental clinic. ｜ 推导: 病人倾斜躺着的地方 = 诊所"}],"extra":["inclination n. 倾向,爱好 (inclination)","clinical a. 临床的 (clinical)","inclined a. 倾向于的 (inclined)","clinician n. 临床医生 (clinician)","declination n. 下降,衰退 (declination)","disinclined a. 不愿意的（构词: dis + inclined）","declining a. 下降的 (declining)","recliner n. 躺椅 (recliner)","recline v. 斜躺,倚靠（构词: re + cline）","proclivity n. 倾向,癖好（构词: pro + clivity）"]},{"id":291,"root":"dit-","pronounce":"/dɪt/迪特","source":"拉丁语 dare","meaning":"给予,传递","mnemonic":"dit就是“递它”。 把东西递给别人，就是给予和传递。 所以dit就是“给予、传递”。","mainWords":[{"word":"edit","pos":"v.","detail":"构词: 构词: e(出) + dit(给予)<br>释义: 编辑","example":"例句: Please edit this document. ｜ 推导: 出 + 给予 = 给出(最终版本),编辑"},{"word":"editor","pos":"n.","detail":"构词: 构词: edit + or(人)<br>释义: 编辑","example":"例句: The editor reviewed the article. ｜ 推导: 编辑 + 人 = 编辑者"},{"word":"edition","pos":"n.","detail":"构词: 构词: e + dit + ion(名词后缀)<br>释义: 版本","example":"例句: The first edition sold out. ｜ 推导: 给出 + 名词化 = 给出的成品,版本"},{"word":"editorial","pos":"n.","detail":"构词: 构词: editor + ial(形容词后缀)<br>释义: 社论","example":"例句: Read today's editorial. ｜ 推导: 编辑的 + 形容词化 = 编辑写的(文章)"},{"word":"condition","pos":"n.","detail":"构词: 构词: con(共同) + dit + ion<br>释义: 条件","example":"例句: What are the conditions? ｜ 推导: 共同 + 给予 = 相互给定的(前提)"},{"word":"tradition","pos":"n.","detail":"构词: 构词: tra(穿过) + dit + ion<br>释义: 传统","example":"例句: It's our family tradition. ｜ 推导: 穿过 + 给予 = 代代相传的给予"},{"word":"addition","pos":"n.","detail":"构词: 构词: ad(朝向) + dit + ion<br>释义: 加法","example":"例句: In addition to the above... ｜ 推导: 朝向 + 给予 = 向...添加给予"},{"word":"additional","pos":"a.","detail":"构词: 构词: addition + al(形容词)<br>释义: 额外的","example":"例句: We need additional time. ｜ 推导: 加法 + 形容词化 = 额外添加的"}],"extra":[]},{"id":292,"root":"equip","pronounce":"/ɪˈkwɪp/衣克威普","source":"古诺尔斯语 skipa","meaning":"装备,配备","mnemonic":"equip就是“一块配”。 把所需工具一块配齐，就是装备和配备。 所以equip就是“装备、配备”。","mainWords":[{"word":"equip","pos":"v.","detail":"构词: 构词: equip(装备)<br>释义: 装备,配备","example":"例句: Equip yourself with knowledge. ｜ 推导: 装备 = 为行动配备所需物品"},{"word":"equipment","pos":"n.","detail":"构词: 构词: equip + ment(名词后缀)<br>释义: 装备,设备","example":"例句: Modern equipment saves time. ｜ 推导: 装备 + 名词化 = 装备的总称"}],"extra":["equipped a. 装备好的（构词: equip + ped）","equipping n. 装备过程（构词: equip + ping）","well-equipped a. 装备精良的","ill-equipped a. 装备不足的","unequipped a. 未装备的（构词: un + equip + ped）","re-equip v. 重新装备（构词: re + equip）"]},{"id":293,"root":"fend-","pronounce":"/fend/夫诶恩德","source":"拉丁语 fendere","meaning":"击打,打击","mnemonic":"fend就是“防的”。防守时不能只站着不动，还要把打来的拳头或武器击开、打回去，所以“防”与“击打”连在一起。所以fend就是“击打、打击”。","mainWords":[{"word":"defend","pos":"v.","detail":"构词: 构词: de(远离) + fend(击打)<br>释义: 防卫,保卫","example":"例句: Defend your position. ｜ 推导: 远离 + 击打 = 将攻击击打远离,防卫"},{"word":"defense","pos":"n.","detail":"构词: 构词: de + fens + e(名词后缀)<br>释义: 防御,防卫","example":"例句: National defense is vital. ｜ 推导: 防卫的名词形式 = 防御体系"},{"word":"offend","pos":"v.","detail":"构词: 构词: of(对抗) + fend(击打)<br>释义: 冒犯,触犯","example":"例句: Don't offend anyone. ｜ 推导: 对抗 + 击打 = 主动击打对抗,冒犯"},{"word":"offensive","pos":"a.","detail":"构词: 构词: of + fens + ive(形容词后缀)<br>释义: 攻击性的","example":"例句: Take an offensive stance. ｜ 推导: 冒犯的形容词形式 = 攻击性的"}],"extra":["defender n. 防守者（构词: de + fend + er）","defensive a. 防御的（构词: de + fens + ive）","offender n. 犯罪者（构词: of + fend + er）","indefensible a. 无法防御的（构词: in + de + fens + ible）","fender n. 挡泥板（构词: fend + er）","offense n. 冒犯;进攻（构词: of + fens + e）"]},{"id":294,"root":"jew/joc","pronounce":"/dʒuː/吉乌","source":"拉丁语 jocus","meaning":"珠宝,装饰品","mnemonic":"jew/joc就是“珠镯”。 珠子和手镯都是用来装饰身体的珠宝和装饰品。 所以jew/joc就是“珠宝、装饰品”。","mainWords":[{"word":"jewel","pos":"n.","detail":"构词: 构词: jew(珠宝) + el(名词后缀)<br>释义: 宝石,珠宝","example":"例句: She wore a beautiful jewel. ｜ 推导: 珠宝 + 名词化 = 单件珠宝,宝石"},{"word":"jewelry","pos":"n.","detail":"构词: 构词: jewel(珠宝) + ry(集合名词后缀)<br>释义: 珠宝(总称)","example":"例句: The store sells expensive jewelry. ｜ 推导: 珠宝 + 总称后缀 = 珠宝首饰的总称"}],"extra":["jeweler n. 珠宝商（构词: jewel + er）","jeweling n. 镶嵌宝石（构词: jewel + ing）","jewelled a. 镶有宝石的（构词: jewel + led）","jewel-box n. 首饰盒（构词: jewel + box）","bejeweled a. 饰以珠宝的（构词: be + jewel + ed）","jewel-case n. 珠宝盒（构词: jewel + case）","jewellery n. 珠宝(英式)（构词: jewel + lery）","semi-jewel n. 半宝石（构词: semi + jewel）","jewellike a. 宝石般的（构词: jewel + like）","jewel-toned a. 宝石色调的（构词: jewel + toned）"]},{"id":295,"root":"line","pronounce":"/laɪn/勒爱恩","source":"拉丁语 linea","meaning":"线,绳子","mnemonic":"line本身就是我们小学学过的line。 line 就是“线、路线、界线”。 所以line就是“线、绳子”。","mainWords":[{"word":"line","pos":"n.","detail":"构词: 构词: line(线)<br>释义: 线;路线;界线","example":"例句: Draw a straight line. ｜ 推导: 线 = 线条,路线,界线"},{"word":"airline","pos":"n.","detail":"构词: 构词: air(空中) + line(线路)<br>释义: 航空公司","example":"例句: Which airline do you prefer? ｜ 推导: 空中 + 线路 = 航空线路,航空公司"},{"word":"guideline","pos":"n.","detail":"构词: 构词: guide(指导) + line(准线)<br>释义: 指导方针","example":"例句: Follow the safety guidelines. ｜ 推导: 指导 + 准线 = 指导准则,方针"},{"word":"headline","pos":"n.","detail":"构词: 构词: head(头部) + line(行)<br>释义: 大字标题","example":"例句: The headline caught my attention. ｜ 推导: 头部 + 行 = 头条,大字标题"},{"word":"deadline","pos":"n.","detail":"构词: 构词: dead(死的) + line(界线)<br>释义: 截止日期","example":"例句: Meet the project deadline. ｜ 推导: 死亡 + 界线 = 不可逾越的界线,截止期"},{"word":"outline","pos":"n.","detail":"构词: 构词: out(外部) + line(线)<br>释义: 轮廓;大纲","example":"例句: Draw the outline first. ｜ 推导: 外部 + 线 = 外部线条,轮廓"},{"word":"linear","pos":"a.","detail":"构词: 构词: line(线) + ar(形容词后缀)<br>释义: 线性的;直线的","example":"例句: Linear growth is predictable. ｜ 推导: 线 + 形容词化 = 线性的,直线的"},{"word":"liner","pos":"n.","detail":"构词: 构词: line(线路) + er(名词后缀)<br>释义: 班轮;衬里","example":"例句: The ocean liner arrived. ｜ 推导: 线路 + 物 = 定期航线的船,班轮"},{"word":"underline","pos":"v.","detail":"构词: 构词: under(下面) + line(线)<br>释义: 下划线;强调","example":"例句: Underline the key points. ｜ 推导: 下面 + 线 = 划下划线,强调"},{"word":"streamline","pos":"v.","detail":"构词: 构词: stream(流) + line(线)<br>释义: 使流线型","example":"例句: Streamline the process. ｜ 推导: 流 + 线 = 流线型,使简化高效"}],"extra":[]},{"id":296,"root":"med","pronounce":"/med/姆诶德","source":"拉丁语 mederi","meaning":"治疗,医疗","mnemonic":"med可以记成“没得病”。 人生病时去找 doctor、进 hospital 接受治疗；治疗有效以后，身体恢复，变成“没得病”。 所以 med 这一声音从“没得病”反推到治疗、医疗。 所以med就是“治疗、医疗”。","mainWords":[{"word":"medicine","pos":"n.","detail":"构词: 构词: med(治疗) + icine(名词后缀)<br>释义: 药物;医学","example":"例句: Take your medicine three times a day. ｜ 推导: 治疗 + 名词化 = 治疗的手段"},{"word":"medical","pos":"a.","detail":"构词: 构词: med(治疗) + ical(形容词后缀)<br>释义: 医学的,医疗的","example":"例句: She needs medical attention. ｜ 推导: 治疗 + 形容词化 = 与治疗相关的"},{"word":"remedy","pos":"n.","detail":"构词: 构词: re(再) + med(治疗) + y<br>释义: 补救措施 v.补救","example":"例句: There's no remedy for this problem. ｜ 推导: 再 + 治疗 = 再次治疗,补救"}],"extra":["medication n. 药物治疗（构词: med + ication）","meditate v. 冥想（构词: med + itate）","remedial a. 补救的（构词: re + med + ial）","medic n. 医护人员（构词: med + ic）"]},{"id":297,"root":"miss/mise","pronounce":"/mɪs/米斯","source":"拉丁语 mittere","meaning":"发送,派遣,放置","mnemonic":"miss/mise就是“密使”。 密使被派出去传送信息并把物品放到指定地点，所以表示发送、派遣和放置。 所以miss/mise就是“发送、派遣、放置”。","mainWords":[{"word":"mission","pos":"n.","detail":"构词: 构词: miss(发送) + ion(名词后缀)<br>释义: 使命;任务","example":"例句: He completed his mission. ｜ 推导: 发送 + 名词化 = 被派遣去做的事,使命"},{"word":"admission","pos":"n.","detail":"构词: 构词: ad(向) + miss + ion<br>释义: 入场;承认","example":"例句: The admission fee is $10. ｜ 推导: 向内 + 发送 + 名词化 = 准许进入"},{"word":"permission","pos":"n.","detail":"构词: 构词: per(通过) + miss + ion<br>释义: 许可;允许","example":"例句: Ask for permission first. ｜ 推导: 通过 + 发送 + 名词化 = 允许通过"},{"word":"commission","pos":"n.","detail":"构词: 构词: com(共同) + miss + ion<br>释义: 委员会;佣金","example":"例句: The commission met today. ｜ 推导: 共同 + 发送 + 名词化 = 共同委派"},{"word":"transmission","pos":"n.","detail":"构词: 构词: trans(穿过) + miss + ion<br>释义: 传输;传播","example":"例句: Data transmission is fast. ｜ 推导: 穿过 + 发送 + 名词化 = 传输"},{"word":"missile","pos":"n.","detail":"构词: 构词: miss(发送) + ile(可...的)<br>释义: 导弹;投射物","example":"例句: The missile was launched. ｜ 推导: 发送 + 可...的 = 可发射的东⻄,导弹"},{"word":"dismiss","pos":"v.","detail":"构词: 构词: dis(分开) + miss(发送)<br>释义: 解散;解雇","example":"例句: The class was dismissed. ｜ 推导: 分开 + 发送 = 遣散,解散"},{"word":"missionary","pos":"n.","detail":"构词: 构词: miss(派遣) + ion + ary(人)<br>释义: 传教士","example":"例句: The missionary traveled far. ｜ 推导: 派遣 + 名词化 + 人 = 被派遣传教的人"},{"word":"promise","pos":"n./v.","detail":"构词: 构词: pro(向前) + mise(发送)<br>释义: 承诺;许诺","example":""},{"word":"compromise","pos":"n./v.","detail":"构词: 构词: com(共同) + pro + mise<br>释义: 妥协;折衷","example":""},{"word":"premise","pos":"n.","detail":"构词: 构词: pre(在前) + mise(发送)<br>释义: 前提;房屋","example":"例句: The premise is incorrect. ｜ 推导: 在前 + 发送 = 事先提出的,前提"}],"extra":[]},{"id":298,"root":"-mit-","pronounce":"/mɪt/米特","source":"拉丁语 mittere","meaning":"发送,派遣","mnemonic":"为了记忆，可以把MIT记成“Mail It There”。\n\nMail表示把东西寄出；It表示要寄送的对象；There表示明确的目的地。\n\n一封信、一个文件或一个人从这里被送到那里，核心动作都是发送和派遣。三个字母分别提供动作、对象和方向，缺一不可。\n所以mit就是“发送、派遣”的意思。","mainWords":[{"word":"admit","pos":"v.","detail":"构词: 构词: ad(向) + mit(发送)<br>释义: 承认;准许进入","example":"例句: I admit my mistake. ｜ 推导: 向内 + 发送 = 允许进入,承认"},{"word":"commit","pos":"v.","detail":"构词: 构词: com(一起) + mit(发送)<br>释义: 承诺;犯罪","example":"例句: Commit to your goals. ｜ 推导: 一起 + 发送 = 托付,承诺"},{"word":"permit","pos":"v.","detail":"构词: 构词: per(通过) + mit(发送)<br>释义: 允许;许可","example":"例句: Permit me to explain. ｜ 推导: 通过 + 发送 = 让通过,允许"},{"word":"submit","pos":"v.","detail":"构词: 构词: sub(在下) + mit(发送)<br>释义: 提交;屈服","example":"例句: Submit your application. ｜ 推导: 向下 + 发送 = 呈交,屈服"},{"word":"transmit","pos":"v.","detail":"构词: 构词: trans(穿过) + mit(发送)<br>释义: 传送;传播","example":"例句: Transmit the signal. ｜ 推导: 穿过 + 发送 = 传送,传播"},{"word":"omit","pos":"v.","detail":"构词: 构词: o(离开) + mit(发送)<br>释义: 省略;遗漏","example":"例句: Don't omit any details. ｜ 推导: 离开 + 发送 = 发送走,省略"},{"word":"emit","pos":"v.","detail":"构词: 构词: e(出) + mit(发送)<br>释义: 发出;散发","example":"例句: The sun emits light. ｜ 推导: 向外 + 发送 = 发出,散发"},{"word":"committee","pos":"n.","detail":"构词: 构词: com + mit + tee<br>释义: 委员会","example":"例句: The committee meets today. ｜ 推导: 共同 + 发送 + 人 = 被委派的人们"},{"word":"intermittent","pos":"a.","detail":"构词: 构词: inter(之间) + mit + tent<br>释义: 间歇的","example":"例句: Intermittent rain showers. ｜ 推导: 之间 + 发送 = 断续发送的,间歇的"}],"extra":[]},{"id":299,"root":"necess-","pronounce":"/neses/恩诶瑟斯","source":"ne-(不) + cedere(让步)","meaning":"必需的,不可避免的","mnemonic":"可以把NECESS记成“Need Exists, Choice Ends; Start Start”。\n\nNeed Exists表示这件事确实有必要；Choice Ends表示已经没有“做还是不做”的选择；Start Start表示学生不得不开始它，重要的事情说两遍。\n\n想象老师布置了一项必须完成的任务：只要这个need存在，选择就结束了，学生不能逃开，只能开始做。没有选择、不能回避的事情，就是必需的、不可避免的。\n\n所以necess-就是“必需的、不可避免的”的意思。","mainWords":[{"word":"necessary","pos":"a.","detail":"构词: 构词: necess(必需) + ary(形容词后缀)<br>释义: 必需的;必要的","example":"例句: Food is necessary for survival. ｜ 推导: 必需 + 形容词化 = 必需的,必要的"},{"word":"necessity","pos":"n.","detail":"构词: 构词: necess(必需) + ity(名词后缀)<br>释义: 必要性;必需品","example":"例句: Water is a basic necessity. ｜ 推导: 必需 + 名词化 = 必要性,必需品"},{"word":"necessitate","pos":"v.","detail":"构词: 构词: necess + it + ate(动词后缀)<br>释义: 使成为必需","example":"例句: Budget cuts necessitate layoffs. ｜ 推导: 必需 + 动词化 = 使成为必需,迫使"}],"extra":["necessarily ad. 必然地（构词: necessary + ly）","unnecessary a. 不必要的（构词: un + necessary）","necessities n. 必需品(复数) (necessity的复数)","necessitous a. 贫困的（构词: necess + itous）"]},{"id":300,"root":"quant-","pronounce":"/kwɒnt/克乌奥恩特","source":"拉丁语 quantus","meaning":"多少,数量","mnemonic":"quant与小学词 count 形近音近。count 是数一数有多少，数出的结果就是数量。所以quant就是“多少、数量”。","mainWords":[{"word":"quantity","pos":"n.","detail":"构词: 构词: quant(多少) + ity(名词后缀)<br>释义: 数量;量","example":"例句: A large quantity of goods. ｜ 推导: 多少 + 名词化 = 数量"},{"word":"quantitative","pos":"a.","detail":"构词: 构词: quantity + ative(形容词后缀)<br>释义: 定量的","example":"例句: Quantitative analysis is precise. ｜ 推导: 数量 + 形容词化 = 数量的,定量的"},{"word":"quantify","pos":"v.","detail":"构词: 构词: quant(多少) + ify(动词后缀)<br>释义: 量化;确定数量","example":"例句: It's hard to quantify happiness. ｜ 推导: 多少 + 动词化 = 使成为可测量的量"},{"word":"quota","pos":"n.","detail":"构词: 构词: quot(多少) + a<br>释义: 定额;配额","example":"例句: Meet the sales quota. ｜ 推导: 多少 + 名词化 = 规定的数量,定额"}],"extra":["quantum n. 量子;定量（构词: quant + um）","quantifiable a. 可量化的（构词: quant + ifiable）","quantification n. 量化（构词: quant + ification）","quantifier n. 量词（构词: quant + ifier）"]},{"id":301,"root":"roll/rol-","pronounce":"/roʊl/儿欧勒","source":"拉丁语 rotulus","meaning":"滚动,卷轴","mnemonic":"roll/rol中的roll本身就是熟词roll，拼写和读音都不用变化；另一变体rol也与它形近音近。roll 是滚动，也可以把纸卷成卷轴，所以roll/rol就是“滚动、卷轴”。","mainWords":[{"word":"roll","pos":"v.","detail":"构词: 构词: roll(滚动/卷轴)<br>释义: 滚动;卷 n.卷;名单","example":"例句: Roll the ball down the hill. ｜ 推导: 滚动/卷轴 = 滚动,卷起"},{"word":"role","pos":"n.","detail":"构词: 构词: rol(卷轴) + e<br>释义: ⻆色;作用","example":"例句: She plays a leading role. ｜ 推导: 卷轴(剧本) = 剧本上的⻆色"},{"word":"control","pos":"v./n.","detail":"构词: 构词: cont(相对) + rol(卷轴)<br>释义: 控制","example":"例句: Control your emotions. ｜ 推导: 对照 + 账本卷轴 = 核对掌控,控制"},{"word":"enroll","pos":"v.","detail":"构词: 构词: en(使) + roll(卷轴)<br>释义: 登记;入学","example":"例句: Enroll in the university. ｜ 推导: 使 + 入卷轴 = 登记入册"},{"word":"patrol","pos":"v./n.","detail":"构词: 构词: pat + rol(滚动) [词源混合]<br>释义: 巡逻","example":"例句: Police patrol the streets. ｜ 推导: 来回 + 滚动 = 巡逻"},{"word":"stroll","pos":"v./n.","detail":"构词: 构词: st + roll(滚动) [可能相关]<br>释义: 漫步","example":"例句: Let's stroll in the park. ｜ 推导: 慢慢 + 滚动 = 闲逛漫步"},{"word":"trolley","pos":"n.","detail":"构词: 构词: troll(滚动) + ey [可能相关]<br>释义: 手推车;电车","example":"例句: Push the shopping trolley. ｜ 推导: 滚动 + 名词化 = 有轮子的推车"}],"extra":[]},{"id":302,"root":"shut-","pronounce":"/ʃʌt/诗阿特","source":"古英语 *scyttan*","meaning":"关闭,闩上","mnemonic":"以后看到shut，可以想象把门推到完全合上。开口被挡住，里面和外面不再相通，就是关闭；再插上门闩，就是闩上。所以shut就是“关闭、闩上”。","mainWords":[{"word":"shut","pos":"v.","detail":"构词: 构词: shut(关闭)<br>释义: 关闭,关上","example":"例句: Please shut the door. ｜ 推导: 关闭 = 基础动作,关上"},{"word":"shuttle","pos":"n.","detail":"构词: 构词: shut + tle(名词后缀)<br>释义: 航天飞机;穿梭","example":"例句: The shuttle service runs hourly. ｜ 推导: 滑动 + 名词化 = 往复滑动的物体"},{"word":"shutter","pos":"n.","detail":"构词: 构词: shut + ter(工具后缀)<br>释义: 百叶窗;快门","example":"例句: The camera shutter clicked. ｜ 推导: 关闭 + 工具 = 用于关闭的装置"}],"extra":["shutdown n. 关闭;停工（构词: shut + down）","shutout n. 完封;拒之门外（构词: shut + out）","shuttlecock n. 羽毛球（构词: shuttle + cock）","shutoff n. 关闭装置（构词: shut + off）"]},{"id":303,"root":"stick","pronounce":"/stɪk/斯提克","source":"古英语 stician","meaning":"刺,固定,粘贴","mnemonic":"stick就是小学学过的单词，拼写和读音都不用变化。stick 可以刺入、固定，也可以粘贴在表面，所以stick就是“刺、固定、粘贴”。","mainWords":[{"word":"stick","pos":"n.","detail":"构词: 构词: stick(刺/固定)<br>释义: 棍子 v.粘贴;刺","example":"例句: Stick the stamp on the envelope. ｜ 推导: 刺入 → 固定 → 粘贴"},{"word":"sticky","pos":"a.","detail":"构词: 构词: stick + y(形容词后缀)<br>释义: 粘的,粘性的","example":"例句: My hands are sticky. ｜ 推导: 粘贴 + 形容词化 = 有粘性的"},{"word":"sticker","pos":"n.","detail":"构词: 构词: stick + er(名词后缀)<br>释义: 贴纸,标签","example":"例句: Put a sticker on your notebook. ｜ 推导: 粘贴 + 名词化 = 粘贴物,贴纸"},{"word":"lipstick","pos":"n.","detail":"构词: 构词: lip(嘴唇) + stick(棍)<br>释义: 口红","example":"例句: She applied red lipstick. ｜ 推导: 嘴唇 + 棍状物 = 唇膏,口红"}],"extra":["chopstick n. 筷子（构词: chop + stick）","drumstick n. 鼓槌;鸡腿（构词: drum + stick）","joystick n. 操纵杆（构词: joy + stick）","candlestick n. 烛台（构词: candle + stick）"]},{"id":304,"root":"take","pronounce":"/teɪk/特诶克","source":"古诺尔斯语 taka","meaning":"拿取,获取","mnemonic":"take本身就是我们小学学过的take。 take 就是“拿、获取、接受”。 所以take就是“拿取、获取”。","mainWords":[{"word":"take","pos":"v.","detail":"构词: 构词: take(拿取)<br>释义: 拿;获取;接受","example":"例句: Take this book with you. ｜ 推导: 拿取 = 获得,接受"},{"word":"mistake","pos":"n.","detail":"构词: 构词: mis(错误) + take(拿)<br>释义: 错误 v.误解","example":"例句: Everyone makes mistakes. ｜ 推导: 错误地 + 拿 = 拿错了,错误"},{"word":"undertake","pos":"v.","detail":"构词: 构词: under(在下) + take(拿)<br>释义: 承担;从事","example":"例句: He undertook the project. ｜ 推导: 在下面 + 拿 = 拿到肩上,承担"},{"word":"overtake","pos":"v.","detail":"构词: 构词: over(越过) + take(拿)<br>释义: 超过;赶上","example":"例句: The car overtook the truck. ｜ 推导: 越过 + 拿 = 拿到前面去,超过"}],"extra":["intake n. 摄入量（构词: in(进入) + take）","uptake n. 理解;吸收（构词: up(向上) + take）","retake v. 重新获得（构词: re(重新) + take）","partake v. 参与;分享（构词: part(部分) + take）"]},{"id":305,"root":"vok-/voc-","pronounce":"/vok/五克","source":"拉丁语 vocare","meaning":"呼喊,召唤","mnemonic":"vok-/voc就是“voice”。voice会让人直接想到“呼喊”，由这个意思还可以继续推出召唤，所以vok-/voc就是“呼喊,召唤”的意思。","mainWords":[{"word":"provoke","pos":"v.","detail":"构词: 构词: pro(向前) + vok(喊) + e<br>释义: 激怒;挑衅","example":"例句: Don't provoke the angry dog. ｜ 推导: 向前 + 呼喊 = 向前挑衅,激怒"},{"word":"evoke","pos":"v.","detail":"构词: 构词: e(向外) + vok(喊) + e<br>释义: 唤起;引起","example":"例句: The music evoked memories. ｜ 推导: 向外 + 呼喊 = 召唤出来,唤起"},{"word":"voice","pos":"n.","detail":"构词: 构词: voc(呼喊)的变体<br>释义: 声音;嗓音","example":"例句: She has a beautiful voice. ｜ 推导: 呼喊 → 发声器官,声音"},{"word":"vocal","pos":"a.","detail":"构词: 构词: voc(呼喊) + al(形容词后缀)<br>释义: 声音的;直言的","example":"例句: He is very vocal about his views. ｜ 推导: 呼喊 + 形容词化 = 声音的,直言的"},{"word":"advocate","pos":"v.","detail":"构词: 构词: ad(向) + voc(喊) + ate<br>释义: 提倡;拥护","example":"例句: They advocate for human rights. ｜ 推导: 向着 + 呼喊 = 大声支持,提倡"},{"word":"vocation","pos":"n.","detail":"构词: 构词: voc(召唤) + ation(名词后缀)<br>释义: 职业;天职","example":"例句: Teaching is her vocation. ｜ 推导: 召唤 + 名词化 = 天职,使命召唤"},{"word":"vocabulary","pos":"n.","detail":"构词: 构词: voc(呼喊) + abulary(集合后缀)<br>释义: 词汇;词汇量","example":"例句: Expand your vocabulary daily. ｜ 推导: 呼喊 + 集合 = 用于表达的词语集合"}],"extra":[]},{"id":306,"root":"volv-","pronounce":"/vɒlv/五奥勒五","source":"拉丁语 volvere","meaning":"滚动,转动","mnemonic":"volv就是沃尔沃Volvo。汽车最明显的运动就是车轮不断滚动和转动，Volvo的名字也能让人直接想到车轮旋转，所以volv就是“滚动、转动”的意思。","mainWords":[{"word":"revolve","pos":"v.","detail":"构词: 构词: re(回) + volv(转) + e<br>释义: 旋转;循环","example":"例句: The earth revolves around the sun. ｜ 推导: 回 + 转 = 循环转动,旋转"},{"word":"revolution","pos":"n.","detail":"构词: 构词: re + volv + ution(名词后缀)<br>释义: 革命;旋转","example":"例句: The industrial revolution changed history. ｜ 推导: 回转 + 名词化 = 大转变,革命"},{"word":"evolve","pos":"v.","detail":"构词: 构词: e(出) + volv(转) + e<br>释义: 进化;演变","example":"例句: Species evolve over time. ｜ 推导: 出 + 转 = 展开发展,进化"},{"word":"involve","pos":"v.","detail":"构词: 构词: in(入) + volv(卷) + e<br>释义: 涉及;包含","example":"例句: The project involves many people. ｜ 推导: 入 + 卷 = 卷入其中,涉及"},{"word":"revolt","pos":"v./n.","detail":"构词: 构词: re(反) + volt(转)<br>释义: 反抗;起义","example":"例句: The people revolted against tyranny. ｜ 推导: 反 + 转 = 反转秩序,反抗"},{"word":"evolution","pos":"n.","detail":"构词: 构词: e + volv + ution<br>释义: 进化;演变","example":"例句: Darwin's theory of evolution. ｜ 推导: 展开 + 名词化 = 进化过程"},{"word":"revolutionary","pos":"a.","detail":"构词: 构词: revolution + ary(形容词后缀)<br>释义: 革命的","example":"例句: A revolutionary new technology. ｜ 推导: 革命 + 形容词化 = 革命性的"},{"word":"volume","pos":"n.","detail":"构词: 构词: vol(卷) + ume(名词后缀)<br>释义: 体积;音量","example":"例句: Turn up the volume please. ｜ 推导: 卷轴 → 厚度 → 体积,容量"}],"extra":[]},{"id":307,"root":"","pronounce":"/səm/瑟姆","source":"古英语形容词后缀","meaning":"有些...的,具有...特征的","mnemonic":"-some就是小学词 some。some 表示“有一些”；接在一个词后面，就像说某个对象身上“有一些这种特点”，所以表示具有某种特征。所以-some就是“有些……的、具有……特征的”。","mainWords":[{"word":"some","pos":"a.","detail":"构词: 构词: some(一些,有些)<br>释义: 一些 pron.一些","example":"例句: I need some help. ｜ 推导: 原始词 = 一些,若干,有些"},{"word":"troublesome","pos":"a.","detail":"构词: 构词: trouble(烦恼) + some(有些...的)<br>释义: 令人烦恼的","example":"例句: It's a troublesome problem. ｜ 推导: 烦恼 + 有些 = 有些烦恼的,麻烦的"},{"word":"awesome","pos":"a.","detail":"构词: 构词: awe(敬畏) + some(有些...的)<br>释义: 令人敬畏的","example":"例句: The view is awesome! ｜ 推导: 敬畏 + 有些 = 令人敬畏的,了不起的"},{"word":"handsome","pos":"a.","detail":"构词: 构词: hand(手,得体) + some(有些...的)<br>释义: 英俊的","example":"例句: He is a handsome man. ｜ 推导: 得体 + 有些 = 有些得体的,英俊的"},{"word":"tiresome","pos":"a.","detail":"构词: 构词: tire(厌倦) + some(有些...的)<br>释义: 使人厌倦的","example":"例句: The meeting was tiresome. ｜ 推导: 厌倦 + 有些 = 使人厌倦的,讨厌的"},{"word":"wholesome","pos":"a.","detail":"构词: 构词: whole(完整,健全) + some(有些...的)<br>释义: 有益健康的","example":"例句: Eat wholesome food. ｜ 推导: 健全 + 有些 = 有益健康的,健康的"}],"extra":["fearsome a. 可怕的（构词: fear + some）","burdensome a. 繁重的（构词: burden + some）","lonesome a. 孤独的（构词: lone + some）","quarrelsome a. 好争吵的（构词: quarrel + some）","bothersome a. 令人讨厌的（构词: bother + some）","cumbersome a. 笨重的（构词: cumber + some）","wearisome a. 令人疲倦的（构词: weary + some）","winsome a. 迷人的（构词: win + some）"]},{"id":308,"root":"bel","pronounce":"/bel/布诶勒","source":"拉丁语 bellum","meaning":"暴乱,战争","mnemonic":"bel就是“暴乱”。暴乱是大规模冲突，冲突继续扩大就会发展成战争，所以bel就是“暴乱,战争”的意思。","mainWords":[{"word":"rebel","pos":"v.","detail":"构词: 构词: re(反) + bel(暴乱)<br>释义: 反抗 n.叛逆者","example":"例句: The people rebel against tyranny. ｜ 推导: 反 + 暴乱 = 反抗,造反"},{"word":"rebellion","pos":"n.","detail":"构词: 构词: re + bel + lion(名词后缀)<br>释义: 叛乱,反抗","example":"例句: The rebellion was crushed. ｜ 推导: 反 + 暴乱 + 名词化 = 叛乱,起义"}],"extra":["rebellious a. 反叛的（构词: re + bel + ious）","postbellum a. 战后的（构词: post + bel + um）","rebelliously ad. 反叛地（构词: rebellious + ly）","bellicosity n. 好战性（构词: bel + icosity）","rebelliousness n. 叛逆性（构词: rebellious + ness）","belligerence n. 交战状态（构词: bel + igerence）","bellicose a. 好战的（构词: bel + icose）","bellum n. 战争（构词: bel + um）","belligerent a. 交战的（构词: bel + iger + ent）","casus belli n. 开战理由 (含bel)","antebellum a. 战前的（构词: ante + bel + um）","rebelling n. 反叛行为（构词: rebel + ing）"]},{"id":309,"root":"board","pronounce":"/bɔːrd/博儿德","source":"英语 (板)","meaning":"板,木板","mnemonic":"board本身就是我们小学学过的board。 board 就是“板、委员会、登船”。 所以board就是“板、木板”。","mainWords":[{"word":"board","pos":"n.","detail":"构词: 构词: board(板)<br>释义: 板;委员会 v.登船","example":"例句: Please board the plane. ｜ 推导: 板 = 木板;登上(船板)"},{"word":"aboard","pos":"ad./prep.","detail":"构词: 构词: a(在) + board(板)<br>释义: 在船上","example":"例句: All aboard! ｜ 推导: 在 + 板上 = 在船上,在车上"},{"word":"keyboard","pos":"n.","detail":"构词: 构词: key(键) + board(板)<br>释义: 键盘","example":"例句: Type on the keyboard. ｜ 推导: 键 + 板 = 装有按键的板"},{"word":"cupboard","pos":"n.","detail":"构词: 构词: cup(杯子) + board(板)<br>释义: 碗柜,橱柜","example":"例句: Put the cups in the cupboard. ｜ 推导: 杯子 + 板 = 放杯子的橱柜"},{"word":"blackboard","pos":"n.","detail":"构词: 构词: black(黑色) + board(板)<br>释义: 黑板","example":"例句: Write on the blackboard. ｜ 推导: 黑色 + 板 = 黑板"},{"word":"billboard","pos":"n.","detail":"构词: 构词: bill(广告) + board(板)<br>释义: 广告牌","example":"例句: A huge billboard on the highway. ｜ 推导: 广告 + 板 = 广告牌"}],"extra":["boardroom n. 会议室（构词: board + room）","boardwalk n. 木板路（构词: board + walk）","surfboard n. 冲浪板（构词: surf + board）","signboard n. 招牌（构词: sign + board）","onboard a. 在船上的（构词: on + board）","boarding n. 登机,寄宿（构词: board + ing）","skateboard n. 滑板（构词: skate + board）","boarder n. 寄宿生（构词: board + er）"]},{"id":310,"root":"-ceive/-cept-","pronounce":"/siːv/斯衣五","source":"","meaning":"拿,抓住,获取","mnemonic":"ceive/-cept从我们小学学过的receive和accept里记。receive是收到、拿到，accept是接受、接住，两个词共同保留的动作都是把东西拿到手里，所以ceive/-cept就是“拿,表示,获取”的意思。","mainWords":[{"word":"receive","pos":"v.","detail":"构词: 构词: re(回来) + ceive(拿)<br>释义: 收到,接收","example":"例句: I received your message. ｜ 推导: 回来 + 拿 = 拿回来,收到"},{"word":"perceive","pos":"v.","detail":"构词: 构词: per(通过) + ceive(拿)<br>释义: 感知,察觉","example":"例句: She perceived the danger. ｜ 推导: 通过 + 拿 = 通过感官获取,感知"},{"word":"conceive","pos":"v.","detail":"构词: 构词: con(一起) + ceive(拿)<br>释义: 构想,怀孕","example":"例句: They conceived a new plan. ｜ 推导: 一起 + 拿 = 把想法聚在一起,构想"},{"word":"deceive","pos":"v.","detail":"构词: 构词: de(离开) + ceive(拿)<br>释义: 欺骗","example":"例句: Don't deceive yourself. ｜ 推导: 离开 + 拿 = 拿走真相,欺骗"},{"word":"accept","pos":"v.","detail":"构词: 构词: ac(向着) + cept(拿)<br>释义: 接受","example":"例句: Please accept my apology. ｜ 推导: 向着 + 拿 = 向自己拿来,接受"},{"word":"concept","pos":"n.","detail":"构词: 构词: con(一起) + cept(拿)<br>释义: 概念","example":"例句: It's a difficult concept. ｜ 推导: 一起 + 拿 = 把想法聚拢,概念"},{"word":"except","pos":"prep.","detail":"构词: 构词: ex(出来) + cept(拿)<br>释义: 除了","example":"例句: Everyone except Tom came. ｜ 推导: 出来 + 拿 = 拿出来,排除"},{"word":"exception","pos":"n.","detail":"构词: 构词: except + ion(名词后缀)<br>释义: 例外","example":"例句: There's no exception to this rule. ｜ 推导: 排除 + 名词化 = 被排除的事物,例外"},{"word":"acceptance","pos":"n.","detail":"构词: 构词: accept + ance(名词后缀)<br>释义: 接受,认可","example":""},{"word":"reception","pos":"n.","detail":"构词: 构词: re + cept + ion<br>释义: 接待;接收","example":""},{"word":"exceptional","pos":"a.","detail":"构词: 构词: exception + al(形容词后缀)<br>释义: 例外的;杰出的","example":"例句: She has exceptional talent. ｜ 推导: 例外 + 形容词化 = 超出常规的"},{"word":"susceptible","pos":"a.","detail":"构词: 构词: sus(在下) + cept + ible<br>释义: 易受影响的","example":"例句: Children are susceptible to colds. ｜ 推导: 在下 + 拿 + 能够 = 容易被抓住的"},{"word":"receipt","pos":"n.","detail":"构词: 构词: re + ceit(拿的变体)<br>释义: 收据;收到","example":"例句: Keep your receipt. ｜ 推导: 回来 + 拿 = 收到的凭证"},{"word":"deceit","pos":"n.","detail":"构词: 构词: de(离开) + ceit(拿的变体)<br>释义: 欺骗","example":"例句: His deceit was exposed. ｜ 推导: 离开 + 拿 = 拿走真相的行为"}],"extra":[]},{"id":311,"root":"chem","pronounce":"/kem/克诶姆","source":"希腊语(炼金术)","meaning":"化学,变成","mnemonic":"chem是我们学过的chemistry的一部分。chemistry就是化学，化学反应最明显的结果就是一种物质变成另一种物质，所以chem就是“化学,变成”的意思。","mainWords":[{"word":"chemistry","pos":"n.","detail":"构词: 构词: chem(化学) + istry(学科后缀)<br>释义: 化学","example":"例句: I study chemistry at university. ｜ 推导: 化学 + 学科 = 化学学科"},{"word":"chemical","pos":"a.","detail":"构词: 构词: chem(化学) + ical(形容词后缀)<br>释义: 化学的 n.化学品","example":"例句: Avoid harmful chemicals. ｜ 推导: 化学 + 形容词化 = 化学的;化学制品"},{"word":"chemist","pos":"n.","detail":"构词: 构词: chem(化学) + ist(从业者后缀)<br>释义: 化学家;药剂师","example":"例句: The chemist works in a lab. ｜ 推导: 化学 + 从业者 = 化学家,药剂师"}],"extra":["chemically ad. 化学地（构词: chemical + ly）","photochemical a. 光化学的（构词: photo + chemical）","biochemistry n. 生物化学（构词: bio + chemistry）","petrochemical n. 石油化工（构词: petro + chemical）","biochemical a. 生化的（构词: bio + chemical）","geochemistry n. 地球化学（构词: geo + chemistry）","chemotherapy n. 化疗（构词: chem + therapy）","electrochemical a. 电化学的（构词: electro + chemical）","alchemist n. 炼金术士（构词: al + chemist）","thermochemistry n. 热化学（构词: thermo + chemistry）"]},{"id":312,"root":"grace","pronounce":"/greɪs/格儿诶斯","source":"拉丁语 gratia","meaning":"优雅,优美","mnemonic":"grace就是“Grace”。Grace会让人直接想到“优雅”，由这个意思还可以继续推出优美，所以grace就是“优雅,优美”的意思。","mainWords":[{"word":"grace","pos":"n.","detail":"构词: 构词: grace(优雅)<br>释义: 优美,恩惠","example":"例句: She moved with natural grace. ｜ 推导: 原始词根 = 优雅,优美,恩惠"},{"word":"graceful","pos":"a.","detail":"构词: 构词: grace(优雅) + ful(形容词后缀)<br>释义: 优美的,文雅的","example":"例句: Her movements are graceful. ｜ 推导: 优雅 + 充满 = 充满优雅的,优美的"},{"word":"gracious","pos":"a.","detail":"构词: 构词: grac(优雅) + ious(形容词后缀)<br>释义: 亲切的,仁慈的","example":"例句: She is a gracious hostess. ｜ 推导: 优雅 + 形容词化 = 优雅待人的,亲切的"},{"word":"disgrace","pos":"n.","detail":"构词: 构词: dis(否定) + grace(优雅)<br>释义: 耻辱 v.使丢脸","example":"例句: His behavior is a disgrace. ｜ 推导: 不 + 优雅 = 不优雅,耻辱,丢脸"}],"extra":["gracefully ad. 优雅地（构词: graceful + ly）","disgraceful a. 可耻的（构词: dis + graceful）","graceless a. 不优雅的（构词: grace + less）","ungracious a. 不礼貌的（构词: un + gracious）","ungraceful a. 不优美的（构词: un + graceful）","gracile a. 纤细优雅的（构词: grac + ile）","graciously ad. 亲切地（构词: gracious + ly）","gracefulness n. 优雅（构词: graceful + ness）"]},{"id":313,"root":"ident","pronounce":"/aɪˈdent/爱德诶恩特","source":"拉丁语 (相同)","meaning":"相同,一样","mnemonic":"ident就是“一等”。两个东西处在同一等、每个细节都对得上，就可以认为它们相同、一样。所以ident就是“相同、一样”。","mainWords":[{"word":"identical","pos":"a.","detail":"构词: 构词: ident(相同) + ical(形容词后缀)<br>释义: 同一的,同样的","example":"例句: The twins are identical. ｜ 推导: 相同 + 形容词化 = 同一的,完全相同的"},{"word":"identify","pos":"v.","detail":"构词: 构词: ident(相同) + ify(使...化)<br>释义: 识别,鉴别","example":"例句: Can you identify the suspect? ｜ 推导: 使相同 = 确认是否相同,识别"},{"word":"identity","pos":"n.","detail":"构词: 构词: ident(相同) + ity(名词后缀)<br>释义: 身份;同一性","example":"例句: Please show your identity card. ｜ 推导: 相同性 = 身份的同一性,身份"},{"word":"identification","pos":"n.","detail":"构词: 构词: ident(相同) + ification(过程)<br>释义: 识别;认同","example":"例句: We need proper identification. ｜ 推导: 使相同的过程 = 识别,身份证明"}],"extra":["identifiable a. 可识别的（构词: ident + ifiable）","misidentify v. 误认（构词: mis + ident + ify）","identifier n. 识别符（构词: ident + ifier）","ID n. 身份证明 (identity缩写)","identically ad. 同样地（构词: ident + ically）","identicalness n. 同一性（构词: ident + icalness）","unidentified a. 未识别的（构词: un + ident + ified）","identified a. 被识别的（构词: ident + ified）"]},{"id":314,"root":"insul","pronounce":"/ˈɪnsəl/衣恩瑟勒","source":"in(在) + sol(单独)","meaning":"孤立,隔离","mnemonic":"insul就是“硬塑”。硬塑料经常被用作绝缘层，把里面和外面隔开；一旦隔开，就处在孤立状态。所以insul就是“孤立、隔离”的意思。","mainWords":[{"word":"insulate","pos":"vt.","detail":"构词: 构词: insul(孤立) + ate(动词后缀)<br>释义: 隔离,使绝缘","example":"例句: We need to insulate the wires. ｜ 推导: 孤立 + 动词化 = 使隔离,使绝缘"},{"word":"peninsula","pos":"n.","detail":"构词: 构词: pen(近似) + insul(孤立) + a<br>释义: 半岛","example":"例句: Italy is a peninsula. ｜ 推导: 近似 + 孤立 = 近似孤立的陆地,半岛"}],"extra":["insulation n. 绝缘,隔离（构词: insul + ation）","insulative a. 隔热的（构词: insul + ative）","insulator n. 绝缘体（构词: insul + ator）","uninsulated a. 未绝缘的（构词: un + insul + ated）","insular a. 岛的,孤立的（构词: insul + ar）","insulated a. 绝缘的（构词: insul + ated）","insularity n. 岛国性,偏狭（构词: insul + arity）","isle n. 小岛 (与insul同源)","insulating a. 绝缘的（构词: insul + ating）","island n. 岛屿 (与insul同源)","peninsular a. 半岛的（构词: pen + insul + ar）","insulant n. 绝缘材料（构词: insul + ant）"]},{"id":315,"root":"isl/isol","pronounce":"/aɪsl/爱斯勒","source":"拉丁语 insula","meaning":"孤立,隔离","mnemonic":"isl/isol是我们小学学过的island的一部分。island就是岛，岛的四周都是水，与大陆分开，天然处在孤立和隔离状态。所以isl/isol就是“孤立、隔离”的意思。","mainWords":[{"word":"island","pos":"n.","detail":"构词: 构词: isl(孤立) + land(陆地)<br>释义: 岛,岛屿","example":"例句: We spent our vacation on the island. ｜ 推导: 孤立 + 陆地 = 被水包围的孤立陆地"},{"word":"isolate","pos":"vt.","detail":"构词: 构词: isol(孤立) + ate(动词后缀)<br>释义: 隔离,孤立","example":"例句: They had to isolate the patient. ｜ 推导: 孤立 + 动词化 = 使孤立,隔离"},{"word":"isle","pos":"n.","detail":"构词: 构词: isl(孤立) + e(结尾)<br>释义: 小岛(用于诗歌中)","example":"例句: The ship sailed past the isle. ｜ 推导: 孤立 = 孤立的小岛(诗意表达)"}],"extra":["isolation n. 隔离,孤立（构词: isol + ation）","islander n. 岛民（构词: island + er）","isolated a. 孤立的（构词: isol + ated）","islet n. 小岛（构词: isl + et）","isolating a. 隔离的（构词: isol + ating）","insular a. 岛的;狭隘的（构词: insul(=isl) + ar）","isolator n. 隔离器（构词: isol + ator）","peninsula n. 半岛（构词: pen + insula）"]},{"id":316,"root":"miser","pronounce":"/ˈmɪzər/米泽儿","source":"mis(坏) + er","meaning":"痛苦,苦难","mnemonic":"miser就是“迷失了”。一个人在困境中迷失方向，找不到出路，就会承受痛苦和苦难。所以miser就是“痛苦、苦难”的意思。","mainWords":[{"word":"miserable","pos":"a.","detail":"构词: 构词: miser(痛苦) + able(形容词后缀)<br>释义: 痛苦的,悲惨的","example":"例句: He felt miserable after the loss. ｜ 推导: 痛苦 + 形容词化 = 痛苦的,悲惨的"},{"word":"misery","pos":"n.","detail":"构词: 构词: miser(痛苦) + y(名词后缀)<br>释义: 痛苦,悲惨","example":"例句: War brings misery to people. ｜ 推导: 痛苦 + 名词化 = 痛苦,苦难"}],"extra":["miserably ad. 痛苦地（构词: miser + ably）","miserableness n. 悲惨（构词: miserable + ness）","commiserate v. 同情（构词: com + miser + ate）","commiserative a. 同情的（构词: com + miser + ative）","commiseration n. 同情（构词: com + miser + ation）","miseries n. 痛苦(复数) (misery的复数)","miser n. 守财奴 (miser苦难之人)","miserly a. 吝啬的（构词: miser + ly）"]},{"id":317,"root":"munus/mun","pronounce":"/muːnʌs/姆乌恩阿斯","source":"拉丁语 munus","meaning":"职责,义务,服务","mnemonic":"munus/mun可以把完整形式 munus 记成moon + us。 想象 moon 升起以后，轮到 us 值夜班。我们要一起 work，守住岗位、完成分内任务，还要为我们提供 help。 月下值班的场景同时包含职责、义务和服务。 所以munus/mun就是“职责、义务、服务”。","mainWords":[{"word":"community","pos":"n.","detail":"构词: 构词: com(共同) + mun(职责) + ity<br>释义: 社区,共同体","example":"例句: We live in a small community. ｜ 推导: 共同 + 职责 = 共同承担责任的群体"},{"word":"communicate","pos":"v.","detail":"构词: 构词: com(共同) + mun(服务) + icate<br>释义: 交流,传达","example":"例句: We communicate by email. ｜ 推导: 共同 + 服务 = 相互服务,交流"},{"word":"communication","pos":"n.","detail":"构词: 构词: com + mun + ication<br>释义: 通讯,交流","example":"例句: Good communication is important. ｜ 推导: 相互服务的过程 = 通讯,沟通"},{"word":"communism","pos":"n.","detail":"构词: 构词: com(共同) + mun(责任) + ism<br>释义: 共产主义","example":"例句: The theory of communism. ｜ 推导: 共同 + 责任 + 主义 = 共产主义"},{"word":"immune","pos":"a.","detail":"构词: 构词: im(不) + mun(义务) + e<br>释义: 免疫的,豁免的","example":"例句: He is immune to the disease. ｜ 推导: 不 + 义务 = 免除义务,免疫"},{"word":"municipal","pos":"a.","detail":"构词: 构词: mun(公共职责) + icipal<br>释义: 市政的,市立的","example":"例句: The municipal government. ｜ 推导: 承担公共职责的 = 市政的"}],"extra":["commune n. 公社 v.交流（构词: com + mun）","communist n. 共产主义者（构词: commun + ist）","communal a. 公共的（构词: commun + al）","municipality n. 市政当局（构词: mun + icipality）","immunity n. 免疫力（构词: im + mun + ity）","remunerate v. 酬报（构词: re + mun + erate）","immunize v. 使免疫（构词: im + mun + ize）","munificent a. 慷慨的（构词: mun + ificent）"]},{"id":318,"root":"per- (imper-)","pronounce":"/pər/珀儿","source":"拉丁语 imperare","meaning":"命令,统治","mnemonic":"这一行真正要抓的是imper-，不要把它和普通的 per- 混在一起。 imper- 可以记成“硬逼”。一个有 power 的统治者硬逼别人照命令执行，就是发号施令和 rule。 所以以后看到 imper-，就想到“凭权力硬逼别人服从”。 所以imper-就是“命令、统治”。","mainWords":[{"word":"empire","pos":"n.","detail":"构词: 构词: em + pir(命令) + e<br>释义: 帝国","example":"例句: The Roman Empire was vast. ｜ 推导: 命令 + 名词化 = 行使命令权的领域,帝国"},{"word":"emperor","pos":"n.","detail":"构词: 构词: em + per(命令) + or(人)<br>释义: 皇帝","example":"例句: The emperor ruled wisely. ｜ 推导: 命令 + 人 = 发号施令的人,皇帝"},{"word":"imperial","pos":"a.","detail":"构词: 构词: im + per(命令) + ial<br>释义: 帝国的;皇帝的","example":"例句: The imperial palace is grand. ｜ 推导: 命令 + 形容词化 = 帝国的,皇帝的"},{"word":"imperative","pos":"a.","detail":"构词: 构词: im + per(命令) + ative<br>释义: 必要的;命令的","example":"例句: It is imperative to act now. ｜ 推导: 命令 + 形容词化 = 命令性的,必须的"}],"extra":["imperious a. 专横的;傲慢的（构词: im + per + ious）","empress n. 女皇;皇后（构词: em + pr + ess）","imperium n. 统治权;帝权（构词: im + per + ium）","imperialism n. 帝国主义（构词: imperial + ism）","emperorship n. 皇位（构词: emperor + ship）","imperialist n. 帝国主义者（构词: imperial + ist）"]},{"id":319,"root":"","pronounce":"/sʌm/斯阿姆","source":"","meaning":"某个,某些(不确定的)","mnemonic":"some本身就是我们小学学过的some。 some 就是“一些、某些”。 some 只说某个或某些，却没有确定指出是哪一个。 所以some就是“某个、某些（不确定的）”。","mainWords":[{"word":"something","pos":"pron.","detail":"构词: 构词: some(某个) + thing(事物)<br>释义: 某事,某物","example":"例句: I want to tell you something. ｜ 推导: 某个 + 事物 = 某件事,某个东⻄"},{"word":"someone","pos":"pron.","detail":"构词: 构词: some(某个) + one(一个人)<br>释义: 某人","example":"例句: Someone is waiting for you. ｜ 推导: 某个 + 人 = 某个人"},{"word":"sometimes","pos":"ad.","detail":"构词: 构词: some(某些) + times(时候)<br>释义: 有时,间或","example":"例句: Sometimes I feel lonely. ｜ 推导: 某些 + 时候 = 有时候"},{"word":"somebody","pos":"pron.","detail":"构词: 构词: some(某个) + body(身体→人)<br>释义: 某人","example":"例句: Somebody left their bag here. ｜ 推导: 某个 + 人 = 某个人"},{"word":"somewhere","pos":"ad.","detail":"构词: 构词: some(某个) + where(地方)<br>释义: 某地,某处","example":"例句: Let's go somewhere quiet. ｜ 推导: 某个 + 地方 = 某个地方"},{"word":"somehow","pos":"ad.","detail":"构词: 构词: some(某种) + how(方式)<br>释义: 以某种方式","example":"例句: We'll manage somehow. ｜ 推导: 某种 + 方式 = 以某种方式"},{"word":"somewhat","pos":"ad.","detail":"构词: 构词: some(某种) + what(程度)<br>释义: 有点儿,几分","example":"例句: I'm somewhat tired. ｜ 推导: 某种 + 程度 = 有点儿,稍微"},{"word":"sometime","pos":"ad.","detail":"构词: 构词: some(某个) + time(时间)<br>释义: 某个时候","example":"例句: Let's meet sometime next week. ｜ 推导: 某个 + 时间 = 某个时间"}],"extra":[]},{"id":320,"root":"suffi","pronounce":"/sʌfɪ/斯阿夫衣","source":"拉丁语 (足够)","meaning":"足够,充分","mnemonic":"suffi是我们学过的sufficient的一部分。sufficient就是足够的、充分的，所以suffi就是“足够,充分”的意思。","mainWords":[{"word":"sufficient","pos":"a.","detail":"构词: 构词: suffi(足够) + cient(形容词后缀)<br>释义: 足够的,充分的","example":"例句: The food is sufficient for us. ｜ 推导: 足够 + 形容词化 = 足够的,充分的"},{"word":"suffice","pos":"v.","detail":"构词: 构词: suffi(足够) + ce(动词后缀)<br>释义: 充足,足够","example":"例句: A brief note will suffice. ｜ 推导: 足够 + 动词化 = 充足,满足需求"}],"extra":["sufficiently ad. 足够地（构词: suffi + ciently）","sufficing a. 足够的（构词: suffi + cing）","sufficiency n. 充足（构词: suffi + ciency）","sufficed v. 足够了（构词: suffi + ced）","insufficient a. 不足的（构词: in + suffi + cient）","insufficiently ad. 不足地（构词: in + suffi + ciently）","insufficiency n. 不足（构词: in + suffi + ciency）","suffices v. 第三人称单数（构词: suffi + ces）","self-sufficient a. 自给自足的（构词: self + suffi）","sufficiency-level n. 充足水平（构词: suffi + level）"]},{"id":321,"root":"uni-","pronounce":"/ˈjuːnɪ/耶乌尼","source":"拉丁语 unus (一)","meaning":"一,单一,统一","mnemonic":"uni就是我们熟悉的独角兽：它最明显的特点是只有一只角。只有一个就是“一、单一”；许多对象都按同一个样子排列，又会形成统一。所以uni-就是“一、单一、统一”。","mainWords":[{"word":"unit","pos":"n.","detail":"构词: 构词: uni(一) + t<br>释义: 单位","example":"例句: The basic unit of society is family. ｜ 推导: 一 = 单一的事物,单位"},{"word":"unite","pos":"v.","detail":"构词: 构词: uni(一) + te<br>释义: 联合","example":"例句: We must unite to solve problems. ｜ 推导: 一 + 动词化 = 使成为一,联合"},{"word":"unity","pos":"n.","detail":"构词: 构词: uni(一) + ty(名词后缀)<br>释义: 团结;统一","example":"例句: Unity is strength. ｜ 推导: 一 + 名词化 = 合为一的状态,团结"},{"word":"union","pos":"n.","detail":"构词: 构词: uni(一) + on(名词后缀)<br>释义: 联盟;工会","example":"例句: The European Union has 27 members. ｜ 推导: 一 + 名词化 = 联合体,联盟"},{"word":"unify","pos":"v.","detail":"构词: 构词: uni(一) + fy(使...化)<br>释义: 统一","example":"例句: The plan will unify the system. ｜ 推导: 一 + 使...化 = 使成为一,统一"},{"word":"unique","pos":"a.","detail":"构词: 构词: uni(一) + que(形容词后缀)<br>释义: 独特的","example":"例句: Each person is unique. ｜ 推导: 一 + 形容词化 = 独一无二的,独特的"},{"word":"universe","pos":"n.","detail":"构词: 构词: uni(一) + verse(转)<br>释义: 宇宙","example":"例句: The universe is vast. ｜ 推导: 一 + 转 = 转成一体的整体,宇宙"},{"word":"universal","pos":"a.","detail":"构词: 构词: universe + al(形容词后缀)<br>释义: 普遍的","example":"例句: Music is a universal language. ｜ 推导: 宇宙 + 形容词化 = 全宇宙的,普遍的"},{"word":"university","pos":"n.","detail":"构词: 构词: univers(普遍) + ity<br>释义: 大学","example":""},{"word":"uniform","pos":"n.","detail":"构词: 构词: uni(一) + form(形式)<br>释义: 制服 a.统一的","example":""}],"extra":[]},{"id":322,"root":"vers-/vert-","pronounce":"/vɜːrs/沃儿斯；/vɜːrt/沃儿特","source":"","meaning":"转,转动,转向","mnemonic":"方法一：\nVERT可以记成View Every Road Turn。\n\nV是View，表示看；E是Every，表示每一个；R是Road，表示道路；T是Turn，表示转弯、改变方向。\n\n看地图或开车时，只要road出现turn，前进方向就会从直行改到另一边。这个动作就是转、转动和转向。\n\n所以vert就是“转、转动、转向”的意思。\n\n方法二：\nVERS可以记成View Every Road Switch。\n\nV是View，E是Every，R是Road，S是Switch。Switch在这里表示把道路方向从一边切换到另一边。\n\n看见road发生switch，就是看见它从原来的方向转到新的方向。末尾的s和t分别用Switch和Turn收束，两条口诀都落在同一个“道路改变方向”的画面上。\n\n所以vers/vert就是“转、转动、转向”的意思。","mainWords":[{"word":"versatile","pos":"a.","detail":"构词: 构词: vers(转) + atile(能够...的)<br>释义:
