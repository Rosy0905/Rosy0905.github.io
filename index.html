word":"curiosity","pos":"n.","detail":"构词: 构词: curious + ity(名词后缀)<br>释义: 好奇心;珍品","example":"例句: Curiosity killed the cat. ｜ 推导: 好奇的 + 状态 = 好奇心"},{"word":"cure","pos":"v.","detail":"构词: 构词: cur(照料) + e<br>释义: 治愈 n.治疗","example":"例句: Time can cure all wounds. ｜ 推导: 照料 = 用心照料,治愈"},{"word":"secure","pos":"a.","detail":"构词: 构词: se(无) + cure(担忧)<br>释义: 安全的 v.保护","example":"例句: Keep your password secure. ｜ 推导: 无 + 担忧 = 无需担忧的,安全的"},{"word":"security","pos":"n.","detail":"构词: 构词: secure + ity(名词后缀)<br>释义: 安全;保障","example":"例句: National security is vital. ｜ 推导: 安全的 + 状态 = 安全,保障"}],"extra":[]},{"id":328,"root":"destin","pronounce":"/destɪn/德诶斯提恩","source":"拉丁语 destinare","meaning":"固定,确定","mnemonic":"方法一：destin就是“钉死”。一颗钉子被钉死后，位置就固定了；路线的终点也像被钉在地图上一样，已经确定。所以destin就是“固定、确定”。方法二：为了记忆，可以把DESTIN记成“Draw End on Street; Then It Never moves”。\nDraw End on Street表示在路线图上把终点画在某条街上；Then It Never moves表示确定以后，这个终点不再随意改变。\n终点被明确画出并固定在地图上，就是把目的地确定下来；人生路线如果被认为早已固定，又会引出命运和注定。\n所以destin就是“固定、确定；指定终点”的意思。","mainWords":[{"word":"destination","pos":"n.","detail":"构词: 构词: destin(固定) + ation(名词后缀)<br>释义: 目的地,终点","example":"例句: Paris is our final destination. ｜ 推导: 固定 + 地点 = 被固定的终点位置"},{"word":"destiny","pos":"n.","detail":"构词: 构词: destin(固定) + y(名词后缀)<br>释义: 命运,天数","example":"例句: It was her destiny to become a writer. ｜ 推导: 固定 + 人生 = 被固定的生命轨迹"}],"extra":["destined a. 注定的（构词: destin + ed）","stand v. 站立 (同源词,固定位置)","destine v. 注定,预定（构词: destin + e）","statue n. 雕像 (同源词,固定形态)","predestine v. 预先注定（构词: pre + destin）","station n. 站,位置 (同源词,固定地点)","predestination n. 宿命论（构词: pre + destin + ation）","stable a. 稳定的 (同源词,保持固定)","predestined a. 命中注定的（构词: pre + destin + ed）","establish v. 建立 (同源词,使固定)","destinationless a. 无目的的（构词: destination + less）","constant a. 持续的 (同源词,固定不变)","destinal a. 命运的（构词: destin + al）","substance n. 物质 (同源词,固定本质)"]},{"id":329,"root":"divid/divis","pronounce":"/dɪˈvaɪd/迪五爱德","source":"di(分开)+vid(看)","meaning":"分开,分割","mnemonic":"方法一：divid/divis就是“地外的”。地外的东西就是地球之外的，和地球上的东西分开与分割了，是另一种东西。所以divid/divis就是“分开、分割”的意思。   方法二：为了记忆，可以把DIVID记成“Draw In View; Items Different”。\nDraw In View表示在画面中画出一条界线；Items Different表示界线两边的物品被区分开，不再混在一起。\n所以divid/divis就是“分开、分割、划分”的意思。","mainWords":[{"word":"divide","pos":"v.","detail":"构词: 构词: divid(分开) + e<br>释义: 分开,划分","example":"例句: Let's divide the work equally. ｜ 推导: 分开 = 划分,分配"},{"word":"division","pos":"n.","detail":"构词: 构词: divis(分开) + ion(名词后缀)<br>释义: 分割;部门","example":"例句: She works in the sales division. ｜ 推导: 分开 + 名词化 = 分割,部门"},{"word":"individual","pos":"n.","detail":"构词: 构词: in(不) + divid(分开) + ual<br>释义: 个人 a.个别的","example":"例句: Each individual has unique talents. ｜ 推导: 不可分开的 = 个体,个人"},{"word":"dividend","pos":"n.","detail":"构词: 构词: divid(分开) + end(名词后缀)<br>释义: 红利,股息","example":"例句: The company paid high dividends. ｜ 推导: 分开的钱 = 分红,股息"}],"extra":["divider n. 分隔物（构词: divid + er）","subdivide v. 细分（构词: sub + divid + e）","redivide v. 重新分割（构词: re + divid + e）","undivided a. 未分的（构词: un + divid + ed）","divisible a. 可分的（构词: divis + ible）","divisional a. 部门的（构词: divis + ional）","divisive a. 造成分裂的（构词: divis + ive）","indivisible a. 不可分的（构词: in + divis + ible）","divisor n. 除数（构词: divis + or）","subdivision n. 细分（构词: sub + divis + ion）"]},{"id":330,"root":"end","pronounce":"/end/诶恩德","source":"古英语 endian","meaning":"结束,末端,终止","mnemonic":"end本身就是我们小学学过的end。 end 就是“末端、结束、结束”。 所以end就是“结束、末端、终止”。","mainWords":[{"word":"end","pos":"n.","detail":"构词: 构词: end(结束)<br>释义: 末端;结束 v.结束","example":"例句: The movie came to an end. ｜ 推导: 结束 = 末端,终止"},{"word":"weekend","pos":"n.","detail":"构词: 构词: week(周) + end(末端)<br>释义: 周末","example":"例句: I relax on the weekend. ｜ 推导: 周 + 末端 = 一周的末尾,周末"},{"word":"ending","pos":"n.","detail":"构词: 构词: end(结束) + ing(名词后缀)<br>释义: 结尾,结局","example":"例句: The story has a happy ending. ｜ 推导: 结束 + 名词化 = 结束的部分,结局"},{"word":"endless","pos":"a.","detail":"构词: 构词: end(结束) + less(无...的)<br>释义: 无尽的,无穷的","example":"例句: The road seems endless. ｜ 推导: 结束 + 无 = 没有结束的,无尽的"}],"extra":["ended a. 结束的（构词: end + ed）","unending a. 不停的（构词: un + end + ing）"]},{"id":331,"root":"enter","pronounce":"/ˈentər/诶恩特儿","source":"en(进入) + ter","meaning":"进入","mnemonic":"以后看到enter，可以想象一支箭头从门外指向门内。人沿箭头跨过门口，就从外面进入里面。所以enter就是“进入”。","mainWords":[{"word":"enter","pos":"v.","detail":"构词: 构词: enter(进入)<br>释义: 进入,参加","example":"例句: Please enter the room. ｜ 推导: 原始词根 = 进入"},{"word":"entrance","pos":"n.","detail":"构词: 构词: entr(进入) + ance(名词后缀)<br>释义: 入口,门口","example":"例句: The main entrance is locked. ｜ 推导: 进入 + 名词化 = 入口"},{"word":"entry","pos":"n.","detail":"构词: 构词: entr(进入) + y(名词后缀)<br>释义: 进入,条目","example":"例句: No entry without permission. ｜ 推导: 进入 + 名词化 = 进入(行为)"}],"extra":["reenter v. 再进入（构词: re + enter）","reentry n. 再进入（构词: re + entry）","entrant n. 参加者（构词: entr + ant）","enterable a. 可进入的（构词: enter + able）","entering a. 进入的（构词: enter + ing）","entranceway n. 入口处（构词: entrance + way）","entryway n. 入口通道（构词: entry + way）","entree n. 入场许可（构词: entr + ee）"]},{"id":332,"root":"favor","pronounce":"/ˈfeɪvər/夫诶五额儿","source":"拉丁语 favere","meaning":"善意,喜爱,偏爱","mnemonic":"favor完整保留在小学词 favorite 的开头。favorite 是自己最喜爱、最偏爱的对象；喜欢一个人时也更愿意对他表示善意、主动帮助。所以favor就是“善意、喜爱、偏爱”。","mainWords":[{"word":"favor","pos":"n.","detail":"构词: 构词: favor(善意,喜爱)<br>释义: 好感;恩惠 v.偏爱","example":"例句: Can you do me a favor? ｜ 推导: 善意 = 帮忙,恩惠"},{"word":"favorable","pos":"a.","detail":"构词: 构词: favor + able(能...的)<br>释义: 有利的;赞许的","example":"例句: The conditions are favorable. ｜ 推导: 善意 + 能够的 = 能带来好感的,有利的"},{"word":"favorite","pos":"a.","detail":"构词: 构词: favor + ite(被...的)<br>释义: 最喜爱的 n.最爱","example":"例句: This is my favorite book. ｜ 推导: 善意 + 被选中的 = 最受偏爱的"}],"extra":["unfavorable a. 不利的（构词: un + favor + able）","favoritism n. 偏袒（构词: favor + itism）","disfavor n. 不喜欢（构词: dis + favor）","favored a. 受优待的（构词: favor + ed）"]},{"id":333,"root":"frequ-","pronounce":"/friːkw/弗里克乌","source":"拉丁语 frequens","meaning":"频繁,重复","mnemonic":"为了记忆，可以把FREQU记成“Fast Run, Every Quick Use again”。\n\nFast Run表示同一个程序、信号或动作快速运行；Every Quick Use again表示每次刚使用完，它又很快再次出现。\n\n想象手机提示音、机器信号或某个动作在短时间内一遍又一遍出现。出现次数多、间隔短，就是频繁和反复。整条口诀始终围绕同一个对象重复出现。\n\n所以frequ就是“频繁、反复、次数多”的意思。","mainWords":[{"word":"frequent","pos":"a.","detail":"构词: 构词: frequ(频繁) + ent(形容词后缀)<br>释义: 频繁的","example":"例句: He is a frequent visitor. ｜ 推导: 频繁 + 形容词化 = 频繁的,经常的"},{"word":"frequency","pos":"n.","detail":"构词: 构词: frequ(频繁) + ency(名词后缀)<br>释义: 频率;频繁","example":"例句: The frequency of accidents increased. ｜ 推导: 频繁 + 名词化 = 频繁的程度,频率"}],"extra":["frequently ad. 频繁地（构词: frequent + ly）","infrequent a. 不频繁的（构词: in + frequent）","infrequently ad. 很少地（构词: in + frequent + ly）","frequenter n. 常客（构词: frequent + er）","frequentation n. 频繁访问（构词: frequent + ation）"]},{"id":334,"root":"fre-","pronounce":"/fre/夫儿诶","source":"印欧语 *prew-","meaning":"冷,新鲜,冻结","mnemonic":"fre-可以直接想到我们小学学过的fridge。 把 fre 中的 e 换成 i，就能表示 fridge 的开头。fridge 里面很 cold，能够让食物不易变坏，保持像 new 一样的新鲜；温度继续降低，还会形成 ice、冻结。 所以一个 fridge 场景就能统一冷、新鲜和冻结。 所以fre-就是“冷、新鲜、冻结”。","mainWords":[{"word":"fresh","pos":"a.","detail":"构词: 构词: fre(冷) + sh<br>释义: 新鲜的;清新的","example":"例句: The air is fresh in the morning. ｜ 推导: 冷 → 保鲜 = 新鲜的,清新的"},{"word":"refresh","pos":"v.","detail":"构词: 构词: re(再) + fresh<br>释义: 使清新;刷新","example":"例句: A cold drink will refresh you. ｜ 推导: 再 + 新鲜 = 使恢复精神,刷新"},{"word":"freeze","pos":"v.","detail":"构词: 构词: fre(冷) + eze<br>释义: 冻结;冷冻","example":"例句: Water freezes at 0°C. ｜ 推导: 冷 → 极冷 = 冻结,结冰"}],"extra":["refreshment n. 茶点;精力恢复（构词: refresh + ment）","freezer n. 冰箱冷冻室（构词: freeze + er）","frozen a. 冷冻的 (freeze的过去分词)","freshen v. 使新鲜（构词: fresh + en）"]},{"id":335,"root":"glob","pronounce":"/glɒb/格勒奥布","source":"拉丁语 globus","meaning":"球,球体","mnemonic":"GLOB可以记成Great Large One Ball。Great和Large都表示大，One Ball就是一个球。一个又大又圆的ball，就是球体；地球也像一个巨大的球。所以glob就是“球、球体”的意思。","mainWords":[{"word":"globe","pos":"n.","detail":"构词: 构词: glob(球) + e<br>释义: 球体,地球","example":"例句: The globe is warming up. ｜ 推导: 球 + 名词化 = 球体,地球"},{"word":"global","pos":"a.","detail":"构词: 构词: glob(球) + al(形容词后缀)<br>释义: 全球的,全面的","example":"例句: This is a global issue. ｜ 推导: 球 + 形容词化 = 全球的,球形的"}],"extra":["globally ad. 全球地（构词: global + ly）","globalist n. 全球主义者（构词: global + ist）","globalize v. 使全球化（构词: global + ize）","globality n. 全球性（构词: global + ity）","globalization n. 全球化（构词: global + ization）","globlet n. 小球体（构词: glob + let）","globular a. 球状的（构词: glob + ular）","globosity n. 球形状态（构词: glob + osity）","globule n. 小球体（构词: glob + ule）","globefish n. 河豚（构词: globe + fish）","glob n. 小球,小滴（构词: 词根即单词）","englobe v. 包入球中（构词: en + globe）","globalism n. 全球主义（构词: global + ism）","hemiglobin n. 血红蛋白（构词: hemi + glob + in）"]},{"id":336,"root":"ject","pronounce":"/dʒekt/杰克特","source":"拉丁语 jacere","meaning":"投掷,扔；投掷,投射(认知)","mnemonic":"可以把JECT记成“Joint Extends, Can Throw”。\n\nJoint就是关节；Extends表示伸展；Can Throw表示能够把东西扔出去。那么请问在做什么的时候，手臂的关节先向前伸展，随后手中的东西被扔出去呢？\n\n答案就是就是“投掷、扔”。投影仪把画面投到屏幕上，也像把一个东西投到前方；大脑把对象放到认知面前时，也可以继续理解为“投射”。\n\n所以ject就是“投掷、扔；投射”的意思。","mainWords":[{"word":"project","pos":"n.","detail":"构词: 构词: pro(向前) + ject(投)<br>释义: 项目 v.投射","example":"例句: We need to project our plan. ｜ 推导: 向前 + 投 = 投射出去,计划项目"},{"word":"inject","pos":"v.","detail":"构词: 构词: in(向内) + ject(投)<br>释义: 注射,注入","example":"例句: The nurse will inject the vaccine. ｜ 推导: 向内 + 投 = 往里面投入,注射"},{"word":"eject","pos":"v.","detail":"构词: 构词: e(向外) + ject(投)<br>释义: 弹出,驱逐","example":"例句: Press this button to eject the CD. ｜ 推导: 向外 + 投 = 往外投出,弹出驱逐"},{"word":"reject","pos":"v.","detail":"构词: 构词: re(向后) + ject(投)<br>释义: 拒绝,抵制","example":"例句: They reject our proposal. ｜ 推导: 向后 + 投 = 扔回去,拒绝接受"},{"word":"projector","pos":"n.","detail":"构词: 构词: project(投射) + or(器具)<br>释义: 投影仪","example":"例句: Turn on the projector please. ｜ 推导: 投射 + 器具 = 投射装置,投影仪"},{"word":"subject","pos":"n.","detail":"构词: 构词: sub(在下) + ject(投)<br>释义: 主题 v.使服从","example":"例句: The subject of the meeting is clear. ｜ 推导: 在下 + 投 = 投在下面的,主题基础"},{"word":"object","pos":"n.","detail":"构词: 构词: ob(相对) + ject(投)<br>释义: 物体 v.反对","example":"例句: I object to this proposal. ｜ 推导: 相对 + 投 = 对投过来的,物体/反对"},{"word":"objective","pos":"a.","detail":"构词: 构词: object(对象) + ive(形容词后缀)<br>释义: 客观的 n.目标","example":"例句: We need an objective analysis. ｜ 推导: 对象 + 形容词化 = 对象性的,客观的"},{"word":"subjective","pos":"a.","detail":"构词: 构词: subject(主体) + ive(形容词后缀)<br>释义: 主观的","example":"例句: That's a subjective opinion. ｜ 推导: 主体 + 形容词化 = 主体性的,主观的"},{"word":"objection","pos":"n.","detail":"构词: 构词: object(反对) + ion(名词后缀)<br>释义: 反对,异议","example":"例句: I have no objection to this. ｜ 推导: 反对 + 名词化 = 反对的行为,异议"},{"word":"adjective","pos":"n.","detail":"构词: 构词: ad(附加) + ject(投) + ive<br>释义: 形容词","example":"例句: 'Beautiful' is an adjective. ｜ 推导: 附加 + 投 = 附加投掷的词,形容词"}],"extra":["projection n. 投影,投射（构词: project + ion）","rejection n. 拒绝,排斥（构词: reject + ion）","objectively ad. 客观地（构词: objective + ly）","objectivity n. 客观性（构词: objective + ity）","subjectively ad. 主观地（构词: subjective + ly）","subjectivity n. 主观性（构词: subjective + ity）"]},{"id":337,"root":"law","pronounce":"/lɔː/勒奥","source":"古诺尔斯语 lagu","meaning":"法律,规则","mnemonic":"law就是“牢”。法律像一道看不见的围栏，把人的行为限制在规则之内；越过这道线就会受到处理。所以law就是“法律、规则”。","mainWords":[{"word":"law","pos":"n.","detail":"构词: 构词: law(法律)<br>释义: 法律;规律;定律","example":"例句: Obey the law. ｜ 推导: 被放置的规则 = 法律"},{"word":"lawyer","pos":"n.","detail":"构词: 构词: law(法律) + yer(执行者)<br>释义: 律师","example":"例句: He is a famous lawyer. ｜ 推导: 法律 + 从业者 = 律师"},{"word":"lawsuit","pos":"n.","detail":"构词: 构词: law(法律) + suit(诉讼)<br>释义: 诉讼;官司","example":"例句: They filed a lawsuit. ｜ 推导: 法律 + 诉讼 = 法律诉讼,官司"},{"word":"lawful","pos":"a.","detail":"构词: 构词: law(法律) + ful(充满的)<br>释义: 合法的;法定的","example":"例句: It's a lawful business. ｜ 推导: 法律 + 充满的 = 符合法律的,合法的"}],"extra":["lawless a. 无法无天的（构词: law + less(无)）","unlawful a. 非法的（构词: un + law + ful）","outlaw n. 歹徒 v.宣布非法（构词: out + law）","in-law n. 姻亲（构词: in + law）","bylaw n. 规章制度（构词: by + law）","lawmaker n. 立法者（构词: law + maker）","lawbreaker n. 违法者（构词: law + breaker）","law-abiding a. 守法的（构词: law + abiding）","lawcourt n. 法庭（构词: law + court）","lawsuit n. 诉讼案件（构词: law + suit）"]},{"id":338,"root":"mult","pronounce":"/mʌlt/姆阿勒特","source":"拉丁语 multus","meaning":"多,许多","mnemonic":"mult就是“满了”。一个地方被东西装满，说明里面不是一个，而是有很多、许多。所以mult就是“多、许多”。","mainWords":[{"word":"multiple","pos":"a.","detail":"构词: 构词: mult(多) + ple(倍)<br>释义: 多样的 n.倍数","example":"例句: We have multiple choices. ｜ 推导: 多 + 倍 = 多倍的,多种的"},{"word":"multiply","pos":"v.","detail":"构词: 构词: mult(多) + ply(倍,使)<br>释义: 乘;增加","example":"例句: Three multiplied by four equals twelve. ｜ 推导: 多 + 使倍 = 使成倍,乘以"},{"word":"multitude","pos":"n.","detail":"构词: 构词: mult(多) + itude(名词后缀,表状态)<br>释义: 众多,大量","example":"例句: A multitude of problems arose. ｜ 推导: 多 + 状态 = 众多的状态,大量"}],"extra":["multimedia n. 多媒体（构词: multi + media）","multipurpose a. 多用途的（构词: multi + purpose）","multinational a. 跨国的（构词: multi + national）","multilingual a. 多语言的（构词: multi + lingual）","multicultural a. 多元文化的（构词: multi + cultural）","multiform a. 多种形式的（构词: multi + form）","multiplication n. 乘法（构词: mult + plication）","multicolor a. 多彩的（构词: multi + color）","multiplier n. 乘数（构词: mult + plier）","multitask v. 多任务处理（构词: multi + task）"]},{"id":339,"root":"odd","pronounce":"/ɒd/奥德","source":"古诺尔斯语 oddi","meaning":"不规则的,单个的,奇怪的","mnemonic":"ODD可以记成One Doesn't Double。One是一个，Doesn't Double就是不能成双。数字两个两个配对后总会剩下一个，就是奇数；本来应该成双却落单，也会显得单个、不规则和奇怪。所以odd就是“不规则的、单个的、奇怪的”的意思。","mainWords":[{"word":"odd","pos":"a.","detail":"构词: 构词: odd(不规则的)<br>释义: 奇数的;奇怪的;单只的","example":"例句: That's an odd number. ｜ 推导: 不规则的 = 奇数的,奇怪的"},{"word":"odds","pos":"n.","detail":"构词: 构词: odd(不均等) + s(复数)<br>释义: 差异;机会;可能性","example":"例句: The odds are in our favor. ｜ 推导: 不均等的部分 = 概率,机会"}],"extra":["oddly ad. 奇怪地（构词: odd + ly）","oddity n. 古怪;怪人（构词: odd + ity）","oddness n. 古怪,奇特（构词: odd + ness）","oddball n. 古怪的人（构词: odd + ball）","even a. 偶数的 (odd的反义词)","odd-looking a. 相貌古怪的","oddish a. 有点古怪的（构词: odd + ish）","odd-numbered a. 奇数的","odds-on a. 很可能的","oddment n. 零碎物品（构词: odd + ment）","odd job n. 零工,杂活","at odds 不一致,有分歧","odds and ends 零碎物品","against the odds 克服困难"]},{"id":340,"root":"ori-","pronounce":"/ˈɔːrɪ/奥里","source":"拉丁语 oriri","meaning":"升起,起源","mnemonic":"ori先看成“日起”。太阳每天从地平线上rise，太阳升起就是一天的开始和起源；一个事物第一次出现，也像太阳从无到有地升起来。所以ori就是“升起、起源”的意思。","mainWords":[{"word":"origin","pos":"n.","detail":"构词: 构词: ori(升起) + gin(名词后缀)<br>释义: 起源;出身","example":"例句: The origin of the universe. ｜ 推导: 升起 + 名词化 = 事物开始升起之处,起源"},{"word":"original","pos":"a.","detail":"构词: 构词: origin + al(形容词后缀)<br>释义: 原始的;独创的","example":"例句: The original design was better. ｜ 推导: 起源 + 形容词化 = 最初的,原始的"},{"word":"originate","pos":"v.","detail":"构词: 构词: origin + ate(动词后缀)<br>释义: 起源;发起","example":"例句: The idea originated from him. ｜ 推导: 起源 + 动词化 = 从源头产生,发起"},{"word":"orient","pos":"n.","detail":"构词: 构词: ori(升起) + ent<br>释义: 东方 v.定向","example":"例句: Orient yourself with a map. ｜ 推导: 太阳升起之处 = 东方;确定方向"},{"word":"orientation","pos":"n.","detail":"构词: 构词: orient + ation(名词后缀)<br>释义: 方向;定位","example":"例句: New student orientation week. ｜ 推导: 定向 + 名词化 = 确定方位,定向"},{"word":"oriental","pos":"a.","detail":"构词: 构词: orient + al(形容词后缀)<br>释义: 东方的","example":"例句: Oriental culture is fascinating. ｜ 推导: 东方 + 形容词化 = 东方的,东方风格的"}],"extra":["originally ad. 原来;起初（构词: original + ly）","originator n. 创始人（构词: originate + or）","originality n. 独创性（构词: original + ity）","disorient v. 使迷失方向（构词: dis + orient）","reorient v. 重新定向（构词: re + orient）","aborigine n. 土著居民（构词: ab + ori + gine）","orientate v. 确定方向（构词: orient + ate）"]},{"id":341,"root":"pel","pronounce":"/pel/普诶勒","source":"拉丁语 pellere","meaning":"驱使,迫使,推动","mnemonic":"pel就是“迫”。迫会让人直接想到“驱使”，由这个意思还可以继续推出迫使,推动，所以pel就是“驱使,迫使,推动”的意思。","mainWords":[{"word":"compel","pos":"v.","detail":"构词: 构词: com(加强) + pel(迫使)<br>释义: 强迫,迫使","example":"例句: They compelled him to sign. ｜ 推导: 加强 + 迫使 = 强迫,迫使"},{"word":"expel","pos":"v.","detail":"构词: 构词: ex(向外) + pel(迫使)<br>释义: 驱逐,开除","example":"例句: He was expelled from school. ｜ 推导: 向外 + 迫使 = 驱逐,开除"},{"word":"repel","pos":"v.","detail":"构词: 构词: re(向回) + pel(迫使)<br>释义: 击退,抵制","example":"例句: The army repelled the attack. ｜ 推导: 向回 + 迫使 = 击退,排斥"},{"word":"propel","pos":"v.","detail":"构词: 构词: pro(向前) + pel(驱使)<br>释义: 推进,驱使","example":"例句: Wind propels the sailboat. ｜ 推导: 向前 + 驱使 = 推进,推动"}],"extra":["dispel v. 驱散（构词: dis + pel）","propeller n. 螺旋桨（构词: pro + pel + ler）","impel v. 推动,激励（构词: im + pel）","compulsion n. 强迫（构词: com + pel + sion）","expulsion n. 驱逐,开除（构词: ex + pel + sion）","repulsion n. 排斥,厌恶（构词: re + pel + sion）","compelling a. 强制的（构词: com + pel + ling）","propulsion n. 推进力（构词: pro + pel + sion）","repellent n. 驱虫剂（构词: re + pel + lent）","impeller n. 叶轮（构词: im + pel + ler）"]},{"id":342,"root":"petr","pronounce":"/petr/普诶特儿","source":"希腊语 petros","meaning":"石,岩石","mnemonic":"为了记忆，可以把PETR记成“Push Earth Tight: Rock”。\n\nPush表示施加压力；Earth表示泥土和地层；Tight表示把松散物质压得越来越紧；Rock表示最后形成坚硬岩石。\n\n这个其实就是地层受压、逐渐变硬最后形成岩层的自然场景。\n\n所以petr就是“石、岩石”的意思。","mainWords":[{"word":"petroleum","pos":"n.","detail":"构词: 构词: petr(石) + ole(油) + um(名词后缀)<br>释义: 石油","example":"例句: Petroleum is found in rocks. ｜ 推导: 石 + 油 = 岩石中的油,石油"},{"word":"petrol","pos":"n.","detail":"构词: 构词: petr(石) + ol(油的缩写)<br>释义: 汽油","example":"例句: My car needs petrol. ｜ 推导: 石 + 油(缩写) = 石油提炼品,汽油"}],"extra":["petrify v. 石化,使惊呆（构词: petr + ify）","petrifaction n. 石化,惊呆（构词: petr + ifaction）","petrosal a. 岩石般的（构词: petr + osal）","petrified a. 石化的,惊呆的（构词: petr + ified）","petrous a. 岩石的（构词: petr + ous）","petrochemistry n. 石油化学 (petr + o + chemistry","petrology n. 岩石学（构词: petr + ology）","petrologic a. 岩石学的（构词: petr + ologic）","petrochemical n. 石化产品（构词: petr + o + chemical）","petroglyph n. 岩画（构词: petr + o + glyph）"]},{"id":343,"root":"pick","pronounce":"/pɪk/皮克","source":"日耳曼语","meaning":"挑选,采摘,拾起","mnemonic":"pick就是小学学过的单词，拼写和读音都不用变化。pick 是挑选、采摘或从地上拾起，所以pick就是“挑选、采摘、拾起”。","mainWords":[{"word":"pick","pos":"v.","detail":"构词: 构词: pick(挑选、拾起)<br>释义: 挑选,采摘,拾起","example":"例句: Pick the best one. ｜ 推导: 原始词根 = 精确地选择和拾取"},{"word":"pickup","pos":"n.","detail":"构词: 构词: pick(拾) + up(向上)<br>释义: 拾起,获得","example":"例句: The pickup was quick. ｜ 推导: 拾 + 向上 = 拾起的动作或过程"}],"extra":["picker n. 采摘者（构词: pick + er）","pickaxe n. 鹤嘴锄（构词: pick + axe）","picking n. 采摘,挑选（构词: pick + ing）","nitpick v. 挑剔,吹毛求疵（构词: nit + pick）","picky a. 挑剔的（构词: pick + y）","cherry-pick v. 精挑细选（构词: cherry + pick）","pickpocket n. 扒手（构词: pick + pocket）","pickings n. 收获物（构词: pick + ings）","handpick v. 精心挑选（构词: hand + pick）","unpick v. 拆开,拆线（构词: un + pick）","toothpick n. 牙签（构词: tooth + pick）","pick-up n. 皮卡车;搭载（构词: pick + up）","picket n. 尖桩;纠察员（构词: pick + et）","pickled a. 腌制的（构词: pickle + ed）"]},{"id":344,"root":"plen","pronounce":"/plen/普勒诶恩","source":"拉丁语 plenus (满的)","meaning":"大量,众多,充满","mnemonic":"plen就是“铺连”。把一块块东西连续铺开，直到没有空处，就是铺满；能铺得满满当当，说明数量很多、十分充足。所以plen就是“大量、众多、充满”。","mainWords":[{"word":"plenty","pos":"n.","detail":"构词: 构词: plen(大量) + ty(名词后缀)<br>释义: 丰富,大量","example":"例句: We have plenty of time. ｜ 推导: 大量 + 名词化 = 丰富,充裕"},{"word":"plentiful","pos":"a.","detail":"构词: 构词: plent(y) + iful(形容词后缀)<br>释义: 丰富的,充足的","example":"例句: Food was plentiful there. ｜ 推导: 大量 + 充满的 = 丰富的,充足的"}],"extra":["plentifully ad. 丰富地（构词: plentiful + ly）","deplete v. 耗尽（构词: de + plete）","plenteous a. 丰饶的（构词: plen + teous）","complete a. 完整的（构词: com + plete）","plenitude n. 充分,完全（构词: plen + itude）","complement n. 补充（构词: com + ple + ment）","plenary a. 全体的,完全的（构词: plen + ary）","supplement n. 补充物（构词: sup + ple + ment）","replenish v. 补充（构词: re + plen + ish）","implement v. 实施（构词: im + ple + ment）"]},{"id":345,"root":"poison","pronounce":"/ˈpɔɪzn/普奥伊兹恩","source":"拉丁语 potio","meaning":"毒药,毒物","mnemonic":"以后看到poison，直接想象药瓶上的骷髅警告图标：瓶中物质一旦进入人体就会造成伤害，说明它是毒物，装着的就是毒药。所以poison就是“毒药、毒物”。","mainWords":[{"word":"poison","pos":"n.","detail":"构词: 构词: poison(毒)<br>释义: 毒药 v.毒害","example":"例句: The water was contaminated with poison. ｜ 推导: 原始词根 = 毒药,毒物"},{"word":"poisonous","pos":"a.","detail":"构词: 构词: poison(毒) + ous(形容词后缀)<br>释义: 有毒的","example":"例句: Some snakes are poisonous. ｜ 推导: 毒 + 形容词化 = 有毒的,恶毒的"}],"extra":["poisoner n. 投毒者（构词: poison + er）","poison-pen a. 匿名诽谤的（构词: poison + pen）","poisoning n. 中毒（构词: poison + ing）","toxin n. 毒素（构词: 同源词根tox = poison）","empoison v. 下毒,污染（构词: em + poison）","toxic a. 有毒的（构词: tox = poison + ic）","nonpoisonous a. 无毒的（构词: non + poison + ous）","intoxicate v. 使中毒（构词: in + tox + icate）","antipoison n. 解毒剂（构词: anti + poison）","detoxify v. 解毒（构词: de + tox + ify）"]},{"id":346,"root":"pray","pronounce":"/preɪ/普儿诶","source":"拉丁语 (祈祷)","meaning":"祈祷,祈求","mnemonic":"可以把PRAY记成“Please Respond; Answer Yes”。\n\nPlease表示请求；Respond表示回应；Answer Yes表示给出肯定答复。人在祈祷时，会把自己的愿望说出来，希望对方听见、回应并答应。\n\n即“请回应，并答应我的愿望”，\n所以pray就是“祈祷、祈求”的意思。","mainWords":[{"word":"pray","pos":"v.","detail":"构词: 构词: pray(祈祷)<br>释义: 祈祷,祈求","example":"例句: Let us pray for peace. ｜ 推导: 原始词根 = 祈祷,祈求"},{"word":"prayer","pos":"n.","detail":"构词: 构词: pray(祈祷) + er(名词后缀)<br>释义: 祈祷,祷文","example":"例句: She said a prayer before bed. ｜ 推导: 祈祷 + 名词化 = 祈祷,祷告词"}],"extra":["praying a. 祈祷的（构词: pray + ing）","prayers n. 祷告(复数)（构词: prayer + s）","prayed v. 祈祷了（构词: pray + ed）","prayerful a. 虔诚的（构词: prayer + ful）","overpray v. 过度祈祷（构词: over + pray）","prayerless a. 不祈祷的（构词: prayer + less）","repray v. 再次祈祷（构词: re + pray）","prays v. 祈祷(第三人称)（构词: pray + s）","praying mantis 螳螂（构词: praying + mantis）","prayer book 祈祷书（构词: prayer + book）"]},{"id":347,"root":"scal","pronounce":"/skæl/斯卡勒","source":"拉丁语 (攀登)","meaning":"使升高,攀登","mnemonic":"scal就是“使高”。使高会让人直接想到“使升高”，由这个意思还可以继续推出攀登，所以scal就是“使升高,攀登”的意思。","mainWords":[{"word":"scale","pos":"n.","detail":"构词: 构词: scal(使升高) + e<br>释义: 规模;刻度;天平","example":"例句: The project is on a large scale. ｜ 推导: 使升高 = 攀登;规模;刻度"},{"word":"escalate","pos":"v.","detail":"构词: 构词: e(加强) + scal(使升高) + ate<br>释义: 逐步升级","example":"例句: The conflict began to escalate. ｜ 推导: 加强 + 使升高 = 逐步升级,恶化"}],"extra":["scaler n. 攀登者（构词: scal + er）","escalade n. 攀登行为（构词: e + scal + ade）","scalable a. 可攀登的（构词: scal + able）","escalatory a. 使升高的（构词: e + scal + atory）","rescale v. 重新攀登（构词: re + scal + e）","upscale a. 高档的（构词: up + scal + e）","escalator n. 自动扶梯（构词: e + scal + ator）","downscale v. 降级（构词: down + scal + e）","escalation n. 升级,上升（构词: e + scal + ation）","scalar n. 标量（构词: scal + ar）","scaling n. 攀登;缩放（构词: scal + ing）","de-escalate v. 降级（构词: de + e + scal + ate）"]},{"id":348,"root":"shad","pronounce":"/ʃæd/诗艾德","source":"古英语 sceadu","meaning":"阴影","mnemonic":"shad就是“shadow”。shadow会让人直接想到“阴影”，所以shad就是“阴影”的意思。","mainWords":[{"word":"shade","pos":"n.","detail":"构词: 构词: shad(阴影) + e<br>释义: 荫,阴影 v.遮蔽","example":"例句: Sit in the shade of the tree. ｜ 推导: 阴影 = 荫凉处,遮蔽"},{"word":"shadow","pos":"n.","detail":"构词: 构词: shad(阴影) + ow(名词后缀)<br>释义: 阴影,影子","example":"例句: The tree cast a long shadow. ｜ 推导: 阴影 + 名词化 = 影子"},{"word":"shady","pos":"a.","detail":"构词: 构词: shad(阴影) + y(形容词后缀)<br>释义: 成荫的;可疑的","example":"例句: That's a shady business deal. ｜ 推导: 阴影的 = 多荫的;暗处的,可疑的"}],"extra":["shadowy a. 多阴影的（构词: shadow + y）","eyeshade n. 眼罩（构词: eye + shade）","overshadow v. 遮蔽,使黯然失色（构词: over + shadow）","unshaded a. 无遮蔽的（构词: un + shade + d）","sunshade n. 遮阳伞（构词: sun + shade）","shader n. 着色器（构词: shade + er）","lampshade n. 灯罩（构词: lamp + shade）","shading n. 明暗法（构词: shade + ing）"]},{"id":349,"root":"sham","pronounce":"/ʃæm/诗艾姆","source":"古英语 scamu","meaning":"羞耻,耻辱","mnemonic":"sham就是“傻么”。一个人做了很傻、很不体面的事，被别人问“你傻么”，会脸红低头，感到羞耻；严重时还会成为耻辱。所以sham就是“羞耻、耻辱”。","mainWords":[{"word":"shame","pos":"n.","detail":"构词: 构词: sham(羞耻) + e<br>释义: 羞耻 v.使羞愧","example":"例句: It's a shame to waste food. ｜ 推导: 羞耻 + 名词化 = 耻辱,羞愧"},{"word":"ashamed","pos":"a.","detail":"构词: 构词: a(强调) + sham(羞耻) + ed<br>释义: 羞耻的,惭愧的","example":"例句: I'm ashamed of my behavior. ｜ 推导: 强调 + 羞耻 + 形容词化 = 感到羞愧的"}],"extra":["shameful a. 可耻的（构词: shame + ful）","shamed a. 被羞辱的（构词: shame + d）","shameless a. 无耻的（构词: shame + less）","ashamedly ad. 羞愧地（构词: ashamed + ly）","shamelessly ad. 无耻地（构词: shameless + ly）","shamelessness n. 无耻（构词: shameless + ness）","unashamed a. 不羞耻的（构词: un + ashamed）","shamefulness n. 可耻（构词: shameful + ness）","shaming n. 羞辱（构词: shame + ing）","shamers n. 羞辱者（构词: shame + r + s）","shamefully ad. 可耻地（构词: shameful + ly）","shamable a. 可羞辱的（构词: sham + able）","shamefaced a. 害羞的（构词: shame + faced）","unashamedly ad. 不害羞地（构词: unashamed + ly）","shames v. 使羞愧(第三人称)（构词: shame + s）","shamingly ad. 羞辱地（构词: shaming + ly）"]},{"id":350,"root":"spell","pronounce":"/spel/斯普诶勒","source":"古英语(说出)","meaning":"拼写,咒语","mnemonic":"spell本身就是我们小学学过的spell。 spell 就是“拼写、咒语”。 所以spell就是“拼写、咒语”。","mainWords":[{"word":"spell","pos":"v.","detail":"构词: 构词: spell(逐个说出字母)<br>释义: 拼写","example":"例句: Can you spell your name? ｜ 推导: 逐个说出 = 拼写"},{"word":"spelling","pos":"n.","detail":"构词: 构词: spell(拼写) + ing(名词后缀)<br>释义: 拼法,拼写法","example":"例句: Check your spelling carefully. ｜ 推导: 拼写 + 名词化 = 拼写方法"}],"extra":["speller n. 拼写者（构词: spell + er）","misspelling n. 拼写错误（构词: mis + spell + ing）","misspell v. 拼错（构词: mis + spell）","spelt v. spell的过去式（构词: spell + t）","spellbound a. 着迷的（构词: spell + bound）","spelled v. spell的过去式（构词: spell + ed）","spellcheck n. 拼写检查（构词: spell + check）","unspelled a. 未拼写的（构词: un + spell + ed）","respell v. 重新拼写（构词: re + spell）","spellwork n. 魔法工作（构词: spell + work）","outspell v. 拼写胜过（构词: out + spell）","gospel n. 福音（构词: god + spell）"]},{"id":351,"root":"sequ/secut","pronounce":"/sekw/瑟克乌","source":"拉丁语 sequi","meaning":"跟随,追求","mnemonic":"sequ/secut可以记成seek you的压缩提示。 seek you 就是“寻找你”。为了找到你，我会沿着你走过的路线，一直 follow 在后面，不让目标丢失。 所以从 seek you 可以自然得到“跟随”，继续追着目标又是“追求”。 所以sequ/secut就是“跟随、追求”。","mainWords":[{"word":"suit","pos":"v.","detail":"构词: 构词: suit ← secutus(跟随)<br>释义: 适合 n.套装;诉讼","example":"例句: This job suits me well. ｜ 推导: 跟随要求 = 适合,相配"},{"word":"suitable","pos":"a.","detail":"构词: 构词: suit(适合) + able(能够...的)<br>释义: 合适的,适宜的","example":"例句: a suitable candidate ｜ 推导: 能够适合的 = 合适的,恰当的"},{"word":"suite","pos":"n.","detail":"构词: 构词: suite(跟随的一组)<br>释义: 套间;组曲;一套","example":"例句: a hotel suite ｜ 推导: 相互跟随的房间 = 套间,套房"},{"word":"pursuit","pos":"n.","detail":"构词: 构词: pur(向前) + suit(跟随)<br>释义: 追求,追赶","example":"例句: in pursuit of happiness ｜ 推导: 向前 + 跟随 = 追赶,追求"},{"word":"pursue","pos":"v.","detail":"构词: 构词: pur(向前) + sue(跟随)<br>释义: 追求,追赶","example":"例句: pursue one's dreams ｜ 推导: 向前 + 跟随 = 追求,追赶"}],"extra":["suitor n. 求婚者（构词: suit + or）","unsuitable a. 不合适的（构词: un + suitable）","lawsuit n. 诉讼（构词: law + suit）","suitability n. 适合性（构词: suitable + ity）"]},{"id":352,"root":"tank","pronounce":"/tæŋk/泰昂克","source":"印度语→葡萄牙语","meaning":"容器,箱子,储存器","mnemonic":"tank就是小学学过的单词，拼写和读音都不用变化。tank 是装液体或其他东西的大容器、储存箱，所以tank就是“容器、箱子、储存器”。","mainWords":[{"word":"tank","pos":"n.","detail":"构词: 构词: tank(容器)<br>释义: 罐,箱;坦克 v.储于槽中","example":"例句: The water tank is full. ｜ 推导: 容器 = 储存液体的大罐子"},{"word":"tanker","pos":"n.","detail":"构词: 构词: tank(罐) + er(运输工具)<br>释义: 油船,油罐车","example":"例句: The oil tanker arrived at port. ｜ 推导: 罐 + 运输者 = 运输罐装液体的船"}],"extra":["tankful n. 一箱的量（构词: tank + ful）","supertanker n. 超级油轮（构词: super + tanker）","tankage n. 储罐容量（构词: tank + age）","tankman n. 坦克兵（构词: tank + man）","tankard n. 大啤酒杯（构词: tank + ard）","tanklike a. 像坦克的（构词: tank + like）","tankless a. 无罐的（构词: tank + less）","watertank n. 水箱（构词: water + tank）","fishtank n. 鱼缸（构词: fish + tank）","airtank n. 气罐（构词: air + tank）","gastank n. 油箱（构词: gas + tank）","tanktop n. 背心（构词: tank + top）","thinktank n. 智库（构词: think + tank）","tanked a. 喝醉的(俚)（构词: tank + ed）"]},{"id":353,"root":"tumble","pronounce":"/ˈtʌmbl/特阿姆布勒","source":"本身即词根","meaning":"倒塌,跌倒,翻滚","mnemonic":"方法一： tumble可以听成“蹬不稳”的后半段。脚一蹬却没有站稳，人就会跌倒并在地上翻滚；高处的东西失去支撑，也会向下倒塌。所以tumble就是“倒塌、跌倒、翻滚”。 方法二： tumble就是“毯子滚下”。 卷起的毯子倒下楼梯时会跌倒、翻滚，堆叠物也可能倒塌。 所以tumble就是“倒塌、跌倒、翻滚”。","mainWords":[{"word":"tumble","pos":"v./n.","detail":"构词: 构词: tumble(倒塌、翻滚)<br>释义: 跌倒,翻滚","example":"例句: The child tumbled down. ｜ 推导: 坍暴 = 突然倒塌,跌倒翻滚"},{"word":"stumble","pos":"v./n.","detail":"构词: 构词: s(加强) + tumble(跌倒)<br>释义: 绊倒,踉跄","example":"例句: I stumbled on a stone. ｜ 推导: 加强 + 跌倒 = 绊倒,踉跄"}],"extra":["tumbler n. 不倒翁;杂技演员（构词: tumble + er）","stumbling a. 踉跄的（构词: s + tumble + ing）","tumbledown a. 摇摇欲坠的（构词: tumble + down）","humble a. 谦卑的（构词: h + umble）","tumbling n. 翻筋斗（构词: tumble + ing）","jumble v. 混杂 n.混乱（构词: j + umble）","crumble v. 崩溃,瓦解（构词: cr + umble）","rumble v./n. 隆隆声（构词: r + umble）","fumble v. 笨拙地摸索（构词: f + umble）","grumble v. 抱怨,咕哝（构词: gr + umble）"]},{"id":354,"root":"wife","pronounce":"/wɪf/威夫","source":"古英语 wīf","meaning":"妻子,已婚女性","mnemonic":"wife本身就是我们小学学过的wife。 wife 就是“妻子”。 所以wife就是“妻子、已婚女性”。","mainWords":[{"word":"wife","pos":"n.","detail":"构词: 构词: wife(妻子)<br>释义: 妻子","example":"例句: His wife is a doctor. ｜ 推导: 本身即为词根,表示妻子"},{"word":"housewife","pos":"n.","detail":"构词: 构词: house(家) + wife(妻子)<br>释义: 家庭主妇","example":"例句: She chose to be a housewife. ｜ 推导: 家 + 妻子 = 在家的妻子,家庭主妇"}],"extra":["midwife n. 助产士（构词: mid(协助) + wife）","fishwife n. 卖鱼妇;泼妇（构词: fish + wife）","goodwife n. (古)主妇;太太（构词: good + wife）"]},{"id":355,"root":"ball","pronounce":"/bɔːl/博勒","source":"日耳曼语","meaning":"球,球状物","mnemonic":"ball本身就是我们小学学过的ball。 ball 就是“球、球状物”。 所以ball就是“球、球状物”。","mainWords":[{"word":"ball","pos":"n.","detail":"构词: 构词: ball(球)<br>释义: 球,球状物","example":"例句: He kicked the ball hard. ｜ 推导: 原始词根 = 球形物体"},{"word":"balloon","pos":"n.","detail":"构词: 构词: ball(球) + oon(名词后缀)<br>释义: 气球 v.膨胀","example":"例句: The balloon floated away. ｜ 推导: 球 + 名词化 = 充气的球状物"},{"word":"football","pos":"n.","detail":"构词: 构词: foot(足) + ball(球)<br>释义: 足球","example":"例句: He plays football every week. ｜ 推导: 足 + 球 = 用脚踢的球类运动"},{"word":"basketball","pos":"n.","detail":"构词: 构词: basket(篮) + ball(球)<br>释义: 篮球","example":"例句: Basketball is a popular sport. ｜ 推导: 篮 + 球 = 投篮的球类运动"},{"word":"volleyball","pos":"n.","detail":"构词: 构词: volley(凌空击) + ball(球)<br>释义: 排球","example":"例句: Volleyball is an Olympic sport. ｜ 推导: 凌空击 + 球 = 凌空击打的球类运动"},{"word":"baseball","pos":"n.","detail":"构词: 构词: base(垒) + ball(球)<br>释义: 棒球","example":"例句: Baseball is America's pastime. ｜ 推导: 垒 + 球 = 跑垒的球类运动"}],"extra":["eyeball n. 眼球（构词: eye + ball）","meatball n. 肉丸（构词: meat + ball）","snowball n. 雪球（构词: snow + ball）","pinball n. 弹球游戏（构词: pin + ball）","handball n. 手球（构词: hand + ball）","softball n. 垒球（构词: soft + ball）","fireball n. 火球（构词: fire + ball）","ballpoint n. 圆珠笔（构词: ball + point）"]},{"id":356,"root":"capt/cap","pronounce":"/kæpt/卡普特","source":"拉丁语 capere","meaning":"抓住,捕获;盛放","mnemonic":"①cap就是“卡”。把一个东西卡住，就能表示、捕获它；capt只是后面多了 t，核心声音和画面没有改变。②小学词 cap 是帽子或盖子，盖子扣在瓶口上能把里面的东西盛住、不让它流出。所以capt/cap就是“表示、捕获；盛放”。","mainWords":[{"word":"capture","pos":"v./n.","detail":"构词: 构词: capt(抓住) + ure(名词后缀)<br>释义: 捕获,俘虏","example":"例句: They captured the enemy base. ｜ 推导: 抓住 + 行为结果 = 捕获,俘虏"},{"word":"captive","pos":"n.","detail":"构词: 构词: capt(抓住) + ive(形容词后缀)<br>释义: 俘虏 a.被俘的","example":"例句: The captive was released. ｜ 推导: 抓住 + 被...的 = 被抓住的人,俘虏"},{"word":"recapture","pos":"v.","detail":"构词: 构词: re(重新) + capture(捕获)<br>释义: 夺回,重获","example":"例句: We must recapture the city. ｜ 推导: 重新 + 抓住 = 夺回,重新捕获"},{"word":"capacity","pos":"n.","detail":"构词: 构词: cap(盛) + acity(名词后缀)<br>释义: 容量,能力","example":"例句: The hall has a large capacity. ｜ 推导: 盛放 + 状态 = 能盛放的量,容量"},{"word":"capable","pos":"a.","detail":"构词: 构词: cap(盛) + able(能...的)<br>释义: 有能力的","example":"例句: She is capable of great things. ｜ 推导: 能盛放 = 有容纳知识的能力"},{"word":"capsule","pos":"n.","detail":"构词: 构词: cap(盛) + sule(小词缀)<br>释义: 胶囊,容器","example":"例句: Take one capsule daily. ｜ 推导: 盛放 + 小容器 = 胶囊,小盒子"}],"extra":["caption n. 标题,说明文字（构词: capt + ion）","capability n. 能力,才能（构词: cap + ability）","captivity n. 囚禁,监禁（构词: capt + ivity）","encapsulate v. 概括,封装（构词: en + cap + sulate）","captor n. 捕获者（构词: capt + or）","captivating a. 迷人的（构词: captivate + ing）","captivate v. 迷住,吸引（构词: capt + ivate）","capacitate v. 使有能力（构词: cap + acitate）","incapable a. 无能力的（构词: in + capable）","captious a. 挑剔的（构词: capt + ious）"]},{"id":357,"root":"dat-","pronounce":"/dæt/戴特","source":"拉丁语 dare (给)","meaning":"给,给予","mnemonic":"dat就是“带它给人”。 把东西带到别人面前交出去，就是给和给予。 所以dat就是“给、给予”。","mainWords":[{"word":"data","pos":"n.","detail":"构词: 构词: dat(给) + a<br>释义: 数据,资料","example":"例句: The data shows clear trends. ｜ 推导: 给 + 名词化 = 给定的东⻄,数据"},{"word":"date","pos":"n.","detail":"构词: 构词: dat(给) + e<br>释义: 日期;约会","example":"例句: What's today's date? ｜ 推导: 给 + 名词化 = 给定的时间,日期"},{"word":"database","pos":"n.","detail":"构词: 构词: data + base(基础)<br>释义: 数据库","example":"例句: Search the database for info. ｜ 推导: 数据 + 基础 = 数据的基地,数据库"},{"word":"update","pos":"v.","detail":"构词: 构词: up(向上) + dat(给) + e<br>释义: 更新 n.更新","example":"例句: Please update your software. ｜ 推导: 向上 + 给 = 给予新的,更新"},{"word":"up-to-date","pos":"a.","detail":"构词: 构词: up + to + date<br>释义: 最新的","example":"例句: Keep your info up-to-date. ｜ 推导: 向上 + 到 + 日期 = 更新到最新日期的"}],"extra":["antedate v. 先于,早于（构词: ante(前) + dat + e）","postdate v. 推迟日期（构词: post(后) + dat + e）"]},{"id":358,"root":"dead","pronounce":"/ded/德诶德","source":"古英语 dēad","meaning":"死亡,无生命的","mnemonic":"以后看到dead，直接想象骷髅或倒地后完全不动的图标。身体不再呼吸、没有生命活动，就是死亡、无生命状态。所以dead就是“死亡、无生命的”。","mainWords":[{"word":"dead","pos":"a.","detail":"构词: 构词: dead(死亡)<br>释义: 死的;无生命的","example":"例句: The battery is dead. ｜ 推导: 死亡 = 无生命的,失效的"},{"word":"deadly","pos":"a.","detail":"构词: 构词: dead(死亡) + ly(形容词后缀)<br>释义: 致命的;极度的","example":"例句: A deadly poison. ｜ 推导: 死亡 + 像...的 = 如死亡般的,致命的"},{"word":"deadline","pos":"n.","detail":"构词: 构词: dead(死亡) + line(线)<br>释义: 最后期限","example":"例句: The deadline is tomorrow. ｜ 推导: 死亡 + 线 = 不可逾越的截止线"}],"extra":["deaden v. 使麻木（构词: dead + en(动词后缀)）","deadlock n. 僵局（构词: dead + lock）"]},{"id":359,"root":"dem-/demo-","pronounce":"/dem/德诶姆","source":"希腊语 demos","meaning":"人民","mnemonic":"dem与小学词 them 只差首字母 d、th 的变化，核心读音接近。them 指“他们”，许多个“他们”聚在一起就是人民；demo是在 dem 后继续展开的形式。所以dem/demo就是“人民”。","mainWords":[{"word":"democracy","pos":"n.","detail":"构词: 构词: demo(人民) + cracy(统治)<br>释义: 民主,民主制","example":"例句: Democracy requires participation. ｜ 推导: 人民 + 统治 = 人民统治,民主"},{"word":"democratic","pos":"a.","detail":"构词: 构词: demo + crat + ic(形容词后缀)<br>释义: 民主的","example":"例句: A democratic society values freedom. ｜ 推导: 人民 + 统治 + 形容词化 = 民主的"},{"word":"epidemic","pos":"n.","detail":"构词: 构词: epi(在...之上) + dem(人民) + ic<br>释义: 流行病 a.流行的","example":"例句: The epidemic spread rapidly. ｜ 推导: 在...之上 + 人民 = 在人民中传播的,流行病"}],"extra":["demographic a. 人口统计的（构词: demo + graphic）","pandemic n. 大流行病（构词: pan(全) + dem + ic）","endemic a. 地方性的（构词: en(在内) + dem + ic）","demagogue n. 煽动家（构词: dem + agogue(引导)）"]},{"id":360,"root":"dens","pronounce":"/dens/德诶恩斯","source":"拉丁语 (浓密)","meaning":"浓密,稠密","mnemonic":"dens就是“蛋丝”。把大量蛋液打成细丝倒进汤里，蛋丝挤得很密，汤也会变得浓稠。所以dens就是“浓密、稠密”。","mainWords":[{"word":"dense","pos":"a.","detail":"构词: 构词: dens(浓密) + e(无意义)<br>释义: 浓厚的,密集的","example":"例句: The forest is very dense. ｜ 推导: 浓密 = 密集的,浓厚的"},{"word":"density","pos":"n.","detail":"构词: 构词: dens(浓密) + ity(名词后缀)<br>释义: 密度,浓度","example":"例句: The density of population is high. ｜ 推导: 浓密 + 名词化 = 密度,浓度"},{"word":"condense","pos":"v.","detail":"构词: 构词: con(加强) + dens(浓密) + e<br>释义: 浓缩,压缩","example":"例句: Water vapor condenses into drops. ｜ 推导: 加强 + 浓密 = 使更浓密,浓缩"}],"extra":["densely ad. 浓密地（构词: dens + e + ly）","condenser n. 冷凝器（构词: con + dens + er）","densify v. 使浓密（构词: dens + ify）","densimeter n. 密度计（构词: dens + i + meter）","condensed a. 浓缩的（构词: con + dens + ed）","condensable a. 可压缩的（构词: con + dens + able）","denseness n. 浓密（构词: dens + e + ness）","densification n. 密实化（构词: dens + ification）","condensation n. 浓缩（构词: con + dens + ation）","superdense a. 超密集的（构词: super + dens + e）"]},{"id":361,"root":"fail","pronounce":"/feɪl/夫诶勒","source":"拉丁语 fallere","meaning":"失败,未能成功","mnemonic":"fail就是“废噢”或“废哦”。一件事做到最后废了，说明没有成功、已经失败。所以fail就是“失败、未能成功”的意思。","mainWords":[{"word":"fail","pos":"v.","detail":"构词: 构词: fail(失败)<br>释义: 失败,不及格","example":"例句: I don't want to fail. ｜ 推导: 废了 = 完了,失败了"},{"word":"failure","pos":"n.","detail":"构词: 构词: fail(失败) + ure(名词后缀)<br>释义: 失败;失败者","example":"例句: Failure is the mother of success. ｜ 推导: 失败 + 名词化 = 失败(的状态)"}],"extra":["failed a. 失败的（构词: fail + ed）","failover n. 故障转移（构词: fail + over）","failing n. 缺点,弱点（构词: fail + ing）","failproof a. 不会失败的（构词: fail + proof）","unfailing a. 可靠的（构词: un + fail + ing）","fail-soft a. 失效保护的（构词: fail + soft）","unfailingly ad. 可靠地（构词: un + fail + ingly）","failable a. 易失败的（构词: fail + able）","never-failing a. 不尽的（构词: never + fail + ing）","failingly ad. 失败地（构词: fail + ingly）","fail-safe a. 故障保险的（构词: fail + safe）","failsome a. 易失败的（构词: fail + some）"]},{"id":362,"root":"find","pronounce":"/faɪnd/夫爱恩德","source":"古英语 findan","meaning":"查找,寻找,发现","mnemonic":"find本身就是我们小学学过的find。 find 就是“找到、发现”。 所以find就是“查找、寻找、发现”。","mainWords":[{"word":"find","pos":"v.","detail":"构词: 构词: find(翻找、查找)<br>释义: 找到,发现","example":"例句: I can't find my keys. ｜ 推导: 原始词根 = 翻找,寻找,发现"},{"word":"finding","pos":"n.","detail":"构词: 构词: find(发现) + ing(名词后缀)<br>释义: 发现,调查结果","example":"例句: The research findings are important. ｜ 推导: 发现 + 名词化 = 发现物,研究结果"}],"extra":["finder n. 发现者,探测器（构词: find + er）","unfindable a. 找不到的（构词: un + find + able）","findable a. 可发现的（构词: find + able）","faultfinder n. 挑剔者（构词: fault + find + er）","pathfinder n. 探路者（构词: path + find + er）","fact-find v. 实情调查（构词: fact + find）","viewfinder n. 取景器（构词: view + find + er）","rangefinder n. 测距仪（构词: range + find + er）","found v. 找到(过去式) (find的过去式)","wayfinder n. 导航仪（构词: way + find + er）","refind v. 再次发现（构词: re + find）","outfind v. 发现更多（构词: out + find）"]},{"id":363,"root":"free","pronounce":"/friː/弗里","source":"古英语 freo","meaning":"自由的,不受束缚的","mnemonic":"free本身就是我们小学学过的free。 free 就是“自由的、免费的”。 所以free就是“自由的、不受束缚的”。","mainWords":[{"word":"free","pos":"a.","detail":"构词: 构词: free(自由的)<br>释义: 自由的;免费的","example":"例句: Feel free to ask questions. ｜ 推导: 自由的 = 不受束缚的,自由的"},{"word":"freedom","pos":"n.","detail":"构词: 构词: free(自由) + dom(状态后缀)<br>释义: 自由;自主","example":"例句: Freedom is a basic human right. ｜ 推导: 自由 + 状态 = 自由的状态,自由"}],"extra":["freely ad. 自由地;免费地（构词: free + ly）","freeway n. 高速公路（构词: free + way）","freeman n. 自由人（构词: free + man）","freehand a. 徒手的（构词: free + hand）","carefree a. 无忧无虑的（构词: care + free）","freelance a. 自由职业的（构词: free + lance）"]},{"id":364,"root":"gree","pronounce":"/griː/格里","source":"拉丁语 gratus(满意的)","meaning":"认同,认可,同意","mnemonic":"方法一： gree是我们小学学过的词agree的一部分。 agree 就是“同意、赞同”。 在这个词里，负责表达“认同”这一层意思的部分就是gree。 所以gree就是“认同、认可、同意”。 方法二： gree就是“给”。别人询问你的意见时，你“给”他一个点头，表示认可他的说法；点头认可，也就是认同、同意。所以gree就是“认同、认可、同意”。","mainWords":[{"word":"agree","pos":"vi.","detail":"构词: 构词: a(使) + gree(认同)<br>释义: 同意,赞同","example":"例句: I agree with your opinion. ｜ 推导: 使 + 认同 = 同意,赞同"},{"word":"agreement","pos":"n.","detail":"构词: 构词: agree(同意) + ment(名词后缀)<br>释义: 协议,一致","example":"例句: We reached an agreement. ｜ 推导: 同意 + 名词化 = 协议,协定"},{"word":"disagree","pos":"vi.","detail":"构词: 构词: dis(不) + agree(同意)<br>释义: 不同意","example":"例句: I disagree with that idea. ｜ 推导: 不 + 同意 = 不同意,反对"},{"word":"agreeable","pos":"a.","detail":"构词: 构词: agree(认可) + able(能...的)<br>释义: 令人愉快的","example":"例句: An agreeable surprise. ｜ 推导: 能认可的 = 令人愉快的,合意的"}],"extra":["agreeably ad. 愉快地（构词: agree + ably）","disagreeable a. 不愉快的（构词: dis + agree + able）","agreeing a. 同意的（构词: agree + ing）","agreeable a. 适合的（构词: agree + able）","agreed a. 商定的（构词: agree + ed）","agreeability n. 愉悦性（构词: agree + ability）","agreeableness n. 愉快（构词: agree + ableness）","unagreeable a. 不合适的（构词: un + agree + able）","disagreement n. 分歧（构词: dis + agree + ment）","agreeance n. 同意,一致（构词: agree + ance）"]},{"id":365,"root":"key","pronounce":"/ki:/克衣","source":"古英语 cǣg","meaning":"钥匙,关键,琴键","mnemonic":"key本身就是我们小学学过的key。 key 就是“钥匙、关键、主要的”。 所以key就是“钥匙、关键、琴键”。","mainWords":[{"word":"key","pos":"n.","detail":"构词: 构词: key(钥匙)<br>释义: 钥匙;关键 a.主要的","example":"例句: The key to success is hard work. ｜ 推导: 钥匙 = 开启事物的工具,关键"},{"word":"keyboard","pos":"n.","detail":"构词: 构词: key(琴键) + board(板)<br>释义: 键盘","example":"例句: She types fast on the keyboard. ｜ 推导: 琴键 + 板 = 装有按键的板,键盘"}],"extra":["keyword n. 关键词（构词: key + word）","keystone n. 拱顶石;关键（构词: key + stone）","keynote n. 主旨;基调（构词: key + note）","keypad n. 小键盘（构词: key + pad）"]},{"id":366,"root":"long/longus","pronounce":"/lɒŋ/勒奥昂","source":"拉丁语 longus","meaning":"长,长的","mnemonic":"long/longus本身就是我们小学学过的long。 long 就是“长的、长久地”。 所以long/longus就是“长、长的”。","mainWords":[{"word":"long","pos":"a.","detail":"构词: 构词: long(长)<br>释义: 长的 ad.长久地","example":"例句: It's a long journey. ｜ 推导: 原始词根 = 长的,长久的"},{"word":"along","pos":"ad.","detail":"构词: 构词: a(在...上) + long(长)<br>释义: 向前 prep.沿着","example":"例句: Walk along the river. ｜ 推导: 顺着长的方向 = 沿着"},{"word":"alongside","pos":"prep.","detail":"构词: 构词: along(沿着) + side(边)<br>释义: 在...旁边","example":"例句: Work alongside your team. ｜ 推导: 沿着边 = 在旁边,并肩"},{"word":"prolong","pos":"v.","detail":"构词: 构词: pro(向前) + long(长)<br>释义: 延长,拖延","example":"例句: Don't prolong the meeting. ｜ 推导: 向前拉长 = 延长"},{"word":"longitude","pos":"n.","detail":"构词: 构词: longi(长) + tude(状态)<br>释义: 经度","example":"例句: The longitude of Beijing is 116°E. ｜ 推导: 东西方向的长度 = 经度"}],"extra":["elongate v. 延长,拉长（构词: e + long + ate）","longitudinal a. 纵向的（构词: longitud + inal）"]},{"id":367,"root":"lord","pronounce":"/lɔːrd/勒奥儿德","source":"古英语 (主人)","meaning":"主,上帝,领主","mnemonic":"lord就是“老大”的开头。老大是掌管一群人的主人或领主；在宗教语境中，最高的“主”又指上帝。所以lord就是“主、上帝、领主”。","mainWords":[{"word":"lord","pos":"n.","detail":"构词: 构词: lord(主,上帝)<br>释义: 领主,上帝","example":"例句: The Lord is my shepherd. ｜ 推导: 原始词根 = 主人,统治者,上帝"},{"word":"landlord","pos":"n.","detail":"构词: 构词: land(土地) + lord(主)<br>释义: 房东,地主","example":"例句: The landlord raised the rent. ｜ 推导: 土地 + 主 = 土地的主人,房东"}],"extra":["lordly a. 贵族般的（构词: lord + ly）","lordling n. 小贵族（构词: lord + ling）","lordship n. 贵族身份（构词: lord + ship）","landlordism n. 地主制度（构词: landlord + ism）","warlord n. 军阀（构词: war + lord）","landlordly a. 房东的（构词: landlord + ly）","overlord n. 霸主（构词: over + lord）","lordliness n. 贵族气派（构词: lord + liness）","milord n. 老爷（构词: my + lord）","overlordship n. 霸权（构词: overlord + ship）","slumlord n. 贫民窟房东（构词: slum + lord）","lordless a. 无主的（构词: lord + less）","druglord n. 毒枭（构词: drug + lord）","lordy int. 天哪（构词: lord + y）"]},{"id":368,"root":"milli","pronounce":"/ˈmɪli/米利","source":"拉丁语 mille(千)","meaning":"千分之一;一千","mnemonic":"小学数学里，1 米可以分成 1000 个毫米。这里的 milli 一方面对应“一千份”，另一方面表示其中每一份是原来的“千分之一”。所以milli就是“千分之一；一千”。","mainWords":[{"word":"million","pos":"num./n.","detail":"构词: 构词: mill(千) + ion(名词后缀)<br>释义: 百万","example":"例句: Two million people attended. ｜ 推导: 千×千 = 一千个一千,百万"},{"word":"millionaire","pos":"n.","detail":"构词: 构词: million(百万) + aire(人)<br>释义: 百万富翁","example":"例句: He became a millionaire overnight. ｜ 推导: 百万 + 人 = 拥有百万的人,百万富翁"},{"word":"millimeter","pos":"n.","detail":"构词: 构词: milli(千分之一) + meter(米)<br>释义: 毫米","example":"例句: The gap is only 2 millimeters wide. ｜ 推导: 千分之一 + 米 = 千分之一米,毫米"},{"word":"millennial","pos":"a.","detail":"构词: 构词: mill(千) + enn(年) + ial(形容词后缀)<br>释义: 千年的 n.千禧一代","example":"例句: Millennial culture is unique. ｜ 推导: 千 + 年 + 形容词化 = 千年的;千禧一代"}],"extra":["milligram n. 毫克（构词: milli + gram）","billion n. 十亿（构词: bi + mill + ion）","milliliter n. 毫升（构词: milli + liter）","trillion n. 万亿（构词: tri + mill + ion）","millisecond n. 毫秒（构词: milli + second）","millionth n. 百万分之一（构词: million + th）","millivolt n. 毫伏（构词: milli + volt）","millibar n. 毫巴(压强单位)（构词: milli + bar）","millennium n. 千年（构词: mill + ennium）","milliampere n. 毫安（构词: milli + ampere）"]},{"id":369,"root":"pens","pronounce":"/pens/普诶恩斯","source":"拉丁语 (称重、支付)","meaning":"钱,花费","mnemonic":"pens是我们小学学过的spend的一部分。spend就是花费，花费时最常用的是钱，所以pens就是“钱、花费”的意思。","mainWords":[{"word":"expense","pos":"n.","detail":"构词: 构词: ex(向外) + pens(钱) + e<br>释义: 花费,消费","example":"例句: Travel expenses are high. ｜ 推导: 向外 + 钱 = 花出去的钱,费用"},{"word":"expensive","pos":"a.","detail":"构词: 构词: ex + pens(钱) + ive(形容词后缀)<br>释义: 昂贵的","example":"例句: This car is too expensive. ｜ 推导: 花钱的 + 形容词化 = 昂贵的"},{"word":"pension","pos":"n.","detail":"构词: 构词: pens(钱) + ion(名词后缀)<br>释义: 养老金","example":"例句: He lives on his pension. ｜ 推导: 钱 + 名词化 = 退休金,养老金"},{"word":"compensate","pos":"v.","detail":"构词: 构词: com(加强) + pens(钱) + ate<br>释义: 补偿","example":"例句: We'll compensate you. ｜ 推导: 加强 + 钱 = 赔钱,补偿"},{"word":"compensation","pos":"n.","detail":"构词: 构词: com + pens + ation<br>释义: 补偿,赔偿","example":"例句: Get compensation for damages. ｜ 推导: 补偿 + 名词化 = 赔偿金"},{"word":"expend","pos":"v.","detail":"构词: 构词: ex(向外) + pend(花费)<br>释义: 花费,消耗","example":"例句: Don't expend all your energy. ｜ 推导: 向外 + 花费 = 花费,消耗"},{"word":"expenditure","pos":"n.","detail":"构词: 构词: expend + iture(名词后缀)<br>释义: 支出,花费","example":"例句: Control your expenditure. ｜ 推导: 花费 + 名词化 = 支出,开支"},{"word":"indispensable","pos":"a.","detail":"构词: 构词: in(不) + dispens + able<br>释义: 必不可少的","example":"例句: Water is indispensable to life. ｜ 推导: 不 + 可分配的 = 不可缺少的"}],"extra":[]},{"id":370,"root":"poss","pronounce":"/pɒs/普奥斯","source":"拉丁语 posse (能够)","meaning":"可能,可能性","mnemonic":"poss就是“怕是”。说“怕是会下雨”，表示事情还没有完全确定，只是有发生的可能；能不能发生，就是可能性。所以poss就是“可能、可能性”。","mainWords":[{"word":"possible","pos":"a.","detail":"构词: 构词: poss(可能) + ible(形容词后缀)<br>释义: 可能的","example":"例句: It's possible to finish today. ｜ 推导: 可能 + 形容词化 = 可能的,可行的"},{"word":"possibly","pos":"ad.","detail":"构词: 构词: poss(可能) + ibly(副词后缀)<br>释义: 可能地","example":"例句: I can't possibly agree. ｜ 推导: 可能 + 副词化 = 可能地,也许"},{"word":"impossible","pos":"a.","detail":"构词: 构词: im(否定) + poss(可能) + ible<br>释义: 不可能的","example":"例句: Nothing is impossible. ｜ 推导: 不 + 可能的 = 不可能的,办不到的"},{"word":"possibility","pos":"n.","detail":"构词: 构词: poss(可能) + ibility(名词后缀)<br>释义: 可能性","example":"例句: There's a possibility of rain. ｜ 推导: 可能 + 名词化 = 可能性,可能的事"}],"extra":["impossibility n. 不可能性（构词: im + poss + ibility）","possessor n. 拥有者（构词: poss + essor）","impossibly ad. 不可能地（构词: im + poss + ibly）","dispossess v. 剥夺（构词: dis + poss + ess）","possess v. 拥有（构词: poss + ess）","repossess v. 收回（构词: re + poss + ess）","possession n. 拥有物（构词: poss + ession）","prepossess v. 预先影响（构词: pre + poss + ess）","possessive a. 占有的（构词: poss + essive）","possessed a. 着魔的（构词: poss + essed）"]},{"id":371,"root":"post","pronounce":"/pəʊst/普欧斯特","source":"拉丁语 (驿站)","meaning":"邮寄,张贴","mnemonic":"post本身就是我们小学学过的post。 post 就是“邮寄、邮政、职位”。 所以post就是“邮寄、张贴”。","mainWords":[{"word":"post","pos":"v.","detail":"构词: 构词: post(邮寄)<br>释义: 邮寄 n.邮政;职位","example":"例句: Please post this letter. ｜ 推导: 原始词根 = 邮寄,张贴"},{"word":"poster","pos":"n.","detail":"构词: 构词: post(张贴) + er(人/物)<br>释义: 海报,张贴者","example":"例句: A movie poster on the wall. ｜ 推导: 张贴 + 名词化 = 被张贴的东⻄"},{"word":"postage","pos":"n.","detail":"构词: 构词: post(邮寄) + age(费用后缀)<br>释义: 邮费,邮资","example":"例句: The postage is expensive. ｜ 推导: 邮寄 + 费用 = 邮寄的费用"},{"word":"postcard","pos":"n.","detail":"构词: 构词: post(邮寄) + card(卡片)<br>释义: 明信片","examp t(放置) + ting(名词后缀)<br>释义: 环境,背景,设置","example":"例句: The story has a rural setting. ｜ 推导: 放置 + 名词化 = 安置的环境"},{"word":"settlement","pos":"n.","detail":"构词: 构词: settle + ment(名词后缀)<br>释义: 定居点,解决","example":"例句: They reached a settlement. ｜ 推导: 安顿 + 名词化 = 定居点,解决方案"},{"word":"upset","pos":"v.","detail":"构词: 构词: up(向上) + set(放置)<br>释义: 打翻 a.心烦的","example":"例句: Don't upset the glass. ｜ 推导: 向上 + 放置 = 颠覆状态,打乱"},{"word":"setback","pos":"n.","detail":"构词: 构词: set(放置) + back(后退)<br>释义: 挫折,倒退","example":"例句: We suffered a major setback. ｜ 推导: 放置 + 后退 = 被迫后退,挫折"},{"word":"outset","pos":"n.","detail":"构词: 构词: out(外,出) + set(放置)<br>释义: 开始,开端","example":"例句: From the outset, we knew. ｜ 推导: 向外 + 放置 = 开始放置,开端"},{"word":"sunset","pos":"n.","detail":"构词: 构词: sun(太阳) + set(放置)<br>释义: 日落,傍晚","example":"例句: We watched the sunset. ｜ 推导: 太阳 + 放置 = 太阳落下,日落"}],"extra":["reset v. 重置（构词: re + set）","settler n. 定居者（构词: settle + er）","preset v. 预设（构词: pre + set）","unsettled a. 未解决的（构词: un + settled）","offset v. 抵消（构词: off + set）","inset n. 插入物（构词: in + set）","mindset n. 心态（构词: mind + set）","setup n. 装置,设置（构词: set + up）"]},{"id":374,"root":"solid","pronounce":"/ˈsɒlɪd/斯奥利德","source":"拉丁语 solidus","meaning":"坚固的,密实的","mnemonic":"solid就是“锁牢的”。一个东西被锁得牢牢的，不松、不散，内部也压得很密实；这种状态就是坚固、密实。所以solid就是“坚固的、密实的”。","mainWords":[{"word":"solid","pos":"a.","detail":"构词: 构词: solid(坚固的)<br>释义: 固体的;坚固的","example":"例句: The evidence is solid. ｜ 推导: 坚固的 = 固体的,可靠的"},{"word":"consolidate","pos":"v.","detail":"构词: 构词: con(共同) + solid + ate<br>释义: 巩固;合并","example":"例句: Consolidate your knowledge. ｜ 推导: 共同 + 坚固 + 动词化 = 使坚固,巩固"},{"word":"solidarity","pos":"n.","detail":"构词: 构词: solid + arity(名词后缀)<br>释义: 团结;一致","example":"例句: We stand in solidarity. ｜ 推导: 坚固 + 状态 = 坚固一体的状态,团结"}],"extra":["solidify v. 凝固;巩固（构词: solid + ify）","solidity n. 坚固性（构词: solid + ity）","solidification n. 凝固;固化（构词: solid + ification）","solidly ad. 坚固地（构词: solid + ly）","consolidation n. 巩固;合并（构词: con + solid + ation）"]},{"id":375,"root":"tempor","pronounce":"/ˈtempər/特诶姆珀儿","source":"tem(时间)+por(孔隙)","meaning":"时间,暂时","mnemonic":"tempor是我们学过的temporary的一部分。temporary就是暂时的，任何暂时状态都只存在一段时间，所以tempor就是“时间,暂时”的意思。","mainWords":[{"word":"temporary","pos":"a.","detail":"构词: 构词: tempor(暂时) + ary(形容词后缀)<br>释义: 暂时的","example":"例句: It's just a temporary job. ｜ 推导: 暂时 + 形容词化 = 暂时的,临时的"},{"word":"contemporary","pos":"a.","detail":"构词: 构词: con(共同) + tempor(时间) + ary<br>释义: 当代的","example":"例句: Contemporary art museum. ｜ 推导: 共同 + 时间 = 同时代的,当代的"},{"word":"tempo","pos":"n.","detail":"构词: 构词: temp(时间) + o(名词后缀)<br>释义: 节奏,速度","example":"例句: The tempo of the music. ｜ 推导: 时间的快慢 = 节奏,速度"}],"extra":["temporal a. 时间的（构词: tempor + al）","tempest n. 暴风雨（构词: temp + est）","temporarily ad. 暂时地（构词: tempor + arily）","temperament n. 性情（构词: temper + ament）","temporality n. 暂时性（构词: tempor + ality）","temperate a. 温和的（构词: temper + ate）","temporize v. 拖延（构词: tempor + ize）","temperature n. 温度（构词: temper + ature）","extemporary a. 即兴的（构词: ex + tempor + ary）","atemporal a. 永恒的（构词: a + tempor + al）"]},{"id":376,"root":"test-","pronounce":"/test/特诶斯特","source":"拉丁语 testari","meaning":"作证,证明","mnemonic":"test就是小学词“测试”。用一次测试得到结果，再拿这个结果说明一件事是真的，就是在作证和证明。所以test-就是“作证、证明”。","mainWords":[{"word":"test","pos":"n.","detail":"构词: 构词: test(证明)<br>释义: 测试;考试 v.测验","example":"例句: Take the final test tomorrow. ｜ 推导: 证明 = 通过考验来证明"},{"word":"testify","pos":"v.","detail":"构词: 构词: test(证明) + ify(动词后缀)<br>释义: 作证;证明","example":"例句: He will testify in court. ｜ 推导: 证明 + 动词化 = 作证,证明"},{"word":"testimony","pos":"n.","detail":"构词: 构词: test(证明) + imony(名词后缀)<br>释义: 证词;证据","example":"例句: Her testimony was crucial. ｜ 推导: 证明 + 名词化 = 证词,证据"},{"word":"protest","pos":"v./n.","detail":"构词: 构词: pro(向前) + test(证明)<br>释义: 抗议;反对","example":"例句: They protest against the policy. ｜ 推导: 向前 + 证明 = 公开声明反对,抗议"},{"word":"contest","pos":"n.","detail":"构词: 构词: con(一起) + test(证明)<br>释义: 竞赛 v.争夺;质疑","example":"例句: A fierce contest for the prize. ｜ 推导: 一起 + 证明 = 共同证明实力,竞赛"}],"extra":["testament n. 遗嘱;圣经（构词: test + a He comes from a wealthy family. ｜ 推导: 财富 + 形容词化 = 拥有财富的,富有的"},{"word":"commonwealth","pos":"n.","detail":"构词: 构词: common(共同) + wealth<br>释义: 联邦;共和国","example":"例句: The Commonwealth of Nations. ｜ 推导: 共同 + 财富 = 共同福祉的政体,联邦"}],"extra":["weal n. 福利;幸福 (weal)","commonweal n. 公益（构词: common + weal）","wealthiness n. 富裕（构词: wealth + iness）","unwealthy a. 不富裕的（构词: un + wealthy）"]},{"id":380,"root":"will","pronounce":"/wɪl/威勒","source":"古英语 willan","meaning":"意愿,意志,决心","mnemonic":"will本身就是我们小学学过的will。 will 就是“将要、意志、遗嘱”。 所以will就是“意愿、意志、决心”。","mainWords":[{"word":"will","pos":"v.","detail":"构词: 构词: will(意愿)<br>释义: 将要 n.意志;遗嘱","example":"例句: Where there's a will, there's a way. ｜ 推导: 意愿 = 意志,决心"},{"word":"willing","pos":"a.","detail":"构词: 构词: will(意愿) + ing(形容词后缀)<br>释义: 愿意的,乐意的","example":"例句: He is willing to help. ｜ 推导: 意愿 + 形容词化 = 有意愿的,愿意的"}],"extra":["willingness n. 意愿,乐意（构词: willing + ness）","unwilling a. 不愿意的（构词: un + willing）","willful a. 任性的;故意的（构词: will + ful）","goodwill n. 善意;友好（构词: good + will）","willpower n. 意志力（构词: will + power）"]},{"id":381,"root":"-ward","pronounce":"/wərd/乌额儿德","source":"古英语 way的变体","meaning":"向...的,朝...方向","mnemonic":"-ward可以和小学词 up、down 组合来看：前面是 up，方向就朝上；前面是 down，方向就朝下。前面的词决定具体方向，-ward 统一表示“朝着这个方向”。所以-ward就是“向……的、朝……方向”。","mainWords":[{"word":"toward","pos":"prep.","detail":"构词: 构词: to(到) + ward<br>释义: 朝,向","example":"例句: Walk toward me. ｜ 推导: 到 + 向...的 = 朝向"},{"word":"forward","pos":"a./ad.","detail":"构词: 构词: fore(前) + ward<br>释义: 向前的","example":"例句: Move forward. ｜ 推导: 前 + 向...的 = 向前的"},{"word":"afterward","pos":"ad.","detail":"构词: 构词: after(后) + ward<br>释义: 以后","example":"例句: See you afterward. ｜ 推导: 后 + 向...的 = 向后的时间"},{"word":"backward","pos":"a./ad.","detail":"构词: 构词: back(后) + ward<br>释义: 向后的","example":"例句: Step backward. ｜ 推导: 后 + 向...的 = 向后的"},{"word":"upward","pos":"a./ad.","detail":"构词: 构词: up(上) + ward<br>释义: 向上的","example":"例句: Look upward. ｜ 推导: 上 + 向...的 = 向上的"},{"word":"downward","pos":"a./ad.","detail":"构词: 构词: down(下) + ward<b
