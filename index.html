":"percentage","pos":"n.","detail":"构词: 构词: percent + age(状态)<br>释义: 百分比","example":"例句: What's the percentage of success? ｜ 推导: 每百中的份额所形成的比例 = 百分比"},{"word":"centigrade","pos":"a.","detail":"构词: 构词: cent(百) + grade(度)<br>释义: 摄氏的;百分度的","example":"例句: Water boils at 100°centigrade. ｜ 推导: 百 + 度 = 百分度刻度"},{"word":"centimeter","pos":"n.","detail":"构词: 构词: cent(百分之一) + meter(米)<br>释义: 厘米","example":"例句: It's 5 centimeters long. ｜ 推导: 百分之一 + 米 = 1米的1/100"}],"extra":["centennial a. 一百年的（构词: cent + ennial）","centurion n. 百夫长（构词: century + ion）"]},{"id":501,"root":"centr","pronounce":"/ˈsentr/瑟恩特儿","source":"拉丁语 centrum","meaning":"中心","mnemonic":"centr可以直接做一个位置图。 画一个大 circle，把 centr 写在 circle 的 middle。无论从哪个方向量距离，这个位置都处在最中间，周围各部分围着它展开。 所以以后看到 centr，就把它放到圆的正中央。 所以centr就是“中心”。","mainWords":[{"word":"central","pos":"a.","detail":"构词: 构词: centr(中心) + al(形容词后缀)<br>释义: 中心的,中央的","example":"例句: The central government decided. ｜ 推导: 中心 + 形容词化 = 位于核心的"},{"word":"centre","pos":"n.","detail":"构词: 构词: centr(中心) + e<br>释义: 中心 v.集中","example":"例句: The city centre is busy. ｜ 推导: 中心 = 空间的核心点"},{"word":"concentrate","pos":"v.","detail":"构词: 构词: con(共同) + centr + ate<br>释义: 集中,专心","example":"例句: Concentrate on your work. ｜ 推导: 共同 + 中心 + 动词化 = 向中心汇聚"},{"word":"concentration","pos":"n.","detail":"构词: 构词: concentrate + ion<br>释义: 专注;浓度","example":"例句: High concentration is needed. ｜ 推导: 集中 + 名词化 = 聚集的程度"},{"word":"eccentric","pos":"a.","detail":"构词: 构词: ec(外) + centr(中心) + ic<br>释义: 古怪的,异常的","example":"例句: He has eccentric habits. ｜ 推导: 外 + 中心 = 偏离中心,不合常规"}],"extra":["concentric a. 同心的（构词: con + centr + ic）","decentralize v. 分散（构词: de + central + ize）"]},{"id":502,"root":"claim","pronounce":"/kleɪm/克勒诶姆","source":"拉丁语 clamare (呼喊)","meaning":"呼喊,宣告","mnemonic":"claim就是“开嗓明说”。一个人把嗓子打开，把自己的要求和主张明明白白说出来，就是呼喊和宣告。所以claim就是“呼喊、宣告”的意思。","mainWords":[{"word":"claim","pos":"v./n.","detail":"构词: 构词: claim(呼喊)<br>释义: 声称;索取","example":"例句: He claimed the prize. ｜ 推导: 呼喊 = 声称,索取"},{"word":"proclaim","pos":"v.","detail":"构词: 构词: pro(向前) + claim(呼喊)<br>释义: 宣布;声明","example":"例句: proclaim independence ｜ 推导: 向前呼喊 = 公开宣布"},{"word":"exclaim","pos":"v.","detail":"构词: 构词: ex(向外) + claim(呼喊)<br>释义: 惊呼;大叫","example":"例句: She exclaimed in surprise. ｜ 推导: 向外呼喊 = 惊呼"},{"word":"reclaim","pos":"v.","detail":"构词: 构词: re(回) + claim(呼喊)<br>释义: 取回;开垦","example":"例句: reclaim the land ｜ 推导: 呼喊收回 = 取回,开垦"},{"word":"acclaim","pos":"v./n.","detail":"构词: 构词: ac(向) + claim(呼喊)<br>释义: 称赞;喝彩","example":"例句: The movie won critical acclaim. ｜ 推导: 向...呼喊 = 欢呼,称赞"}],"extra":["disclaimer n. 免责声明（构词: dis + claimer）","proclamation n. 宣言 (proclamation)","claimant n. 申请人（构词: claim + ant）","exclamation n. 感叹 (exclamation)"]},{"id":503,"root":"clos/claus","pronounce":"/kləʊz/克勒欧兹","source":"拉丁语 claudere","meaning":"关闭,封闭","mnemonic":"clos/claus可以直接想到我们小学学过的close。close就是关上、封闭；门关上以后，里面和外面被隔开。所以clos/claus就是“关闭、封闭”的意思。","mainWords":[{"word":"close","pos":"v.","detail":"构词: 构词: clos(关闭) + e<br>释义: 关闭 a.接近的","example":"例句: Close the door, please. ｜ 推导: 关闭 = 关门,结束"},{"word":"closet","pos":"n.","detail":"构词: 构词: clos(关闭) + et(小)<br>释义: 壁橱;储藏室","example":"例句: Put clothes in the closet. ｜ 推导: 关闭 + 小空间 = 壁橱"},{"word":"disclose","pos":"v.","detail":"构词: 构词: dis(解除) + clos(关闭) + e<br>释义: 揭露;公开","example":"例句: He disclosed the secret. ｜ 推导: 解除 + 关闭 = 打开,揭露"},{"word":"enclose","pos":"v.","detail":"构词: 构词: en(进入) + clos(关闭) + e<br>释义: 围住;封入","example":"例句: Enclose your resume. ｜ 推导: 使进入 + 关闭 = 围住,封入"},{"word":"enclosure","pos":"n.","detail":"构词: 构词: en + clos + ure(名词后缀)<br>释义: 围场;附件","example":"例句: The lion enclosure. ｜ 推导: 围住 + 名词化 = 围起来的地方"}],"extra":["closure n. 关闭;结束（构词: clos + ure）","foreclose v. 取消赎回权（构词: fore + close）","closely ad. 紧密地（构词: close + ly）","enclosed a. 封闭的（构词: en + closed）"]},{"id":504,"root":"-clud-/-clus-","pronounce":"/klud/克勒乌德","source":"","meaning":"关闭","mnemonic":"clud/clus就是“扣住”。把门扣住就是关闭；把某样东西扣在里面，就是包括；把它扣在外面，就是排除。所以clud/clus就是“关闭”的意思，并可以由关闭推出包括和排除。","mainWords":[{"word":"conclude","pos":"v.","detail":"构词: 构词: con(完全) + clud(关) + e<br>释义: 结束;得出结论","example":"例句: We conclude the meeting at 5 PM. ｜ 推导: 完全 + 关闭 = 结束,下结论"},{"word":"conclusion","pos":"n.","detail":"构词: 构词: con + clus + ion(名词后缀)<br>释义: 结论;结束","example":"例句: Draw a conclusion from the data. ｜ 推导: 完全关闭的状态 = 结论"},{"word":"include","pos":"v.","detail":"构词: 构词: in(向内) + clud(关) + e<br>释义: 包含;包括","example":"例句: The price includes breakfast. ｜ 推导: 向内 + 关闭 = 关在里面,包含"},{"word":"inclusive","pos":"a.","detail":"构词: 构词: in + clus + ive(形容词后缀)<br>释义: 包容的;包含的","example":"例句: An inclusive environment for all. ｜ 推导: 关在里面的状态 = 包容的"},{"word":"exclude","pos":"v.","detail":"构词: 构词: ex(向外) + clud(关) + e<br>释义: 排除;拒绝","example":"例句: Exclude him from the team. ｜ 推导: 向外 + 关闭 = 关在外面,排除"},{"word":"exclusive","pos":"a.","detail":"构词: 构词: ex + clus + ive(形容词后缀)<br>释义: 排他的;独家的","example":"例句: An exclusive membership club. ｜ 推导: 关在外面的状态 = 排他的,独家的"},{"word":"preclude","pos":"v.","detail":"构词: 构词: pre(预先) + clud(关) + e<br>释义: 阻止;排除","example":"例句: This precludes any possibility. ｜ 推导: 预先 + 关闭 = 提前关闭可能性,阻止"}],"extra":[]},{"id":505,"root":"curs-/cours-","pronounce":"/kɜːrs/克儿斯","source":"拉丁语 currere","meaning":"跑,流动,运行","mnemonic":"curs/cours就是“疾驰”。人沿着road快速run，是运行；水沿着河道向前走，是流动。所以curs/cours就是“跑、流动、运行”的意思。","mainWords":[{"word":"course","pos":"n.","detail":"构词: 构词: cours(流动) + e<br>释义: 课程;路线;过程","example":"例句: Take a course in economics. ｜ 推导: 流动 = 知识/时间流动的路径,课程"},{"word":"discourse","pos":"n.","detail":"构词: 构词: dis(分离) + cours(流动) + e<br>释义: 论述;演讲","example":"例句: His discourse was well-received. ｜ 推导: 分离 + 流动 = 思想的流动扩散,论述"},{"word":"intercourse","pos":"n.","detail":"构词: 构词: inter(相互) + cours(流动) + e<br>释义: 交往;交流","example":"例句: Cultural intercourse promotes understanding. ｜ 推导: 相互 + 流动 = 双向交流,交往"},{"word":"curse","pos":"n.诅咒,咒语,祸因","detail":"构词: 构词: curs + e(连接元音)<br>释义: vt.诅咒,咒骂,使受罪","example":"推导: 核心词根「curs-/cours-」表示“跑,流动,运行”，结合前后缀，可推出“n.诅咒,咒语,祸因 vt.诅咒,咒骂,使受罪”"}],"extra":["cursor n. 光标（构词: curs(跑) + or）","cursory a. 粗略的（构词: curs + ory）","excursion n. 短途旅行（构词: ex(出) + curs + ion）","recourse n. 求助（构词: re(回) + cours + e）"]},{"id":506,"root":"curv-/curl-","pronounce":"/kɜːrv/克儿五","source":"拉丁语 curvus","meaning":"弯曲,卷曲","mnemonic":"curv-/curl就是“curl”。curl会让人直接想到“弯曲”，由这个意思还可以继续推出卷曲，所以curv-/curl就是“弯曲,卷曲”的意思。","mainWords":[{"word":"curve","pos":"n.","detail":"构词: 构词: curv(弯曲) + e<br>释义: 曲线 v.弯曲","example":"例句: The road curves to the right. ｜ 推导: 弯曲 = 曲线,弯曲"},{"word":"curl","pos":"v.","detail":"构词: 构词: curl(卷曲)<br>释义: 卷曲 n.卷发","example":"例句: Her hair curls naturally. ｜ 推导: 卷曲 = 使成卷状,卷发"},{"word":"curb","pos":"n.","detail":"构词: 构词: curb(curv的变形)<br>释义: 路缘 v.约束","example":"例句: We must curb spending. ｜ 推导: 弯曲的马勒 → 约束,控制"}],"extra":["curved a. 弯曲的（构词: curv + ed）","curvature n. 曲率（构词: curv + ature）","curly a. 卷曲的（构词: curl + y）","curling n. 卷曲;冰壶运动（构词: curl + ing）"]},{"id":507,"root":"memor","pronounce":"/ˈmemər/姆诶姆儿","source":"拉丁语 memor","meaning":"记忆","mnemonic":"memor就是“memo儿”。memo就是为了防止忘记而写下来的小纸条；以后看到memo，就会remember原来的事情。所以memor就是“记忆”的意思。","mainWords":[{"word":"memory","pos":"n.","detail":"构词: 构词: memor(记忆) + y(名词后缀)<br>释义: 记忆,记忆力","example":"例句: She has an excellent memory. ｜ 推导: 记忆 + 名词化 = 记忆力"},{"word":"memorial","pos":"n.","detail":"构词: 构词: memor + ial(形容词后缀)<br>释义: 纪念碑 a.纪念的","example":"例句: They built a war memorial. ｜ 推导: 记忆 + 形容词化 = 纪念的(物)"},{"word":"commemorate","pos":"v.","detail":"构词: 构词: com(共同) + memor + ate<br>释义: 纪念","example":"例句: We commemorate the heroes. ｜ 推导: 共同 + 记忆 + 动词化 = 集体纪念"},{"word":"memorandum","pos":"n.","detail":"构词: 构词: memor + andum(需要...的)<br>释义: 备忘录","example":"例句: I sent a memorandum to all staff. ｜ 推导: 记忆 + 需要的东⻄ = 需要记住的,备忘录"},{"word":"remember","pos":"v.","detail":"构词: 构词: re(再) + member(记忆)<br>释义: 记得,记住","example":"例句: I remember meeting you. ｜ 推导: 再 + 记忆 = 重新唤起记忆"}],"extra":["memorize v. 记忆,背诵（构词: memor + ize(动词后缀)) memorable a.值得纪念的 (memor + able）","memoir n. 回忆录 (memor的变体)","immemorial a. 远古的（构词: im(无) + memor）"]},{"id":508,"root":"mor","pronounce":"/mɔːr/莫儿","source":"拉丁语 mos (习俗)","meaning":"道德,习俗","mnemonic":"mor就是“模儿”。一个社会里我们长期照着同一种模样做事，就会形成固定习俗；判断这种做法是好是坏，又形成道德标准。所以mor就是“道德、习俗”的意思。","mainWords":[{"word":"moral","pos":"a.","detail":"构词: 构词: mor(道德) + al(形容词后缀)<br>释义: 道德的 n.道德;寓意","example":"例句: moral standards ｜ 推导: 道德 + 形容词化 = 道德的"},{"word":"morality","pos":"n.","detail":"构词: 构词: moral(道德) + ity(名词后缀)<br>释义: 道德;道德观","example":"例句: public morality ｜ 推导: 道德 + 抽象名词 = 道德观"}],"extra":["immoral a. 不道德的（构词: im + moral）","amoral a. 非道德的（构词: a + moral）","morally ad. 道德上地（构词: moral + ly）","morale n. 士气（构词: mor + ale）","moralist n. 道德家（构词: moral + ist）","demoralize v. 使士气低落（构词: de + moralize）","moralize v. 说教（构词: moral + ize）","mores n. 风俗习惯 (mor的复数)"]},{"id":509,"root":"possess","pronounce":"/pəˈzes/珀兹诶斯","source":"拉丁语 possidere","meaning":"拥有,占有","mnemonic":"possess本身就是我们学过的possess。possess就是拥有、占有，所以possess就是“拥有,占有”的意思。","mainWords":[{"word":"possess","pos":"v.","detail":"构词: 构词: pos(完全) + sess(坐)<br>释义: 拥有;支配","example":"例句: He possesses great wealth. ｜ 推导: 完全坐定 = 拥有,占有"},{"word":"possession","pos":"n.","detail":"构词: 构词: possess + ion(名词后缀)<br>释义: 拥有;财产","example":"例句: His possessions are valuable. ｜ 推导: 拥有 + 名词化 = 财产,所有物"}],"extra":["possessive a. 占有欲强的（构词: possess + ive）","asset n. 资产 (拉丁语同源)","possessor n. 拥有者（构词: possess + or）","assess v. 评估（构词: ad + sess坐）","possessed a. 着魔的（构词: possess + ed）","session n. 会议（构词: sess坐 + ion）","dispossess v. 剥夺（构词: dis + possess）","obsess v. 困扰（构词: ob + sess坐）","repossess v. 收回（构词: re + possess）","obsession n. 痴迷（构词: obsess + ion）","prepossess v. 预先占有（构词: pre + possess）","obsessive a. 强迫性的（构词: obsess + ive）","unpossessed a. 未被占有的（构词: un + possess + ed）","sedentary a. 久坐的（构词: sed坐 + ary）","self-possessed a. 镇定的","preside v. 主持（构词: pre + sid坐）"]},{"id":510,"root":"sav","pronounce":"/seɪv/瑟衣五","source":"拉丁语 salvare","meaning":"救助,拯救","mnemonic":"sav是我们小学学过的save的一部分。save就是救、拯救、保存，所以sav作为词根时也是“救助、拯救”的意思。","mainWords":[{"word":"save","pos":"v.","detail":"构词: 构词: sav(救助) + e<br>释义: 救助;挽救;节省;保存","example":"例句: Save money for the future. ｜ 推导: 救助 = 挽救,节省,保存"},{"word":"saving","pos":"n.","detail":"构词: 构词: sav(救助) + ing(动名词)<br>释义: 节省;储蓄;挽救","example":"例句: My savings are in the bank. ｜ 推导: 救助 + 动名词 = 节省,储蓄"},{"word":"savage","pos":"a.野蛮的;凶恶的,残暴的","detail":"构词: 构词: sav + -age(动作、结果或集合)<br>释义: n.野人,未开化的人","example":"推导: 核心词根「sav」表示“救助,拯救”，结合前后缀，可推出“a.野蛮的;凶恶的,残暴的 n.野人,未开化的人”"}],"extra":["saving n. 节省;储蓄（构词: sav + ing）","unsafe a. 不安全的（构词: un + safe）","savings n. 储蓄金（构词: sav + ings）","safety n. 安全（构词: safe + ty）","saver n. 节省者;救助者（构词: sav + er）","safe a. 安全的 (sav的变体)","savior n. 救世主（构词: sav + ior）","safeguard v. 保护（构词: safe + guard）","saviour n. 救世主(英式)（构词: sav + iour）","lifesaver n. 救生员（构词: life + saver）","salvage v. 抢救;打捞（构词: salv + age）","unsaved a. 未保存的（构词: un + saved）","salvation n. 拯救;救赎（构词: salv + ation）","time-saving a. 节省时间的","saved a. 得救的（构词: sav + ed）","savable a. 可救的（构词: sav + able）"]},{"id":511,"root":"sequ-/secut-/sec-","pronounce":"/sek/瑟克","source":"","meaning":"跟随","mnemonic":"sequ/secut/sec就是“随去”。一个人在前面走，另一个人随他去，就是跟随；许多事情一个接一个跟随出现，就形成顺序和结果。所以sequ/secut/sec就是“跟随”的意思。","mainWords":[{"word":"execute","pos":"v.","detail":"构词: 构词: ex(出) + secut(跟随) + e<br>释义: 执行;处死","example":"例句: Execute the plan carefully. ｜ 推导: 出去 + 跟随 = 跟随执行,贯彻到底"},{"word":"executive","pos":"n.","detail":"构词: 构词: ex + secut + ive(形容词后缀)<br>释义: 主管 a.执行的","example":"例句: The executive made a decision. ｜ 推导: 执行的 + 形容词化 = 执行的(人),主管"},{"word":"sequence","pos":"n.","detail":"构词: 构词: sequ(跟随) + ence(名词后缀)<br>释义: 顺序;序列","example":"例句: Follow the sequence of steps. ｜ 推导: 跟随 + 名词化 = 依次跟随的事物,顺序"},{"word":"consecutive","pos":"a.","detail":"构词: 构词: con(共同) + secut + ive<br>释义: 连续的","example":"例句: Three consecutive wins. ｜ 推导: 共同 + 跟随 + 形容词化 = 连续的"},{"word":"subsequent","pos":"a.","detail":"构词: 构词: sub(在下) + sequ + ent<br>释义: 随后的","example":"例句: In subsequent years. ｜ 推导: 在下 + 跟随 + 形容词化 = 随后的"},{"word":"consequence","pos":"n.","detail":"构词: 构词: con(共同) + sequ + ence<br>释义: 结果;后果","example":"例句: Face the consequences. ｜ 推导: 共同 + 跟随 + 名词化 = 跟随而来的结果"},{"word":"consequently","pos":"ad.","detail":"构词: 构词: consequent + ly(副词后缀)<br>释义: 因此;结果","example":"例句: Consequently, he failed. ｜ 推导: 结果的 + 副词化 = 因此,结果"},{"word":"prosecute","pos":"v.","detail":"构词: 构词: pro(向前) + secut + e<br>释义: 起诉;告发","example":"例句: Prosecute the criminal. ｜ 推导: 向前 + 跟随 = 追诉,起诉"},{"word":"persecute","pos":"v.","detail":"构词: 构词: per(彻底) + secut + e<br>释义: 迫害;虐待","example":""},{"word":"second","pos":"n.","detail":"构词: 构词: sec(跟随) + ond<br>释义: 秒 a.第二的","example":""},{"word":"secondary","pos":"a.","detail":"构词: 构词: second + ary(形容词后缀)<br>释义: 次要的;中等的","example":"例句: Secondary education. ｜ 推导: 第二的 + 形容词化 = 次要的,第二级的"}],"extra":[]},{"id":512,"root":"sect","pronounce":"/sekt/瑟克特","source":"拉丁语 secare (切割)","meaning":"切割,切分","mnemonic":"sect就是“碎切”。把一个整体cut开，就会分成许多部分、区域和段落。所以sect就是“切割、切分”的意思。","mainWords":[{"word":"section","pos":"n.","detail":"构词: 构词: sect(切割) + ion(名词后缀)<br>释义: 章节;部门;截面","example":"例句: the first section of the book ｜ 推导: 切割 + 名词化 = 被切下的部分"},{"word":"sector","pos":"n.","detail":"构词: 构词: sect(切割) + or(名词后缀)<br>释义: 行业;扇形区","example":"例句: the private sector ｜ 推导: 切割 + 名词化 = 切出的扇形区域"},{"word":"insect","pos":"n.","detail":"构词: 构词: in(内) + sect(切割)<br>释义: 昆虫","example":"例句: harmful insects ｜ 推导: 内部切割 = 身体分节的昆虫"},{"word":"intersection","pos":"n.","detail":"构词: 构词: inter(之间) + sect(切割) + ion<br>释义: 十字路口;交集","example":"例句: a busy intersection ｜ 推导: 之间切割 = 交叉切割处"}],"extra":["sectional a. 部分的（构词: section + al）","cross-section n. 横截面","dissect v. 解剖（构词: dis(分开) + sect）","subsection n. 分部（构词: sub + section）","bisect v. 二等分（构词: bi(二) + sect）","sectoral a. 部门的（构词: sector + al）","sectarian a. 宗派的（构词: sect + arian）","resection n. 切除术（构词: re + section）","segment n. 部分（构词: seg(=sec) + ment）","vivisection n. 活体解剖"]},{"id":513,"root":"sed/sess","pronounce":"/sed/瑟德","source":"拉丁语 sedere (坐)","meaning":"坐,安定","mnemonic":"sed与小学词sit形近音近，只把 e 换成 i、d 换成 t；sit 就是坐下。人坐稳以后不再移动，状态也随之安定；sess是同一词根的另一种写法。所以sed/sess就是“坐、安定”。","mainWords":[{"word":"session","pos":"n.","detail":"构词: 构词: sess(坐) + ion(名词后缀)<br>释义: 会议;学期;一段时间","example":"例句: a training session ｜ 推导: 坐下 + 名词化 = 会议,会期"},{"word":"assess","pos":"v.","detail":"构词: 构词: as(向) + sess(坐)<br>释义: 评估;评定;估算","example":"例句: assess the damage ｜ 推导: 坐在旁边 = 评估,评定"},{"word":"obsession","pos":"n.迷住,","detail":"构词: 构词: ob-(反对、向着) + sess + -ion(动作、过程或结果)<br>释义: 困扰","example":"推导: 核心词根「sed/sess」表示“坐,安定”，结合前后缀，可推出“n.迷住, 困扰”"}],"extra":["sediment n. 沉淀物（构词: sed + iment）","preside v. 主持（构词: pre + side）","sedentary a. 久坐的（构词: sed + entary）","president n. 总统（构词: pre + sid + ent）","sedate a. 镇定的（构词: sed + ate）","reside v. 居住（构词: re + side）","possess v. 拥有（构词: pos + sess）","residence n. 住所（构词: re + sid + ence）","possession n. 拥有（构词: pos + sess + ion）","resident n. 居民（构词: re + sid + ent）","obsess v. 迷住（构词: ob + sess）","subside v. 下沉（构词: sub + side）","obsession n. 痴迷（构词: ob + sess + ion）","subsidiary n. 子公司（构词: sub + sid + iary）","assessment n. 评估（构词: as + sess + ment）","dissent v. 异议（构词: dis + sent）"]},{"id":514,"root":"sta","pronounce":"/stæ/斯泰","source":"拉丁语 stare (站立)","meaning":"站立,建立","mnemonic":"sta就是我们小学学过的stand、state和station。stand就是站立；一个东西站稳以后，位置和状态就被建立；station也是固定设立的站点。所以sta就是“站立、建立”的意思。","mainWords":[{"word":"status","pos":"n.","detail":"构词: 构词: sta(站立) + tus(名词后缀)<br>释义: 地位;状态","example":"例句: His social status is very high. ｜ 推导: 站立 + 状态 = 地位,状态"},{"word":"statue","pos":"n.","detail":"构词: 构词: sta(站立) + tue(名词后缀)<br>释义: 雕像;塑像","example":"例句: The statue stands in the park. ｜ 推导: 站立 + 物 = 站立之物,雕像"},{"word":"substitute","pos":"v./n.","detail":"构词: 构词: sub(下) + sti(站) + tute<br>释义: 替代;代替品","example":"例句: We need a substitute teacher. ｜ 推导: 在下面 + 站立 = 站在下面替代"},{"word":"institute","pos":"v.","detail":"构词: 构词: in(在...上) + sti(站) + tute<br>释义: 建立 n.学院","example":"例句: They institute new policies. ｜ 推导: 在...上 + 建立 = 建立,设立"},{"word":"institution","pos":"n.","detail":"构词: 构词: in + sti + tut + ion(名词后缀)<br>释义: 制度;机构","example":"例句: Financial institutions are important. ｜ 推导: 建立 + 名词化 = 建立的结果,制度"},{"word":"constitute","pos":"v.","detail":"构词: 构词: con(共同) + sti + tute<br>释义: 组成;构成","example":"例句: These facts constitute evidence. ｜ 推导: 共同 + 建立 = 共同组成,构成"},{"word":"constitution","pos":"n.","detail":"构词: 构词: con + sti + tut + ion<br>释义: 宪法;体质","example":"例句: The Constitution protects our rights. ｜ 推导: 共同建立的 = 宪法,根本法"},{"word":"statute","pos":"n.","detail":"构词: 构词: sta(建立) + tute<br>释义: 法令;法规","example":"例句: Federal statutes regulate commerce. ｜ 推导: 建立 + 的东⻄ = 被建立的法令"}],"extra":[]},{"id":515,"root":"temper","pronounce":"/ˈtempər/特诶姆珀儿","source":"拉丁语 temperare","meaning":"混合,调节","mnemonic":"方法一： temper是我们小学学过的词temperature的一部分。 temperature 就是“温度”。 控制 temperature 时，要把冷热混合并调节到合适程度。 所以temper就是“混合、调节”。 方法二： 以后看到temper，可以直接想象一个冷热调节旋钮。把 hot water 和 cold water 混合，再不断调到合适温度，就是先混合、后调节。所以temper就是“混合、调节”。","mainWords":[{"word":"temper","pos":"n.","detail":"构词: 构词: temper(调节)<br>释义: 脾气 v.缓和","example":"例句: He lost his temper again. ｜ 推导: 调节 = 情绪的调控状态"},{"word":"temperament","pos":"n.","detail":"构词: 构词: temper + ament(结果状态)<br>释义: 性格,气质","example":"例句: She has an artistic temperament. ｜ 推导: 调节 + 结果 = 体液混合决定的性格"},{"word":"temperature","pos":"n.","detail":"构词: 构词: temper + ature(状态)<br>释义: 温度;体温","example":"例句: The temperature is rising. ｜ 推导: 调节 + 状态 = 冷热平衡的度量"}],"extra":["temperate a. 温和的（构词: temper + ate）","temperance n. 节制（构词: temper + ance）","distemper n. 坏脾气（构词: dis + temper）","intemperate a. 无节制的（构词: in + temper + ate）"]},{"id":516,"root":"tend","pronounce":"/tend/特诶恩德","source":"拉丁语 tendere","meaning":"伸展,延伸,倾向","mnemonic":"tend可以记成ten + hand的压缩提示。 一双 hand 上有 ten 根 finger。把十根手指全部展开，手就向外伸得很 long；如果所有手指都朝同一个方向伸，动作就形成了朝向和倾向。 所以从“ten fingers on a hand 全部伸出去”记住伸展、延伸和倾向。 所以tend就是“伸展、延伸、倾向”。","mainWords":[{"word":"tend","pos":"v.","detail":"构词: 构词: tend(伸展)<br>释义: 倾向;照料","example":"例句: tend to agree ｜ 推导: 伸展 = 倾向"},{"word":"attend","pos":"v.","detail":"构词: 构词: at(向) + tend<br>释义: 参加;照料","example":"例句: attend the meeting ｜ 推导: 向...伸展 = 参加"},{"word":"extend","pos":"v.","detail":"构词: 构词: ex(向外) + tend<br>释义: 延伸;扩展","example":"例句: extend the deadline ｜ 推导: 向外伸展 = 延伸"},{"word":"intend","pos":"v.","detail":"构词: 构词: in(向内) + tend<br>释义: 打算;意图","example":"例句: intend to stay ｜ 推导: 向内伸展 = 打算"},{"word":"pretend","pos":"v.","detail":"构词: 构词: pre(前) + tend<br>释义: 假装","example":"例句: pretend to sleep ｜ 推导: 向前伸展 = 假装"},{"word":"contend","pos":"v.","detail":"构词: 构词: con(共同) + tend<br>释义: 竞争;主张","example":"例句: contend for victory ｜ 推导: 共同伸展 = 竞争"},{"word":"tendency","pos":"n.","detail":"构词: 构词: tend + ency(名词后缀)<br>释义: 倾向;趋势","example":"例句: a growing tendency ｜ 推导: 伸展方向性 = 趋势"},{"word":"attendance","pos":"n.","detail":"构词: 构词: attend + ance<br>释义: 出席;出席人数","example":"例句: check attendance ｜ 推导: 参与状态 = 出席"},{"word":"attendant","pos":"n.","detail":"构词: 构词: attend + ant(人)<br>释义: 服务员;随从","example":"例句: flight attendant ｜ 推导: 参与的人 = 服务员"}],"extra":[]},{"id":517,"root":"tens","pronounce":"/tens/特诶恩斯","source":"拉丁语 tensus","meaning":"拉伸,拉紧","mnemonic":"tens就是“ten根手指拉”。ten根finger一起表示绳子向两边拉，绳子就会被拉伸、拉紧，人也会变得紧张。所以tens就是“拉伸、拉紧”的意思。","mainWords":[{"word":"tense","pos":"a.","detail":"构词: 构词: tens(拉紧) + e<br>释义: 紧张的;时态","example":"例句: feel tense before exam ｜ 推导: 被拉紧的 = 紧张的"},{"word":"tension","pos":"n.","detail":"构词: 构词: tens(拉紧) + ion<br>释义: 张力;紧张","example":"例句: political tension ｜ 推导: 拉紧的状态 = 张力"},{"word":"intense","pos":"a.","detail":"构词: 构词: in(加强) + tens(拉紧) + e<br>释义: 强烈的;剧烈的","example":"例句: intense competition ｜ 推导: 强力拉紧 = 强烈的"},{"word":"intensity","pos":"n.","detail":"构词: 构词: intens(e) + ity<br>释义: 强度;烈度","example":"例句: light intensity ｜ 推导: 强烈的程度 = 强度"},{"word":"extensive","pos":"a.","detail":"构词: 构词: ex(向外) + tens + ive<br>释义: 广泛的;大规模的","example":"例句: extensive research ｜ 推导: 向外拉伸 = 广泛的"},{"word":"extension","pos":"n.","detail":"构词: 构词: ex + tens + ion<br>释义: 延伸;扩展","example":"例句: file extension ｜ 推导: 向外延展 = 扩展"},{"word":"intensive","pos":"a.","detail":"构词: 构词: in(向内) + tens + ive<br>释义: 密集的;强化的","example":"例句: intensive training ｜ 推导: 向内深度拉伸 = 密集的"}],"extra":[]},{"id":518,"root":"treat","pronounce":"/triːt/特里特","source":"拉丁语 tractare","meaning":"处理,对待","mnemonic":"treat就是小学学过的单词，拼写和读音都不用变化。treat 是处理、对待某人或某事，所以treat就是“处理、对待”。","mainWords":[{"word":"treat","pos":"v.","detail":"构词: 构词: treat(处理)<br>释义: 处理;对待;治疗","example":"例句: We should treat everyone fairly. ｜ 推导: 处理 = 对待,处理"},{"word":"treatment","pos":"n.","detail":"构词: 构词: treat(处理) + ment(名词后缀)<br>释义: 处理;对待;治疗","example":"例句: The patient needs medical treatment. ｜ 推导: 处理 + 名词化 = 处理,治疗"},{"word":"treaty","pos":"n.","detail":"构词: 构词: treat(处理) + y(名词后缀)<br>释义: 条约;协定","example":"例句: They signed a peace treaty. ｜ 推导: 处理 + 名词化 = 处理结果的文书,条约"},{"word":"retreat","pos":"v./n.","detail":"构词: 构词: re(往回) + treat(处理)<br>释义: 撤退;退却","example":"例句: The army had to retreat. ｜ 推导: 往回 + 处理 = 往回处理,撤退"}],"extra":["treatable a. 可治疗的（构词: treat + able(可...的)）","maltreat v. 虐待（构词: mal(坏) + treat）","untreated a. 未处理的（构词: un + treat + ed）","pretreat v. 预处理（构词: pre(预先) + treat）","mistreat v. 虐待（构词: mis(错误) + treat）","ill-treat v. 虐待（构词: ill(坏) + treat）","entreat v. 恳求（构词: en(使) + treat）","treatise n. 论文（构词: treat + ise）","treating n. 处理（构词: treat + ing）","overtreat v. 过度治疗（构词: over + treat）"]},{"id":519,"root":"tuit","pronounce":"/tjuːɪt/特耶乌衣特","source":"拉丁语 tueri (注视)","meaning":"注视,守护","mnemonic":"tuit可以直接记成to it。 把眼睛和注意力放 to it，就是朝着它 look、持续 watch，不让它出问题。长时间这样看护一个人，也会形成监督、守护和教导。 所以以后看到 tuit，就想到“注意力一直对着它”。 所以tuit就是“注视、守护”。","mainWords":[{"word":"tuition","pos":"n.","detail":"构词: 构词: tuit(守护) + ion(名词后缀)<br>释义: 学费;教学","example":"例句: The tuition is too expensive. ｜ 推导: 守护 + 名词化 = 守护的报酬,学费"},{"word":"intuition","pos":"n.","detail":"构词: 构词: in(向内) + tuit(注视) + ion<br>释义: 直觉;直观","example":"例句: Trust your intuition. ｜ 推导: 向内 + 注视 = 内心洞察,直觉"}],"extra":["tutor n. 导师;家教（构词: tut(守护) + or）","tutelary a. 监护的（构词: tut + elary）","tutorial n. 辅导课（构词: tutor + ial）","intuitively ad. 凭直觉地","tutorship n. 辅导;监护（构词: tutor + ship）","intuitivism n. 直觉主义","tutee n. 被辅导者（构词: tut + ee）","intuitional a. 直觉的","intuit v. 凭直觉知道（构词: in + tuit）","tuition-free a. 免学费的","intuitive a. 直觉的（构词: intuit + ive）","tuition-paying a. 付学费的","counterintuitive a. 违反直觉的","tutoring n. 辅导（构词: tutor + ing）","tutelage n. 监护;指导（构词: tut + elage）","untutored a. 未受教育的"]},{"id":520,"root":"anim","pronounce":"/ˈænɪm/艾尼姆","source":"","meaning":"生命,精神","mnemonic":"anim是我们小学学过的animal的一部分。animal是有生命、会活动的动物；能让动物活动起来的，就是生命和精神。所以anim就是“生命、精神”的意思。","mainWords":[{"word":"animal","pos":"n.","detail":"构词: 构词: anim(生命) + al(形容词/名词后缀)<br>释义: 动物;野兽","example":"例句: Animals need food and water. ｜ 推导: 生命 + 名词化 = 有生命的存在,动物"},{"word":"unanimous","pos":"a.","detail":"构词: 构词: un(一) + anim(精神) + ous<br>释义: 全体一致的","example":"例句: The decision was unanimous. ｜ 推导: 一个 + 精神 + 形容词化 = 精神一致的"}],"extra":["animate v. 使有生命;使活跃（构词: anim + ate）","animation n. 动画;生气（构词: anim + ation）","animated a. 活跃的;动画的（构词: anim + ated）","animator n. 动画师（构词: anim + ator）","inanimate a. 无生命的（构词: in + anim + ate）","animosity n. 敌意（构词: anim(精神) + osity）"]},{"id":521,"root":"curr-/curs-","pronounce":"/kɜːr/克儿","source":"拉丁语 currere","meaning":"跑,流动","mnemonic":"curr-/curs-可以先想到我们认识的car。 curr 和 car 只需做一次简单的元音联想。car 在路上不断 run，形成车流；river 里的水也一直向前流动。 所以以后看到 curr 或 curs，就想象一辆 car 跟着水流向前跑。 所以curr-/curs-就是“跑、流动”。","mainWords":[{"word":"current","pos":"a.","detail":"构词: 构词: curr(流动) + ent(进行)<br>释义: 当前的 n.电流;潮流","example":"例句: The current situation is complex. ｜ 推导: 流动 + 进行的 = 正在流动的,当前的"},{"word":"occur","pos":"v.","detail":"构词: 构词: oc(朝向) + curr(跑)<br>释义: 发生;出现","example":"例句: The accident occurred yesterday. ｜ 推导: 朝向 + 跑 = 跑到眼前,发生"},{"word":"recur","pos":"v.","detail":"构词: 构词: re(再) + curr(跑)<br>释义: 重现;复发","example":"例句: The problem may recur. ｜ 推导: 再 + 跑 = 再次跑来,重现"},{"word":"incur","pos":"v.","detail":"构词: 构词: in(进入) + curr(跑)<br>释义: 招致;遭受","example":"例句: Don't incur unnecessary debt. ｜ 推导: 进入 + 跑 = 跑入某种状态,招致"},{"word":"excursion","pos":"n.","detail":"构词: 构词: ex(向外) + curs(跑) + ion<br>释义: 短途旅行","example":"例句: We went on an excursion. ｜ 推导: 向外 + 跑 + 名词化 = 短途旅行"},{"word":"currency","pos":"n.","detail":"构词: 构词: curr(流动) + ency(状态)<br>释义: 货币;流通","example":"例句: Foreign currency exchange. ｜ 推导: 流动 + 状态 = 流通的东⻄,货币"},{"word":"occurrence","pos":"n.","detail":"构词: 构词: occur + ence(结果)<br>释义: 发生;事件","example":"例句: A rare occurrence happened. ｜ 推导: 发生 + 名词化 = 发生的事件"},{"word":"curriculum","pos":"n.","detail":"构词: 构词: curr(跑) + iculum(路径)<br>释义: 课程","example":"例句: The curriculum is challenging. ｜ 推导: 跑 + 路径 = 学习的路径,课程"},{"word":"curse","pos":"n.诅咒,咒语,祸因","detail":"构词: 构词: curs + e(连接元音)<br>释义: vt.诅咒,咒骂,使受罪","example":"推导: 核心词根「curr-/curs-」表示“跑,流动”，结合前后缀，可推出“n.诅咒,咒语,祸因 vt.诅咒,咒骂,使受罪”"}],"extra":[]},{"id":522,"root":"fl-","pronounce":"/fl/夫勒","source":"印欧语 *pleu-","meaning":"流动","mnemonic":"fl是单词flow的一部分，如果你知道flow是流动，那后面的ow是动词化，所以fl也是流动，如果你不知道flow的意思，可以把FLOW记成“From Lake, Out to World”。\nFrom Lake表示水从湖里出发；Out to World表示水沿河道不断向外流去，进入更广阔的地方。水从一个来源连续向前移动，就是流动、流淌。\n所以fl就是“流动、流淌、连续移动”的意思。","mainWords":[{"word":"flow","pos":"v.","detail":"构词: 构词: fl(流) + ow<br>释义: 流动;流淌","example":"例句: The river flows to the sea. ｜ 推导: 流 + 动作 = 流动"},{"word":"float","pos":"v.","detail":"构词: 构词: fl(流) + oat<br>释义: 漂浮;飘动","example":"例句: The boat floats on water. ｜ 推导: 流 + 状态 = 在流体上漂浮"},{"word":"flood","pos":"n.","detail":"构词: 构词: fl(流) + ood<br>释义: 洪水 v.泛滥","example":"例句: The flood destroyed the village. ｜ 推导: 流 + 大量 = 大量流动的水,洪水"},{"word":"flee","pos":"v.","detail":"构词: 构词: fl(流) + ee<br>释义: 逃跑;逃离","example":"例句: They fled from danger. ｜ 推导: 流 + 快速 = 如流水般快速离开"},{"word":"fleet","pos":"n.","detail":"构词: 构词: fl(流) + eet<br>释义: 舰队;车队","example":"例句: The fleet sailed across the ocean. ｜ 推导: 流 + 集体 = 如流动般的船队"},{"word":"overflow","pos":"v.","detail":"构词: 构词: over(超过) + flow<br>释义: 溢出;泛滥","example":"例句: The river overflowed its banks. ｜ 推导: 超过 + 流动 = 流出界限,溢出"}],"extra":["fluid n. 流体 a.流动的（构词: flu + id）","fluent a. 流利的（构词: flu + ent）","flux n. 流动;变迁 (flux)","fluency n. 流利;流畅（构词: flu + ency）","influx n. 流入;涌入（构词: in + flux）","flush v. 冲洗;脸红 (flush)","flounder v. 挣扎;困难地移动 (flounder)","fleeting a. 飞逝的（构词: fleet + ing）"]},{"id":523,"root":"flōs","pronounce":"/floːs/夫勒斯","source":"拉丁语 flōs","meaning":"花,开花","mnemonic":"flōs可以直接想到我们小学学过的flower。 flōs和flower保留开头的 fl，再补全成 flower。 flower 就是“花、开花”。 flower 既可以表示花，也可以表示开花。 所以flōs就是“花、开花”。","mainWords":[{"word":"flower","pos":"n.","detail":"构词: 构词: flow(flōs的变体) + er<br>释义: 花 vi.开花","example":"例句: The roses flower in spring. ｜ 推导: 花 + 名词化 = 植物的花朵"},{"word":"flour","pos":"n.","detail":"构词: 构词: flour(谷物花朵的精华)<br>释义: 面粉","example":"例句: Mix flour with water to make dough. ｜ 推导: 谷物花朵的精华 → 面粉"},{"word":"flourish","pos":"v.","detail":"构词: 构词: flour(flōs) + ish(动词后缀)<br>释义: 繁荣;兴旺","example":"例句: Business flourished in the city. ｜ 推导: 花 + 动词化 = 像花一样盛开,繁荣"}],"extra":["floral a. 花的（构词: flor(flōs) + al）","florist n. 花商（构词: flor + ist）","flora n. 植物群（构词: flor + a）","florid a. 绚丽的（构词: flor + id）"]},{"id":524,"root":"flu","pronounce":"/fluː/夫勒乌","source":"拉丁语 fluere","meaning":"流动","mnemonic":"flu就是“流”。 液体最明显的特点就是能够流动。 所以flu就是“流动”。","mainWords":[{"word":"fluid","pos":"n.","detail":"构词: 构词: flu(流动) + id(性质)<br>释义: 流体 a.流动的","example":"例句: Water is a fluid. ｜ 推导: 流动 + 性质 = 流动的物质"},{"word":"fluent","pos":"a.","detail":"构词: 构词: flu(流动) + ent(状态)<br>释义: 流利的","example":"例句: She speaks fluent English. ｜ 推导: 流动 + 状态 = 话语如流水般顺畅"},{"word":"flu","pos":"n.","detail":"构词: 构词: influenza缩写(星体流动影响)<br>释义: 流感","example":"例句: He caught the flu. ｜ 推导: 流动的影响 = 流行性感冒"},{"word":"influence","pos":"n./v.","detail":"构词: 构词: in(进入) + flu(流动) + ence<br>释义: 影响","example":"例句: His ideas influenced me. ｜ 推导: 向内 + 流动 = 力量流入产生影响"},{"word":"influential","pos":"a.","detail":"构词: 构词: influence + ial(属性)<br>释义: 有影响力的","example":"例句: She's very influential. ｜ 推导: 影响 + 形容词化 = 有影响力的"},{"word":"affluent","pos":"a.","detail":"构词: 构词: af(向) + flu(流动) + ent<br>释义: 富裕的","example":"例句: An affluent society. ｜ 推导: 向着 + 流动 = 财富向你流来"},{"word":"fluctuate","pos":"v.","detail":"构词: 构词: fluct(波浪) + uate(动作)<br>释义: 波动","example":"例句: Prices fluctuate daily. ｜ 推导: 波浪 + 动作 = 如波浪起伏"},{"word":"flush","pos":"v.","detail":"构词: 构词: flu(流动) → 液体奔涌<br>释义: 冲洗;脸红","example":"例句: Her face flushed red. ｜ 推导: 水流冲刷 → 冲洗;脸红"},{"word":"superfluous","pos":"a.","detail":"构词: 构词: super(过度) + flu + ous<br>释义: 多余的","example":"例句: Cut superfluous words. ｜ 推导: 过度 + 流动 = 过度满溢"}],"extra":[]},{"id":525,"root":"front","pronounce":"/frʌnt/夫儿阿恩特","source":"拉丁语 frōns","meaning":"前额,正面,前方","mnemonic":"front本身就是我们小学学过的front，意思是前面、正面。人的front就是前额，物体的front就是正面，空间的front就是前方。所以front就是“前额、正面、前方”的意思。","mainWords":[{"word":"front","pos":"n.","detail":"构词: 构词: front(前面)<br>释义: 前面 a.前面的","example":"例句: The front of the building is beautiful. ｜ 推导: 前面 = 物体或空间的最前方"},{"word":"confront","pos":"v.","detail":"构词: 构词: con(共同) + front(正面)<br>释义: 面对;对抗","example":"例句: We must confront the problem. ｜ 推导: 共同 + 正面 = 正面相对,面对"},{"word":"frontier","pos":"n.","detail":"构词: 构词: front(前方) + ier(地点后缀)<br>释义: 边境;前沿","example":"例句: They crossed the frontier at dawn. ｜ 推导: 前方 + 地点 = 领土的最前方,边境"}],"extra":["frontal a. 正面的（构词: front + al(形容词后缀)）","forefront n. 最前线（构词: fore + front）","confrontation n. 对抗（构词: confront + ation）","affront n. 侮辱（构词: af(向) + front）"]},{"id":526,"root":"gno-/cogn-","pronounce":"/noʊ/恩欧","source":"拉丁语 gnoscere","meaning":"认知,知道","mnemonic":"1.gno读起来就像我们小学学过的know，know就是知道。2.cogn可以记成“看懂”：把一件事看懂以后，就产生认知和认识。综上，gno/cogn就是“认知、知道”的意思，所以gno-/cogn就是“认知,知道”的意思。","mainWords":[{"word":"recognize","pos":"v.","detail":"构词: 构词: re(再次) + cogn(认知) + ize<br>释义: 认出;承认","example":"例句: I couldn't recognize him. ｜ 推导: 再次 + 认知 = 重新认出"},{"word":"recognition","pos":"n.","detail":"构词: 构词: re + cogn + ition(名词后缀)<br>释义: 认出;承认","example":"例句: Face recognition is common now. ｜ 推导: 认知 + 名词化 = 识别的状态"},{"word":"cognitive","pos":"a.","detail":"构词: 构词: co(共同) + gn(认知) + itive<br>释义: 认知的","example":"例句: Cognitive ability declines with age. ｜ 推导: 共同 + 认知 + 形容词化 = 认知的"},{"word":"diagnose","pos":"v.","detail":"构词: 构词: dia(穿透) + gno(认知) + se<br>释义: 诊断","example":"例句: The doctor diagnosed cancer. ｜ 推导: 穿透 + 认知 = 透过症状识别疾病"},{"word":"ignorant","pos":"a.","detail":"构词: 构词: i(否定) + gnor(认知) + ant<br>释义: 无知的","example":"例句: Don't be ignorant of the facts. ｜ 推导: 否定 + 认知 = 缺乏认知的"},{"word":"ignorance","pos":"n.","detail":"构词: 构词: i + gnor + ance(名词后缀)<br>释义: 无知","example":"例句: Ignorance is not an excuse. ｜ 推导: 否定 + 认知 + 状态 = 无知的状态"},{"word":"know","pos":"v.","detail":"释义: 知道,了解","example":"例句: I know the answer. ｜ 推导: 保留最原始的\"知道\"含义"},{"word":"ignore","pos":"v.","detail":"构词: 构词: i(否定) + gnor(认知) + e<br>释义: 忽视","example":"例句: Don't ignore my advice. ｜ 推导: 否定 + 认知 = 故意不认知"}],"extra":[]},{"id":527,"root":"lustr-","pronounce":"/ˈlʌstr/勒阿斯特儿","source":"拉丁语 lustrare","meaning":"光,照亮","mnemonic":"lustr-读起来可以记成“露出”。 黑暗中什么都看不清；light 一照，原来藏着的物体就会露出，轮廓和细节都被照亮。 所以“露出”这个结果，正好由光和照亮产生。 所以lustr-就是“光、照亮”。","mainWords":[{"word":"illustrate","pos":"v.","detail":"构词: 构词: il(在...上) + lustr(照亮) + ate<br>释义: 说明;图解","example":"例句: Let me illustrate with an example. ｜ 推导: 在...上 + 照亮 = 用光照亮,使清晰"},{"word":"illustration","pos":"n.","detail":"构词: 构词: il + lustr + ation(名词后缀)<br>释义: 说明;插图","example":"例句: The book has many illustrations. ｜ 推导: 照亮 + 名词化 = 说明,图解"}],"extra":["illustrious a. 杰出的,著名的（构词: il + lustr + ious）","illustrative a. 说明的（构词: il + lustr + ative）","illustrator n. 插图画家（构词: il + lustr + ator）","luster n. 光泽,光彩（构词: lust(r) + er）","lackluster a. 无光泽的（构词: lack + luster）","lustrous a. 有光泽的（构词: lustr + ous）"]},{"id":528,"root":"medi","pronounce":"/ˈmiːdi/米德衣","source":"拉丁语 medius","meaning":"中间,居中","mnemonic":"medi与小学词 middle 形近音近。处在大小、左右或前后两端之间，就是中间、居中。所以medi就是“中间、居中”。","mainWords":[{"word":"medium","pos":"n.","detail":"构词: 构词: medi(中间) + um(名词后缀)<br>释义: 媒介 a.中等的","example":"例句: Television is a powerful medium. ｜ 推导: 中间 + 名词化 = 居中的媒介"},{"word":"immediate","pos":"a.","detail":"构词: 构词: im(无) + medi(中间) + ate<br>释义: 立即的;直接的","example":"例句: We need immediate action. ｜ 推导: 无 + 中间 = 无中间间隔,立即的"},{"word":"medieval","pos":"a.","detail":"构词: 构词: medi(中间) + eval(时代)<br>释义: 中世纪的","example":"例句: Medieval castles are fascinating. ｜ 推导: 中间 + 时代 = 中间的时代,中世纪"},{"word":"meditation","pos":"n.","detail":"构词: 构词: medit(聚焦中心) + ation<br>释义: 冥想,沉思","example":"例句: Daily meditation reduces stress. ｜ 推导: 集中于中心 + 行为 = 冥想"},{"word":"meditate","pos":"v.","detail":"构词: 构词: medit(聚焦中心) + ate(动词后缀)<br>释义: 沉思;冥想","example":"例句: She likes to meditate in the morning. ｜ 推导: 集中于中心 + 动词化 = 向内聚焦,冥想"},{"word":"intermediate","pos":"a.","detail":"构词: 构词: inter(之间) + medi(中间) + ate<br>释义: 中级的","example":"例句: This is an intermediate course. ｜ 推导: 之间 + 中间 + 形容词化 = 中级的"}],"extra":["mediate v. 调解,斡旋（构词: medi + ate）","mediator n. 调解人（构词: medi + ator）","median n. 中位数 a.中间的（构词: medi + an）"]},{"id":529,"root":"mut","pronounce":"/mjuːt/姆耶乌特","source":"拉丁语 mutare","meaning":"改变,交换","mnemonic":"mut就是“move it”的压缩感觉。把it从一个位置move到另一个位置，就是改变；两个人互相move东西，就是交换。所以mut就是“改变、交换”的意思。","mainWords":[{"word":"mutual","pos":"a.","detail":"构词: 构词: mut(交换) + ual(形容词后缀)<br>释义: 相互的,共同的","example":"例句: They have mutual respect. ｜ 推导: 交换 + 形容词化 = 相互的"},{"word":"commute","pos":"v.","detail":"构词: 构词: com(完全) + mut(改变) + e<br>释义: 通勤;交换","example":"例句: I commute to work by train. ｜ 推导: 完全 + 改变位置 = 通勤"},{"word":"mutter","pos":"n.喃喃而语,小声低语;抱怨","detail":"构词: 构词: mut + -er(做动作的人或工具)<br>释义: v.低声说,抱怨","example":"推导: 核心词根「mut」表示“改变,交换”，结合前后缀，可推出“n.喃喃而语,小声低语;抱怨 v.低声说,抱怨”"}],"extra":["mutation n. 突变,变化（构词: mut + ation）","mutant n. 突变体 a.突变的（构词: mut + ant）","mutable a. 易变的（构词: mut + able）","immutable a. 不变的（构词: im + mut + able）","transmute v. 使变形（构词: trans + mut + e）","permute v. 重新排列（构词: per + mut + e）","commuter n. 通勤者（构词: commute + er）","mutually ad. 相互地（构词: mutual + ly）","mutate v. 变异,突变（构词: mut + ate）","commutation n. 减刑;交换（构词: commut + ation）"]},{"id":530,"root":"nat-","pronounce":"/næt/奈特","source":"拉丁语 nascī","meaning":"出生,诞生","mnemonic":"nat就是“哪儿诞生”。一个人born在哪儿，就会形成他的出生地、民族和本土身份。所以nat就是“出生、诞生”的意思。","mainWords":[{"word":"nation","pos":"n.","detail":"构词: 构词: nat(出生) + ion(名词后缀)<br>释义: 民族;国家","example":"例句: The whole nation celebrated. ｜ 推导: 出生 + 名词化 = 共同出生地的群体,民族"},{"word":"national","pos":"a.","detail":"构词: 构词: nation + al(形容词后缀)<br>释义: 国家的;民族的","example":"例句: National security is important. ｜ 推导: 民族 + 形容词化 = 国家的,民族的"},{"word":"native","pos":"a.","detail":"构词: 构词: nat(出生) + ive(形容词后缀)<br>释义: 本地的;天生的","example":"例句: She speaks native English. ｜ 推导: 出生 + 形容词化 = 与出生相关的,本地的"},{"word":"international","pos":"a.","detail":"构词: 构词: inter(之间) + national<br>释义: 国际的","example":"例句: International trade is growing. ｜ 推导: 之间 + 国家的 = 国家之间的,国际的"},{"word":"nationality","pos":"n.","detail":"构词: 构词: national + ity(名词后缀)<br>释义: 国籍","example":"例句: What's your nationality? ｜ 推导: 国家的 + 状态 = 国民身份,国籍"}],"extra":["nature n. 自然;本性（构词: nat + ure）","natural a. 自然的;天生的（构词: nat + ural）","innate a. 天生的（构词: in(内) + nat + e）","natal a. 出生的;诞生的（构词: nat + al）"]},{"id":531,"root":"natur-","pronounce":"/ˈneɪtʃər/恩诶吃额儿","source":"拉丁语 nātūra","meaning":"本质,天然属性","mnemonic":"natur-可以做成“天然出生”的画面。 把 natur 写在一颗刚从 earth 里长出的嫩芽上。它不是工厂后来装上去的，而是 born 时就带着的颜色、形状和特点，属于它自己的 own 属性。 出生就有、没有人为加工的东西，就是天然；出生就带着的特点，就是本质和本性。 所以natur-就是“本质、天然属性”。","mainWords":[{"word":"nature","pos":"n.","detail":"构词: 构词: natur(本质) + e<br>释义: 自然;本性;性质","example":"例句: Human nature never changes. ｜ 推导: 本质 = 万物与生俱来的特性"},{"word":"natural","pos":"a.","detail":"构词: 构词: natur(本质) + al(形容词后缀)<br>释义: 自然的;天然的","example":"例句: It's natural to feel nervous. ｜ 推导: 本质 + 形容词化 = 符合本质的,自然的"}],"extra":["naturally ad. 自然地（构词: natural + ly）","unnatural a. 不自然的（构词: un + natural）","supernatural a. 超自然的（构词: super + natural）","naturalist n. 博物学家（构词: natural + ist）","naturalize v. 归化;使自然化（构词: natural + ize）","denature v. 使变性（构词: de + nature）"]},{"id":532,"root":"point","pronounce":"/pɔɪnt/普奥伊恩特","source":"拉丁语 pungere","meaning":"点,标记","mnemonic":"point本身就是我们小学学过的point，意思是点、尖端、指向和标记。所以point作为词根时也是“点、标记”的意思。","mainWords":[{"word":"point","pos":"n.","detail":"构词: 构词: point(点)<br>释义: 点;要点 v.指向","example":"例句: That's the main point. ｜ 推导: 点 = 核心标记,要点"},{"word":"appoint","pos":"v.","detail":"构词: 构词: ap(向) + point(点)<br>释义: 任命;约定","example":"例句: She was appointed manager. ｜ 推导: 向 + 点 = 指定到某个位置"},{"word":"appointment","pos":"n.","detail":"构词: 构词: appoint + ment(名词后缀)<br>释义: 约会;任命","example":"例句: I have a doctor's appointment. ｜ 推导: 约定 + 名词化 = 约定的时间点"},{"word":"viewpoint","pos":"n.","detail":"构词: 构词: view(看) + point(点)<br>释义: 观点,视⻆","example":"例句: From my viewpoint, it's wrong. ｜ 推导: 看 + 点 = 观察的立足点"},{"word":"disappoint","pos":"v.","detail":"构词: 构词: dis(脱离) + appoint<br>释义: 使失望","example":"例句: Don't disappoint me. ｜ 推导: 脱离 + 约定点 = 未如约发生"},{"word":"standpoint","pos":"n.","detail":"构词: 构词: stand(站立) + point(点)<br>释义: 立场,观点","example":"例句: From a legal standpoint... ｜ 推导: 站立 + 点 = 立足的位置"}],"extra":["pinpoint v. 精确定位（构词: pin(针) + point）","pointer n. 指针;指示物（构词: point + er）","pointed a. 尖锐的;直接的（构词: point + ed）"]},{"id":533,"root":"priv-","pronounce":"/prɪv/普里五","source":"拉丁语 privus","meaning":"个体/分离","mnemonic":"priv就是“劈为”。把一个整体劈开，分为单独的个人部分，这一部分就不再属于公共，而属于个人和私有。所以priv就是“个体、分离、私有”的意思。","mainWords":[{"word":"private","pos":"a.","detail":"构词: 构词: priv(个体) + ate(形容词后缀)<br>释义: 私有的;隐私的","example":"例句: This is a private matter. ｜ 推导: 个体 + 形容词化 = 属于个人的"},{"word":"privacy","pos":"n.","detail":"构词: 构词: private + cy(状态)<br>释义: 隐私","example":"例句: Respect others' privacy. ｜ 推导: 私有的 + 状态 = 隐私状态"},{"word":"privilege","pos":"n.","detail":"构词: 构词: priv(个体) + leg(法律) + e<br>释义: 特权 v.给予特权","example":"例句: It's a privilege to meet you. ｜ 推导: 个体 + 法律 = 个人专属的法定权利"},{"word":"deprive","pos":"v.","detail":"构词: 构词: de(完全) + priv(分离) + e<br>释义: 剥夺,使丧失","example":"例句: Don't deprive him of hope. ｜ 推导: 完全 + 分离 = 彻底剥夺"}],"extra":["privately ad. 私下地（构词: private + ly）","privileged a. 有特权的（构词: privilege + d）","deprivation n. 剥夺（构词: deprive + ation）","privy a. 私下知情的（构词: priv + y）"]},{"id":534,"root":"quer-/quest-","pronounce":"/kwest/克乌诶斯特","source":"","meaning":"寻求,询问","mnemonic":"quer-/quest从quest和question来记。quest是寻求、探求，question是提问、询问，所以quer-/quest就是“寻求,询问”的意思。","mainWords":[{"word":"question","pos":"n.","detail":"构词: 构词: quest(寻求) + ion(名词后缀)<br>释义: 问题 v.询问","example":"例句: Ask a question. ｜ 推导: 寻求 + 名词化 = 寻求答案的话语,问题"},{"word":"quest","pos":"n.","detail":"构词: 构词: quest(寻求)<br>释义: 探索 v.寻求","example":"例句: The quest for truth. ｜ 推导: 寻求 = 探索,追寻"},{"word":"require","pos":"v.","detail":"构词: 构词: re(再次) + quir(寻求) + e<br>释义: 需要;要求","example":"例句: This job requires experience. ｜ 推导: 再次 + 寻求 = 反复寻求,需要"},{"word":"requirement","pos":"n.","detail":"构词: 构词: require + ment(名词后缀)<br>释义: 要求;必需品","example":"例句: Meet all requirements. ｜ 推导: 需要 + 名词化 = 需要的事物,要求"},{"word":"request","pos":"n./v.","detail":"构词: 构词: re(再次) + quest(寻求)<br>释义: 请求","example":"例句: Request permission first. ｜ 推导: 再次 + 寻求 = 反复寻求,请求"},{"word":"acquire","pos":"v.","detail":"构词: 构词: ac(向) + quir(寻求) + e<br>释义: 获得;学到","example":"例句: Acquire new skills. ｜ 推导: 向着 + 寻求 = 寻求到手,获得"},{"word":"acquisition","pos":"n.","detail":"构词: 构词: ac + quis + ition(名词后缀)<br>释义: 获得;收购","example":"例句: A major acquisition. ｜ 推导: 获得 + 名词化 = 获得物,收购"},{"word":"inquire","pos":"v.","detail":"构词: 构词: in(进入) + quir(寻求) + e<br>释义: 询问;调查","example":"例句: Inquire about the price. ｜ 推导: 进入 + 寻求 = 深入寻求,询问"},{"word":"inquiry","pos":"n.","detail":"构词: 构词: in + quir + y(名词后缀)<br>释义: 询问;调查","example":""},{"word":"conquer","pos":"v.","detail":"构词: 构词: con(完全) + quer(寻求)<br>释义: 征服;克服","example":""},{"word":"conquest","pos":"n.","detail":"构词: 构词: con + quest(寻求)<br>释义: 征服;战利品","example":"例句: The conquest of space. ｜ 推导: 征服 + 名词化 = 征服行为,战利品"},{"word":"exquisite","pos":"a.","detail":"构词: 构词: ex(出) + quis(寻求) + ite<br>释义: 精美的;敏锐的","example":"例句: Exquisite craftsmanship. ｜ 推导: 出去 + 寻求 = 精心寻求出的,精美的"},{"word":"questionnaire","pos":"n.","detail":"构词: 构词: question + naire(工具后缀)<br>释义: 调查表;问卷","example":"例句: Fill out the questionnaire. ｜ 推导: 问题 + 工具 = 收集问题的工具,问卷"}],"extra":[]},{"id":535,"root":"quic-/quiv-","pronounce":"/kwɪk/克威克","source":"PIE *gwei- (活)","meaning":"活,有生命力","mnemonic":"quic/quiv是我们小学学过的词quick的一部分。 quick 就是“快的、活跃的”。 活着的东西会快速活动；quiver 则是有生命力地颤动。 所以quic/quiv就是“活、有生命力”。","mainWords":[{"word":"quick","pos":"a.","detail":"构词: 构词: quic(活) + k<br>释义: 快的;敏捷的","example":"例句: Be quick, or we'll be late! ｜ 推导: 活 = 有活力的,快速的"},{"word":"quiver","pos":"v./n.","detail":"构词: 构词: quiv(活) + er(动词后缀)<br>释义: 颤抖,抖动","example":"例句: Her lips quivered with emotion. ｜ 推导: 活 + 动作 = 生命力的颤动"}],"extra":["quickly ad. 快速地（构词: quick + ly）","quicken v. 加快;使活跃（构词: quick + en）","quicksilver n. 水银（构词: quick + silver）","quivering a. 颤抖的（构词: quiver + ing）","quicksand n. 流沙（构词: quick + sand）"]},{"id":536,"root":"spir","pronounce":"/spɪr/四毕儿额","source":"拉丁语 spirare","meaning":"呼吸,精神","mnemonic":"为了记忆，可以把SPIR记成“Slow Pull In air, Rise”。\nSlow表示慢慢地；Pull In air表示把空气吸进身体；Rise表示吸气以后胸口随之抬起。\n从空气进入身体到胸口抬起，整个画面就是一次清楚的呼吸。一个人能够持续呼吸，说明他有生命和活力；生命气息进一步又可以联系精神和活力。\n所以spir就是“呼吸；由生命气息引出的精神、活力”的意思。","mainWords":[{"word":"spirit","pos":"n.","detail":"构词: 构词: spir(呼吸) + it<br>释义: 精神;灵魂;烈酒","example":"例句: Keep your spirit high. ｜ 推导: 呼吸 → 生命力 → 精神"},{"word":"spiritual","pos":"a.","detail":"构词: 构词: spirit(精神) + ual(形容词后缀)<br>释义: 精神的;心灵的","example":"例句: Spiritual growth matters. ｜ 推导: 精神 + 形容词化 = 精神的"},{"word":"inspire","pos":"v.","detail":"构词: 构词: in(进入) + spir(呼吸) + e<br>释义: 激励;鼓舞;启发","example":"例句: Her words inspire me. ｜ 推导: 向内 + 吹气 = 赋予灵感,激励"},{"word":"inspiration","pos":"n.","detail":"构词: 构词: inspir(激励) + ation(名词后缀)<br>释义: 灵感;鼓舞","example":"例句: Sudden inspiration came. ｜ 推导: 激励 + 名词化 = 灵感"},{"word":"aspire","pos":"v.","detail":"构词: 构词: a(朝向) + spir(呼吸) + e<br>释义: 渴望;追求;立志","example":"例句: Aspire to greatness. ｜ 推导: 朝向 + 呼吸 = 志向高远"},{"word":"conspiracy","pos":"n.","detail":"构词: 构词: con(共同) + spir(呼吸) + acy<br>释义: 阴谋;密谋","example":"例句: They formed a conspiracy. ｜ 推导: 共同 + 呼吸 = 密谋(窃窃私语)"},{"word":"spiral","pos":"a.螺旋形的","detail":"构词: 构词: spir + -al(与……有关的)<br>释义: n.螺旋，螺线 v.螺旋上升；盘旋","example":"推导: 核心词根「spir」表示“呼吸,精神”，结合前后缀，可推出“a.螺旋形的 n.螺旋，螺线 v.螺旋上升；盘旋”"}],"extra":["aspiration n. 渴望,抱负（构词: aspir + ation）","expire v. 到期;断气（构词: ex + spir + e）"]},{"id":537,"root":"terr-","pronounce":"/ter/特诶儿","source":"拉丁语 terrere","meaning":"恐惧,震慑","mnemonic":"terr先看两个r，像两条正在发抖的腿。人遇到可怕的事情时，腿会发抖，心里会恐惧；能让人发抖的东西，也具有震慑力。所以terr就是“恐惧、震慑”的意思。","mainWords":[{"word":"terror","pos":"n.","detail":"构词: 构词: terr(恐惧) + or(名词后缀)<br>释义: 恐怖;恐惧","example":"例句: The terror in her eyes was obvious. ｜ 推导: 恐惧 + 名词化 = 恐怖,极度恐惧"},{"word":"terrible","pos":"a.","detail":"构词: 构词: terr(恐惧) + ible(可...的)<br>释义: 可怕的;糟糕的","example":"例句: What a terrible accident! ｜ 推导: 恐惧 + 可...的 = 令人恐惧的,可怕的"},{"word":"terrify","pos":"v.","detail":"构词: 构词: terr(恐惧) + ify(使...化)<br>释义: 使害怕;恐吓","example":"例句: The loud noise terrified the children. ｜ 推导: 恐惧 + 使动 = 使恐惧,使害怕"},{"word":"terrific","pos":"a.","detail":"构词: 构词: terr(恐惧) + ific(产生...的)<br>释义: 极好的;可怕的","example":"例句: That's a terrific idea! ｜ 推导: 口语好得令人害怕→口语极好的"}],"extra":["terrifying a. 令人恐惧的（构词: terrify + ing）","terrified a. 感到恐惧的（构词: terrify + ed）","terrorism n. 恐怖主义（构词: terror + ism）","terrorist n. 恐怖分子（构词: terror + ist）","terrorize v. 恐吓（构词: terror + ize）","deterrent n. 威慑物（构词: de + terr + ent）","deter v. 威慑,阻止（构词: de(离开) + ter）","terribly ad. 可怕地;非常（构词: terrible + ly）"]},{"id":538,"root":"tort","pronounce":"/tɔːt/托特","source":"拉丁语 torquere","meaning":"扭曲,扭转","mnemonic":"tort就是“拖扭”。一个人被强行拖动时，身体会被扭曲；把事实故意扭来扭去，也会变得歪曲。所以tort就是“扭曲、扭转”的意思。","mainWords":[{"word":"torture","pos":"v./n.","detail":"构词: 构词: tort(扭曲) + ure(名词后缀)<br>释义: 折磨,拷打","example":"例句: The prisoner was tortured. ｜ 推导: 扭曲 + 结果 = 身体被扭曲的痛苦"},{"word":"distort","pos":"v.","detail":"构词: 构词: dis(偏离) + tort(扭曲)<br>释义: 扭曲,歪曲","example":"例句: Don't distort the facts. ｜ 推导: 偏离 + 扭曲 = 扭曲至偏离原状"},{"word":"retort","pos":"v./n.","detail":"构词: 构词: re(回) + tort(扭转)<br>释义: 反驳,反击","example":"例句: She retorted angrily. ｜ 推导: 回 + 扭转 = 扭转回去,反击"}],"extra":["contort v. 扭曲变形（构词: con(共同) + tort）","tortuous a. 弯曲的（构词: tort + uous）","torsion n. 扭转力（构词: tort 的变体 + ion）","extort v. 勒索（构词: ex(出) + tort）"]},{"id":539,"root":"viv-","pronounce":"/vɪv/五衣五","source":"拉丁语 vivere","meaning":"活,生存","mnemonic":"viv就是“喂喂”。对一个人喊“喂喂”，他还能回应，说明他活着、有生命；重新回应，也像生命恢复过来。所以viv就是“活、生存”的意思。","mainWords":[{"word":"survive","pos":"v.","detail":"构词: 构词: sur(超过) + viv(活) + e<br>释义: 幸存,活下来","example":"例句: She survived the accident. ｜ 推导: 超过 + 活 = 比别人活得长,幸存"},{"word":"survival","pos":"n.","detail":"构词: 构词: sur + viv + al(名词后缀)<br>释义: 幸存,生存","example":"例句: Survival is our priority. ｜ 推导: 幸存 + 名词化 = 生存,幸存状态"},{"word":"revive","pos":"v.","detail":"构词: 构词: re(再次) + viv(活) + e<br>释义: 复活,复苏","example":"例句: The doctor revived the patient. ｜ 推导: 再次 + 活 = 再次活过来,复苏"},{"word":"vivid","pos":"a.","detail":"构词: 构词: viv(活) + id(形容词后缀)<br>释义: 生动的,鲜明的","example":"例句: She gave a vivid description. ｜ 推导: 活 + 形容词化 = 像活的一样,生动的"}],"extra":["revival n. 复兴,复活（构词: re + viv + al）","survivor n. 幸存者（构词: sur + viv + or）","vivacious a. 活泼的（构词: viv + acious）","vividly ad. 生动地（构词: viv + id + ly）","convivial a. 欢乐的（构词: con + viv + ial）","vivify v. 使有生气（构词: viv + ify）"]},{"id":540,"root":"cor-","pronounce":"/kɔːr/考儿","source":"变体: com-在r前变cor-","meaning":"共同,一起","mnemonic":"cor的核心声音接近“靠”。几个人向中间靠拢，就从分散变成共同在一起；事情彼此靠在一处，也会发生联系和对应。所以cor-就是“共同、一起”。","mainWords":[{"word":"correlate","pos":"v.","detail":"构词: 构词: cor(共同) + relate(联系)<br>释义: 相关;关联","example":"例句: The two factors correlate closely. ｜ 推导: 共同 + 联系 = 相互关联"},{"word":"correspond","pos":"v.","detail":"构词: 构词: cor(共同) + respond(回应)<br>释义: 符合;通信","example":"例句: Their actions correspond to words. ｜ 推导: 共同 + 回应 = 相互对应,通信"},{"word":"correspondent","pos":"n.","detail":"构词: 构词: correspond + ent(人)<br>释义: 记者;通讯员","example":"例句: A foreign correspondent reports news. ｜ 推导: 通信 + 人 = 通讯员,记者"},{"word":"correspondence","pos":"n.","detail":"构词: 构词: correspond + ence(名词后缀)<br>释义: 通信;信件","example":"例句: Keep up regular correspondence. ｜ 推导: 通信 + 名词化 = 通信,信件"},{"word":"corresponding","pos":"a.","detail":"构词: 构词: correspond + ing(形容词后缀)<br>释义: 相应的;对应的","example":"例句: Find the corresponding answer. ｜ 推导: 对应 + 形容词化 = 相应的,对应的"}],"extra":["correlation n. 相关性（构词: cor + relation）","correlative a. 相关的（构词: cor + relative）"]},{"id":541,"root":"cor/cord-","pronounce":"/kɔːrd/考儿德","source":"拉丁语 cor, cordis","meaning":"心,心脏","mnemonic":"cor/cord就是我们学过的core。core就是核心，人体最重要的核心就是心和心脏，所以cor/cord就是“心,心脏”的意思。","mainWords":[{"word":"cord","pos":"n.","detail":"构词: 构词: cord(心的连结)<br>释义: 绳索;细绳","example":"例句: Tie it with a strong cord. ｜ 推导: 心的连结 = 连结之物,绳索"},{"word":"cordial","pos":"a.","detail":"构词: 构词: cord(心) + ial(形容词后缀)<br>释义: 热情的;衷心的","example":"例句: She gave us a cordial welcome. ｜ 推导: 心 + 形容词化 = 发自内心的,热情的"},{"word":"courage","pos":"n.","detail":"构词: 构词: cour(心) + age(名词后缀)<br>释义: 勇气,胆量","example":"例句: It takes courage to admit mistakes. ｜ 推导: 心 + 名词化 = 心中的力量,勇气"},{"word":"encourage","pos":"v.","detail":"构词: 构词: en(使) + courage<br>释义: 鼓励,激励","example":"例句: Teachers encourage students to think. ｜ 推导: 使 + 勇气 = 使有勇气,鼓励"},{"word":"discourage","pos":"v.","detail":"构词: 构词: dis(剥夺) + courage<br>释义: 使泄气;阻止","example":"例句: Don't let failure discourage you. ｜ 推导: 剥夺 + 勇气 = 使失去勇气,使泄气"},{"word":"accord","pos":"n.","detail":"构词: 构词: ac(向) + cord(心)<br>释义: 协议;和谐 v.符合","example":"例句: They reached an accord quickly. ｜ 推导: 向 + 心 = 心心相向,达成一致"},{"word":"accordance","pos":"n.","detail":"构词: 构词: accord + ance(名词后缀)<br>释义: 符合;一致","example":"例句: In accordance with the rules. ｜ 推导: 一致 + 名词化 = 符合,依据"},{"word":"accordingly","pos":"ad.","detail":"构词: 构词: accord + ingly(副词后缀)<br>释义: 因此;相应地","example":"例句: Plan accordingly for the weather. ｜ 推导: 一致 + 副词化 = 相应地,因此"},{"word":"record","pos":"n.","detail":"构词: 构词: re(回) + cord(心)<br>释义: 记录 v.记录","example":"例句: Keep a record of your expenses. ｜ 推导: 回 + 心 = 记回心中,记录"},{"word":"recorder","pos":"n.","detail":"构词: 构词: record + er(名词后缀)<br>释义: 录音机;记录员","example":"例句: Use a tape recorder. ｜ 推导: 记录 + 人/物 = 记录者,录音机"}],"extra":[]},{"id":542,"root":"corp-","pronounce":"/kɔːp/考普","source":"拉丁语 corpus","meaning":"身体,实体","mnemonic":"corp就是“互相之间也有很大区别”。互相之间也有很大区别 所以辅音是有辨识度的部分 元音 a e i o u 每个发音都差不多 舌位也差不多 看起来长得也差不多 都是圆圆小小的一坨 所以元音很多时候起到缓冲作用 没实际意义。所以corp就是“身体,实体”的意思。","mainWords":[{"word":"corporation","pos":"n.","detail":"构词: 构词: corpor(身体) + ation(名词后缀)<br>释义: 公司;法人","example":"例句: The corporation was founded in 1990. ｜ 推导: 身体 + 名词化 = 法人实体,公司"},{"word":"incorporate","pos":"v.","detail":"构词: 构词: in(进入) + corpor(身体) + ate<br>释义: 合并;包含","example":"例句: We'll incorporate your suggestions. ｜ 推导: 进入 + 身体 = 使成为一体,合并"}],"extra":["corporate a. 公司的;法人的（构词: corpor + ate）","corpse n. 尸体（构词: corp(身体) + se）","corps n. 军团;团体（构词: corp(身体) + s）","corporal a. 肉体的;身体的（构词: corpor + al）","corporeal a. 有形的;物质的（构词: corpor + eal）","incorporation n. 合并;法人化（构词: in + corpor + ation）"]},{"id":543,"root":"cort/court-","pronounce":"/kɔːt/考特","source":"拉丁语 cohors","meaning":"围场,宫廷","mnemonic":"court就是学校里的 basketball court。球场四周有边线，把一块地围成固定场所；宫廷也由院墙围成一个封闭的院落。cort是它缩短后的近形。所以cort/court就是“围场、宫廷”。","mainWords":[{"word":"court","pos":"n.","detail":"构词: 构词: court(围场)<br>释义: 法庭;宫廷;球场","example":"例句: The case went to court. ｜ 推导: 围场 = 法庭,宫廷,球场"},{"word":"courtyard","pos":"n.","detail":"构词: 构词: court + yard(院子)<br>释义: 庭院;天井","example":"例句: Children played in the courtyard. ｜ 推导: 围场 + 院子 = 庭院"},{"word":"courtesy","pos":"n.","detail":"构词: 构词: court(宫廷) + esy(名词后缀)<br>释义: 礼貌;礼节","example":"例句: He showed great courtesy. ｜ 推导: 宫廷 + 名词化 = 宫廷礼仪,礼貌"},{"word":"escort","pos":"v./n.","detail":"构词: 构词: e(出) + scort(护卫)<br>释义: 护送;护卫","example":"例句: Police escorted the president. ｜ 推导: 出去 + 宫廷护卫 = 护送"}],"extra":["courteous a. 有礼貌的（构词: court + eous）","courthouse n. 法院（构词: court + house）","courtship n. 求爱（构词: court + ship）","discourtesy n. 无礼（构词: dis + courtesy）"]},{"id":544,"root":"cred","pronounce":"/kred/克儿诶德","source":"拉丁语 credere","meaning":"相信,信任","mnemonic":"cred是我们学过的credit的一部分。credit就是信用，信用建立在相信和信任上，所以cred就是“相信,信任”的意思。","mainWords":[{"word":"credible","pos":"a.","detail":"构词: 构词: cred(相信) + ible(可...的)<br>释义: 可信的","example":"例句: He is a credible witness. ｜ 推导: 相信 + 可以的 = 可以相信的,可信的"},{"word":"incredible","pos":"a.","detail":"构词: 构词: in(不) + cred + ible<br>释义: 难以置信的","example":"例句: That's an incredible story! ｜ 推导: 不 + 可信的 = 难以置信的,惊人的"},{"word":"credit","pos":"n.","detail":"构词: 构词: cred(相信) + it(名词后缀)<br>释义: 信用;学分 v.相信","example":"例句: Please check your credit score. ｜ 推导: 相信 + 名词化 = 信任,信用"},{"word":"credential","pos":"n.","detail":"构词: 构词: cred + ent + ial<br>释义: 证书;凭证","example":"例句: Show your credentials please. ｜ 推导: 相信 + 名词化 = 证明可信的文件,证书"}],"extra":["credibility n. 可信性（构词: cred + ibility）","discredit v. 使丧失信誉（构词: dis + cred + it）","creditor n. 债权人（构词: cred + itor）","credulous a. 轻信的（构词: cred + ulous）"]},{"id":545,"root":"dox","pronounce":"/dɒks/德奥克斯","source":"希腊语 doxa","meaning":"观点,看法","mnemonic":"dox就是“多说”。我们围绕一件事多说几句，就会形成各种观点和看法；这些看法有的正统，有的互相矛盾。所以dox就是“观点、看法”的意思。","mainWords":[{"word":"paradox","pos":"n.","detail":"构词: 构词: para(相反) + dox(观点)<br>释义: 悖论,矛盾","example":"例句: It's a paradox of modern life. ｜ 推导: 相反 + 观点 = 自相矛盾的观点"},{"word":"orthodox","pos":"a.","detail":"构词: 构词: ortho(正确) + dox(观点)<br>释义: 正统的,传统的","example":"例句: He holds orthodox views. ｜ 推导: 正确 + 观点 = 正统的观点"}],"extra":["paradoxical a. 自相矛盾的（构词: paradox + ical）","orthodoxy n. 正统观念（构词: orthodox + y）","heterodox a. 异端的（构词: hetero(异) + dox）","heterodoxy n. 异端（构词: heterodox + y）"]},{"id":546,"root":"duc/duct","pronounce":"/dʌk/德阿克","source":"拉丁语 ducere","meaning":"引导,带领","mnemonic":"duc末尾补一个 k 就是小学词duck。一只鸭妈妈走在前面，后面的小鸭排成一列跟着它；鸭妈妈正在引导、带领整支队伍。duct只是在 duc 后多一个 t，所以duc/duct就是“引导、带领”。","mainWords":[{"word":"conduct","pos":"v.","detail":"构词: 构词: con(共同) + duct(引导)<br>释义: 实施;指挥;传导","example":"例句: Metals conduct electricity well. ｜ 推导: 共同 + 引导 = 一起引导,传导"},{"word":"conductor","pos":"n.","detail":"构词: 构词: con + duct + or(人/物)<br>释义: 指挥;导体","example":"例句: The conductor raised his baton. ｜ 推导: 引导 + 者 = 引导者,指挥家"},{"word":"introduce","pos":"v.","detail":"构词: 构词: intro(向内) + duc(引导) + e<br>释义: 介绍;引进","example":"例句: Let me introduce my friend. ｜ 推导: 向内 + 引导 = 引入,介绍"},{"word":"introduction","pos":"n.","detail":"构词: 构词: intro + duct + ion<br>释义: 介绍;引言","example":"例句: Read the introduction carefully. ｜ 推导: 介绍 + 名词化 = 引言,导论"},{"word":"induce","pos":"v.","detail":"构词: 构词: in(向内) + duc(引导) + e<br>释义: 引起;诱导","example":"例句: The drug induced drowsiness. ｜ 推导: 向内 + 引导 = 引导进入某种状态"},{"word":"semiconductor","pos":"n.","detail":"构词: 构词: semi(半) + con + duct + or<br>释义: 半导体","example":"例句: Silicon is a semiconductor. ｜ 推导: 半 + 导体 = 半导电体,半导体"},{"word":"produce","pos":"v.","detail":"构词: 构词: pro(向前) + duc(引导) + e<br>释义: 生产;产生","example":"例句: They produce high-quality cars. ｜ 推导: 向前 + 引导 = 向前引导出新事物,生产"},{"word":"product","pos":"n.","detail":"构词: 构词: pro + duct(引导)<br>释义: 产品;产物","example":"例句: This product sells well. ｜ 推导: 向前 + 引导 = 被引导出来的东⻄,产品"},{"word":"production","pos":"n.","detail":"构词: 构词: pro + duct + ion(名词后缀)<br>释义: 生产;产量","example":"例句: Production increased by 20%. ｜ 推导: 生产 + 名词化 = 生产过程,产量"},{"word":"productive","pos":"a.","detail":"构词: 构词: pro + duct + ive(形容词后缀)<br>释义: 富有成效的","example":"例句: She had a productive day. ｜ 推导: 生产 + 形容词化 = 能产出成果的"},{"word":"productivity","pos":"n.","detail":"构词: 构词: pro + duct + ivity(名词后缀)<br>释义: 生产力;效率","example":"例句: Productivity has improved greatly. ｜ 推导: 生产 + 状态 = 生产的能力,生产力"},{"word":"reproduce","pos":"v.","detail":"构词: 构词: re(再) + pro + duc + e<br>释义: 繁殖;复制","example":"例句: Animals reproduce in spring. ｜ 推导: 再 + 生产 = 再次产生,繁殖"},{"word":"reduce","pos":"v.","detail":"构词: 构词: re(向后) + duc(引导) + e<br>释义: 减少;降低","example":"例句: We must reduce pollution. ｜ 推导: 向后 + 引导 = 向后引导,减少"},{"word":"reduction","pos":"n.","detail":"构词: 构词: re + duct + ion<br>释义: 减少;缩减","example":"例句: A significant reduction occurred. ｜ 推导: 减少 + 名词化 = 减少的行为或结果"},{"word":"deduct","pos":"v.","detail":"构词: 构词: de(向下) + duct(引导)<br>释义: 扣除;减去","example":""},{"word":"deduce","pos":"v.","detail":"构词: 构词: de(向下) + duc(引导) + e<br>释义: 推断;演绎","example":""}],"extra":[]},{"id":547,"root":"educ-","pronounce":"/ˈedju:k/诶德耶乌克","source":"","meaning":"向外引导,教化","mnemonic":"educ-可以先表示里面的duc，给它补一个 k，就得到我们小学学过的duck。 想象一只母 duck 带着小鸭从窝里走 out，一路教它们找水、找食物、避开危险。它不是把知识塞进去，而是领着小鸭向外走，认识更大的世界。 teacher 在 school 里 teach 学生，也是在做同样的事：向外引导、培养。 所以educ-就是“向外引导、教化、教育”。","mainWords":[{"word":"educate","pos":"v.","detail":"构词: 构词: e(出) + duc(引) + ate(动词后缀)<br>释义: 教育;培养","example":"例句: We must educate our children well. ｜ 推导: 出 + 引导 + 动词化 = 引导出来,教育"},{"word":"education","pos":"n.","detail":"构词: 构词: educate + ion(名词后缀)<br>释义: 教育;训练","example":"例句: Education is the key to success. ｜ 推导: 教育 + 名词化 = 教育,教育体系"}],"extra":["educator n. 教育者（构词: educate + or）","educational a. 教育的（构词: education + al）","educative a. 有教育意义的（构词: educ + ative）","uneducated a. 未受教育的（构词: un + educated）","reeducate v. 再教育（构词: re + educate）","miseducate v. 错误教育（构词: mis + educate）"]},{"id":548,"root":"fall","pronounce":"/fɔːl/福勒","source":"古英语 feallan","meaning":"坠落,降落","mnemonic":"fall本身就是我们小学学过的fall。 fall 就是“落下、跌倒、秋天”。 所以fall就是“坠落、降落”。","mainWords":[{"word":"fall","pos":"v.","detail":"构词: 构词: fall(坠落)<br>释义: 落下;跌倒 n.秋天","example":"例句: Leaves fall in autumn. ｜ 推导: 坠落 = 落下;落叶季节 = 秋天"},{"word":"waterfall","pos":"n.","detail":"构词: 构词: water(水) + fall(坠落)<br>释义: 瀑布","example":"例句: The waterfall is magnificent. ｜ 推导: 水 + 坠落 = 水流坠落之处,瀑布"}],"extra":["fallen a. 落下的;堕落的（构词: fall + en）","falling a. 下降的（构词: fall + ing）","downfall n. 垮台;衰落（构词: down + fall）","rainfall n. 降雨量（构词: rain + fall）","snowfall n. 降雪量（构词: snow + fall）","fallout n. 后果;余波（构词: fall + out）"]},{"id":549,"root":"fess","pronounce":"/fes/夫诶斯","source":"拉丁语 fatēri","meaning":"承认,声明","mnemonic":"fess就是“发誓”。一个人发誓时，要公开承认和声明自己说的话；把自己的职业和信念公开说出来，也是在声明。所以fess就是“承认、声明”的意思。","mainWords":[{"word":"professor","pos":"n.","detail":"构词: 构词: pro(公开) + fess(声明) + or(人)<br>释义: 教授","example":"例句: The professor teaches economics. ｜ 推导: 公开 + 声明 + 人 = 公开传授知识的人"},{"word":"profession","pos":"n.","detail":"构词: 构词: pro + fess + ion(名词后缀)<br>释义: 职业;专业","example":"例句: Teaching is a noble profession. ｜ 推导: 公开 + 声明 + 名词化 = 公开声明的职业"},{"word":"professional","pos":"a.","detail":"构词: 构词: profession + al(形容词后缀)<br>释义: 专业的","example":"例句: He needs professional help. ｜ 推导: 职业 + 形容词化 = 职业的,专业的"},{"word":"confess","pos":"v.","detail":"构词: 构词: con(完全) + fess(承认)<br>释义: 承认;坦白","example":"例句: He confessed his mistake. ｜ 推导: 完全 + 承认 = 彻底承认,坦白"}],"extra":["profess v. 公开声明（构词: pro + fess）","confession n. 坦白;忏悔（构词: confess + ion）","confessor n. 忏悔者（构词: confess + or）","professed a. 公开承认的（构词: profess + ed）"]},{"id":550,"root":"grad-/gress-","pronounce":"/græd/格拉德","source":"拉丁语 gradi","meaning":"走,步,级","mnemonic":"grad-/gress分成两支记。grad从grade里记，grade就是等级，每升一级就像向上走一步；gress从progress里记，progress就是向前行进。所以grad-/gress就是“走,步,级”的意思。","mainWords":[{"word":"grade","pos":"n.","detail":"构词: 构词: grad(步) + e<br>释义: 等级;年级;成绩","example":"例句: She got good grades in school. ｜ 推导: 步 → 台阶 → 等级"},{"word":"graduate","pos":"v.","detail":"构词: 构词: grad(步) + u + ate<br>释义: 毕业 n.毕业生","example":"例句: He will graduate next year. ｜ 推导: 步 + 完成 = 完成学业阶段,毕业"},{"word":"gradual","pos":"a.","detail":"构词: 构词: grad(步) + ual(形容词后缀)<br>释义: 逐渐的;渐进的","example":"例句: The change was gradual. ｜ 推导: 步 + 形容词化 = 一步步的,逐渐的"},{"word":"degree","pos":"n.","detail":"构词: 构词: de(下) + gree(步)<br>释义: 程度;度数;学位","example":"例句: He has a master's degree. ｜ 推导: 下 + 步 = 台阶,等级,学位"},{"word":"undergraduate","pos":"n.","detail":"构词: 构词: under(未完) + graduate<br>释义: 本科生","example":"例句: She is an undergraduate student. ｜ 推导: 未完成 + 毕业生 = 本科生"},{"word":"centigrade","pos":"n./a.","detail":"构词: 构词: centi(百) + grade(度)<br>释义: 摄氏度(的)","example":"例句: Water boils at 100 centigrade. ｜ 推导: 百 + 度 = 百分度标尺,摄氏度"}],"extra":["upgrade v./n. 升级（构词: up + grade）","gradient n. 梯度;渐变（构词: grad + ient）","gradually ad. 逐渐地（构词: gradual + ly）","degrade v. 降级;贬低（构词: de(下) + grade）","postgraduate n. 研究生（构词: post(后) + graduate）","graduation n. 毕业（构词: graduate + ion）"]},{"id":551,"root":"grav-","pronounce":"/græv/格拉夫","source":"拉丁语 gravis(重)","meaning":"重,沉重","mnemonic":"方法一：grav就是“给入屋”。正常情况下没有邀请我们是不可能让外人随便入自己的家的，但是如果发生了某种严重的事情不得不妥协，我们就只能被迫把外人放进屋子，例如鸦片战争战败，不得不割让香港岛，让侵略者进自己的家园。所以grav就是“重、沉重”的意思。 方法二：为了记忆，可以把GRAV记成“Great Rock: A Very heavy thing”。\nGreat Rock表示一块很大的岩石；A Very heavy thing直接描述这块岩石给人的重量感。\n如果把一块大岩石这样沉重的东西压在身上，事情也会变得严肃、严重。所以grav就是“重、沉重；严肃、严重”的意思。","mainWords":[{"word":"grave","pos":"n.","detail":"构词: 构词: grav(重) + e<br>释义: 坟墓 a.严肃的","example":"例句: He looked grave and worried. ｜ 推导: 重 → 沉重的归宿/沉重的表情"},{"word":"gravity","pos":"n.","detail":"构词: 构词: grav(重) + ity(名词后缀)<br>释义: 重力;严肃性","example":"例句: The gravity of the situation. ｜ 推导: 重 + 名词化 = 重的性质/分量"},{"word":"aggravate","pos":"v.","detail":"构词: 构词: ag(加强) + grav(重) + ate<br>释义: 加重,恶化","example":"例句: Don't aggravate the problem. ｜ 推导: 加强 + 重 + 动词化 = 使更重"}],"extra":["gravitate v. 受引力作用（构词: grav + itate）","gravitation n. 引力（构词: grav + itation）","grievous a. 严重的（构词: griev(grav变体) + ous）","engrave v. 雕刻（构词: en + grav）"]},{"id":552,"root":"laps-","pronounce":"/læps/莱普斯","source":"拉丁语 labi","meaning":"滑落,倒下","mnemonic":"laps就是“落趴”。人或东西一滑落，最后会趴下、倒下；时间悄悄滑走，也像从手中落下。所以laps就是“滑落、倒下”的意思。","mainWords":[{"word":"lapse","pos":"n.","detail":"构词: 构词: laps(滑落) + e<br>释义: 失误;流逝 v.流逝","example":"例句: A memory lapse occurred. ｜ 推导: 滑落 = 记忆滑落(失误);时间滑落(流逝)"},{"word":"elapse","pos":"v.","detail":"构词: 构词: e(出) + laps(滑落) + e<br>释义: (时间)流逝","example":"例句: Two years elapsed quickly. ｜ 推导: 出 + 滑落 = 时间滑出,流逝"},{"word":"collapse","pos":"v./n.","detail":"构词: 构词: col(共同) + laps(滑落) + e<br>释义: 崩塌;崩溃","example":"例句: The building collapsed suddenly. ｜ 推导: 共同 + 滑落 = 整体崩塌"}],"extra":["relapse v./n. 复发（构词: re(再) + laps + e）","lapsed a. 失效的（构词: laps + ed）","collapsible a. 可折叠的（构词: col + laps + ible）","elapsed a. 过去的（构词: e + laps + ed）","time-lapse n. 延时摄影（构词: time + laps + e）","overlapping a. 重叠的（构词: over + lap + ping）","lapsing a. 流逝的（构词: laps + ing）","collapsed a. 倒塌的（构词: col + laps + ed）","prolapse n. 脱垂（构词: pro(向前) + laps + e）","illapse n. 塌陷（构词: il(进入) + laps + e）"]},{"id":553,"root":"pater-/patr-","pronounce":"/ˈpeɪtər/普诶特儿","source":"拉丁语 pater","meaning":"父亲,权威","mnemonic":"pater/patr就是“爸的权威”。 父亲在家庭中常代表长辈和权威。 所以pater/patr就是“父亲、权威”。","mainWords":[{"word":"patron","pos":"n.","detail":"构词: 构词: patr(父亲) + on(人)<br>释义: 赞助人;资助人","example":"例句: He is a patron of the arts. ｜ 推导: 父亲 + 人 = 如父亲般的守护者,赞助人"},{"word":"patriotic","pos":"a.","detail":"构词: 构词: patri(祖国) + otic(形容词后缀)<br>释义: 爱国的","example":"例句: She is very patriotic. ｜ 推导: 祖国 + 形容词化 = 爱祖国的,爱国的"}],"extra":["paternal a. 父亲的;父系的（构词: pater + nal）","paternity n. 父权;父子关系（构词: pater + nity）","patriarch n. 族长;家长（构词: patri + arch(统治者)）","patrimony n. 遗产;祖传财产（构词: patri + mony）","patronize v. 赞助;光顾（构词: patron + ize）","patronage n. 赞助;惠顾（构词: patron + age）","compatriot n. 同胞（构词: com(共同) + patri + ot）","expatriate n. 侨民（构词: ex(出) + patri + ate）","patriot n. 爱国者（构词: patri + ot(人)）","patriarchy n. 父权制（构词: patri + archy(统治)）"]},{"id":554,"root":"plic-/plicit-/ply-","pronounce":"/plɪk/普里克","source":"拉丁语 plicare","meaning":"折叠,缠绕","mnemonic":"plic/plicit/ply就是“铺了又叠”。一张东西先铺开，再反复折叠、缠绕，层次会越来越多，也会越来越复杂。所以plic/plicit/ply就是“折叠、缠绕”的意思。","mainWords":[{"word":"complicate","pos":"v.","detail":"构词: 构词: com(加强) + plic(折叠) + ate<br>释义: 使复杂","example":"例句: Don't complicate the issue. ｜ 推导: 加强 + 折叠 = 层层折叠,使复杂"},{"word":"complicated","pos":"a.","detail":"构词: 构词: complicate + d(形容词后缀)<br>释义: 复杂的","example":"例句: It's a complicated problem. ｜ 推导: 使复杂 + 形容词化 = 复杂的"},{"word":"complication","pos":"n.","detail":"构词: 构词: complicate + ion(名词后缀)<br>释义: 并发症;复杂化","example":"例句: Surgery complications occurred. ｜ 推导: 使复杂 + 名词化 = 复杂化,并发症"},{"word":"application","pos":"n.","detail":"构词: 构词: ap(朝向) + plic + ation<br>释义: 应用;申请","example":"例句: Submit your application today. ｜ 推导: 朝向 + 折叠 = 将理论叠合实践,应用"},{"word":"applicable","pos":"a.","detail":"构词: 构词: apply + able(可...的)<br>释义: 适用的","example":"例句: This rule is not applicable. ｜ 推导: 应用 + 可...的 = 可应用的,适用的"},{"word":"implication","pos":"n.","detail":"构词: 构词: im(向内) + plic + ation<br>释义: 含意;暗示","example":"例句: Consider the implications. ｜ 推导: 向内 + 折叠 = 信息内折未言明,隐含"},{"word":"implicit","pos":"a.","detail":"构词: 构词: im(内) + plicit(折叠)<br>释义: 含蓄的;隐含的","example":"例句: There was implicit criticism. ｜ 推导: 内 + 折叠 = 意义内藏,含蓄的"},{"word":"explicit","pos":"a.","detail":"构词: 构词: ex(外) + plicit(折叠)<br>释义: 明确的;清楚的","example":"例句: Be explicit about your needs. ｜ 推导: 外 + 折叠 = 意义展开外显,明确的"},{"word":"duplicate","pos":"v.","detail":"构词: 构词: du(双) + plic(折叠) + ate<br>释义: 复制 n.副本","example":"例句: Duplicate the document. ｜ 推导: 双 + 折叠 = 叠出相同一份,复制"},{"word":"simplicity","pos":"n.","detail":"构词: 构词: sim(单) + plic + ity<br>释义: 简单;朴素","example":"例句: I love the simplicity. ｜ 推导: 单 + 折叠 + 状态 = 无需叠层,简单"},{"word":"supply","pos":"v.(with,to)供给,供应,补足","detail":"构词: 构词: sup-(下、次级) + ply<br>释义: n.供应,供应量","example":"推导: 核心词根「plic-/plicit-/ply-」表示“折叠,缠绕”，结合前后缀，可推出“v.(with,to)供给,供应,补足 n.供应,供应量”"},{"word":"compliment","pos":"n.(pl.)问候,致意","detail":"构词: 构词: com-(共同、一起) + ply + -ment(动作、结果或状态)<br>释义: n./v.称赞,恭维","example":"推导: 核心词根「plic-/plicit-/ply-」表示“折叠,缠绕”，结合前后缀，可推出“n.(pl.)问候,致意 n./v.称赞,恭维”"}],"extra":[]},{"id":555,"root":"proper/propri","pronounce":"/ˈprɒpə/普儿奥珀","source":"拉丁语 proprius","meaning":"专属,自身,固有","mnemonic":"proper/propri就是person、right、own、protect、rule、it几个熟词的首字母组合。一个person有right去own it、protect it、rule it，一件东西只由一个人拥有和支配，就是专属；本来就在它自己身上，就是自身、固有；正好符合它自身情况，就是适当。所以proper/propri就是“专属、自身、固有”的意思。","mainWords":[{"word":"proper","pos":"a.","detail":"构词: 构词: pro(强化) + per(自身)<br>释义: 适当的;固有的","example":"例句: Use the proper tools for the job. ｜ 推导: 强化 + 自身 = 本身就该有的,恰当的"},{"word":"property","pos":"n.","detail":"构词: 构词: proper(专属) + ty(名词后缀)<br>释义: 财产;特性","example":"例句: This is private property. ｜ 推导: 专属 + 名词化 = 专属之物,财产"},{"word":"appropriate","pos":"a.","detail":"构词: 构词: ap(朝向) + propri(专属) + ate<br>释义: 适当的","example":"例句: Choose appropriate words. ｜ 推导: 朝向 + 专属 + 形容词化 = 恰好合适的"}],"extra":["properly ad. 适当地（构词: proper + ly）","proprietary a. 专有的（构词: propri + etary）","proprietor n. 所有者（构词: propri + etor）","improper a. 不适当的（构词: im + proper）"]},{"id":556,"root":"quiet","pronounce":"/kwaɪət/克乌爱额特","source":"拉丁语 quietus","meaning":"静止,安息","mnemonic":"quiet本身就是我们小学学过的quiet，意思是安静。声音和动作都停下来，周围就会静止；人安静下来，也能休息和安息。所以quiet就是“静止、安息”的意思。","mainWords":[{"word":"quiet","pos":"a.","detail":"构词: 构词: quiet(静止)<br>释义: 安静的 n.安静","example":"例句: The room became quiet. ｜ 推导: 静止 = 安静的状态"},{"word":"quit","pos":"v.","detail":"构词: 构词: quit(使静止)<br>释义: 退出,离开;停止","example":"例句: He quit his job last month. ｜ 推导: 使静止 = 停止,退出"},{"word":"quite","pos":"ad.","detail":"构词: 构词: quit(完结) + e<br>释义: 完全,十分","example":"例句: I'm quite sure about it. ｜ 推导: 完结状态 = 完全,彻底"}],"extra":["quietly ad. 安静地（构词: quiet + ly）","quietness n. 安静（构词: quiet + ness）","disquiet v. 使不安（构词: dis + quiet）","acquit v. 宣判无罪（构词: ac + quit）"]},{"id":557,"root":"rad-","pronounce":"/ræd/儿艾德","source":"拉丁语 radius","meaning":"光线,辐射","mnemonic":"rad我们在小学词 radio 中见过：radio 的开头完整保留 rad。radio 能接收从远处传播来的电波；波从中心向外传开，就像光线和辐射。所以rad就是“光线、辐射”。","mainWords":[{"word":"radio","pos":"n.","detail":"构词: 构词: rad(辐射) + io<br>释义: 收音机;无线电","example":"例句: Turn on the radio. ｜ 推导: 辐射 = 无线电波传播"},{"word":"radar","pos":"n.","detail":"构词: 构词: 缩写: Radio Detection And Ranging<br>释义: 雷达","example":"例句: The radar detected the plane. ｜ 推导: 无线电探测和测距系统"},{"word":"radiate","pos":"v.","detail":"构词: 构词: rad(光) + iate(动词后缀)<br>释义: 辐射;散发","example":"例句: The sun radiates heat. ｜ 推导: 光 + 动词化 = 发出光线,辐射"},{"word":"radius","pos":"n.","detail":"构词: 构词: rad(辐射) + ius<br>释义: 半径;范围","example":"例句: Within a 5-mile radius. ｜ 推导: 辐射 = 从中心辐射出的线,半径"},{"word":"radiant","pos":"a.","detail":"构词: 构词: rad(光) + iant(形容词后缀)<br>释义: 辐射的;容光焕发的","example":"例句: She looked radiant with joy. ｜ 推导: 光 + 形容词化 = 光芒四射的"},{"word":"radioactive","pos":"a.","detail":"构词: 构词: radio(辐射) + active(活跃的)<br>释义: 放射性的","example":"例句: Radioactive materials are dangerous. ｜ 推导: 辐射 + 活跃的 = 有放射性的"}],"extra":["radiation n. 辐射;放射（构词: rad + iation）","radical a. 根本的;激进的（构词: rad + ical）","radial a. 放射状的;径向的（构词: rad + ial）","radium n. 镭（构词: rad + ium）","irradiate v. 照射;辐照（构词: ir + rad + iate）","radiator n. 散热器（构词: rad + iator）","eradicate v. 根除（构词: e(出) + rad(根) + icate）","radiography n. 放射照相术（构词: radio + graphy）"]},{"id":558,"root":"sacr-","pronounce":"/seɪkr/瑟衣克儿","source":"拉丁语 sacer","meaning":"神圣,神圣的","mnemonic":"可以把SACR记成“Set Apart, Common use Removed”。\n\nSet Apart表示被单独放置；Common use Removed表示从普通、日常用途里移开，不再随便使用。\n\n在祭祀、纪念或庄严场合中，一件物品一旦被专门放到一边，不再作为普通日用品使用，人们就会认真对待它，不随意触碰和处置。这样的东西就具有神圣、庄严的性质。\n\n所以sacr-就是“神圣、神圣的”的意思。","mainWords":[{"word":"sacred","pos":"a.","detail":"构词: 构词: sacr(神圣) + ed(形容词后缀)<br>释义: 神圣的;宗教的","example":"例句: This place is sacred to them. ｜ 推导: 神圣 + 形容词化 = 神圣的"},{"word":"sacrifice","pos":"n./v.","detail":"构词: 构词: sacr(神圣) + fice(做)<br>释义: 牺牲;献祭","example":"例句: He made a great sacrifice. ｜ 推导: 神圣 + 做 = 为神所做的行为,牺牲"}],"extra":["sacrament n. 圣礼;圣餐（构词: sacr + ament）","sacrilege n. 亵渎神圣（构词: sacr + lege(法)）","sacrificial a. 牺牲的（构词: sacrifice + ial）","consecrate v. 奉献;使神圣（构词: con + secr + ate）","desecrate v. 亵渎（构词: de(去掉) + secr + ate）","sacrosanct a. 极其神圣的（构词: sacr + o + sanct）","sacredness n. 神圣性（构词: sacred + ness）","sacredly ad. 神圣地（构词: sacred + ly）","Sacramento n. 萨克拉门托（构词: sacr + amento）","sacral a. 神圣的;骶⻣的（构词: sacr + al）"]},{"id":559,"root":"sphere","pronounce":"/sfɪə/斯夫伊儿","source":"希腊语 σφαῖρα","meaning":"球体,范围","mnemonic":"为了记忆，可以把SPHERE记成“Surface Points Have Equal Radius Everywhere”。\n\nSurface Points表示一个面上的各个点；Have Equal Radius表示这些点到面的中心的半径都相等；Everywhere表示无论看面的哪个方向，这条规律都成立。\n\n这正是球体最直观的特征：球面向四周均匀展开，每个方向都围住一块空间。球体所包住的一整块空间，又可以继续表示一个人活动、研究或影响所覆盖的范围和领域。\n\n所以sphere就是“球体；范围、领域”的意思。","mainWords":[{"word":"sphere","pos":"n.","detail":"构词: 构词: sphere(球体)<br>释义: 球体;范围;领域","example":"例句: In the sphere of politics. ｜ 推导: 球体 = 球体,范围,领域"},{"word":"atmosphere","pos":"n.","detail":"构词: 构词: atmo(空气) + sphere<br>释义: 大气层;氛围","example":"例句: A friendly atmosphere. ｜ 推导: 空气 + 球体 = 包围地球的气体层"},{"word":"hemisphere","pos":"n.","detail":"构词: 构词: hemi(半) + sphere<br>释义: 半球","example":"例句: The northern hemisphere. ｜ 推导: 半 + 球体 = 半球"}],"extra":["spherical a. 球形的（构词: sphere + ical）","biosphere n. 生物圈（构词: bio(生命) + sphere）","stratosphere n. 平流层（构词: strato(层) + sphere）","troposphere n. 对流层（构词: tropo(转) + sphere）"]},{"id":560,"root":"sting/stinct","pronounce":"/stɪŋ/斯提昂","source":"","meaning":"刺,戳","mnemonic":"sting本身就有刺、刺痛的感觉。尖东西一戳会sting，留下明显的区别和痕迹；stinct可以看成sting的近形变化。所以sting/stinct就是“刺、戳”的意思。","mainWords":[{"word":"distinct","pos":"a.","detail":"构词: 构词: dis(分离) + stinct(刺)<br>释义: 清楚的;不同的","example":"例句: The two concepts are distinct. ｜ 推导: 分离 + 刺 = 刺出分界线,清晰可辨的"},{"word":"distinction","pos":"n.","detail":"构词: 构词: distinct + ion(名词后缀)<br>释义: 区别;卓越","example":"例句: He graduated with distinction. ｜ 推导: 清晰的 + 名词化 = 区别,卓越性"},{"word":"distinguish","pos":"v.","detail":"构词: 构词: dis + sting(刺) + uish<br>释义: 区分;辨别","example":"例句: Can you distinguish the twins? ｜ 推导: 分离 + 刺 + 动词化 = 用刺分开,区分"},{"word":"instinct","pos":"n.","detail":"构词: 构词: in(向内) + stinct(刺)<br>释义: 本能;直觉","example":"例句: Trust your instinct. ｜ 推导: 向内 + 刺 = 内心被刺激的反应,本能"}],"extra":["distinctive a. 独特的（构词: distinct + ive）","instinctive a. 本能的（构词: instinct + ive）","extinct a. 灭绝的（构词: ex(出) + stinct）","extinction n. 灭绝（构词: extinct + ion）"]},{"id":561,"root":"trad-","pronounce":"/træd/特拉德","source":"拉丁语 tradere","meaning":"传递,交付","mnemonic":"为了记忆，可以把TRAD记成“Take, Reach Another, Drop into hand”。\nTake表示先把东西拿起来；Reach Another表示走到另一个人面前；Drop into hand表示把东西放进对方手里。\n从自己手里拿起，走到另一个人那里，再交到对方手里，就是一次完整的传递和交付。如果上一代把习惯、故事和做法这样交给下一代，就形成代代相传的传统。\n所以trad就是“传递、交付；向后代传下”的意思。","mainWords":[{"word":"trade","pos":"n./v.","detail":"构词: 构词: trad(传递) + e<br>释义: 贸易;交易","example":"例句: International trade is booming. ｜ 推导: 传递 = 货物的传递,贸易"},{"word":"tradition","pos":"n.","detail":"构词: 构词: trad(传递) + ition(名词后缀)<br>释义: 传统;惯例","example":"例句: We follow ancient traditions. ｜ 推导: 传递 + 名词化 = 代代相传的习俗"},{"word":"traditional","pos":"a.","detail":"构词: 构词: tradition + al(形容词后缀)<br>释义: 传统的","example":"例句: Traditional festivals are important. ｜ 推导: 传统 + 形容词化 = 传统的,惯例的"},{"word":"trademark","pos":"n.","detail":"构词: 构词: trade + mark(标记)<br>释义: 商标","example":"例句: Register your trademark early. ｜ 推导: 贸易 + 标记 = 商业标识,商标"}],"extra":["trader n. 商人（构词: trade + er）","trading n. 交易（构词: trade + ing）","tradesman n. 商人（构词: trades + man）","betray v. 背叛（构词: be + tray(=trad)）"]},{"id":562,"root":"tribute","pronounce":"/ˈtrɪbjuːt/特里布耶乌特","source":"拉丁语 tribuere","meaning":"分配,归属","mnemonic":"tribute开头的 tri 可以先想到我们认识的three。 想象把一批 gift 分成 three 份，再分别 give 给三个对象。每一份都有明确的归属，这就是分配；其中专门交给统治者、表示敬意的那一份 share，后来就是贡品和致敬礼物。 所以由“three 份礼物分别给出去”记住 tribute 所在词族的“分配、归属”。 所以tribute就是“分配、归属”，并可表示“贡品、致敬”。","mainWords":[{"word":"tribute","pos":"n.","detail":"构词: 构词: tribute(分配)<br>释义: 贡品;致敬","example":"例句: They paid tribute to the hero. ｜ 推导: 分配 = 上缴的分配物,贡品"},{"word":"contribute","pos":"v.","detail":"构词: 构词: con(共同) + tribute<br>释义: 贡献;捐献","example":"例句: Everyone can contribute to society. ｜ 推导: 共同 + 分配 = 共同给予,贡献"},{"word":"contribution","pos":"n.","detail":"构词: 构词: contribute + ion(名词后缀)<br>释义: 贡献;捐款","example":"例句: Her contribution was significant. ｜ 推导: 贡献 + 名词化 = 贡献(物),捐献"},{"word":"attribute","pos":"v.","detail":"构词: 构词: at(朝向) + tribute<br>释义: 归因于 n.属性","example":"例句: He attributes success to luck. ｜ 推导: 朝向 + 分配 = 归属于,归因于"},{"word":"distribute","pos":"v.","detail":"构词: 构词: dis(分散) + tribute<br>释义: 分发;分配","example":"例句: They distribute food to the poor. ｜ 推导: 分散 + 分配 = 分散地分配,分发"}],"extra":["distribution n. 分配;分布（构词: distribute + ion）","contributor n. 贡献者（构词: contribute + or）","attribution n. 归因（构词: attribute + ion）","tributary n. 支流 a.纳贡的（构词: tribut + ary）"]},{"id":563,"root":"-vade/-vas","pronounce":"/veɪd/五诶德","source":"拉丁语 vadere","meaning":"走,行走","mnemonic":"vade/-vas就是“往的”。往的会让人直接想到“走”，由这个意思还可以继续推出行走，所以vade/-vas就是“走,行走”的意思。","mainWords":[{"word":"invade","pos":"v.","detail":"构词: 构词: in(进入) + vade(走)<br>释义: 侵入;侵略","example":"例句: The army invaded the country. ｜ 推导: 进入 + 走 = 走进去,侵入"},{"word":"evade","pos":"v.","detail":"构词: 构词: e(出) + vade(走)<br>释义: 逃避;规避","example":"例句: He tried to evade the question. ｜ 推导: 出去 + 走 = 走开,逃避"}],"extra":["invasion n. 入侵;侵略（构词: in + vas + ion）","invasive a. 侵入的（构词: in + vas + ive）","evasion n. 逃避;回避（构词: e + vas + ion）","evasive a. 逃避的（构词: e + vas + ive）","pervade v. 弥漫;遍布（构词: per(遍) + vade）","pervasive a. 普遍的（构词: per + vas + ive）","invader n. 入侵者（构词: in + vade + r）","wade v. 涉水而行（构词: w + ade）","evader n. 逃避者（构词: e + vade + r）","vadose a. 渗流的（构词: vad + ose）"]},{"id":564,"root":"vapor-","pronounce":"/ˈveɪpər/五诶珀儿","source":"拉丁语 vapor","meaning":"蒸汽,热气","mnemonic":"vapor就是“雾泡”。水被加热以后会先冒泡，再变成雾一样的热气向上升，这就是蒸汽。所以vapor就是“蒸汽、热气”的意思。","mainWords":[{"word":"vapor","pos":"n.","detail":"构词: 构词: vapor(蒸汽)<br>释义: 蒸汽;雾气","example":"例句: Water vapor rises from the lake. ｜ 推导: 蒸汽 = 水或其他液体的气态形式"},{"word":"evaporate","pos":"v.","detail":"构词: 构词: e(向外) + vapor + ate(动词后缀)<br>释义: 蒸发;消失","example":"例句: The puddle will evaporate in the sun. ｜ 推导: 向外 + 蒸汽 + 动词化 = 变成蒸汽散出"}],"extra":["vaporize v. 使汽化（构词: vapor + ize(使...化)）","vaporization n. 汽化（构词: vapor + ization）","vaporous a. 蒸汽般的（构词: vapor + ous(形容词后缀)）","evaporation n. 蒸发（构词: e + vapor + ation）","vaporizer n. 蒸发器（构词: vapor + izer）","vapid a. 无味的;乏味的（构词: vap + id）","evaporative a. 蒸发的（构词: e + vapor + ative）","vaporish a. 似蒸汽的（构词: vapor + ish）"]},{"id":566,"root":"scrib-/script-","pronounce":"/skrɪb/斯克里布；/skrɪpt/斯克里普特","source":"拉丁语 scribere“写” / scriptus“写下的”","meaning":"写、书写","mnemonic":"scrib就是下面这些熟词的首字母组合：S就是see，C就是can，R就是read，I就是in，B就是book。 先 see，再把看到的内容 write 在 book 里，别人才能 read。 这个完整动作就是把内容写下来。 看到scrib，就想到“把看到的内容写进书里”。 所以scrib就是“写，描写”。","mainWords":[{"word":"prescribe","pos":"v.","detail":"构词: 构词: pre-(预先、在前) + scrib(写) + -e<br>释义: 指示,规定;处(方),开(药)","example":"例句: The doctor prescribed a short course of medicine. ｜ 推导: 事先把用药要求写下来 = 开药、规定"}],"extra":[]},{"id":567,"root":"tend-/tent-","pronounce":"/tend/特诶恩德；/tent/特诶恩特","source":"拉丁语 tendere“伸展、延伸” / tentus“伸开的”","meaning":"伸展、延伸；趋向","mnemonic":"tent本身就是小学学过的 camp 场景。 帐篷布要靠多条 line 向外 pull，布面才会被拉 long、拉紧。 因此 tent 的画面可以稳定记住“伸展、拉开”。 所以tent就是“伸展”。","mainWords":[{"word":"extent","pos":"n.","detail":"构词: 构词: ex-(向外) + tent(伸展)<br>释义: 广度,宽度,长度;程度,限度","example":"例句: The damage extended to a limited extent. ｜ 推导: 向外伸展所达到的范围 = 广度、程度"},{"word":"intention","pos":"n.","detail":"构词: 构词: in-(朝向、进入) + tent(伸展、趋向) + -ion<br>释义: 意图,意向,目的","example":"例句: Her intention was to finish the project early. ｜ 推导: 想法朝某个目标伸展 = 意图、目的"},{"word":"retention","pos":"n.","detail":"构词: 构词: re-(向后、保持) + tent(拉住) + -ion<br>释义: 保留,保持,保持力,记忆力","example":"例句: Good notes improve the retention of information. ｜ 推导: 把内容拉住不让它丢失 = 保留、记忆保持"}],"extra":[]},{"id":571,"root":"spons-","pronounce":"/spɒns/斯普奥恩斯","source":"拉丁语 spondere“郑重承诺” / sponsus“已承诺的”","meaning":"承诺、保证；发起、担保","mnemonic":"spons就是下面这些熟词的首字母组合：S就是say，P就是put，O就是our，N就是name，最后一个 S 提醒“写下”。 先 say 自己答应，再 put our name 并写 down。 把名字签下去，就表示已经作出承诺和约定。 所以spons就是“承诺约定”。","mainWords":[{"word":"sponsor","pos":"n./v.","detail":"构词: 构词: spons(承诺、担保) + -or(人)<br>释义: 发起人,赞助者,保证人；发起,主办","example":"例句: A local company sponsored the science fair. ｜ 推导: 作出承诺并提供支持的人或机构 = 赞助者、发起者"}],"extra":[]},{"id":579,"root":"prob-/prov-","pronounce":"/prɒb/普儿奥布；/pruːv/普儿乌五","source":"拉丁语 probare“检验、认可、证明”","meaning":"检验、证明；认可、批准","mnemonic":"prov就是下面这些熟词的首字母组合：P就是put，R就是reason，O就是on，V就是view。 把 reason 放到我们能够 view 的地方，事实就会变得清楚，可以被检验和证明。 能够经得住证明的内容，也更容易被认为诚实、可靠。 所以prov就是“诚实正直证明”。","mainWords":[{"word":"approve","pos":"v.","detail":"构词: 构词: ap-/ad-(朝向、加强) + prov(检验、认可) + -e<br>释义: 赞成,赞许,同意；批准,通过","example":"例句: The committee approved the new plan. ｜ 推导: 检验后认定合格 = 赞成、批准"}],"extra":[]},{"id":581,"root":"stru-/struct-","pronounce":"/struː/斯特儿乌；/strʌkt/斯特儿阿克特","source":"拉丁语 struere“堆砌、建造” / structus“建成的”","meaning":"建造、构成、结构","mnemonic":"把STRUCT记成一个建造过程： S就是start，T就是thing，R就是raise，U就是up，C就是join，T就是together。 先准备 thing，再把它 raise up，最后 join together，就能 make、build 出一个完整结构。 所以struct就是“建造建立”。","mainWords":[{"word":"construct","pos":"v.","detail":"构词: 构词: con-(共同) + struct(建造)<br>释义: 建设,建造,构造;创立","example":"例句: Workers constructed a bridge across the river. ｜ 推导: 把材料共同堆砌成整体 = 建造、构造"},{"word":"destructive","pos":"a.","detail":"构词: 构词: de-(彻底、向下) + struct(结构) + -ive<br>释义: 破坏性","example":"例句: The storm had a destructive effect on the coast. ｜ 推导: 把既有结构破坏下去 = 破坏性的"},{"word":"obstruction","pos":"n.","detail":"构词: 构词: ob-(挡在前面) + struct(建造、结构) + -ion<br>释义: 妨碍,障碍物","example":"例句: A fallen tree caused an obstruction on the road. ｜ 推导: 在通道前形成结构性阻挡 = 障碍物"},{"word":"obstruct","pos":"v.","detail":"构词: 构词: ob-(挡在前面) + struct(结构)<br>释义: 阻隔,阻塞,妨碍","example":"例句: Do not obstruct the emergency exit. ｜ 推导: 用物体挡住通道 = 阻塞、妨碍"}],"extra":[]},{"id":584,"root":"","pronounce":"/mɜːk/姆克","source":"① 拉丁语 merx，所有格 mercis“商品”；② 拉丁语 merces“报酬、恩惠”","meaning":"商品、贸易；报酬、恩惠、怜悯","mnemonic":"merc就是“墨丘利”。墨丘利是神话中的商业之神，商人、贸易和商业都归他掌管，所以merc就是“商业”的意思。","mainWords":[{"word":"commercial","pos":"a./n.","detail":"构词: 构词: com-(共同、整体) + merc(商品、贸易) + -ial<br>释义: 商业的,商务的,可获利的；广告节目","example":"例句: The area has become a busy commercial center. ｜ 推导: 与商品买卖活动有关 = 商业的"},{"word":"commerce","pos":"n.","detail":"构词: 构词: com-(共同、相互) + merc(商品、贸易) + -e<br>释义: 商业，贸易；交际，交往","example":"例句: Online commerce has changed shopping habits. ｜ 推导: 商品在各方之间流通 = 商业、贸易"},{"word":"mercy","pos":"n.","detail":"构词: 构词: merc(报酬、恩惠的同形词根) + -y<br>释义: 仁慈,怜悯,宽恕","example":"例句: The judge showed mercy to the young offender. ｜ 推导: 从给予报酬和恩惠引申为宽恕、怜悯 = 仁慈、宽恕"}],"extra":[]},{"id":585,"root":"form-","pronounce":"/fɔːm/福姆","source":"拉丁语 forma“形状、形式”","meaning":"形状、形式；形成","mnemonic":"form就是“form”。form就是“形状,形式”，其中最关键的意思可以继续联系到“方式”，所以form就是“方式”的意思。","mainWords":[{"word":"conform","pos":"vi.","detail":"构词: 构词: con-(共同、一致) + form(形式)<br>释义: 遵守,适应；相似,一致,符合","example":"例句: All products must conform to the safety standard. ｜ 推导: 形式与共同标准保持一致 = 遵守、符合"}],"extra":[]},{"id":588,"root":"tail-/taill-","pronounce":"/teɪl/特诶勒","source":"古法语 taillier“切割、限定”","meaning":"切割；限定、使承担","mnemonic":"tail本身就是小学学过的词，意思是尾巴。 想象一条很长的 tail 被剪刀 cut 成一段一段。 这个画面直接把 tail 的拼写和“剪、割、切”联系起来。 所以tail就是“剪割切”。","mainWords":[{"word":"entail","pos":"vt.","detail":"构词: 构词: en-(使进入) + tail(限定、切定)<br>释义: 使承担;需要;把(疾病等)遗传给;限定","example":"例句: The job entails frequent travel. ｜ 推导: 把某项责任限定进事情之中 = 需要、使承担"}],"extra":[]},{"id":589,"root":"","pronounce":"/əˈtɜːni/额特尼","source":"古法语 atorné“受委派的人”","meaning":"代理人、受委派者","mnemonic":"torney就是“托你”。托你会让人直接想到“委托”，所以torney就是“委托”的意思。","mainWords":[{"word":"attorney","pos":"n.","detail":"构词: 构词: 古法语 atorné(受委派者)形成的整体词<br>释义: 代理人,辩护律师","example":"例句: The attorney reviewed the contract carefully. ｜ 推导: 受人委派处理法律事务的人 = 律师、代理人"}],"extra":[]},{"id":590,"root":"","pronounce":"/trænˈzɪstə/特拉恩兹衣斯特","source":"英语 transfer 与 resistor 的缩合词","meaning":"晶体管；传输与电阻控制元件","mnemonic":"ist就是“异士”。异就是与别人不一样，士就是某一类人，所以ist通常表示具有某种特点、从事某种行业或信奉某种主义的人。这里表示的就是“不一样”的意思。","mainWords":[{"word":"transistor","pos":"n.","detail":"构词: 构词: transfer(传输) + resistor(电阻器)的缩合形式<br>释义: 晶体管；晶体管收音机","example":"例句: A transistor controls the flow of electric current. ｜ 推导: 兼具传输和电阻控制功能的元件 = 晶体管"}],"extra":[]},{"id":591,"root":"viol-","pronounce":"/vaɪəl/五爱额勒","source":"拉丁语 violare“侵犯、亵渎”","meaning":"侵犯、违背、伤害","mnemonic":"viol就是“违拗”。违拗会让人直接想到“违背”，所以viol就是“违背”的意思。","mainWords":[{"word":"violate","pos":"vt.","detail":"构词: 构词: viol(侵犯、违背) + -ate<br>释义: 违背;冒犯;妨碍;侵犯;亵渎(圣物)","example":"例句: The company violated the safety rules. ｜ 推导: 越过规则或权利的边界 = 违背、侵犯"}],"extra":[]},{"id":594,"root":"","pronounce":"/tjuːd/特耶乌德；/tɪtjuːd/提特耶乌德","source":"拉丁语 -tudo，所有格 -tudinis","meaning":"性质、状态、程度","mnemonic":"titude就是“态度”。态度表示人的看法和姿态；高度又表示一个人或物体所处的位置和程度，所以titude就是“态度，看法(to，toward，about；姿势；高度，海拔；[pl.]高处，高地”的意思。","mainWords":[{"word":"altitude","pos":"n.","detail":"构词: 构词: alt-(高) + -titude(状态、程度)<br>释义: 高度，海拔；[pl.]高处，高地","example":"例句: The plane climbed to a high altitude. ｜ 推导: 高所达到的程度 = 高度、海拔"}],"extra":[]},{"id":597,"root":"tempt-/tent-","pronounce":"/tempt/特诶姆普特；/tent/特诶恩特","source":"拉丁语 temptare“尝试、试探”","meaning":"尝试、试探；引诱","mnemonic":"tempt就是下面这些熟词的首字母组合：T就是try，E就是every，M就是method，P就是pull，T就是them。 为了把人 pull 过来，会 try every method。 这既包含“尝试”，也包含“设法引诱别人靠近”。 所以tempt就是“尝试引诱”。","mainWords":[{"word":"temptation","pos":"n.","detail":"构词: 构词: tempt(试探、引诱) + -ation<br>释义: 引诱，诱惑；诱惑物","exa
