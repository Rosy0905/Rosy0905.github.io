,"mnemonic":"bid就是“bid”。bid会让人直接想到“命令”，由这个意思还可以继续推出请求,出价，所以bid就是“命令,请求,出价”的意思。","mainWords":[{"word":"bid","pos":"v.","detail":"构词: 构词: bid(命令/出价)<br>释义: 出价;命令 n.出价","example":"例句: He bid $1000 for the painting. ｜ 推导: 命令/出价 = 主动提出要求"},{"word":"forbid","pos":"v.","detail":"构词: 构词: for(反对) + bid(命令)<br>释义: 禁止,不许","example":"例句: The law forbids smoking here. ｜ 推导: 反对 + 命令 = 禁止的命令"},{"word":"abide","pos":"v.","detail":"构词: 构词: a(持续) + bide(等待)<br>释义: 遵守;忍受;居住","example":"例句: We must abide by the rules. ｜ 推导: 持续 + 等待 = 遵守,忍受"}],"extra":["bidding n. 命令;竞标（构词: bid + ing）","bidder n. 出价者（构词: bid + er）","unbidden a. 未受邀请的（构词: un + bid + en）","forbidden a. 被禁止的（构词: for + bid + en）"]},{"id":405,"root":"-ced-","pronounce":"/siːd/斯衣德","source":"","meaning":"走,退让","mnemonic":"ced的核心声音接近“撤”。一个人从原来的位置撤走，就是走开；他撤到一旁给别人让路，就是退让。所以-ced-就是“走、退让”。","mainWords":[{"word":"precede","pos":"v.","detail":"构词: 构词: pre(之前) + ced(走) + e<br>释义: 在...之前;先于","example":"例句: Spring precedes summer. ｜ 推导: 之前 + 走 = 走在前面,先于"},{"word":"preceding","pos":"a.","detail":"构词: 构词: pre + ced + ing(形容词后缀)<br>释义: 在前的;前面的","example":"例句: The preceding chapter was difficult. ｜ 推导: 之前 + 走 + 形容词化 = 在前面的"},{"word":"precedent","pos":"n.","detail":"构词: 构词: pre + ced + ent(名词后缀)<br>释义: 先例;前例","example":"例句: This case set a legal precedent. ｜ 推导: 之前 + 走 + 名词化 = 走在前面的事例"},{"word":"procedure","pos":"n.","detail":"构词: 构词: pro(向前) + ced + ure<br>释义: 程序;手续","example":"例句: Follow the standard procedure. ｜ 推导: 向前 + 走 + 名词化 = 向前走的步骤"},{"word":"recede","pos":"v.","detail":"构词: 构词: re(向后) + ced(走) + e<br>释义: 后退;衰退","example":"例句: The flood waters receded. ｜ 推导: 向后 + 走 = 向后退去,后退"}],"extra":["concede v. 承认;让步（构词: con(共同) + ced）","intercede v. 调解;求情（构词: inter(之间) + ced）","antecedent n. 前例;祖先（构词: ante(前) + ced）","secede v. 脱离;退出（构词: se(分开) + ced）"]},{"id":406,"root":"-cess-","pronounce":"/ses/瑟死","source":"","meaning":"走,退让","mnemonic":"方法一：cess就是“撤身”。 从原来的位置撤出身位，就是走和退让。 所以cess就是“走、退让”。   方法二：为了记忆，可以把CESS记成“Clear Exit; Step, Step”。\nClear Exit表示先把出口让出来；Step, Step表示自己连续向旁边或后面走两步。别人要从门口通过时，你先清出出口，再走开让位。\n所以ced/ceed/cess就是“走、前进；走开、退让”的意思。","mainWords":[{"word":"access","pos":"n./v.","detail":"构词: 构词: ac(向) + cess(走)<br>释义: 进入;接近","example":"例句: Access to information is vital. ｜ 推导: 向 + 走 = 走向,进入"},{"word":"accessory","pos":"n.","detail":"构词: 构词: ac + cess + ory<br>释义: 附件;配饰","example":"例句: Fashion accessories complete the look. ｜ 推导: 走向 + 名词化 = 附加走向主体的东⻄"},{"word":"success","pos":"n.","detail":"构词: 构词: suc(在下) + cess(走)<br>释义: 成功","example":"例句: Success requires hard work. ｜ 推导: 跟随 + 走 = 跟着走到底,成功"},{"word":"successful","pos":"a.","detail":"构词: 构词: success + ful(充满的)<br>释义: 成功的","example":"例句: She is a successful entrepreneur. ｜ 推导: 成功 + 充满 = 充满成功的"},{"word":"successor","pos":"n.","detail":"构词: 构词: suc + cess + or(人)<br>释义: 继任者","example":"例句: He appointed his successor. ｜ 推导: 跟随 + 走 + 人 = 跟着走的人,继任者"},{"word":"succession","pos":"n.","detail":"构词: 构词: suc + cess + ion<br>释义: 继承;连续","example":"例句: The succession was smooth. ｜ 推导: 跟随 + 走 + 名词化 = 连续跟随"},{"word":"successive","pos":"a.","detail":"构词: 构词: suc + cess + ive<br>释义: 连续的","example":"例句: Three successive wins boosted morale. ｜ 推导: 跟随 + 走 + 形容词化 = 连续跟随的"},{"word":"excess","pos":"n.","detail":"构词: 构词: ex(出) + cess(走)<br>释义: 过度;超过","example":"例句: Avoid excess in everything. ｜ 推导: 出 + 走 = 走出界限,过度"},{"word":"excessive","pos":"a.","detail":"构词: 构词: ex + cess + ive<br>释义: 过度的","example":""},{"word":"concession","pos":"n.","detail":"构词: 构词: con(共同) + cess(退让) + ion<br>释义: 让步;特许","example":""},{"word":"procession","pos":"n.","detail":"构词: 构词: pro(向前) + cess(走) + ion<br>释义: 游行;行列","example":"例句: A wedding procession passed by. ｜ 推导: 向前 + 走 + 名词化 = 向前行走的队伍"},{"word":"predecessor","pos":"n.","detail":"构词: 构词: pre(之前) + de + cess + or<br>释义: 前任","example":"例句: He learned from his predecessor. ｜ 推导: 之前 + 离开 + 走 + 人 = 之前走的人"},{"word":"precess","pos":"v.","detail":"构词: 构词: pre(之前) + cess(走)<br>释义: 进动;旋进","example":"例句: The Earth's axis precesses slowly. ｜ 推导: 之前 + 走 = 提前走,进动"}],"extra":[]},{"id":407,"root":"cis/cid","pronounce":"/sɪs/西斯","source":"拉丁语 caedere(切)","meaning":"切割,切断","mnemonic":"cis/cid就是我们小学学过的scissors。scissors就是剪刀，剪刀的动作就是cut，把整体切开、切断；人在几个选项里作决定，也等于把其他可能性切掉。所以cis/cid就是“切割、切断”的意思。","mainWords":[{"word":"precise","pos":"a.","detail":"构词: 构词: pre(完全) + cis(切割) + e<br>释义: 精确的,准确的","example":"例句: Be precise in your measurements. ｜ 推导: 完全 + 切割 = 精确切割的,精确的"},{"word":"precision","pos":"n.","detail":"构词: 构词: precis(精确) + ion(名词后缀)<br>释义: 精确,精确度","example":"例句: Work with precision and care. ｜ 推导: 精确 + 名词化 = 精确性,精确度"},{"word":"decide","pos":"v.","detail":"构词: 构词: de(向下) + cid(切) + e<br>释义: 决定,裁决","example":"例句: I can't decide what to do. ｜ 推导: 向下 + 切 = 切断犹豫,做出决定"},{"word":"decision","pos":"n.","detail":"构词: 构词: decis(决定) + ion(名词后缀)<br>释义: 决定,决策","example":"例句: Make a quick decision. ｜ 推导: 决定 + 名词化 = 决定,决策"}],"extra":["concise a. 简洁的（构词: con + cis + e）","excise v. 切除（构词: ex + cis + e）","incision n. 切口（构词: in + cis + ion）","circumcise v. 环切（构词: circum + cis + e）","scissors n. 剪刀（构词: s + cis + sors）","imprecise a. 不精确的（构词: im + precis + e）","decisive a. 决定性的（构词: de + cis + ive）","indecisive a. 优柔寡断的（构词: in + decis + ive）","incisive a. 深刻的（构词: in + cis + ive）","incise v. 雕刻,切入（构词: in + cis + e）"]},{"id":408,"root":"fold","pronounce":"/fəʊld/夫欧勒德","source":"古英语 (折叠)","meaning":"折叠,重叠,倍","mnemonic":"以后看到fold，直接想象把一张纸从中间折过去。折一次，原来一层变成两层；继续折，层数不断重叠并按倍数增加。所以fold就是“折叠、重叠、倍”。","mainWords":[{"word":"fold","pos":"v.","detail":"构词: 构词: fold(折叠)<br>释义: 折叠 n.褶痕","example":"例句: Fold the paper in half. ｜ 推导: 原始词根 = 折叠,重叠"},{"word":"unfold","pos":"v.","detail":"构词: 构词: un(解开) + fold(折叠)<br>释义: 展开,显露","example":"例句: The story slowly unfolds. ｜ 推导: 解开 + 折叠 = 展开,逐渐显露"}],"extra":["folder n. 文件夹（构词: fold + er）","multifold a. 多倍的（构词: multi + fold）","enfold v. 包住,拥抱（构词: en + fold）","hundredfold a. 百倍的（构词: hundred + fold）","twofold a. 两倍的（构词: two + fold）","severalfold a. 几倍的（构词: several + fold）","threefold a. 三倍的（构词: three + fold）","folding a. 可折叠的（构词: fold + ing）","manifold a. 多样的（构词: mani + fold）","refold v. 重新折叠（构词: re + fold）","billfold n. 钱夹（构词: bill + fold）","fourfold a. 四倍的（构词: four + fold）","foldaway a. 可折叠的（构词: fold + away）","tenfold a. 十倍的（构词: ten + fold）"]},{"id":409,"root":"found/fund","pronounce":"/faʊnd/夫奥恩德","source":"拉丁语 fundus(底部)","meaning":"基础,地基,建立","mnemonic":"found/fund可以记成“房墩”。盖房子前要先在最下面打好地基和石墩，它们是整座房子的基础；在基础上继续向上搭建，才能把房子建立起来。所以found/fund就是“基础、地基、建立”。","mainWords":[{"word":"found","pos":"vt.","detail":"构词: 构词: found(基础,建立)<br>释义: 建立,创办","example":"例句: He founded the company. ｜ 推导: 基础 = 建立,创建"},{"word":"foundation","pos":"n.","detail":"构词: 构词: found(基础) + ation(名词后缀)<br>释义: 基础,地基","example":"例句: A solid foundation is key. ｜ 推导: 基础 + 名词化 = 地基,根基"},{"word":"fund","pos":"n.","detail":"构词: 构词: fund(found变体,基础)<br>释义: 基金,资金","example":"例句: We need more funds. ｜ 推导: 基础 = 基础资金,基金"},{"word":"fundamental","pos":"a.","detail":"构词: 构词: fund(基础) + ament + al<br>释义: 基本的","example":"例句: It's a fundamental principle. ｜ 推导: 基础 + 形容词化 = 基础的,根本的"},{"word":"refund","pos":"n./v.","detail":"构词: 构词: re(返回) + fund(资金)<br>释义: 退款","example":"例句: I want a refund. ｜ 推导: 返回 + 资金 = 退还资金,退款"},{"word":"profound","pos":"a.","detail":"构词: 构词: pro(深入) + found(基础)<br>释义: 深刻的","example":"例句: A profound understanding. ｜ 推导: 深入 + 基础 = 深入基础的,深刻的"}],"extra":["founder n. 创始人（构词: found + er）","foundational a. 基础的（构词: found + ational）","unfounded a. 无根据的（构词: un + found + ed）","funding n. 资金,拨款（构词: fund + ing）"]},{"id":410,"root":"geo","pronounce":"/dʒiːəʊ/吉衣欧","source":"希腊语 γῆ (gê)","meaning":"大地,土地","mnemonic":"geo就是“脚”。人的脚踩在地面和土地上，脚下延伸开的就是大地。所以geo就是“大地、土地”。","mainWords":[{"word":"geography","pos":"n.","detail":"构词: 构词: geo(大地) + graphy(描述)<br>释义: 地理(学)","example":"例句: I study geography at school. ｜ 推导: 大地 + 描述 = 地理学"},{"word":"geology","pos":"n.","detail":"构词: 构词: geo(大地) + logy(学科)<br>释义: 地质(学)","example":"例句: Geology studies Earth's structure. ｜ 推导: 大地 + 学科 = 地质学"},{"word":"geometry","pos":"n.","detail":"构词: 构词: geo(大地) + metry(测量)<br>释义: 几何(学)","example":"例句: Geometry originated from land measurement. ｜ 推导: 大地 + 测量 = 几何学(源于土地测量)"}],"extra":["geographer n. 地理学家（构词: geo + graph + er）","geopolitics n. 地缘政治（构词: geo + politics）","geological a. 地质的（构词: geo + logical）","geothermal a. 地热的（构词: geo + thermal）","geologist n. 地质学家（构词: geo + logist）","geocentric a. 地心的（构词: geo + centric）","geographic a. 地理的（构词: geo + graphic）","geophysics n. 地球物理学（构词: geo + physics）","geometric a. 几何的（构词: geo + metric）","geodesy n. 大地测量学（构词: geo + desy）"]},{"id":411,"root":"guard","pronounce":"/gɑːrd/格啊儿德","source":"古法语 garde","meaning":"守护,保卫,警戒","mnemonic":"guard就是“关着”。守门人把门关着并站在门口观察，是为了保护里面的人和物，同时警戒外面的危险。所以guard就是“守护、保卫、警戒”。","mainWords":[{"word":"guard","pos":"v./n.","detail":"构词: 构词: guard(守护)<br>释义: 保卫,警卫","example":"例句: The guard stood at the gate. ｜ 推导: 原始词根 = 守护者,保卫"},{"word":"safeguard","pos":"v./n.","detail":"构词: 构词: safe(安全) + guard(守护)<br>释义: 保护,保障","example":"例句: We must safeguard our rights. ｜ 推导: 安全 + 守护 = 安全保护措施"}],"extra":["guardian n. 监护人（构词: guard + ian人）","vanguard n. 先锋（构词: van前 + guard）","bodyguard n. 保镖（构词: body + guard）","rearguard n. 后卫（构词: rear + guard）","guardroom n. 警卫室（构词: guard + room）","mudguard n. 挡泥板（构词: mud + guard）","guarded a. 谨慎的（构词: guard + ed）","guardrail n. 护栏（构词: guard + rail）","unguarded a. 不设防的（构词: un + guard + ed）","regard v. 看待,注视（构词: re + gard变体）","lifeguard n. 救生员（构词: life + guard）","disregard v. 忽视（构词: dis + re + gard）","coastguard n. 海岸警卫队（构词: coast + guard）","gardener n. 园丁（构词: gard变体 + ener）"]},{"id":412,"root":"infr","pronounce":"/ɪnfrə/衣恩夫儿额","source":"拉丁语 infra(下方)","meaning":"下方,在...之下","mnemonic":"infr可以拆成小学词in＋floor的开头组合。in 是“在里面”，floor 是地板；藏进地板下面，就处在下方、在某物之下。所以infr就是“下方、在……之下”。","mainWords":[{"word":"infrastructure","pos":"n.","detail":"构词: 构词: infr(下方) + structure(结构)<br>释义: 基础设施","example":"例句: City infrastructure needs repair. ｜ 推导: 下方 + 结构 = 基础设施"},{"word":"infrared","pos":"a./n.","detail":"构词: 构词: infr(下方) + red(红色)<br>释义: 红外线(的)","example":"例句: Infrared cameras detect heat. ｜ 推导: 红色光谱下方 = 红外线"}],"extra":["infrasonic a. 次声的（构词: infr + sonic）","infrahuman a. 低于人类的（构词: infr + human）","infrasound n. 次声波（构词: infr + sound）","infraclass n. 下纲(生物)（构词: infr + class）","inferior a. 下级的,低劣的 (infer变体)","infernal a. 地狱的 (infer变体)","infraction n. 违反（构词: infr + action）","infraorbital a. 眼眶下的（构词: infr + orbital）"]},{"id":413,"root":"mass","pronounce":"/mæs/麦斯","source":"拉丁语 massa(团块)","meaning":"大量,团块","mnemonic":"以后看到mass，可以想象许多小块聚成一大团。小块数量很多，聚起后形成明显团块，所以mass就是“大量、团块”。","mainWords":[{"word":"mass","pos":"n.","detail":"构词: 构词: mass(大量)<br>释义: 大量;团块;群众","example":"例句: A mass of people gathered. ｜ 推导: 原始词根 = 大量,团块"},{"word":"massive","pos":"a.","detail":"构词: 构词: mass(大量) + ive(形容词后缀)<br>释义: 大量的;巨大的","example":"例句: A massive building stood there. ｜ 推导: 大量 + 形容词化 = 大量的,巨大的"}],"extra":["amass v. 积累,积聚（构词: a + mass）","mass-produce v. 大量生产（构词: mass + produce）","massively ad. 大量地（构词: massive + ly）","mass media n. 大众传媒（构词: mass + media）","masses n. 群众,大众（构词: mass + es）","massacre n./v. 大屠杀（构词: mass + acre）","massed a. 聚集的（构词: mass + ed）","en masse ad. 全体地（构词: en + masse）","massing n. 聚集（构词: mass + ing）","mass transit n. 公共交通（构词: mass + transit）","biomass n. 生物量（构词: bio + mass）","landmass n. 大陆（构词: land + mass）","massless a. 无质量的（构词: mass + less）","mass culture n. 大众文化（构词: mass + culture）"]},{"id":414,"root":"new","pronounce":"/njuː/恩耶乌","source":"古英语 neowe","meaning":"新,新的","mnemonic":"new本身就是我们小学学过的new。 new 就是“新的、新近的”。 所以new就是“新、新的”。","mainWords":[{"word":"new","pos":"a.","detail":"构词: 构词: new(新)<br>释义: 新的,新近的","example":"例句: I bought a new car. ｜ 推导: 原始词根 = 新的,新鲜的"},{"word":"news","pos":"n.","detail":"构词: 构词: new(新) + s(复数)<br>释义: 新闻,消息","example":"例句: Have you heard the news? ｜ 推导: 新的 + 复数 = 新消息,新闻"},{"word":"newspaper","pos":"n.","detail":"构词: 构词: news(新闻) + paper(纸)<br>释义: 报纸","example":"例句: I read the newspaper daily. ｜ 推导: 新闻 + 纸 = 刊登新闻的纸,报纸"},{"word":"renew","pos":"v.","detail":"构词: 构词: re(重新) + new(新)<br>释义: 更新,重新开始","example":"例句: Please renew your license. ｜ 推导: 重新 + 新 = 更新,续期"}],"extra":["newsy a. 多新闻的（构词: news + y）","newly ad. 新近,最近（构词: new + ly）","newish a. 稍新的（构词: new + ish）","newness n. 新,崭新（构词: new + ness）","newborn a. 新生的 n.新生儿（构词: new + born）","newest a. 最新的（构词: new + est）","newsletter n. 通讯（构词: news + letter）","renewal n. 更新,重新开始（构词: re + new + al）","newscast n. 新闻广播（构词: news + cast）","anew ad. 重新,再（构词: a + new）"]},{"id":415,"root":"org","pronounce":"/ɔːrg/奥儿格","source":"希腊语 (工作,组织)","meaning":"组织,器官","mnemonic":"org是我们学过的organization的一部分。organization就是组织；身体里的organ又是器官，器官也是身体中有组织的一部分，所以org就是“组织,器官”的意思。","mainWords":[{"word":"organ","pos":"n.","detail":"构词: 构词: org(组织) + an(名词后缀)<br>释义: 器官;机构","example":"例句: The heart is a vital organ. ｜ 推导: 组织 + 名词化 = 器官,机构"},{"word":"organic","pos":"a.","detail":"构词: 构词: org(组织) + an + ic(形容词后缀)<br>释义: 有机的;器官的","example":"例句: Organic food is healthier. ｜ 推导: 组织 + 形容词化 = 有机的,器官的"},{"word":"organism","pos":"n.","detail":"构词: 构词: org(组织) + an + ism(名词后缀)<br>释义: 生物,有机体","example":"例句: Living organisms need water. ｜ 推导: 器官 + 整体 = 生物,有机体"},{"word":"organize","pos":"v.","detail":"构词: 构词: org(组织) + an + ize(动词后缀)<br>释义: 组织,安排","example":"例句: Let's organize a meeting. ｜ 推导: 组织 + 动词化 = 组织,安排"},{"word":"organization","pos":"n.","detail":"构词: 构词: org(组织) + an + ize + ation(名词后缀)<br>释义: 组织,机构","example":"例句: The WHO is a health organization. ｜ 推导: 组织 + 动词化 + 名词化 = 组织机构"}],"extra":["reorganize v. 重组（构词: re + organize）","unorganized a. 无组织的（构词: un + organized）","organizer n. 组织者（构词: organize + er）","organizational a. 组织的（构词: org + al）"]},{"id":416,"root":"preci/preti","pronounce":"/ˈpreʃi/普儿诶诗衣","source":"拉丁语 pretium(价值)","meaning":"价值,价格","mnemonic":"preci/preti可以直接连到商品上的“¥”价格标签。标签写出的数表示价格；价格越高，通常说明人们认为这个东西越有价值。所以preci/preti就是“价值、价格”。","mainWords":[{"word":"appreciate","pos":"v.","detail":"构词: 构词: ap(向) + preci(价值) + ate<br>释义: 欣赏,感激","example":"例句: I appreciate your help. ｜ 推导: 向 + 价值 = 认可价值,欣赏"},{"word":"precious","pos":"a.","detail":"构词: 构词: preci(价值) + ous(形容词后缀)<br>释义: 珍贵的","example":"例句: Time is precious. ｜ 推导: 价值 + 形容词化 = 有价值的,珍贵的"},{"word":"price","pos":"n.","detail":"构词: 构词: pric(preci简化) + e<br>释义: 价格 v.标价","example":"例句: What's the price? ｜ 推导: 价值的直接体现 = 价格"},{"word":"priceless","pos":"a.","detail":"构词: 构词: price(价格) + less(无)<br>释义: 无价的","example":"例句: This painting is priceless. ｜ 推导: 价格 + 无 = 无法定价的,无价的"}],"extra":["appreciation n. 欣赏,感激（构词: appreciate + ion）","depreciate v. 贬值（构词: de + preci + ate）","appreciative a. 感激的（构词: appreciate + ive）","appraise v. 评估价值（构词: ap + prais）","appreciable a. 可察觉的（构词: appreciate + able）","praise v./n. 赞扬 (prais变体)","pricing n. 定价（构词: price + ing）","appraisal n. 评估（构词: appraise + al）","pricey a. 昂贵的（构词: price + y）","overpriced a. 定价过高的（构词: over + price + d）"]},{"id":417,"root":"rem","pronounce":"/rem/儿诶姆","source":"拉丁语 (停留)","meaning":"仍然,保持,剩余","mnemonic":"rem就是“仍留下”。 事情结束后仍然留下并保持的部分，就是剩余。 所以rem就是“仍然、保持、剩余”。","mainWords":[{"word":"remain","pos":"v.","detail":"构词: 构词: rem(仍然) + ain(动词后缀)<br>释义: 仍然是,剩余","example":"例句: The problem remains unsolved. ｜ 推导: 仍然 + 动词化 = 保持不变,剩余"},{"word":"remainder","pos":"n.","detail":"构词: 构词: remain(剩余) + der(名词后缀)<br>释义: 剩余物","example":"例句: The remainder of the food. ｜ 推导: 剩余 + 名词化 = 剩余的部分"},{"word":"remnant","pos":"n.","detail":"构词: 构词: rem(仍然) + n + ant(后缀)<br>释义: 剩余物 a.剩余的","example":"例句: The remnants of the old city. ｜ 推导: 仍然 + 后缀 = 遗留物,残余"},{"word":"remains","pos":"n.","detail":"构词: 构词: remain(剩余) + s(复数)<br>释义: 剩余,遗迹","example":"例句: The remains of ancient Rome. ｜ 推导: 剩余 + 复数 = 遗迹,残余物"}],"extra":["remaining a.;n. 剩余的;剩余部分（构词: remain + ing）","remembrance n. 记忆（构词: rem + embrance）","remained v. 保持,仍是（构词: remain + ed）","remanent a. 残余的（构词: rem + an + ent）","remanence n. 剩磁（构词: rem + an + ence）","remainder v. 廉价出售 (remainder名词动用)","remainderman n. 继承人（构词: remainder + man）","remnantal a. 残余的（构词: remnant + al）","remainer n. 留欧派（构词: remain + er）"]},{"id":418,"root":"respect","pronounce":"/rɪˈspekt/里斯普诶克特","source":"re(再) + spect(看)","meaning":"尊重,尊敬","mnemonic":"respect就是“瑞思拜”。瑞思拜会让人直接想到“尊重”，由这个意思还可以继续推出尊敬，所以respect就是“尊重,尊敬”的意思。","mainWords":[{"word":"respect","pos":"n./v.","detail":"构词: 构词: re(再) + spect(看)<br>释义: 尊敬,尊重","example":"例句: Show respect to your elders. ｜ 推导: 再 + 看 = 重视,尊重"},{"word":"respective","pos":"a.","detail":"构词: 构词: respect + ive(形容词后缀)<br>释义: 各自的","example":"例句: Go to your respective rooms. ｜ 推导: 尊重 + 形容词化 = 各自的,分别的"},{"word":"irrespective","pos":"a.","detail":"构词: 构词: ir(不) + respect + ive<br>释义: 不顾的","example":"例句: Irrespective of the cost. ｜ 推导: 不 + 尊重 + 形容词化 = 不考虑的"}],"extra":["respectful a. 恭敬的（构词: respect + ful）","respectfully ad. 恭敬地（构词: respectful + ly）","respectable a. 值得尊敬的（构词: respect + able）","respectably ad. 体面地（构词: respectable + ly）","disrespect n./v. 不尊重（构词: dis + respect）","disrespectful a. 无礼的（构词: dis + respectful）","self-respect n. 自尊（构词: self + respect）","respectability n. 体面（构词: respectable + ity）","respecter n. 尊重者（构词: respect + er）","respectively ad. 分别地（构词: respective + ly）"]},{"id":419,"root":"scope","pronounce":"/skoʊp/斯克欧普","source":"希腊语 σκοπέω","meaning":"看,观察","mnemonic":"scope就是游戏画面中的瞄准镜。打开 scope 后，眼睛通过镜片看目标、观察远处；镜片圈出的范围也是观察的范围。所以scope就是“看、观察”。","mainWords":[{"word":"telescope","pos":"n.","detail":"构词: 构词: tele(远) + scope(看)<br>释义: 望远镜","example":"例句: He observed stars through a telescope. ｜ 推导: 远 + 看 = 看远处的仪器,望远镜"},{"word":"microscope","pos":"n.","detail":"构词: 构词: micro(微小) + scope(看)<br>释义: 显微镜","example":"例句: Scientists use microscopes in labs. ｜ 推导: 微小 + 看 = 看微小事物的仪器"},{"word":"scope","pos":"n.","detail":"构词: 构词: scope(看,观察)<br>释义: 范围;视野","example":"例句: The scope of the project is wide. ｜ 推导: 看、观察 = 能看到的范围,视野"}],"extra":["horoscope n. 占星图（构词: horo(时间) + scope）","stethoscope n. 听诊器（构词: stetho(胸) + scope）"]},{"id":420,"root":"sem","pronounce":"/sem/瑟姆","source":"拉丁语 (相似)","meaning":"相似,一样","mnemonic":"sem与小学词 same 形近音近，只去掉 a 并改变末尾字母。same 是一样的；没有完全相同但大体接近，就是相似。所以sem就是“相似、一样”。","mainWords":[{"word":"resemble","pos":"v.","detail":"构词: 构词: re(加强) + sem(相似) + ble<br>释义: 像,类似","example":"例句: He resembles his father. ｜ 推导: 加强 + 相似 = 很像,类似"},{"word":"resemblance","pos":"n.","detail":"构词: 构词: re + sem(相似) + blance(名词后缀)<br>释义: 相似","example":"例句: There's a strong resemblance. ｜ 推导: 相似 + 名词化 = 相似性,相像"},{"word":"assemble","pos":"v.","detail":"构词: 构词: as(朝向) + sem(相同) + ble<br>释义: 集合,装配","example":"例句: Students assembled in the hall. ｜ 推导: 朝向 + 相同 = 聚到一起,集合"},{"word":"assembly","pos":"n.","detail":"构词: 构词: as + sem(相同) + bly(名词后缀)<br>释义: 集合,会议","example":"例句: The school assembly is at 9. ｜ 推导: 聚集 + 名词化 = 集会,装配"}],"extra":["semble v. 看起来像（构词: sem + ble）","similar a. 相似的（构词: simil变体 + ar）","semblance n. 外表,表象（构词: sem + blance）","similarity n. 相似性（构词: similar + ity）","dissemble v. 掩饰（构词: dis + sem + ble）","simulate v. 模拟（构词: simul变体 + ate）","simultaneous a. 同时的（构词: simul + taneous）","dissembler n. 伪君子（构词: dis + sem + bler）","reassemble v. 重新集合（构词: re + as + sem + ble）","semblable a. 相似的（构词: sem + blable）"]},{"id":421,"root":"stock/stocc","pronounce":"/stɒk/斯特奥克","source":"古英语 stocc(树干)","meaning":"树干,基础储备","mnemonic":"stock本身就是我们学过的词，意思有库存、储备。库存就是提前存下来的东西；一棵树的主干又是整棵树的基础，像树储存力量的主体，所以stock/stocc就是“树干、基础、储备”的意思。","mainWords":[{"word":"stock","pos":"n.","detail":"构词: 构词: stock(树干→基础储备)<br>释义: 库存;股票 v.储存","example":"例句: We need to stock up on food. ｜ 推导: 树干 → 基础储备 = 库存,股票"},{"word":"stocking","pos":"n.","detail":"构词: 构词: stock(树干状) + ing(名词后缀)<br>释义: 长(统)袜","example":"例句: Christmas stockings by the fireplace. ｜ 推导: 树干状包裹物 = 长筒袜"}],"extra":["stockpile n./v. 储备（构词: stock + pile）","stockroom n. 储藏室（构词: stock + room）","stockholder n. 股东（构词: stock + holder）","stocktaking n. 盘点（构词: stock + taking）","stockbroker n. 股票经纪人（构词: stock + broker）","overstock v. 库存过多（构词: over + stock）","stockmarket n. 股票市场（构词: stock + market）","understock v. 库存不足（构词: under + stock）","livestock n. 家畜（构词: live + stock）","restock v. 补充库存（构词: re + stock）","stocky a. 矮壮的（构词: stock + y）","stockist n. 存货商（构词: stock + ist）","stockade n. 栅栏（构词: stock + ade）","gunstock n. 枪托（构词: gun + stock）"]},{"id":422,"root":"turn","pronounce":"/tɜːn/特恩","source":"古英语 turnian","meaning":"转,旋转","mnemonic":"turn本身就是我们小学学过的turn。 turn 就是“转动、旋转”。 所以turn就是“转、旋转”。","mainWords":[{"word":"turn","pos":"v./n.","detail":"构词: 构词: turn(转、旋转)<br>释义: 转动,旋转","example":"例句: Turn left at the corner. ｜ 推导: 原始词根 = 转动,旋转"},{"word":"return","pos":"v./n.","detail":"构词: 构词: re(回) + turn(转)<br>释义: 返回,归还","example":"例句: Please return the book. ｜ 推导: 回 + 转 = 转回来,返回"},{"word":"overturn","pos":"v.","detail":"构词: 构词: over(翻过) + turn(转)<br>释义: 打翻,推翻","example":"例句: The boat overturned. ｜ 推导: 翻过 + 转 = 翻转过来,倾覆"},{"word":"turnover","pos":"n.","detail":"构词: 构词: turn(转) + over(结束)<br>释义: 营业额;周转","example":"例句: The company's annual turnover. ｜ 推导: 转一圈结束 = 营业额,周转"}],"extra":["turning n. 转弯处（构词: turn + ing）","turntable n. 转盘（构词: turn + table）","turner n. 车工（构词: turn + er）","returnable a. 可退回的（构词: return + able）","upturn n. 好转,回升（构词: up + turn）","turnout n. 出席人数（构词: turn + out）","downturn n. 下降（构词: down + turn）","returnee n. 归国者（构词: return + ee）"]},{"id":423,"root":"van","pronounce":"/væn/五艾恩","source":"拉丁语 vanus(空的)","meaning":"空,虚无","mnemonic":"van就是“碗”。一只碗里的食物被吃得干干净净，最后什么也没有，只剩空碗；东西从有到无，也就是消失成虚无。所以van就是“空、虚无”。","mainWords":[{"word":"vanish","pos":"vi.","detail":"构词: 构词: van(空) + ish(动词后缀,使...)<br>释义: 消失,消散","example":"例句: The magician made it vanish. ｜ 推导: 空 + 使 = 使变空,消失"},{"word":"vanity","pos":"n.","detail":"构词: 构词: van(空) + ity(名词后缀)<br>释义: 虚荣心,空虚","example":"例句: His vanity was wounded. ｜ 推导: 空 + 名词化 = 空虚感,虚荣心"},{"word":"vain","pos":"a.","detail":"构词: 构词: vain (van的变体,空的)<br>释义: 徒劳的,虚荣的","example":"例句: All our efforts were in vain. ｜ 推导: 空的 = 徒劳的,无用的;虚荣的"}],"extra":["evanescent a. 逐渐消失的（构词: e + van + escent）","vainly ad. 徒劳地（构词: vain + ly）","evanescence n. 逐渐消失（构词: e + van + escence）","vainglory n. 虚荣（构词: vain + glory）","evanesce v. 消散（构词: e + van + esce）","vanishment n. 消失（构词: vanish + ment）","vanishingly ad. 消失地（构词: vanish + ingly）","vainness n. 徒劳（构词: vain + ness）"]},{"id":424,"root":"well/wel","pronounce":"/wel/乌诶勒","source":"古英语 wel(好)","meaning":"好,充分,满意","mnemonic":"方法一： wel是单词well的缩略 well是小学一年级必考词 基本义是好 也可以表示健康的 富裕地 幸福地的意思 wel作为well的缩略 意思必然跟well完全一致 也就是好 健康的 富裕地 幸福地的意思，所以well/wel就是“好,充分,满意”的意思。 方法二： well/wel本身就是我们小学学过的well。 well 就是“好地、好啦”。 所以well/wel就是“好、充分、满意”。","mainWords":[{"word":"well","pos":"ad.","detail":"构词: 构词: well(好)<br>释义: 好地 int.好啦","example":"例句: She speaks English well. ｜ 推导: 原始词根 = 好地,充分地"},{"word":"well-known","pos":"a.","detail":"构词: 构词: well(充分地) + known(被知道的)<br>释义: 著名的","example":"例句: A well-known scientist. ｜ 推导: 充分地 + 被知道 = 众所周知的"},{"word":"welcome","pos":"v./n.","detail":"构词: 构词: wel(好意) + come(来)<br>释义: 欢迎","example":"例句: Welcome to our home! ｜ 推导: 好意 + 来 = 乐见其来,欢迎"},{"word":"welfare","pos":"n.","detail":"构词: 构词: wel(好) + fare(生活)<br>释义: 福利,幸福","example":"例句: Social welfare system. ｜ 推导: 好 + 生活 = 过得好,福利"}],"extra":["wellness n. 健康（构词: well + ness）","well-educated a. 受过良好教育的","well-being n. 幸福（构词: well + being）","well-mannered a. 有礼貌的","well-off a. 富裕的（构词: well + off）","well-meaning a. 善意的","well-to-do a. 富有的（构词: well + to do）","well-dressed a. 穿着讲究的","farewell n. 告别（构词: fare + well）","unwelcome a. 不受欢迎的（构词: un + welcome）"]},{"id":425,"root":"west","pronounce":"/west/乌诶斯特","source":"日耳曼语(西方)","meaning":"西,西方","mnemonic":"west本身就是我们小学学过的west。 west 就是“西方、向西”。 所以west就是“西、西方”。","mainWords":[{"word":"west","pos":"n./a.","detail":"构词: 构词: west(西)<br>释义: 西方 ad.向西","example":"例句: The sun sets in the west. ｜ 推导: 原始词根 = 西,西方"},{"word":"western","pos":"a.","detail":"构词: 构词: west(西) + ern(方向形容词)<br>释义: 西方的","example":"例句: Western culture is different. ｜ 推导: 西 + 方向的 = 西方的,西部的"},{"word":"northwest","pos":"n./a.","detail":"构词: 构词: north(北) + west(西)<br>释义: 西北","example":"例句: The wind comes from northwest. ｜ 推导: 北 + 西 = 西北方向"},{"word":"southwest","pos":"n./a.","detail":"构词: 构词: south(南) + west(西)<br>释义: 西南","example":"例句: They traveled to the southwest. ｜ 推导: 南 + 西 = 西南方向"}],"extra":["westward a./ad. 向西的（构词: west + ward）","westernize v. 西方化（构词: west + ern + ize）","westbound a. 西行的（构词: west + bound）","westwards ad. 向西（构词: west + wards）","westerner n. 西方人（构词: west + ern + er）","Westwood 西木(公司)（构词: west + wood）","westerly a. 西的 ad.向西（构词: west + erly）","go west 死,完蛋（构词: go + west）","wester n. 西风（构词: west + er）","Wild West 狂野西部（构词: wild + west）"]},{"id":426,"root":"whelm","pronounce":"/welm/乌诶勒姆","source":"古英语 (淹没)","meaning":"淹没,覆盖,压倒","mnemonic":"whelm就是“围了”。 洪水把四周围住并覆盖上来，就会淹没、覆盖和压倒。 所以whelm就是“淹没、覆盖、压倒”。","mainWords":[{"word":"overwhelm","pos":"v.","detail":"构词: 构词: over(在...之上) + whelm(淹没)<br>释义: 压倒,淹没","example":"例句: I was overwhelmed by emotion. ｜ 推导: 在上面 + 淹没 = 完全压倒,使不知所措"},{"word":"overwhelming","pos":"a.","detail":"构词: 构词: over + whelm + ing(形容词后缀)<br>释义: 压倒性的","example":"例句: The evidence is overwhelming. ｜ 推导: 压倒 + 形容词化 = 势不可挡的,压倒性的"}],"extra":["overwhelmingly ad. 压倒性地（构词: over + whelm + ingly）","underwhelming a. 令人失望的 (under + whelm +","overwhelmed a. 不知所措的（构词: over + whelm + ed）","overwhelmer n. 压倒者（构词: over + whelm + er）","underwhelm v. 使人失望（构词: under + whelm）","underwhelmed a. 不感兴趣的 (under + whelm +","whelming a. 淹没的（构词: whelm + ing）","overwhelmingness n. 压倒性 (overwhelming + n","whelmed a. 被淹没的（构词: whelm + ed）"]},{"id":427,"root":"wid","pronounce":"/wɪd/威德","source":"古英语 (宽广)","meaning":"广阔的,宽广的","mnemonic":"wid就是“wide”。wide会让人直接想到“广阔的”，由这个意思还可以继续推出宽广的，所以wid就是“广阔的,宽广的”的意思。","mainWords":[{"word":"wide","pos":"a.","detail":"构词: 构词: wid(广阔) + e<br>释义: 宽阔的 ad.广阔地","example":"例句: The river is very wide. ｜ 推导: 广阔 = 宽阔的,宽广的"},{"word":"widely","pos":"ad.","detail":"构词: 构词: wid(广阔) + e + ly(副词后缀)<br>释义: 广泛地","example":"例句: English is widely used. ｜ 推导: 广阔 + 副词化 = 广泛地,普遍地"},{"word":"width","pos":"n.","detail":"构词: 构词: wid(广阔) + th(名词后缀)<br>释义: 宽度,广阔","example":"例句: The width of the road is 10m. ｜ 推导: 广阔 + 名词化 = 宽度,广度"},{"word":"worldwide","pos":"a.","detail":"构词: 构词: world(世界) + wid(广阔) + e<br>释义: 全世界的","example":"例句: It's a worldwide problem. ｜ 推导: 世界 + 广阔 = 世界范围的,全球的"},{"word":"widespread","pos":"a.","detail":"构词: 构词: wid(广阔) + e + spread(传播)<br>释义: 分布广的","example":"例句: The disease is widespread. ｜ 推导: 广阔 + 传播 = 广泛分布的"},{"word":"bandwidth","pos":"n.","detail":"构词: 构词: band(带) + wid(宽) + th<br>释义: 带宽","example":"例句: We need more bandwidth. ｜ 推导: 带 + 宽 + 名词化 = 带宽,频宽"}],"extra":["widen v. 加宽,变宽（构词: wid + en）","statewide a. 全州的（构词: state + wid + e）","widening n. 加宽（构词: wid + en + ing）","nationwide a. 全国的（构词: nation + wid + e）","citywide a. 全市的（构词: city + wid + e）","wideness n. 宽阔（构词: wid + ness）"]},{"id":428,"root":"allow","pronounce":"/əˈlaʊ/额勒奥","source":"古法语 alouer","meaning":"允许,准许","mnemonic":"ALLOW可以记成All Lines Lift, Open Way。All Lines是所有拦路的横杆，Lift是抬起来，Open Way是把道路打开。横杆抬起、道路打开以后，人就可以通过，说明已经得到允许和准许。所以allow就是“允许、准许”的意思。","mainWords":[{"word":"allow","pos":"vt.","detail":"构词: 构词: all(全部) + ow(欧,OK)<br>释义: 允许,准许","example":"例句: Please allow me to explain. ｜ 推导: 全部 + OK = 允许,准许"},{"word":"allowance","pos":"n.","detail":"构词: 构词: allow(允许) + ance(名词后缀)<br>释义: 津贴;零用钱","example":"例句: He gets a monthly allowance. ｜ 推导: 允许使用的金额 = 津贴,零用钱"}],"extra":["allowable a. 允许的,准许的（构词: allow + able）","allowedly ad. 公认地（构词: allow + ed + ly）","disallow v. 不允许,否决（构词: dis + allow）","disallowance n. 不许可（构词: dis + allow + ance）","unallowed a. 不被允许的（构词: un + allow + ed）","reallow v. 再次允许（构词: re + allow）","allowing a. 允许的（构词: allow + ing）","overallow v. 过度允许（构词: over + allow）","allowed a. 被允许的（构词: allow + ed）","preallow v. 预先允许（构词: pre + allow）"]},{"id":429,"root":"astr","pronounce":"/æstr/艾斯特儿","source":"希腊语 Astraeus","meaning":"星,星星","mnemonic":"方法一： astr是我们小学学过的词astronaut的一部分。 astronaut 就是“太空人、宇航员”。 在这个词里，负责表达“星”这一层意思的部分就是astr。 所以astr就是“星、星星”。 方法二： astr和小学词star使用的是同样四个字母，只是排列顺序换了一下。把 astr 的字母重新排成 star，就直接得到“星星”。所以astr就是“星、星星”。","mainWords":[{"word":"astronaut","pos":"n.","detail":"构词: 构词: astr(星) + o + naut(航行者)<br>释义: 太空人,宇航员","example":"例句: The astronaut walked on the moon. ｜ 推导: 星 + 航行者 = 星际航行者,宇航员"},{"word":"astronomy","pos":"n.","detail":"构词: 构词: astr(星) + o + nomy(学科)<br>释义: 天文学","example":"例句: She studies astronomy at university. ｜ 推导: 星 + 学科 = 研究星星的学科,天文学"},{"word":"disaster","pos":"n.","detail":"构词: 构词: dis(否定) + aster(星的变体)<br>释义: 灾难,大祸","example":"例句: The earthquake was a disaster. ｜ 推导: 否定 + 星 = 星位不正,凶兆,灾难"},{"word":"disastrous","pos":"a.","detail":"构词: 构词: dis(否定) + astr + ous(形容词后缀)<br>释义: 灾难性的","example":"例句: The result was disastrous. ｜ 推导: 否定 + 星 + 形容词化 = 灾难性的"},{"word":"catastrophe","pos":"n.","detail":"构词: 构词: cata(向下) + strophe(星转)<br>释义: 大灾难","example":"例句: It was a complete catastrophe. ｜ 推导: 向下 + 星转 = 星位逆转,大灾难"}],"extra":["astrology n. 占星学（构词: astr + o + logy）","astral a. 星的,星际的（构词: astr + al）","asteroid n. 小行星（构词: aster + oid）","astronomer n. 天文学家（构词: astr + o + nom + er）"]},{"id":430,"root":"dent","pronounce":"/dent/德诶恩特","source":"拉丁语 (牙⻮)","meaning":"牙⻮","mnemonic":"方法一：dent就是“邓的”。邓的就是邓氏鱼的，也就是邓氏鱼最显著的特征，邓氏鱼最独特之处在于它的“牙齿”——头骨骨甲直接延伸出的骨质刃片，锋利如铡刀，且能终生生长、自行磨锐，始终维持切割力。它以此轻松咬碎硬壳猎物。此外，它体长5–11米，重4–6吨，咬合力高达5吨，头颈覆有厚重骨甲，但所有优势最终都服务于那副独一无二的“铡刀式”口器。所以邓氏鱼最显著的特征就是他的牙齿。所以dent就是“牙齿”。   方法二：dent是生活熟词dentist中的一部分。\ndentist就是牙医。-ist是表示从事某种工作或专业的人的常见结尾；去掉-ist以后，前面的dent就是牙医每天检查和治疗的对象，也就是牙齿。\n所以dent就是“牙齿；牙齿造成的齿状痕迹”的意思。","mainWords":[{"word":"dental","pos":"a.","detail":"构词: 构词: dent(牙⻮) + al(形容词后缀)<br>释义: 牙⻮的,牙科的","example":"例句: I need dental care. ｜ 推导: 牙⻮ + 形容词化 = 牙⻮的,牙科的"},{"word":"dentist","pos":"n.","detail":"构词: 构词: dent(牙⻮) + ist(从业者后缀)<br>释义: 牙医","example":"例句: I'm going to the dentist. ｜ 推导: 牙⻮ + 从业者 = 牙科医生"}],"extra":["dentistry n. 牙科学（构词: dentist + ry）","dentifrice n. 牙膏（构词: dent + i + frice）","denture n. 假牙（构词: dent + ure）","rodent n. 啮⻮动物（构词: rod(咬) + dent）","dentate a. 有⻮的（构词: dent + ate）","dentin n. 牙本质（构词: dent + in）","dentine n. 牙质（构词: dent + ine）","dentinal a. 牙本质的（构词: dentin + al）","dentiform a. ⻮状的（构词: dent + i + form）","orthodontics n. 正畸学（构词: ortho + dont + ics）","interdental a. 牙⻮间的（构词: inter + dent + al）","indent v. 缩进（构词: in + dent）","edentate a. 无⻮的（构词: e(无) + dent + ate）"]},{"id":431,"root":"direct","pronounce":"/dɪˈrekt/迪儿诶克特","source":"拉丁语 directus","meaning":"笔直对准,指引","mnemonic":"以后看到direct，可以直接想象路牌上一支笔直对准目标的箭头。箭头本身没有弯曲，说明方向笔直；箭头又告诉人应该往哪里走，所以还能表示指引。所以direct就是“笔直对准、指引”。","mainWords":[{"word":"direct","pos":"a.","detail":"构词: 构词: direct(笔直对准)<br>释义: 直接的 v.指导","example":"例句: Direct the team to success. ｜ 推导: 笔直对准 = 直接的;指导"},{"word":"direction","pos":"n.","detail":"构词: 构词: direct + ion(行为结果)<br>释义: 方向,指令","example":"例句: Follow the direction carefully. ｜ 推导: 对准 + 结果 = 方向,指示"},{"word":"directly","pos":"ad.","detail":"构词: 构词: direct + ly(副词后缀)<br>释义: 直接地,立即","example":"例句: Go directly to the office. ｜ 推导: 笔直 + 副词化 = 径直地,立即"},{"word":"director","pos":"n.","detail":"构词: 构词: direct + or(执行者)<br>释义: 主任,导演","example":"例句: The director leads the team. ｜ 推导: 指引 + 人 = 指导者,导演"},{"word":"directory","pos":"n.","detail":"构词: 构词: direct + ory(场所/工具)<br>释义: 名录,号码簿","example":"例句: Check the phone directory. ｜ 推导: 指引 + 工具 = 提供指引的名录"}],"extra":["indirect a. 间接的（构词: in + direct）","directive n. 指令（构词: direct + ive）","redirect v. 重新定向（构词: re + direct）","directional a. 方向的（构词: direction + al）"]},{"id":432,"root":"-es-/-sent-","pronounce":"/es/诶斯","source":"拉丁语 esse","meaning":"存在,是","mnemonic":"方法一： es与小学词is只把中间元音 e 换成了 i，字母和读音都很接近。is 就是“是”，说一个东西“是”在这里，也说明它真实存在；sent是同一词根的另一种展开形式。所以es/sent就是“存在、是”。 方法二： es/sent是我们小学学过的词present的一部分。 present 就是“在场的、存在的”。 一个人 present，说明他就在这里、真实存在。 所以es/sent就是“存在、是”。","mainWords":[{"word":"essential","pos":"a.","detail":"构词: 构词: es(s)(存在) + ential(形容词后缀)<br>释义: 本质的;必需的","example":"例句: Water is essential for life. ｜ 推导: 存在 + 形容词化 = 本质上存在的,必需的"},{"word":"essence","pos":"n.","detail":"构词: 构词: es(s)(存在) + ence(名词后缀)<br>释义: 本质;精华","example":"例句: The essence of the matter is trust. ｜ 推导: 存在 + 名词化 = 存在的核心,本质"},{"word":"presence","pos":"n.","detail":"构词: 构词: pre(前) + s + ence<br>释义: 在场;存在","example":"例句: Your presence is requested. ｜ 推导: 在前 + 存在 + 名词化 = 在场,出席"},{"word":"absence","pos":"n.","detail":"构词: 构词: ab(离开) + s + ence<br>释义: 缺席;缺乏","example":"例句: His absence was noticed. ｜ 推导: 离开 + 存在 + 名词化 = 不在场,缺席"},{"word":"absent","pos":"a.","detail":"构词: 构词: ab(离开) + s + ent(形容词后缀)<br>释义: 缺席的;心不在焉的","example":"例句: He was absent from class. ｜ 推导: 离开 + 存在 + 形容词化 = 不在的,缺席的"},{"word":"present","pos":"a.","detail":"构词: 构词: pre(前) + s + ent<br>释义: 在场的;当前的","example":"例句: All members were present. ｜ 推导: 在前 + 存在 + 形容词化 = 在场的,当前的"}],"extra":["essentially ad. 本质上（构词: essential + ly）","absentee n. 缺席者（构词: absent + ee）","presenter n. 主持人（构词: present + er）","omnipresent a. 无所不在的（构词: omni + present）","representation n. 代表（构词: re + present + ation）","presentable a. 像样的（构词: present + able）"]},{"id":433,"root":"excel","pronounce":"/ɪkˈsel/衣克瑟勒","source":"拉丁语 (超越)","meaning":"超越,卓越","mnemonic":"方法一：excel就是“赢可赛哦”。 比赛赢了并超过别人，就体现超越和卓越。 所以excel就是“超越、卓越”。   方法二：我们平时用的微软的结构化数据处理软件就叫excel，当年微软首创这个牛逼的东西，命名为excel就是觉得天下无敌，能超越卓越于一切同行。","mainWords":[{"word":"excel","pos":"v.","detail":"构词: 构词: excel(超越)<br>释义: 胜过,擅长","example":"例句: She excels at mathematics. ｜ 推导: 词根即单词 = 超越,擅长"},{"word":"excellent","pos":"a.","detail":"构词: 构词: excel(卓越) + ent(形容词后缀)<br>释义: 卓越的,极好的","example":"例句: The food was excellent. ｜ 推导: 卓越 + 形容词化 = 卓越的,极好的"}],"extra":["excellence n. 卓越,优秀（构词: excel + ence）","superexcellent a. 极其卓越的（构词: super + excel）","excellently ad. 极好地（构词: excel + ent + ly）","unexcelled a. 无与伦比的（构词: un + excel + ed）","excelling a. 擅长的（构词: excel + ing）","excel-like a. 类似Excel的（构词: excel + like）","excelled v. 超越了（构词: excel + ed）","exceller n. 优秀者（构词: excel + er）","excellency n. 阁下(尊称)（构词: excel + ency）","pre-excel v. 预先超越（构词: pre + excel）"]},{"id":434,"root":"excite","pronounce":"/ɪkˈsaɪt/衣克斯爱特","source":"音译联想","meaning":"刺激,激动,兴奋","mnemonic":"excite就是“一开赛”。比赛一开始，哨声、欢呼声和快速变化的场面会不断刺激观众，让人立刻激动、兴奋起来。所以excite就是“刺激、激动、兴奋”。","mainWords":[{"word":"excite","pos":"v.","detail":"构词: 构词: excite(激动)<br>释义: 刺激,使激动","example":"例句: The news excited everyone. ｜ 推导: 原始词根 = 刺激,使激动"},{"word":"exciting","pos":"a.","detail":"构词: 构词: excite(激动) + ing(形容词后缀)<br>释义: 令人兴奋的","example":"例句: It was an exciting game. ｜ 推导: 激动 + 令人...的 = 令人兴奋的"},{"word":"excitement","pos":"n.","detail":"构词: 构词: excite(激动) + ment(名词后缀)<br>释义: 兴奋,激动","example":"例句: I felt excitement in the air. ｜ 推导: 激动 + 名词化 = 兴奋,激动(状态)"}],"extra":["excited a. 激动的,兴奋的（构词: excite + ed）","excitation n. 激发,刺激（构词: excite + ation）","excitedly ad. 激动地（构词: excited + ly）","unexciting a. 不令人兴奋的（构词: un + exciting）","excitable a. 易激动的（构词: excite + able）","overexcite v. 过度兴奋（构词: over + excite）","exciter n. 刺激物（构词: excite + er）","excitability n. 兴奋性（构词: excite + ability）"]},{"id":435,"root":"fortune","pronounce":"/ˈfɔːtʃən/福吃额恩","source":"拉丁语 Fortuna","meaning":"财富,运气,命运","mnemonic":"方法一： 以后看到fortune，可以直接想到游乐场或节目中的“幸运转盘”。转盘有时停在钱袋上，得到财富；有时停在幸运格，得到好运；落在哪一格又像由命运决定。所以fortune就是“财富、运气、命运”。 方法二： fortune就是“富运”。 财富和运气会共同改变一个人的人生走向，所以还能联系到命运。 所以fortune就是“财富、运气、命运”。","mainWords":[{"word":"fortune","pos":"n.","detail":"构词: 构词: fortune(富趁)<br>释义: 财富;运气","example":"例句: He made a fortune in business. ｜ 推导: 富+趁 = 财富,好运"},{"word":"fortunate","pos":"a.","detail":"构词: 构词: fortun(运气) + ate(形容词后缀)<br>释义: 幸运的","example":"例句: We are fortunate to have you. ｜ 推导: 运气 + 形容词化 = 幸运的"},{"word":"misfortune","pos":"n.","detail":"构词: 构词: mis(坏) + fortune(运气)<br>释义: 不幸,灾祸","example":"例句: She suffered many misfortunes. ｜ 推导: 坏 + 运气 = 厄运,不幸"},{"word":"unfortunately","pos":"ad.","detail":"构词: 构词: un(不) + fortunate + ly(副词)<br>释义: 不幸地","example":"例句: Unfortunately, it rained all day. ｜ 推导: 不 + 幸运地 = 不幸地,遗憾地"}],"extra":["fortunately ad. 幸运地（构词: fortunate + ly）","fortuneless a. 无财产的（构词: fortune + less）","unfortunate a. 不幸的（构词: un + fortunate）","fortune-cookie n. 幸运饼（构词: fortune + cookie）","fortune-teller n. 算命者（构词: fortune + teller）","misfortunate a. 不幸的（构词: mis + fortunate）","ill-fortune n. 厄运（构词: ill + fortune）","fortunes n. 命运(复数)（构词: fortune + s）","fortuned a. 有财富的（构词: fortune + ed）","fortune-hunter n. 淘金者（构词: fortune + hunter）"]},{"id":436,"root":"gle","pronounce":"/gəl/格勒","source":"拉丁语 (⻆)","meaning":"⻆,⻆度","mnemonic":"gle完整出现在我们学过的angle里。angle就是角、角度，去掉前面的an以后留下gle，所以gle就是“⻆,⻆度”的意思。","mainWords":[{"word":"angle","pos":"n.","detail":"构词: 构词: an(加强) + gle(⻆)<br>释义: ⻆,⻆度","example":"例句: View it from a different angle. ｜ 推导: 加强 + ⻆ = ⻆,⻆度,视⻆"},{"word":"triangle","pos":"n.","detail":"构词: 构词: tri(三) + angle(⻆)<br>释义: 三⻆形","example":"例句: Draw a triangle on the paper. ｜ 推导: 三 + ⻆ = 三个⻆的图形,三⻆形"},{"word":"rectangle","pos":"n.","detail":"构词: 构词: rect(直) + angle(⻆)<br>释义: 矩形,长方形","example":"例句: The table is a rectangle. ｜ 推导: 直 + ⻆ = 直⻆构成的图形,矩形"}],"extra":["angular a. 有⻆的,棱⻆分明的（构词: angle + ar）","octagon n. 八⻆形（构词: octa(八) + gon(⻆)）","triangular a. 三⻆形的（构词: triangle + ar）","rectangular a. 矩形的（构词: rectangle + ar）","pentagon n. 五⻆形（构词: penta(五) + gon(⻆)）","hexagon n. 六⻆形（构词: hexa(六) + gon(⻆)）","angled a. 成⻆度的（构词: angle + d）","acute angle 锐⻆（构词: acute + angle）","right angle 直⻆（构词: right + angle）","obtuse angle 钝⻆（构词: obtuse + angle）"]},{"id":437,"root":"herd","pronounce":"/hɜːrd/赫额儿德","source":"古英语 (群集)","meaning":"聚集成群,放牧","mnemonic":"herd就是“合的”。 牛羊合在一起形成一群，再由人带着吃草，就是聚集成群和放牧。 所以herd就是“聚集成群、放牧”。","mainWords":[{"word":"herd","pos":"n.","detail":"构词: 构词: herd(聚集成群)<br>释义: 兽群 v.放牧","example":"例句: A herd of cattle was grazing. ｜ 推导: 原始词根 = 聚集的群体;放牧行为"},{"word":"shepherd","pos":"n.","detail":"构词: 构词: shep(sheep羊) + herd(放牧)<br>释义: 牧羊人","example":"例句: The shepherd led his flock. ｜ 推导: 羊 + 放牧 = 放羊的人,牧羊人"}],"extra":["herder n. 牧人（构词: herd + er）","shepherdess n. 牧羊女（构词: shepherd + ess）","herdsman n. 牧人（构词: herd + s + man）","sheepherder n. 牧羊人（构词: sheep + herd + er）","cowherd n. 牧牛人（构词: cow + herd）","oxherd n. 牧牛人（构词: ox + herd）","goatherd n. 牧羊人（构词: goat + herd）","swineherd n. 养猪人（构词: swine + herd）","herding n. 放牧（构词: herd + ing）","thundering herd 雷鸣般的兽群","herd instinct 群体本能","herd mentality 从众心理"]},{"id":438,"root":"hold","pronounce":"/hoʊld/赫欧勒德","source":"h(合) + old(握的)","meaning":"握住,保持","mnemonic":"hold本身就是我们小学学过的hold。 hold 就是“握住、保持、船舱”。 所以hold就是“握住、保持”。","mainWords":[{"word":"hold","pos":"v.","detail":"构词: 构词: hold(握住)<br>释义: 握住,保持 n.船舱","example":"例句: Hold my hand, please. ｜ 推导: 合握 = 握住,保持"},{"word":"holder","pos":"n.","detail":"构词: 构词: hold(持有) + er(名词后缀)<br>释义: 持有者,支架","example":"例句: He is a ticket holder. ｜ 推导: 持有 + 者 = 持有者,容器"},{"word":"household","pos":"n.","detail":"构词: 构词: house(房子) + hold(持有)<br>释义: 家庭 a.家庭的","example":"例句: This is a household item. ｜ 推导: 房子 + 持有 = 持家的,家庭的"},{"word":"uphold","pos":"vt.","detail":"构词: 构词: up(向上) + hold(保持)<br>释义: 支持,坚持","example":"例句: We must uphold the law. ｜ 推导: 向上 + 保持 = 支撑,支持"},{"word":"withhold","pos":"vt.","detail":"构词: 构词: with(向后) + hold(握住)<br>释义: 拒给,保留","example":"例句: Don't withhold information. ｜ 推导: 向后 + 握住 = 扣留,拒绝给予"},{"word":"behold","pos":"v.","detail":"构词: 构词: be(存在) + hold(保持)<br>释义: 看,注视","example":"例句: Behold the beauty of nature. ｜ 推导: 使 + 保持(在眼中) = 注视,看"}],"extra":["holding n. 持有物（构词: hold + ing）","handhold n. 把手（构词: hand + hold）","freehold n. 自由保有（构词: free + hold）","ahold n./ad. 抓住,握住（构词: a + hold）"]},{"id":439,"root":"joy","pronounce":"/dʒɔɪ/吉奥伊","source":"古法语 joie","meaning":"快乐,欢乐","mnemonic":"JOY可以记成Jump Out, Yell。Jump Out就是高兴得跳起来，Yell就是大声欢呼。一个人快乐到又跳又喊，说明他心里充满欢乐和喜悦。所以joy就是“快乐、欢乐、喜悦”的意思。","mainWords":[{"word":"joy","pos":"n.","detail":"构词: 构词: joy(快乐)<br>释义: 欢乐,喜悦","example":"例句: The birth brought them great joy. ｜ 推导: 原始词根 = 快乐,欢乐"},{"word":"enjoy","pos":"vt.","detail":"构词: 构词: en(进入) + joy(快乐)<br>释义: 享受,欣赏","example":"例句: I really enjoy reading books. ｜ 推导: 进入 + 快乐 = 享受,欣赏"}],"extra":["joyful a. 快乐的（构词: joy + ful）","rejoice v. 欢欣（构词: re + joi + ce）","joyless a. 无乐趣的（构词: joy + less）","joyride n. 兜风（构词: joy + ride）","joyous a. 充满快乐的（构词: joy + ous）","joystick n. 操纵杆（构词: joy + stick）","enjoyable a. 愉快的（构词: en + joy + able）","enjoying a. 享受的（构词: en + joy + ing）","enjoyment n. 享受（构词: en + joy + ment）","joyfully ad. 快乐地（构词: joy + ful + ly）","overjoyed a. 欣喜若狂的（构词: over + joy + ed）","unjoyful a. 不快乐的（构词: un + joy + ful）","killjoy n. 扫兴的人（构词: kill + joy）","enjoyer n. 享受者（构词: en + joy + er）"]},{"id":440,"root":"more","pronounce":"/ ":"n.","detail":"构词: 构词: over+pass<br>释义: 天桥","example":"例句: pedestrian overpass ｜ 推导: 从上方通过"},{"word":"compass","pos":"n.","detail":"构词: 构词: com+pass<br>释义: 指南针","example":"例句: use compass ｜ 推导: 帮助通过(导航)"}],"extra":[]},{"id":442,"root":"sci","pronounce":"/saɪ/斯爱","source":"拉丁语 scire (知道)","meaning":"知,认识,知识","mnemonic":"sci是我们小学学过的词science的一部分。 science 就是“科学”。 科学就是把人认识到的知识系统整理出来。 所以sci就是“知、认识、知识”。","mainWords":[{"word":"science","pos":"n.","detail":"构词: 构词: sci(知识) + ence(名词后缀)<br>释义: 科学,学科","example":"例句: Science is based on facts. ｜ 推导: 知识 + 名词化 = 系统的知识,科学"},{"word":"scientific","pos":"a.","detail":"构词: 构词: sci(知识) + ent + ific(形容词后缀)<br>释义: 科学的","example":"例句: Use scientific methods. ｜ 推导: 知识 + 形容词化 = 科学的,系统的"},{"word":"scientist","pos":"n.","detail":"构词: 构词: sci(知识) + ent + ist(人)<br>释义: 科学家","example":"例句: She is a famous scientist. ｜ 推导: 知识 + 从事...的人 = 科学家"},{"word":"conscious","pos":"a.","detail":"构词: 构词: con(加强) + sci(认识) + ous(形容词后缀)<br>释义: 意识到的","example":"例句: Be conscious of your actions. ｜ 推导: 加强 + 认识 = 有意识的,自觉的"},{"word":"conscience","pos":"n.","detail":"构词: 构词: con(共同) + sci(知) + ence(名词后缀)<br>释义: 良心,良知","example":"例句: Follow your conscience. ｜ 推导: 共同 + 知道 = 内心共知的道德,良心"},{"word":"conscientious","pos":"a.","detail":"构词: 构词: con + sci + ent + ious(充满...的)<br>释义: 认真的","example":"例句: She is very conscientious. ｜ 推导: 充满良知的 = 认真的,尽责的"}],"extra":["consciously ad. 有意识地（构词: con + sci + ously）","scientifically ad. 科学地（构词: scientific + ally）","unconscious a. 无意识的（构词: un + con + sci + ous）","subconscious a. 潜意识的 (sub + con + sci + ou","omniscient a. 全知的（构词: omni + sci + ent）","neuroscience n. 神经科学（构词: neuro + sci + ence）","prescience n. 预知（构词: pre + sci + ence）","bioscience n. 生物科学（构词: bio + sci + ence）","consciousness n. 意识（构词: con + sci + ousness）","conscientiously ad. 认真地 (con + sci + entiousl"]},{"id":443,"root":"sen","pronounce":"/sen/瑟恩","source":"拉丁语 senex (老人)","meaning":"老,年长,资深","mnemonic":"sen就是“先人”。 年龄更大、经验更多的先人，通常更年长和资深。 所以sen就是“老、年长、资深”。","mainWords":[{"word":"senate","pos":"n.","detail":"构词: 构词: sen(老) + ate(集体名词后缀)<br>释义: 参议院,上院","example":"例句: The senate passed the bill. ｜ 推导: 老人 + 集体 = 长者议会,参议院"},{"word":"senator","pos":"n.","detail":"构词: 构词: senat(参议院) + or(人)<br>释义: 参议员","example":"例句: She is a state senator. ｜ 推导: 参议院 + 人 = 参议院成员"},{"word":"senior","pos":"a.","detail":"构词: 构词: sen(老) + ior(比较级后缀)<br>释义: 年长的;资深的","example":"例句: He is a senior manager. ｜ 推导: 老 + 比较级 = 更年长的,资深的"}],"extra":["seniority n. 资历,年资（构词: senior + ity）","senatorial a. 参议院的（构词: senator + ial）","senile a. 老年的,衰老的（构词: sen + ile）","sir n. 先生 (sen的缩写形式)","senility n. 老年,衰老（构词: senil + ity）","sire n. 陛下;父亲 (sen的变体)","senescent a. 变老的（构词: sen + escent）","senescence n. 衰老过程（构词: sen + escence）"]},{"id":444,"root":"sent-/sens-","pronounce":"/sent/瑟恩特；/sens/瑟恩斯","source":"拉丁语 sentire","meaning":"感觉,感知","mnemonic":"方法一： sens/sent的核心声音可以记成“身子”。眼、耳、鼻和皮肤都长在身子上，外界变化传到身子，就会形成感觉和感知；sent 是同一词根的近形变体。所以sent/sens就是“感觉、感知”。 方法二： sent-/sens就是“身心感受”。 内心接收外界信息后形成感受，就是感觉和感知。 所以sent-/sens就是“感觉、感知”。","mainWords":[{"word":"sense","pos":"n.","detail":"构词: 构词: sens(感觉) + e<br>释义: 感觉;意义","example":"例句: It makes sense to me. ｜ 推导: 感觉 = 感官感知,理解"},{"word":"sensitive","pos":"a.","detail":"构词: 构词: sens + itive(形容词后缀)<br>释义: 敏感的","example":"例句: She is sensitive to criticism. ｜ 推导: 感觉 + 形容词化 = 容易感觉到的,敏感的"},{"word":"sensible","pos":"a.","detail":"构词: 构词: sens + ible(能...的)<br>释义: 明智的;可感知的","example":"例句: Be sensible about money. ｜ 推导: 感觉 + 能够的 = 有感知力的,明智的"},{"word":"sensation","pos":"n.","detail":"构词: 构词: sens + ation(名词后缀)<br>释义: 感觉;轰动","example":"例句: The news caused a sensation. ｜ 推导: 感觉 + 名词化 = 感觉;引起强烈感觉的事"},{"word":"sentiment","pos":"n.","detail":"构词: 构词: sent + iment(名词后缀)<br>释义: 情感;情绪","example":"例句: Public sentiment is changing. ｜ 推导: 感觉 + 名词化 = 内心的感觉,情感"},{"word":"consensus","pos":"n.","detail":"构词: 构词: con(共同) + sens + us<br>释义: 共识;一致","example":"例句: We reached a consensus. ｜ 推导: 共同 + 感觉 = 共同的感觉,共识"},{"word":"nonsense","pos":"n.","detail":"构词: 构词: non(无) + sense< "pronounce":"/mɑːr/姆啊儿","source":"拉丁语 mare (海)","meaning":"海,海洋","mnemonic":"mar就是“码儿”，也就是码头。码头一定建在sea边，船从码头出发进入海洋，所以以后看到mar就想到海和海洋。所以mar就是“海、海洋”的意思。","mainWords":[{"word":"marine","pos":"a.","detail":"构词: 构词: mar(海) + ine(形容词后缀)<br>释义: 海的,海事的","example":"例句: Marine life is diverse. ｜ 推导: 海 + 形容词化 = 海洋的,海事的"},{"word":"submarine","pos":"n.","detail":"构词: 构词: sub(下) + mar(海) + ine<br>释义: 潜水艇","example":"例句: The submarine dived deep. ｜ 推导: 下 + 海 + 名词化 = 海下的船,潜艇"},{"word":"maritime","pos":"a.","detail":"构词: 构词: mar(海) + itime(形容词后缀)<br>释义: 海的,航海的","example":"例句: Maritime trade is important. ｜ 推导: 海 + 形容词化 = 海事的,航海的"}],"extra":["mariner n. 水手,海员（构词: mar + iner）","submariner n. 潜艇员（构词: sub + mar + iner）","marina n. 小船坞,游艇码头（构词: mar + ina）","transmarine a. 海外的（构词: trans + mar）","mermaid n. 美人鱼（构词: mer(mar) + maid）","mariculture n. 海水养殖（构词: mar + culture）","ultramarine a. 深蓝色的（构词: ultra + mar）","marinade n. 腌泡汁（构词: mar + inade）","aquamarine n. 海蓝宝石（构词: aqua + mar）","mare n. 海(拉丁语原形)（构词: mar + e）"]},{"id":469,"root":"musc","pronounce":"/mʌsk/姆阿斯克","source":"拉丁语 musculus","meaning":"肌肉","mnemonic":"musc就是“马斯克 跟 马斯克 的名字 Musk 同源”。马斯克 跟 马斯克 的名字 Musk 同源 马斯克 就是那个想要带你上天的 肌肉男 年轻的 马斯克 也是一身腱子肉的肌肉男的典范 所以我们不要忘记 马斯克 的名字 也就是那个想要带你上天的 肌肉男 Musc 马斯克 就是 肌肉 的意思。所以musc就是“肌肉”的意思。","mainWords":[{"word":"muscle","pos":"n.","detail":"构词: 构词: musc(肌肉) + le(名词后缀)<br>释义: 肌肉,体力","example":"例句: Exercise builds muscle. ｜ 推导: 肌肉 + 名词化 = 肌肉,体力"},{"word":"muscular","pos":"a.","detail":"构词: 构词: musc(肌肉) + ular(形容词后缀)<br>释义: 肌肉发达的","example":"例句: He has a muscular build. ｜ 推导: 肌肉 + 形容词化 = 肌肉发达的"}],"extra":["muscly a. 多肌肉的（构词: musc + ly）","intramuscular a. 肌肉内的（构词: intra + musc）","muscularity n. 肌肉发达（构词: musc + ularity）","intermuscular a. 肌肉间的（构词: inter + musc）","musculature n. 肌肉系统（构词: musc + ulature）","neuromuscular a. 神经肌肉的（构词: neuro + musc）","muscleman n. 肌肉男（构词: musc + le + man）","cardiovascular a. 心血管的（构词: cardio + vascular）","muscled a. 有肌肉的（构词: musc + led）","musculocutaneous a. 肌皮的 (musc + cutaneou","muscling n. 肌肉运动（构词: musc + ling）","demuscle v. 去除肌肉（构词: de + musc + le）","musculoskeletal a. 肌⻣的（构词: musc + skeletal）","muscularly ad. 肌肉地（构词: musc + ularly）"]},{"id":470,"root":"oper","pronounce":"/ˈɒpər/奥珀儿","source":"拉丁语 opera (工作)","meaning":"工作,操作","mnemonic":"oper就是“我跑”。机器一开始跑起来，就是开始工作和运转；人让机器按步骤跑，也是在进行操作。所以oper就是“工作、操作”。","mainWords":[{"word":"operate","pos":"v.","detail":"构词: 构词: oper(工作) + ate(动词后缀)<br>释义: 操作,手术","example":"例句: The doctor will operate tomorrow. ｜ 推导: 工作 + 动词化 = 操作,运行,手术"},{"word":"operation","pos":"n.","detail":"构词: 构词: oper(工作) + ation(名词后缀)<br>释义: 操作,手术","example":"例句: The operation was successful. ｜ 推导: 工作 + 名词化 = 操作行为,手术"},{"word":"operator","pos":"n.","detail":"构词: 构词: oper(工作) + ator(人)<br>释义: 操作员","example":"例句: The operator answered the phone. ｜ 推导: 工作 + 人 = 操作工作的人"},{"word":"cooperate","pos":"v.","detail":"构词: 构词: co(共同) + oper(工作) + ate<br>释义: 合作,协作","example":"例句: We need to cooperate better. ｜ 推导: 共同 + 工作 = 一起工作,合作"},{"word":"cooperative","pos":"a.","detail":"构词: 构词: co + oper + ative(形容词后缀)<br>释义: 合作的","example":"例句: She has a cooperative attitude. ｜ 推导: 共同工作的 = 合作的,协作的"},{"word":"operational","pos":"a.","detail":"构词: 构词: oper + ation + al(形容词后缀)<br>释义: 操作的","example":"例句: The system is fully operational. ｜ 推导: 操作的 = 运转的,可操作的"}],"extra":["operative a. 运行的 n.技工（构词: oper + ative）","inoperable a. 不能手术的（构词: in + oper）","cooperation n. 合作（构词: co + oper + ation）","operand n. 操作数（构词: oper + and）","operable a. 可操作的（构词: oper + able）","operating a. 操作的（构词: oper + ating）","opera n. 歌剧（构词: oper + a）","co-op n. 合作社（构词: co + op）"]},{"id":471,"root":"pass (pati/passus)","pronounce":"/pæs/派斯","source":"拉丁语 pati (忍受)","meaning":"忍受,承受,经历","mnemonic":"pass (pati/passus)本身就是我们小学学过的pass。pass是通过、经过；一个人从困难中经过，就要忍受、承受并亲身经历它，所以pass (pati/passus)就是“忍受,承受,经历”的意思。","mainWords":[{"word":"passion","pos":"n.","detail":"构词: 构词: pass(承受) + ion(名词后缀)<br>释义: 热情,激情,强烈感情","example":"例句: She has a passion for music. ｜ 推导: 承受强烈情感的状态 = 激情,热情"},{"word":"passive","pos":"a.","detail":"构词: 构词: pass(承受) + ive(形容词后缀)<br>释义: 被动的,消极的","example":"例句: Don't be so passive. ｜ 推导: 承受的,非主动的 = 被动的"},{"word":"compassion","pos":"n.","detail":"构词: 构词: com(共同) + pass(承受) + ion<br>释义: 同情,怜悯","example":"例句: He showed compassion for the poor. ｜ 推导: 共同承受苦难 = 同情,怜悯"}],"extra":["passionate a. 热情的（构词: passion + ate）","passively ad. 被动地（构词: passive + ly）","passivity n. 被动性（构词: passive + ity）","impassioned a. 充满激情的（构词: im + passioned）","compassionate a. 有同情心的（构词: compassion + ate）","patience n. 耐心（构词: pati(承受) + ence）","impassive a. 无动于衷的（构词: im + passive）","patient a. 耐心的 n.病人（构词: pati + ent）","dispassionate a. 冷静的（构词: dis + passionate）","impatient a. 不耐烦的（构词: im + patient）"]},{"id":472,"root":"peace","pronounce":"/piːs/普衣斯","source":"拉丁语 pax","meaning":"和平,安宁","mnemonic":"peace就是小学学过的单词，拼写和读音都不用变化。peace 是和平、安宁，所以peace就是“和平、安宁”。","mainWords":[{"word":"peace","pos":"n.","detail":"构词: 构词: peace(和平)<br>释义: 和平,安宁","example":"例句: We all hope for world peace. ｜ 推导: 原始词根 = 和平,安宁,平静"},{"word":"peaceful","pos":"a.","detail":"构词: 构词: peace(和平) + ful(形容词后缀)<br>释义: 和平的,安宁的","example":"例句: It's a peaceful village. ｜ 推导: 和平 + 充满 = 充满和平的,安宁的"}],"extra":["peacefully ad. 和平地（构词: peace + fully）","peacemaking n. 调停（构词: peace + making）","peacemaker n. 调解人（构词: peace + maker）","peacenik n. 反战分子（构词: peace + nik）","peacetime n. 和平时期（构词: peace + time）","unpeaceful a. 不和平的（构词: un + peace + ful）","peaceable a. 温和的（构词: peace + able）","peaceably ad. 温和地（构词: peace + ably）","peacefulness n. 平静（构词: peace + fulness）","peace-loving a. 爱好和平的（构词: peace + loving）","peacekeeping n. 维和（构词: peace + keeping）","peaceless a. 不平静的（构词: peace + less）","peacekeeper n. 维和人员（构词: peace + keeper）","greenpeace n. 绿色和平组织（构词: green + peace）"]},{"id":473,"root":"plex","pronounce":"/pleks/普勒诶克斯","source":"拉丁语 plexus","meaning":"重叠,折叠,倍","mnemonic":"plex中间的x像两条线交叉重叠。一个东西反复交叉、折叠，层数会越来越多，结构也会越来越复杂。因此plex就是“重叠、折叠、倍”的意思，所以plex就是“重叠,折叠,倍”的意思。","mainWords":[{"word":"complex","pos":"a.","detail":"构词: 构词: com(起) + plex(重叠)<br>释义: 复杂的 n.联合体","example":"例句: This is a complex problem. ｜ 推导: 一起 + 重叠 = 复杂的"},{"word":"complexity","pos":"n.","detail":"构词: 构词: com + plex + ity(名词后缀)<br>释义: 复杂性","example":"例句: The complexity of the task. ｜ 推导: 复杂 + 性质 = 复杂性"},{"word":"perplex","pos":"v.","detail":"构词: 构词: per(完全) + plex(重叠)<br>释义: 使困惑","example":"例句: The question perplexed me. ｜ 推导: 完全 + 重叠 = 使困惑"}],"extra":["complexion n. 肤色,面色（构词: com + plex + ion）","triplex a. 三重的（构词: tri三 + plex）","duplex a. 双重的 n.复式住宅（构词: du双 + plex）","perplexed a. 困惑的（构词: per + plex + ed）","multiplex a. 多重的（构词: multi多 + plex）","complexly ad. 复杂地（构词: com + plex + ly）","perplexity n. 困惑（构词: per + plex + ity）","plexus n. 神经丛 (plex词源)","simplex a. 单一的（构词: sim一 + plex）","implexion n. 交织（构词: im + plex + ion）"]},{"id":474,"root":"plod/plos","pronounce":"/plɒd/普勒奥德","source":"拉丁语 plaudere","meaning":"拍打→爆炸","mnemonic":"plod/plos就是“啪落、啪爆”。用力一拍，东西啪地落下；力量再大一点，就可能啪地爆开。拍打和爆炸都带有突然、猛烈的冲击。所以plod/plos就是“拍打、爆炸”的意思。","mainWords":[{"word":"explode","pos":"v.","detail":"构词: 构词: ex(向外) + plod(拍打→爆炸)<br>释义: 爆炸,爆发","example":"例句: The bomb exploded suddenly. ｜ 推导: 向外 + 剧烈拍打 = 爆炸"},{"word":"explosion","pos":"n.","detail":"构词: 构词: ex(向外) + plos(爆炸) + ion(名词后缀)<br>释义: 爆炸,爆发","example":"例句: The explosion shook the building. ｜ 推导: 向外 + 爆炸 + 过程 = 爆炸"},{"word":"explosive","pos":"a.","detail":"构词: 构词: ex + plos(爆炸) + ive(形容词后缀)<br>释义: 爆炸的 n.炸药","example":"例句: Handle explosive materials carefully. ｜ 推导: 向外 + 爆炸的 = 爆炸性的"},{"word":"applaud","pos":"v.","detail":"构词: 构词: ap(朝向) + plaud(拍打)<br>释义: 鼓掌,赞同","example":"例句: The audience applauded loudly. ｜ 推导: 朝向 + 拍打 = 鼓掌"},{"word":"applause","pos":"n.","detail":"构词: 构词: ap(朝向) + plaus(拍打) + e<br>释义: 鼓掌,喝彩","example":"例句: The performance received applause. ｜ 推导: 朝向 + 拍打声 = 掌声"}],"extra":["implode v. 内爆（构词: im(内) + plod）","plausible a. 貌似有理的（构词: plaus + ible）"]},{"id":475,"root":"round","pronounce":"/raʊnd/儿奥恩德","source":"拉丁语 rotundus","meaning":"圆形,循环","mnemonic":"round本身就是我们小学学过的round。 round 就是“圆的、回合”。 所以round就是“圆形、循环”。","mainWords":[{"word":"round","pos":"a.","detail":"构词: 构词: round(圆形)<br>释义: 圆的 n.回合","example":"例句: The earth is round. ｜ 推导: 原始词根 = 圆形的;循环的一轮"},{"word":"around","pos":"ad.","detail":"构词: 构词: a(在) + round(圆形)<br>释义: 围绕 prep.在...周围","example":"例句: Walk around the lake. ｜ 推导: 在 + 圆形 = 围绕,环绕"},{"word":"surround","pos":"v.","detail":"构词: 构词: sur(超过) + round(圆形)<br>释义: 包围,环绕","example":"例句: Trees surround the house. ｜ 推导: 超过 + 圆形 = 完全环绕,包围"},{"word":"roundabout","pos":"a.","detail":"构词: 构词: round(圆) + about(周围)<br>释义: 迂回的 n.环岛","example":"例句: Take the roundabout route. ｜ 推导: 圆 + 周围 = 绕圈的,环形的"},{"word":"surroundings","pos":"n.","detail":"构词: 构词: sur + round + ings(环境后缀)<br>释义: 周围的事物,环境","example":"例句: Check your surroundings. ｜ 推导: 包围 + 环境化 = 周遭环境"}],"extra":["rounded a. 圆形的（构词: round + ed）","all-round a. 全面的（构词: all + round）"]},{"id":476,"root":"rupt","pronounce":"/rʌpt/儿阿普特","source":"拉丁语 rumpere","meaning":"破裂,断裂","mnemonic":"rupt就是“拉破它”。 把东西拉到破开，就会破裂和断裂。 所以rupt就是“破裂、断裂”。","mainWords":[{"word":"interrupt","pos":"v.","detail":"构词: 构词: inter(中间) + rupt(破裂)<br>释义: 打断,中断","example":"例句: Don't interrupt me. ｜ 推导: 从中间破开 = 打断"},{"word":"corrupt","pos":"v.","detail":"构词: 构词: cor(完全) + rupt(破裂)<br>释义: 贿赂 a.腐败的","example":"例句: Power tends to corrupt. ｜ 推导: 完全破坏 = 腐败"},{"word":"disrupt","pos":"vt.","detail":"构词: 构词: dis(分开) + rupt(破裂)<br>释义: 使混乱,瓦解","example":"例句: The protest disrupted traffic. ｜ 推导: 破裂分开 = 扰乱"},{"word":"erupt","pos":"v.","detail":"构词: 构词: e(向外) + rupt(破裂)<br>释义: 爆发,喷发","example":"例句: The volcano erupted. ｜ 推导: 向外破裂 = 爆发"},{"word":"abrupt","pos":"a.","detail":"构词: 构词: ab(离开) + rupt(破裂)<br>释义: 突然的,陡峭的","example":"例句: His manner was abrupt. ｜ 推导: 突然破开 = 突然的"},{"word":"bankrupt","pos":"a.","detail":"构词: 构词: bank(银行) + rupt(破裂)<br>释义: 破产的","example":"例句: The company went bankrupt. ｜ 推导: 银行破裂 = 破产的"}],"extra":["eruption n. 爆发,喷发（构词: e + rupt + ion）","interruption n. 中断（构词: inter + rupt + ion）","rupture n./v. 破裂,决裂（构词: rupt + ure）","corruption n. 腐败（构词: cor + rupt + ion）","disruptive a. 破坏的（构词: dis + rupt + ive）","disruption n. 扰乱（构词: dis + rupt + ion）","irrupt v. 闯入,侵入（构词: ir + rupt）","bankruptcy n. 破产（构词: bank + rupt + cy）"]},{"id":477,"root":"theor","pronounce":"/θɪər/斯伊儿儿","source":"希腊语 θεωρία","meaning":"观点,理论,论说","mnemonic":"theor就是“提而论”。先提出一个观点，再围绕它讲理由、作说明，最后形成一套完整论说，就是理论。所以theor就是“观点、理论、论说”。","mainWords":[{"word":"theory","pos":"n.","detail":"构词: 构词: theor(观点) + y(名词后缀)<br>释义: 理论,学说","example":"例句: Einstein's theory changed physics. ｜ 推导: 观点 + 名词化 = 理论,学说"},{"word":"theoretical","pos":"a.","detail":"构词: 构词: theor(理论) + et + ical(形容词后缀)<br>释义: 理论的","example":"例句: This is only a theoretical model. ｜ 推导: 理论 + 形容词化 = 理论的,理论上的"}],"extra":["theorist n. 理论家（构词: theor + ist）","atheory n. 无理论状态（构词: a + theor + y）","theorize v. 理论化（构词: theor + ize）","theorem n. 定理,原理（构词: theor + em）","theoretics n. 理论学（构词: theor + etics）","theoretic a. 理论的（构词: theor + etic）","hypothesis n. 假说（构词: hypo + the + sis）","theoretically ad. 理论上（构词: theor + etically）","thesis n. 论文,论点（构词: the + sis）","theoretician n. 理论家（构词: theor + etician）","theology n. 神学（构词: theo + logy）"]},{"id":478,"root":"usual","pronounce":"/ˈjuːʒuəl/耶乌日乌额勒","source":"拉丁语 usualis","meaning":"通常的,平常的","mnemonic":"usual可以拆成小学词use＋all。一种东西 all the time 都在 use，也就是一直、反复地使用；反复出现以后，就变成通常的、平常的。所以usual就是“通常的、平常的”。","mainWords":[{"word":"usual","pos":"a.","detail":"构词: 构词: us(use常用) + ual(形容词后缀)<br>释义: 通常的,平常的","example":"例句: It's usual to feel nervous. ｜ 推导: 常用的 = 通常的,平常的"},{"word":"unusual","pos":"a.","detail":"构词: 构词: un(不) + usual(通常的)<br>释义: 不寻常的","example":"例句: It's unusual to see snow here. ｜ 推导: 不 + 通常的 = 不寻常的,异常的"},{"word":"usually","pos":"ad.","detail":"构词: 构词: usual(通常的) + ly(副词后缀)<br>释义: 通常,平常","example":"例句: I usually get up at seven. ｜ 推导: 通常的 + 副词化 = 通常地"}],"extra":["unusually ad. 不寻常地（构词: un + usual + ly）","usualness n. 通常性（构词: usual + ness）","the usual n. 平常的事物","as usual 照常,像往常一样"]},{"id":479,"root":"","pronounce":"/lədʒi/勒吉衣","source":"希腊语 logos","meaning":"...学,学科","mnemonic":"-logy就是“逻辑成学”。 把知识按逻辑组织成体系，就形成一门学科。 所以-logy就是“...学、学科”。","mainWords":[{"word":"biology","pos":"n.","detail":"构词: 构词: bio(生命) + logy(学科)<br>释义: 生物学","example":"例句: She majors in biology. ｜ 推导: 生命 + 学科 = 生物学"},{"word":"psychology","pos":"n.","detail":"构词: 构词: psycho(心灵) + logy<br>释义: 心理学","example":"例句: Psychology helps understand behavior. ｜ 推导: 心灵 + 学科 = 心理学"},{"word":"ecology","pos":"n.","detail":"构词: 构词: eco(家园/环境) + logy<br>释义: 生态学","example":"例句: Ecology protects our environment. ｜ 推导: 环境 + 学科 = 生态学"},{"word":"sociology","pos":"n.","detail":"构词: 构词: socio(社会) + logy<br>释义: 社会学","example":"例句: Sociology studies human society. ｜ 推导: 社会 + 学科 = 社会学"},{"word":"geology","pos":"n.","detail":"构词: 构词: geo(地球) + logy<br>释义: 地质学","example":"例句: Geology reveals Earth's history. ｜ 推导: 地球 + 学科 = 地质学"},{"word":"technology","pos":"n.","detail":"构词: 构词: techno(技艺) + logy<br>释义: 技术;工艺","example":"例句: Modern technology changes lives. ｜ 推导: 技艺 + 学科 = 技术学,技术"},{"word":"ideology","pos":"n.","detail":"构词: 构词: ideo(观念) + logy<br>释义: 意识形态","example":"例句: Different ideologies shape societies. ｜ 推导: 观念 + 学科 = 意识形态(学)"},{"word":"physiology","pos":"n.","detail":"构词: 构词: physio(自然/身体) + logy<br>释义: 生理学","example":"例句: Physiology explains body functions. ｜ 推导: 身体 + 学科 = 生理学"},{"word":"physiological","pos":"a.","detail":"构词: 构词: physiology + ical(形容词后缀)<br>释义: 生理学的","example":"例句: Physiological changes affect health. ｜ 推导: 生理学 + 形容词化 = 生理学的"}],"extra":[]},{"id":480,"root":"act","pronounce":"/ækt/艾克特","source":"拉丁语 actum","meaning":"做,行动,驱使","mnemonic":"act本身就是我们小学学过的act，意思是做、行动、起作用。一个人act，就是开始做事并推动事情发生。所以act就是“做、行动、驱使”的意思。","mainWords":[{"word":"act","pos":"v.","detail":"构词: 构词: act(做、行动)<br>释义: 行动;表演 n.行为","example":"例句: Think before you act. ｜ 推导: 原始词根 = 做,行动,表演"},{"word":"action","pos":"n.","detail":"构词: 构词: act(行动) + ion(名词后缀)<br>释义: 行为;动作","example":"例句: Actions speak louder than words. ｜ 推导: 行动 + 名词化 = 行动,行为"},{"word":"active","pos":"a.","detail":"构词: 构词: act(行动) + ive(形容词后缀)<br>释义: 活跃的;主动的","example":"例句: Stay active and healthy. ｜ 推导: 行动 + 形容词化 = 好动的,积极的"},{"word":"activity","pos":"n.","detail":"构词: 构词: act + ivity(名词后缀)<br>释义: 活动;活跃性","example":"例句: Physical activity is important. ｜ 推导: 行动 + 性质名词 = 活动,活跃性"},{"word":"actor","pos":"n.","detail":"构词: 构词: act(表演) + or(表人的后缀)<br>释义: 男演员","example":"例句: He is a famous actor. ｜ 推导: 表演 + 人 = 表演者,男演员"},{"word":"actress","pos":"n.","detail":"构词: 构词: act + or + ess(女性后缀)<br>释义: 女演员","example":"例句: She is a talented actress. ｜ 推导: 表演者 + 女性 = 女演员"},{"word":"activate","pos":"v.","detail":"构词: 构词: act + ive + ate(动词后缀)<br>释义: 激活;启动","example":"例句: Activate your account now. ｜ 推导: 使活跃 = 激活,启动"},{"word":"actual","pos":"a.","detail":"构词: 构词: act(行动) + ual(形容词后缀)<br>释义: 实际的;真实的","example":"例句: The actual situation is different. ｜ 推导: 付诸行动的 = 实际的,真实的"}],"extra":["actively ad. 积极地（构词: act + ive + ly）","actually ad. 实际上（构词: act + ual + ly）","activation n. 激活（构词: act + ive + ation）","actuality n. 现实（构词: act + ual + ity）","acting n. 表演 a.代理的（构词: act + ing）","actualize v. 实现（构词: act + ual + ize）"]},{"id":481,"root":"blood","pronounce":"/blʌd/布勒阿德","source":"古英语 blōd","meaning":"血,血液","mnemonic":"blood就是小学学过的单词，拼写和读音都不用变化。blood 是血和血液，所以blood就是“血、血液”。","mainWords":[{"word":"blood","pos":"n.","detail":"构词: 构词: blood(血)<br>释义: 血液,血统","example":"例句: Blood is thicker than water. ｜ 推导: 原始词根 = 血液,血缘"},{"word":"bloody","pos":"a.","detail":"构词: 构词: blood(血) + y(形容词后缀)<br>释义: 流血的,血腥的","example":"例句: It was a bloody battle. ｜ 推导: 血 + 形容词化 = 血腥的,流血的"}],"extra":["bloodily ad. 血腥地（构词: blood + ily）","bloodstain n. 血迹（构词: blood + stain）","bloodless a. 无血的（构词: blood + less）","bloodbath n. 大屠杀（构词: blood + bath）","bloodshed n. 流血（构词: blood + shed）","lifeblood n. 命脉（构词: life + blood）","bloodstream n. 血流（构词: blood + stream）","bloodred a. 血红的（构词: blood + red）","bloodthirsty a. 嗜血的（构词: blood + thirsty）","bloodiness n. 血腥（构词: blood + iness）","bloodline n. 血统（构词: blood + line）","bloodwork n. 血液检查（构词: blood + work）","bloodshot a. 充血的（构词: blood + shot）","coldblood n. 冷血（构词: cold + blood）"]},{"id":482,"root":"","pronounce":"/bjʊə(r)/布耶乌儿儿","source":"法语 bureau“办公桌、办公室、局处”","meaning":"办公单位、局处","mnemonic":"bur就是“部儿”。“部”就是部门、部局，“儿”在中文里不另外增加意思，只让发音接近bur。一个大机构下面分出的部、局、司、处，都是办公单位，所以bur就是“办公单位、局处”的意思。","mainWords":[{"word":"bureau","pos":"n.","detail":"构词: 构词: bur(办公单位) + eau(完整拼写部分)<br>释义: 署,局,司,处","example":"例句: The tax bureau is very busy. ｜ 推导: 办公单位 = 局、处、司等机构"},{"word":"bureaucracy","pos":"n.","detail":"构词: 构词: bureau(局) + cracy(统治)<br>释义: 官僚主义;官僚机构","example":"例句: We must fight against bureaucracy. ｜ 推导: 局处系统 + 统治 = 官僚主义、官僚机构"}],"extra":["bureaucrat n. 官僚（构词: bureau + crat(统治者)）","travel bureau 旅行社","bureaucracy n. 官僚机构（构词: bureau + cracy(统治)）","news bureau 新闻处","bureaucratic a. 官僚的（构词: bureau + cratic）","credit bureau 征信局","bureaux n. 局(复数)（构词: bureau的复数）","labor bureau 劳动局","FBI 联邦调查局（构词: Federal Bureau of Investigation）","patent bureau 专利局","weather bureau 气象局","tourism bureau 旅游局","census bureau 人口普查局"]},{"id":483,"root":"cov","pronounce":"/kʌv/卡五","source":"拉丁语 (覆盖)","meaning":"覆盖,遮盖,掩护","mnemonic":"方法一：cov就是“扣捂”。把盖子扣上，再用手捂住，里面的东西就被覆盖、遮盖并受到掩护。所以cov就是“覆盖、遮盖、掩护”的意思。   方法二：为了记忆，可以把COV记成“Close Over View”。\n\nClose Over表示把盖子、布或外层合到物体上面；View表示人的视线。\n\n外层一旦合上，View就被挡住，里面的东西看不见，同时也得到保护。三个字母分别提供覆盖动作、位置和被遮挡的视线。\n\n所以cov就是“覆盖、遮盖；保护、掩护”的意思。","mainWords":[{"word":"cover","pos":"v.","detail":"构词: 构词: cov(覆盖) + er(动词后缀)<br>释义: 覆盖 n.封面","example":"例句: Cover the pot with a lid. ｜ 推导: 覆盖 + 动词化 = 覆盖,遮盖"},{"word":"recover","pos":"v.","detail":"构词: 构词: re(重新) + cov(覆盖) + er<br>释义: 恢复,痊愈","example":"例句: He will recover from illness. ｜ 推导: 重新 + 覆盖 = 重新盖好,恢复"},{"word":"discover","pos":"v.","detail":"构词: 构词: dis(去除) + cov(覆盖) + er<br>释义: 发现,发觉","example":"例句: Columbus discovered America. ｜ 推导: 去除 + 覆盖 = 揭开盖子,发现"},{"word":"uncover","pos":"v.","detail":"构词: 构词: un(不) + cov(覆盖) + er<br>释义: 揭开,揭露","example":"例句: Uncover the truth. ｜ 推导: 不 + 覆盖 = 不盖着,揭露"},{"word":"discovery","pos":"n.","detail":"构词: 构词: dis + cov + ery(名词后缀)<br>释义: 发现,发现物","example":"例句: A great scientific discovery. ｜ 推导: 去除覆盖的结果 = 发现"},{"word":"recovery","pos":"n.","detail":"构词: 构词: re + cov + ery(名词后缀)<br>释义: 恢复,康复","example":"例句: A speedy recovery from illness. ｜ 推导: 重新覆盖的过程 = 恢复"}],"extra":["coverage n. 覆盖范围（构词: cover + age）","uncovered a. 无遮盖的（构词: un + cover + ed）","covering n. 覆盖物（构词: cover + ing）","recoverable a. 可恢复的（构词: re + cover + able）","covered a. 被覆盖的（构词: cover + ed）","rediscover v. 重新发现（构词: re + dis + cover）","coverlet n. 床罩（构词: cover + let小）","discoverer n. 发现者（构词: dis + cover + er）","covert a. 隐蔽的（构词: cov + ert）","undercover a. 秘密的（构词: under + cover）"]},{"id":484,"root":"dict-/dic-","pronounce":"/dɪkt/迪克特","source":"拉丁语 dicere","meaning":"说,宣告","mnemonic":"方法一：dict/dic就是“递c t”就是“递词他”。把词递到别人耳朵里，就是说；把一句话公开递给所有人，就是宣告和命令。所以dict/dic就是“说、宣告”的意思。   方法二：为了记忆，可以把DICT记成“Discuss Ideas, Choose words, Tell”。\n\nDiscuss Ideas表示先讨论要表达的想法；Choose words表示选择合适的词语；Tell表示最后把整理好的话说给别人听。\n\n从形成想法、挑选用词到正式说出，人物、内容和动作始终在同一条表达过程里。普通说话可以推出“说、讲”；由有权力的人正式说出，又可以推出“宣告、命令”。\n\ndic-是较短的拼写形式，继续沿用同一个“把想法组织成话并说出来”的画面。\n\n所以dict/dic就是“说、讲；宣告、命令”的意思。","mainWords":[{"word":"predict","pos":"v.","detail":"构词: 构词: pre(预先) + dict(说)<br>释义: 预测","example":"例句: Scientists predict the weather. ｜ 推导: 预先 + 说 = 提前说出,预测"},{"word":"verdict","pos":"n.","detail":"构词: 构词: ver(真实) + dict(说)<br>释义: 裁决","example":"例句: The jury reached a verdict. ｜ 推导: 真实 + 说 = 说出真相,裁决"},{"word":"dictate","pos":"v.","detail":"构词: 构词: dict(说) + ate(动词后缀)<br>释义: 口授;命令","example":"例句: He dictated a letter to his secretary. ｜ 推导: 说 + 动词化 = 说出来让人记录,口授"},{"word":"dictionary","pos":"n.","detail":"构词: 构词: dict(说) + ion + ary(场所)<br>释义: 字典","example":"例句: Look it up in the dictionary. ｜ 推导: 说 + 场所 = 解释词语的地方,字典"},{"word":"contradict","pos":"v.","detail":"构词: 构词: contra(相反) + dict(说)<br>释义: 反驳","example":"例句: Don't contradict your parents. ｜ 推导: 相反 + 说 = 说相反的话,反驳"},{"word":"contradiction","pos":"n.","detail":"构词: 构词: contradict + ion(名词后缀)<br>释义: 矛盾","example":"例句: There's a contradiction in his story. ｜ 推导: 反驳 + 名词化 = 相互矛盾的状态"},{"word":"addict","pos":"v.","detail":"构词: 构词: ad(向) + dict(说)<br>释义: 使上瘾 n.瘾君子","example":"例句: He's addicted to coffee. ｜ 推导: 向 + 说 = 反复说要,上瘾"},{"word":"indicate","pos":"v.","detail":"构词: 构词: in(向内) + dic(说) + ate<br>释义: 指示","example":"例句: The sign indicates the direction. ｜ 推导: 向内 + 说 = 指向说明,指示"},{"word":"indication","pos":"n.","detail":"构词: 构词: indicate + ion(名词后缀)<br>释义: 指示;迹象","example":"例句: There's no indication of improvement. ｜ 推导: 指示 + 名词化 = 指示,迹象"},{"word":"indicative","pos":"a.","detail":"构词: 构词: indicate + ive(形容词后缀)<br>释义: 指示的","example":"例句: This is indicative of a problem. ｜ 推导: 指示 + 形容词化 = 表示...的,指示的"},{"word":"dedicate","pos":"v.","detail":"构词: 构词: de(加强) + dic(说) + ate<br>释义: 奉献;致力于","example":"例句: She dedicated her life to science. ｜ 推导: 加强 + 说 = 郑重宣告,奉献"},{"word":"dictation","pos":"n.","detail":"构词: 构词: dict(说) + ation(名词后缀)<br>释义: 听写;口述","example":"例句: We have a dictation test today. ｜ 推导: 说 + 名词化 = 说出来让人写,听写"}],"extra":[]},{"id":485,"root":"integr","pronounce":"/ˈɪntɪgr/衣恩提格儿","source":"拉丁语 integer","meaning":"完整,无缺","mnemonic":"为了记忆，可以把INTEGR记成“Items Need To Enter Group：Ready”。\n\nItems表示一个整体所需要的各个部件；Need To Enter Group表示这些部件都必须进入同一个组；Ready表示所有部分到齐以后，整体才真正准备完成。\n\n少一个部件，机器、名单或项目就不完整；所有部件进入同一组并保持在一起，才形成完整、无缺的整体。\n\n进一步放到人的品格上，一个人的话、行为和原则没有裂成两套，内外保持完整一致，就可以推出正直、诚实。\n\n所以integr就是“完整、无缺；使各部分成为整体”的意思。","mainWords":[{"word":"integral","pos":"a.","detail":"构词: 构词: integr(完整) + al(形容词后缀)<br>释义: 完整的,必需的","example":"例句: Music is an integral part of life. ｜ 推导: 完整 + 形容词化 = 不可缺少的"},{"word":"integrate","pos":"v.","detail":"构词: 构词: integr(完整) + ate(动词后缀)<br>释义: 使成一体,整合","example":"例句: We need to integrate all the data. ｜ 推导: 完整 + 动词化 = 使完整,整合"},{"word":"integrity","pos":"n.","detail":"构词: 构词: integr(完整) + ity(名词后缀)<br>释义: 完整性;正直","example":"例句: He is a man of integrity. ｜ 推导: 完整 + 名词化 = 完整性,品格完整"}],"extra":["integration n. 整合,一体化（构词: integr + ation）","integrator n. 整合者（构词: integr + ator）","integrative a. 综合的（构词: integr + ative）","integrally ad. 完整地（构词: integr + al + ly）","disintegrate v. 分解,瓦解（构词: dis + integr + ate）","disintegration n. 瓦解（构词: dis + integr + ation）","reintegrate v. 重新整合（构词: re + integr + ate）","integrality n. 完整性（构词: integr + ality）"]},{"id":486,"root":"mal/male","pronounce":"/meɪl/姆诶勒","source":"拉丁语 (雄性)","meaning":"雄性,男性","mnemonic":"以后看到mal/male，可以直接想到公共场所男卫生间门上的“♂”男性图标，旁边常写 Male。这个标志表示男性，也可以泛指雄性；mal 是去掉末尾 e 后的短形式。所以mal/male就是“雄性、男性”。","mainWords":[{"word":"male","pos":"n./a.","detail":"构词: 构词: mal(雄性) + e<br>释义: 男性(的),雄性(的)","example":"例句: The male lion has a mane. ｜ 推导: 雄性 = 男性的,雄性的"},{"word":"female","pos":"n./a.","detail":"构词: 构词: fe(女性) + male<br>释义: 女性(的),雌性(的)","example":"例句: Female students outnumber males. ｜ 推导: 女性 + 对应词 = 女性的,雌性的"}],"extra":["masculine a. 男性的,阳刚的","feminine a. 女性的,阴柔的","maleness n. 男性特征（构词: male + ness）","femaleness n. 女性特征","manly a. 有男子气概的","womankind n. 女性(总称)","mankind n. 人类(男性代表)","macho a. 大男子主义的","gentleman n. 绅士(gentle + man)","virile a. 有男子气概的","malefactor n. 罪犯(male + factor)","manhood n. 成年;男子气概","emasculate v. 使失去男子气","patriarch n. 家长;族长"]},{"id":487,"root":"mate","pronounce":"/meɪt/姆诶特","source":"古英语(同伴)","meaning":"伙伴,同伴","mnemonic":"mate就是“mate”。mate会让人直接想到“伙伴”，由这个意思还可以继续推出同伴，所以mate就是“伙伴,同伴”的意思。","mainWords":[{"word":"mate","pos":"n.","detail":"构词: 构词: mate(伙伴)<br>释义: 伙伴 v.结伴","example":"例句: He's been my mate since childhood. ｜ 推导: 原始词根 = 伙伴,同伴"},{"word":"classmate","pos":"n.","detail":"构词: 构词: class(班级) + mate(伙伴)<br>释义: 同班同学","example":"例句: My classmate helped me study. ｜ 推导: 班级 + 伙伴 = 同班的伙伴"},{"word":"roommate","pos":"n.","detail":"构词: 构词: room(房间) + mate(伙伴)<br>释义: 室友","example":"例句: My roommate is very friendly. ｜ 推导: 房间 + 伙伴 = 同住的伙伴"}],"extra":["schoolmate n. 同学（构词: school + mate）","shipmate n. 船友（构词: ship + mate）","teammate n. 队友（构词: team + mate）","soulmate n. 灵魂伴侣（构词: soul + mate）","playmate n. 玩伴（构词: play + mate）","housemate n. 同居者（构词: house + mate）","workmate n. 同事（构词: work + mate）","matey a. 友好的（构词: mate + y）","flatmate n. 合租者（构词: flat + mate）","mating n. 配对,交配（构词: mate + ing）"]},{"id":488,"root":"mort","pronounce":"/mɔːt/莫特","source":"拉丁语 mors (死亡)","meaning":"死亡","mnemonic":"mort就是“末”。 生命走到末端，就意味着死亡。 所以mort就是“死亡”。","mainWords":[{"word":"mortal","pos":"a.","detail":"构词: 构词: mort(死亡) + al(形容词后缀)<br>释义: 终有一死的;凡人的","example":"例句: mortal beings ｜ 推导: 死亡的 = 终有一死的,凡人的"},{"word":"mortgage","pos":"n.","detail":"构词: 构词: mort(死亡) + gage(担保)<br>释义: 抵押贷款 v.抵押","example":"例句: pay off the mortgage ｜ 推导: 死亡 + 担保 = 房贷(还到死)"}],"extra":["immortal a. 不朽的（构词: im(否定) + mortal）","immortality n. 不朽（构词: im + mortal + ity）","mortality n. 死亡率（构词: mortal + ity）","mortgagee n. 抵押权人（构词: mortgage + e）","mortify v. 使羞愧（构词: mort + ify）","mortgagor n. 抵押人（构词: mortgage + or）","mortician n. 殡葬师（构词: mort + ician）","postmortem n. 尸检（构词: post + mortem）","mortuary n. 太平间（构词: mort + uary）","moribund a. 垂死的（构词: mori + bund）"]},{"id":489,"root":"mot/mov","pronounce":"/moʊt/姆欧特","source":"拉丁语 movere","meaning":"移动,使动","mnemonic":"mot/mov是我们小学学过的词move的一部分。 move 就是“移动、行动”。 在这个词里，负责表达“移动”这一层意思的部分就是mot/mov。 所以mot/mov就是“移动、使动”。","mainWords":[{"word":"motion","pos":"n.","detail":"构词: 构词: mot(移动) + ion(名词后缀)<br>释义: 运动,动作","example":"例句: The train is in motion. ｜ 推导: 移动 + 名词化 = 运动,动作"},{"word":"motor","pos":"n.","detail":"构词: 构词: mot(移动) + or(工具后缀)<br>释义: 发动机,电动机","example":"例句: Start the motor. ｜ 推导: 移动 + 工具 = 产生动力的机器"},{"word":"motive","pos":"n.","detail":"构词: 构词: mot(移动) + ive(倾向后缀)<br>释义: 动机 a.发动的","example":"例句: What's your motive? ｜ 推导: 移动 + 倾向 = 促使行动的原因"},{"word":"motivate","pos":"vt.","detail":"构词: 构词: mot + iv + ate(动词后缀)<br>释义: 激励,鼓励","example":"例句: Teachers motivate students. ｜ 推导: 动机 + 动词化 = 激发动力"},{"word":"promote","pos":"v.","detail":"构词: 构词: pro(向前) + mot(移动) + e<br>释义: 促进,提升","example":"例句: Promote world peace. ｜ 推导: 向前 + 移动 = 推动向前,提升"},{"word":"remote","pos":"a.","detail":"构词: 构词: re(远离) + mot(移动) + e<br>释义: 遥远的","example":"例句: A remote village. ｜ 推导: 远离 + 移动 = 被移向远处的"},{"word":"emotion","pos":"n.","detail":"构词: 构词: e(向外) + mot(移动) + ion<br>释义: 情绪,情感","example":"例句: Control your emotions. ｜ 推导: 向外 + 移动 = 内心的外显波动"},{"word":"move","pos":"v.","detail":"构词: 构词: mov(移动) + e<br>释义: 移动 n.行动","example":"例句: Don't move! ｜ 推导: 词根原形 = 移动,迁移"},{"word":"movement","pos":"n.","detail":"构词: 构词: mov(移动) + ment(名词后缀)<br>释义: 运动,活动","example":""},{"word":"remove","pos":"v.","detail":"构词: 构词: re(离开) + mov(移动) + e<br>释义: 移除,搬走","example":""}],"extra":[]},{"id":490,"root":"nerv-","pronounce":"/nɜːv/恩五","source":"拉丁语 nervus","meaning":"筋腱;神经","mnemonic":"nerv就是“能绷”。身体里能够绷紧、传递力量的是筋腱；能够传递感觉、让人紧张的是神经。所以nerv就是“筋腱；神经”的意思。","mainWords":[{"word":"nerve","pos":"n.","detail":"构词: 构词: nerv(筋腱/神经) + e<br>释义: 神经;勇气","example":"例句: He had the nerve to ask for more. ｜ 推导: 筋腱 → 神经 → 精神韧劲(勇气)"},{"word":"nervous","pos":"a.","detail":"构词: 构词: nerv + ous(形容词后缀)<br>释义: 紧张的;神经质的","example":"例句: She felt nervous before the exam. ｜ 推导: 神经的 + 形容词化 = 神经敏感的状态"}],"extra":["nervously ad. 紧张地（构词: nervous + ly）","nervousness n. 紧张（构词: nervous + ness）","neural a. 神经的（构词: neur(nerv变体) + al）","neuron n. 神经元（构词: neur + on）","neurology n. 神经学（构词: neur + ology）","unnerve v. 使失去勇气（构词: un + nerve）","enervate v. 使衰弱（构词: e(出) + nerv + ate）","innervate v. 支配神经（构词: in + nerv + ate）","nervy a. 有勇气的;紧张的（构词: nerv + y）"]},{"id":491,"root":"plea","pronounce":"/pliː/普利","source":"拉丁语 (请求)","meaning":"请求,恳求","mnemonic":"plea我们在小学词 please 中见过：please 的开头完整保留 plea。说 please 是礼貌地提出请求；反复、急切地请求，就变成恳求。所以plea就是“请求、恳求”。","mainWords":[{"word":"please","pos":"v.","detail":"构词: 构词: plea(请求) + se<br>释义: 请;使愉快","example":"例句: Please help me with this. ｜ 推导: 请求 + 后缀 = 请,使满意"},{"word":"plead","pos":"v.","detail":"构词: 构词: plea(请求) + d<br>释义: 恳求;辩护","example":"例句: She pleaded for mercy. ｜ 推导: 请求 + 动词化 = 恳求,请求"},{"word":"plea","pos":"n.","detail":"构词: 构词: plea(请求)<br>释义: 请求,恳求","example":"例句: He made a plea for help. ｜ 推导: 原始词根 = 请求,恳求"},{"word":"pleasant","pos":"a.","detail":"构词: 构词: pleas(使满意) + ant(形容词后缀)<br>释义: 令人愉快的","example":"例句: What a pleasant surprise! ｜ 推导: 使满意 + 形容词化 = 令人愉快的"},{"word":"pleasure","pos":"n.","detail":"构词: 构词: pleas(使满意) + ure(名词后缀)<br>释义: 愉快,乐趣","example":"例句: It's a pleasure to meet you. ｜ 推导: 使满意 + 名词化 = 愉快,快乐"}],"extra":["pleading a. 恳求的（构词: plead + ing）","displease v. 使不愉快（构词: dis + please）"]},{"id":492,"root":"polic-/polit-","pronounce":"/ˈpɒlɪ/普奥利","source":"希腊语 polis(城市)","meaning":"城市治理","mnemonic":"polic/polit就是我们小学学过的police。police负责管理city、维护城市秩序；围绕城市怎样被管理和统治的问题，就形成政治。所以polic/polit就是“城市治理”的意思。","mainWords":[{"word":"policy","pos":"n.","detail":"构词: 构词: polic(城市治理) + y<br>释义: 政策,方针","example":"例句: The company changed its policy. ｜ 推导: 城市治理 + 名词化 = 治理的规范"},{"word":"police","pos":"n.","detail":"构词: 构词: polic(治理) + e<br>释义: 警察 v.维持治安","example":"例句: Call the police immediately! ｜ 推导: 治理 → 维护秩序的机构"},{"word":"policeman","pos":"n.","detail":"构词: 构词: police + man(人)<br>释义: 警察","example":"例句: The policeman helped the child. ｜ 推导: 警察 + 人 = 维护治安的人"},{"word":"political","pos":"a.","detail":"构词: 构词: polit(城市) + ical<br>释义: 政治的","example":"例句: It's a political decision. ｜ 推导: 城市 + 形容词化 = 城市治理相关的"},{"word":"politics","pos":"n.","detail":"构词: 构词: polit(城市) + ics(学科)<br>释义: 政治,政治学","example":"例句: He studied politics at university. ｜ 推导: 城市 + 学科 = 城市治理的学问"},{"word":"politician","pos":"n.","detail":"构词: 构词: polit + ician(从事...的人)<br>释义: 政治家","example":"例句: The politician gave a speech. ｜ 推导: 城市治理 + 人 = 从政者"},{"word":"metropolitan","pos":"a.","detail":"构词: 构词: metro(母城) + polit + an<br>释义: 大都市的","example":"例句: Tokyo is a metropolitan city. ｜ 推导: 母城 + 城市 + 形容词 = 大都市的"}],"extra":[]},{"id":493,"root":"real","pronounce":"/riːəl/儿衣额勒","source":"拉丁语 (真实的)","meaning":"真实,现实","mnemonic":"以后看到real，可以想象一个真实物体旁边盖着“真的”印章。能够实际摸到、以后看到并确认存在，就是现实中的真实。所以real就是“真实、现实”。","mainWords":[{"word":"real","pos":"a.","detail":"构词: 构词: real(真实)<br>释义: 真实的,现实的","example":"例句: This is a real diamond. ｜ 推导: 原始词根 = 真实的,实际的"},{"word":"really","pos":"ad.","detail":"构词: 构词: real(真实) + ly(副词后缀)<br>释义: 真正地,确实","example": e":"例句: A snowstorm hit the city. ｜ 推导: 雪 + 风暴 = 暴风雪"}],"extra":["snowy a. 下雪的,多雪的（构词: snow + y）","snowboard n. 滑雪板（构词: snow + board）","snowman n. 雪人（构词: snow + man）","snowshoe n. 雪鞋（构词: snow + shoe）","snowball n. 雪球（构词: snow + ball）","snowbound a. 被雪困住的（构词: snow + bound）","snowfall n. 降雪,降雪量（构词: snow + fall）","snowwhite a. 雪白的（构词: snow + white）","snowflake n. 雪花（构词: snow + flake）","snowslide n. 雪崩（构词: snow + slide）","snowfield n. 雪原,雪地（构词: snow + field）","snowmelt n. 融雪水（构词: snow + melt）","snowdrift n. 雪堆（构词: snow + drift）","snowblind a. 雪盲的（构词: snow + blind）","snowcap n. 山顶积雪（构词: snow + cap）","snowline n. 雪线（构词: snow + line）"]},{"id":496,"root":"thus","pronounce":"/θʌs/斯阿斯","source":"表示狂热状态","meaning":"狂热,竭尽全力","mnemonic":"thus就是“殊死”。殊死就是拼尽全部力量、不顾一切，这种状态既狂热又竭尽全力，所以thus就是“狂热,竭尽全力”的意思。","mainWords":[{"word":"enthusiasm","pos":"n.","detail":"构词: 构词: en(加强) + thus(狂热) + iasm(名词后缀)<br>释义: 热情,狂热","example":"例句: Her enthusiasm is contagious. ｜ 推导: 加强 + 狂热 + 名词化 = 热情,热忱"},{"word":"enthusiastic","pos":"a.","detail":"构词: 构词: en + thus(狂热) + iast + ic(形容词后缀)<br>释义: 热情的","example":"例句: He is enthusiastic about music. ｜ 推导: 狂热 + 形容词化 = 热情的,热心的"}],"extra":["enthuse v. 使充满热情（构词: en + thus + e）","thusia n. 狂热(希腊语)（构词: thus + ia）","enthusiast n. 热心人（构词: en + thus + iast）","enthusiasms n. 各种热情 (enthusiasm复数)","enthusiastically ad. 热情地（构词: enthusiastic + ally）","disenthuse v. 使失去热情（构词: dis + enthuse）","unenthusiastic a. 不热心的（构词: un + enthusiastic）","re-enthuse v. 重新激发热情（构词: re + enthuse）","overenthusiastic a. 过分热情的（构词: over + enthusiastic）","enthusiastical a. 狂热的(古)（构词: enthusiastic + al）"]},{"id":497,"root":"tim","pronounce":"/tɪm/提姆","source":"拉丁语 timēre(害怕)","meaning":"恐惧,害怕","mnemonic":"为了记忆，可以把TIM记成“Tiger In Mind”。\n\nTiger表示老虎；In Mind表示这只老虎出现在脑海中。\n\n想象自己在夜路上突然想到附近可能有一只老虎。即使还没有真正看见，心跳也会加快，身体会紧张，不敢继续向前。这种由危险画面产生的状态就是恐惧、害怕和胆怯。\n\n三个词始终围绕同一只老虎和同一个人的心理反应，没有切换对象。\n\n所以tim就是“恐惧、害怕、胆怯”的意思。","mainWords":[{"word":"timid","pos":"a.","detail":"构词: 构词: tim(害怕) + id(形容词后缀)<br>释义: 胆怯的,怯懦的","example":"例句: She was too timid to ask questions. ｜ 推导: 害怕 + 形容词化 = 胆怯的,害羞的"},{"word":"intimidate","pos":"vt.","detail":"构词: 构词: in(使) + tim(害怕) + id + ate(动词后缀)<br>释义: 胁迫,威胁","example":"例句: Don't let them intimidate you. ｜ 推导: 使 + 害怕 = 使害怕,恐吓"},{"word":"intimate","pos":"a.亲密的,密切的","detail":"构词: 构词: in-(不、向内) + tim + -ate(动词后缀，使……或做……)<br>释义: n.熟友,熟人","example":"推导: 核心词根「tim」表示“恐惧,害怕”，结合前后缀，可推出“a.亲密的,密切的 n.熟友,熟人”"}],"extra":["timidly ad. 胆怯地（构词: timid + ly）","timidness n. 胆怯（构词: timid + ness）","timidity n. 胆怯,羞怯（构词: timid + ity）","intimidating a. 令人害怕的（构词: in + timid + ating）","timorous a. 胆小的（构词: tim + orous）","timorously ad. 胆怯地（构词: timorous + ly）","intimidate v. 恐吓（构词: in + timid + ate）","timorousness n. 胆怯（构词: timorous + ness）","intimidation n. 恐吓（构词: in + timid + ation）","unintimidated a. 不害怕的 (un + in + timid + ated"]},{"id":498,"root":"time","pronounce":"/taɪm/特爱姆","source":"古英语 tima","meaning":"时间,时代","mnemonic":"time本身就是我们小学学过的time。 time 就是“时间、时代”。 所以time就是“时间、时代”。","mainWords":[{"word":"time","pos":"n.","detail":"构词: 构词: time(时间)<br>释义: 时间,时代","example":"例句: What time is it? ｜ 推导: 原始词根 = 时间"},{"word":"sometimes","pos":"ad.","detail":"释义: 有时,间或","example":"例句: some + time + s ｜ 推导: 一些时候 = 有时"},{"word":"lifetime","pos":"n.","detail":"释义: 生","example":"例句: once in a lifetime ｜ 推导: 生命时间 = 一生"},{"word":"meantime","pos":"n.","detail":"释义: 其间,其时","example":"例句: mean + time ｜ 推导: 中间时间 = 其间"},{"word":"sometime","pos":"ad.","detail":"释义: 将来某时","example":"例句: some + time ｜ 推导: 某个时间 = 某时"},{"word":"daytime","pos":"n.","detail":"释义: 白天","example":"例句: during daytime ｜ 推导: 日间时间 = 白天"},{"word":"timely","pos":"a.","detail":"释义: 及时的","example":"例句: timely advice ｜ 推导: 时间的 = 及时的"},{"word":"overtime","pos":"a.","detail":"释义: 超时的 n.加班","example":"例句: over + time ｜ 推导: 超过时间 = 加班"},{"word":"pastime","pos":"n.","detail":"释义: 消遣","example":"例句: favorite pastime ｜ 推导: 打发时间 = 消遣"}],"extra":[]},{"id":499,"root":"","pronounce":"/ɪdʒ/衣吉","source":"法语后缀","meaning":"行为结果/状态/集合","mnemonic":"-age本身就是小学词 age，age 表示一个人所处的年龄状态。接到别的词后，它也常把前面的动作收成一个结果，把情况固定成一种状态，或者把许多个同类事物合成一个集合。所以-age就是“行为结果、状态或集合”。","mainWords":[{"word":"postage","pos":"n.","detail":"构词: 构词: post(邮寄) + age(结果)<br>释义: 邮费","example":"例句: The postage is quite expensive. ｜ 推导: 邮寄 + 结果 = 邮寄产生的费用"},{"word":"hostage","pos":"n.","detail":"构词: 构词: host(扣留) + age(结果)<br>释义: 人质","example":"例句: They took hostages in the bank. ｜ 推导: 扣留 + 结果 = 被扣押的人"},{"word":"shortage","pos":"n.","detail":"构词: 构词: short(短) + age(状态)<br>释义: 短缺,不足","example":"例句: There is a water shortage. ｜ 推导: 短 + 状态 = 短缺的状态"},{"word":"voltage","pos":"n.","detail":"构词: 构词: volt(伏特) + age(状态)<br>释义: 电压","example":"例句: Check the voltage carefully. ｜ 推导: 伏特 + 状态 = 电势差的度量"},{"word":"percentage","pos":"n.","detail":"构词: 构词: percent(百分) + age(结果)<br>释义: 百分比","example":"例句: What percentage passed the test? ｜ 推导: 百分 + 结果 = 比例的度量"},{"word":"heritage","pos":"n.","detail":"构词: 构词: heir(继承人) + age(结果)<br>释义: 遗产,传统","example":"例句: We must protect our heritage. ｜ 推导: 继承 + 结果 = 继承所得之物"},{"word":"cottage","pos":"n.","detail":"构词: 构词: cot(小屋) + age(集合)<br>释义: 村舍,小屋","example":"例句: They live in a cottage. ｜ 推导: 小屋 + 集合 = 小型房屋"},{"word":"stage","pos":"n.","detail":"构词: 构词: sta(站) + age(位置)<br>释义: 舞台;阶段","example":"例句: She is on the stage now. ｜ 推导: 站立 + 位置 = 表演的位置"}],"extra":[]},{"id":500,"root":"cent","pronounce":"/sent/瑟恩特","source":"拉丁语 centum","meaning":"百,百分之一","mnemonic":"cent可以从小学数学和货币单位一起记。1米等于100厘米，centimeter里的cent表示把1米分成100份；1美元等于100 cents，每一个cent也是整美元的百分之一。一个整体分成100份，每一份是百分之一，100份合起来就是一百。所以cent就是“百、百分之一”的意思。","mainWords":[{"word":"cent","pos":"n.","detail":"构词: 构词: cent(百分之一)<br>释义: 分(货币单位)","example":"例句: It costs fifty cents. ｜ 推导: 1美元的1/100 = 1 cent"},{"word":"century","pos":"n.","detail":"构词: 构词: cent(百) + ury(名词后缀)<br>释义: 世纪","example":"例句: The 21st century began in 2001. ｜ 推导: 百 + 名词化 = 一百年"},{"word":"percent","pos":"n.","detail":"构词: 构词: per(每) + cent(百)<br>释义: 百分之……","example":"例句: Fifty percent agreed. ｜ 推导: 每百中的份额 = 百分之"},{"word
