The mirror reflects light. ｜ 推导: 回 + 弯曲 = 光线折回,反射;思想折回,反思"},{"word":"reflection","pos":"n.","detail":"构词: 构词: reflect + ion(名词后缀)<br>释义: 反射;反思","example":"例句: After reflection, I agreed. ｜ 推导: 反射 + 名词化 = 反射现象;深思"},{"word":"flexible","pos":"a.","detail":"构词: 构词: flex(弯曲) + ible(可...的)<br>释义: 柔韧的;灵活的","example":"例句: Be flexible in your approach. ｜ 推导: 弯曲 + 可以的 = 可弯曲的,柔韧的"}],"extra":["inflexible a. 不可弯曲的;顽固的（构词: in(不) + flex + ible）","deflect v. 使偏斜（构词: de(离开) + flect）"]},{"id":145,"root":"fort-","pronounce":"/fɔːt/福特","source":"拉丁语 fortis","meaning":"强壮,力量","mnemonic":"fort就是“福特”。福特是著名汽车品牌，汽车要有坚固的车身和强大的动力才能行驶，所以fort就是“强壮,力量”的意思。","mainWords":[{"word":"fort","pos":"n.","detail":"构词: 构词: fort(强壮的防御)<br>释义: 要塞,堡垒","example":"例句: The soldiers defended the fort. ｜ 推导: 强壮 = 坚固的防御工事,要塞"},{"word":"force","pos":"n.","detail":"构词: 构词: fort(力) + ce<br>释义: 力量 v. 强迫","example":"例句: Don't use force to open it. ｜ 推导: 力量 = 物理力;强制力"},{"word":"enforce","pos":"v.","detail":"构词: 构词: en(使) + force(力)<br>释义: 执行;强制","example":"例句: Police enforce the law. ｜ 推导: 使 + 力量 = 强制执行"},{"word":"reinforce","pos":"v.","detail":"构词: 构词: re(再) + in + force<br>释义: 加强;增援","example":"例句: We need to reinforce the wall. ｜ 推导: 再 + 加强 = 增强力量"},{"word":"effort","pos":"n.","detail":"构词: 构词: ex(出) + fort(力)<br>释义: 努力;尽力","example":"例句: Make an effort to succeed. ｜ 推导: 出 + 力量 = 付出力量,努力"},{"word":"comfort","pos":"n./v.","detail":"构词: 构词: com(完全) + fort(强)<br>释义: 安慰;舒适","example":"例句: She tried to comfort him. ｜ 推导: 完全 + 强壮 = 给予力量,安慰"},{"word":"comfortable","pos":"a.","detail":"构词: 构词: comfort + able(可...的)<br>释义: 舒适的","example":"例句: This chair is very comfortable. ｜ 推导: 安慰 + 可...的 = 令人舒适的"}],"extra":[]},{"id":146,"root":"forth","pronounce":"/fɔːθ/福斯","source":"古英语 forð","meaning":"向前,往前","mnemonic":"forth的开头读音像“赴”。赴一个目的地，就是离开当前位置，朝前方走去；所以forth可以直接记成“向前、往前”。","mainWords":[{"word":"forth","pos":"ad.","detail":"构词: 构词: forth(向前)<br>释义: 向前;向外","example":"例句: Go forth and prosper. ｜ 推导: 向前 = 前进,向前"},{"word":"forthcoming","pos":"a.","detail":"构词: 构词: forth + coming(来)<br>释义: 即将到来的","example":"例句: The forthcoming election is important. ｜ 推导: 向前 + 来 = 即将到来的"},{"word":"henceforth","pos":"ad.","detail":"构词: 构词: hence(从此) + forth<br>释义: 从今以后","example":"例句: Henceforth, things will be different. ｜ 推导: 从此 + 向前 = 从今往后"},{"word":"thenceforth","pos":"ad.","detail":"构词: 构词: thence(从那时) + forth<br>释义: 从那时起","example":"例句: Thenceforth, he never looked back. ｜ 推导: 从那时 + 向前 = 从那时起"}],"extra":[]},{"id":147,"root":"gas","pronounce":"/gæs/盖斯","source":"","meaning":"气体","mnemonic":"gas就是我们平时说的“瓦斯”。 瓦斯就是一种气体，所以可以直接记住气体。 所以gas就是“气体”。","mainWords":[{"word":"gas","pos":"n.","detail":"构词: 构词: gas(源自chaos混沌)<br>释义: 气体;煤气;汽油","example":"例句: Natural gas is clean energy. ｜ 推导: 混沌 → 无序扩散的物质 = 气体"},{"word":"gasoline","pos":"n.","detail":"构词: 构词: gas + ol(油) + ine(化学后缀)<br>释义: 汽油","example":"例句: The car needs gasoline. ｜ 推导: 气体 + 油 = 可挥发的燃油,汽油"}],"extra":["gaseous a. 气体的;气态的（构词: gas + eous）","gassy a. 充满气体的（构词: gas + y）","gasify v. 使气化（构词: gas + ify）","degasify v. 除气,脱气（构词: de + gas + ify）","gas-powered a. 汽油驱动的（构词: gas + powered）","gasometer n. 煤气表（构词: gas + o + meter）"]},{"id":148,"root":"norm-","pronounce":"/nɔːm/恩奥姆","source":"拉丁语 norma","meaning":"规则,标准","mnemonic":"norm就是“挪木”。一根笔直的木尺被挪到物体旁边，用来检查它是否合乎尺寸和规则；我们共同采用的那把尺，就是标准。所以norm就是“规则、标准”。","mainWords":[{"word":"normal","pos":"a.","detail":"构词: 构词: norm(规则) + al(形容词后缀)<br>释义: 正常的","example":"例句: Everything seems normal today. ｜ 推导: 规则 + 形容词化 = 符合规则的,正常的"},{"word":"norm","pos":"n.","detail":"构词: 构词: norm(规则)<br>释义: 规范;标准","example":"例句: Social norms vary by culture. ｜ 推导: 规则 = 规范,标准"},{"word":"abnormal","pos":"a.","detail":"构词: 构词: ab(离开) + norm + al<br>释义: 不正常的","example":"例句: His behavior was abnormal. ｜ 推导: 离开 + 规则 + 形容词化 = 偏离常规的"},{"word":"enormous","pos":"a.","detail":"构词: 构词: e(出) + norm + ous<br>释义: 巨大的","example":"例句: The task was enormous. ｜ 推导: 出 + 规则 + 形容词化 = 超出常规的,巨大的"},{"word":"normalization","pos":"n.","detail":"构词: 构词: norm + al + ization<br>释义: 标准化","example":"例句: Data normalization is important. ｜ 推导: 规则 + 形容词 + 名词化 = 标准化过程"}],"extra":["normalize v. 使标准化（构词: norm + al + ize）","normally ad. 通常地（构词: norm + al + ly）","normative a. 规范的（构词: norm + ative）","subnormal a. 低于正常的（构词: sub + norm + al）"]},{"id":149,"root":"north","pronounce":"/nɔːθ/恩奥斯","source":"日耳曼语","meaning":"北方","mnemonic":"north本身就是我们小学学过的north。 north 就是“北方、北方的”。 所以north就是“北方”。","mainWords":[{"word":"north","pos":"n.","detail":"构词: 构词: north(北方)<br>释义: 北方 a.北方的","example":"例句: The wind comes from the north. ｜ 推导: 北方 = 北方,北部"},{"word":"northern","pos":"a.","detail":"构词: 构词: north + ern(形容词后缀)<br>释义: 北方的","example":"例句: Northern China is cold in winter. ｜ 推导: 北方 + 形容词化 = 北方的,北部的"},{"word":"northwest","pos":"n.","detail":"构词: 构词: north + west<br>释义: ⻄北","example":"例句: Seattle is in the northwest. ｜ 推导: 北方 + ⻄方 = ⻄北方向"},{"word":"northeast","pos":"n.","detail":"构词: 构词: north + east<br>释义: 东北","example":"例句: The storm came from northeast. ｜ 推导: 北方 + 东方 = 东北方向"}],"extra":["northward ad. 向北方（构词: north + ward(向)）","northernmost a. 最北的（构词: north + ern + most）","northerly a. 北方的（构词: north + erly）","northbound a. 北行的（构词: north + bound）"]},{"id":150,"root":"poe-/poet-","pronounce":"/poʊ/普欧","source":"希腊语 poiein","meaning":"制造,创造","mnemonic":"poe/poet就是“谱儿”。 把脑中的想法做成诗篇和作品，就是制造和创造。 所以poe/poet就是“制造、创造”。","mainWords":[{"word":"poet","pos":"n.","detail":"构词: 构词: poet(创造者)<br>释义: 诗人","example":"例句: The poet writes beautiful verses. ｜ 推导: 创造者 = 制造文字艺术的人"},{"word":"poem","pos":"n.","detail":"构词: 构词: poe(创造) + m<br>释义: 诗,韵文","example":"例句: She recited a beautiful poem. ｜ 推导: 创造 + 名词化 = 被创造的文字艺术品"},{"word":"poetry","pos":"n.","detail":"构词: 构词: poet + ry(名词后缀)<br>释义: 诗歌;诗意","example":"例句: Poetry expresses deep emotions. ｜ 推导: 创造者 + 艺术 = 诗歌艺术"}],"extra":["poetic a. 诗的,诗意的（构词: poet + ic）","poetical a. 诗歌的（构词: poet + ical）","poetess n. 女诗人（构词: poet + ess）","poetize v. 作诗（构词: poet + ize）"]},{"id":151,"root":"pur-","pronounce":"/pjʊər/普耶乌儿儿","source":"拉丁语 pūrus","meaning":"纯净,洁净","mnemonic":"pur就是“扑入”。把沾满灰尘的东西扑入清水中反复洗，杂质被冲走后，就会变得纯净、洁净。所以pur就是“纯净、洁净”。","mainWords":[{"word":"pure","pos":"a.","detail":"构词: 构词: pur(纯净) + e<br>释义: 纯的,纯净的","example":"例句: The water is pure and clean. ｜ 推导: 纯净 = 纯的,纯净的"},{"word":"purify","pos":"v.","detail":"构词: 构词: pur(纯净) + ify(使...化)<br>释义: 净化,提纯","example":"例句: We need to purify the air. ｜ 推导: 纯净 + 动词化 = 使纯净,净化"}],"extra":["purity n. 纯度;纯洁（构词: pur + ity）","purely ad. 纯粹地（构词: pure + ly）","impure a. 不纯的（构词: im(不) + pure）","purification n. 净化（构词: purify + ication）","purge v. 清除;净化（构词: pur + ge）"]},{"id":152,"root":"shop","pronounce":"/ʃɒp/诗奥普","source":"中古英语 shoppe","meaning":"商店,作坊,场所","mnemonic":"shop本身就是我们小学学过的shop。 shop 就是“商店、购物”。 所以shop就是“商店、作坊、场所”。","mainWords":[{"word":"shop","pos":"n.","detail":"构词: 构词: shop(商店)<br>释义: 商店 v.购物","example":"例句: I need to shop for groceries. ｜ 推导: 商店,购物场所"},{"word":"workshop","pos":"n.","detail":"构词: 构词: work(工作) + shop(场所)<br>释义: 车间;研讨会","example":"例句: We attended a writing workshop. ｜ 推导: 工作 + 场所 = 工作场所,车间"},{"word":"shopkeeper","pos":"n.","detail":"构词: 构词: shop + keeper(管理者)<br>释义: 店主","example":"例句: The shopkeeper was very friendly. ｜ 推导: 商店 + 管理者 = 店铺经营者"}],"extra":["shopping n. 购物（构词: shop + ing）","shopper n. 购物者（构词: shop + er）","barbershop n. 理发店（构词: barber + shop）","bookshop n. 书店（构词: book + shop）"]},{"id":153,"root":"sight","pronounce":"/saɪt/斯爱特","source":"古英语 sihþ","meaning":"看见,视觉","mnemonic":"SIGHT可以记成See It, Get How Things look。See It是看见它，Get How Things look是知道事物看起来怎样。能够看见并判断事物外观的能力，就是视觉；眼前看见的内容又是景象。所以sight就是“看见、视觉”的意思。","mainWords":[{"word":"sight","pos":"n.","detail":"构词: 构词: sight(看见)<br>释义: 视力;景象","example":"例句: The sight was breathtaking. ｜ 推导: 看见 = 视觉能力,所见之景"},{"word":"eyesight","pos":"n.","detail":"构词: 构词: eye(眼) + sight(视觉)<br>释义: 视力","example":"例句: His eyesight is getting worse. ｜ 推导: 眼 + 视觉 = 眼睛的视觉能力"},{"word":"insight","pos":"n.","detail":"构词: 构词: in(向内) + sight(看)<br>释义: 洞察力;见解","example":"例句: Her insight was remarkable. ｜ 推导: 向内 + 看 = 看透本质的能力"},{"word":"sightseeing","pos":"n.","detail":"构词: 构词: sight(景象) + seeing(看)<br>释义: 观光","example":"例句: We went sightseeing in Rome. ｜ 推导: 景象 + 看 = 观看风景的活动"}],"extra":["foresight n. 远见（构词: fore(前) + sight）","oversight n. 疏忽;监督（构词: over + sight）","hindsight n. 事后诸葛亮（构词: hind(后) + sight）","nearsighted a. 近视的（构词: near + sight + ed）"]},{"id":154,"root":"sym-/syn-","pronounce":"/sɪm/西姆；/sɪn/西恩","source":"希腊语 σύν","meaning":"共同,一起","mnemonic":"sym-/syn就是“same”。same就是“相同的”，其中最关键的意思可以继续联系到“共同”，由这个意思还可以继续推出一起，所以sym-/syn就是“共同,一起”的意思。","mainWords":[{"word":"sympathy","pos":"n.","detail":"构词: 构词: sym(共同) + pathy(感受)<br>释义: 同情","example":"例句: She expressed deep sympathy. ｜ 推导: 共同 + 感受 = 共同感受,同情"},{"word":"sympathetic","pos":"a.","detail":"构词: 构词: sympathy + etic(形容词后缀)<br>释义: 同情的","example":"例句: He was very sympathetic. ｜ 推导: 同情 + 形容词化 = 有同情心的"},{"word":"sympathize","pos":"v.","detail":"构词: 构词: sympathy + ize(动词后缀)<br>释义: 同情","example":"例句: I sympathize with you. ｜ 推导: 同情 + 动词化 = 表示同情"},{"word":"symphony","pos":"n.","detail":"构词: 构词: sym(共同) + phony(声音)<br>释义: 交响乐","example":"例句: Beethoven's Fifth Symphony. ｜ 推导: 共同 + 声音 = 声音共鸣,交响乐"},{"word":"symbol","pos":"n.","detail":"构词: 构词: sym(共同) + bol(投掷)<br>释义: 象征;符号","example":"例句: The dove is a symbol of peace. ｜ 推导: 共同 + 投掷 = 共同约定的符号"},{"word":"synthesis","pos":"n.","detail":"构词: 构词: syn(共同) + thesis(放置)<br>释义: 综合;合成","example":"例句: A synthesis of different ideas. ｜ 推导: 共同 + 放置 = 放在一起,合成"},{"word":"synthetic","pos":"a.","detail":"构词: 构词: synthesis + ic(形容词后缀)<br>释义: 合成的","example":"例句: Synthetic materials are common. ｜ 推导: 合成 + 形容词化 = 合成的,人造的"},{"word":"symposium","pos":"n.","detail":"构词: 构词: sym(共同) + pos(饮) + ium<br>释义: 研讨会","example":"例句: An academic symposium. ｜ 推导: 共同 + 饮用 = 共饮→研讨会"},{"word":"symptom","pos":"n.","detail":"构词: 构词: sym(共同) + ptom(降临)<br>释义: 症状","example":"例句: Fever is a common symptom. ｜ 推导: 共同 + 降临 = 疾病共同表现,症状"},{"word":"syndrome","pos":"n.","detail":"构词: 构词: syn(共同) + drome(奔跑)<br>释义: 综合征","example":"例句: Down syndrome is genetic. ｜ 推导: 共同 + 奔跑 = 症状共同出现,综合征"},{"word":"symmetry","pos":"n.","detail":"构词: 构词: sym(共同) + metry(测量)<br>释义: 对称","example":"例句: Perfect symmetry in nature. ｜ 推导: 共同 + 测量 = 测量一致,对称"}],"extra":[]},{"id":155,"root":"ven-/vent-","pronounce":"/ven/五诶恩","source":"拉丁语 venire","meaning":"来,到来","mnemonic":"ven和vent是同一组词根变体。为了记忆，可以把VEN记成“Visitors Enter Now”，把VENT记成“Visitors Enter New Town”。\n\nVisitors就是来访者；Enter表示进入；Now表示现在；New Town表示一个新的城镇。来访者现在从外面走进来，或者走进一个新的城镇，说明他已经来到这里、到达这里。\n\n两条口诀中的人物、方向和结果完全一致，只是ven少了末尾t，vent多了末尾t，核心画面不变。\n\n所以ven/vent就是“来、到来”的意思。","mainWords":[{"word":"event","pos":"n.","detail":"构词: 构词: e(出) + vent(来)<br>释义: 事件","example":"例句: A major event occurred yesterday. ｜ 推导: 出 + 来 = 发生出来的事,事件"},{"word":"prevent","pos":"v.","detail":"构词: 构词: pre(之前) + vent(来)<br>释义: 预防","example":"例句: Prevent problems before they occur. ｜ 推导: 之前 + 来 = 在来之前阻止,预防"},{"word":"eventually","pos":"ad.","detail":"构词: 构词: e + vent + ual + ly<br>释义: 最终","example":"例句: He eventually succeeded. ｜ 推导: 事件 + 形容词 + 副词 = 最终地"},{"word":"revenue","pos":"n.","detail":"构词: 构词: re(回) + ven(来) + ue<br>释义: 收入","example":"例句: Tax revenue increased this year. ｜ 推导: 回 + 来 = 回来的钱,收入"},{"word":"convention","pos":"n.","detail":"构词: 构词: con(一起) + vent(来) + ion<br>释义: 会议;惯例","example":"例句: The annual convention starts today. ｜ 推导: 一起 + 来 = 聚集到一起,会议"},{"word":"conventional","pos":"a.","detail":"构词: 构词: convention + al<br>释义: 传统的","example":"例句: He has conventional views. ｜ 推导: 惯例 + 形容词化 = 传统的,常规的"},{"word":"avenue","pos":"n.","detail":"构词: 构词: a(到) + ven(来) + ue<br>释义: 大道","example":"例句: They live on Fifth Avenue. ｜ 推导: 到 + 来 = 通向某处的路,大道"},{"word":"adventure","pos":"n.","detail":"构词: 构词: ad(到) + vent(来) + ure<br>释义: 冒险","example":"例句: Life is an adventure. ｜ 推导: 到 + 来 = 到未知处来,冒险"},{"word":"venture","pos":"v./n.","detail":"构词: 构词: vent(来) + ure<br>释义: 冒险","example":"例句: Nothing ventured, nothing gained. ｜ 推导: 来 + 名词化 = 敢于前来,冒险"},{"word":"invent","pos":"v.","detail":"构词: 构词: in(进入) + vent(来)<br>释义: 发明","example":"例句: Edison invented the light bulb. ｜ 推导: 进入 + 来 = 引入新事物,发明"},{"word":"inventory","pos":"n.","detail":"构词: 构词: invent(发明) + ory<br>释义: 清单","example":"例句: Check the inventory list. ｜ 推导: 发明物 + 名词后缀 = 物品清单"},{"word":"invention","pos":"n.","detail":"构词: 构词: invent + ion<br>释义: 发明","example":"例句: The invention changed the world. ｜ 推导: 发明 + 名词化 = 发明(物)"},{"word":"convenience","pos":"n.","detail":"构词: 构词: con(一起) + ven(来) + ience<br>释义: 便利","example":"例句: For your convenience. ｜ 推导: 一起 + 来 = 容易到达,便利"},{"word":"convenient","pos":"a.","detail":"构词: 构词: con + ven + ient<br>释义: 方便的","example":"例句: It's convenient to shop online. ｜ 推导: 便利 + 形容词化 = 方便的"},{"word":"intervene","pos":"v.","detail":"构词: 构词: inter(之间) + ven(来) + e<br>释义: 干预","example":"例句: Don't intervene in their dispute. ｜ 推导: 之间 + 来 = 来到中间,干预"},{"word":"advent","pos":"n.","detail":"构词: 构词: ad(到) + vent(来)<br>释义: 到来","example":"例句: The advent of spring. ｜ 推导: 到 + 来 = 到来,降临"}],"extra":[]},{"id":156,"root":"air","pronounce":"/eər/艾儿儿","source":"拉丁语 aer","meaning":"空气","mnemonic":"air本身就是我们小学学过的air。 air 就是“空气”。 所以air就是“空气”。","mainWords":[{"word":"air","pos":"n.","detail":"构词: 构词: air(空气)<br>释义: 空气","example":"例句: Fresh air is good for health. ｜ 推导: 空气 = 空气"},{"word":"airport","pos":"n.","detail":"构词: 构词: air(航空) + port(港口)<br>释义: 机场","example":"例句: We arrived at the airport early. ｜ 推导: 航空 + 港口 = 航空港,机场"},{"word":"airline","pos":"n.","detail":"构词: 构词: air(空) + line(线路)<br>释义: 航空公司","example":"例句: Which airline do you prefer? ｜ 推导: 空 + 线路 = 航线,航空公司"},{"word":"aircraft","pos":"n.","detail":"构词: 构词: air(空) + craft(航行器)<br>释义: 飞行器","example":"例句: Military aircraft flew overhead. ｜ 推导: 空 + 航行器 = 飞行器"},{"word":"airplane","pos":"n.","detail":"构词: 构词: air(空) + plane(平面)<br>释义: 飞机","example":"例句: The airplane landed safely. ｜ 推导: 空 + 平面 = 飞机"},{"word":"air-conditioning","pos":"n.","detail":"构词: 构词: air + conditioning(调节)<br>释义: 空调系统","example":"例句: Turn on the air-conditioning. ｜ 推导: 空气 + 调节 = 空调系统"}],"extra":["airborne a. 空运的;空中的（构词: air + borne(携带的)）","airway n. 航道;气道（构词: air + way）","airy a. 通风的;轻盈的（构词: air + y）","airfield n. 飞机场（构词: air + field）","airmail n. 航空邮件（构词: air + mail）","airship n. 飞艇（构词: air + ship）","aerial a. 空中的;航空的（构词: 来自aer + ial）","aeroplane n. 飞机(英式)（构词: aero + plane）"]},{"id":157,"root":"chair","pronounce":"/tʃeə(r)/吃艾儿儿","source":"希腊语座位","meaning":"座位,椅子","mnemonic":"chair本身就是我们小学学过的chair。 chair 就是“椅子、主席”。 所以chair就是“座位、椅子”。","mainWords":[{"word":"chair","pos":"n.","detail":"构词: 构词: chair(座位)<br>释义: 椅子;主席","example":"例句: Please take a chair. ｜ 推导: 座位 = 椅子;主持会议的位置"},{"word":"chairman","pos":"n.","detail":"构词: 构词: chair(主席位) + man(人)<br>释义: 主席;董事长","example":"例句: The chairman called the meeting. ｜ 推导: 主席位 + 人 = 坐主位的人,主席"}],"extra":["chairperson n. 主席(中性)（构词: chair + person）","chairwoman n. 女主席（构词: chair + woman）","wheelchair n. 轮椅（构词: wheel + chair）","armchair n. 扶手椅（构词: arm + chair）","chairmanship n. 主席职位（构词: chairman + ship）","co-chair n. 联合主席（构词: co + chair）"]},{"id":158,"root":"fair","pronounce":"/feər/夫艾儿儿","source":"古英语 fæger","meaning":"美丽的;公平的","mnemonic":"fair本身就是我们小学学过的fair。 fair 就是“公平的、美丽的”。 所以fair就是“美丽的；公平的”。","mainWords":[{"word":"fair","pos":"a.","detail":"构词: 构词: 古英语 fæger<br>释义: 公平的;美丽的","example":"例句: Life isn't always fair. ｜ 推导: 美丽的/公平的(古义合一)"},{"word":"fairly","pos":"ad.","detail":"构词: 构词: fair + ly(副词后缀)<br>释义: 公平地;相当地","example":"例句: The game was fairly played. ｜ 推导: 公平的 + 副词化 = 公平地"},{"word":"fairy","pos":"n.","detail":"构词: 构词: 古法语 faerie ← fæger<br>释义: 仙女;小精灵","example":"例句: The fairy granted her wish. ｜ 推导: 美丽的 → 美丽幻象的化身,仙女"}],"extra":["fairness n. 公平;公正（构词: fair + ness）","unfair a. 不公平的（构词: un + fair）","fairway n. 航道;球道（构词: fair + way）","fairytale n. 童话故事（构词: fairy + tale）"]},{"id":159,"root":"fid-","pronounce":"/fɪd/夫衣德","source":"拉丁语 fidere","meaning":"信任,信念,忠诚","mnemonic":"fid就是“非疑”。“非疑”就是不怀疑，对一个人不怀疑就是信任；长期信任并坚守这种信念，就是忠诚，所以fid就是“信任,信念,忠诚”的意思。","mainWords":[{"word":"confidence","pos":"n.","detail":"构词: 构词: con(完全) + fid(信任) + ence<br>释义: 信心;信任","example":"例句: I have confidence in you. ｜ 推导: 完全 + 信任 + 名词化 = 信心,信任"},{"word":"confident","pos":"a.","detail":"构词: 构词: con(完全) + fid(信任) + ent<br>释义: 自信的;确信的","example":"例句: She looks confident today. ｜ 推导: 完全 + 信任 + 形容词化 = 自信的"},{"word":"confidential","pos":"a.","detail":"构词: 构词: confident + ial(形容词后缀)<br>释义: 机密的;秘密的","example":"例句: This is confidential information. ｜ 推导: 自信的 + 形容词化 = 需要信任的,机密的"},{"word":"faith","pos":"n.","detail":"构词: 构词: fides → faith(古法语演变)<br>释义: 信念;信任;信仰","example":"例句: Have faith in yourself. ｜ 推导: 信任 → 信念,信仰"},{"word":"faithful","pos":"a.","detail":"构词: 构词: faith(信念) + ful(充满...的)<br>释义: 忠实的;可靠的","example":"例句: A faithful friend is precious. ｜ 推导: 信念 + 充满 = 充满信念的,忠实的"}],"extra":["fidelity n. 忠诚;保真度（构词: fid + elity）","infidel n. 异教徒（构词: in(否定) + fid + el）","confide v. 吐露;信任（构词: con + fid + e）","perfidy n. 背信弃义（构词: per(完全) + fid + y）"]},{"id":160,"root":"high","pronounce":"/haɪ/赫爱","source":"古英语 hēah","meaning":"高的","mnemonic":"high本身就是我们小学学过的high。 high 就是“高的、高高地”。 所以high就是“高的”。","mainWords":[{"word":"high","pos":"a.","detail":"构词: 构词: high(高)<br>释义: 高的 ad.高高地","example":"例句: The mountain is very high. ｜ 推导: 高 = 物理或抽象的高度"},{"word":"highly","pos":"ad.","detail":"构词: 构词: high + ly(副词后缀)<br>释义: 高度地;非常","example":"例句: She is highly respected. ｜ 推导: 高 + 副词化 = 高度地,非常"},{"word":"highland","pos":"n.","detail":"构词: 构词: high + land(土地)<br>释义: 高地,高原","example":"例句: Scottish Highlands are beautiful. ｜ 推导: 高 + 土地 = 高地,高原"},{"word":"highway","pos":"n.","detail":"构词: 构词: high + way(路)<br>释义: 公路,大路","example":"例句: Take the highway to save time. ｜ 推导: 高 + 路 = 主干道,高速公路"},{"word":"highlight","pos":"v.","detail":"构词: 构词: high + light(光)<br>释义: 强调 n.重点","example":"例句: Please highlight the main points. ｜ 推导: 高 + 光 = 高光,突出显示"}],"extra":["higher a. 更高的（构词: high + er）","highest a. 最高的（构词: high + est）","high-tech a. 高科技的（构词: high + tech）","height n. 高度 (high的名词形式)"]},{"id":161,"root":"imit-","pronounce":"/ɪmɪt/衣米特","source":"拉丁语 imitari","meaning":"模仿,仿效","mnemonic":"imit就是“imitate”。imitate会让人直接想到“模仿”，由这个意思还可以继续推出仿效，所以imit就是“模仿,仿效”的意思。","mainWords":[{"word":"imitate","pos":"v.","detail":"构词: 构词: imit(模仿) + ate(动词后缀)<br>释义: 模仿;仿效","example":"例句: Children often imitate their parents. ｜ 推导: 模仿 + 动词化 = 模仿,仿效"},{"word":"imitation","pos":"n.","detail":"构词: 构词: imit + ation(名词后缀)<br>释义: 模仿;仿制品","example":"例句: This is just an imitation leather. ｜ 推导: 模仿 + 名词化 = 模仿行为,仿制品"}],"extra":["imitative a. 模仿的（构词: imit + ative）","imitator n. 模仿者（构词: imit + ator）","inimitable a. 无法模仿的（构词: in + imit + able）","imitable a. 可模仿的（构词: imit + able）"]},{"id":162,"root":"limit","pronounce":"/ˈlɪmɪt/利米特","source":"拉丁语 limes","meaning":"界限,限制","mnemonic":"limit可以按读音想成“立门”。在一块区域边上立起一道门，门所在的位置就划出了界限；门不开时，人也不能继续通过，形成限制。所以limit就是“界限、限制”。","mainWords":[{"word":"limit","pos":"n.","detail":"构词: 构词: limit(界限)<br>释义: 限制;界限 v.限制","example":"例句: There's a limit to my patience. ｜ 推导: 界限 = 限制,边界"},{"word":"limited","pos":"a.","detail":"构词: 构词: limit + ed(被动形容词)<br>释义: 有限的","example":"例句: Resources are limited. ｜ 推导: 限制 + 被动 = 被限制的,有限的"},{"word":"limitation","pos":"n.","detail":"构词: 构词: limit + ation(结果状态)<br>释义: 限制;缺陷","example":"例句: Know your limitations. ｜ 推导: 限制 + 名词化 = 限制状态,局限性"}],"extra":["unlimited a. 无限的（构词: un + limit + ed）","limiting a. 限制性的（构词: limit + ing）","limitless a. 无限的（构词: limit + less）","delimit v. 划定界限（构词: de + limit）"]},{"id":163,"root":"liter-","pronounce":"/ˈlɪtər/利特儿","source":"拉丁语 littera","meaning":"字母,文字,书写；字母,文字","mnemonic":"liter与小学词letter形近音近。letter 是一个字母，许多字母连起来组成文字，再把文字落到纸上就是书写。所以liter就是“字母、文字、书写”。","mainWords":[{"word":"literature","pos":"n.","detail":"构词: 构词: liter(文字) + ature(名词后缀)<br>释义: 文学;文献","example":"例句: She studies English literature. ｜ 推导: 文字 + 产物 = 文字创作的总和,文学"},{"word":"literally","pos":"ad.","detail":"构词: 构词: liter(文字) + ally(副词后缀)<br>释义: 字面上;确实","example":"例句: I was literally freezing. ｜ 推导: 文字 + 副词化 = 按字面地,确实地"},{"word":"literary","pos":"a.","detail":"构词: 构词: liter(文字) + ary(形容词后缀)<br>释义: 文学的;书面的","example":"例句: He won a literary award. ｜ 推导: 文字 + 形容词化 = 与文学相关的"},{"word":"literacy","pos":"n.","detail":"构词: 构词: liter(文字) + acy(能力后缀)<br>释义: 读写能力","example":"例句: Adult literacy is improving. ｜ 推导: 文字 + 能力 = 识字读写的能力"},{"word":"illiterate","pos":"a.","detail":"构词: 构词: il(否定) + liter + ate<br>释义: 文盲的;无知的","example":"例句: Many adults remain illiterate. ｜ 推导: 不 + 文字 + 形容词化 = 不识字的,文盲的"},{"word":"literature","pos":"n.","detail":"构词: 构词: liter(文字) + ature(抽象名词后缀)<br>释义: 文学","example":"例句: She studies English literature. ｜ 推导: 文字 + 艺术集合 = 文学"},{"word":"literally","pos":"ad.","detail":"构词: 构词: liter(字母) + al + ly(副词后缀)<br>释义: 照字面地;确实","example":"例句: I literally ran all the way. ｜ 推导: 按字母 + 副词化 = 逐字地,确实地"},{"word":"literary","pos":"a.","detail":"构词: 构词: liter(文字) + ary(形容词后缀)<br>释义: 文学的","example":"例句: He has literary talent. ｜ 推导: 文字 + 形容词化 = 文学的,文字的"},{"word":"literacy","pos":"n.","detail":"构词: 构词: liter(字母) + acy(能力后缀)<br>释义: 读写能力","example":"例句: Adult literacy is improving. ｜ 推导: 字母 + 能力 = 识字能力,读写能力"},{"word":"illiterate","pos":"a.","detail":"构词: 构词: il(否定) + liter(字母) + ate<br>释义: 文盲的 n.文盲","example":"例句: He was completely illiterate. ｜ 推导: 不 + 识字的 = 文盲的,不识字的"}],"extra":["literate a. 有读写能力的（构词: liter + ate）","literal a. 字面的;逐字的（构词: liter + al）","literal a. 字面的,逐字的（构词: liter + al）","literate a. 有文化的（构词: liter + ate）"]},{"id":164,"root":"min-/ministr-","pronounce":"/mɪn/米恩","source":"","meaning":"服务,管理","mnemonic":"ministr就是“忙你事儿”。替你忙事情，就是为你服务；把许多人的事情分好、安排好，就是管理。min是它缩短后的形式，所以min/ministr就是“服务、管理”。","mainWords":[{"word":"minister","pos":"n.","detail":"构词: 构词: min(服务) + ister(人)<br>释义: 部长;牧师","example":"例句: The minister announced new policies. ｜ 推导: 服务 + 人 = 服务者,部长"},{"word":"ministry","pos":"n.","detail":"构词: 构词: minister + y(名词后缀)<br>释义: 部;内阁","example":"例句: She works in the Ministry of Education. ｜ 推导: 部长 + 机构 = 政府部门"},{"word":"administer","pos":"v.","detail":"构词: 构词: ad(向) + minister(服务)<br>释义: 管理;执行","example":"例句: They administer the program efficiently. ｜ 推导: 向 + 服务 = 执行服务,管理"},{"word":"administration","pos":"n.","detail":"构词: 构词: administer + ation(名词后缀)<br>释义: 管理;政府","example":"例句: The new administration took office. ｜ 推导: 管理 + 名词化 = 行政管理,政府"}],"extra":["administrative a. 管理的（构词: administer + ative）","administrator n. 管理者（构词: administer + or）","ministerial a. 部长的（构词: minister + ial）","administrate v. 管理（构词: ad + ministr + ate）","maladminister v. 管理不善（构词: mal + administer）","administrable a. 可管理的（构词: administer + able）"]},{"id":165,"root":"","pronounce":"/ˈneɪbər/恩诶伯儿","source":"","meaning":"邻居,附近的人","mnemonic":"方法一： neighbor可以记成near brother。 near 是“附近”，brother 是“兄弟”。 住在附近、像兄弟一样经常见面的人，就是邻居和附近的人。 所以neighbor就是“邻居、附近的人”。 方法二： neighbor就是“那边儿”。住在自己家那边、距离很近的人，就是邻居；邻居所在的位置也就在附近。所以neighbor就是“邻居、附近的人”。","mainWords":[{"word":"neighbor","pos":"n.","detail":"释义: 邻居","example":"例句: Love thy neighbor as thyself. ｜ 推导: 附近 + 居住者 = 住在附近的人"},{"word":"neighborhood","pos":"n.","detail":"构词: 构词: neighbor + hood(区域后缀)<br>释义: 社区;街坊","example":"例句: It's a friendly neighborhood. ｜ 推导: 邻居 + 区域 = 邻里聚居的地方"}],"extra":["neighboring a. 邻近的（构词: neighbor + ing）","neighborly a. 友好的（构词: neighbor + ly）","good-neighborliness n. 睦邻友好","next-door neighbor n. 隔壁邻居"]},{"id":166,"root":"nom-/noun-","pronounce":"/naʊn/恩奥恩","source":"拉丁语 nomen","meaning":"名字,名称","mnemonic":"nom与小学词 name 形近音近。name 就是名字和名称；noun是同一词根的另一种展开形式。所以nom/noun就是“名字、名称”。","mainWords":[{"word":"noun","pos":"n.","detail":"构词: 构词: noun(名称)<br>释义: 名词","example":"例句: A noun is a naming word. ｜ 推导: 名称 = 用于命名的词,名词"},{"word":"pronoun","pos":"n.","detail":"构词: 构词: pro(替代) + noun(名词)<br>释义: 代词","example":"例句: He is a pronoun for John. ｜ 推导: 替代 + 名词 = 代替名词的词,代词"}],"extra":["nominal a. 名义上的（构词: nom + inal）","nominate v. 提名（构词: nom + inate）","denomination n. 命名;面额（构词: de + nom + ination) nominee n.被提名人 (nom + inee）","nomenclature n. 命名法（构词: nom + enclature）","renown n. 声名（构词: re + nown）"]},{"id":167,"root":"nounce","pronounce":"/naʊns/恩奥恩斯","source":"拉丁语 nuntiare","meaning":"报告,宣告","mnemonic":"nounce就是“闹声”。一个人把消息大声闹出来，让周围人都听见，就是在报告和宣告。所以nounce就是“报告、宣告”。","mainWords":[{"word":"announce","pos":"v.","detail":"构词: 构词: an(ad-向) + nounce(报告)<br>释义: 宣布,宣告","example":"例句: They announced the results. ｜ 推导: 向 + 报告 = 向公众报告,宣布"},{"word":"pronounce","pos":"v.","detail":"构词: 构词: pro(向前) + nounce(报告)<br>释义: 发音;宣判","example":"例句: How do you pronounce this word? ｜ 推导: 向前 + 报告 = 正式发声,发音"},{"word":"denounce","pos":"v.","detail":"构词: 构词: de(向下) + nounce(报告)<br>释义: 谴责,告发","example":"例句: They denounced the corruption. ｜ 推导: 向下 + 报告 = 负面报告,谴责"}],"extra":["announcement n. 公告,宣布（构词: announce + ment) announcer n.播音员 (announce + er）","pronunciation n. 发音（构词: pronounce + iation）","renounce v. 放弃,否认（构词: re(反) + nounce）"]},{"id":168,"root":"nuc-","pronounce":"/njuːk/恩耶乌克","source":"拉丁语 nux (坚果)","meaning":"核,果核","mnemonic":"方法一： nuc-就是“纽扣”。 切开一个 fruit，会以后看到 middle 有一块 hard、round 的东西，就像果肉里藏着一颗小纽扣。 这块硬东西就是果核；处在最中间、最关键的位置，又可以表示核心。 所以nuc-就是“核、果核、核心”。","mainWords":[{"word":"nucleus","pos":"n.","detail":"构词: 构词: nuc(核) + le + us(名词后缀)<br>释义: 核;核心","example":"例句: The nucleus controls the cell. ｜ 推导: 核 + 名词化 = 核心,细胞核"},{"word":"nuclear","pos":"a.","detail":"构词: 构词: nucle(核) + ar(形容词后缀)<br>释义: 核的;核能的","example":"例句: Nuclear energy is powerful. ｜ 推导: 核 + 形容词化 = 核的,核能的"}],"extra":["nuclei n. 核(复数)（构词: nucle + i）","nucleon n. 核子（构词: nucle + on）","nucleic a. 核的（构词: nucle + ic）","nucleate v. 成核（构词: nucle + ate）","enucleate v. 去核（构词: e + nucle + ate）"]},{"id":169,"root":"nut","pronounce":"/nʌt/恩阿特","source":"古英语 hnutu","meaning":"坚果","mnemonic":"nut就是小学学过的单词，拼写和读音都不用变化。nut 是坚果，所以nut就是“坚果”。","mainWords":[{"word":"nut","pos":"n.","detail":"构词: 构词: nut(坚果)<br>释义: 坚果;螺母","example":"例句: Squirrels collect nuts for winter. ｜ 推导: 坚果 = 硬壳果实"},{"word":"peanut","pos":"n.","detail":"构词: 构词: pea(豆) + nut(坚果)<br>释义: 花生","example":"例句: Peanut butter is very popular. ｜ 推导: 豆 + 坚果 = 豆状的坚果,花生"}],"extra":["nutshell n. 坚果壳;简明扼要（构词: nut + shell）","walnut n. 核桃（构词: wal + nut）","chestnut n. 栗子（构词: chest + nut）","coconut n. 椰子（构词: coco + nut）","hazelnut n. 榛子（构词: hazel + nut）","doughnut n. 甜甜圈（构词: dough + nut）"]},{"id":170,"root":"pair","pronounce":"/peər/普艾儿儿","source":"拉丁语 paria","meaning":"成对,相等","mnemonic":"pair本身就是我们小学学过的pair。 pair 就是“一对、一双”。 所以pair就是“成对、相等”。","mainWords":[{"word":"pair","pos":"n.","detail":"构词: 构词: pair(成对)<br>释义: 一对,一双","example":"例句: A pair of shoes. ｜ 推导: 成对 = 一对,一双"},{"word":"impair","pos":"v.","detail":"构词: 构词: im(不) + pair(相等)<br>释义: 损害,削弱","example":"例句: Smoking impairs health. ｜ 推导: 不 + 相等 = 使不平衡,损害"}],"extra":["repair v. 修理（构词: re(重新) + pair）","compare v. 比较（构词: com(共同) + par）","disparity n. 差异（构词: dis(分离) + par + ity）","parity n. 平等（构词: par + ity）","au pair n. 互惠生 (法语:平等的)","pairing n. 配对（构词: pair + ing）"]},{"id":171,"root":"par-/pare-","pronounce":"/pɛər/普诶额儿","source":"拉丁语 parere","meaning":"出现,显现,生产","mnemonic":"par完整保留在小学词parent的开头，pare只是末尾多一个 e 的近形变体。parent 会让新的孩子出生、生产出新的生命；孩子出生以后，也从原来看不见的状态显现、出现在世界上。所以par/pare就是“出现、显现、生产”。","mainWords":[{"word":"parent","pos":"n.","detail":"构词: 构词: par(生产) + ent(人)<br>释义: 父母","example":"例句: My parents are very supportive. ｜ 推导: 生产 + 人 = 生产孩子的人,父母"},{"word":"apparent","pos":"a.","detail":"构词: 构词: ap(向) + par(出现) + ent<br>释义: 明显的","example":"例句: The answer is apparent to all. ｜ 推导: 向 + 出现 = 向外显现的,明显的"},{"word":"transparent","pos":"a.","detail":"构词: 构词: trans(穿过) + par(出现) + ent<br>释义: 透明的","example":"例句: The glass is transparent. ｜ 推导: 穿过 + 出现 = 光线穿透显现,透明的"}],"extra":["apparently ad. 显然地（构词: apparent + ly）","transparency n. 透明度（构词: transparent + cy）","parental a. 父母的（构词: parent + al）","appearance n. 外表;出现（构词: ap + pear + ance）"]},{"id":172,"root":"pare","pronounce":"/peər/普艾儿儿","source":"拉丁语 parare","meaning":"准备,安排","mnemonic":"pare是我们小学学过的词prepare的一部分。 prepare 就是“准备”。 在这个词里，负责表达“准备”这一层意思的部分就是pare。 所以pare就是“准备、安排”。","mainWords":[{"word":"prepare","pos":"v.","detail":"构词: 构词: pre(提前) + pare(准备)<br>释义: 准备","example":"例句: Prepare for the exam carefully. ｜ 推导: 提前 + 准备 = 预先准备"},{"word":"compare","pos":"v.","detail":"构词: 构词: com(共同) + par(准备) + e<br>释义: 比较","example":"例句: Compare these two options. ｜ 推导: 共同 + 准备 = 并列准备,对比"},{"word":"repair","pos":"v.","detail":"构词: 构词: re(再) + pair(准备)<br>释义: 修理","example":"例句: He repaired the broken chair. ｜ 推导: 再 + 准备 = 重新准备,修复"},{"word":"spare","pos":"v.","detail":"构词: 构词: s + par(准备) + e<br>释义: 节省;宽恕","example":"例句: Can you spare some time? ｜ 推导: 准备 → 预留备用,节省"}],"extra":["preparation n. 准备（构词: prepare + ation）","comparative a. 比较的（构词: compare + ative）","reparation n. 赔偿;修理（构词: re + par + ation）","separate v. 分离（构词: se(分开) + par + ate）","apparatus n. 设备（构词: ap(向) + par + atus）","comparison n. 比较（构词: compare + ison）"]},{"id":173,"root":"schol-","pronounce":"/skɒl/斯克奥勒","source":"希腊语 σχολή","meaning":"闲暇,学习","mnemonic":"schol就是“school”。school就是“学校，学院”，其中最关键的意思可以继续联系到“闲暇”，由这个意思还可以继续推出学习，所以schol就是“闲暇,学习”的意思。","mainWords":[{"word":"school","pos":"n.","detail":"构词: 构词: schol(学习场所)<br>释义: 学校;学派","example":"例句: She goes to school every day. ｜ 推导: 闲暇学习之地 = 学校"},{"word":"scholar","pos":"n.","detail":"构词: 构词: schol + ar(人)<br>释义: 学者;奖学金获得者","example":"例句: He is a distinguished scholar. ｜ 推导: 从事学术之人 = 学者"},{"word":"scholarship","pos":"n.","detail":"构词: 构词: scholar + ship(状态/资助)<br>释义: 奖学金;学识","example":"例句: She won a full scholarship. ｜ 推导: 学者之道/资助 = 学识/奖学金"}],"extra":["scholastic a. 学术的（构词: schol + astic）","schooling n. 学校教育（构词: school + ing）","scholarly a. 博学的（构词: scholar + ly）","preschool n. 学前班（构词: pre + school）"]},{"id":174,"root":"seem","pronounce":"/siːm/斯衣姆","source":"古诺尔斯语","meaning":"看似,显得","mnemonic":"seem就是“似么”。 问一个东西“似么”，就是在判断它看起来是否相似、显得怎样。 所以seem就是“看似、显得”。","mainWords":[{"word":"seem","pos":"v.","detail":"构词: 构词: seem(看似)<br>释义: 看似,似乎","example":"例句: Things are not what they seem. ｜ 推导: 看似 = 表面呈现的样子"},{"word":"seemingly","pos":"ad.","detail":"构词: 构词: seem + ing + ly(副词后缀)<br>释义: 表面上,看似","example":"例句: A seemingly simple task. ｜ 推导: 看似 + 副词化 = 表面上地,看似地"}],"extra":["seeming a. 表面的,外观的（构词: seem + ing）","seemly a. 适当的,得体的（构词: seem + ly）","unseemly a. 不适当的（构词: un + seem + ly）","beseem v. 适合,适宜（构词: be + seem）"]},{"id":175,"root":"sil-","pronounce":"/sɪl/西勒","source":"拉丁语 silēre","meaning":"安静,寂静","mnemonic":"sil就是“熄了”。 声音和动静都熄了，周围就会安静、寂静。 所以sil就是“安静、寂静”。","mainWords":[{"word":"silence","pos":"n.","detail":"构词: 构词: sil(安静) + ence(名词后缀)<br>释义: 寂静;沉默","example":"例句: The silence was deafening. ｜ 推导: 安静 + 名词化 = 寂静的状态"},{"word":"silent","pos":"a.","detail":"构词: 构词: sil(安静) + ent(形容词后缀)<br>释义: 安静的;沉默的","example":"例句: She remained silent. ｜ 推导: 安静 + 形容词化 = 保持安静的"}],"extra":["silently ad. 安静地（构词: silent + ly）","silencer n. 消音器（构词: silence + r）","silentium n. 静默期 (拉丁语原词)","silencing n. 消音（构词: silence + ing）","unsilent a. 不安静的（构词: un + silent）"]},{"id":176,"root":"-sist-","pronounce":"/sist/斯衣斯特","source":"拉丁语 sistere","meaning":"站立,维持","mnemonic":"方法一：sist就是“死死stand”。 死死站在原地，就能维持位置和状态。 所以sist就是“站立、维持”。  方法二：为了记忆，可以把SIST记成“Stand In Same place, Tight”。\n\nStand表示站立；In Same place表示始终留在同一个位置；Tight表示站得很稳，不轻易被推走。\n\n一个人牢牢站在原地，就是保持位置；一个状态一直不变，也像始终站在同一个地方。整个画面始终围绕“站住并维持”。\n\n所以sist就是“站立、维持、使保持”的意思。","mainWords":[{"word":"insist","pos":"v.","detail":"构词: 构词: in(加强) + sist(站立)<br>释义: 坚持","example":"例句: I insist on my opinion. ｜ 推导: 加强 + 站立 = 坚定站立,坚持"},{"word":"consist","pos":"v.","detail":"构词: 构词: con(共同) + sist(站立)<br>释义: 组成;一致","example":"例句: The team consists of experts. ｜ 推导: 共同 + 站立 = 共同组成整体"},{"word":"resist","pos":"v.","detail":"构词: 构词: re(反对) + sist(站立)<br>释义: 抵抗","example":"例句: They resist the change. ｜ 推导: 反对 + 站立 = 对立场,抵抗"},{"word":"assist","pos":"v.","detail":"构词: 构词: as(朝向) + sist(站立)<br>释义: 帮助","example":"例句: Can I assist you? ｜ 推导: 朝向 + 站立 = 站到身旁,帮助"},{"word":"persist","pos":"v.","detail":"构词: 构词: per(贯穿) + sist(站立)<br>释义: 坚持;持续","example":"例句: The rain persisted all day. ｜ 推导: 贯穿 + 站立 = 始终站立,持续"},{"word":"assistance","pos":"n.","detail":"构词: 构词: assist + ance(名词后缀)<br>释义: 援助","example":"例句: Thank you for your assistance. ｜ 推导: 帮助 + 名词化 = 援助"},{"word":"assistant","pos":"n.","detail":"构词: 构词: assist + ant(人)<br>释义: 助手","example":"例句: She is my assistant. ｜ 推导: 帮助 + 人 = 提供帮助的人,助手"},{"word":"resistance","pos":"n.","detail":"构词: 构词: resist + ance(名词后缀)<br>释义: 抵抗力","example":"例句: Build up your resistance. ｜ 推导: 抵抗 + 名词化 = 抵抗力"},{"word":"resistant","pos":"a.","detail":"构词: 构词: resist + ant(形容词后缀)<br>释义: 抵抗的","example":""},{"word":"consistent","pos":"a.","detail":"构词: 构词: con + sist + ent(形容词后缀)<br>释义: 一致的","example":""}],"extra":[]},{"id":177,"root":"sky","pronounce":"/skaɪ/斯克爱","source":"古诺尔斯语 ský","meaning":"天空,云","mnemonic":"sky本身就是我们小学学过的sky。 sky 就是“天空、天气”。 所以sky就是“天空、云”。","mainWords":[{"word":"sky","pos":"n.","detail":"构词: 构词: sky(天空)<br>释义: 天空;天气","example":"例句: The sky is clear today. ｜ 推导: 天空 = 头顶上方的空间"},{"word":"skyscraper","pos":"n.","detail":"构词: 构词: sky + scrape(刮) + er<br>释义: 摩天大楼","example":"例句: The city has many skyscrapers. ｜ 推导: 天空 + 刮 + 物 = 刮到天空的建筑"}],"extra":["skyline n. 天际线（构词: sky + line）","skylight n. 天窗（构词: sky + light）","skydive v. 跳伞（构词: sky + dive）","skyward ad. 向天空（构词: sky + ward）","skywalk n. 天桥（构词: sky + walk）","skyway n. 航线（构词: sky + way）","skylark n. 云雀（构词: sky + lark）","skyrocket v. 飞涨（构词: sky + rocket）","skywriting n. 空中文字（构词: sky + writing）","sky-high a. 极高的（构词: sky + high）"]},{"id":178,"root":"stab-/stabl-","pronounce":"/stæb/斯泰布","source":"拉丁语 stabilis","meaning":"稳定,固定,坚固","mnemonic":"stabl可以拆成s＋table。table 是小学词“桌子”，前面加上 s 后仍完整保留 table 的字母；一张四条腿稳稳站住的桌子，不会摇动，位置固定而坚固。所以stab/stabl就是“稳定、固定、坚固”。","mainWords":[{"word":"stable","pos":"a.","detail":"构词: 构词: stabl(稳定) + e<br>释义: 稳定的;n.马厩","example":"例句: The economy remains stable. ｜ 推导: 稳定的 = 固定的,稳固的"},{"word":"establish","pos":"v.","detail":"构词: 构词: e(使) + stabl(稳定) + ish<br>释义: 建立;确立","example":"例句: They established a new company. ｜ 推导: 使 + 稳定 = 使稳固,建立"},{"word":"establishment","pos":"n.","detail":"构词: 构词: establish + ment(名词后缀)<br>释义: 建立;机构","example":"例句: A business establishment opened. ｜ 推导: 建立 + 名词化 = 建立的机构"},{"word":"stability","pos":"n.","detail":"构词: 构词: stabil(稳定) + ity(性质)<br>释义: 稳定性","example":"例句: Political stability is crucial. ｜ 推导: 稳定 + 性质 = 稳定性"}],"extra":["stabilize v. 使稳定（构词: stabil + ize）","unstable a. 不稳定的（构词: un + stable）","instability n. 不稳定性（构词: in + stability）","stabilization n. 稳定化（构词: stabil + ization）","destabilize v. 破坏稳定（构词: de + stabilize）","stabilizer n. 稳定器（构词: stabil + izer）"]},{"id":179,"root":"stair","pronounce":"/steər/斯特艾儿儿","source":"古英语 stæger","meaning":"楼梯,台阶","mnemonic":"stair本身就是我们小学学过的stair。 stair 就是“楼梯”。 所以stair就是“楼梯、台阶”。","mainWords":[{"word":"stair","pos":"n.","detail":"构词: 构词: stair(楼梯)<br>释义: 楼梯","example":"例句: Be careful on the stairs. ｜ 推导: 楼梯 = 供人上下的台阶"},{"word":"upstairs","pos":"ad.","detail":"构词: 构词: up(向上) + stairs<br>释义: 楼上","example":"例句: She went upstairs to sleep. ｜ 推导: 向上 + 楼梯 = 在楼上,往楼上"},{"word":"downstairs","pos":"ad.","detail":"构词: 构词: down(向下) + stairs<br>释义: 楼下","example":"例句: The kitchen is downstairs. ｜ 推导: 向下 + 楼梯 = 在楼下,往楼下"},{"word":"staircase","pos":"n.","detail":"构词: 构词: stair + case(箱子,空间)<br>释义: 楼梯间","example":"例句: A spiral staircase is beautiful. ｜ 推导: 楼梯 + 空间 = 楼梯所在的空间"}],"extra":["stairway n. 楼梯道（构词: stair + way(道路)）","stairwell n. 楼梯井（构词: stair + well(井)）","backstair n. 后楼梯（构词: back + stair）","stairhead n. 楼梯顶端（构词: stair + head）"]},{"id":180,"root":"stereo-","pronounce":"/ˈsteriəʊ/斯特诶儿衣欧","source":"希腊语 stereós","meaning":"固体的,立体的","mnemonic":"stereo本身就是我们熟悉的stereo。stereo就是立体声，立体的东西不是薄薄的一面，而是有厚度、有空间的固体，所以stereo就是“固体的,立体的”的意思。","mainWords":[{"word":"stereo","pos":"n.","detail":"构词: 构词: stereo(立体)<br>释义: 立体声;立体声装置","example":"例句: I bought a new stereo system. ｜ 推导: 立体 = 立体声音响系统"},{"word":"stereotype","pos":"n.","detail":"构词: 构词: stereo(固定) + type(类型)<br>释义: 刻板印象;陈规","example":"例句: Don't judge by stereotypes. ｜ 推导: 固定 + 类型 = 固定的印象,刻板印象"}],"extra":["stereotypical a. 刻板的（构词: stereotype + ical）","stereoscope n. 立体镜（构词: stereo + scope）","stereophonic a. 立体声的（构词: stereo + phonic）","stereographic a. 立体的（构词: stereo + graphic）","stereometry n. 立体几何（构词: stereo + metry）","stereochemistry n. 立体化学 (stereo + chemistry","stereotyping n. 定型;铅版印刷（构词: stereotype + ing)stereotyped a.老套的 (stereotype + ed）","stereovision n. 立体视觉（构词: stereo + vision）","stereogram n. 立体图（构词: stereo + gram）"]},{"id":181,"root":"sum-","pronounce":"/sʌm/斯阿姆","source":"拉丁语 summus；拉丁语 sumere","meaning":"最高点,顶端,总和；拿取","mnemonic":"1.sum是数学里天天见到的求和，许多数加在一起得到total，所以sum就是“总和”。2.summit是山最高的顶端，可以把sum理解为所有高度加到最高点，所以sum还有“最高点、顶端”的意思。3.要把许多东西加成一个总和，先要把它们全部take到一起，因此sum还可以引出“拿取”。综上，sum就是“最高点、顶端、总和；拿取”的意思。","mainWords":[{"word":"summit","pos":"n.","detail":"构词: 构词: summ(最高) + it<br>释义: 顶点;峰会","example":"例句: They reached the summit at dawn. ｜ 推导: 最高 + 名词化 = 最高点,山顶,峰会"},{"word":"sum","pos":"n.","detail":"构词: 构词: sum(总和)<br>释义: 总数;金额 v.总结","example":"例句: The sum of 2 and 3 is 5. ｜ 推导: 总和 = 所有部分加到一起的结果"},{"word":"summary","pos":"n.","detail":"构词: 构词: summ(总和) + ary(名词后缀)<br>释义: 摘要;概要","example":"例句: Write a brief summary. ｜ 推导: 总和 + 名词化 = 要点的总和,摘要"},{"word":"summarize","pos":"v.","detail":"构词: 构词: summary + ize(动词后缀)<br>释义: 概括;总结","example":"例句: Can you summarize the article? ｜ 推导: 摘要 + 动词化 = 做摘要,概括总结"},{"word":"assume","pos":"v.","detail":"构词: 构词: as(向) + sum(拿取) + e<br>释义: 假设;承担","example":"例句: Don't assume he knows the truth. ｜ 推导: 向着 + 拿取 = 拿来当成真的,假设"},{"word":"assumption","pos":"n.","detail":"构词: 构词: assume + tion(名词后缀)<br>释义: 假设;承担","example":"例句: That's a reasonable assumption. ｜ 推导: 假设 + 名词化 = 假设,假定"},{"word":"consume","pos":"v.","detail":"构词: 构词: con(完全) + sum(拿取) + e<br>释义: 消耗;消费","example":"例句: Fire consumed the building. ｜ 推导: 完全 + 拿取 = 完全拿走,消耗"},{"word":"consumption","pos":"n.","detail":"构词: 构词: consume + tion(名词后缀)<br>释义: 消费;消耗","example":"例句: Reduce energy consumption. ｜ 推导: 消耗 + 名词化 = 消耗量,消费"},{"word":"resume","pos":"v.","detail":"构词: 构词: re(重新) + sum(拿取) + e<br>释义: 恢复 n.简历","example":"例句: Submit your resume online. ｜ 推导: 重新 + 拿取 = 重新拿起,恢复"},{"word":"presume","pos":"v.","detail":"构词: 构词: pre(预先) + sum(拿取) + e<br>释义: 推定;假定","example":"例句: I presume you're right. ｜ 推导: 预先 + 拿取 = 预先认定,推定"},{"word":"presumably","pos":"ad.","detail":"构词: 构词: presume + ably(副词后缀)<br>释义: 大概;据推测","example":"例句: Presumably, he has left. ｜ 推导: 推定 + 副词化 = 据推测,大概"}],"extra":["summation n. 总和;总结（构词: summ + ation）","summon v. 召唤;召集（构词: summ + on）","consummate a. 完美的（构词: con + summ + ate）","summarily ad. 概括地（构词: summary + ly）"]},{"id":182,"root":"tabula","pronounce":"/ˈteɪbl/特诶布勒","source":"拉丁语 tabula","meaning":"平板,平面","mnemonic":"tabula可以直接想到我们小学学过的table。 table 就是“桌子、表格”。 桌面和表格都像一块展开的平板和平面。 所以tabula就是“平板、平面”。","mainWords":[{"word":"table","pos":"n.","detail":"构词: 构词: tabula(平板) → table<br>释义: 桌子;表格","example":"例句: Put the book on the table. ｜ 推导: 平板 → 餐桌、工作台、数据表格"},{"word":"tablet","pos":"n.","detail":"构词: 构词: table + et(小的后缀)<br>释义: 药片;平板电脑","example":"例句: Take two tablets after meals. ｜ 推导: 小平板 → 药片、书写板、平板电脑"}],"extra":["tablespoon n. 汤匙（构词: table + spoon）","tabletop n. 桌面（构词: table + top）","tablecloth n. 桌布（构词: table + cloth）","tabular a. 表格式的（构词: tabul + ar）","tabulate v. 制表（构词: tabul + ate）","tableau n. 场景;画面 (法语借词)"]},{"id":183,"root":"val-","pronounce":"/væl/五艾勒","source":"拉丁语 valere","meaning":"强壮,有价值","mnemonic":"val是我们小学学过的词value的一部分。value就是价值；真正有价值的东西通常经得住使用和考验，因此也给人强壮、可靠的感觉，所以val就是“强壮,有价值”的意思。","mainWords":[{"word":"value","pos":"n.","detail":"构词: 构词: val(价值) + ue<br>释义: 价值 v.重视","example":"例句: We value your opinion. ｜ 推导: 价值 = 价值,重视"},{"word":"valuable","pos":"a.","detail":"构词: 构词: val + u + able(能够的)<br>释义: 有价值的","example":"例句: This is valuable information. ｜ 推导: 价值 + 能够的 = 有价值的"},{"word":"evaluate","pos":"v.","detail":"构词: 构词: e(出) + val(价值) + uate<br>释义: 评估","example":"例句: Evaluate the project carefully. ｜ 推导: 出 + 价值 + 动词化 = 找出价值,评估"},{"word":"equivalent","pos":"a.","detail":"构词: 构词: equi(相等) + val + ent<br>释义: 等价的","example":"例句: Find an equivalent expression. ｜ 推导: 相等 + 价值 + 形容词化 = 等价的"},{"word":"valid","pos":"a.","detail":"构词: 构词: val(强壮) + id<br>释义: 有效的","example":"例句: Your passport is still valid. ｜ 推导: 强壮 + 形容词化 = 有力的,有效的"},{"word":"invalid","pos":"a.","detail":"构词: 构词: in(不) + val(强壮) + id<br>释义: 无效的 n.病人","example":"例句: The ticket is invalid now. ｜ 推导: 不 + 强壮的 = 无效的;虚弱的人"},{"word":"invaluable","pos":"a.","detail":"构词: 构词: in + val + uable<br>释义: 无价的","example":"例句: Your help is invaluable. ｜ 推导: 不能 + 估价的 = 无法估价的,无价的"},{"word":"prevail","pos":"v.","detail":"构词: 构词: pre(在前) + vail(强壮)<br>释义: 胜过;流行","example":"例句: Justice will prevail. ｜ 推导: 在前 + 强壮 = 更强而胜出,占上风"},{"word":"prevalent","pos":"a.","detail":"构词: 构词: pre + val + ent<br>释义: 流行的","example":""},{"word":"avail","pos":"v.","detail":"构词: 构词: a(向) + vail(价值)<br>释义: 有用 n.效用","example":""},{"word":"available","pos":"a.","detail":"构词: 构词: a + vail + able<br>释义: 可用的","example":"例句: Is this seat available? ｜ 推导: 有用 + 能够的 = 能够使用的,可用的"}],"extra":[]},{"id":184,"root":"caf-","pronounce":"/kæf/卡夫","source":"阿拉伯语 qahwa","meaning":"咖啡","mnemonic":"caf就是我们平时说的“咖啡”。 cafe 就是喝咖啡的地方，所以其中的 caf 可以表示“咖啡”。 所以caf就是“咖啡”。","mainWords":[{"word":"cafe","pos":"n.","detail":"构词: 构词: caf(咖啡) + e<br>释义: 咖啡馆,小餐馆","example":"例句: Let's meet at the cafe. ｜ 推导: 咖啡 = 供应咖啡的场所"},{"word":"cafeteria","pos":"n.","detail":"构词: 构词: caf + eteria(场所后缀)<br>释义: 自助餐厅,食堂","example":"例句: The school cafeteria serves lunch. ｜ 推导: 咖啡 + 场所 = 自助式餐饮场所"}],"extra":["caffeine n. 咖啡因（构词: caf + feine）","decaf n. 脱咖啡因咖啡（构词: de + caf）","coffee n. 咖啡（构词: cof变体 + fee）","cappuccino n. 卡布奇诺 (意大利语)","espresso n. 浓缩咖啡 (意大利语)"]},{"id":185,"root":"cap-/capit-","pronounce":"/kæp/卡普","source":"拉丁语 caput","meaning":"头,首要的","mnemonic":"cap/capit可以记成cap it。 cap 是帽子，cap it 就是“给它戴上帽子”。 帽子要戴在头上，头又处在身体最上面。 所以cap/capit就是“头、首要的”。","mainWords":[{"word":"cap","pos":"n.","detail":"构词: 构词: cap(头)<br>释义: 帽子;盖子","example":"例句: Put the cap back on the bottle. ｜ 推导: 头 = 盖在头上的东⻄,帽子/盖子"},{"word":"capital","pos":"n.","detail":"构词: 构词: capit(头) + al(形容词后缀)<br>释义: 首都;资本","example":"例句: Beijing is the capital of China. ｜ 推导: 头 + 形容词化 = 首要的(城市/财富)"},{"word":"captain","pos":"n.","detail":"构词: 构词: capit(头) + ain(人)<br>释义: 船长;队长","example":"例句: The captain leads the team. ｜ 推导: 头 + 人 = 领头的人,首领"},{"word":"cape","pos":"n.","detail":"构词: 构词: cap(头) + e<br>释义: 海⻆;斗篷","example":"例句: He wore a black cape. ｜ 推导: 头 = 突出的地形/覆盖头肩的衣物"},{"word":"capitalism","pos":"n.","detail":"构词: 构词: capital + ism(主义)<br>释义: 资本主义","example":"例句: Capitalism dominates the economy. ｜ 推导: 资本 + 主义 = 以资本为首的制度"}],"extra":["capitalist n. 资本家（构词: capital + ist）","capitalize v. 资本化;大写（构词: capital + ize）","decapitate v. 斩首（构词: de(去掉) + capit + ate）","capitulate v. 投降（构词: capit + ulate）","per capita a. 人均的（构词: per + capit）"]},{"id":186,"root":"cap-/cip-","pronounce":"/kæp/卡普","source":"拉丁语 capere","meaning":"拿,取,抓住","mnemonic":"为了记忆，可以把CAP记成“Catch And Put in hand”。\n\nCatch表示先抓住目标；Put in hand表示再把它放进手里。抓住以后拿到手中，就是拿、取和捕获。\n\ncip可以用同一动作记成“Catch It, Put in hand”。\n\nCatch It仍然是抓住它；Put in hand仍然是把它拿到手里。两种拼写形式都落在同一只手、同一个物体和同一套动作上。\n\n所以cap/cip就是“拿、取、抓住、接受”的意思。","mainWords":[{"word":"participate","pos":"v.","detail":"构词: 构词: parti(部分) + cip(拿) + ate<br>释义: 参与","example":"例句: Everyone can participate in the event. ｜ 推导: 部分 + 拿取 = 拿取一部分,参与"},{"word":"participant","pos":"n.","detail":"构词: 构词: parti + cip + ant(人)<br>释义: 参与者","example":"例句: All participants must register. ｜ 推导: 部分 + 拿取 + 人 = 参与的人"},{"word":"anticipate","pos":"v.","detail":"构词: 构词: anti(之前) + cip(拿) + ate<br>释义: 预期;预料","example":"例句: We anticipate good results. ｜ 推导: 之前 + 拿取 = 提前拿到,预期"},{"word":"recipient","pos":"n.","detail":"构词: 构词: re(回) + cip(拿) + ient(人)<br>释义: 接受者","example":"例句: The recipient thanked the donor. ｜ 推导: 回 + 拿取 + 人 = 接收的人"},{"word":"recipe","pos":"n.","detail":"构词: 构词: re + cip(拿) + e<br>释义: 食谱;配方","example":"例句: Follow the recipe carefully. ｜ 推导: 拿取 → 取用的方法,食谱"},{"word":"municipal","pos":"a.","detail":"构词: 构词: muni(职责) + cip(承担) + al<br>释义: 市政的","example":"例句: Municipal services are important. ｜ 推导: 职责 + 承担 = 承担市政职责的"},{"word":"reciprocal","pos":"a.","detail":"构词: 构词: re(回) + cip(拿) + rocal<br>释义: 相互的","example":"例句: They have reciprocal respect. ｜ 推导: 回 + 拿取 = 相互拿取,互惠的"}],"extra":[]},{"id":187,"root":"cern-","pronounce":"/sɜːn/瑟恩","source":"拉丁语 cernere","meaning":"区分,筛选,决定","mnemonic":"cern就是“审”。审查一件事时，要先仔细观察，再把不同情况区分开来，最后作出筛选和决定。所以cern就是“区分、筛选、决定”的意思。","mainWords":[{"word":"discern","pos":"v.","detail":"构词: 构词: dis(分开) + cern(区分)<br>释义: 辨别;识别","example":"例句: It's hard to discern the truth. ｜ 推导: 分开 + 区分 = 仔细分辨,识别"},{"word":"concern","pos":"v.","detail":"构词: 构词: con(共同) + cern(筛选)<br>释义: 涉及;关心","example":"例句: This concerns everyone. ｜ 推导: 共同 + 筛选 = 共同关注的事,涉及"},{"word":"concerning","pos":"prep.","detail":"构词: 构词: concern + ing(现在分词)<br>释义: 关于","example":"例句: Questions concerning the policy. ｜ 推导: 涉及 + 进行时 = 关于,涉及到"},{"word":"secret","pos":"n.","detail":"构词: 构词: se(分开) + cret(区分)<br>释义: 秘密 a.秘密的","example":"例句: Keep it a secret. ｜ 推导: 分开 + 区分 = 区分出来单独保存的,秘密"},{"word":"secretary","pos":"n.","detail":"构词: 构词: secret + ary(人)<br>释义: 秘书;部长","example":"例句: The secretary took notes. ｜ 推导: 秘密 + 人 = 保守秘密的人,秘书"}],"extra":["discernment n. 洞察力（构词: discern + ment）","secretive a. 隐秘的（构词: secret + ive）","unconcerned a. 不关心的（构词: un + concerned）","discerning a. 有洞察力的（构词: discern + ing）"]},{"id":188,"root":"fail-/faul-","pronounce":"/fɔːl/福勒","source":"拉丁语 fallere","meaning":"欺骗,失败,错误","mnemonic":"①fail与小学词 fall 形近音近。一个人没有站稳而 fall，事情也没有达到原定目标，就可以记成失败、未能成功。②faul可继续联系“犯了”：犯了错，就出现错误和过错；故意用错的内容骗人，又会形成欺骗。所以fail/faul就是“欺骗、失败、错误、未能成功”。","mainWords":[{"word":"fail","pos":"v.","detail":"构词: 构词: fail(失败)<br>释义: 失败;不及格","example":"例句: He failed the exam. ｜ 推导: 欺骗自己 → 导致失败"},{"word":"failure","pos":"n.","detail":"构词: 构词: fail + ure(名词后缀)<br>释义: 失败;故障","example":"例句: Learn from your failures. ｜ 推导: 失败 + 名词化 = 失败(的结果)"},{"word":"false","pos":"a.","detail":"构词: 构词: fals(欺骗) + e<br>释义: 错误的;假的","example":"例句: That is a false statement. ｜ 推导: 欺骗的 → 虚假的,错误的"},{"word":"fault","pos":"n.","detail":"构词: 构词: faul(错误) + t<br>释义: 过失;缺点","example":"例句: It's not your fault. ｜ 推导: 错误 → 过失,缺陷"},{"word":"faulty","pos":"a.","detail":"构词: 构词: fault + y(形容词后缀)<br>释义: 有缺陷的","example":"例句: The machine is faulty. ｜ 推导: 缺陷 + 形容词化 = 有缺陷的"}],"extra":["fallacy n. 谬论（构词: fall + acy）","fallible a. 易犯错的（构词: fall + ible）"]},{"id":189,"root":"home","pronounce":"/həʊm/赫欧姆","source":"古英语 hām","meaning":"家,住所","mnemonic":"home本身就是我们小学学过的home。 home 就是“家、家乡、家庭的”。 所以home就是“家、住所”。","mainWords":[{"word":"home","pos":"n.","detail":"构词: 构词: home(家)<br>释义: 家;家乡 a.家庭的","example":"例句: There's no place like home. ｜ 推导: 家 = 住所,归属之地"},{"word":"homework","pos":"n.","detail":"构词: 构词: home(家) + work(工作)<br>释义: 家庭作业","example":"例句: I finished my homework early. ｜ 推导: 家 + 工作 = 在家做的工作,家庭作业"}],"extra":["homeland n. 祖国;故乡（构词: home + land）","homeless a. 无家可归的（构词: home + less）","homemade a. 自制的（构词: home + made）","hometown n. 家乡（构词: home + town）","homecoming n. 返乡（构词: home + coming）","homesick a. 想家的（构词: home + sick）"]},{"id":190,"root":"lat-","pronounce":"/læt/莱特","source":"拉丁语 latus；拉丁语 latēre","meaning":"宽,侧面；携带,承载；延迟,迟到;隐藏","mnemonic":"lat末尾补一个不发音的 e 就是小学词 late；late 是迟到、延迟。 所以lat-就是“宽,侧面；携带,承载；延迟,迟到;隐藏”的意思。","mainWords":[{"word":"lateral","pos":"a.","detail":"构词: 构词: lat(侧面) + eral(形容词后缀)<br>释义: 侧面的;横向的","example":"例句: Lateral thinking is creative. ｜ 推导: 侧面 + 形容词化 = 侧面的,横向的"},{"word":"latitude","pos":"n.","detail":"构词: 构词: lat(宽) + itude(名词后缀)<br>释义: 纬度;自由度","example":"例句: The city is at 40 degrees latitude. ｜ 推导: 宽 + 名词化 = 地理宽度,纬度"},{"word":"dilate","pos":"v.","detail":"构词: 构词: di(分离) + lat(宽) + e<br>释义: 扩大;详述","example":"例句: The pupils dilate in darkness. ｜ 推导: 分离 + 宽 = 使变宽,扩大"},{"word":"relate","pos":"v.","detail":"构词: 构词: re(往回) + lat(携带) + e<br>释义: 叙述;相关","example":"例句: Can you relate the story? ｜ 推导: 往回 + 携带 = 把事情带回来,叙述"},{"word":"relation","pos":"n.","detail":"构词: 构词: re + lat + ion(名词后缀)<br>释义: 关系","example":"例句: Their relation is very close. ｜ 推导: 携带 + 名词化 = 相互承载的状态,关系"},{"word":"relationship","pos":"n.","detail":"构词: 构词: relation + ship(状态后缀)<br>释义: 关系","example":"例句: They have a good relationship. ｜ 推导: 关系 + 状态 = 关系的状态,关系"},{"word":"relative","pos":"a.","detail":"构词: 构词: re + lat + ive(形容词后缀)<br>释义: 相对的 n.亲戚","example":"例句: Everything is relative. ｜ 推导: 携带 + 形容词化 = 相互关联的,相对的"},{"word":"relativity","pos":"n.","detail":"构词: 构词: relative + ity(名词后缀)<br>释义: 相对性","example":"例句: Einstein's theory of relativity. ｜ 推导: 相对的 + 性质 = 相对的性质,相对性"},{"word":"translate","pos":"v.","detail":"构词: 构词: trans(跨越) + lat + e<br>释义: 翻译","example":"例句: Can you translate this text? ｜ 推导: 跨越 + 携带 = 跨语言携带意思,翻译"},{"word":"translation","pos":"n.","detail":"构词: 构词: translat(e) + ion(名词后缀)<br>释义: 翻译","example":"例句: The translation is accurate. ｜ 推导: 翻译 + 名词化 = 翻译的行为或结果"},{"word":"correlate","pos":"v.","detail":"构词: 构词: cor(共同) + relate<br>释义: 相关联","example":"例句: These factors correlate strongly. ｜ 推导: 共同 + 关联 = 相互关联,相关"},{"word":"latent","pos":"a.","detail":"构词: 构词: lat(隐藏) + ent(形容词后缀)<br>释义: 潜在的,隐藏的","example":"例句: The disease remains latent. ｜ 推导: 隐藏 + 形容词化 = 潜在的(保留原始含义)"},{"word":"late","pos":"a.","detail":"构词: 构词: lat(延迟) + e<br>释义: 迟到的;晚的","example":"例句: Sorry, I'm late. ｜ 推导: 延迟 = 迟到的,晚的"},{"word":"latter","pos":"a.","detail":"构词: 构词: lat(迟/后) + ter(比较级后缀)<br>释义: 后者的;后半的","example":"例句: I prefer the latter option. ｜ 推导: 迟/后 + 比较级 = 时间或顺序上更后的"},{"word":"later","pos":"ad.","detail":"构词: 构词: lat(晚) + er(比较级后缀)<br>释义: 稍后;较晚的","example":"例句: See you later! ｜ 推导: 晚 + 比较级 = 时间上更晚,稍后"},{"word":"lately","pos":"ad.","detail":"构词: 构词: lat(晚) + ely(副词后缀)<br>释义: 最近,近来","example":"例句: I haven't seen him lately. ｜ 推导: 晚 + 副词化 = 在晚近的时间,最近"}],"extra":["bilateral a. 双边的（构词: bi(双) + lateral）","collateral a. 附属的（构词: col(共同) + lateral）","dilation n. 扩张（构词: dilate + ion）","unilateral a. 单边的（构词: uni(单) + lateral）","latest a. 最新的;最晚的（构词: lat + est最高级）","belated a. 迟来的（构词: be + lat + ed）","latency n. 潜伏期（构词: lat + ency）"]},{"id":191,"root":"lax-","pronounce":"/læks/莱克斯","source":"拉丁语 laxare","meaning":"放松,松开","mnemonic":"lax就是“拉松”。 把拉紧的东西松开，就是放松和松开。 所以lax就是“放松、松开”。","mainWords":[{"word":"relax","pos":"v.","detail":"构词: 构词: re(彻底地) + lax(放松)<br>释义: 放松","example":"例句: Just relax and enjoy yourself. ｜ 推导: 彻底地 + 放松 = 完全放松"},{"word":"release","pos":"v.","detail":"构词: 构词: re(彻底地) + leas(lax变体)<br>释义: 释放 n. 释放","example":"例句: Release the pressure slowly. ｜ 推导: 彻底地 + 放开 = 释放,解除束缚"}],"extra":["relaxation n. 放松,松弛（构词: relax + ation）","relaxing a. 令人放松的（构词: relax + ing）","relaxed a. 放松的,轻松的（构词: relax + ed）","lax a. 松弛的,宽松的 (lax)","laxative n. 泻药 a.通便的（构词: lax + ative）"]},{"id":192,"root":"lev-","pronounce":"/lev/勒诶五","source":"拉丁语 levis/levare","meaning":"轻的,举起,减轻","mnemonic":"lev就是“来扶”。一个东西倒在地上，来把它扶起来，就是举起；重物被扶起来以后，原来的负担也会减轻。所以lev就是“轻的、举起、减轻”的意思。","mainWords":[{"word":"elevator","pos":"n.","detail":"构词: 构词: e(向上) + lev(举起) + ator<br>释义: 电梯","example":"例句: Take the elevator to the 5th floor. ｜ 推导: 向上 + 举起 + 工具 = 向上举起的机器,电梯"},{"word":"elevate","pos":"v.","detail":"构词: 构词: e(向上) + lev(举起) + ate<br>释义: 举起;提升","example":"例句: Exercise can elevate your mood. ｜ 推导: 向上 + 举起 + 动词化 = 举起,提升"},{"word":"level","pos":"n.","detail":"构词: 构词: lev(平衡) + el<br>释义: 水平 a.平的","example":"例句: Check the water level. ｜ 推导: 平衡 + 名词化 = 水平,平的状态"},{"word":"levy","pos":"v./n.","detail":"构词: 构词: lev(举起) + y<br>释义: 征收","example":"例句: The government will levy new taxes. ｜ 推导: 举起 = 征集起来,征收"},{"word":"lever","pos":"n.","detail":"构词: 构词: lev(举起) + er<br>释义: 杠杆","example":"例句: Use a lever to lift heavy objects. ｜ 推导: 举起 + 工具 = 用来举起重物的工具,杠杆"},{"word":"alleviate","pos":"v.","detail":"构词: 构词: al(向) + lev(轻) + iate<br>释义: 减轻;缓和","example":"例句: Medicine can alleviate pain. ｜ 推导: 使 + 变轻 = 使变得轻松,减轻"},{"word":"relieve","pos":"v.","detail":"构词: 构词: re(强调) + liev(减轻) + e<br>释义: 缓解;减轻","example":"例句: This will relieve your stress. ｜ 推导: 强调 + 减轻 = 减轻负担,缓解"},{"word":"relief","pos":"n.","detail":"构词: 构词: re + lief(减轻的状态)<br>释义: 缓解;救济","example":"例句: It was a great relief to hear that. ｜ 推导: 减轻的状态 = 缓解,救济"},{"word":"relevant","pos":"a.","detail":"构词: 构词: re + lev(减轻) + ant<br>释义: 相关的;切题的","example":""},{"word":"believe","pos":"v.","detail":"构词: 构词: be + liev(减轻) + e [词源深层]<br>释义: 相信","example":""},{"word":"belief","pos":"n.","detail":"构词: 构词: be + lief(减轻的状态) [词源深层]<br>释义: 信念;信仰","example":"例句: His belief never wavered. ｜ 推导: 内心轻松(无疑虑)的状态 = 信念"}],"extra":[]},{"id":193,"root":"liqu-","pronounce":"/ˈlɪkw/利克乌","source":"拉丁语 liquere","meaning":"流动,液体","mnemonic":"liqu就是“流去”。 能够不断流去并随容器改变形状的，就是液体和流动。 所以liqu就是“流动、液体”。","mainWords":[{"word":"liquid","pos":"n.","detail":"构词: 构词: liqu(流动) + id(形容词后缀)<br>释义: 液体 a.液体的","example":"例句: Water is a liquid at room temperature. ｜ 推导: 流动 + 形容词化 = 能流动的(物质),液体"},{"word":"liquor","pos":"n.","detail":"构词: 构词: liqu(流动) + or(名词后缀)<br>释义: 烈酒;液体","example":"例句: He doesn't drink liquor. ｜ 推导: 流动 + 名词化 = 流动之物,(蒸馏的)烈酒"}],"extra":["liquefy v. 液化（构词: liqu + e + fy(使...)）","liquidity n. 流动性（构词: liquid + ity）","liquidate v. 清算;清除（构词: liquid + ate）","liquidation n. 清算（构词: liquid + ation）","liqueur n. 利口酒（构词: liqu + eur）","liquidize v. 使液化（构词: liquid + ize）","liquefaction n. 液化作用（构词: liqu + e + faction）","liquescent a. 可液化的（构词: liqu + escent）","deliquescent a. 潮解的（构词: de + liqu + escent）","liquefier n. 液化器（构词: liqu + e + fier）"]},{"id":194,"root":"membr-","pronounce":"/ˈmembər/姆诶姆伯儿","source":"拉丁语 membrum","meaning":"肢体,部分","mnemonic":"方法一： membr可以直接想到我们小学学过的member。 member 就是“成员、身体部位”。 成员是整体中的一个部分，身体部位也是身体的一部分。 所以membr就是“肢体、部分”。 方法二： membr就是“每臂儿”。每一条胳膊和每一条腿，都是身体的一段肢体；它们单独来看，又都是整个身体中的一个部分。所以membr就是“肢体、部分”。","mainWords":[{"word":"member","pos":"n.","detail":"构词: 构词: membr(肢体) + er<br>释义: 成员;肢体","example":"例句: He is a member of the club. ｜ 推导: 肢体 → 部分 → 成员"},{"word":"membership","pos":"n.","detail":"构词: 构词: member + ship(名词后缀)<br>释义: 会员资格;会员","example":"例句: The membership fee is due. ｜ 推导: 成员 + 资格 = 会员资格"}],"extra":["membrane n. 薄膜;隔膜（构词: membr + ane）","dismember v. 肢解（构词: dis(分离) + member）","remember v. 记住（构词: re(再) + member）","remembrance n. 记忆（构词: remember + ance）"]},{"id":195,"root":"pel-/pul-","pronounce":"/pel/普诶勒","source":"","meaning":"推动,驱使,击打","mnemonic":"pel/pul/puls就是“扑”。一个人猛地扑过去，会推动对方，甚至迫使对方移动；扑落到地面时又会产生一次击打。三个形式只是长短不同，动作画面相同，所以pel/pul/puls就是“推动、驱使、迫使、击打”。","mainWords":[{"word":"compel","pos":"v.","detail":"构词: 构词: com(共同) + pel(推)<br>释义: 强迫","example":"例句: The law compels us to pay taxes. ｜ 推导: 共同 + 推 = 一起推,强迫"},{"word":"propel","pos":"v.","detail":"构词: 构词: pro(向前) + pel(推)<br>释义: 推进,推动","example":"例句: Wind propels the sailboat forward. ｜ 推导: 向前 + 推 = 向前推,推进"},{"word":"expel","pos":"v.","detail":"构词: 构词: ex(出) + pel(推)<br>释义: 驱逐,开除","example":"例句: He was expelled from school. ｜ 推导: 出 + 推 = 推出去,驱逐"},{"word":"repel","pos":"v.","detail":"构词: 构词: re(回) + pel(推)<br>释义: 击退,排斥","example":"例句: Magnets repel each other. ｜ 推导: 回 + 推 = 往回推,击退"},{"word":"pulse","pos":"n.","detail":"构词: 构词: puls(击打) + e<br>释义: 脉搏;脉冲","example":"例句: Check his pulse rate. ｜ 推导: 击打 = 脉搏跳动"},{"word":"impulse","pos":"n.","detail":"构词: 构词: im(内) + puls(推) + e<br>释义: 冲动;推动力","example":"例句: He acted on impulse. ｜ 推导: 内在 + 推动 = 内心冲动"},{"word":"compulsory","pos":"a.","detail":"构词: 构词: com + puls + ory(形容词后缀)<br>释义: 强制的","example":"例句: Compulsory education is necessary. ｜ 推导: 共同 + 推动 + 形容词化 = 强制的"}],"extra":[]},{"id":196,"root":"prin-/prim-","pronounce":"/prɪn/普里恩","source":"","meaning":"第一,首要,最初","mnemonic":"prin/prim就是“排一”。把一个人或一件事排在第一位，它就是最初的、首要的，也是最重要的。所以prin/prim就是“第一、首要、最初”的意思。","mainWords":[{"word":"principal","pos":"a.","detail":"构词: 构词: princ(第一) + ipal(形容词后缀)<br>释义: 主要的 n.校长","example":"例句: The principal reason is cost. ｜ 推导: 第一 + 形容词化 = 首要的,主要的"},{"word":"principle","pos":"n.","detail":"构词: 构词: princ(第一) + iple(名词后缀)<br>释义: 原则;原理","example":"例句: Follow the basic principles. ｜ 推导: 第一 + 名词化 = 首要准则,原则"},{"word":"primary","pos":"a.","detail":"构词: 构词: prim(第一) + ary(形容词后缀)<br>释义: 首要的;初级的","example":"例句: Primary education is important. ｜ 推导: 第一 + 形容词化 = 首要的,初级的"},{"word":"prime","pos":"a.","detail":"构词: 构词: prim(第一) + e<br>释义: 首要的;最好的","example":"例句: He is in his prime years. ｜ 推导: 第一 = 首要的,全盛的"},{"word":"primitive","pos":"a.","detail":"构词: 构词: prim(第一) + itive(形容词后缀)<br>释义: 原始的;简陋的","example":"例句: Primitive tools were made of stone. ｜ 推导: 第一 + 形容词化 = 最初的,原始的"},{"word":"prince","pos":"n.","detail":"构词: 构词: princ(第一) + e<br>释义: 王子;亲王","example":"例句: The prince will be king. ｜ 推导: 第一(公民) = 首领,王子"},{"word":"princess","pos":"n.","detail":"构词: 构词: prince + ess(阴性后缀)<br>释义: 公主;王妃","example":"例句: The princess wore a crown. ｜ 推导: 王子 + 阴性化 = 公主"}],"extra":["primarily ad. 主要地（构词: prim + arily）","primacy n. 首位;至高无上（构词: prim + acy）","primer n. 入门书;底漆（构词: prim + er）","principality n. 公国（构词: princ + ipality）"]},{"id":197,"root":"rely (ligāre)","pronounce":"/rɪˈlaɪ/里勒爱","source":"拉丁语 ligāre","meaning":"捆绑,依赖","mnemonic":"rely末尾的读音像“赖”。一个人赖着某个支点不离开，就像被绳子绑在那里；正因为彼此连住，他才敢把重量交给它、依赖它。所以rely就是“捆绑、依赖”。","mainWords":[{"word":"rely","pos":"v.","detail":"构词: 构词: re(再次) + ly(ligāre捆绑)<br>释义: 依赖,信赖","example":"例句: We rely on our friends. ｜ 推导: 再次 + 捆绑 = 将自己与他人绑定,依赖"},{"word":"reliable","pos":"a.","detail":"构词: 构词: rely + able(能够...的)<br>释义: 可靠的","example":"例句: She is a reliable partner. ｜ 推导: 依赖 + 能够的 = 能够被依赖的,可靠的"},{"word":"reliance","pos":"n.","detail":"构词: 构词: rely + ance(名词后缀)<br>释义: 依赖,信赖","example":"例句: Self-reliance is important. ｜ 推导: 依赖 + 名词化 = 依赖的状态,信赖"}],"extra":["unreliable a. 不可靠的（构词: un + reliable）","reliably ad. 可靠地（构词: reliable + ly）","self-reliance n. 自力更生（构词: self + reliance）","reliant a. 依赖的（构词: rely + ant）"]},{"id":198,"root":"roar","pronounce":"/rɔːr/儿奥儿","source":"","meaning":"吼叫,咆哮(拟声词)","mnemonic":"roar就是猛兽吼叫时拉长的“嗷——”声。 所以roar就是“吼叫、咆哮”。","mainWords":[{"word":"roar","pos":"v./n.","detail":"构词: 构词: roar(拟声词)<br>释义: 吼叫,咆哮","example":"例句: The lion roared loudly. ｜ 推导: 拟声词 = 模仿吼叫的声音"},{"word":"uproar","pos":"n.","detail":"构词: 构词: up(向上) + roar(吼叫)<br>释义: 喧嚣,骚动","example":"例句: The crowd was in an uproar. ｜ 推导: 向上 + 吼叫 = 喧嚣沸腾的状态"}],"extra":["roaring a. 咆哮的;兴旺的（构词: roar + ing）","roarer n. 吼叫者（构词: roar + er）","uproarious a. 喧嚣的（构词: uproar + ious）","outroar v. 吼声盖过（构词: out + roar）","roaringly ad. 咆哮地（构词: roar + ing + ly）"]},{"id":199,"root":"rot","pronounce":"/rɒt/儿奥特","source":"日耳曼语系","meaning":"腐烂,腐败","mnemonic":"rot就是“肉”。一块肉放得太久，会变坏、发臭并逐渐腐烂；由肉变坏的画面，就能记住腐烂和腐败。所以rot就是“腐烂、腐败”。","mainWords":[{"word":"rot","pos":"v./n.","detail":"构词: 构词: rot(腐烂)<br>释义: 腐烂;腐败","example":"例句: The wood began to rot. ｜ 推导: 腐烂 = 有机物的分解过程"},{"word":"rotten","pos":"a.","detail":"构词: 构词: rot(腐烂) + ten(形容词后缀)<br>释义: 腐烂的;糟糕的","example":"例句: The apple was rotten inside. ｜ 推导: 腐烂 + 形容词化 = 腐烂的,腐败的"}],"extra":["rotting a. 正在腐烂的（构词: rot + ting）","rottenness n. 腐烂;腐败（构词: rotten + ness）","dry rot n. 干腐病（构词: dry + rot）","root rot n. 根腐病（构词: root + rot）"]},{"id":200,"root":"scen-","pronounce":"/siːn/斯衣恩","source":"希腊语 skene","meaning":"舞台,场景","mnemonic":"scen是我们小学学过的词scene的一部分。scene就是舞台上的一场、眼前的一幕，也就是场景。所以scen就是“舞台、场景”的意思。","mainWords":[{"word":"scene","pos":"n.","detail":"构词: 构词: scen(舞台) + e<br>释义: 场景;景象","example":"例句: The crime scene was sealed. ｜ 推导: 舞台 = 场景,景象"},{"word":"scenery","pos":"n.","detail":"构词: 构词: scen(场景) + ery(名词后缀)<br>释义: 风景;景色","example":"例句: The mountain scenery is beautiful. ｜ 推导: 场景 + 集合 = 风景,景色"}],"extra":["scenic a. 风景优美的（构词: scen + ic）","scenario n. 剧本;设想（构词: scen + ario）","obscene a. 淫秽的（构词: ob(离开) + scen）","proscenium n. 舞台前部（构词: pro + scen + ium）"]},{"id":201,"root":"-scend-/-scent-","pronounce":"/send/瑟恩德","source":"拉丁语 scandere","meaning":"攀爬","mnemonic":"scend/scent就是“升的”。 从低处不断上升到高处，就是攀爬。 所以scend/scent就是“攀爬”。","mainWords":[{"word":"descend","pos":"v.","detail":"构词: 构词: de(向下) + scend(爬)<br>释义: 下降","example":"例句: The plane began to descend. ｜ 推导: 向下 + 爬 = 下降,下行"},{"word":"ascend","pos":"v.","detail":"构词: 构词: a(向上) + scend(爬)<br>释义: 上升","example":"例句: The balloon ascended slowly. ｜ 推导: 向上 + 爬 = 上升,攀登"},{"word":"transcend","pos":"v.","detail":"构词: 构词: trans(穿过) + scend(爬)<br>释义: 超越","example":"例句: Art transcends language barriers. ｜ 推导: 穿过 + 爬 = 爬过界限,超越"},{"word":"descent","pos":"n.","detail":"构词: 构词: de + scent(爬)<br>释义: 下降","example":"例句: The steep descent was dangerous. ｜ 推导: 向下 + 爬 + 名词化 = 下降(过程)"},{"word":"descendant","pos":"n.","detail":"构词: 构词: descend + ant(表人)<br>释义: 后代","example":"例句: He is a descendant of kings. ｜ 推导: 下降 + 人 = 向下传承的人,后代"}],"extra":["condescend v. 屈尊（构词: con(共同) + de + scend）","ascending a. 上升的（构词: ascend + ing）","transcendent a. 超越的（构词: transcend + ent）","descending a. 下降的（构词: descend + ing）"]},{"id":202,"root":"shore","pronounce":"/ʃɔːr/诗奥儿","source":"古英语scor(a)","meaning":"岸,海岸","mnemonic":"shore开头的 sh 像海浪冲到岸边时发出的“唰”声。海水“唰”地打到陆地边缘，水到这里停下，这条边就是岸、海岸。所以shore就是“岸、海岸”。","mainWords":[{"word":"shore","pos":"n.","detail":"构词: 构词: shore(岸)<br>释义: 岸,海岸","example":"例句: We walked along the shore. ｜ 推导: 岸 = 水域与陆地的分界"},{"word":"ashore","pos":"ad.","detail":"构词: 构词: a(在...上) + shore(岸)<br>释义: 上岸;在岸上","example":"例句: The sailors went ashore. ｜ 推导: 在 + 岸上 = 上岸,在岸上"}],"extra":["shoreline n. 海岸线（构词: shore + line）","seashore n. 海滨（构词: sea + shore）","offshore a. 离岸的（构词: off + shore）","onshore a. 在岸上的（构词: on + shore）","foreshore n. 前滩（构词: fore + shore）","lakeshore n. 湖岸（构词: lake + shore）","shorebird n. 岸禽（构词: shore + bird）","shoreside n. 岸边（构词: shore + side）","shoreward ad. 向岸地（构词: shore + ward）","inshore a. 近岸的（构词: in + shore）"]},{"id":203,"root":"south","pronounce":"/saʊθ/斯奥斯","source":"古英语 sūþ","meaning":"南方","mnemonic":"south本身就是我们小学学过的south。 south 就是“南方(的)”。 所以south就是“南方”。","mainWords":[{"word":"south","pos":"n./a.","detail":"构词: 构词: south(南方)<br>释义: 南方(的)","example":"例句: Birds fly south in winter. ｜ 推导: 南方 = 温暖的方向"},{"word":"southern","pos":"a.","detail":"构词: 构词: south + ern(方位形容词后缀)<br>释义: 南方的","example":"例句: The southern region is warmer. ｜ 推导: 南方 + 形容词化 = 南方的"},{"word":"southwest","pos":"n./a.","detail":"构词: 构词: south + west(⻄)<br>释义: ⻄南(的)","example":"例句: The wind comes from southwest. ｜ 推导: 南 + ⻄ = ⻄南方向"},{"word":"southeast","pos":"n./a.","detail":"构词: 构词: south + east(东)<br>释义: 东南(的)","example":"例句: Southeast Asia is tropical. ｜ 推导: 南 + 东 = 东南方向"}],"extra":["southward ad. 向南方（构词: south + ward(方向)）","southerly a. 向南的（构词: south + erly）","southernmost a. 最南的（构词: southern + most）","southbound a. 南行的（构词: south + bound）"]},{"id":204,"root":"spec- (看)","pronounce":"/spaɪt/斯普爱特","source":"","meaning":"向下看 → 鄙视 → 恶意","mnemonic":"spec就是“看”。一个人向下看别人，就是看不起、鄙视；鄙视继续发展成怨恨，就会形成恶意。所以spec这一支表示“向下看、鄙视、恶意”的意思。","mainWords":[{"word":"spite","pos":"n.","detail":"构词: 构词: spec(看) → 向下看 → 恶意<br>释义: 恶意;怨恨","example":"例句: He did it out of spite. ｜ 推导: 鄙视的眼光 = 恶意,怨恨"},{"word":"despite","pos":"prep.","detail":"构词: 构词: de(向下) + spite → 无视<br>释义: 尽管","example":"例句: Despite the rain, we went out. ｜ 推导: 无视(障碍) = 尽管,不顾"}],"extra":["spiteful a. 恶意的（构词: spite + ful）","despise v. 鄙视（构词: de + spise）","respect v. 尊重（构词: re(回) + spect(看)）","spectacle n. 景象;眼镜（构词: spect + acle）","inspect v. 检查（构词: in(内) + spect）","aspect n. 方面（构词: a(到) + spect）"]},{"id":205,"root":"veg-","pronounce":"/vedʒ/五诶吉","source":"拉丁语 vegētāre","meaning":"生长,活力;植物","mnemonic":"veg是我们小学学过的vegetable的一部分。vegetable就是蔬菜，蔬菜属于plant，会从土里生长，也代表植物和生命力。所以veg就是“生长、活力；植物”的意思。","mainWords":[{"word":"vegetable","pos":"n.","detail":"构词: 构词: veg(植物) + etable(可...的)<br>释义: 蔬菜 a.植物的","example":"例句: Eat more vegetables daily. ｜ 推导: 植物 + 可食用的 = 蔬菜"},{"word":"vegetation","pos":"n.","detail":"构词: 构词: veg + et + ation(名词后缀)<br>释义: 植被;植物","example":"例句: The tropical vegetation is lush. ｜ 推导: 植物 + 集合名词 = 植被"},{"word":"vegetarian","pos":"n.","detail":"构词: 构词: veg + et + arian(从事...的人)<br>释义: 素食者","example":"例句: She became a vegetarian last year. ｜ 推导: 蔬菜 + 践行者 = 素食者"}],"extra":["vegetal a. 植物的（构词: veg + et + al）","vegetate v. 生长;无所事事（构词: veg + et + ate）","vegetative a. 植物性的（构词: veg + et + ative）","veggie n. 蔬菜(口语)（构词: veg + gie）"]},{"id":206,"root":"wink-/twink-","pronounce":"/wɪŋk/温克","source":"古日耳曼语","meaning":"快速闭合,闪动","mnemonic":"为了记忆，可以把WINK记成“When I Narrow, Keep one eye closed”。\nWhen I Narrow表示我把眼睛眯窄；Keep one eye closed表示让其中一只眼睛短暂闭合。这个动作就是快速闭眼和眨眼。 所以wink/twink就是“快速闭合、闪动”。","mainWords":[{"word":"wink","pos":"v.","detail":"构词: 构词: wink(快速闭合)<br>释义: 眨眼;闪烁","example":"例句: She winked at me playfully. ｜ 推导: 快速闭合 = 眨眼,闪烁"},{"word":"twinkle","pos":"v.","detail":"构词: 构词: t(反复) + wink + le<br>释义: 闪烁 n.闪烁","example":"例句: Stars twinkle in the night sky. ｜ 推导: 反复 + 快速闭合 = 持续闪烁"}],"extra":["winking a. 眨眼的（构词: wink + ing）","twinkling n. 瞬间 a.闪烁的","winker n. 眨眼者;眼睑（构词: wink + er）","twinkly a. 闪闪发光的","hoodwink v. 欺骗（构词: hood + wink）","periwinkle n. 长春花;海螺","unwinking a. 不眨眼的;警觉的","twinkler n. 闪烁的星星"]},{"id":207,"root":"young","pronounce":"/jʌŋ/耶阿昂","source":"古英语 geong","meaning":"年轻的","mnemonic":"young本身就是我们小学学过的young。 young 就是“年轻的、幼小的”。 所以young就是“年轻的”。","mainWords":[{"word":"young","pos":"a.","detail":"构词: 构词: young(年轻的)<br>释义: 年轻的,幼小的","example":"例句: She is still young at heart. ｜ 推导: 年轻的 = 生命早期的,充满活力的"},{"word":"youth","pos":"n.","detail":"构词: 构词: 与young同源<br>释义: ⻘年;⻘春时期","example":"例句: Youth is a precious time. ｜ 推导: 年轻 → ⻘春时期,⻘年时代"},{"word":"youngster","pos":"n.","detail":"构词: 构词: young + ster(表示...的人)<br>释义: 年轻人,少年","example":"例句: The youngster showed great talent. ｜ 推导: 年轻的 + 人 = 年轻人,少年"}],"extra":["younger a. 更年轻的（构词: young + er）","youngest a. 最年轻的（构词: young + est）","youthful a. 年轻的;有⻘春活力的（构词: youth + ful）","youngling n. 幼兽;年轻人（构词: young + ling）"]},{"id":208,"root":"cas-","pronounce":"/kæs/卡斯","source":"拉丁语 capsa；拉丁语 cadere","meaning":"盒子,箱子；落下,降临","mnemonic":"1.cas可以记成case去掉末尾e。case就是盒子、箱子，所以cas有“盒子、箱子”的意思。2.cas又可以记成“咔摔”：东西突然fall下来，落地时发出“咔”的一声，就是落下、降临。综上，cas就是“盒子、箱子；落下、降临”的意思。","mainWords":[{"word":"case","pos":"n.","detail":"构词: 构词: cas(盒子) + e<br>释义: 箱子;盒子;外壳","example":"例句: Put it in the case. ｜ 推导: 盒子 = 箱子,容器"},{"word":"briefcase","pos":"n.","detail":"构词: 构词: brief(简短的) + case(箱子)<br>释义: 公文包","example":"例句: He carries a briefcase to work. ｜ 推导: 简短文件 + 箱子 = 公文包"},{"word":"cassette","pos":"n.","detail":"构词: 构词: cas(盒子) + ette(小词后缀)<br>释义: 磁带盒;盒式磁带","example":"例句: I found an old cassette. ｜ 推导: 盒子 + 小 = 小盒子,磁带盒"},{"word":"staircase","pos":"n.","detail":"构词: 构词: stair(楼梯) + case(围护结构)<br>释义: 楼梯间","example":"例句: The staircase is wide. ｜ 推导: 楼梯 + 围护盒 = 楼梯间"},{"word":"cash","pos":"n.","detail":"构词: 构词: cas(钱箱) + h<br>释义: 现金","example":"例句: I need some cash. ｜ 推导: 钱箱(里的钱) = 现金"},{"word":"cashier","pos":"n.","detail":"构词: 构词: cash(现金) + ier(人)<br>释义: 出纳员;收银员","example":"例句: The cashier gave me change. ｜ 推导: 管理现金的人 = 出纳员"},{"word":"case","pos":"n.","detail":"构词: 构词: cas(落下) + e<br>释义: 情况;案例","example":"例句: In this case, we need help. ｜ 推导: 落下 = 发生的事情,情况"},{"word":"occasion","pos":"n.","detail":"构词: 构词: oc(朝向) + cas(落下) + ion<br>释义: 场合;时机","example":"例句: It's a special occasion. ｜ 推导: 朝向 + 落下 = 落到面前的时机"},{"word":"casual","pos":"a.","detail":"构词: 构词: cas(落下) + ual(形容词后缀)<br>释义: 随意的;偶然的","example":"例句: He wore casual clothes. ｜ 推导: 落下 + 形容词化 = 偶然发生的,随意的"},{"word":"casualty","pos":"n.","detail":"构词: 构词: casual + ty(名词后缀)<br>释义: 伤亡;受害者","example":"例句: War casualties were high. ｜ 推导: 偶然的 + 名词化 = 意外事故的受害者"}],"extra":["casing n. 外壳;套管（构词: cas + ing）","encase v. 装入箱中（构词: en + case）","bookcase n. 书架;书柜（构词: book + case）","suitcase n. 手提箱（构词: suit + case）","showcase n. 陈列柜（构词: show + case）","pillowcase n. 枕套（构词: pillow + case）","uppercase n. 大写字母（构词: upper + case）","lowercase n. 小写字母（构词: lower + case）","cascade n. 瀑布 v.倾泻（构词: cas + cade）","occasionally ad. 偶尔地（构词: occasional + ly）","casually ad. 随意地（构词: casual + ly）","coincide v. 巧合（构词: co(共同) + in + cide(落下)）","accident n. 事故（构词: ac(向) + cid(落下) + ent）","incident n. 事件（构词: in(内) + cid(落下) + ent）"]},{"id":209,"root":"coat","pronounce":"/koʊt/克欧特","source":"古法语 cote","meaning":"外套,覆盖物","mnemonic":"coat本身就是我们小学学过的coat。 coat 就是“外套、涂层”。 所以coat就是“外套、覆盖物”。","mainWords":[{"word":"coat","pos":"n.","detail":"构词: 构词: coat(外套)<br>释义: 外套;涂层","example":"例句: He wore a thick coat. ｜ 推导: 外套 = 覆盖身体的衣物"},{"word":"overcoat","pos":"n.","detail":"构词: 构词: over(在...之上) + coat<br>释义: 大衣","example":"例句: Put on your overcoat. ｜ 推导: 在上面 + 外套 = 穿在外套外的大衣"}],"extra":["coating n. 涂层;覆盖层（构词: coat + ing）","raincoat n. 雨衣（构词: rain + coat）","coated a. 涂层的（构词: coat + ed）","waistcoat n. 背心（构词: waist + coat）"]},{"id":210,"root":"far","pronounce":"/fɑː(r)/夫啊儿","source":"古英语 feorr","meaning":"远,远距离","mnemonic":"far本身就是我们小学学过的far。 far 就是“远的、远地”。 所以far就是“远、远距离”。","mainWords":[{"word":"far","pos":"a.","detail":"构词: 构词: far(远)<br>释义: 远的 ad.远地","example":"例句: How far is the station? ｜ 推导: 远 = 空间或时间上的遥远"},{"word":"farther","pos":"ad.","detail":"构词: 构词: far(远) + ther(比较级后缀)<br>释义: 更远地 a.更远的","example":"例句: We walked farther into the forest. ｜ 推导: 远 + 比较级 = 更远的距离"}],"extra":["farthest a./ad. 最远的/地（构词: far + thest）","far-reaching a. 深远的（构词: far + reaching）","far-off a. 遥远的（构词: far + off）","far-fetched a. 牵强的（构词: far + fetched）","far-sighted a. 远视的;有远见的","afar ad. 在远处（构词: a + far）"]},{"id":211,"root":"fare","pronounce":"/feər/夫艾儿儿","source":"古英语 faran","meaning":"旅行,前行,经历","mnemonic":"去很 far 的地方，要一路向前旅行，并在途中经历许多事情。所以fare就是“旅行、前行、经历”。","mainWords":[{"word":"fare","pos":"n.","detail":"构词: 构词: fare(旅行)<br>释义: 费用;v.进展","example":"例句: The bus fare is $2. ｜ 推导: 旅行 → 旅行费用;经历状态"},{"word":"farewell","pos":"n.","detail":"构词: 构词: fare(旅行) + well(好)<br>释义: /int.告别;再见","example":"例句: Farewell, my friend! ｜ 推导: 旅行 + 好 = 祝旅途平安,再见"},{"word":"welfare","pos":"n.","detail":"构词: 构词: well(好) + fare(状态)<br>释义: 福利;福祉","example":"例句: Social welfare is important. ｜ 推导: 好 + 状态 = 良好的生活状态,福利"},{"word":"warfare","pos":"n.","detail":"构词: 构词: war(战争) + fare(进行)<br>释义: 战争;作战","example":"例句: Modern warfare is complex. ｜ 推导: 战争 + 进行 = 进行战争,作战"}],"extra":["airfare n. 机票费（构词: air + fare）","thoroughfare n. 大道（构词: thorough + fare）","seafarer n. 航海者（构词: sea + fare + er）","wayfarer n. 旅行者（构词: way + fare + er）","fanfare n. 号⻆声（构词: fan + fare）","carfare n. 车费（构词: car + fare）"]},{"id":212,"root":"farm","pronounce":"/fɑːm/夫啊姆","source":"拉丁语 firmāre","meaning":"固定契约,租赁土地","mnemonic":"farm本身就是我们小学学过的 farm。 一块 farm 不会今天在这里、明天搬到别处。人要先把一块 land 固定圈下来，按契约长期使用和经营，才能持续种植、饲养并 keep 住收成。 所以 farm 这个熟悉场景能帮助我们记住它背后的“固定契约、租赁土地”。 所以farm就是“固定契约、租赁和经营土地”。","mainWords":[{"word":"farm","pos":"n.","detail":"构词: 构词: farm(固定租赁的土地)<br>释义: 农场,农田","example":"例句: They bought a small farm. ｜ 推导: 固定契约土地 → 农场"},{"word":"farmer","pos":"n.","detail":"构词: 构词: farm + er(人)<br>释义: 农民,农场主","example":"例句: The farmer works hard every day. ｜ 推导: 农场 + 人 = 耕种土地的人"}],"extra":["farming n. 农业,耕作（构词: farm + ing）","farmland n. 农田（构词: farm + land）","farmhouse n. 农舍（构词: farm + house）","farmyard n. 农家庭院（构词: farm + yard）","farmworker n. 农场工人（构词: farm + worker）","firm a. 坚固的 (同源词,固定的)","confirm v. 确认（构词: con + firm）","affirm v. 肯定（构词: af + firm）"]},{"id":213,"root":"green","pronounce":"/griːn/格里恩","source":"日耳曼语 *groniz","meaning":"绿色的,生长的","mnemonic":"green本身就是我们小学学过的green。 green 就是“绿色的、生的、无经验的”。 所以green就是“绿色的、生长的”。","mainWords":[{"word":"green","pos":"a.","detail":"构词: 构词: green(绿色的)<br>释义: 绿色的;生的;无经验的","example":"例句: The leaves turn green in spring. ｜ 推导: 绿色的 = 生长的,新鲜的"},{"word":"greenhouse","pos":"n.","detail":"构词: 构词: green + house(房子)<br>释义: 温室","example":"例句: Plants grow well in the greenhouse. ｜ 推导: 绿色 + 房子 = 种植物的房子,温室"}],"extra":["greenery n. 绿色植物（构词: green + ery）","greenish a. 略带绿色的（构词: green + ish）","evergreen n. 常青树（构词: ever + green）","greenback n. 美钞（构词: green + back）","greenhorn n. 新手（构词: green + horn）","greens n. 绿色蔬菜（构词: green + s）"]},{"id":214,"root":"junct-","pronounce":"/dʒʌŋkt/姜克特","source":"","meaning":"连接,结合","mnemonic":"方法一：junct就是“接合”。两个物体，在一个点接拢，就连接、结合到了一起，接合就是连接与结合。所以junct就是“连接、结合”。方法二：为了记忆，可以把JUNCT记成“Join Us; Now Connect Together”。\n\nJoin Us表示先让原本分开的对象加入同一处；Now Connect Together表示再把它们真正连接成一个整体。\n\n想象两条路、两根线或两个部件从不同方向过来，最后在同一个点加入并连接。所有动作始终围绕“从分开到接在一起”。\n\n所以junct就是“连接、结合”的意思。","mainWords":[{"word":"junction","pos":"n.","detail":"构词: 构词: junct(连接) + ion(名词后缀)<br>释义: 连接点;交叉口","example":"例句: Turn left at the junction. ｜ 推导: 连接 + 名词化 = 连接的地方,交叉口"},{"word":"conjunction","pos":"n.","detail":"构词: 构词: con(共同) + junct + ion<br>释义: 连词;结合","example":"例句: \"And\" is a conjunction. ｜ 推导: 共同 + 连接 + 名词化 = 连接词语的词"}],"extra":["adjunct n. 附属物;助手（构词: ad(向) + junct）","disjunction n. 分离（构词: dis(分开) + junct + ion）","juncture n. 时刻;关键点（构词: junct + ure）","injunction n. 命令;禁令（构词: in + junct + ion）"]},{"id":215,"root":"juven-","pronounce":"/ˈdʒuːvən/吉乌五额恩","source":"拉丁语 iuvenis","meaning":"年轻的,⻘年的","mnemonic":"juven可以按读音记成“雏嫩”。刚出壳的小鸟是幼雏，身体和羽毛都很嫩，正处在最年轻的阶段；“雏嫩”这个画面正好对应青年和年轻。所以juven就是“年轻的、青年的”。","mainWords":[{"word":"junior","pos":"a./n.","detail":"构词: 构词: jun(年轻) + ior(比较级后缀)<br>释义: 年少的;晚辈","example":"例句: He is my junior colleague. ｜ 推导: 年轻 + 比较级 = 较年轻的,年少的"},{"word":"juvenile","pos":"a./n.","detail":"构词: 构词: juven(年轻) + ile(形容词后缀)<br>释义: ⻘少年的;幼稚的","example":"例句: Juvenile crime is a problem. ｜ 推导: 年轻 + 形容词化 = ⻘少年的,少年的"}],"extra":["juvenility n. 年少;幼稚（构词: juven + ility）","juvenescence n. 返老还童（构词: juven + escence）","juvenescent a. 变年轻的（构词: juven + escent）","rejuvenation n. 返老还童;复兴 (re + juven + atio"]},{"id":216,"root":"meter/metr-","pronounce":"/ˈmiːtər/米特儿","source":"希腊语 metron","meaning":"测量,度量","mnemonic":"方法一： meter/metr我们在小学数学里的 meter 中见过。meter 是“米”，用米尺可以量长度；只要某种工具在量一个数，它就在做测量和度量。所以meter/metr就是“测量、度量”。 方法二： meter/metr就是“米尺”。 米尺专门用来测量长度，所以表示测量和度量。 所以meter/metr就是“测量、度量”。","mainWords":[{"word":"meter","pos":"n.","detail":"构词: 构词: meter(测量)<br>释义: 米;计量器","example":"例句: The room is 5 meters wide. ｜ 推导: 测量 = 测量单位,计量器"},{"word":"diameter","pos":"n.","detail":"构词: 构词: dia(穿过) + meter(测量)<br>释义: 直径","example":"例句: The diameter of the circle is 10cm. ｜ 推导: 穿过 + 测量 = 穿过圆心的测量,直径"},{"word":"thermometer","pos":"n.","detail":"构词: 构词: thermo(热) + meter(测量)<br>释义: 温度计","example":"例句: The thermometer shows 37°C. ｜ 推导: 热 + 测量 = 测量温度的仪器"},{"word":"parameter","pos":"n.","detail":"构词: 构词: para(旁边) + meter(测量)<br>释义: 参数","example":"例句: Adjust the parameters carefully. ｜ 推导: 旁边 + 测量 = 辅助测量的变量"},{"word":"kilometer","pos":"n.","detail":"构词: 构词: kilo(千) + meter(米)<br>释义: 千米","example":"例句: The city is 5 kilometers away. ｜ 推导: 千 + 米 = 千米"},{"word":"centimeter","pos":"n.","detail":"构词: 构词: centi(百分之一) + meter(米)<br>释义: 厘米","example":"例句: The ruler is 30 centimeters long. ｜ 推导: 百分之一 + 米 = 厘米"},{"word":"millimeter","pos":"n.","detail":"构词: 构词: milli(千分之一) + meter(米)<br>释义: 毫米","example":"例句: Precise to millimeters. ｜ 推导: 千分之一 + 米 = 毫米"}],"extra":[]},{"id":217,"root":"pack","pronounce":"/pæk/派克","source":"中古荷兰语 pak","meaning":"打包,捆扎,包裹","mnemonic":"pack就是小学学过的单词，拼写和读音都不用变化。pack 是把东西打包、捆扎成一个包裹，所以pack就是“打包、捆扎、包裹”。","mainWords":[{"word":"pack","pos":"v.","detail":"构词: 构词: pack(捆扎)<br>释义: 打包 n.包裹","example":"例句: Pack your bags for the trip. ｜ 推导: 捆扎 = 打包,包裹"},{"word":"packet","pos":"n.","detail":"构词: 构词: pack(包) + et(小后缀)<br>释义: 小包裹","example":"例句: A packet of sugar, please. ｜ 推导: 包 + 小 = 小包,小包裹"},{"word":"package","pos":"n.","detail":"构词: 构词: pack(包) + age(名词后缀)<br>释义: 包裹 v.包装","example":"例句: The package arrived today. ｜ 推导: 包 + 名词化 = 完整的包装件"}],"extra":["packing n. 包装（构词: pack + ing）","unpack v. 拆包（构词: un + pack）"]},{"id":218,"root":"pact/pang-","pronounce":"/pækt/派克特","source":"拉丁语 pangere","meaning":"固定,敲击固定","mnemonic":"pact/pang就是拍板时的“啪”和敲钉时的“砰”声。 拍板会把事情定下，敲钉会把物体固定，所以表示固定和敲击固定。 所以pact/pang就是“固定、敲击固定”。","mainWords":[{"word":"pact","pos":"n.","detail":"构词: 构词: pact(固定的约定)<br>释义: 条约;协议","example":"例句: They signed a peace pact. ｜ 推导: 固定的约定 = 条约,协议"},{"word":"compact","pos":"a.","detail":"构词: 构词: com(加强) + pact(固定)<br>释义: 紧凑的 n.协议","example":"例句: A compact car saves space. ｜ 推导: 加强 + 固定 = 紧密压实的,紧凑的"},{"word":"impact","pos":"n.","detail":"构词: 构词: im(进入) + pact(敲击)<br>释义: 冲击;影响 v.影响","example":"例句: The policy had a major impact. ｜ 推导: 进入 + 敲击固定 = 撞击,影响"}],"extra":["impacted a. 受影响的（构词: im + pact + ed）","compactly ad. 紧凑地（构词: compact + ly）","compaction n. 压实（构词: compact + ion）","impacting v. 影响中（构词: impact + ing）"]},{"id":219,"root":"phone","pronounce":"/fəʊn/夫欧恩","source":"希腊语 φωνή","meaning":"声音","mnemonic":"phone是小学词“电话”。电话最关键的作用，是把一个人说话的声音传到远处；去掉具体设备，只保留它传递的内容，就得到“声音”。所以phone就是“声音”。","mainWords":[{"word":"phone","pos":"n.","detail":"构词: 构词: phone(声音)<br>释义: 电话","example":"例句: Answer the phone please. ｜ 推导: 声音 = 传递声音的设备,电话"},{"word":"telephone","pos":"n.","detail":"构词: 构词: tele(远) + phone(声音)<br>释义: 电话 v.打电话","example":"例句: I'll telephone you later. ｜ 推导: 远 + 声音 = 远距离传声设备,电话"},{"word":"microphone","pos":"n.","detail":"构词: 构词: micro(微小) + phone(声音)<br>释义: 麦克风","example":"例句: Speak into the microphone. ｜ 推导: 微小 + 声音 = 收集微小声音的设备"},{"word":"symphony","pos":"n.","detail":"构词: 构词: sym(共同) + phon(声音) + y<br>释义: 交响乐","example":"例句: Beethoven's Fifth Symphony. ｜ 推导: 共同 + 声音 = 多种声音和谐共鸣"}],"extra":["phonetic a. 语音的（构词: phone + tic）","phonics n. 语音学（构词: phon + ics）","saxophone n. 萨克斯管（构词: Sax + o + phone）","megaphone n. 扩音器（构词: mega(大) + phone）","headphone n. 耳机（构词: head + phone）","xylophone n. 木琴（构词: xylo(木) + phone）","phonology n. 音韵学（构词: phon + ology）","gramophone n. 留声机 (gram(记录) + o + phone","homophone n. 同音词（构词: homo(同) + phone）","francophone a. 讲法语的（构词: franco + phone）"]},{"id":220,"root":"sight/see","pronounce":"/saɪt/斯爱特；/siː/斯衣","source":"同源: vis-/vid-(看)","meaning":"看,视觉","mnemonic":"sight/see本身就是我们小学学过的see。 see 就是“看见、理解”。 所以sight/see就是“看、视觉”。","mainWords":[{"word":"see","pos":"v.","detail":"构词: 构词: see(看)<br>释义: 看见;理解","example":"例句: I see what you mean. ｜ 推导: 看 = 看见,理解"},{"word":"sight","pos":"n.","detail":"构词: 构词: sight(看的能力/结果)<br>释义: 视力;景象","example":"例句: What a beautiful sight! ｜ 推导: 看 + 名词化 = 视力,景象"},{"word":"eyesight","pos":"n.","detail":"构词: 构词: eye(眼) + sight(视力)<br>释义: 视力","example":"例句: His eyesight is failing. ｜ 推导: 眼 + 视力 = 眼睛的视力"},{"word":"sightseeing","pos":"n.","detail":"构词: 构词: sight(景象) + see + ing<br>释义: 观光","example":"例句: We went sightseeing in Paris. ｜ 推导: 景象 + 看 + 动名词 = 观光"},{"word":"foresee","pos":"v.","detail":"构词: 构词: fore(预先) + see(看)<br>释义: 预见","example":"例句: No one could foresee the crisis. ｜ 推导: 预先 + 看 = 预见"},{"word":"insight","pos":"n.","detail":"构词: 构词: in(向内) + sight(看)<br>释义: 洞察力","example":"例句: She has great insight. ｜ 推导: 向内 + 看 = 洞察力"}],"extra":["oversee v. 监督（构词: over + see）","seer n. 先知（构词: see + er）","unseen a. 看不见的（构词: un + see + n）","sightly a. 悦目的（构词: sight + ly）","hindsight n. 后见之明（构词: hind + sight）","shortsighted a. 近视的（构词: short + sight + ed）","oversight n. 疏忽;监督（构词: over + sight）","sighting n. 目击（构词: sight + ing）"]},{"id":221,"root":"sit-","pronounce":"/sɪt/西特","source":"拉丁语 sedere","meaning":"坐,位于","mnemonic":"sit是小学词“坐”。一个人坐在某个位置，就说明他处在、位于那里；由“坐下”可以自然推出“坐落、位于”。所以sit就是“坐、位于”。","mainWords":[{"word":"sit","pos":"v.","detail":"构词: 构词: sit(坐)<br>释义: 坐;坐下","example":"例句: Please sit down. ｜ 推导: 坐 = 坐下,就座"},{"word":"site","pos":"n.","detail":"构词: 构词: sit(坐) + e<br>释义: 地点;场所","example":"例句: This is a historic site. ｜ 推导: 坐 → 坐落的地方 = 地点,场所"},{"word":"situate","pos":"v.","detail":"构词: 构词: sit(坐) + u + ate(动词后缀)<br>释义: 使位于","example":"例句: The house is well situated. ｜ 推导: 坐 + 动词化 = 使坐落于,使位于"},{"word":"situation","pos":"n.","detail":"构词: 构词: sit + u + ation(名词后缀)<br>释义: 情况;处境","example":"例句: It's a difficult situation. ｜ 推导: 坐 + 名词化 = 所处的状态,处境"},{"word":"situated","pos":"a.","detail":"构词: 构词: sit + u + ated(形容词后缀)<br>释义: 位于...的","example":"例句: The town is situated by the river. ｜ 推导: 坐 + 形容词化 = 坐落在...的,位于...的"}],"extra":["sitting n. 坐着的时间（构词: sit + ting）","sitter n. 保姆;模特（构词: sit + ter）","website n. 网站（构词: web + site）","situational a. 情境的（构词: situation + al）"]},{"id":222,"root":"soph-","pronounce":"/sɒf/斯奥夫","source":"希腊语 σοφός","meaning":"智慧","mnemonic":"soph就是“搜法”。遇到问题时不断搜寻方法，再比较哪一种最合适，需要运用头脑和判断力；能找到好方法，就是有智慧。所以soph就是“智慧”。","mainWords":[{"word":"philosophy","pos":"n.","detail":"构词: 构词: philo(爱) + soph(智慧) + y<br>释义: 哲学","example":"例句: His philosophy of life is simple. ｜ 推导: 爱 + 智慧 = 爱智慧的学问,哲学"},{"word":"philosopher","pos":"n.","detail":"构词: 构词: philo + soph + er(人)<br>释义: 哲学家","example":"例句: Plato was a great philosopher. ｜ 推导: 爱智慧 + 的人 = 追求智慧的人"},{"word":"sophisticated","pos":"a.","detail":"构词: 构词: sophist(智者) + ic + ated<br>释义: 复杂的;老练的","example":"例句: She has sophisticated taste. ｜ 推导: 智者 + 化 = 变得有智慧的,老练的"},{"word":"sophomore","pos":"n.","detail":"构词: 构词: soph(智慧) + o + mōros(愚蠢)<br>释义: 大二学生","example":"例句: He is a sophomore in college. ｜ 推导: 智慧 + 愚蠢(希腊语) = 半瓶水的聪明人"}],"extra":["sophist n. 诡辩家;智者（构词: soph + ist）","sophisticate v. 使老练（构词: sophist + ic + ate）","sophistication n. 老练;复杂（构词: sophist + ic + at
